<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>定数倍の微分</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* draw() replaces the SVG contents, which would orphan a touch sequence that
     started on a child; keep hit-testing on the wrapper so the drag survives */
  .svg-container > svg { pointer-events: none; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row {
    display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem;
  }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .75rem; margin: .5rem 0; flex-wrap: wrap; }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; margin: .5rem 0 0; font-size: .88rem; }
  .legend > span { display: inline-flex; align-items: center; gap: .4rem; }
  .legend > span > i { width: 22px; height: 4px; border-radius: 2px; display: inline-block; flex: none; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>定数倍の微分</h1>
  <p class="subtitle">関数を定数倍すると接線の傾きも同じ定数倍になることを、グラフの縦の伸び縮みで確かめましょう。</p>

  <h2>基本の考え方</h2>
  <p>関数を <span id="f-k1"></span> 倍したグラフは、もとのグラフを縦に <span id="f-k2"></span> 倍に伸ばした形です。横の幅は変わらないので、傾きだけが <span id="f-k3"></span> 倍になります。</p>
  <div class="formula-box" id="f-formula"></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <p>スライダーで <span id="f-klabel"></span> を変えると、青い曲線が縦に伸び縮みして紫の曲線になります。図の点 <span id="f-Alabel"></span> をドラッグすると接点が動きます。</p>

  <div class="slider-row">
    <label><span id="lbl-k"></span> =</label>
    <input type="range" id="k-slider" min="-4" max="4" step="0.25" value="-4">
    <span class="slider-val" id="k-value">-4</span>
  </div>
  <div class="slider-row">
    <label><span id="lbl-a"></span> =</label>
    <input type="range" id="a-slider" min="-1" max="1" step="0.1" value="0.5">
    <span class="slider-val" id="a-value">0.5</span>
  </div>

  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">アニメーション</button>
  </div>

  <p class="drag-hint">図の点 A を指でドラッグしてください</p>
  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 710" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend">
    <span><i style="background:var(--c-blue)"></i><span id="lg1"></span></span>
    <span><i style="background:var(--c-purple)"></i><span id="lg2"></span></span>
    <span><i style="background:var(--c-orange)"></i><span id="lg3"></span></span>
  </div>

  <div class="live-calc" id="live-calc"></div>
  <div class="note" id="note-box"></div>

  <h2>問に答える</h2>
  <p>関数 <span id="f-quest"></span> を微分してみましょう。</p>
  <div class="anim-btn-row"><button class="btn primary" id="ans-btn">答えを表示</button></div>
  <div class="formula-box" id="answer-box" hidden></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=710;
const ox=300,oyG=270,sc=170;
const XMIN=-1.72,XMAX=1.72,YMIN=-1.53,YMAX=1.53;
const DIV=548, BARY1=605, BARY2=665, BARC=300, BARSC=16, BARMAX=195;
function px(x){return ox+x*sc;}
function pyG(y){return oyG-y*sc;}

let kVal=-4, aVal=0.5, animId=null;

function num(v){const r=parseFloat(v.toFixed(4));return Object.is(r,-0)?"0":String(r);}
function coef(k){if(k===1)return"";if(k===-1)return"-";return num(k);}
function f(x){return x*x*x;}
function fp(x){return 3*x*x;}

function init(){
  ['f-k1','f-k2','f-k3'].forEach(id=>{document.getElementById(id).innerHTML=T('k');});
  document.getElementById('f-klabel').innerHTML=T('k');
  document.getElementById('f-Alabel').innerHTML=T('\\mathrm{A}');
  document.getElementById('lbl-k').innerHTML=T('k');
  document.getElementById('lbl-a').innerHTML=T('a');
  document.getElementById('f-quest').innerHTML=T('y=-4x^3');
  document.getElementById('lg1').innerHTML=T('y=f(x)=x^3');
  document.getElementById('lg2').innerHTML=T('y=kf(x)');
  document.getElementById('lg3').innerHTML=T('\\text{接線}');
  tex("k\\text{ が定数のとき}\\quad \\{kf(x)\\}'=kf'(x)",document.getElementById('f-formula'),true);
  initWalkthrough();
  setupControls();
  draw();
}

function initWalkthrough(){
  const steps=[
    {label:'Step 1: まず具体例を定義から微分する',
     formula:'f(x)=5x^2\\ \\text{とおくと}\\quad f(x+h)=5(x+h)^2'},
    {label:'Step 2: 平均変化率をつくる',
     formula:"y'=\\lim_{h\\to0}\\dfrac{5(x+h)^2-5x^2}{h}"},
    {label:'Step 3: 分子から 5 をくくり出す',
     formula:"y'=\\lim_{h\\to0}5\\cdot\\dfrac{(x+h)^2-x^2}{h}"},
    {label:'Step 4: 分子を展開して約分する',
     formula:"y'=\\lim_{h\\to0}5\\cdot\\dfrac{h(2x+h)}{h}=\\lim_{h\\to0}5(2x+h)=5\\cdot2x"},
    {label:'Step 5: 5 は極限の外に出せた',
     formula:"(5\\cdot x^2)'=5\\cdot(x^2)'"},
    {label:'Step 6: 一般の定数 k でも同じ',
     formula:"\\{kf(x)\\}'=kf'(x)"},
    {label:'Step 7: 問の関数を k と f(x) に分ける',
     formula:'y=-4x^3\\ \\Rightarrow\\ k=-4,\\ f(x)=x^3,\\ f\'(x)=3x^2'},
    {label:'Step 8: 答え',
     formula:"y'=-4\\cdot(x^3)'=-4\\cdot3x^2=-12x^2"}
  ];
  let cur=0;
  const container=document.getElementById('walkthrough');
  const counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev');
  const nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=cur;i++){
      html+=`<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${cur+1} / ${steps.length}`;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{if(cur>0){cur--;render();}});
  nextBtn.addEventListener('click',()=>{if(cur<steps.length-1){cur++;render();}});
  render();
}

function clipSeg(x1,y1,x2,y2){
  let t0=0,t1=1;const dx=x2-x1,dy=y2-y1;
  const p=[-dx,dx,-dy,dy],q=[x1-XMIN,XMAX-x1,y1-YMIN,YMAX-y1];
  for(let i=0;i<4;i++){
    if(p[i]===0){ if(q[i]<0) return null; }
    else{
      const r=q[i]/p[i];
      if(p[i]<0){ if(r>t1) return null; if(r>t0) t0=r; }
      else { if(r<t0) return null; if(r<t1) t1=r; }
    }
  }
  return {x1:x1+t0*dx,y1:y1+t0*dy,x2:x1+t1*dx,y2:y1+t1*dy};
}

function curvePath(fn){
  let d='',pen=false;
  for(let i=0;i<=360;i++){
    const x=XMIN+(XMAX-XMIN)*i/360,y=fn(x);
    if(!isFinite(y)||y<YMIN||y>YMAX){pen=false;continue;}
    d+=(pen?'L':'M')+px(x).toFixed(1)+' '+pyG(y).toFixed(1)+' ';
    pen=true;
  }
  return d;
}

function tangentLine(x0,y0,m,color,wdt,dash){
  const seg=clipSeg(x0-5,y0-5*m,x0+5,y0+5*m);
  if(!seg) return '';
  return `<line x1="${px(seg.x1)}" y1="${pyG(seg.y1)}" x2="${px(seg.x2)}" y2="${pyG(seg.y2)}" stroke="${color}" stroke-width="${wdt}" ${dash?'stroke-dasharray="8 5"':''}/>`;
}

function draw(){
  const svg=document.getElementById('graph');
  const k=kVal,a=aVal;
  const fa=f(a),ka=k*fa,ma=fp(a),mka=k*ma;
  /* boxes of everything that moves - the letters and the dots themselves; static tick labels step aside instead of being covered */
  const busy=[[px(a)-30,pyG(fa)+9,18,16],[px(a)+12,pyG(ka)+7,18,16]];
  if(fa>=YMIN&&fa<=YMAX) busy.push([px(a)-11,pyG(fa)-11,22,22]);
  if(ka>=YMIN&&ka<=YMAX) busy.push([px(a)-15,pyG(ka)-15,30,30]);
  const hits=(x,y,w,h)=>busy.some(v=>x<v[0]+v[2]&&x+w>v[0]&&y<v[1]+v[3]&&y+h>v[1]);
  const tick=(x,y,anchor,txt)=>{
    const tw=String(txt).length*11*0.62;
    const bx=anchor==='middle'?x-tw/2:x-tw;
    if(hits(bx,y-9,tw,12)) return '';
    return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="11" fill="#aaa" stroke="#fff" stroke-width="3" paint-order="stroke">${txt}</text>`;
  };
  let s='';
  s+=`<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-purple)" opacity="0.6"/></marker></defs>`;

  for(let i=-1;i<=1;i++){
    s+=`<line x1="${px(i)}" y1="${pyG(YMAX)}" x2="${px(i)}" y2="${pyG(YMIN)}" stroke="${i===0?'#999':'#eee'}" stroke-width="${i===0?1.5:1}"/>`;
  }
  for(let i=-1.5;i<=1.5;i+=0.5){
    if(Math.abs(i-Math.round(i))<1e-9) continue;
    s+=`<line x1="${px(i)}" y1="${pyG(YMAX)}" x2="${px(i)}" y2="${pyG(YMIN)}" stroke="#f4f4f4" stroke-width="1"/>`;
  }
  for(let j=-1.5;j<=1.5;j+=0.5){
    const major=Math.abs(j-Math.round(j))<1e-9;
    s+=`<line x1="${px(XMIN)}" y1="${pyG(j)}" x2="${px(XMAX)}" y2="${pyG(j)}" stroke="${j===0?'#999':(major?'#eee':'#f4f4f4')}" stroke-width="${j===0?1.5:1}"/>`;
  }
  s+=`<line x1="0" y1="${DIV}" x2="600" y2="${DIV}" stroke="#ccc" stroke-width="1" stroke-dasharray="6 4"/>`;

  s+=`<foreignObject x="${px(XMAX)-30}" y="${pyG(0)-24}" width="26" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('x')}</div></foreignObject>`;
  s+=`<foreignObject x="${ox+6}" y="4" width="26" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('y')}</div></foreignObject>`;

  /* vertical stretch arrows: f(x) -> k f(x) at fixed sample points */
  for(const xs of [-0.9,-0.7,-0.5,-0.3,0.3,0.5,0.7,0.9]){
    const y1=f(xs),y2=k*f(xs);
    if(y1<YMIN||y1>YMAX||y2<YMIN||y2>YMAX) continue;
    if(Math.abs(pyG(y1)-pyG(y2))<6) continue;
    s+=`<line x1="${px(xs)}" y1="${pyG(y1)}" x2="${px(xs)}" y2="${pyG(y2)}" stroke="var(--c-purple)" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.55" marker-end="url(#ar)"/>`;
  }

  s+=`<path d="${curvePath(f)}" fill="none" stroke="var(--c-blue)" stroke-width="2" opacity="0.75"/>`;
  s+=`<path d="${curvePath(x=>k*f(x))}" fill="none" stroke="var(--c-purple)" stroke-width="3.5"/>`;

  s+=tangentLine(a,fa,ma,'var(--c-blue)',2,true);
  s+=tangentLine(a,ka,mka,'var(--c-orange)',3,false);

  /* tick labels come after the curves and tangents, with a white halo, so nothing is drawn across them */
  for(let i=-1;i<=1;i++){ if(i===0) continue;
    s+=tick(px(i),pyG(0)+16,'middle',i);
  }
  for(let j=-1;j<=1;j++){ if(j===0) continue;
    s+=tick(ox-8,pyG(j)+4,'end',j);
  }
  s+=tick(ox-8,pyG(0)+16,'end','O');

  if(fa>=YMIN&&fa<=YMAX){
    s+=`<circle cx="${px(a)}" cy="${pyG(fa)}" r="7" fill="var(--c-blue)" stroke="#fff" stroke-width="2.5" style="cursor:grab"/>`;
    s+=`<text x="${px(a)-13}" y="${pyG(fa)+22}" text-anchor="end" font-size="15" font-weight="700" fill="var(--c-blue)" stroke="#fff" stroke-width="3.5" paint-order="stroke">A</text>`;
  }
  if(ka>=YMIN&&ka<=YMAX){
    s+=`<circle cx="${px(a)}" cy="${pyG(ka)}" r="9" fill="var(--c-purple)" stroke="#fff" stroke-width="2.5">`;
    s+=`<animate attributeName="r" values="9;13;9" dur="1.6s" repeatCount="indefinite"/></circle>`;
    s+=`<text x="${px(a)+14}" y="${pyG(ka)+20}" text-anchor="start" font-size="15" font-weight="700" fill="var(--c-purple)" stroke="#fff" stroke-width="3.5" paint-order="stroke">B</text>`;
  }

  /* fixed slots so these never collide with the moving curve */
  s+=`<foreignObject x="8" y="8" width="230" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:var(--c-purple);font-weight:700;white-space:nowrap"><span style="display:inline-block;background:#fff;padding:0 3px">${T('y='+(k===0?'0':coef(k)+'x^3'))}</span></div></foreignObject>`;

  /* slope comparison bars */
  s+=`<text x="8" y="576" font-size="13" fill="#666" font-weight="700">接線の傾きくらべ</text>`;
  s+=`<line x1="${BARC}" y1="585" x2="${BARC}" y2="690" stroke="#bbb" stroke-width="1"/>`;
  const bl=v=>Math.max(-BARMAX,Math.min(BARMAX,v*BARSC));
  const b1=bl(ma),b2=bl(mka);
  s+=`<rect x="${BARC+Math.min(0,b1)}" y="${BARY1-11}" width="${Math.max(Math.abs(b1),1)}" height="22" fill="var(--c-blue)" opacity="0.8" rx="3"/>`;
  s+=`<rect x="${BARC+Math.min(0,b1)}" y="${BARY2-11}" width="${Math.max(Math.abs(b1),1)}" height="22" fill="var(--c-blue)" opacity="0.18" rx="3"/>`;
  s+=`<rect x="${BARC+Math.min(0,b2)}" y="${BARY2-11}" width="${Math.max(Math.abs(b2),1)}" height="22" fill="var(--c-purple)" opacity="0.85" rx="3"/>`;
  s+=`<foreignObject x="8" y="${BARY1-17}" width="92" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-blue);font-weight:700;white-space:nowrap">${T("f'(a)")}</div></foreignObject>`;
  s+=`<foreignObject x="8" y="${BARY2-17}" width="92" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-purple);font-weight:700;white-space:nowrap">${T("kf'(a)")}</div></foreignObject>`;
  s+=`<foreignObject x="${W-96}" y="${BARY1-17}" width="90" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-blue);font-weight:700;text-align:right;white-space:nowrap">${T(num(ma))}</div></foreignObject>`;
  s+=`<foreignObject x="${W-96}" y="${BARY2-17}" width="90" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-purple);font-weight:700;text-align:right;white-space:nowrap">${T(num(mka))}</div></foreignObject>`;

  svg.innerHTML=s;

  const astr=num(a),kstr=num(k);
  document.getElementById('live-calc').innerHTML=
    T(`f(x)=x^3,\\quad f'(x)=3x^2`)+'<br>'+
    T(`f'(${astr})=3\\times(${astr})^2=${num(ma)}`)+'<br>'+
    T(`\\{kf(x)\\}'\\big|_{x=${astr}}=k\\,f'(${astr})=(${kstr})\\times ${num(ma)}=${num(mka)}`);

  const nb=document.getElementById('note-box');
  if(k===0){
    nb.innerHTML='いま '+T('k=0')+' なので紫の関数は '+T('y=0')+' の定数関数です。傾きは '+T('0')+' で、'+T("0\\cdot f'(x)=0")+' と合っています。';
  } else if(k===1){
    nb.innerHTML='いま '+T('k=1')+' なので 2 つの曲線は完全に重なり、傾きも同じです。';
  } else if(k<0){
    nb.innerHTML=T('k')+' が負なので、紫の曲線は青の曲線を上下にひっくり返して '+T('|k|='+num(Math.abs(k)))+' 倍に伸ばした形です。傾きの符号も逆になります。';
  } else {
    nb.innerHTML='横の幅は変えずに縦だけ '+T(num(k))+' 倍にしたので、傾きも '+T(num(k))+' 倍になります。';
  }
}

function setA(v){
  aVal=Math.round(Math.max(-1,Math.min(1,v))*10)/10;
  const sl=document.getElementById('a-slider');
  sl.value=aVal;
  document.getElementById('a-value').textContent=num(aVal);
}

function setupControls(){
  const ks=document.getElementById('k-slider'),kv=document.getElementById('k-value');
  ks.addEventListener('input',()=>{kVal=parseFloat(ks.value);kv.textContent=num(kVal);draw();});
  const as=document.getElementById('a-slider'),av=document.getElementById('a-value');
  as.addEventListener('input',()=>{setA(parseFloat(as.value));draw();});

  document.getElementById('ans-btn').addEventListener('click',()=>{
    const box=document.getElementById('answer-box');
    if(box.hidden){
      tex("y'=(-4x^3)'=-4\\cdot(x^3)'=-4\\cdot3x^2=-12x^2",box,true);
      box.hidden=false;
      document.getElementById('ans-btn').textContent='答えを隠す';
    } else {
      box.hidden=true;
      document.getElementById('ans-btn').textContent='答えを表示';
    }
  });

  document.getElementById('anim-btn').addEventListener('click',()=>{
    if(animId){cancelAnimationFrame(animId);animId=null;}
    const startK=1,endK=-4,duration=3600;
    let startTime=null;
    function animate(ts){
      if(!startTime) startTime=ts;
      const p=Math.min((ts-startTime)/duration,1);
      const eased=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      kVal=Math.round((startK+(endK-startK)*eased)*4)/4;
      ks.value=kVal;kv.textContent=num(kVal);
      draw();
      if(p<1) animId=requestAnimationFrame(animate); else animId=null;
    }
    kVal=startK;ks.value=startK;kv.textContent=num(startK);
    animId=requestAnimationFrame(animate);
  });

  setupDrag();
}

function setupDrag(){
  const svg=document.getElementById('graph');
  const wrap=document.getElementById('svg-wrap');
  let dragging=false;
  function toMath(cx,cy){
    const rect=svg.getBoundingClientRect();
    const sx=(cx-rect.left)/rect.width*W;
    const sy=(cy-rect.top)/rect.height*H;
    return {x:(sx-ox)/sc,y:(oyG-sy)/sc,raw:sy};
  }
  function startDrag(cx,cy){
    const m=toMath(cx,cy);
    if(m.raw>DIV) return;
    dragging=true;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    setA(m.x);draw();
  }
  function moveDrag(cx,cy){const m=toMath(cx,cy);setA(m.x);draw();}
  function endDrag(){dragging=false;}
  wrap.addEventListener('mousedown',e=>{e.preventDefault();startDrag(e.clientX,e.clientY);});
  window.addEventListener('mousemove',e=>{if(dragging){e.preventDefault();moveDrag(e.clientX,e.clientY);}});
  window.addEventListener('mouseup',endDrag);
  wrap.addEventListener('touchstart',e=>{const t=e.touches[0];startDrag(t.clientX,t.clientY);},{passive:true});
  wrap.addEventListener('touchmove',e=>{if(dragging){e.preventDefault();const t=e.touches[0];moveDrag(t.clientX,t.clientY);}},{passive:false});
  wrap.addEventListener('touchend',endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
