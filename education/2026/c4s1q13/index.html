<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>指数関数のグラフの対称性</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0; }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative; }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto; }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn { appearance: none; border: 1px solid #d4dbeb; background: #fff; color: var(--accent);
    font-size: 1rem; font-weight: 600; padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  /* keep each inline formula on one line; KaTeX otherwise breaks mid-relation */
  .note .katex, .status .katex, p .katex { white-space: nowrap; }
  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px;
    padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.05rem; }

  .slider-row { display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .75rem; flex-wrap: wrap; margin: .5rem 0; }

  .table-wrap { overflow-x: auto; margin: .75rem 0; }
  .compare-table { border-collapse: collapse; background: #fff; margin: 0 auto; min-width: 100%; }
  .compare-table th, .compare-table td { border: 1px solid #e3e3e3; padding: .5rem .7rem; text-align: center; white-space: nowrap; font-size: .95rem; }
  .compare-table th { background: #f4f7ff; }
  .compare-table td.hit { background: #fff2e0; }

  .legend { display: flex; justify-content: center; gap: 1.25rem; flex-wrap: wrap; font-size: .9rem; margin: .5rem 0 0; }
  .legend span.chip { display: inline-block; width: 26px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: .4rem; }
  .legend span.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; margin-right: .4rem; }

  .status { text-align: center; font-weight: 700; margin: .5rem 0; font-size: 1rem; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>指数関数のグラフの対称性</h1>
  <p class="subtitle">すでにかいたグラフを折り返して、底が逆数の指数関数のグラフをかきましょう。</p>

  <h2>この問題</h2>
  <div class="formula-box" id="f-problem"></div>

  <h2>基本の考え方</h2>
  <p>底を 3 にそろえると、指数の符号だけが入れかわった形になります。</p>
  <div class="formula-box" id="f-key"></div>
  <p>つまり <span id="f-inline1"></span> の <span id="f-inline2"></span> を <span id="f-inline3"></span> に置きかえたものです。値の表では左右が入れかわります。</p>
  <div class="table-wrap"><table class="compare-table" id="val-table"></table></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2><span id="h2-y"></span> 軸で折り返そう</h2>
  <p>下のスライダーで点 P を動かすと、同じ高さの点 P&prime; が反対側に現れます。2 点は <span id="f-inline4"></span> 軸について対称です。</p>
  <div class="legend" id="legend"></div>
  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="slider-row">
    <label><span id="lbl-x"></span> =</label>
    <input type="range" id="x-slider" min="-2" max="2" step="0.05" value="1">
    <span class="slider-val" id="x-value">1.00</span>
  </div>
  <div class="live-calc" id="live-calc"></div>

  <h2>底を動かして折り返す</h2>
  <p>動く曲線 <span id="f-inline5"></span> の <span id="f-inline6"></span> を 1 から &minus;1 まで動かすと、グラフがそのまま <span id="f-inline7"></span> 軸で折り返されます。</p>
  <div class="slider-row">
    <label><span id="lbl-s"></span> =</label>
    <input type="range" id="s-slider" min="-1" max="1" step="0.02" value="1">
    <span class="slider-val" id="s-value">1.00</span>
  </div>
  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">アニメーション</button>
    <button class="btn" id="reset-btn">はじめに戻す</button>
  </div>
  <div class="status" id="status"></div>

  <h2>まとめ</h2>
  <div class="note" id="note1"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=520,ox=300,oy=470,sx=100,sy=45;
const XMIN=-2.4,XMAX=2.4,YMAX=9.7;
function px(x){return ox+x*sx;}
function py(y){return oy-y*sy;}

const XI=[-2,-1,0,1,2];
const R1=['\\dfrac{1}{9}','\\dfrac{1}{3}','1','3','9'];
const R2=['9','3','1','\\dfrac{1}{3}','\\dfrac{1}{9}'];

let xVal=1, sVal=1, animId=null;

function init(){
  tex('y=3^{x}\\;\\text{のグラフをもとにして、}\\;y=\\left(\\dfrac{1}{3}\\right)^{x}\\;\\text{のグラフをかけ。}',document.getElementById('f-problem'),true);
  tex('\\left(\\dfrac{1}{3}\\right)^{x}=\\left(3^{-1}\\right)^{x}=3^{-x}',document.getElementById('f-key'),true);
  document.getElementById('f-inline1').innerHTML=T('y=3^{x}');
  document.getElementById('f-inline2').innerHTML=T('x');
  document.getElementById('f-inline3').innerHTML=T('-x');
  document.getElementById('f-inline4').innerHTML=T('y');
  document.getElementById('f-inline5').innerHTML=T('y=3^{sx}');
  document.getElementById('f-inline6').innerHTML=T('s');
  document.getElementById('f-inline7').innerHTML=T('y');
  document.getElementById('h2-y').innerHTML=T('y');
  document.getElementById('lbl-x').innerHTML=T('x');
  document.getElementById('lbl-s').innerHTML=T('s');
  buildTable();
  buildLegend();
  initWalkthrough();
  setupSliders();
  setupButtons();
  document.getElementById('note1').innerHTML='一般に '+T('y=a^{x}')+' のグラフと '+T('y=\\left(\\dfrac{1}{a}\\right)^{x}')+' のグラフは '+T('y')+' 軸に関して対称です。'+T('a>1')+' なら右上がり、'+T('0<a<1')+' なら右下がりで、どちらも点 '+T('(0,\\,1)')+' を通り '+T('x')+' 軸が漸近線です。';
  draw();
}

function buildTable(){
  let h='<tr><th>'+T('x')+'</th>';
  for(let i=0;i<XI.length;i++) h+='<th>'+T(String(XI[i]))+'</th>';
  h+='</tr><tr><th>'+T('y=3^{x}')+'</th>';
  for(let i=0;i<XI.length;i++) h+='<td id="ta'+i+'">'+T(R1[i])+'</td>';
  h+='</tr><tr><th>'+T('y=\\left(\\dfrac{1}{3}\\right)^{x}')+'</th>';
  for(let i=0;i<XI.length;i++) h+='<td id="tb'+i+'">'+T(R2[i])+'</td>';
  h+='</tr>';
  document.getElementById('val-table').innerHTML=h;
}

function buildLegend(){
  document.getElementById('legend').innerHTML=
    '<span><span class="chip" style="background:var(--c-blue)"></span>'+T('y=3^{x}')+'</span>'+
    '<span><span class="chip" style="background:var(--c-red)"></span>'+T('y=\\left(\\dfrac{1}{3}\\right)^{x}')+'</span>'+
    '<span><span class="chip" style="background:var(--c-orange)"></span>'+T('y=3^{sx}')+'</span>'+
    '<span><span class="dot" style="background:var(--c-purple)"></span>'+T('(0,\\,1)')+'（共有点）</span>';
}

function initWalkthrough(){
  const steps=[
    {label:'Step 1: 底を 3 にそろえる',formula:'\\left(\\dfrac{1}{3}\\right)^{x}=\\left(3^{-1}\\right)^{x}=3^{-x}'},
    {label:'Step 2: もとのグラフの値',formula:'x=-2,-1,0,1,2\\;\\Longrightarrow\\;3^{x}=\\dfrac{1}{9},\\;\\dfrac{1}{3},\\;1,\\;3,\\;9'},
    {label:'Step 3: 表の左右が入れかわる',formula:'\\left(\\dfrac{1}{3}\\right)^{x}=9,\\;3,\\;1,\\;\\dfrac{1}{3},\\;\\dfrac{1}{9}'},
    {label:'Step 4: 点の対応',formula:'(p,q)\\;\\text{が}\\;y=3^{x}\\;\\text{上}\\iff(-p,q)\\;\\text{が}\\;y=\\left(\\dfrac{1}{3}\\right)^{x}\\;\\text{上}'},
    {label:'Step 5: 折り返す',formula:'\\text{よって }y=3^{x}\\text{ のグラフを }y\\text{ 軸に関して対称移動すればよい}'},
    {label:'Step 6: 通る点',formula:'(0,1),\\;\\left(1,\\dfrac{1}{3}\\right),\\;(-1,3),\\;\\left(2,\\dfrac{1}{9}\\right),\\;(-2,9)'},
    {label:'Step 7: 増減と漸近線',formula:'0<\\dfrac{1}{3}<1\\;\\text{より右下がりの減少関数。}x\\text{ 軸が漸近線}'},
    {label:'Step 8: 一般に',formula:'y=a^{x}\\;\\text{と}\\;y=\\left(\\dfrac{1}{a}\\right)^{x}\\;\\text{のグラフは}\\;y\\;\\text{軸に関して対称}'}
  ];
  let cur=0;
  const container=document.getElementById('walkthrough');
  const counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev');
  const nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=cur;i++){
      html+='<div class="step '+(i===cur?'current':'')+'"><div class="label">'+steps[i].label+'</div><div class="formula-line">'+T(steps[i].formula)+'</div></div>';
    }
    container.innerHTML=html;
    counter.textContent=(cur+1)+' / '+steps.length;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{if(cur>0){cur--;render();}});
  nextBtn.addEventListener('click',()=>{if(cur<steps.length-1){cur++;render();}});
  render();
}

function pathOf(f){
  let d='';
  const n=160;
  for(let i=0;i<=n;i++){
    const x=XMIN+(XMAX-XMIN)*i/n;
    const y=f(x);
    if(!isFinite(y)||y>YMAX||y<-0.05) continue;
    d+=(d===''?'M':'L')+' '+px(x).toFixed(1)+' '+py(y).toFixed(1)+' ';
  }
  return d;
}

function draw(){
  const svg=document.getElementById('graph');
  let s='';
  for(let i=-2;i<=2;i++){
    s+='<line x1="'+px(i)+'" y1="'+py(YMAX)+'" x2="'+px(i)+'" y2="'+py(-0.4)+'" stroke="'+(i===0?'#ddd':'#eee')+'" stroke-width="1"/>';
  }
  for(let j=0;j<=9;j++){
    s+='<line x1="'+px(XMIN)+'" y1="'+py(j)+'" x2="'+px(XMAX)+'" y2="'+py(j)+'" stroke="'+(j===0?'#999':'#eee')+'" stroke-width="'+(j===0?1.5:1)+'"/>';
  }
  s+='<line x1="'+px(XMIN)+'" y1="'+py(0)+'" x2="'+px(XMAX)+'" y2="'+py(0)+'" stroke="#bbb" stroke-width="2" stroke-dasharray="8 6"/>';
  s+='<line x1="'+ox+'" y1="'+py(YMAX)+'" x2="'+ox+'" y2="'+py(-0.4)+'" stroke="var(--c-purple)" stroke-width="2.5" stroke-dasharray="9 6"/>';
  s+='<foreignObject x="'+(px(XMAX)-26)+'" y="'+(oy+4)+'" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">'+T('x')+'</div></foreignObject>';
  s+='<foreignObject x="'+(ox+8)+'" y="8" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:var(--c-purple)">'+T('y')+'</div></foreignObject>';
  // tick labels are drawn last with a white halo so the curves and the moving points never hide them
  const HALO=' stroke="#fff" stroke-width="3" paint-order="stroke"';
  let tk='';
  for(let i=-2;i<=2;i++){
    if(i===0) continue;
    tk+='<text x="'+px(i)+'" y="'+(oy+18)+'" text-anchor="middle" font-size="12" fill="#aaa"'+HALO+'>'+i+'</text>';
  }
  [1,3,9].forEach(v=>{ tk+='<text x="'+(px(XMIN)+4)+'" y="'+(py(v)-4)+'" font-size="12" fill="#aaa"'+HALO+'>'+v+'</text>'; });
  tk+='<text x="'+(ox-8)+'" y="'+(oy+18)+'" text-anchor="end" font-size="12" fill="#aaa"'+HALO+'>O</text>';

  s+='<path d="'+pathOf(x=>Math.pow(3,x))+'" fill="none" stroke="var(--c-blue)" stroke-width="3"/>';
  s+='<path d="'+pathOf(x=>Math.pow(3,-x))+'" fill="none" stroke="var(--c-red)" stroke-width="3"/>';
  s+='<path d="'+pathOf(x=>Math.pow(3,sVal*x))+'" fill="none" stroke="var(--c-orange)" stroke-width="3.5" stroke-dasharray="9 6" opacity="0.95"/>';

  const y0=Math.pow(3,xVal);
  s+='<line x1="'+px(-xVal)+'" y1="'+py(y0)+'" x2="'+px(xVal)+'" y2="'+py(y0)+'" stroke="var(--c-purple)" stroke-width="1.8" stroke-dasharray="5 4"/>';
  s+='<circle cx="'+ox+'" cy="'+py(y0)+'" r="4" fill="var(--c-purple)"/>';
  s+='<circle cx="'+px(xVal)+'" cy="'+py(y0)+'" r="8" fill="var(--c-blue)" stroke="#fff" stroke-width="2.5"/>';
  s+='<circle cx="'+px(-xVal)+'" cy="'+py(y0)+'" r="8" fill="var(--c-red)" stroke="#fff" stroke-width="2.5"><animate attributeName="r" values="8;12;8" dur="1.4s" repeatCount="indefinite"/></circle>';
  const near=Math.abs(xVal)<0.15;
  s+='<text x="'+px(xVal)+'" y="'+(py(y0)-15)+'" text-anchor="middle" font-size="14" fill="var(--c-blue)" font-weight="700" stroke="#fff" stroke-width="3" paint-order="stroke">P</text>';
  s+='<text x="'+px(-xVal)+'" y="'+(py(y0)-(near?33:15))+'" text-anchor="middle" font-size="14" fill="var(--c-red)" font-weight="700" stroke="#fff" stroke-width="3" paint-order="stroke">P&#8242;</text>';
  s+='<circle cx="'+ox+'" cy="'+py(1)+'" r="6" fill="var(--c-purple)" stroke="#fff" stroke-width="2"/>';

  svg.innerHTML=s+tk;
  updateLive();
  updateStatus();
}

function fmt(v){ return (Math.abs(v)<0.005?0:v).toFixed(2); }

function updateLive(){
  const y0=Math.pow(3,xVal);
  const a=fmt(xVal), b=fmt(-xVal);
  let html=T('\\mathrm{P}('+a+',\\;'+y0.toFixed(3)+')\\quad\\text{は}\\quad y=3^{x}\\;\\text{上}')+'<br>'+
    T('\\mathrm{P}^{\\prime}('+b+',\\;'+y0.toFixed(3)+')\\quad\\text{は}\\quad y=\\left(\\dfrac{1}{3}\\right)^{x}\\;\\text{上}')+'<br>'+
    '<span style="color:var(--c-purple);font-weight:600">'+T('\\left(\\dfrac{1}{3}\\right)^{'+b+'}=3^{'+a+'}='+y0.toFixed(3))+'</span>';
  document.getElementById('live-calc').innerHTML=html;
  for(let i=0;i<XI.length;i++){
    const on=Math.abs(XI[i]-xVal)<0.03;
    document.getElementById('ta'+i).className=on?'hit':'';
    document.getElementById('tb'+i).className=(Math.abs(XI[i]+xVal)<0.03)?'hit':'';
  }
}

function updateStatus(){
  const el=document.getElementById('status');
  const a=Math.pow(3,sVal);
  let msg;
  if(Math.abs(sVal-1)<0.01) msg='<span style="color:var(--c-blue)">'+T('s=1')+' のとき '+T('y=3^{x}')+'（もとのグラフに重なる）</span>';
  else if(Math.abs(sVal+1)<0.01) msg='<span style="color:var(--c-red)">'+T('s=-1')+' のとき '+T('y=3^{-x}=\\left(\\dfrac{1}{3}\\right)^{x}')+'（答えのグラフに重なる）</span>';
  else if(Math.abs(sVal)<0.01) msg='<span style="color:var(--muted)">'+T('s=0')+' のとき '+T('y=1')+'（底が 1 で定数関数）</span>';
  else if(sVal>0) msg='<span style="color:var(--c-orange)">底 '+T('a=3^{s}='+a.toFixed(3))+'　'+T('a>1')+' なので右上がり</span>';
  else msg='<span style="color:var(--c-orange)">底 '+T('a=3^{s}='+a.toFixed(3))+'　'+T('0<a<1')+' なので右下がり</span>';
  el.innerHTML=msg;
}

function setupSliders(){
  const xs=document.getElementById('x-slider'), xv=document.getElementById('x-value');
  xs.addEventListener('input',()=>{ xVal=parseFloat(xs.value); xv.textContent=fmt(xVal); draw(); });
  xv.textContent=fmt(xVal);
  const ss=document.getElementById('s-slider'), sv=document.getElementById('s-value');
  ss.addEventListener('input',()=>{
    if(animId){cancelAnimationFrame(animId);animId=null;document.getElementById('anim-btn').disabled=false;}
    sVal=parseFloat(ss.value); sv.textContent=fmt(sVal); draw();
  });
  sv.textContent=fmt(sVal);
}

function setupButtons(){
  const ab=document.getElementById('anim-btn');
  const ss=document.getElementById('s-slider'), sv=document.getElementById('s-value');
  ab.addEventListener('click',()=>{
    if(animId){cancelAnimationFrame(animId);animId=null;}
    ab.disabled=true;
    const from=1,to=-1,dur=2600;
    let t0=null;
    function step(ts){
      if(!t0) t0=ts;
      const p=Math.min((ts-t0)/dur,1);
      const e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      sVal=from+(to-from)*e;
      ss.value=sVal; sv.textContent=fmt(sVal); draw();
      if(p<1) animId=requestAnimationFrame(step);
      else { animId=null; ab.disabled=false; }
    }
    animId=requestAnimationFrame(step);
  });
  document.getElementById('reset-btn').addEventListener('click',()=>{
    if(animId){cancelAnimationFrame(animId);animId=null;ab.disabled=false;}
    sVal=1; ss.value=1; sv.textContent=fmt(1); draw();
  });
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
</body>
