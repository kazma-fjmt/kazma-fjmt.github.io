<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>累乗根の性質の証明</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0; }
  .formula-box .katex { font-size: 1.2rem; }
  .formula-box.key { background: #f0f5ff; border-color: #c9dcff; }

  .svg-container { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative; }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto; }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn { appearance: none; border: 1px solid #d4dbeb; background: #fff; color: var(--accent);
    font-size: 1rem; font-weight: 600; padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px;
    padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.05rem; }

  .slider-row { display: flex; align-items: center; gap: 1rem; margin: .5rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .5rem 1.25rem; }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; min-width: 2.2rem; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3rem; text-align: center; }

  .tabs { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0; }
  .tab { appearance: none; border: 1px solid #d4dbeb; background: #fff; color: var(--accent);
    font-size: 1rem; font-weight: 600; padding: .6rem 1rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 120px; font-family: inherit; user-select: none; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; justify-content: center;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .6rem 1rem; margin: .75rem 0; font-size: .9rem; }
  .legend span.sw { display: inline-block; width: 22px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: .4rem; }
  .legend span.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; margin-right: .4rem; }

  .anim-btn-row { display: flex; justify-content: center; gap: .75rem; margin: .5rem 0; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>累乗根の性質の証明</h1>
  <p class="subtitle">「正であること」と「何乗すると戻ること」を確かめる、という証明の型をなぞりましょう。</p>

  <h2>証明の土台</h2>
  <p><span id="f-cond"></span> のとき、<span id="f-r"></span> は <span id="f-a1"></span> のただ 1 つの正の <span id="f-n1"></span> 乗根です。つまり次の 2 つが成り立ちます。</p>
  <div class="formula-box" id="f-base"></div>
  <p>正の <span id="f-n2"></span> 乗根はただ 1 つしかないので、逆に次がいえます。証明はすべてこの型で進みます。</p>
  <div class="formula-box key" id="f-key"></div>

  <h2>手本：性質①の証明</h2>
  <div class="walkthrough" id="wt1"></div>
  <div class="controls-row">
    <button class="btn" id="prev1" disabled>&larr; 戻る</button>
    <span class="step-counter" id="cnt1"></span>
    <button class="btn primary" id="next1">次へ &rarr;</button>
  </div>

  <h2>性質③・④を証明しよう</h2>
  <div class="tabs" id="prop-tabs"></div>
  <div class="walkthrough" id="wt2"></div>
  <div class="controls-row">
    <button class="btn" id="prev2" disabled>&larr; 戻る</button>
    <span class="step-counter" id="cnt2"></span>
    <button class="btn primary" id="next2">次へ &rarr;</button>
  </div>

  <h2>何乗すると戻るかを見よう</h2>
  <p><span id="f-p"></span> を 1 回ずつかけていくと、ちょうど目標の値に着地します。これが証明の 2 つめの条件そのものです。</p>
  <div class="slider-row"><label><span id="lbl-a"></span> =</label>
    <input type="range" id="a-slider" min="0.5" max="3" step="0.1" value="2"><span class="slider-val" id="a-value">2.0</span></div>
  <div class="slider-row"><label><span id="lbl-m"></span> =</label>
    <input type="range" id="m-slider" min="2" max="4" step="1" value="2"><span class="slider-val" id="m-value">2</span></div>
  <div class="slider-row"><label><span id="lbl-n"></span> =</label>
    <input type="range" id="n-slider" min="2" max="4" step="1" value="3"><span class="slider-val" id="n-value">3</span></div>
  <div class="anim-btn-row"><button class="btn primary" id="anim-btn">アニメーション</button></div>
  <div class="svg-container" id="svg-wrap">
    <svg id="ladder" viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <p class="drag-hint">図を左右にドラッグすると、かける回数を自由に動かせます。</p>
  <div class="legend" id="legend"></div>
  <div class="live-calc" id="live-calc"></div>
  <div class="note" id="note-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=420,PL=70,PR=30,PT=30,PB=60;
let prop=3, aVal=2, mVal=2, nVal=3, tPos=0, animId=null, dragging=false;

function K(){return prop===3?nVal:mVal*nVal;}
function base(){return prop===3?Math.pow(aVal,mVal/nVal):Math.pow(aVal,1/(mVal*nVal));}
function target(){return prop===3?Math.pow(aVal,mVal):aVal;}
function topOf(){return Math.max(1,base(),target())*1.2;}
function X(t){return PL+(W-PL-PR)*t/K();}
function Y(v){return (H-PB)-(v/topOf())*(H-PB-PT);}
function fmt(v){
  if(Math.abs(v-Math.round(v))<1e-9) return String(Math.round(v));
  return Math.abs(v)<10?v.toFixed(3):v.toFixed(2);
}
function niceStep(v){
  const e=Math.pow(10,Math.floor(Math.log10(Math.max(v,1e-9))));
  const f=v/e; let s;
  if(f<1.5)s=1; else if(f<3.5)s=2; else if(f<7.5)s=5; else s=10;
  return s*e;
}

const STEPS1=[
  {label:'Step 1: 示したい式',formula:'\\sqrt[n]{a}\\,\\sqrt[n]{b}=\\sqrt[n]{ab}\\qquad(a>0,\\;b>0)'},
  {label:'Step 2: 左辺を P とおく',formula:'P=\\sqrt[n]{a}\\,\\sqrt[n]{b}'},
  {label:'Step 3: P を n 乗する',formula:'P^{n}=\\left(\\sqrt[n]{a}\\,\\sqrt[n]{b}\\right)^{n}=\\left(\\sqrt[n]{a}\\right)^{n}\\left(\\sqrt[n]{b}\\right)^{n}=ab'},
  {label:'Step 4: P が正であることを言う',formula:'\\sqrt[n]{a}>0,\\;\\sqrt[n]{b}>0\\;\\text{だから}\\;P>0'},
  {label:'Step 5: 結論',formula:'P\\;\\text{は}\\;ab\\;\\text{の正の}\\;n\\;\\text{乗根だから}\\;P=\\sqrt[n]{ab}'}
];
const STEPS3=[
  {label:'Step 1: 示したい式',formula:'\\left(\\sqrt[n]{a}\\right)^{m}=\\sqrt[n]{a^{m}}\\qquad(a>0)'},
  {label:'Step 2: 左辺を P とおく',formula:'P=\\left(\\sqrt[n]{a}\\right)^{m}'},
  {label:'Step 3: P を n 乗する',formula:'P^{n}=\\left\\{\\left(\\sqrt[n]{a}\\right)^{m}\\right\\}^{n}=\\left\\{\\left(\\sqrt[n]{a}\\right)^{n}\\right\\}^{m}'},
  {label:'Step 4: 中身が a に戻る',formula:'\\left(\\sqrt[n]{a}\\right)^{n}=a\\;\\text{だから}\\;P^{n}=a^{m}'},
  {label:'Step 5: P が正であることを言う',formula:'\\sqrt[n]{a}>0\\;\\text{だから}\\;P=\\left(\\sqrt[n]{a}\\right)^{m}>0'},
  {label:'Step 6: 結論',formula:'P\\;\\text{は}\\;a^{m}\\;\\text{の正の}\\;n\\;\\text{乗根だから}\\;P=\\sqrt[n]{a^{m}}'}
];
const STEPS4=[
  {label:'Step 1: 示したい式',formula:'\\sqrt[m]{\\sqrt[n]{a}}=\\sqrt[mn]{a}\\qquad(a>0)'},
  {label:'Step 2: 左辺を P とおく',formula:'P=\\sqrt[m]{\\sqrt[n]{a}}'},
  {label:'Step 3: まず m 乗する',formula:'P^{m}=\\left(\\sqrt[m]{\\sqrt[n]{a}}\\right)^{m}=\\sqrt[n]{a}'},
  {label:'Step 4: 続けて n 乗する',formula:'P^{mn}=\\left(P^{m}\\right)^{n}=\\left(\\sqrt[n]{a}\\right)^{n}=a'},
  {label:'Step 5: P が正であることを言う',formula:'\\sqrt[n]{a}>0\\;\\text{で、その}\\;m\\;\\text{乗根}\\;P\\;\\text{も正}'},
  {label:'Step 6: 結論',formula:'P\\;\\text{は}\\;a\\;\\text{の正の}\\;mn\\;\\text{乗根だから}\\;P=\\sqrt[mn]{a}'}
];

function init(){
  document.getElementById('f-cond').innerHTML=T('a>0');
  document.getElementById('f-r').innerHTML=T('\\sqrt[n]{a}');
  document.getElementById('f-a1').innerHTML=T('a');
  document.getElementById('f-n1').innerHTML=T('n');
  document.getElementById('f-n2').innerHTML=T('n');
  document.getElementById('f-p').innerHTML=T('P');
  document.getElementById('lbl-a').innerHTML=T('a');
  document.getElementById('lbl-m').innerHTML=T('m');
  document.getElementById('lbl-n').innerHTML=T('n');
  tex('\\left(\\sqrt[n]{a}\\right)^{n}=a,\\qquad \\sqrt[n]{a}>0',document.getElementById('f-base'),true);
  tex('P>0\\;\\text{かつ}\\;P^{n}=A\\quad\\Longrightarrow\\quad P=\\sqrt[n]{A}\\qquad(A>0)',document.getElementById('f-key'),true);
  document.getElementById('legend').innerHTML=
    '<span><span class="sw" style="background:var(--c-blue)"></span>'+T('y=P^{k}')+'</span>'+
    '<span><span class="dot" style="background:var(--c-orange)"></span>'+T('k')+' 回かけた値</span>'+
    '<span><span class="sw" style="background:var(--c-green)"></span>目標の値</span>';
  tex('\\text{どちらの証明でも、}P>0\\;\\text{を言い忘れると「正の}\\;n\\;\\text{乗根」と断定できない。}',
      document.getElementById('note-box'),false);
  buildTabs();
  makeWalk('wt1','cnt1','prev1','next1',()=>STEPS1);
  wt2=makeWalk('wt2','cnt2','prev2','next2',()=>prop===3?STEPS3:STEPS4);
  setupSliders(); setupAnim(); setupDrag(); draw();
}

let wt2=null;

function buildTabs(){
  const box=document.getElementById('prop-tabs');
  box.innerHTML='<button class="tab active" data-p="3">性質③</button><button class="tab" data-p="4">性質④</button>';
  box.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
    prop=parseInt(b.dataset.p,10); stopAnim(); tPos=0;
    box.querySelectorAll('.tab').forEach(o=>o.classList.remove('active'));
    b.classList.add('active');
    if(wt2) wt2.reset();
    draw();
  }));
}

function makeWalk(cid,nid,pid,xid,getSteps){
  let cur=0;
  const container=document.getElementById(cid);
  const counter=document.getElementById(nid);
  const prevBtn=document.getElementById(pid);
  const nextBtn=document.getElementById(xid);
  function render(){
    const steps=getSteps();
    if(cur>steps.length-1) cur=steps.length-1;
    let html='';
    for(let i=0;i<=cur;i++){
      html+='<div class="step '+(i===cur?'current':'')+'"><div class="label">'+steps[i].label+'</div><div class="formula-line">'+T(steps[i].formula)+'</div></div>';
    }
    container.innerHTML=html;
    counter.textContent=(cur+1)+' / '+steps.length;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{if(cur>0){cur--;render();}});
  nextBtn.addEventListener('click',()=>{if(cur<getSteps().length-1){cur++;render();}});
  render();
  return {reset(){cur=0;render();},render:render};
}

function draw(){
  const P=base(),Tg=target(),top=topOf(),KK=K();
  let s='';
  const ys=niceStep(top/4);
  for(let k=0;k*ys<=top+1e-9;k++){
    const Yv=Y(k*ys);
    s+='<line x1="'+PL+'" y1="'+Yv+'" x2="'+(W-PR)+'" y2="'+Yv+'" stroke="'+(k===0?'#999':'#f0f0f0')+'" stroke-width="'+(k===0?1.5:1)+'"/>';
    s+='<text x="'+(PL-8)+'" y="'+(Yv+4)+'" text-anchor="end" font-size="11" fill="#aaa">'+fmtE(k*ys)+'</text>';
  }
  s+='<line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(H-PB)+'" stroke="#999" stroke-width="1.5"/>';

  let d='';
  for(let i=0;i<=240;i++){
    const t=KK*i/240, v=Math.pow(P,t);
    d+=(i===0?'M ':' L ')+X(t).toFixed(2)+' '+Y(v).toFixed(2);
  }
  s+='<path d="'+d+'" fill="none" stroke="var(--c-blue)" stroke-width="2" opacity="0.55"/>';

  const gY=Y(Tg);
  s+='<line x1="'+PL+'" y1="'+gY+'" x2="'+(W-PR)+'" y2="'+gY+'" stroke="var(--c-green)" stroke-width="2.5" stroke-dasharray="9 5"/>';
  s+='<text x="'+(W-PR)+'" y="'+(gY-8)+'" text-anchor="end" font-size="13" font-weight="700" fill="var(--c-green)" stroke="#fff" stroke-width="3.5" paint-order="stroke">'+fmtE(Tg)+'</text>';

  for(let k=0;k<=KK;k++){
    const v=Math.pow(P,k), on=k<=tPos+1e-9;
    const col=(prop===4&&k===mVal&&k<KK)?'var(--c-purple)':'var(--c-orange)';
    s+='<circle cx="'+X(k)+'" cy="'+Y(v)+'" r="'+(on?6:4)+'" fill="'+(on?col:'#fff')+'" stroke="'+col+'" stroke-width="2"/>';
    s+='<text x="'+X(k)+'" y="'+(H-PB+20)+'" text-anchor="middle" font-size="11" fill="#aaa">'+k+'</text>';
  }
  const cv=Math.pow(P,tPos);
  s+='<circle cx="'+X(tPos)+'" cy="'+Y(cv)+'" r="9" fill="var(--c-orange)" stroke="#fff" stroke-width="2.5"/>';
  if(Math.abs(tPos-KK)<1e-6){
    s+='<circle cx="'+X(KK)+'" cy="'+Y(Tg)+'" r="9" fill="none" stroke="var(--c-green)" stroke-width="3"><animate attributeName="r" values="9;18;9" dur="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/></circle>';
  }
  s+='<text x="'+((PL+W-PR)/2)+'" y="'+(H-14)+'" text-anchor="middle" font-size="12" fill="#888">かけた回数</text>';
  s+='<foreignObject x="'+(PL+6)+'" y="'+(PT-14)+'" width="30" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#999">'+T('y')+'</div></foreignObject>';
  s+='<foreignObject x="'+(W-PR-34)+'" y="'+(H-PB+22)+'" width="30" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#999">'+T('k')+'</div></foreignObject>';
  document.getElementById('ladder').innerHTML=s;
  updateCalc();
}

function fmtE(v){return String(parseFloat(v.toPrecision(12)));}
function rel(v){return Math.abs(v-parseFloat(fmt(v)))<1e-9?'=':'\\approx';}
function rt(idx,inner){return idx===2?'\\sqrt{'+inner+'}':'\\sqrt['+idx+']{'+inner+'}';}

function updateCalc(){
  const A=fmtE(aVal),P=base(),Tg=target(),KK=K();
  let l1,l2,l3;
  if(prop===3){
    l1=T('P=\\left('+rt(nVal,A)+'\\right)^{'+mVal+'}'+rel(P)+fmt(P));
    l2=T('P^{'+nVal+'}='+A+'^{'+mVal+'}='+fmtE(Tg));
    l3=T(rt(nVal,A+'^{'+mVal+'}')+'='+rt(nVal,fmtE(Tg))+rel(P)+fmt(P));
  }else{
    l1=T('P='+rt(mVal,rt(nVal,A))+rel(P)+fmt(P));
    l2=T('P^{'+mVal+'\\times'+nVal+'}=P^{'+KK+'}='+fmtE(Tg));
    l3=T(rt(KK,A)+rel(P)+fmt(P));
  }
  const done=Math.abs(tPos-KK)<1e-6;
  const cv=Math.pow(P,tPos);
  const mark=done?'<span style="color:var(--c-green);font-weight:700">'+KK+' 回かけて目標の値 '+fmtE(Tg)+' にぴったり着地</span>'
                 :'<span style="color:var(--muted)">いま '+T('k='+fmt(tPos))+' の位置：'+T('P^{k}'+rel(cv)+fmt(cv))+'</span>';
  document.getElementById('live-calc').innerHTML=
    '<span style="color:var(--c-orange);font-weight:600">'+T('P>0')+' を満たしている</span><br>'+l1+'<br>'+l2+'<br>'+l3+'<br>'+mark;
}

function setupSliders(){
  const a=document.getElementById('a-slider'),m=document.getElementById('m-slider'),n=document.getElementById('n-slider');
  a.addEventListener('input',()=>{stopAnim();aVal=parseFloat(a.value);document.getElementById('a-value').textContent=aVal.toFixed(1);draw();});
  m.addEventListener('input',()=>{stopAnim();mVal=parseInt(m.value,10);document.getElementById('m-value').textContent=String(mVal);tPos=Math.min(tPos,K());draw();});
  n.addEventListener('input',()=>{stopAnim();nVal=parseInt(n.value,10);document.getElementById('n-value').textContent=String(nVal);tPos=Math.min(tPos,K());draw();});
}

function stopAnim(){ if(animId){cancelAnimationFrame(animId);animId=null;} }

function setupAnim(){
  document.getElementById('anim-btn').addEventListener('click',()=>{
    stopAnim(); tPos=0;
    let start=null; const dur=2600, KK=K();
    function frame(ts){
      if(!start) start=ts;
      const p=Math.min((ts-start)/dur,1);
      const e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      tPos=e*KK; draw();
      if(p<1) animId=requestAnimationFrame(frame);
      else{animId=null;tPos=KK;draw();}
    }
    animId=requestAnimationFrame(frame);
  });
}

function setupDrag(){
  const wrap=document.getElementById('svg-wrap');
  function toT(cx){
    const rect=wrap.getBoundingClientRect();
    const sx=(cx-rect.left)/rect.width*W;
    return Math.max(0,Math.min(K(),(sx-PL)/(W-PL-PR)*K()));
  }
  function startDrag(cx){stopAnim();dragging=true;tPos=toT(cx);draw();}
  function moveDrag(cx){tPos=toT(cx);draw();}
  function endDrag(){dragging=false;}
  wrap.addEventListener('mousedown',e=>{e.preventDefault();startDrag(e.clientX);});
  window.addEventListener('mousemove',e=>{if(dragging){e.preventDefault();moveDrag(e.clientX);}});
  window.addEventListener('mouseup',endDrag);
  wrap.addEventListener('touchstart',e=>{const t=e.touches[0];startDrag(t.clientX);},{passive:true});
  wrap.addEventListener('touchmove',e=>{if(dragging){e.preventDefault();const t=e.touches[0];moveDrag(t.clientX);}},{passive:false});
  wrap.addEventListener('touchend',endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
</body>
