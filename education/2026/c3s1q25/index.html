<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>角の置き換えによる三角方程式</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; gap: .5rem; margin: .75rem 0; flex-wrap: wrap; }
  .tab {
    appearance: none; border: 1px solid #d4dbeb; background: #fff; color: var(--accent);
    font-size: .95rem; font-weight: 600; padding: .7rem 1rem; border-radius: 10px;
    cursor: pointer; min-height: 48px; flex: 1; min-width: 130px; font-family: inherit;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }

  .slider-row {
    display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem;
  }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.05rem; font-weight: 700; color: var(--accent); min-width: 4.5rem; text-align: center; }
  .anim-btn-row { display: flex; justify-content: center; gap: .5rem; margin: .5rem 0; flex-wrap: wrap; }
  .hit { color: var(--c-orange); font-weight: 700; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>角の置き換えによる三角方程式</h1>
  <p class="subtitle">かっこの中をひとまとまりの角と見て、範囲ごとずらして解きましょう。</p>

  <h2>基本の考え方</h2>
  <p>かっこの中の角を <span id="f-t"></span> とおくと、方程式は単位円で解ける形になります。このとき <span id="f-th"></span> の動く範囲も同じだけずれることが決め手です。</p>
  <div class="formula-box" id="f-idea"></div>
  <div class="note" id="note-idea"></div>

  <h2>解法ウォークスルー</h2>
  <p>下のタブをタップして問題を切り替えると、ウォークスルーも図も連動して変わります。</p>
  <div class="tabs" id="tabs"></div>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <p>スライダーで <span id="f-th2"></span> を動かすと、青い動径が <span id="f-th3"></span>、オレンジの動径が <span id="f-t2"></span> を表します。オレンジの点が目盛り線に乗った瞬間が解です。「解 1 へ」「解 2 へ」をタップすると、その位置まで動径が動きます。</p>

  <div class="slider-row">
    <label><span id="lbl-th"></span> =</label>
    <input type="range" id="th-slider" min="0" max="6.28318" step="0.002" value="0">
    <span class="slider-val" id="th-value">0.00</span>
  </div>
  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">アニメーション</button>
    <button class="btn" id="jump1">解 1 へ</button>
    <button class="btn" id="jump2">解 2 へ</button>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 -12 600 652" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="live-calc" id="live-calc"></div>
  <div class="formula-box" id="result-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const PI = Math.PI, TAU = 2*Math.PI;
const W = 600;
const CX = 300, CY = 190, R = 150;
const GX0 = 60, GX1 = 560, GY = 490, GA = 90;

const PROBLEMS = [
  {
    tab: '例題',
    fname: 'sin', shift: PI/4, c: 0.5,
    eq: '\\sin\\left(\\theta+\\dfrac{\\pi}{4}\\right)=\\dfrac{1}{2}',
    sTex: '+\\dfrac{\\pi}{4}', sBack: '-\\dfrac{\\pi}{4}',
    cTex: '\\dfrac{1}{2}',
    rangeTex: '\\dfrac{\\pi}{4}\\le t<\\dfrac{9}{4}\\pi',
    tSolTex: 't=\\dfrac{5}{6}\\pi,\\;\\dfrac{13}{6}\\pi',
    tSol: [5*PI/6, 13*PI/6],
    ansTex: '\\theta=\\dfrac{7}{12}\\pi,\\;\\dfrac{23}{12}\\pi',
    ans: [7*PI/12, 23*PI/12],
    ansLbl: ['\\dfrac{7}{12}\\pi', '\\dfrac{23}{12}\\pi'],
    basicTex: '\\sin t=\\dfrac{1}{2}\\;\\Rightarrow\\; t=\\dfrac{\\pi}{6},\\;\\dfrac{5}{6}\\pi\\;(+2n\\pi)'
  },
  {
    tab: '問 (1)',
    fname: 'cos', shift: PI/3, c: Math.sqrt(3)/2,
    eq: '\\cos\\left(\\theta+\\dfrac{\\pi}{3}\\right)=\\dfrac{\\sqrt{3}}{2}',
    sTex: '+\\dfrac{\\pi}{3}', sBack: '-\\dfrac{\\pi}{3}',
    cTex: '\\dfrac{\\sqrt{3}}{2}',
    rangeTex: '\\dfrac{\\pi}{3}\\le t<\\dfrac{7}{3}\\pi',
    tSolTex: 't=\\dfrac{11}{6}\\pi,\\;\\dfrac{13}{6}\\pi',
    tSol: [11*PI/6, 13*PI/6],
    ansTex: '\\theta=\\dfrac{3}{2}\\pi,\\;\\dfrac{11}{6}\\pi',
    ans: [3*PI/2, 11*PI/6],
    ansLbl: ['\\dfrac{3}{2}\\pi', '\\dfrac{11}{6}\\pi'],
    basicTex: '\\cos t=\\dfrac{\\sqrt{3}}{2}\\;\\Rightarrow\\; t=\\dfrac{\\pi}{6},\\;\\dfrac{11}{6}\\pi\\;(+2n\\pi)'
  },
  {
    tab: '問 (2)',
    fname: 'sin', shift: -3*PI/4, c: -0.5,
    eq: '\\sin\\left(\\theta-\\dfrac{3}{4}\\pi\\right)=-\\dfrac{1}{2}',
    sTex: '-\\dfrac{3}{4}\\pi', sBack: '+\\dfrac{3}{4}\\pi',
    cTex: '-\\dfrac{1}{2}',
    rangeTex: '-\\dfrac{3}{4}\\pi\\le t<\\dfrac{5}{4}\\pi',
    tSolTex: 't=-\\dfrac{\\pi}{6},\\;\\dfrac{7}{6}\\pi',
    tSol: [-PI/6, 7*PI/6],
    ansTex: '\\theta=\\dfrac{7}{12}\\pi,\\;\\dfrac{23}{12}\\pi',
    ans: [7*PI/12, 23*PI/12],
    ansLbl: ['\\dfrac{7}{12}\\pi', '\\dfrac{23}{12}\\pi'],
    basicTex: '\\sin t=-\\dfrac{1}{2}\\;\\Rightarrow\\; t=\\dfrac{7}{6}\\pi,\\;\\dfrac{11}{6}\\pi\\;(+2n\\pi)'
  }
];

let cur = 0, curStep = 0, thVal = 0, animId = null;
function P(){ return PROBLEMS[cur]; }
function fv(p, t){ return p.fname === 'sin' ? Math.sin(t) : Math.cos(t); }
function fTex(p, inner){ return (p.fname === 'sin' ? '\\sin' : '\\cos') + ' ' + inner; }

function init(){
  document.getElementById('f-t').innerHTML = T('t');
  document.getElementById('f-t2').innerHTML = T('t=\\theta+\\alpha');
  document.getElementById('f-th').innerHTML = T('t');
  document.getElementById('f-th2').innerHTML = T('\\theta');
  document.getElementById('f-th3').innerHTML = T('\\theta');
  document.getElementById('lbl-th').innerHTML = T('\\theta');

  tex('t=\\theta+\\alpha\\quad\\Longrightarrow\\quad 0\\le\\theta<2\\pi\\;\\text{ のとき }\\;\\alpha\\le t<2\\pi+\\alpha', document.getElementById('f-idea'), true);
  document.getElementById('note-idea').innerHTML =
    '<strong>手順は 3 つ：</strong><br>' +
    '1. かっこの中を ' + T('t') + ' とおき、' + T('t') + ' の動く範囲を求める<br>' +
    '2. その範囲の中で単位円から ' + T('t') + ' をすべて拾う（1 周ぶんの幅なので、ふつう 2 個）<br>' +
    '3. ' + T('\\theta=t-\\alpha') + ' で元に戻す';

  buildTabs();
  setupSlider();
  setupButtons();
  renderProblem();
}

function buildTabs(){
  const box = document.getElementById('tabs');
  box.innerHTML = '';
  PROBLEMS.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === cur ? ' active' : '');
    b.textContent = p.tab;
    b.addEventListener('click', () => { cur = i; curStep = 0; thVal = 0; stopAnim();
      document.getElementById('th-slider').value = 0; buildTabs(); renderProblem(); });
    box.appendChild(b);
  });
}

function steps(){
  const p = P();
  return [
    { label: 'Step 1: 解く方程式', formula: p.eq + '\\quad(0\\le\\theta<2\\pi)' },
    { label: 'Step 2: かっこの中を置き換える', formula: 't=\\theta' + p.sTex + '\\quad\\text{とおく}' },
    { label: 'Step 3: 置き換えた角の範囲', formula: '0\\le\\theta<2\\pi\\;\\Longrightarrow\\;' + p.rangeTex },
    { label: 'Step 4: 置き換えた方程式', formula: fTex(p, 't') + '=' + p.cTex },
    { label: 'Step 5: 単位円で基本の角を読む', formula: p.basicTex },
    { label: 'Step 6: 範囲内のものだけを残す', formula: p.rangeTex + '\\;\\text{ より }\\;' + p.tSolTex },
    { label: 'Step 7: もとの角に戻す', formula: '\\theta=t' + p.sBack + '\\;\\Longrightarrow\\;' + p.ansTex },
    { label: 'Step 8: 答え', formula: p.ansTex }
  ];
}

function renderProblem(){
  const p = P();
  tex('\\text{答え：}' + p.ansTex, document.getElementById('result-box'), true);
  renderSteps();
  draw();
}

function renderSteps(){
  const st = steps();
  if(curStep > st.length - 1) curStep = st.length - 1;
  let html = '';
  for(let i = 0; i <= curStep; i++){
    html += '<div class="step ' + (i === curStep ? 'current' : '') + '"><div class="label">' +
      st[i].label + '</div><div class="formula-line">' + T(st[i].formula) + '</div></div>';
  }
  document.getElementById('walkthrough').innerHTML = html;
  document.getElementById('counter').textContent = (curStep + 1) + ' / ' + st.length;
  document.getElementById('prev').disabled = curStep === 0;
  document.getElementById('next').disabled = curStep === st.length - 1;
}

function ptx(a){ return CX + R*Math.cos(a); }
function pty(a){ return CY - R*Math.sin(a); }

function sector(r, a1, a2){
  const x1 = CX + r*Math.cos(a1), y1 = CY - r*Math.sin(a1);
  const x2 = CX + r*Math.cos(a2), y2 = CY - r*Math.sin(a2);
  const d = a2 - a1;
  return 'M ' + CX + ' ' + CY + ' L ' + x1 + ' ' + y1 + ' A ' + r + ' ' + r + ' 0 ' +
    (Math.abs(d) > PI ? 1 : 0) + ' ' + (d > 0 ? 0 : 1) + ' ' + x2 + ' ' + y2 + ' Z';
}

/* --- label collision bookkeeping (SVG user units) --- */
let LBOX = [];
function keep(x, y, w, h){ LBOX.push([x, y, x+w, y+h]); return [x, y]; }
function busy(x, y, w, h){
  return LBOX.some(function(b){ return x < b[2]-2 && x+w > b[0]+2 && y < b[3]-2 && y+h > b[1]+2; });
}
/* place a small label near (ax, ay), trying offsets until a free slot is found */
function place(ax, ay, w, h){
  const cand = [[13,-h-2],[-w-13,-h-2],[13,4],[-w-13,4],[-w/2,-h-14],[-w/2,16],[19,-h/2],[-w-19,-h/2]];
  for(let i = 0; i < cand.length; i++){
    const x = Math.max(2, Math.min(ax + cand[i][0], W-w-2)), y = ay + cand[i][1];
    if(!busy(x, y, w, h)) return keep(x, y, w, h);
  }
  return keep(Math.max(2, Math.min(ax+13, W-w-2)), ay-h-2, w, h);
}

function gx(th){ return GX0 + (th/TAU)*(GX1-GX0); }
function gy(v){ return GY - v*GA; }

function draw(){
  const p = P(), th = thVal, t = th + p.shift, val = fv(p, t);
  let s = '';
  LBOX = [];

  /* --- unit circle --- */
  s += '<line x1="' + (CX-R-40) + '" y1="' + CY + '" x2="' + (CX+R+40) + '" y2="' + CY + '" stroke="#bbb" stroke-width="1.5"/>';
  s += '<line x1="' + CX + '" y1="' + (CY-R-40) + '" x2="' + CX + '" y2="' + (CY+R+40) + '" stroke="#bbb" stroke-width="1.5"/>';
  s += '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="#666" stroke-width="2"/>';
  s += '<text x="' + (CX-14) + '" y="' + (CY+18) + '" font-size="13" fill="#999">O</text>';
  keep(CX-14, CY+5, 14, 16);
  s += '<text x="' + (CX+R+6) + '" y="' + (CY+18) + '" font-size="11" fill="#aaa">1</text>';
  keep(CX+R+6, CY+7, 10, 14);
  s += '<text x="' + (CX-18) + '" y="' + (CY-R+4) + '" font-size="11" fill="#aaa">1</text>';
  keep(CX-18, CY-R-7, 10, 14);
  s += '<foreignObject x="' + (CX+R+30) + '" y="' + (CY-24) + '" width="26" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">' + T('x') + '</div></foreignObject>';
  keep(CX+R+30, CY-24, 26, 24);
  s += '<foreignObject x="' + (CX+8) + '" y="' + (CY-R-44) + '" width="26" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">' + T('y') + '</div></foreignObject>';
  keep(CX+8, CY-R-44, 26, 24);

  /* target level line */
  if(p.fname === 'sin'){
    const ly = CY - p.c*R;
    s += '<line x1="' + (CX-R-35) + '" y1="' + ly + '" x2="' + (CX+R+35) + '" y2="' + ly + '" stroke="var(--c-green)" stroke-width="2" stroke-dasharray="7 5"/>';
    s += '<foreignObject x="' + (CX+R+8) + '" y="' + (ly-30) + '" width="80" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:var(--c-green);font-weight:600;white-space:nowrap">' + T('y=' + p.cTex) + '</div></foreignObject>';
    keep(CX+R+8, ly-30, 80, 36);
  } else {
    const lx = CX + p.c*R;
    s += '<line x1="' + lx + '" y1="' + (CY-R-35) + '" x2="' + lx + '" y2="' + (CY+R+35) + '" stroke="var(--c-green)" stroke-width="2" stroke-dasharray="7 5"/>';
    s += '<foreignObject x="' + (lx-30) + '" y="' + (CY-R-46) + '" width="90" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:var(--c-green);font-weight:600;white-space:nowrap">' + T('x=' + p.cTex) + '</div></foreignObject>';
    keep(lx-30, CY-R-46, 90, 36);
  }

  /* solution points on circle */
  p.tSol.forEach(function(ts, i){
    s += '<circle cx="' + ptx(ts) + '" cy="' + pty(ts) + '" r="7" fill="var(--c-green)" stroke="#fff" stroke-width="2"/>';
    const lbx = ptx(ts) + (Math.cos(ts) >= 0 ? 12 : -30), lby = pty(ts) + (Math.sin(ts) >= 0 ? -8 : 20);
    s += '<text x="' + lbx + '" y="' + lby + '" font-size="13" font-weight="700" fill="var(--c-green)">' + (i === 0 ? 'P' : "P'") + '</text>';
    keep(lbx, lby-13, 20, 17);
  });

  /* shift sector between theta and t */
  s += '<path d="' + sector(R*0.55, th, t) + '" fill="rgba(230,126,34,0.18)" stroke="var(--c-orange)" stroke-width="1"/>';
  s += '<path d="' + sector(R*0.30, 0, th) + '" fill="rgba(42,109,244,0.16)" stroke="var(--c-blue)" stroke-width="1"/>';

  /* radii */
  s += '<line x1="' + CX + '" y1="' + CY + '" x2="' + ptx(th) + '" y2="' + pty(th) + '" stroke="var(--c-blue)" stroke-width="2.5"/>';
  s += '<circle cx="' + ptx(th) + '" cy="' + pty(th) + '" r="6" fill="var(--c-blue)" stroke="#fff" stroke-width="2"/>';
  s += '<line x1="' + CX + '" y1="' + CY + '" x2="' + ptx(t) + '" y2="' + pty(t) + '" stroke="var(--c-orange)" stroke-width="3"/>';

  /* drop line from Q to the axis carrying the value */
  if(p.fname === 'sin'){
    s += '<line x1="' + ptx(t) + '" y1="' + pty(t) + '" x2="' + CX + '" y2="' + pty(t) + '" stroke="var(--c-orange)" stroke-width="1.5" stroke-dasharray="4 3"/>';
  } else {
    s += '<line x1="' + ptx(t) + '" y1="' + pty(t) + '" x2="' + ptx(t) + '" y2="' + CY + '" stroke="var(--c-orange)" stroke-width="1.5" stroke-dasharray="4 3"/>';
  }

  let onSol = -1;
  p.ans.forEach(function(a, i){ if(Math.abs(th - a) < 0.02) onSol = i; });
  const qr = onSol >= 0 ? 11 : 8;
  s += '<circle cx="' + ptx(t) + '" cy="' + pty(t) + '" r="' + qr + '" fill="var(--c-orange)" stroke="#fff" stroke-width="2.5"/>';
  if(onSol >= 0){
    s += '<circle cx="' + ptx(t) + '" cy="' + pty(t) + '" r="' + qr + '" fill="none" stroke="var(--c-red)" stroke-width="3">' +
      '<animate attributeName="r" values="' + qr + ';' + (qr+9) + ';' + qr + '" dur="1s" repeatCount="indefinite"/></circle>';
  }
  const tp = place(ptx(t), pty(t), 24, 26);
  s += '<foreignObject x="' + tp[0] + '" y="' + tp[1] + '" width="24" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:var(--c-orange);font-weight:700">' + T('t') + '</div></foreignObject>';
  s += '<foreignObject x="' + (CX + 12) + '" y="' + (CY - 34) + '" width="30" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-blue);font-weight:700">' + T('\\theta') + '</div></foreignObject>';
  keep(CX+12, CY-34, 30, 26);

  /* --- graph of y = f(theta + alpha) --- */
  s += '<line x1="' + (GX0-25) + '" y1="' + GY + '" x2="' + (GX1+18) + '" y2="' + GY + '" stroke="#bbb" stroke-width="1.5"/>';
  s += '<line x1="' + GX0 + '" y1="' + (GY-GA-30) + '" x2="' + GX0 + '" y2="' + (GY+GA+30) + '" stroke="#bbb" stroke-width="1.5"/>';
  for(let k = 1; k <= 4; k++){
    const xg = gx(k*PI/2);
    s += '<line x1="' + xg + '" y1="' + (GY-GA-10) + '" x2="' + xg + '" y2="' + (GY+GA+10) + '" stroke="#eee" stroke-width="1"/>';
    const lab = ['\\dfrac{\\pi}{2}','\\pi','\\dfrac{3}{2}\\pi','2\\pi'][k-1];
    s += '<foreignObject x="' + (xg-24) + '" y="' + (GY+GA+14) + '" width="56" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#aaa;text-align:center">' + T(lab) + '</div></foreignObject>';
  }
  s += '<text x="' + (GX0-10) + '" y="' + (GY-GA+4) + '" text-anchor="end" font-size="11" fill="#aaa">1</text>';
  s += '<text x="' + (GX0-10) + '" y="' + (GY+GA+4) + '" text-anchor="end" font-size="11" fill="#aaa">-1</text>';
  s += '<foreignObject x="' + (GX1+2) + '" y="' + (GY-28) + '" width="30" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#999">' + T('\\theta') + '</div></foreignObject>';

  /* level line on graph */
  s += '<line x1="' + GX0 + '" y1="' + gy(p.c) + '" x2="' + GX1 + '" y2="' + gy(p.c) + '" stroke="var(--c-green)" stroke-width="2" stroke-dasharray="7 5"/>';

  /* curve */
  let d = '';
  for(let i = 0; i <= 200; i++){
    const q = i/200*TAU;
    d += (i === 0 ? 'M ' : 'L ') + gx(q) + ' ' + gy(fv(p, q + p.shift)) + ' ';
  }
  s += '<path d="' + d + '" fill="none" stroke="var(--c-purple)" stroke-width="2.5"/>';
  s += '<foreignObject x="' + (GX0+10) + '" y="' + (gy(p.c)-42) + '" width="90" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:var(--c-green);font-weight:600;white-space:nowrap;background:rgba(250,250,250,0.9);border-radius:4px">' + T('y=' + p.cTex) + '</div></foreignObject>';
  s += '<foreignObject x="' + (GX1-160) + '" y="' + (GY-GA-42) + '" width="180" height="38"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:var(--c-purple);font-weight:600;text-align:right;white-space:nowrap">' + T('y=' + fTex(p, '\\!\\left(\\theta' + p.sTex + '\\right)')) + '</div></foreignObject>';

  /* answers on graph */
  p.ans.forEach(function(a, i){
    s += '<line x1="' + gx(a) + '" y1="' + gy(p.c) + '" x2="' + gx(a) + '" y2="' + GY + '" stroke="var(--c-green)" stroke-width="1.5" stroke-dasharray="4 3"/>';
    s += '<circle cx="' + gx(a) + '" cy="' + gy(p.c) + '" r="6" fill="var(--c-green)" stroke="#fff" stroke-width="2"/>';
    /* keep the label off the vertical connector, which runs below the axis when c < 0 */
    let ax = gx(a) + 8, aal = 'left';
    if(ax > W-66 || busy(ax, GY+4, 62, 36)){ ax = gx(a) - 70; aal = 'right'; }
    ax = Math.max(2, Math.min(ax, W-64));
    keep(ax, GY+4, 62, 36);
    s += '<foreignObject x="' + ax + '" y="' + (GY+4) + '" width="62" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:var(--c-green);font-weight:700;text-align:' + aal + '">' + T(p.ansLbl[i]) + '</div></foreignObject>';
  });

  /* current position marker */
  s += '<line x1="' + gx(th) + '" y1="' + (GY-GA-14) + '" x2="' + gx(th) + '" y2="' + (GY+GA+14) + '" stroke="var(--c-orange)" stroke-width="1.5" opacity="0.6"/>';
  s += '<circle cx="' + gx(th) + '" cy="' + gy(val) + '" r="7" fill="var(--c-orange)" stroke="#fff" stroke-width="2.5"/>';

  document.getElementById('graph').innerHTML = s;

  /* live readout */
  const f2 = function(v){ return (Math.round(v*100)/100).toFixed(2); };
  let msg = '';
  if(onSol >= 0){
    msg = '<div class="hit">' + T('\\theta=' + p.ansLbl[onSol]) + ' &nbsp;— 解に一致しています</div>';
  } else if(Math.abs(val - p.c) < 0.02){
    msg = '<div class="hit">目盛り線にほぼ乗りました</div>';
  }
  document.getElementById('live-calc').innerHTML =
    T('\\theta=' + f2(th)) + '&nbsp;&nbsp;' +
    T('t=\\theta' + p.sTex + '=' + f2(t)) + '<br>' +
    T(fTex(p, 't') + '=' + f2(val)) + '&nbsp;&nbsp;' + T('\\text{目標値}=' + f2(p.c)) + msg;
}

function setSlider(v){
  thVal = v;
  document.getElementById('th-slider').value = v;
  document.getElementById('th-value').textContent = v.toFixed(2);
  draw();
}

function setupSlider(){
  const sl = document.getElementById('th-slider');
  sl.addEventListener('input', function(){ stopAnim(); setSlider(parseFloat(sl.value)); });
}

function stopAnim(){ if(animId){ cancelAnimationFrame(animId); animId = null; } }

function glide(target){
  stopAnim();
  const start = thVal, dur = 900;
  let t0 = null;
  function frame(ts){
    if(!t0) t0 = ts;
    const pr = Math.min((ts - t0)/dur, 1);
    const e = pr < 0.5 ? 2*pr*pr : 1 - Math.pow(-2*pr+2, 2)/2;
    setSlider(start + (target - start)*e);
    if(pr < 1) animId = requestAnimationFrame(frame); else { animId = null; setSlider(target); }
  }
  animId = requestAnimationFrame(frame);
}

function setupButtons(){
  document.getElementById('prev').addEventListener('click', function(){ if(curStep > 0){ curStep--; renderSteps(); } });
  document.getElementById('next').addEventListener('click', function(){ if(curStep < steps().length-1){ curStep++; renderSteps(); } });
  document.getElementById('jump1').addEventListener('click', function(){ glide(P().ans[0]); });
  document.getElementById('jump2').addEventListener('click', function(){ glide(P().ans[1]); });
  document.getElementById('anim-btn').addEventListener('click', function(){
    stopAnim();
    const dur = 6000;
    let t0 = null;
    function frame(ts){
      if(!t0) t0 = ts;
      const pr = Math.min((ts - t0)/dur, 1);
      setSlider(pr*TAU*0.9999);
      if(pr < 1) animId = requestAnimationFrame(frame); else animId = null;
    }
    setSlider(0);
    animId = requestAnimationFrame(frame);
  });
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
