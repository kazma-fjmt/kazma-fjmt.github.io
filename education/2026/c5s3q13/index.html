<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>定積分と面積</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0; }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; margin: .75rem 0; overflow: hidden; touch-action: none; position: relative; }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* draw() replaces the SVG contents, which would orphan a touch sequence that
     started on a child; keep hit-testing on the wrapper so the drag survives */
  .svg-container > svg { pointer-events: none; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto; }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step > .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step > .formula-line { text-align: left; overflow-x: auto; }
  .step > .formula-line .katex { font-size: 1.05rem; }
  .step.current > .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; gap: .5rem; margin: .75rem 0; }
  .tab { appearance: none; flex: 1; border: 1px solid #d4dbeb; background: #fff; color: var(--accent); font-size: .95rem; font-weight: 600; padding: .7rem .5rem; border-radius: 10px; min-height: 48px; cursor: pointer; font-family: inherit; user-select: none; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.05rem; }
  .live-calc > div { margin: .35rem 0; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row { display: flex; align-items: center; gap: 1rem; margin: .75rem 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; }
  .slider-row > label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row > input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row > .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; margin: .5rem 0; }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; justify-content: center; margin: .5rem 0 0; font-size: .88rem; }
  .legend > span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend > span > i { display: inline-block; width: 22px; height: 4px; border-radius: 2px; font-style: normal; }
  .legend > span > b { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
  .legend > span > u { display: inline-block; width: 15px; height: 15px; border-radius: 3px; text-decoration: none; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>定積分と面積</h1>
  <p class="subtitle">曲線と x 軸の間の面積が、なぜ定積分で求まるのかを動く図で確かめましょう。</p>

  <h2>基本の考え方</h2>
  <p>区間で <span id="f-fpos"></span> のとき、下端 <span id="f-a"></span> から <span id="f-x"></span> までの面積を <span id="f-Sx"></span> とおきます。<span id="f-x2"></span> を <span id="f-h"></span> だけ増やすと面積は <span id="f-dS"></span> だけ増えます。この細い部分は、横の長さ <span id="f-h2"></span>、縦の長さ <span id="f-ft"></span> の長方形の面積にちょうど等しくなるように <span id="f-t"></span> をとることができます。</p>
  <div class="formula-box" id="f-key1"></div>
  <p><span id="f-h3"></span> を 0 に近づけると <span id="f-t2"></span> は <span id="f-x3"></span> に近づくので <span id="f-Sp"></span> となり、<span id="f-Sx2"></span> は <span id="f-fx"></span> の原始関数だと分かります。原始関数の 1 つを <span id="f-Fx"></span> とすると <span id="f-Sa"></span> より次の公式が得られます。</p>
  <div class="formula-box" id="f-key2"></div>

  <h2>解く問題</h2>
  <div class="formula-box" id="f-problem"></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <div class="tabs">
    <button class="tab active" id="tab1">(1) 面積が増える速さ</button>
    <button class="tab" id="tab2">(2) 区間の面積を出す</button>
  </div>
  <p id="mode-desc"></p>

  <div class="slider-row">
    <label><span id="lbl-x"></span> =</label>
    <input type="range" id="x-slider" min="-2" max="1" step="0.05" value="-0.6">
    <span class="slider-val" id="x-value">-0.6</span>
  </div>
  <div class="slider-row" id="h-row">
    <label><span id="lbl-h"></span> =</label>
    <input type="range" id="h-slider" min="0.05" max="0.6" step="0.05" value="0.4">
    <span class="slider-val" id="h-value">0.4</span>
  </div>

  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">アニメーション</button>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend" id="legend"></div>
  <p class="drag-hint" id="drag-hint"></p>

  <div class="live-calc" id="live-calc"></div>
  <div class="note" id="note-box"></div>

  <h2>答え</h2>
  <div class="formula-box" id="result-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=500,mL=58,mR=26,PW=W-mL-mR;
const TT=26, TH=248;            /* 上段パネル */
const BT=312, BH=152;           /* 下段パネル */
const XMIN=-2.5, XMAX=1.7, AA=-2;
const YT0=-1.2, YT1=9.0;
const YB0=-2.8, YB1=11.2;

function f(x){ return x*x+2*x+2; }
function F(x){ return x*x*x/3+x*x+2*x; }
const FA=F(AA);
function S(x){ return F(x)-FA; }

function pxc(x){ return mL+(x-XMIN)/(XMAX-XMIN)*PW; }
function pyT(y){ return TT+TH-(y-YT0)/(YT1-YT0)*TH; }
function pyB(y){ return BT+BH-(y-YB0)/(YB1-YB0)*BH; }

let mode=1, xVal=-0.6, hVal=0.4, animId=null;

function fmt(v){
  if(Math.abs(v)<5e-13) v=0;
  let s=v.toFixed(6);
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  if(s==='-0') s='0';
  return s;
}
/* 表示は小数第 3 位まで。丸めが入るときは = ではなく ≒ を使う */
function rnd(v){ return Math.round(v*1000)/1000; }
function rel(v){ return Math.abs(rnd(v)-v)<1e-12 ? '=' : '\\fallingdotseq'; }
function sv(v){ return fmt(rnd(v)); }

/* 平均値の定理にあたる t: 幅 h の部分の面積が h*f(t) にちょうど等しくなる点 */
function findT(x,h){
  const m=(S(x+h)-S(x))/h;              /* 幅 h の部分の面積 ÷ h */
  const r=Math.sqrt(Math.max(0,m-1));   /* f(u)=(u+1)^2+1 を m について解く */
  const inside=u=>u>=x-1e-9 && u<=x+h+1e-9;
  const c1=-1+r, c2=-1-r;
  if(inside(c1)) return c1;
  if(inside(c2)) return c2;
  return Math.max(x,Math.min(x+h,c1));
}
function clipLine(m,x0,y0,ymin,ymax){
  const pts=[], yAt=x=>y0+m*(x-x0);
  [XMIN,XMAX].forEach(x=>{ const y=yAt(x); if(y>=ymin-1e-9&&y<=ymax+1e-9) pts.push({x:x,y:y}); });
  if(Math.abs(m)>1e-9){
    [ymin,ymax].forEach(y=>{ const x=x0+(y-y0)/m; if(x>=XMIN-1e-9&&x<=XMAX+1e-9) pts.push({x:x,y:y}); });
  }
  const u=[];
  for(const p of pts){ if(!u.some(q=>Math.abs(q.x-p.x)<1e-7&&Math.abs(q.y-p.y)<1e-7)) u.push(p); }
  return u.length>=2 ? [u[0],u[1]] : null;
}
function areaPath(x0,x1){
  if(x1-x0<1e-9) return '';
  const N=Math.max(2,Math.round((x1-x0)/(XMAX-XMIN)*300));
  let d=`M ${pxc(x0).toFixed(2)} ${pyT(0).toFixed(2)}`;
  for(let i=0;i<=N;i++){ const u=x0+(x1-x0)*i/N; d+=` L ${pxc(u).toFixed(2)} ${pyT(f(u)).toFixed(2)}`; }
  d+=` L ${pxc(x1).toFixed(2)} ${pyT(0).toFixed(2)} Z`;
  return d;
}

function init(){
  const spans={'f-fpos':'f(x)\\ge 0','f-a':'a','f-x':'x','f-x2':'x','f-x3':'x','f-Sx':'S(x)',
    'f-h':'h','f-h2':'h','f-h3':'h','f-dS':'S(x+h)-S(x)','f-ft':'f(t)','f-t':'t','f-t2':'t',
    'f-Sp':"S'(x)=f(x)",'f-Sx2':'S(x)','f-fx':'f(x)','f-Fx':'F(x)','f-Sa':'S(a)=0',
    'lbl-x':'x','lbl-h':'h'};
  for(const id in spans) document.getElementById(id).innerHTML=T(spans[id]);

  tex('\\dfrac{S(x+h)-S(x)}{h}=f(t)\\qquad (x\\le t\\le x+h)',document.getElementById('f-key1'),true);
  tex('S=\\int_a^b f(x)\\,dx',document.getElementById('f-key2'),true);
  tex('y=x^2+2x+2 \\ \\text{と } x \\text{ 軸、2 直線 } x=-2,\\ x=1 \\text{ で囲まれた面積 } S',document.getElementById('f-problem'),true);
  tex('S=6',document.getElementById('result-box'),true);

  initWalkthrough();
  setupTabs();
  setupSliders();
  setupAnim();
  setupDrag();
  applyMode();
}

function initWalkthrough(){
  const steps=[
    { label:'Step 1: 区間で符号を確かめる', formula:'x^2+2x+2=(x+1)^2+1>0' },
    { label:'Step 2: 面積を定積分で表す', formula:'S=\\int_{-2}^{1}(x^2+2x+2)\\,dx' },
    { label:'Step 3: 原始関数を 1 つ求める', formula:'F(x)=\\dfrac{1}{3}x^3+x^2+2x' },
    { label:'Step 4: 上端と下端を代入する形にする', formula:'S=\\left[\\dfrac{1}{3}x^3+x^2+2x\\right]_{-2}^{1}=F(1)-F(-2)' },
    { label:'Step 5: 上端の値を計算する', formula:'F(1)=\\dfrac{1}{3}+1+2=\\dfrac{10}{3}' },
    { label:'Step 6: 下端の値を計算する', formula:'F(-2)=-\\dfrac{8}{3}+4-4=-\\dfrac{8}{3}' },
    { label:'Step 7: 差をとる', formula:'S=\\dfrac{10}{3}-\\left(-\\dfrac{8}{3}\\right)=\\dfrac{18}{3}=6' },
    { label:'Step 8: 答え', formula:'S=6' }
  ];
  let c=0;
  const container=document.getElementById('walkthrough'), counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=c;i++){
      html+=`<div class="step ${i===c?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${c+1} / ${steps.length}`;
    prevBtn.disabled=c===0;
    nextBtn.disabled=c===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{ if(c>0){c--;render();} });
  nextBtn.addEventListener('click',()=>{ if(c<steps.length-1){c++;render();} });
  render();
}

function draw(){
  const x=xVal, h=hVal, fx=f(x), Sx=S(x);
  const t=findT(x,h), ft=f(t), dS=S(x+h)-S(x), q=dS/h;
  let s='', ticks='';
  const HALO2=' stroke="#fff" stroke-width="2.5" paint-order="stroke" stroke-linejoin="round"';
  const LBL='font-size:13px;color:#999;display:inline-block;background:#fff';

  /* パネル間をつなぐ縦線（下段の白背景で消えるので 2 度描く） */
  s+=`<line x1="${pxc(x)}" y1="${TT}" x2="${pxc(x)}" y2="${BT+BH}" stroke="#c9d3e8" stroke-width="1.5" stroke-dasharray="5 5"/>`;

  /* ===== 上段 ===== */
  s+=`<rect x="${mL}" y="${TT}" width="${PW}" height="${TH}" fill="#fff" stroke="#e3e3e3"/>`;
  for(let i=-2;i<=1;i++) s+=`<line x1="${pxc(i)}" y1="${TT}" x2="${pxc(i)}" y2="${TT+TH}" stroke="${i===0?'#999':'#eee'}" stroke-width="${i===0?1.5:1}"/>`;
  for(let i=0;i<=8;i+=2) s+=`<line x1="${mL}" y1="${pyT(i)}" x2="${mL+PW}" y2="${pyT(i)}" stroke="${i===0?'#999':'#eee'}" stroke-width="${i===0?1.5:1}"/>`;
  for(let i=-2;i<=1;i++){ if(i===0) continue; ticks+=`<text x="${pxc(i)}" y="${pyT(0)+16}" text-anchor="middle" font-size="11" fill="#aaa"${HALO2}>${i}</text>`; }
  for(let i=2;i<=8;i+=2) ticks+=`<text x="${mL-8}" y="${pyT(i)+4}" text-anchor="end" font-size="11" fill="#aaa"${HALO2}>${i}</text>`;

  const ap=areaPath(AA,x);
  if(ap) s+=`<path d="${ap}" fill="rgba(42,109,244,0.18)" stroke="none"/>`;
  if(mode===1){
    const sp=areaPath(x,x+h);
    if(sp) s+=`<path d="${sp}" fill="rgba(230,126,34,0.38)" stroke="none"/>`;
    s+=`<rect x="${pxc(x)}" y="${pyT(ft)}" width="${pxc(x+h)-pxc(x)}" height="${pyT(0)-pyT(ft)}" fill="none" stroke="var(--c-orange)" stroke-width="2" stroke-dasharray="5 4"/>`;
    s+=`<line x1="${pxc(t)}" y1="${pyT(0)}" x2="${pxc(t)}" y2="${pyT(ft)}" stroke="var(--c-orange)" stroke-width="1.5" opacity="0.6"/>`;
  }

  let d='';
  for(let i=0;i<=300;i++){
    const u=XMIN+(XMAX-XMIN)*i/300;
    d+=(i===0?'M':'L')+` ${pxc(u).toFixed(2)} ${pyT(f(u)).toFixed(2)}`;
  }
  s+=`<path d="${d}" fill="none" stroke="var(--c-purple)" stroke-width="2.5"/>`;
  s+=`<line x1="${pxc(AA)}" y1="${pyT(0)}" x2="${pxc(AA)}" y2="${pyT(f(AA))}" stroke="var(--c-blue)" stroke-width="2"/>`;
  if(mode===2) s+=`<line x1="${pxc(1)}" y1="${pyT(0)}" x2="${pxc(1)}" y2="${pyT(f(1))}" stroke="#bbb" stroke-width="2" stroke-dasharray="6 4"/>`;
  s+=ticks;
  if(mode===1) s+=`<circle cx="${pxc(t)}" cy="${pyT(0)}" r="5" fill="var(--c-orange)" stroke="#fff" stroke-width="2"/>`;
  s+=`<circle cx="${pxc(x)}" cy="${pyT(fx)}" r="9" fill="var(--c-red)" stroke="#fff" stroke-width="2.5"/>`;
  s+=`<circle cx="${pxc(x)}" cy="${pyT(fx)}" r="9" fill="none" stroke="var(--c-red)" stroke-width="2" opacity="0.5"><animate attributeName="r" values="9;17;9" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="1.8s" repeatCount="indefinite"/></circle>`;
  s+=`<foreignObject x="${mL+8}" y="${TT+4}" width="150" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-purple);font-weight:600;white-space:nowrap">${T('y=x^2+2x+2')}</div></foreignObject>`;
  s+=`<foreignObject x="${mL+PW-24}" y="${pyT(0)+2}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${LBL}">${T('x')}</div></foreignObject>`;

  /* ===== 下段 ===== */
  s+=`<rect x="${mL}" y="${BT}" width="${PW}" height="${BH}" fill="#fff" stroke="#e3e3e3"/>`;
  for(let i=-2;i<=1;i++) s+=`<line x1="${pxc(i)}" y1="${BT}" x2="${pxc(i)}" y2="${BT+BH}" stroke="${i===0?'#999':'#eee'}" stroke-width="${i===0?1.5:1}"/>`;
  for(let i=0;i<=10;i+=2) s+=`<line x1="${mL}" y1="${pyB(i)}" x2="${mL+PW}" y2="${pyB(i)}" stroke="${i===0?'#999':'#eee'}" stroke-width="${i===0?1.5:1}"/>`;
  /* 動く緑の点の下に来る目盛りラベルは描かない（x=-2 では S=0 で点が軸上に載る） */
  const gp={x:pxc(x), y:pyB(Sx), r:12};
  function covered(x0,y0,w,h){
    const nx=Math.max(x0,Math.min(gp.x,x0+w)), ny=Math.max(y0,Math.min(gp.y,y0+h));
    return Math.hypot(gp.x-nx,gp.y-ny) < gp.r;
  }
  let tickB='';
  for(let i=-2;i<=1;i++){
    if(i===0) continue;
    if(covered(pxc(i)-7, pyB(0)+7, 14, 12)) continue;
    tickB+=`<text x="${pxc(i)}" y="${pyB(0)+16}" text-anchor="middle" font-size="11" fill="#aaa"${HALO2}>${i}</text>`;
  }
  for(let i=2;i<=10;i+=2) tickB+=`<text x="${mL-8}" y="${pyB(i)+4}" text-anchor="end" font-size="11" fill="#aaa"${HALO2}>${i}</text>`;

  s+=`<line x1="${pxc(x)}" y1="${BT}" x2="${pxc(x)}" y2="${BT+BH}" stroke="#c9d3e8" stroke-width="1.5" stroke-dasharray="5 5"/>`;
  if(mode===2){
    s+=`<line x1="${mL}" y1="${pyB(6)}" x2="${mL+PW}" y2="${pyB(6)}" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 4"/>`;
    s+=`<circle cx="${pxc(1)}" cy="${pyB(6)}" r="6" fill="#fff" stroke="#999" stroke-width="2"/>`;
  }
  let ds='';
  for(let i=0;i<=300;i++){
    const u=AA+(XMAX-AA)*i/300;
    ds+=(i===0?'M':'L')+` ${pxc(u).toFixed(2)} ${pyB(S(u)).toFixed(2)}`;
  }
  s+=`<path d="${ds}" fill="none" stroke="var(--c-green)" stroke-width="2.5"/>`;
  if(mode===1){
    /* 接線は傾き f(x)。上段の (x, f(x)) の赤い点と同じ色にして対応を示す */
    const tg=clipLine(fx,x,Sx,YB0,YB1);
    if(tg) s+=`<line x1="${pxc(tg[0].x)}" y1="${pyB(tg[0].y)}" x2="${pxc(tg[1].x)}" y2="${pyB(tg[1].y)}" stroke="var(--c-red)" stroke-width="3"/>`;
    const sc=clipLine(q,x,Sx,YB0,YB1);
    if(sc) s+=`<line x1="${pxc(sc[0].x)}" y1="${pyB(sc[0].y)}" x2="${pxc(sc[1].x)}" y2="${pyB(sc[1].y)}" stroke="var(--c-blue)" stroke-width="2" stroke-dasharray="7 4"/>`;
    if(x+h<=XMAX) s+=`<circle cx="${pxc(x+h)}" cy="${pyB(S(x+h))}" r="6" fill="var(--c-blue)" stroke="#fff" stroke-width="2"/>`;
  }
  s+=`<line x1="${pxc(x)}" y1="${pyB(0)}" x2="${pxc(x)}" y2="${pyB(Sx)}" stroke="var(--c-green)" stroke-width="2.5" opacity="0.55"/>`;
  s+=tickB;
  s+=`<circle cx="${pxc(x)}" cy="${pyB(Sx)}" r="8" fill="var(--c-green)" stroke="#fff" stroke-width="2.5"><animate attributeName="r" values="8;11;8" dur="1.6s" repeatCount="indefinite"/></circle>`;
  s+=`<foreignObject x="${mL+8}" y="${BT+4}" width="130" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-green);font-weight:600;white-space:nowrap">${T('y=S(x)')}</div></foreignObject>`;
  s+=`<foreignObject x="${mL+PW-24}" y="${pyB(0)+2}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${LBL}">${T('x')}</div></foreignObject>`;

  document.getElementById('graph').innerHTML=s;

  const lc=document.getElementById('live-calc');
  if(mode===1){
    lc.innerHTML=
      `<div>${T('x = '+fmt(x)+',\\quad h = '+fmt(h)+',\\quad t '+rel(t)+' '+sv(t))}</div>`+
      `<div style="color:var(--c-orange)">${T('S(x+h)-S(x) '+rel(dS)+' '+sv(dS)+',\\quad h\\,f(t) '+rel(h*ft)+' '+sv(h*ft))}</div>`+
      `<div style="color:var(--c-blue)">${T('\\dfrac{S(x+h)-S(x)}{h}=f(t) '+rel(ft)+' '+sv(ft))}</div>`+
      `<div style="color:var(--c-orange)">${T('f(x) '+rel(fx)+' '+sv(fx)+'\\qquad f(t)-f(x) '+rel(ft-fx)+' '+sv(ft-fx))}</div>`;
  }else{
    lc.innerHTML=
      `<div>${T('\\text{上端 } x = '+fmt(x))}</div>`+
      `<div style="color:var(--c-blue)">${T('S(x)=\\int_{-2}^{x}(t^2+2t+2)\\,dt=F(x)-\\left(-\\dfrac{8}{3}\\right)')}</div>`+
      `<div style="color:var(--c-green)">${T('S(x) '+rel(Sx)+' '+sv(Sx))}</div>`+
      `<div>${x>=0.999 ? T('x=1 \\text{ のとき } S=6') : T('\\text{上端を } 1 \\text{ まで動かしましょう}')}</div>`;
  }
}

function buildLegend(){
  const L=document.getElementById('legend');
  if(mode===1){
    L.innerHTML=
      '<span><i style="background:var(--c-purple)"></i>'+T('y=x^2+2x+2')+'</span>'+
      '<span><u style="background:rgba(42,109,244,0.35)"></u>'+T('S(x)')+'</span>'+
      '<span><u style="background:rgba(230,126,34,0.55)"></u>'+T('S(x+h)-S(x)')+'</span>'+
      '<span><i style="background:var(--c-orange)"></i>長方形 '+T('h\\,f(t)')+'</span>'+
      '<span><i style="background:var(--c-green)"></i>'+T('y=S(x)')+'（下段）</span>'+
      '<span><i style="background:var(--c-blue)"></i>下段の割線（傾き '+T('f(t)')+'）</span>'+
      '<span><i style="background:var(--c-red)"></i>下段の接線（傾き '+T('f(x)')+'）</span>';
  }else{
    L.innerHTML=
      '<span><i style="background:var(--c-purple)"></i>'+T('y=x^2+2x+2')+'</span>'+
      '<span><u style="background:rgba(42,109,244,0.35)"></u>'+T('\\int_{-2}^{x}(t^2+2t+2)\\,dt')+'</span>'+
      '<span><i style="background:var(--c-green)"></i>'+T('y=S(x)')+'（下段）</span>'+
      '<span><b style="background:var(--c-green)"></b>'+T('(x,\\ S(x))')+'</span>'+
      '<span><i style="background:#bbb"></i>'+T('x=1,\\ S=6')+'</span>';
  }
}

function applyMode(){
  document.getElementById('tab1').classList.toggle('active',mode===1);
  document.getElementById('tab2').classList.toggle('active',mode===2);
  document.getElementById('h-row').style.display = mode===1 ? '' : 'none';
  document.getElementById('mode-desc').innerHTML = mode===1
    ? '上段の色の濃い細い部分と、点線の長方形の面積が等しくなっています。'+T('h')+' を小さくすると '+T('t')+' は '+T('x')+' に近づき、下段の割線は接線に重なります。'
    : '下端を '+T('-2')+' に固定して上端 '+T('x')+' を動かします。下段の緑の点の高さがそのまま面積です。';
  document.getElementById('drag-hint').innerHTML = '図を横にドラッグするか、スライダーで '+T('x')+' を変えましょう。';
  document.getElementById('anim-btn').textContent = mode===1 ? 'h を 0 に近づける' : 'x を -2 から 1 まで動かす';
  document.getElementById('note-box').innerHTML = mode===1
    ? '細い部分の面積は横 '+T('h')+'・縦 '+T('f(t)')+' の長方形と等しいので '+T('\\dfrac{S(x+h)-S(x)}{h}=f(t)')+' です。'+T('h\\to 0')+' で '+T('t\\to x')+' となるから '+T("S'(x)=f(x)")+'。つまり面積関数 '+T('S(x)')+' は '+T('f(x)')+' の原始関数です。'
    : T('S(x)=F(x)+C')+' で '+T('S(-2)=0')+' だから '+T('C=-F(-2)')+'。よって '+T('S(x)=F(x)-F(-2)')+' となり、上端を '+T('1')+' にすると '+T('S=F(1)-F(-2)=6')+' が得られます。';
  setX(mode===1 ? -0.6 : 1);
  buildLegend();
  draw();
}

function setX(v){
  xVal=Math.round(Math.max(-2,Math.min(1,v))*20)/20;
  document.getElementById('x-slider').value=xVal;
  document.getElementById('x-value').textContent=fmt(xVal);
}
function setH(v){
  hVal=Math.round(Math.max(0.05,Math.min(0.6,v))*20)/20;
  document.getElementById('h-slider').value=hVal;
  document.getElementById('h-value').textContent=fmt(hVal);
}

function setupTabs(){
  document.getElementById('tab1').addEventListener('click',()=>{ stopAnim(); mode=1; applyMode(); });
  document.getElementById('tab2').addEventListener('click',()=>{ stopAnim(); mode=2; applyMode(); });
}
function setupSliders(){
  const xs=document.getElementById('x-slider'), hs=document.getElementById('h-slider');
  xs.addEventListener('input',()=>{ stopAnim(); setX(parseFloat(xs.value)); draw(); });
  hs.addEventListener('input',()=>{ stopAnim(); setH(parseFloat(hs.value)); draw(); });
  setX(xVal); setH(hVal);
}
function setupAnim(){
  document.getElementById('anim-btn').addEventListener('click',()=>{
    if(mode===1) sweep('h',0.6,0.05,3000); else sweep('x',-2,1,3600);
  });
}
function stopAnim(){ if(animId){ cancelAnimationFrame(animId); animId=null; } }
function sweep(what,from,to,duration){
  stopAnim();
  let t0=null;
  if(what==='x') setX(from); else setH(from);
  function frame(ts){
    if(!t0) t0=ts;
    const pr=Math.min((ts-t0)/duration,1);
    const eased=pr<0.5 ? 2*pr*pr : 1-Math.pow(-2*pr+2,2)/2;
    const v=from+(to-from)*eased;
    if(what==='x') setX(v); else setH(v);
    draw();
    animId = pr<1 ? requestAnimationFrame(frame) : null;
  }
  animId=requestAnimationFrame(frame);
}

function setupDrag(){
  const svg=document.getElementById('graph');
  const wrap=document.getElementById('svg-wrap');
  let dragging=false;
  function toX(cx){
    const rect=svg.getBoundingClientRect();
    const sx=(cx-rect.left)/rect.width*W;
    return XMIN+(sx-mL)/PW*(XMAX-XMIN);
  }
  function startDrag(cx,cy){
    const rect=svg.getBoundingClientRect();
    const sy=(cy-rect.top)/rect.height*H;
    if(sy>TT-16 && sy<BT+BH+16){ stopAnim(); dragging=true; setX(toX(cx)); draw(); }
  }
  function moveDrag(cx){ if(dragging){ setX(toX(cx)); draw(); } }
  function endDrag(){ dragging=false; }
  wrap.addEventListener('mousedown',e=>{ e.preventDefault(); startDrag(e.clientX,e.clientY); });
  window.addEventListener('mousemove',e=>{ if(dragging){ e.preventDefault(); moveDrag(e.clientX); } });
  window.addEventListener('mouseup',endDrag);
  wrap.addEventListener('touchstart',e=>{ const t=e.touches[0]; startDrag(t.clientX,t.clientY); },{passive:true});
  wrap.addEventListener('touchmove',e=>{ if(dragging){ e.preventDefault(); const t=e.touches[0]; moveDrag(t.clientX); } },{passive:false});
  wrap.addEventListener('touchend',endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
