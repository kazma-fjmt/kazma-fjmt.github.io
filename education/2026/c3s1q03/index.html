<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>弧度法</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn.small { min-width: 104px; padding: .6rem .7rem; font-size: .95rem; min-height: 48px; }
  .btn.small.active { background: #f0f5ff; border-color: var(--accent); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .preset-row { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0; }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }

  .slider-row {
    display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem;
  }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 4.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; flex-wrap: wrap; gap: .5rem; margin: .5rem 0; }

  .compare-table { width: 100%; border-collapse: collapse; margin: .75rem 0; background: #fff; font-size: .95rem; overflow-x: auto; display: block; }
  .compare-table th, .compare-table td { border: 1px solid #e3e3e3; padding: .5rem .55rem; text-align: center; white-space: nowrap; }
  .compare-table th { background: #f3f6fc; color: #555; font-weight: 600; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>弧度法</h1>
  <p class="subtitle">半径と同じ長さの弧に対する中心角を 1 として、角の大きさを測りましょう。</p>

  <h2>基本の考え方</h2>
  <p>半径 <span id="f-r"></span> の円で、長さ <span id="f-r2"></span> の弧に対する中心角を <span id="f-1rad"></span> と決めます。弧の長さは中心角に比例するので、次の比例式が成り立ちます。</p>
  <div class="formula-box" id="f-prop"></div>
  <div class="formula-box" id="f-rule"></div>
  <div class="note">度から弧度へ直すときは <span id="f-conv1"></span> を掛け、弧度から度へ戻すときは <span id="f-conv2"></span> を掛けます。弧度法では単位のラジアンをふつう省略します。</div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <p>ボタンをタップするか、スライダーをドラッグすると弧が伸び縮みします。下の帯は「弧の長さが半径の何個分か」を表していて、その個数がそのまま弧度法の角の大きさです。</p>

  <div class="preset-row" id="preset-row"></div>

  <div class="slider-row">
    <label><span id="lbl-th"></span> =</label>
    <input type="range" id="th-slider" min="-405" max="405" step="1" value="405">
    <span class="slider-val" id="th-value">405°</span>
  </div>

  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">アニメーション</button>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 560" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="live-calc" id="live-calc"></div>

  <h2>度と弧度の対応</h2>
  <table class="compare-table" id="conv-table"></table>

  <h2>答えのまとめ</h2>
  <div class="formula-box" id="result-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W = 600, H = 560;
const CX = 300, CY = 236, R = 158;
const BY = 470, BX0 = 60, BX1 = 540, UMAX = 7.2;
let theta = 405;
let animId = null;

const presets = [
  { deg: -270, tag: '(1)', tex: '-270^\\circ' },
  { deg: 405,  tag: '(2)', tex: '405^\\circ' },
  { deg: 1,    tag: '(3)', tex: '1^\\circ' }
];

const tableAngles = [0, 30, 45, 60, 90, 120, 135, 150, 180, 270, 360];

function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a; }

function radTex(deg){
  if(deg === 0) return '0';
  const sign = deg < 0 ? '-' : '';
  let p = Math.abs(deg), q = 180;
  const g = gcd(p,q); p = p/g; q = q/g;
  const num = (p === 1) ? '\\pi' : (p + '\\pi');
  if(q === 1) return sign + num;
  return sign + '\\dfrac{' + num + '}{' + q + '}';
}

function ux(u){ return BX0 + u * (BX1 - BX0) / UMAX; }

function init(){
  document.getElementById('f-r').innerHTML = T('r');
  document.getElementById('f-r2').innerHTML = T('r');
  document.getElementById('f-1rad').innerHTML = T('1\\;\\text{ラジアン}');
  document.getElementById('f-conv1').innerHTML = T('\\dfrac{\\pi}{180}');
  document.getElementById('f-conv2').innerHTML = T('\\dfrac{180}{\\pi}');
  document.getElementById('lbl-th').innerHTML = T('\\theta');

  tex('r : 2\\pi r = \\alpha : 360^\\circ \\quad\\Longrightarrow\\quad \\alpha = \\dfrac{360^\\circ}{2\\pi} = \\dfrac{180^\\circ}{\\pi} = 57.2958^\\circ', document.getElementById('f-prop'), true);
  tex('1\\;\\text{ラジアン} = \\dfrac{180^\\circ}{\\pi},\\qquad 180^\\circ = \\pi\\;\\text{ラジアン}', document.getElementById('f-rule'), true);
  tex('-270^\\circ = -\\dfrac{3}{2}\\pi,\\qquad 405^\\circ = \\dfrac{9}{4}\\pi,\\qquad 1^\\circ = \\dfrac{\\pi}{180}', document.getElementById('result-box'), true);

  buildTable();
  initWalkthrough();
  buildPresets();
  setupSlider();
  setupAnimation();
  draw();
}

function buildTable(){
  let h1 = '<tr><th>度</th>', h2 = '<tr><th>弧度</th>';
  tableAngles.forEach(d=>{
    h1 += `<td>${T(d + '^\\circ')}</td>`;
    h2 += `<td>${T(radTex(d))}</td>`;
  });
  document.getElementById('conv-table').innerHTML = h1 + '</tr>' + h2 + '</tr>';
}

function initWalkthrough(){
  const steps = [
    { label: 'Step 1: 1 ラジアンの決め方',
      formula: '\\text{半径 }r\\text{ と同じ長さの弧に対する中心角を }1\\;\\text{ラジアンとする}' },
    { label: 'Step 2: 弧の長さは中心角に比例する',
      formula: 'r : 2\\pi r = \\alpha : 360^\\circ' },
    { label: 'Step 3: 比例式を解く',
      formula: '\\alpha = \\dfrac{360^\\circ}{2\\pi} = \\dfrac{180^\\circ}{\\pi} = 57.2958^\\circ\\;\\text{（半径に無関係）}' },
    { label: 'Step 4: 基本の対応',
      formula: '180^\\circ = \\pi \\quad\\Longleftrightarrow\\quad 1^\\circ = \\dfrac{\\pi}{180}' },
    { label: 'Step 5: 度から弧度へは pi / 180 を掛ける',
      formula: '\\theta^\\circ = \\theta \\times \\dfrac{\\pi}{180}' },
    { label: 'Step 6: (1) マイナス 270 度',
      formula: '-270 \\times \\dfrac{\\pi}{180} = -\\dfrac{270}{180}\\pi = -\\dfrac{3}{2}\\pi' },
    { label: 'Step 7: (2) 405 度',
      formula: '405 \\times \\dfrac{\\pi}{180} = \\dfrac{405}{180}\\pi = \\dfrac{9}{4}\\pi' },
    { label: 'Step 8: (3) 1 度',
      formula: '1 \\times \\dfrac{\\pi}{180} = \\dfrac{\\pi}{180}\\;\\text{（これ以上約分できない）}' }
  ];

  let cur = 0;
  const container = document.getElementById('walkthrough');
  const counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');

  function render(){
    let html = '';
    for(let i=0;i<=cur;i++){
      html += `<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML = html;
    counter.textContent = `${cur+1} / ${steps.length}`;
    prevBtn.disabled = cur===0;
    nextBtn.disabled = cur===steps.length-1;
  }

  prevBtn.addEventListener('click', ()=>{ if(cur>0){cur--;render();} });
  nextBtn.addEventListener('click', ()=>{ if(cur<steps.length-1){cur++;render();} });
  render();
}

function arcRadius(t){ return R + 11 * (Math.abs(t) / 360); }

function draw(){
  const svg = document.getElementById('graph');
  const rad = theta * Math.PI / 180;
  const u = Math.abs(rad);
  const sgn = theta < 0 ? -1 : 1;
  let s = '';

  s += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="#fff" stroke="#e6e6e6" stroke-width="1.5"/>`;
  for(let a=0;a<360;a+=30){
    const ar = a*Math.PI/180;
    const r1 = (a%90===0) ? R-11 : R-6;
    s += `<line x1="${(CX+r1*Math.cos(ar)).toFixed(1)}" y1="${(CY-r1*Math.sin(ar)).toFixed(1)}" x2="${(CX+R*Math.cos(ar)).toFixed(1)}" y2="${(CY-R*Math.sin(ar)).toFixed(1)}" stroke="#e0e0e0" stroke-width="1"/>`;
  }

  s += `<line x1="${CX}" y1="${CY}" x2="${CX+R}" y2="${CY}" stroke="var(--c-green)" stroke-width="4"/>`;
  s += `<foreignObject x="${CX+R/2-14}" y="${CY+4}" width="34" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px;color:#28a745;font-weight:700">${T('r')}</div></foreignObject>`;

  const n1 = 90;
  let d1 = '';
  for(let i=0;i<=n1;i++){
    const t = sgn * i / n1;
    const x = CX + R*Math.cos(t), y = CY - R*Math.sin(t);
    d1 += (i===0?'M':'L') + ` ${x.toFixed(2)} ${y.toFixed(2)}`;
  }
  s += `<path d="${d1}" fill="none" stroke="var(--c-green)" stroke-width="7" opacity="0.45"/>`;
  const mid1 = sgn * 0.5;
  const mlx = CX + (R+16)*Math.cos(mid1), mly = CY - (R+16)*Math.sin(mid1);
  s += `<foreignObject x="${Math.min(W-124, mlx-4)}" y="${mly-16}" width="122" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#28a745;font-weight:700;white-space:nowrap">弧の長さ ${T('= r')}</div></foreignObject>`;

  const steps = Math.max(2, Math.ceil(Math.abs(theta)/2));
  let d = '';
  for(let i=0;i<=steps;i++){
    const t = rad * i / steps;
    const rr = arcRadius(t*180/Math.PI);
    const x = CX + rr*Math.cos(t), y = CY - rr*Math.sin(t);
    d += (i===0?'M':'L') + ` ${x.toFixed(2)} ${y.toFixed(2)}`;
  }
  if(Math.abs(theta) > 0.5){
    s += `<path d="${d}" fill="none" stroke="var(--c-orange)" stroke-width="4"/>`;
  }

  for(let k=1;k<=7;k++){
    if(k > u) break;
    const t = sgn * k;
    const rr = arcRadius(t*180/Math.PI);
    const x1 = CX + (rr-9)*Math.cos(t), y1 = CY - (rr-9)*Math.sin(t);
    const x2 = CX + (rr+9)*Math.cos(t), y2 = CY - (rr+9)*Math.sin(t);
    s += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--c-purple)" stroke-width="2.5"/>`;
    const lx = CX + (rr+22)*Math.cos(t), ly = CY - (rr+22)*Math.sin(t);
    s += `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-size="12" fill="#7b61ff" font-weight="700">${k}</text>`;
  }

  const rr2 = arcRadius(theta);
  const ex = CX + rr2*Math.cos(rad), ey = CY - rr2*Math.sin(rad);
  s += `<line x1="${CX}" y1="${CY}" x2="${(CX + R*Math.cos(rad)).toFixed(2)}" y2="${(CY - R*Math.sin(rad)).toFixed(2)}" stroke="var(--c-orange)" stroke-width="3"/>`;
  s += `<circle cx="${ex.toFixed(2)}" cy="${ey.toFixed(2)}" r="8" fill="var(--c-orange)" stroke="#fff" stroke-width="2.5"><animate attributeName="r" values="8;12;8" dur="1.5s" repeatCount="indefinite"/></circle>`;
  s += `<circle cx="${CX}" cy="${CY}" r="5" fill="#333"/>`;
  s += `<text x="${CX-18}" y="${CY+18}" font-size="14" font-weight="700" fill="#333">O</text>`;

  s += `<foreignObject x="14" y="8" width="250" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:16px;color:#2a6df4;font-weight:700;white-space:nowrap">${T('\\theta = ' + theta + '^\\circ')}</div></foreignObject>`;
  s += `<foreignObject x="336" y="4" width="250" height="54"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:flex-end;height:100%;font-size:16px;color:#e67e22;font-weight:700;white-space:nowrap">${T('= ' + radTex(theta))}</div></foreignObject>`;

  s += `<line x1="${BX0}" y1="${BY}" x2="${BX1+10}" y2="${BY}" stroke="#ccc" stroke-width="2"/>`;
  for(let k=0;k<=7;k++){
    const x = ux(k);
    s += `<line x1="${x.toFixed(1)}" y1="${BY-8}" x2="${x.toFixed(1)}" y2="${BY+8}" stroke="#bbb" stroke-width="1.5"/>`;
    s += `<text x="${x.toFixed(1)}" y="${BY+26}" text-anchor="middle" font-size="11" fill="#aaa">${k}</text>`;
  }
  [{v:Math.PI,l:'\\pi'},{v:2*Math.PI,l:'2\\pi'}].forEach(m=>{
    const x = ux(m.v);
    s += `<line x1="${x.toFixed(1)}" y1="${BY-24}" x2="${x.toFixed(1)}" y2="${BY+4}" stroke="var(--c-blue)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    s += `<foreignObject x="${(x-24).toFixed(1)}" y="${BY-50}" width="48" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#2a6df4;font-weight:700;text-align:center">${T(m.l)}</div></foreignObject>`;
  });
  const bw = ux(Math.min(u, UMAX)) - ux(0);
  s += `<rect x="${ux(0)}" y="${BY-13}" width="${Math.max(0,bw).toFixed(1)}" height="26" fill="rgba(230,126,34,0.28)" stroke="var(--c-orange)" stroke-width="1.5" rx="4"/>`;
  s += `<rect x="${ux(0)}" y="${BY-13}" width="${(ux(1)-ux(0)).toFixed(1)}" height="26" fill="rgba(40,167,69,0.3)" stroke="var(--c-green)" stroke-width="1.5" rx="4"/>`;
  s += `<foreignObject x="${BX0}" y="${BY+34}" width="480" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#888;white-space:nowrap">弧の長さ ${T('\\div')} 半径 ${T('= ' + u.toFixed(4))} ${T('\\;\\text{（半径 }r\\text{ の何個分か）}')}</div></foreignObject>`;

  svg.innerHTML = s;

  const conv = `${theta}^\\circ = ${theta} \\times \\dfrac{\\pi}{180} = ${radTex(theta)}`;
  document.getElementById('live-calc').innerHTML =
    T(conv) + '<br>' +
    T(`${radTex(theta)} = ${(rad).toFixed(4)}`) + '<br>' +
    `<span style="color:var(--c-purple);font-weight:600;">弧の長さは半径のおよそ ${u.toFixed(3)} 個分です</span>`;
}

function buildPresets(){
  const row = document.getElementById('preset-row');
  presets.forEach(p=>{
    const b = document.createElement('button');
    b.className = 'btn small';
    b.innerHTML = `${p.tag} ${T(p.tex)}`;
    b.addEventListener('click', ()=>{
      document.querySelectorAll('#preset-row .btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      runAnim(p.deg);
    });
    row.appendChild(b);
  });
}

function setValue(d){
  theta = Math.round(Math.max(-405, Math.min(405, d)));
  document.getElementById('th-slider').value = theta;
  document.getElementById('th-value').textContent = theta + '°';
  draw();
}

function setupSlider(){
  const slider = document.getElementById('th-slider');
  slider.addEventListener('input', ()=>{
    if(animId){ cancelAnimationFrame(animId); animId = null; }
    document.querySelectorAll('#preset-row .btn').forEach(x=>x.classList.remove('active'));
    setValue(parseFloat(slider.value));
  });
}

function runAnim(target){
  if(animId){ cancelAnimationFrame(animId); animId = null; }
  const duration = Math.min(3200, 700 + Math.abs(target)*4);
  let startTime = null;
  function animate(ts){
    if(!startTime) startTime = ts;
    const progress = Math.min((ts - startTime) / duration, 1);
    const eased = progress < 0.5 ? 2*progress*progress : 1 - Math.pow(-2*progress+2, 2)/2;
    setValue(target * eased);
    if(progress < 1) animId = requestAnimationFrame(animate); else animId = null;
  }
  animId = requestAnimationFrame(animate);
}

function setupAnimation(){
  document.getElementById('anim-btn').addEventListener('click', ()=>{ runAnim(theta); });
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
</body>
</html>
