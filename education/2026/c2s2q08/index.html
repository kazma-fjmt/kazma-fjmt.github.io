<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>判別式による共有点の判定</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step {
    padding: .75rem .25rem; border-bottom: 1px dashed #eee;
    transition: background .2s ease; animation: fadeIn .3s ease;
  }
  .step:last-child { border-bottom: none; }
  .step.current {
    background: #f0f5ff; border-radius: 8px; padding: .75rem;
    margin: .25rem -.5rem; border-bottom: none;
  }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; margin: 1rem 0 0;
  }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .note {
    background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px;
    padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem;
  }
  .live-calc {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto;
  }
  .live-calc .katex { font-size: 1.1rem; }

  .tab-row {
    display: flex; gap: .5rem; margin: 1rem 0 .5rem;
  }
  .tab-btn {
    appearance: none; border: 2px solid #d4dbeb; background: #fff;
    color: var(--fg); font-size: .95rem; font-weight: 600;
    padding: .6rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 44px; font-family: inherit; user-select: none; flex: 1;
    text-align: center; transition: all .2s ease;
  }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab-btn:active { transform: scale(.97); }

  .slider-group {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0;
  }
  .slider-row {
    display: flex; align-items: center; gap: .75rem; margin: .5rem 0;
  }
  .slider-row label { min-width: 120px; font-weight: 600; font-size: .95rem; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .val { min-width: 40px; text-align: right; font-weight: 600; font-size: .95rem; }

  .disc-display {
    text-align: center; font-size: 1.15rem; font-weight: 700;
    padding: .75rem; border-radius: 10px; margin: .5rem 0;
    transition: all .3s ease;
  }
  .disc-display.positive { background: #e8f5e9; border: 2px solid var(--c-green); color: var(--c-green); }
  .disc-display.zero { background: #fff3e0; border: 2px solid var(--c-orange); color: var(--c-orange); }
  .disc-display.negative { background: #ffebee; border: 2px solid var(--c-red); color: var(--c-red); }

  .definition-box {
    background: #f0f0ff; border: 1px solid #c0c0e0; border-radius: 10px;
    padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>判別式による共有点の判定</h1>
  <p class="subtitle">判別式を使って、共有点の個数を交点を求めずに判定しましょう。</p>

  <h2>判別式と共有点の個数</h2>
  <p>円と直線の方程式を連立して得られる2次方程式の<strong>判別式 D</strong> で、共有点の個数が分かります。</p>
  <div class="formula-box" id="formula-disc"></div>

  <div class="definition-box" id="def-tangent"></div>

  <h2>例題の解法</h2>
  <div class="tab-row">
    <button class="tab-btn active" id="tab1">例題4(1)</button>
    <button class="tab-btn" id="tab2">例題4(2)</button>
  </div>
  <div id="example-desc"></div>
  <div class="walkthrough" id="wt-example"></div>
  <div class="controls-row">
    <button class="btn" id="we-prev" disabled>&larr; 前へ</button>
    <span class="step-counter" id="we-counter"></span>
    <button class="btn primary" id="we-next">次へ &rarr;</button>
  </div>

  <h2>判別式を確かめよう</h2>
  <p>円の半径と直線の傾き・切片を変えて、判別式の値と共有点の個数を確認しましょう。</p>

  <div class="slider-group">
    <div class="slider-row">
      <label id="lbl-r2"></label>
      <input type="range" id="sl-r2" min="1" max="20" step="1" value="7">
      <span class="val" id="val-r2">7</span>
    </div>
    <div class="slider-row">
      <label>傾き（<span id="lbl-a"></span>）</label>
      <input type="range" id="sl-a" min="-3" max="3" step="0.25" value="1">
      <span class="val" id="val-a">1</span>
    </div>
    <div class="slider-row">
      <label>切片（<span id="lbl-b"></span>）</label>
      <input type="range" id="sl-b" min="-10" max="10" step="0.5" value="-1">
      <span class="val" id="val-b">-1</span>
    </div>
  </div>

  <div class="live-calc" id="live-eq"></div>
  <div class="live-calc" id="live-quadratic"></div>
  <div class="live-calc" id="live-disc"></div>
  <div id="disc-box" class="disc-display positive"></div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="live-calc" id="live-points"></div>

  <div class="note" id="note-summary"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}
if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{if(window.katex)init();else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}});

function init(){
  document.getElementById('formula-disc').innerHTML =
    T('D > 0') + ' &rarr; <span style="color:var(--c-green);font-weight:700">共有点2個</span>（2点で交わる）<br>' +
    T('D = 0') + ' &rarr; <span style="color:var(--c-orange);font-weight:700">共有点1個</span>（接する）<br>' +
    T('D < 0') + ' &rarr; <span style="color:var(--c-red);font-weight:700">共有点0個</span>（交わらない）';

  document.getElementById('def-tangent').innerHTML =
    '<strong>用語：</strong><br>' +
    '円と直線が1点のみを共有するとき、その直線を円の<strong>接線</strong>（tangent line）といい、' +
    'その共有点を<strong>接点</strong>（tangent point）といいます。';

  document.getElementById('note-summary').innerHTML =
    '<strong>まとめ：</strong><br>' +
    '共有点の個数だけを知りたいときは、実際に解を求めなくても<strong>判別式 D</strong> の符号だけで判定できます。<br>' +
    '中心から直線までの距離 ' + T('d') + ' と半径 ' + T('r') + ' の関係でも判定できます：' +
    T('d < r') + ' &rarr; 2個、' + T('d = r') + ' &rarr; 1個、' + T('d > r') + ' &rarr; 0個';

  tex('r^2 =', document.getElementById('lbl-r2'));
  document.getElementById('lbl-a').innerHTML = T('a');
  document.getElementById('lbl-b').innerHTML = T('b');

  initExamples();
  initSliders();
}

// Example walkthroughs
const examples = {
  1: {
    desc: 'x^2+y^2=7\\;\\text{と}\\;y=x-1\\;\\text{の共有点の個数}',
    steps: [
      { label: 'Step 1: 連立方程式', formula: '\\begin{cases} x^2 + y^2 = 7 \\\\ y = x - 1 \\end{cases}' },
      { label: 'Step 2: y を円の式に代入', formula: 'x^2 + (x-1)^2 = 7' },
      { label: 'Step 3: 展開', formula: 'x^2 + x^2 - 2x + 1 = 7' },
      { label: 'Step 4: 整理', formula: '2x^2 - 2x - 6 = 0' },
      { label: 'Step 5: 2で割る', formula: 'x^2 - x - 3 = 0' },
      { label: 'Step 6: 判別式を計算', formula: 'D = (-1)^2 - 4 \\cdot 1 \\cdot (-3) = 1 + 12 = 13' },
      { label: 'Step 7: 判定', formula: 'D = 13 > 0 \\quad\\Rightarrow\\quad \\text{共有点は \\textbf{2個}}' },
    ]
  },
  2: {
    desc: 'x^2+y^2=8\\;\\text{と}\\;y=x-4\\;\\text{の共有点の個数}',
    steps: [
      { label: 'Step 1: 連立方程式', formula: '\\begin{cases} x^2 + y^2 = 8 \\\\ y = x - 4 \\end{cases}' },
      { label: 'Step 2: y を円の式に代入', formula: 'x^2 + (x-4)^2 = 8' },
      { label: 'Step 3: 展開', formula: 'x^2 + x^2 - 8x + 16 = 8' },
      { label: 'Step 4: 整理', formula: '2x^2 - 8x + 8 = 0' },
      { label: 'Step 5: 2で割る', formula: 'x^2 - 4x + 4 = 0' },
      { label: 'Step 6: 判別式を計算', formula: 'D = (-4)^2 - 4 \\cdot 1 \\cdot 4 = 16 - 16 = 0' },
      { label: 'Step 7: 判定', formula: 'D = 0 \\quad\\Rightarrow\\quad \\text{共有点は \\textbf{1個}（接する）}' },
      { label: 'Step 8: 接点を求める', formula: 'x = 2,\\;y = 2-4 = -2 \\quad\\Rightarrow\\quad \\text{接点}\\;(2,\\,-2)' },
    ]
  }
};

let currentTab = 1;
let curStep = 0;

function initExamples(){
  const tab1 = document.getElementById('tab1');
  const tab2 = document.getElementById('tab2');

  tab1.addEventListener('click', () => { currentTab = 1; curStep = 0; tab1.classList.add('active'); tab2.classList.remove('active'); renderExample(); });
  tab2.addEventListener('click', () => { currentTab = 2; curStep = 0; tab1.classList.remove('active'); tab2.classList.add('active'); renderExample(); });

  document.getElementById('we-prev').addEventListener('click', () => { if(curStep > 0){ curStep--; renderExample(); } });
  document.getElementById('we-next').addEventListener('click', () => { const ex = examples[currentTab]; if(curStep < ex.steps.length - 1){ curStep++; renderExample(); } });

  renderExample();
}

function renderExample(){
  const ex = examples[currentTab];
  const desc = document.getElementById('example-desc');
  desc.innerHTML = `<p>${T(ex.desc)}</p>`;

  const container = document.getElementById('wt-example');
  const counter = document.getElementById('we-counter');
  const prevBtn = document.getElementById('we-prev');
  const nextBtn = document.getElementById('we-next');

  let html = '';
  for(let i = 0; i <= curStep; i++){
    html += `<div class="step ${i===curStep?'current':''}"><div class="label">${ex.steps[i].label}</div><div class="formula-line">${T(ex.steps[i].formula)}</div></div>`;
  }
  container.innerHTML = html;
  counter.textContent = `${curStep+1} / ${ex.steps.length}`;
  prevBtn.disabled = curStep === 0;
  nextBtn.disabled = curStep === ex.steps.length - 1;
}

function initSliders(){
  const slR2 = document.getElementById('sl-r2');
  const slA = document.getElementById('sl-a');
  const slB = document.getElementById('sl-b');

  function update(){
    const r2 = parseInt(slR2.value);
    const a = parseFloat(slA.value);
    const b = parseFloat(slB.value);

    document.getElementById('val-r2').textContent = r2;
    document.getElementById('val-a').textContent = a;
    document.getElementById('val-b').textContent = b;

    const r = Math.sqrt(r2);
    const fmt = v => Number.isInteger(v) ? `${v}` : v.toFixed(2);

    // Line: y = ax + b
    let lineStr = 'y = ';
    if(a === 0) lineStr += fmt(b);
    else{
      if(a === 1) lineStr += 'x';
      else if(a === -1) lineStr += '-x';
      else lineStr += fmt(a) + 'x';
      if(b > 0) lineStr += ' + ' + fmt(b);
      else if(b < 0) lineStr += ' - ' + fmt(-b);
    }

    tex(`x^2+y^2=${r2},\\quad ${lineStr}`, document.getElementById('live-eq'), true);

    // Substitute: x^2 + (ax+b)^2 = r2
    // (1+a^2)x^2 + 2abx + (b^2 - r2) = 0
    const coefA = 1 + a*a;
    const coefB = 2*a*b;
    const coefC = b*b - r2;

    let quadStr = '';
    if(coefA === 1) quadStr = 'x^2';
    else quadStr = fmt(coefA) + 'x^2';
    if(coefB > 0) quadStr += ' + ' + fmt(coefB) + 'x';
    else if(coefB < 0) quadStr += ' - ' + fmt(-coefB) + 'x';
    if(coefC > 0) quadStr += ' + ' + fmt(coefC);
    else if(coefC < 0) quadStr += ' - ' + fmt(-coefC);
    quadStr += ' = 0';

    tex(quadStr, document.getElementById('live-quadratic'), true);

    const disc = coefB*coefB - 4*coefA*coefC;

    tex(`D = (${fmt(coefB)})^2 - 4 \\cdot ${fmt(coefA)} \\cdot (${fmt(coefC)}) = ${fmt(disc)}`, document.getElementById('live-disc'), true);

    const discBox = document.getElementById('disc-box');
    const ptEl = document.getElementById('live-points');
    let intersections = [];

    if(disc > 0.001){
      discBox.className = 'disc-display positive';
      discBox.innerHTML = T(`D = ${fmt(disc)} > 0`) + ' &rarr; <strong>共有点 2個</strong>';
      const sqD = Math.sqrt(disc);
      const x1 = (-coefB + sqD) / (2*coefA);
      const x2 = (-coefB - sqD) / (2*coefA);
      const y1 = a*x1 + b;
      const y2 = a*x2 + b;
      intersections = [{x:x1,y:y1},{x:x2,y:y2}];
      ptEl.innerHTML = T(`(${fmt(x1)},\\;${fmt(y1)}),\\;(${fmt(x2)},\\;${fmt(y2)})`);
    } else if(Math.abs(disc) <= 0.001){
      discBox.className = 'disc-display zero';
      discBox.innerHTML = T('D = 0') + ' &rarr; <strong>共有点 1個（接線）</strong>';
      const x1 = -coefB / (2*coefA);
      const y1 = a*x1 + b;
      intersections = [{x:x1,y:y1}];
      ptEl.innerHTML = T(`\\text{接点：}\\;(${fmt(x1)},\\;${fmt(y1)})`);
    } else {
      discBox.className = 'disc-display negative';
      discBox.innerHTML = T(`D = ${fmt(disc)} < 0`) + ' &rarr; <strong>共有点 0個</strong>';
      intersections = [];
      ptEl.innerHTML = T('\\text{共有点なし}');
    }

    drawGraph(r, a, b, intersections, disc);
  }

  slR2.addEventListener('input', update);
  slA.addEventListener('input', update);
  slB.addEventListener('input', update);
  update();
}

function drawGraph(r, slope, intercept, intersections, disc){
  const svg = document.getElementById('graph');
  const W = 600, H = 600, ox = 300, oy = 300, scale = 45;

  function px(x){ return ox + x * scale; }
  function py(y){ return oy - y * scale; }

  let html = '';

  // Grid
  for(let i = -6; i <= 6; i++){
    html += `<line x1="${px(i)}" y1="10" x2="${px(i)}" y2="${H-10}" stroke="#eee"/>`;
    html += `<line x1="10" y1="${py(i)}" x2="${W-10}" y2="${py(i)}" stroke="#eee"/>`;
  }

  // Axes
  html += `<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#999"/></marker></defs>`;
  html += `<line x1="10" y1="${oy}" x2="${W-10}" y2="${oy}" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>`;
  html += `<line x1="${ox}" y1="${H-10}" x2="${ox}" y2="10" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>`;
  html += `<foreignObject x="${W-26}" y="${oy-22}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('x')}</div></foreignObject>`;
  html += `<foreignObject x="${ox+6}" y="${Math.max(8,2)}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('y')}</div></foreignObject>`;
  html += `<text x="${ox+5}" y="${oy+18}" font-size="12" fill="#999">O</text>`;

  // Axis labels
  for(let i = -5; i <= 5; i++){
    if(i === 0) continue;
    html += `<text x="${px(i)}" y="${oy+18}" font-size="11" fill="#aaa" text-anchor="middle">${i}</text>`;
    html += `<text x="${ox-14}" y="${py(i)+4}" font-size="11" fill="#aaa" text-anchor="end">${i}</text>`;
  }

  // Circle
  const rPx = r * scale;
  html += `<circle cx="${px(0)}" cy="${py(0)}" r="${rPx}" fill="rgba(42,109,244,0.06)" stroke="var(--c-blue)" stroke-width="2.5"/>`;
  html += `<circle cx="${px(0)}" cy="${py(0)}" r="4" fill="var(--c-blue)" stroke="#fff" stroke-width="1.5"/>`;

  // Line
  const lineColor = disc > 0.001 ? 'var(--c-green)' : (Math.abs(disc) <= 0.001 ? 'var(--c-orange)' : 'var(--c-red)');
  const xLeft = -6, xRight = 6;
  const yLeft = slope * xLeft + intercept;
  const yRight = slope * xRight + intercept;
  html += `<line x1="${px(xLeft)}" y1="${py(yLeft)}" x2="${px(xRight)}" y2="${py(yRight)}" stroke="${lineColor}" stroke-width="2.5"/>`;

  // Distance from center to line
  const dist = Math.abs(intercept) / Math.sqrt(slope*slope + 1);
  const fpX = -slope * intercept / (slope*slope + 1);
  const fpY = intercept / (slope*slope + 1);

  // Perpendicular from center to line
  html += `<line x1="${px(0)}" y1="${py(0)}" x2="${px(fpX)}" y2="${py(fpY)}" stroke="var(--c-purple)" stroke-width="1.5" stroke-dasharray="5,3"/>`;

  // Right angle mark at foot
  if(dist > 0.1){
    const fdx = -fpX, fdy = -fpY;
    const fl = Math.sqrt(fdx*fdx + fdy*fdy);
    if(fl > 0.1){
      const ux = fdx/fl, uy = fdy/fl;
      const vx = -uy, vy = ux;
      const s = 0.15;
      html += `<polyline points="${px(fpX+ux*s)},${py(fpY+uy*s)} ${px(fpX+ux*s+vx*s)},${py(fpY+uy*s+vy*s)} ${px(fpX+vx*s)},${py(fpY+vy*s)}" fill="none" stroke="var(--c-purple)" stroke-width="1.5"/>`;
    }
  }

  // d label
  html += `<foreignObject x="${px(fpX/2)+10}" y="${py(fpY/2)-22}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-purple);font-weight:600">${T('d')}</div></foreignObject>`;

  // Radius line (to show r vs d comparison)
  const rAngle = Math.atan2(fpY, fpX);
  const rEndX = r * Math.cos(rAngle + 0.5);
  const rEndY = r * Math.sin(rAngle + 0.5);
  html += `<line x1="${px(0)}" y1="${py(0)}" x2="${px(rEndX)}" y2="${py(rEndY)}" stroke="var(--c-blue)" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>`;
  html += `<foreignObject x="${px(rEndX/2)-20}" y="${py(rEndY/2)-9}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-blue);font-weight:600">${T('r')}</div></foreignObject>`;

  // Intersection points
  intersections.forEach((pt, i) => {
    const ptColor = intersections.length === 1 ? 'var(--c-orange)' : 'var(--c-red)';
    html += `<circle cx="${px(pt.x)}" cy="${py(pt.y)}" r="7" fill="${ptColor}" stroke="#fff" stroke-width="2">`;
    html += `<animate attributeName="r" values="7;10;7" dur="1.5s" repeatCount="indefinite"/></circle>`;
    const label = intersections.length === 1 ? '接点' : '';
    if(label) html += `<text x="${px(pt.x)+12}" y="${py(pt.y)-12}" font-size="13" font-weight="700" fill="${ptColor}">${label}</text>`;
  });

  // D indicator area - shade between circle and line for tangent
  if(Math.abs(disc) <= 0.001){
    html += `<circle cx="${px(intersections[0].x)}" cy="${py(intersections[0].y)}" r="18" fill="none" stroke="var(--c-orange)" stroke-width="2" stroke-dasharray="3,3" opacity="0.6">`;
    html += `<animate attributeName="r" values="18;25;18" dur="2s" repeatCount="indefinite"/></circle>`;
  }

  svg.innerHTML = html;
}
</script>
</body>
</html>
