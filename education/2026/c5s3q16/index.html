<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>x 軸をまたぐ曲線と面積</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0; }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; margin: .75rem 0; overflow: hidden; touch-action: none; position: relative; }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* draw() replaces the SVG contents, which would orphan a touch sequence that
     started on a child; keep hit-testing on the wrapper so the drag survives */
  .svg-container > svg { pointer-events: none; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto; }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step > .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step > .formula-line { text-align: left; overflow-x: auto; }
  .step > .formula-line .katex { font-size: 1.05rem; }
  .step.current > .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; gap: .5rem; margin: .75rem 0; }
  .tab { appearance: none; flex: 1; border: 1px solid #d4dbeb; background: #fff; color: var(--accent); font-size: .95rem; font-weight: 600; padding: .7rem .5rem; border-radius: 10px; min-height: 48px; cursor: pointer; font-family: inherit; user-select: none; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }
  .live-calc > div { margin: .25rem 0; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row { display: flex; align-items: center; gap: 1rem; margin: .75rem 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; }
  .slider-row > label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row > .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; margin: .5rem 0; }

  .table-wrap { overflow-x: auto; margin: .75rem 0; }
  .compare-table { border-collapse: collapse; background: #fff; margin: 0 auto; font-size: .9rem; }
  .compare-table th, .compare-table td { border: 1px solid #e3e3e3; padding: .5rem .8rem; text-align: center; white-space: nowrap; }
  .compare-table .rowhead { background: #f4f7ff; font-weight: 600; }
  .compare-table .mark { background: #fff4e6; color: var(--c-orange); font-weight: 700; }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; justify-content: center; margin: .5rem 0 0; font-size: .88rem; }
  .legend > span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend > span > i { display: inline-block; width: 22px; height: 4px; border-radius: 2px; font-style: normal; }
  .legend > span > b { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>x 軸をまたぐ曲線と面積</h1>
  <p class="subtitle">曲線が軸の上下をまたぐとき、区間を切って符号を入れかえる理由を、動く図で確かめましょう。</p>

  <h2>基本の考え方</h2>
  <p>曲線と <span id="f-x1"></span> 軸で囲まれた図形の面積は、曲線が軸より上にあるか下にあるかで式が変わります。上側の区間はそのまま定積分し、下側の区間は符号を反転させます。</p>
  <div class="formula-box" id="f-rule"></div>
  <p>曲線が途中で <span id="f-x2"></span> 軸をまたぐときは、<strong>またぐ点で区間を切り</strong>、それぞれの符号に合わせた式を足します。まとめて 1 本の定積分にすると、上側と下側が打ち消し合ってしまいます。</p>

  <h2>解く問題</h2>
  <div class="formula-box" id="f-problem"></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <div class="tabs">
    <button class="tab active" id="tab1"></button>
    <button class="tab" id="tab2"></button>
  </div>
  <p id="mode-desc"></p>

  <div class="slider-row">
    <label><span id="lbl-t"></span> =</label>
    <input type="range" id="p-slider" min="-2" max="2" step="0.05" value="-2">
    <span class="slider-val" id="p-value">-2</span>
  </div>
  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">右端まで動かす</button>
    <button class="btn" id="reset-btn">左端に戻す</button>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend" id="legend"></div>
  <p class="drag-hint">図を横にドラッグしても右端 <span id="f-t2"></span> が動きます。</p>

  <div class="live-calc" id="live-calc"></div>
  <div class="note" id="note-box"></div>

  <div class="table-wrap"><table class="compare-table" id="piece-table"></table></div>

  <h2>答え</h2>
  <div class="formula-box" id="result-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=500,mL=54,mR=26,PW=W-mL-mR;
const TT=26,TH=252,BT=332,BH=146;

const CURVES={
  1:{ tex:'y=-x^3+4x',
      f:x=>-x*x*x+4*x, F:x=>-x*x*x*x/4+2*x*x,
      A:-2,B:2,roots:[0],
      XMIN:-2.4,XMAX:2.4,YMIN:-4.6,YMAX:4.6,
      xt:[-2,-1,1,2], yt:[-4,-2,2,4],
      AMIN:-4.8,AMAX:8.8, bt:[-4,-2,2,4,6,8],
      pieces:[{iv:'-2 \\le x \\le 0',sg:'y \\le 0',si:'-4',ar:'4'},
              {iv:'0 \\le x \\le 2',sg:'y \\ge 0',si:'4',ar:'4'}],
      tot:{si:'0',ar:'8'},
      desc:'この曲線は原点について対称なので、左右の 2 つの部分の面積が等しくなります。' },
  2:{ tex:'y=x^3+x^2-2x',
      f:x=>x*x*x+x*x-2*x, F:x=>x*x*x*x/4+x*x*x/3-x*x,
      A:-2,B:1,roots:[0],
      XMIN:-2.4,XMAX:1.4,YMIN:-3.4,YMAX:2.8,
      xt:[-2,-1,1], yt:[-3,-2,-1,1,2],
      AMIN:-0.4,AMAX:3.4, bt:[1,2,3],
      pieces:[{iv:'-2 \\le x \\le 0',sg:'y \\ge 0',si:'\\dfrac{8}{3}',ar:'\\dfrac{8}{3}'},
              {iv:'0 \\le x \\le 1',sg:'y \\le 0',si:'-\\dfrac{5}{12}',ar:'\\dfrac{5}{12}'}],
      tot:{si:'\\dfrac{9}{4}',ar:'\\dfrac{37}{12}'},
      desc:'こちらは左右の部分の広さが違う曲線です。符号つきの合計と面積の合計がはっきり食い違います。' }
};
let mode=1, C=CURVES[1], tVal=-2, animId=null;

function pxc(x){ return mL+(x-C.XMIN)/(C.XMAX-C.XMIN)*PW; }
function pyT(y){ return TT+TH-(y-C.YMIN)/(C.YMAX-C.YMIN)*TH; }
function pyB(v){ return BT+BH-(v-C.AMIN)/(C.AMAX-C.AMIN)*BH; }

function fmt(v){
  if(Math.abs(v)<5e-13) v=0;
  let s=v.toFixed(6);
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  if(s==='-0') s='0';
  return s;
}
function rnd(v){ let r=Math.round(v*1000)/1000; if(Math.abs(r)<5e-13) r=0; return r; }
function eqs(v){ return Math.abs(rnd(v)-v)<1e-11 ? '=' : '\\fallingdotseq'; }

function signedAcc(t){ return C.F(t)-C.F(C.A); }
function areaAcc(t){
  let s=0, prev=C.A;
  for(const r of C.roots){ if(r>prev+1e-12 && r<t-1e-12){ s+=Math.abs(C.F(r)-C.F(prev)); prev=r; } }
  return s+Math.abs(C.F(t)-C.F(prev));
}

function init(){
  const spans={'f-x1':'x','f-x2':'x','f-t2':'t','lbl-t':'t'};
  for(const id in spans) document.getElementById(id).innerHTML=T(spans[id]);
  tex('\\text{上側の区間}: S=\\int_a^b f(x)\\,dx, \\qquad \\text{下側の区間}: S=-\\int_a^b f(x)\\,dx',
      document.getElementById('f-rule'), true);
  tex('\\text{曲線 } y=-x^3+4x \\text{ と } x \\text{ 軸で囲まれた 2 つの部分の面積の和 } S',
      document.getElementById('f-problem'), true);
  tex('S=8', document.getElementById('result-box'), true);
  document.getElementById('tab1').innerHTML=T('y=-x^3+4x');
  document.getElementById('tab2').innerHTML=T('y=x^3+x^2-2x');
  buildLegend();
  initWalkthrough();
  setupControls();
  setupDrag();
  applyMode();
}

function buildLegend(){
  document.getElementById('legend').innerHTML=
    '<span><i style="background:var(--c-purple)"></i>'+T('y=f(x)')+'</span>'+
    '<span><b style="background:#8fb4f7"></b>'+T('x')+' 軸より上（定積分は正）</span>'+
    '<span><b style="background:#f2a6a3"></b>'+T('x')+' 軸より下（定積分は負）</span>'+
    '<span><i style="background:var(--c-orange)"></i>符号つきの合計</span>'+
    '<span><i style="background:var(--c-green)"></i>面積の合計</span>';
}

function initWalkthrough(){
  const steps=[
    { label:'Step 1: 曲線と x 軸の交点を求める',
      formula:'-x^3+4x=-x(x+2)(x-2)=0 \\quad\\text{より}\\quad x=-2,\\ 0,\\ 2' },
    { label:'Step 2: 区間ごとに符号を調べる',
      formula:'-2 \\le x \\le 0 \\text{ では } y \\le 0, \\qquad 0 \\le x \\le 2 \\text{ では } y \\ge 0' },
    { label:'Step 3: 符号に合わせて面積の式を立てる',
      formula:'S=-\\int_{-2}^{0}(-x^3+4x)\\,dx+\\int_{0}^{2}(-x^3+4x)\\,dx' },
    { label:'Step 4: 原始関数を 1 つ選ぶ',
      formula:'\\int(-x^3+4x)\\,dx=-\\dfrac{1}{4}x^4+2x^2+C' },
    { label:'Step 5: 左側の部分（x 軸の下）を計算する',
      formula:'-\\left[-\\dfrac{1}{4}x^4+2x^2\\right]_{-2}^{0}=-\\{0-(-4+8)\\}=4' },
    { label:'Step 6: 右側の部分（x 軸の上）を計算する',
      formula:'\\left[-\\dfrac{1}{4}x^4+2x^2\\right]_{0}^{2}=(-4+8)-0=4' },
    { label:'Step 7: 2 つの部分を足す',
      formula:'S=4+4=8' },
    { label:'Step 8: まとめて 1 本にしてはいけない',
      formula:'\\int_{-2}^{2}(-x^3+4x)\\,dx=0 \\ne S' }
  ];
  let c=0;
  const box=document.getElementById('walkthrough'), cnt=document.getElementById('counter');
  const pv=document.getElementById('prev'), nx=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=c;i++){
      html+='<div class="step '+(i===c?'current':'')+'"><div class="label">'+steps[i].label+
            '</div><div class="formula-line">'+T(steps[i].formula)+'</div></div>';
    }
    box.innerHTML=html;
    cnt.textContent=(c+1)+' / '+steps.length;
    pv.disabled=c===0; nx.disabled=c===steps.length-1;
  }
  pv.addEventListener('click',()=>{ if(c>0){c--;render();} });
  nx.addEventListener('click',()=>{ if(c<steps.length-1){c++;render();} });
  render();
}

function curvePath(){
  let d='';
  for(let i=0;i<=260;i++){
    const x=C.XMIN+(C.XMAX-C.XMIN)*i/260;
    d+=(i===0?'M':'L')+' '+pxc(x).toFixed(2)+' '+pyT(C.f(x)).toFixed(2);
  }
  return d;
}
function fillPath(x0,x1){
  let d='M '+pxc(x0).toFixed(2)+' '+pyT(0).toFixed(2);
  for(let i=0;i<=60;i++){
    const x=x0+(x1-x0)*i/60;
    d+=' L '+pxc(x).toFixed(2)+' '+pyT(C.f(x)).toFixed(2);
  }
  return d+' L '+pxc(x1).toFixed(2)+' '+pyT(0).toFixed(2)+' Z';
}
function accPath(to,fn){
  let d='';
  const n=180;
  for(let i=0;i<=n;i++){
    const t=C.A+(to-C.A)*i/n;
    d+=(i===0?'M':'L')+' '+pxc(t).toFixed(2)+' '+pyB(fn(t)).toFixed(2);
  }
  return d;
}

function draw(){
  const t=tVal, sv=signedAcc(t), av=areaAcc(t);
  const HALO2=' stroke="#fff" stroke-width="2.5" paint-order="stroke" stroke-linejoin="round"';
  const AXL='font-size:14px;color:#999;display:inline-block;background:#fff';
  let s='';

  s+='<rect x="'+mL+'" y="'+TT+'" width="'+PW+'" height="'+TH+'" fill="#fff" stroke="#e3e3e3"/>';
  C.xt.forEach(i=>{ s+='<line x1="'+pxc(i)+'" y1="'+TT+'" x2="'+pxc(i)+'" y2="'+(TT+TH)+'" stroke="#eee"/>'; });
  C.yt.forEach(i=>{ s+='<line x1="'+mL+'" y1="'+pyT(i)+'" x2="'+(mL+PW)+'" y2="'+pyT(i)+'" stroke="#eee"/>'; });

  const bounds=[C.A].concat(C.roots.filter(r=>r>C.A&&r<C.B)).concat([C.B]);
  for(let k=0;k<bounds.length-1;k++){
    const x0=bounds[k], x1=Math.min(bounds[k+1],t);
    if(x1<=x0+1e-9) continue;
    const mid=(x0+x1)/2, up=C.f(mid)>=0;
    s+='<path d="'+fillPath(x0,x1)+'" fill="'+(up?'#8fb4f7':'#f2a6a3')+'" opacity="0.55"/>';
  }
  s+='<line x1="'+mL+'" y1="'+pyT(0)+'" x2="'+(mL+PW)+'" y2="'+pyT(0)+'" stroke="#999" stroke-width="1.5"/>';
  s+='<line x1="'+pxc(0)+'" y1="'+TT+'" x2="'+pxc(0)+'" y2="'+(TT+TH)+'" stroke="#999" stroke-width="1.5"/>';
  s+='<path d="'+curvePath()+'" fill="none" stroke="var(--c-purple)" stroke-width="2.5"/>';

  let tk='';
  C.xt.forEach(i=>{ tk+='<text x="'+pxc(i)+'" y="'+(pyT(0)+16)+'" text-anchor="middle" font-size="11" fill="#aaa"'+HALO2+'>'+i+'</text>'; });
  C.yt.forEach(i=>{ tk+='<text x="'+(mL-8)+'" y="'+(pyT(i)+4)+'" text-anchor="end" font-size="11" fill="#aaa"'+HALO2+'>'+i+'</text>'; });
  s+=tk;

  s+='<line x1="'+pxc(t)+'" y1="'+TT+'" x2="'+pxc(t)+'" y2="'+(BT+BH)+'" stroke="#c9d3e8" stroke-width="1.5" stroke-dasharray="5 5"/>';
  s+='<circle cx="'+pxc(t)+'" cy="'+pyT(C.f(t))+'" r="8" fill="var(--c-orange)" stroke="#fff" stroke-width="2.5"/>';
  s+='<circle cx="'+pxc(t)+'" cy="'+pyT(C.f(t))+'" r="8" fill="none" stroke="var(--c-orange)" stroke-width="2" opacity="0.5">'+
     '<animate attributeName="r" values="8;15;8" dur="1.8s" repeatCount="indefinite"/>'+
     '<animate attributeName="opacity" values="0.5;0;0.5" dur="1.8s" repeatCount="indefinite"/></circle>';
  s+='<foreignObject x="'+(mL+PW-26)+'" y="'+(pyT(0)+2)+'" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="'+AXL+'">'+T('x')+'</div></foreignObject>';
  s+='<foreignObject x="'+(pxc(0)+6)+'" y="'+(TT+2)+'" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="'+AXL+'">'+T('y')+'</div></foreignObject>';

  s+='<rect x="'+mL+'" y="'+BT+'" width="'+PW+'" height="'+BH+'" fill="#fff" stroke="#e3e3e3"/>';
  C.bt.forEach(i=>{ s+='<line x1="'+mL+'" y1="'+pyB(i)+'" x2="'+(mL+PW)+'" y2="'+pyB(i)+'" stroke="#eee"/>'; });
  s+='<line x1="'+mL+'" y1="'+pyB(0)+'" x2="'+(mL+PW)+'" y2="'+pyB(0)+'" stroke="#999" stroke-width="1.5"/>';
  // the two curves coincide wherever f keeps one sign, so draw the green one
  // underneath (wider / offset dashes) and the orange one on top: both stay visible
  s+='<path d="'+accPath(C.B,areaAcc)+'" fill="none" stroke="var(--c-green)" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.35"/>';
  s+='<path d="'+accPath(C.B,signedAcc)+'" fill="none" stroke="var(--c-orange)" stroke-width="1.5" stroke-dasharray="5 5" stroke-dashoffset="5" opacity="0.35"/>';
  s+='<path d="'+accPath(t,areaAcc)+'" fill="none" stroke="var(--c-green)" stroke-width="4.5"/>';
  s+='<path d="'+accPath(t,signedAcc)+'" fill="none" stroke="var(--c-orange)" stroke-width="2.2"/>';
  let tb='';
  C.bt.forEach(i=>{ tb+='<text x="'+(mL-8)+'" y="'+(pyB(i)+4)+'" text-anchor="end" font-size="11" fill="#aaa"'+HALO2+'>'+i+'</text>'; });
  s+=tb;
  s+='<circle cx="'+pxc(t)+'" cy="'+pyB(av)+'" r="9" fill="var(--c-green)" stroke="#fff" stroke-width="2.5"/>';
  s+='<circle cx="'+pxc(t)+'" cy="'+pyB(sv)+'" r="5.5" fill="var(--c-orange)"/>';
  // keep the t label clear of the horizontal axis, which sits low when AMIN is near 0
  let tly=BT+BH-30;
  if(pyB(0)>tly-6 && pyB(0)<BT+BH) tly=Math.max(BT+2,pyB(0)-34);
  s+='<foreignObject x="'+(mL+PW-26)+'" y="'+tly+'" width="26" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="'+AXL+'">'+T('t')+'</div></foreignObject>';
  document.getElementById('graph').innerHTML=s;

  document.getElementById('live-calc').innerHTML=
    '<div>'+T('t '+eqs(t)+' '+fmt(rnd(t)))+'</div>'+
    '<div style="color:var(--c-orange)">'+T('\\int_{'+fmt(C.A)+'}^{t} f(x)\\,dx '+eqs(sv)+' '+fmt(rnd(sv)))+'　符号つきの合計</div>'+
    '<div style="color:var(--c-green)">'+T('\\text{面積の合計} '+eqs(av)+' '+fmt(rnd(av)))+'</div>';
}

function setT(v){
  tVal=Math.round(Math.max(C.A,Math.min(C.B,v))*20)/20;
  document.getElementById('p-slider').value=tVal;
  document.getElementById('p-value').textContent=fmt(tVal);
}

function buildTable(){
  let r1='<tr><th class="rowhead">区間</th>', r2='<tr><th class="rowhead">'+T('f(x)')+' の符号</th>';
  let r3='<tr><th class="rowhead">定積分</th>', r4='<tr><th class="rowhead">面積</th>';
  C.pieces.forEach(p=>{
    r1+='<td>'+T(p.iv)+'</td>'; r2+='<td>'+T(p.sg)+'</td>';
    r3+='<td>'+T(p.si)+'</td>'; r4+='<td>'+T(p.ar)+'</td>';
  });
  r1+='<td class="rowhead">合計</td>'; r2+='<td class="rowhead">—</td>';
  r3+='<td>'+T(C.tot.si)+'</td>'; r4+='<td class="mark">'+T(C.tot.ar)+'</td>';
  document.getElementById('piece-table').innerHTML=r1+'</tr>'+r2+'</tr>'+r3+'</tr>'+r4+'</tr>';
}

function applyMode(){
  C=CURVES[mode];
  document.getElementById('tab1').className='tab'+(mode===1?' active':'');
  document.getElementById('tab2').className='tab'+(mode===2?' active':'');
  const sl=document.getElementById('p-slider');
  sl.min=C.A; sl.max=C.B; sl.step=0.05;
  document.getElementById('mode-desc').innerHTML=
    '右端 '+T('t')+' を左から右へ動かすと、上の図の色つきの部分が広がります。'+
    '下の図はその途中経過で、'+T('x')+' 軸より下では符号つきの合計だけが減っていきます。'+C.desc;
  document.getElementById('note-box').innerHTML=
    T('t')+' を右端まで運ぶと、符号つきの合計は '+T(C.tot.si)+' ですが、面積の合計は '+T(C.tot.ar)+
    ' になります。この差が「区間を切って符号を入れかえる」必要がある理由です。';
  buildTable();
  setT(C.A);
  draw();
}

function stopAnim(){ if(animId){ cancelAnimationFrame(animId); animId=null; } }

function sweep(from,to,duration){
  stopAnim();
  let t0=null;
  setT(from);
  function frame(ts){
    if(!t0) t0=ts;
    const pr=Math.min((ts-t0)/duration,1);
    const e=pr<0.5?2*pr*pr:1-Math.pow(-2*pr+2,2)/2;
    setT(from+(to-from)*e); draw();
    animId = pr<1 ? requestAnimationFrame(frame) : null;
  }
  animId=requestAnimationFrame(frame);
}

function setupControls(){
  const sl=document.getElementById('p-slider');
  sl.addEventListener('input',()=>{ stopAnim(); setT(parseFloat(sl.value)); draw(); });
  document.getElementById('tab1').addEventListener('click',()=>{ stopAnim(); mode=1; applyMode(); });
  document.getElementById('tab2').addEventListener('click',()=>{ stopAnim(); mode=2; applyMode(); });
  document.getElementById('anim-btn').addEventListener('click',()=>sweep(C.A,C.B,3600));
  document.getElementById('reset-btn').addEventListener('click',()=>{ stopAnim(); setT(C.A); draw(); });
}

function setupDrag(){
  const svg=document.getElementById('graph'), wrap=document.getElementById('svg-wrap');
  let dragging=false;
  function toX(cx){
    const rect=svg.getBoundingClientRect();
    const sx=(cx-rect.left)/rect.width*W;
    return C.XMIN+(sx-mL)/PW*(C.XMAX-C.XMIN);
  }
  function startDrag(cx,cy){
    const rect=svg.getBoundingClientRect();
    const sy=(cy-rect.top)/rect.height*H;
    if(sy>TT-16 && sy<BT+BH+16){ stopAnim(); dragging=true; setT(toX(cx)); draw(); }
  }
  function moveDrag(cx){ if(dragging){ setT(toX(cx)); draw(); } }
  function endDrag(){ dragging=false; }
  wrap.addEventListener('mousedown', e=>{ e.preventDefault(); startDrag(e.clientX,e.clientY); });
  window.addEventListener('mousemove', e=>{ if(dragging){ e.preventDefault(); moveDrag(e.clientX); } });
  window.addEventListener('mouseup', endDrag);
  wrap.addEventListener('touchstart', e=>{ const t=e.touches[0]; startDrag(t.clientX,t.clientY); }, {passive:true});
  wrap.addEventListener('touchmove', e=>{ if(dragging){ e.preventDefault(); const t=e.touches[0]; moveDrag(t.clientX); } }, {passive:false});
  wrap.addEventListener('touchend', endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
