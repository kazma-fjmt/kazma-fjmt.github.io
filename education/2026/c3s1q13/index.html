<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>三角関数の相互関係による等式の証明</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; gap: .5rem; margin: .75rem 0; }
  .tab {
    flex: 1; appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: .95rem; font-weight: 600;
    padding: .7rem .5rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; font-family: inherit; user-select: none;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.05rem; }
  .live-calc .row { margin: .3rem 0; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem 1.25rem; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .6rem 1rem; margin: .5rem 0 .75rem; font-size: .9rem; }
  .legend .item { display: flex; align-items: center; gap: .4rem; }
  .legend .sw { width: 26px; height: 5px; border-radius: 3px; flex: none; }
  .legend .sw.dashed { height: 0; border-top: 3px dashed var(--c-orange); border-radius: 0; }

  .slider-row {
    display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem;
  }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.05rem; font-weight: 700; color: var(--accent); min-width: 4.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; margin: .5rem 0; }
  .ok { color: var(--c-green); font-weight: 700; }
  .ng { color: var(--muted); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>三角関数の相互関係による等式の証明</h1>
  <p class="subtitle">3 つの相互関係だけを使って、両辺が等しいことを示しましょう。</p>

  <h2>使える 3 つの関係</h2>
  <div class="formula-box" id="f-rel"></div>
  <p>単位円上の点 <span id="f-p"></span> を見ると、この 3 つはどれも図から読み取れます。</p>

  <h2>証明したい等式</h2>
  <div class="formula-box" id="f-goal"></div>

  <h2>動かして確かめよう</h2>
  <p>円周上の点 <span id="f-p2"></span> をドラッグするか、スライダーで角 <span id="f-th"></span> を変えてみましょう。どの角でも左辺と右辺の値は一致します。</p>
  <p class="drag-hint">円周上の点をタップ＆ドラッグで動かせます</p>

  <div class="slider-row">
    <label><span id="lbl-th"></span> =</label>
    <input type="range" id="th-slider" min="0" max="6.28" step="0.01" value="0.63">
    <span class="slider-val" id="th-value">0.63</span>
  </div>

  <div class="anim-btn-row"><button class="btn primary" id="anim-btn">アニメーション</button></div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend" id="legend"></div>

  <div class="live-calc" id="live-calc"></div>

  <div class="note" id="note-domain"></div>

  <h2>証明のウォークスルー</h2>
  <div class="tabs">
    <button class="tab active" id="tab-1">(1) の証明</button>
    <button class="tab" id="tab-2">(2) の証明</button>
  </div>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <div class="note" id="note-strategy"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=520,ox=250,oy=270,R=170;
function px(x){return ox+x*R;}
function py(y){return oy-y*R;}

let theta = 0.63;
let animId = null;
let dragging = false;

const PROOF1 = [
  { label: 'Step 1: 方針を決める', formula: '\\text{左辺だけを変形して右辺を導く}' },
  { label: 'Step 2: かっこの中を通分', formula: '\\dfrac{1}{\\cos^2\\theta}-1=\\dfrac{1-\\cos^2\\theta}{\\cos^2\\theta}' },
  { label: 'Step 3: 相互関係を使う', formula: '\\sin^2\\theta+\\cos^2\\theta=1 \\;\\Longrightarrow\\; 1-\\cos^2\\theta=\\sin^2\\theta' },
  { label: 'Step 4: 置きかえる', formula: '\\dfrac{1}{\\cos^2\\theta}-1=\\dfrac{\\sin^2\\theta}{\\cos^2\\theta}' },
  { label: 'Step 5: 左辺全体に戻す', formula: '\\dfrac{1}{\\sin^2\\theta}\\left(\\dfrac{1}{\\cos^2\\theta}-1\\right)=\\dfrac{1}{\\sin^2\\theta}\\cdot\\dfrac{\\sin^2\\theta}{\\cos^2\\theta}' },
  { label: 'Step 6: 約分する', formula: '\\dfrac{1}{\\sin^2\\theta}\\cdot\\dfrac{\\sin^2\\theta}{\\cos^2\\theta}=\\dfrac{1}{\\cos^2\\theta}' },
  { label: 'Step 7: 結論', formula: '\\dfrac{1}{\\sin^2\\theta}\\left(\\dfrac{1}{\\cos^2\\theta}-1\\right)=\\dfrac{1}{\\cos^2\\theta} \\quad \\checkmark' }
];

const PROOF2 = [
  { label: 'Step 1: 方針を決める', formula: '\\text{左辺を} \\; \\sin\\theta \\; \\text{と} \\; \\cos\\theta \\; \\text{だけで書き直す}' },
  { label: 'Step 2: 商の関係を使う', formula: '\\tan\\theta=\\dfrac{\\sin\\theta}{\\cos\\theta}, \\qquad \\dfrac{1}{\\tan\\theta}=\\dfrac{\\cos\\theta}{\\sin\\theta}' },
  { label: 'Step 3: 左辺を書き直す', formula: '\\tan\\theta+\\dfrac{1}{\\tan\\theta}=\\dfrac{\\sin\\theta}{\\cos\\theta}+\\dfrac{\\cos\\theta}{\\sin\\theta}' },
  { label: 'Step 4: 通分する', formula: '=\\dfrac{\\sin^2\\theta+\\cos^2\\theta}{\\sin\\theta\\cos\\theta}' },
  { label: 'Step 5: 分子に相互関係を使う', formula: '\\sin^2\\theta+\\cos^2\\theta=1 \\;\\Longrightarrow\\; =\\dfrac{1}{\\sin\\theta\\cos\\theta}' },
  { label: 'Step 6: 結論', formula: '\\tan\\theta+\\dfrac{1}{\\tan\\theta}=\\dfrac{1}{\\sin\\theta\\cos\\theta} \\quad \\checkmark' }
];

let steps = PROOF1;
let cur = 0;

function init(){
  tex('\\sin^2\\theta+\\cos^2\\theta=1, \\qquad \\tan\\theta=\\dfrac{\\sin\\theta}{\\cos\\theta}, \\qquad 1+\\tan^2\\theta=\\dfrac{1}{\\cos^2\\theta}', document.getElementById('f-rel'), true);
  tex('\\begin{aligned} (1) \\quad & \\dfrac{1}{\\sin^2\\theta}\\left(\\dfrac{1}{\\cos^2\\theta}-1\\right)=\\dfrac{1}{\\cos^2\\theta} \\\\[6pt] (2) \\quad & \\tan\\theta+\\dfrac{1}{\\tan\\theta}=\\dfrac{1}{\\sin\\theta\\cos\\theta} \\end{aligned}', document.getElementById('f-goal'), true);

  document.getElementById('f-p').innerHTML = T('\\mathrm{P}(\\cos\\theta,\\ \\sin\\theta)');
  document.getElementById('f-p2').innerHTML = T('\\mathrm{P}');
  document.getElementById('f-th').innerHTML = T('\\theta');
  document.getElementById('lbl-th').innerHTML = T('\\theta');

  document.getElementById('legend').innerHTML =
    '<span class="item"><span class="sw" style="background:var(--c-red)"></span>' + T('\\sin\\theta') + '</span>' +
    '<span class="item"><span class="sw" style="background:var(--c-blue)"></span>' + T('\\cos\\theta') + '</span>' +
    '<span class="item"><span class="sw" style="background:var(--c-green)"></span>' + T('\\tan\\theta') + '</span>' +
    '<span class="item"><span class="sw" style="background:var(--c-orange)"></span>' + T('\\text{半径}=1') + '</span>';

  document.getElementById('note-domain').innerHTML =
    '<strong>分母に注意：</strong>' + T('\\sin\\theta') + ' と ' + T('\\cos\\theta') +
    ' が分母にあるので、' + T('\\sin\\theta\\neq 0') + ' かつ ' + T('\\cos\\theta\\neq 0') +
    ' が前提です。点 ' + T('\\mathrm{P}') + ' が座標軸の上に来る角では、両辺とも値をもちません。';

  document.getElementById('note-strategy').innerHTML =
    '<strong>証明のコツ：</strong>両辺を同時にいじらず、<strong>複雑なほうの辺だけ</strong>を変形して、もう一方の形に近づけます。手がかりは「通分する」「' +
    T('\\tan\\theta') + ' を ' + T('\\sin\\theta') + ' と ' + T('\\cos\\theta') + ' に直す」「' +
    T('\\sin^2\\theta+\\cos^2\\theta=1') + ' を作り出す」の 3 つです。';

  setupTabs();
  setupSlider();
  setupAnimation();
  setupDrag();
  renderSteps();
  draw();
}

function setupTabs(){
  const t1 = document.getElementById('tab-1'), t2 = document.getElementById('tab-2');
  t1.addEventListener('click', function(){ steps = PROOF1; cur = 0; t1.classList.add('active'); t2.classList.remove('active'); renderSteps(); });
  t2.addEventListener('click', function(){ steps = PROOF2; cur = 0; t2.classList.add('active'); t1.classList.remove('active'); renderSteps(); });
  document.getElementById('prev').addEventListener('click', function(){ if(cur > 0){ cur--; renderSteps(); } });
  document.getElementById('next').addEventListener('click', function(){ if(cur < steps.length-1){ cur++; renderSteps(); } });
}

function renderSteps(){
  let html = '';
  for(let i = 0; i <= cur; i++){
    html += '<div class="step ' + (i === cur ? 'current' : '') + '"><div class="label">' + steps[i].label + '</div><div class="formula-line">' + T(steps[i].formula) + '</div></div>';
  }
  document.getElementById('walkthrough').innerHTML = html;
  document.getElementById('counter').textContent = (cur+1) + ' / ' + steps.length;
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === steps.length-1;
}

function fo(x, y, w, h, size, color, html, weight){
  return '<foreignObject x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:' + size + 'px;color:' + color + ';font-weight:' + (weight || 600) + ';white-space:nowrap">' + html + '</div></foreignObject>';
}

function draw(){
  const c = Math.cos(theta), s = Math.sin(theta), t = Math.tan(theta);
  let g = '';

  g += '<line x1="' + px(-1.35) + '" y1="' + oy + '" x2="' + px(1.95) + '" y2="' + oy + '" stroke="#bbb" stroke-width="1.5"/>';
  g += '<line x1="' + ox + '" y1="' + py(1.42) + '" x2="' + ox + '" y2="' + py(-1.42) + '" stroke="#bbb" stroke-width="1.5"/>';
  g += fo(px(1.95)-22, oy-26, 24, 26, 14, '#999', T('x'));
  g += fo(ox+8, py(1.42), 24, 26, 14, '#999', T('y'));

  g += '<line x1="' + px(1) + '" y1="' + py(1.42) + '" x2="' + px(1) + '" y2="' + py(-1.42) + '" stroke="#cfe8d4" stroke-width="2"/>';
  g += '<circle cx="' + ox + '" cy="' + oy + '" r="' + R + '" fill="none" stroke="#dcdcdc" stroke-width="2"/>';

  g += '<path d="M ' + ox + ' ' + oy + ' L ' + px(c) + ' ' + oy + ' L ' + px(c) + ' ' + py(s) + ' Z" fill="rgba(42,109,244,0.08)" stroke="none"/>';

  const ar = 46, large = theta > Math.PI ? 1 : 0;
  g += '<path d="M ' + (ox+ar) + ' ' + oy + ' A ' + ar + ' ' + ar + ' 0 ' + large + ' 0 ' + (ox+ar*c) + ' ' + (oy-ar*s) + '" fill="none" stroke="var(--c-purple)" stroke-width="2.5"/>';
  g += fo(ox + 64*Math.cos(theta/2) - 11, oy - 64*Math.sin(theta/2) - 14, 30, 28, 15, 'var(--c-purple)', T('\\theta'), 700);

  const tanOK = Math.abs(c) > 1e-6 && Math.abs(t) <= 1.4;
  if(tanOK){
    g += '<line x1="' + ox + '" y1="' + oy + '" x2="' + px(1) + '" y2="' + py(t) + '" stroke="#9ecfa8" stroke-width="1.5" stroke-dasharray="5 4"/>';
    g += '<line x1="' + px(1) + '" y1="' + oy + '" x2="' + px(1) + '" y2="' + py(t) + '" stroke="var(--c-green)" stroke-width="4"/>';
    g += '<circle cx="' + px(1) + '" cy="' + py(t) + '" r="5" fill="var(--c-green)"/>';
  } else {
    g += fo(px(1)+10, oy+12, 150, 30, 13, '#aaa', T('\\tan\\theta') + ' は図の外');
  }

  g += '<line x1="' + ox + '" y1="' + oy + '" x2="' + px(c) + '" y2="' + oy + '" stroke="var(--c-blue)" stroke-width="4.5"/>';
  g += '<line x1="' + px(c) + '" y1="' + oy + '" x2="' + px(c) + '" y2="' + py(s) + '" stroke="var(--c-red)" stroke-width="4.5"/>';

  g += '<line x1="' + ox + '" y1="' + oy + '" x2="' + px(c) + '" y2="' + py(s) + '" stroke="var(--c-orange)" stroke-width="2.5"/>';

  g += '<circle cx="' + px(c) + '" cy="' + py(s) + '" r="8" fill="var(--c-orange)" stroke="#fff" stroke-width="2.5"/>';
  g += '<circle cx="' + px(c) + '" cy="' + py(s) + '" r="8" fill="none" stroke="var(--c-orange)" stroke-width="2.5"><animate attributeName="r" values="8;16;8" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0;0.9" dur="1.6s" repeatCount="indefinite"/></circle>';
  g += fo(Math.max(2, Math.min(px(c) + 26*c - 9, W-30)), Math.max(2, py(s) - 26*s - 11), 30, 26, 14, 'var(--c-orange)', T('\\mathrm{P}'), 700);

  g += '<circle cx="' + ox + '" cy="' + oy + '" r="4" fill="#666"/>';
  g += '<text x="' + (ox-16) + '" y="' + (oy+19) + '" font-size="13" fill="#666" font-weight="700">O</text>';

  g += fo(14, 14, 270, 32, 15, 'var(--c-purple)', T('\\sin^2\\theta+\\cos^2\\theta=1'), 700);

  document.getElementById('graph').innerHTML = g;
  updateLive(c, s, t);
}

function num(v){ return v.toFixed(3); }

function updateLive(c, s, t){
  const el = document.getElementById('live-calc');
  const deg = (theta*180/Math.PI).toFixed(1);
  let html = '<div class="row">' + T('\\theta = ' + theta.toFixed(2) + ' \\;(' + deg + '^\\circ)') + '</div>';
  html += '<div class="row">' + T('\\sin\\theta = ' + num(s) + ', \\quad \\cos\\theta = ' + num(c)) + '</div>';

  if(Math.abs(s) < 0.04 || Math.abs(c) < 0.04){
    html += '<div class="row ng">' + T('\\sin\\theta') + ' か ' + T('\\cos\\theta') + ' が 0 に近いため、両辺の値は定義できません</div>';
    el.innerHTML = html;
    return;
  }

  html += '<div class="row">' + T('\\tan\\theta = ' + num(t)) + '</div>';

  const l1 = (1/(s*s)) * (1/(c*c) - 1), r1 = 1/(c*c);
  const l2 = t + 1/t, r2 = 1/(s*c);
  const eq1 = Math.abs(l1-r1) < 1e-6 * Math.max(1, Math.abs(r1));
  const eq2 = Math.abs(l2-r2) < 1e-6 * Math.max(1, Math.abs(r2));

  html += '<div class="row">' + T('(1) \\quad \\text{左辺} = ' + num(l1) + ', \\quad \\text{右辺} = ' + num(r1)) + ' <span class="ok">' + (eq1 ? '一致' : '') + '</span></div>';
  html += '<div class="row">' + T('(2) \\quad \\text{左辺} = ' + num(l2) + ', \\quad \\text{右辺} = ' + num(r2)) + ' <span class="ok">' + (eq2 ? '一致' : '') + '</span></div>';

  el.innerHTML = html;
}

function setTheta(v){
  let x = v % (2*Math.PI);
  if(x < 0) x += 2*Math.PI;
  theta = x;
  document.getElementById('th-slider').value = Math.min(6.28, theta);
  document.getElementById('th-value').textContent = theta.toFixed(2);
  draw();
}

function setupSlider(){
  const sl = document.getElementById('th-slider');
  sl.addEventListener('input', function(){
    if(animId){ cancelAnimationFrame(animId); animId = null; }
    theta = parseFloat(sl.value);
    document.getElementById('th-value').textContent = theta.toFixed(2);
    draw();
  });
}

function setupAnimation(){
  document.getElementById('anim-btn').addEventListener('click', function(){
    if(animId){ cancelAnimationFrame(animId); animId = null; }
    const start = 0.05, end = 6.23, dur = 7000;
    let t0 = null;
    function frame(ts){
      if(!t0) t0 = ts;
      const p = Math.min((ts - t0)/dur, 1);
      setTheta(start + (end - start)*p);
      if(p < 1) animId = requestAnimationFrame(frame); else animId = null;
    }
    animId = requestAnimationFrame(frame);
  });
}

function setupDrag(){
  const svg = document.getElementById('graph');
  const wrap = document.getElementById('svg-wrap');

  function toMath(cx, cy){
    const rect = svg.getBoundingClientRect();
    const sx = (cx - rect.left) / rect.width * W;
    const sy = (cy - rect.top) / rect.height * H;
    return { x: (sx - ox)/R, y: (oy - sy)/R };
  }
  function apply(cx, cy){
    const m = toMath(cx, cy);
    if(m.x === 0 && m.y === 0) return;
    if(animId){ cancelAnimationFrame(animId); animId = null; }
    setTheta(Math.atan2(m.y, m.x));
  }
  function startDrag(cx, cy){
    const m = toMath(cx, cy);
    const d = Math.sqrt(m.x*m.x + m.y*m.y);
    if(d > 0.25 && d < 1.7){ dragging = true; apply(cx, cy); }
  }

  wrap.addEventListener('mousedown', function(e){ e.preventDefault(); startDrag(e.clientX, e.clientY); });
  window.addEventListener('mousemove', function(e){ if(dragging){ e.preventDefault(); apply(e.clientX, e.clientY); } });
  window.addEventListener('mouseup', function(){ dragging = false; });

  wrap.addEventListener('touchstart', function(e){ const t = e.touches[0]; startDrag(t.clientX, t.clientY); }, {passive:true});
  wrap.addEventListener('touchmove', function(e){ if(dragging){ e.preventDefault(); const t = e.touches[0]; apply(t.clientX, t.clientY); } }, {passive:false});
  wrap.addEventListener('touchend', function(){ dragging = false; });
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
</body>
