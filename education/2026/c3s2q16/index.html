<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>三角関数の合成</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0; }
  .formula-box .katex { font-size: 1.15rem; }

  .svg-container { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative; }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* draw() replaces the SVG contents, which would orphan a touch sequence that
     started on a child; keep hit-testing on the wrapper so the drag survives */
  .svg-container > svg { pointer-events: none; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto; }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn { appearance: none; border: 1px solid #d4dbeb; background: #fff; color: var(--accent);
    font-size: 1rem; font-weight: 600; padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; gap: .5rem; margin: .75rem 0; }
  .tab { flex: 1; appearance: none; border: 1px solid #d4dbeb; background: #fff; color: var(--accent);
    font-size: 1rem; font-weight: 600; padding: .75rem .5rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; font-family: inherit; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.05rem; }
  .live-calc .row { margin: .35rem 0; }

  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row { display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.05rem; font-weight: 700; color: var(--accent); min-width: 4.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .75rem; flex-wrap: wrap; margin: .5rem 0; }

  .legend { display: flex; flex-wrap: wrap; gap: .4rem 1.25rem; justify-content: center; margin: .5rem 0 0; font-size: .88rem; }
  .legend > span.key { display: inline-flex; align-items: center; gap: .35rem; }
  .legend i { width: 16px; height: 4px; border-radius: 2px; display: inline-block; }
  .legend i.sq { width: 14px; height: 14px; border-radius: 3px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>三角関数の合成</h1>
  <p class="subtitle">係数を座標とする点をとると、2 つの波の和が 1 つの正弦波にまとまることを確かめましょう。</p>

  <h2>合成のしくみ</h2>
  <p>座標が <span id="f-pab"></span> である点 <span id="f-pp"></span> をとり、線分 <span id="f-op"></span> の長さを <span id="f-r"></span>、<span id="f-op2"></span> が <span id="f-xax"></span> 軸の正の向きとなす角を <span id="f-al"></span> とします。すると <span id="f-arcosa"></span> なので、加法定理がそのまま使えます。</p>
  <div class="formula-box" id="f-derive"></div>
  <div class="formula-box" id="f-main"></div>

  <h2>解法ウォークスルー</h2>
  <div class="tabs">
    <button class="tab active" id="tab0"></button>
    <button class="tab" id="tab1"></button>
  </div>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <p>点 <span id="f-pp2"></span> をドラッグするか、スライダーで係数を変えてください。下の波は <span id="f-sumw"></span> と <span id="f-oneW"></span> を重ねて描いています。いつでもぴったり重なります。</p>

  <div class="slider-row">
    <label><span id="lbl-a"></span> =</label>
    <input type="range" id="a-slider" min="-3.2" max="3.2" step="0.01" value="1.73">
    <span class="slider-val" id="a-value">1.73</span>
  </div>
  <div class="slider-row">
    <label><span id="lbl-b"></span> =</label>
    <input type="range" id="b-slider" min="-3.2" max="3.2" step="0.01" value="1">
    <span class="slider-val" id="b-value">1.00</span>
  </div>

  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">アニメーション</button>
    <button class="btn" id="set0">(1) の値</button>
    <button class="btn" id="set1">(2) の値</button>
  </div>

  <div class="svg-container" id="wrap-a">
    <svg id="plane" viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <p class="drag-hint">赤い点をドラッグすると係数が変わります</p>
  <div class="legend" id="legend-a"></div>

  <div class="svg-container">
    <svg id="wave" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend" id="legend-b"></div>

  <div class="live-calc" id="live-calc"></div>

  <h2>つまずきやすいところ</h2>
  <div class="note" id="note-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const TAU=Math.PI*2;
const WA=600,HA=350,axO=300,ayO=180,SC=45;
const gxO=60,gyO=150,GW=510;

let a=Math.sqrt(3), b=1;
let animId=null, curTab=0;

function ax(x){return axO+x*SC;}
function ay(y){return ayO-y*SC;}
function gx(t){return gxO+t/TAU*GW;}

function fmt(v,d){ let s=v.toFixed(d); if(/^-0(\.0+)?$/.test(s)) s='0'+(s.slice(2)||''); return s; }
function gcd(m,n){return n?gcd(n,m%n):m;}
function piFrac(k){
  if(k===0) return '0';
  const sign=k<0?'-':''; let n=Math.abs(k), d=12; const g=gcd(n,d); n/=g; d/=g;
  const num=(n===1)?'\\pi':(n+'\\pi');
  return (d===1)?(sign+num):(sign+'\\dfrac{'+num+'}{'+d+'}');
}
function angTex(x){
  const k=Math.round(x/(Math.PI/12));
  return (Math.abs(x-k*Math.PI/12)<2e-3)?piFrac(k):fmt(x,3);
}

const PRESETS=[
  {a:Math.sqrt(3), b:1,
   name:'(1)', src:'\\sqrt{3}\\sin\\theta+\\cos\\theta',
   aT:'\\sqrt{3}', bT:'1',
   rC:'r=\\sqrt{(\\sqrt{3})^2+1^2}=\\sqrt{4}=2',
   mid:'2\\left(\\sin\\theta\\cdot\\dfrac{\\sqrt{3}}{2}+\\cos\\theta\\cdot\\dfrac{1}{2}\\right)',
   ang:'\\cos\\alpha=\\dfrac{\\sqrt{3}}{2},\\;\\sin\\alpha=\\dfrac{1}{2}\\;\\Longrightarrow\\;\\alpha=\\dfrac{\\pi}{6}',
   add:'2\\left(\\sin\\theta\\cos\\dfrac{\\pi}{6}+\\cos\\theta\\sin\\dfrac{\\pi}{6}\\right)',
   ans:'2\\sin\\left(\\theta+\\dfrac{\\pi}{6}\\right)'},
  {a:1, b:-1,
   name:'(2)', src:'\\sin\\theta-\\cos\\theta',
   aT:'1', bT:'-1',
   rC:'r=\\sqrt{1^2+(-1)^2}=\\sqrt{2}',
   mid:'\\sqrt{2}\\left(\\sin\\theta\\cdot\\dfrac{1}{\\sqrt{2}}+\\cos\\theta\\cdot\\left(-\\dfrac{1}{\\sqrt{2}}\\right)\\right)',
   ang:'\\cos\\alpha=\\dfrac{1}{\\sqrt{2}},\\;\\sin\\alpha=-\\dfrac{1}{\\sqrt{2}}\\;\\Longrightarrow\\;\\alpha=-\\dfrac{\\pi}{4}',
   add:'\\sqrt{2}\\left(\\sin\\theta\\cos\\left(-\\dfrac{\\pi}{4}\\right)+\\cos\\theta\\sin\\left(-\\dfrac{\\pi}{4}\\right)\\right)',
   ans:'\\sqrt{2}\\sin\\left(\\theta-\\dfrac{\\pi}{4}\\right)'}
];

function init(){
  document.getElementById('f-pab').innerHTML=T('(a,\\;b)');
  document.getElementById('f-pp').innerHTML=T('\\mathrm{P}');
  document.getElementById('f-pp2').innerHTML=T('\\mathrm{P}');
  document.getElementById('f-op').innerHTML=T('\\mathrm{OP}');
  document.getElementById('f-op2').innerHTML=T('\\mathrm{OP}');
  document.getElementById('f-r').innerHTML=T('r');
  document.getElementById('f-xax').innerHTML=T('x');
  document.getElementById('f-al').innerHTML=T('\\alpha');
  document.getElementById('f-arcosa').innerHTML=T('a=r\\cos\\alpha,\\;b=r\\sin\\alpha');
  document.getElementById('f-sumw').innerHTML=T('y=a\\sin\\theta+b\\cos\\theta');
  document.getElementById('f-oneW').innerHTML=T('y=r\\sin(\\theta+\\alpha)');
  document.getElementById('lbl-a').innerHTML=T('a');
  document.getElementById('lbl-b').innerHTML=T('b');

  tex('a\\sin\\theta+b\\cos\\theta=r\\cos\\alpha\\sin\\theta+r\\sin\\alpha\\cos\\theta=r(\\sin\\theta\\cos\\alpha+\\cos\\theta\\sin\\alpha)=r\\sin(\\theta+\\alpha)',
      document.getElementById('f-derive'),true);
  tex('a\\sin\\theta+b\\cos\\theta=\\sqrt{a^2+b^2}\\,\\sin(\\theta+\\alpha),\\qquad \\cos\\alpha=\\dfrac{a}{\\sqrt{a^2+b^2}},\\;\\; \\sin\\alpha=\\dfrac{b}{\\sqrt{a^2+b^2}}',
      document.getElementById('f-main'),true);

  document.getElementById('tab0').innerHTML='(1) '+T('\\sqrt{3}\\sin\\theta+\\cos\\theta');
  document.getElementById('tab1').innerHTML='(2) '+T('\\sin\\theta-\\cos\\theta');

  document.getElementById('legend-a').innerHTML=
    '<span class="key"><i class="sq" style="background:var(--c-red)"></i>'+T('\\mathrm{P}(a,\\,b)')+'</span>'+
    '<span class="key"><i class="sq" style="background:var(--c-red)"></i>'+T('\\mathrm{OP}')+' の長さ '+T('r=\\sqrt{a^2+b^2}')+'</span>'+
    '<span class="key"><i class="sq" style="background:var(--c-blue)"></i>横の太線：'+T('a')+'</span>'+
    '<span class="key"><i class="sq" style="background:var(--c-green)"></i>縦の太線：'+T('b')+'</span>'+
    '<span class="key"><i class="sq" style="background:var(--c-orange)"></i>'+T('\\alpha')+'：'+T('\\mathrm{OP}')+' の向き</span>';
  document.getElementById('legend-b').innerHTML=
    '<span class="key"><i style="background:var(--c-blue)"></i>'+T('y=a\\sin\\theta')+'</span>'+
    '<span class="key"><i style="background:var(--c-green)"></i>'+T('y=b\\cos\\theta')+'</span>'+
    '<span class="key"><i style="background:var(--c-red)"></i>'+T('y=a\\sin\\theta+b\\cos\\theta')+'</span>'+
    '<span class="key"><i style="background:var(--c-purple)"></i>'+T('y=r\\sin(\\theta+\\alpha)')+'（重なる）</span>';

  document.getElementById('note-box').innerHTML=
    '<strong>'+T('\\alpha')+' は点 '+T('\\mathrm{P}(a,\\,b)')+' の向きで決める。</strong>'+
    T('\\tan\\alpha=\\dfrac{b}{a}')+' だけでは第1象限と第3象限を区別できません。'+
    T('\\cos\\alpha')+' と '+T('\\sin\\alpha')+' の符号を両方見て角を選びます。'+
    T('b<0')+' なら点は '+T('x')+' 軸の下にあるので '+T('\\alpha')+' は負の角になり、'+
    T('\\sin\\theta-\\cos\\theta=\\sqrt{2}\\sin\\left(\\theta-\\dfrac{\\pi}{4}\\right)')+' のように引き算の形になります。'+
    'また '+T('r')+' は長さなので必ず正であり、'+T('\\sqrt{a^2+b^2}')+' に負号は付きません。';

  buildWalk();
  document.getElementById('tab0').addEventListener('click',()=>selTab(0));
  document.getElementById('tab1').addEventListener('click',()=>selTab(1));
  setupSliders();
  setupButtons();
  setupDrag();
  redraw();
}

let walkState={cur:0};
function stepsFor(p){
  return [
    {label:'Step 1: 係数を読み取る', formula:p.src+'\\;\\Longrightarrow\\;a='+p.aT+',\\;\\;b='+p.bT},
    {label:'Step 2: 点 P をとって長さを測る', formula:'\\mathrm{P}('+p.aT+',\\,'+p.bT+'),\\qquad '+p.rC},
    {label:'Step 3: r でくくる', formula:p.src+'='+p.mid},
    {label:'Step 4: 角 α を決める', formula:p.ang},
    {label:'Step 5: 加法定理の形にそろえる', formula:p.src+'='+p.add},
    {label:'Step 6: 加法定理でまとめる', formula:p.src+'='+p.ans}
  ];
}
function buildWalk(){
  const steps=stepsFor(PRESETS[curTab]);
  const container=document.getElementById('walkthrough'), counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=walkState.cur;i++){
      html+=`<div class="step ${i===walkState.cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${walkState.cur+1} / ${steps.length}`;
    prevBtn.disabled=walkState.cur===0;
    nextBtn.disabled=walkState.cur===steps.length-1;
  }
  prevBtn.onclick=()=>{if(walkState.cur>0){walkState.cur--;render();}};
  nextBtn.onclick=()=>{if(walkState.cur<steps.length-1){walkState.cur++;render();}};
  render();
}
function selTab(i){
  curTab=i; walkState.cur=0;
  document.getElementById('tab0').classList.toggle('active',i===0);
  document.getElementById('tab1').classList.toggle('active',i===1);
  buildWalk();
}

function hitBox(A,B){return A.x<B.x+B.w&&B.x<A.x+A.w&&A.y<B.y+B.h&&B.y<A.y+A.h;}
function freeSpot(px,py,base,boxes){
  for(const d of [0,45,-45,90,-90,135,-135,180]){
    const q=base+d*Math.PI/180, x=px+22*Math.cos(q), y=py-22*Math.sin(q);
    const box={x:x-9,y:y-10,w:18,h:20};
    if(box.x<2||box.y<2||box.x+box.w>WA-2||box.y+box.h>HA-2) continue;
    if(boxes.some(f=>hitBox(box,f))) continue;
    return {x:x,y:y};
  }
  return {x:px,y:Math.max(12,py-22)};
}
function drawPlane(){
  const svg=document.getElementById('plane');
  const r=Math.hypot(a,b), ang=Math.atan2(b,a);
  const fixedBoxes=[{x:ax(3.45),y:ayO-26,w:24,h:26},{x:axO+8,y:ay(3.35)-6,w:24,h:26},{x:axO-23,y:ayO+6,w:18,h:18}];
  let s='';
  for(let k=-3;k<=3;k++){
    if(k===0) continue;
    s+=`<line x1="${ax(k)}" y1="${ayO-4}" x2="${ax(k)}" y2="${ayO+4}" stroke="#ccc" stroke-width="1.5"/>`;
    s+=`<line x1="${axO-4}" y1="${ay(k)}" x2="${axO+4}" y2="${ay(k)}" stroke="#ccc" stroke-width="1.5"/>`;
  }
  s+=`<line x1="${ax(-3.4)}" y1="${ayO}" x2="${ax(3.4)}" y2="${ayO}" stroke="#bbb" stroke-width="1.5"/>`;
  s+=`<line x1="${axO}" y1="${ay(-3.3)}" x2="${axO}" y2="${ay(3.3)}" stroke="#bbb" stroke-width="1.5"/>`;
  s+=`<foreignObject x="${ax(3.45)}" y="${ayO-26}" width="24" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('x')}</div></foreignObject>`;
  s+=`<foreignObject x="${axO+8}" y="${ay(3.35)-6}" width="24" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('y')}</div></foreignObject>`;

  if(r>0.05){
    s+=`<circle cx="${axO}" cy="${ayO}" r="${r*SC}" fill="none" stroke="#e6e6e6" stroke-width="1.5" stroke-dasharray="4 5"/>`;
    const arcR=32, large=0, sweep=ang>=0?0:1;
    s+=`<path d="M ${axO+arcR} ${ayO} A ${arcR} ${arcR} 0 ${large} ${sweep} ${axO+arcR*Math.cos(ang)} ${ayO-arcR*Math.sin(ang)}" fill="none" stroke="var(--c-orange)" stroke-width="2.5"/>`;
    const mA=ang/2, lr=arcR+20;
    fixedBoxes.push({x:axO+lr*Math.cos(mA)-13,y:ayO-lr*Math.sin(mA)-13,w:26,h:26});
    s+=`<foreignObject x="${axO+lr*Math.cos(mA)-13}" y="${ayO-lr*Math.sin(mA)-13}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px;color:var(--c-orange);font-weight:600">${T('\\alpha')}</div></foreignObject>`;
  }

  s+=`<line x1="${ax(a)}" y1="${ay(b)}" x2="${ax(a)}" y2="${ayO}" stroke="var(--c-green)" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.8"/>`;
  s+=`<line x1="${ax(a)}" y1="${ay(b)}" x2="${axO}" y2="${ay(b)}" stroke="var(--c-blue)" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.8"/>`;
  s+=`<line x1="${axO}" y1="${ayO}" x2="${ax(a)}" y2="${ayO}" stroke="var(--c-blue)" stroke-width="5" opacity="0.5" stroke-linecap="round"/>`;
  s+=`<line x1="${axO}" y1="${ayO}" x2="${axO}" y2="${ay(b)}" stroke="var(--c-green)" stroke-width="5" opacity="0.5" stroke-linecap="round"/>`;
  s+=`<line x1="${axO}" y1="${ayO}" x2="${ax(a)}" y2="${ay(b)}" stroke="var(--c-red)" stroke-width="2.5"/>`;

  s+=`<circle cx="${ax(a)}" cy="${ay(b)}" r="9" fill="var(--c-red)" stroke="#fff" stroke-width="2.5"><animate attributeName="r" values="9;12;9" dur="1.8s" repeatCount="indefinite"/></circle>`;
  s+=`<circle cx="${axO}" cy="${ayO}" r="4" fill="#666"/>`;
  /* P is the only moving label, so place it in the first free direction around the point */
  const lp=freeSpot(ax(a),ay(b),(r>0.05)?ang:Math.PI/2,fixedBoxes);
  s+=`<text x="${lp.x}" y="${lp.y+5}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--c-red)" stroke="#fff" stroke-width="4" paint-order="stroke">P</text>`;
  s+=`<text x="${axO-14}" y="${ayO+20}" text-anchor="middle" font-size="14" font-weight="700" fill="#666" stroke="#fff" stroke-width="4" paint-order="stroke">O</text>`;
  svg.innerHTML=s;
}

function drawWave(){
  const svg=document.getElementById('wave');
  const r=Math.hypot(a,b), ang=Math.atan2(b,a);
  const yMax=Math.max(1.2,r*1.12), ys=100/yMax;
  const gy=v=>gyO-v*ys;
  const curve=(fn,col,wd,dash,op)=>{
    let pts='';
    for(let i=0;i<=240;i++){const t=i/240*TAU; pts+=gx(t).toFixed(1)+','+gy(fn(t)).toFixed(1)+' ';}
    return `<polyline points="${pts.trim()}" fill="none" stroke="${col}" stroke-width="${wd}"`+
           (dash?` stroke-dasharray="${dash}"`:'')+(op?` opacity="${op}"`:'')+` stroke-linejoin="round"/>`;
  };
  let s='';
  s+=`<line x1="${gxO-10}" y1="${gy(r)}" x2="${gxO+GW+10}" y2="${gy(r)}" stroke="#e8e4ff" stroke-width="1.5"/>`;
  s+=`<line x1="${gxO-10}" y1="${gy(-r)}" x2="${gxO+GW+10}" y2="${gy(-r)}" stroke="#e8e4ff" stroke-width="1.5"/>`;
  s+=`<line x1="${gxO-10}" y1="${gyO}" x2="${gxO+GW+18}" y2="${gyO}" stroke="#bbb" stroke-width="1.5"/>`;
  s+=`<line x1="${gxO}" y1="30" x2="${gxO}" y2="262" stroke="#bbb" stroke-width="1.5"/>`;
  s+=curve(t=>a*Math.sin(t),'var(--c-blue)',1.8,'6 5',0.75);
  s+=curve(t=>b*Math.cos(t),'var(--c-green)',1.8,'6 5',0.75);
  s+=curve(t=>a*Math.sin(t)+b*Math.cos(t),'var(--c-red)',4,'',1);
  s+=curve(t=>r*Math.sin(t+ang),'var(--c-purple)',2.2,'9 7',1);

  if(r>0.05){
    let pk=Math.PI/2-ang;
    pk=((pk%TAU)+TAU)%TAU;
    s+=`<line x1="${gx(pk)}" y1="${gy(r)}" x2="${gx(pk)}" y2="${gyO}" stroke="var(--c-purple)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    s+=`<circle cx="${gx(pk)}" cy="${gy(r)}" r="6" fill="var(--c-purple)" stroke="#fff" stroke-width="2"><animate attributeName="r" values="6;9;6" dur="1.8s" repeatCount="indefinite"/></circle>`;
  }
  const ticks=[[0,'0'],[Math.PI/2,'\\dfrac{\\pi}{2}'],[Math.PI,'\\pi'],[3*Math.PI/2,'\\dfrac{3}{2}\\pi'],[TAU,'2\\pi']];
  for(const [t,lab] of ticks){
    s+=`<line x1="${gx(t)}" y1="${gyO-5}" x2="${gx(t)}" y2="${gyO+5}" stroke="#bbb" stroke-width="1.5"/>`;
    s+=`<foreignObject x="${gx(t)-26}" y="264" width="52" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#aaa;text-align:center">${T(lab)}</div></foreignObject>`;
  }
  s+=`<foreignObject x="${gxO+GW+2}" y="${gyO-30}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('\\theta')}</div></foreignObject>`;
  svg.innerHTML=s;
}

function updateLive(){
  const r=Math.hypot(a,b), ang=Math.atan2(b,a);
  const el=document.getElementById('live-calc');
  if(r<0.05){
    el.innerHTML=`<div class="row">${T('a=0,\\;b=0')} のときは ${T('r=0')} なので合成できません。</div>`;
    return;
  }
  const bt=(b<0?'-':'+')+' '+fmt(Math.abs(b),2)+'\\cos\\theta';
  let html=
    `<div class="row">${T(fmt(a,2)+'\\sin\\theta '+bt)}</div>`+
    `<div class="row">${T('r=\\sqrt{a^2+b^2}=\\sqrt{'+fmt(a*a+b*b,3)+'}='+fmt(r,3))}</div>`+
    `<div class="row">${T('\\cos\\alpha=\\dfrac{a}{r}='+fmt(a/r,3)+',\\quad \\sin\\alpha=\\dfrac{b}{r}='+fmt(b/r,3))}</div>`+
    `<div class="row">${T('\\alpha='+angTex(ang)+'\\;('+fmt(ang*180/Math.PI,1)+'^\\circ)')}</div>`+
    `<div class="row" style="color:var(--c-purple);font-weight:600">${T('='+fmt(r,3)+'\\sin(\\theta'+(ang<-5e-4?'-'+fmt(-ang,3):(ang>5e-4?'+'+fmt(ang,3):''))+')')}</div>`;
  for(const p of PRESETS){
    if(Math.abs(a-p.a)<0.02&&Math.abs(b-p.b)<0.02){
      html+=`<div class="row" style="color:var(--c-red);font-weight:600">${p.name} ${T(p.src+'='+p.ans)}</div>`;
    }
  }
  el.innerHTML=html;
}

function redraw(){ drawPlane(); drawWave(); updateLive(); }

function setAB(na,nb){
  a=Math.min(3.2,Math.max(-3.2,na));
  b=Math.min(3.2,Math.max(-3.2,nb));
  document.getElementById('a-slider').value=a;
  document.getElementById('b-slider').value=b;
  document.getElementById('a-value').textContent=fmt(a,2);
  document.getElementById('b-value').textContent=fmt(b,2);
  redraw();
}
function stopAnim(){ if(animId){cancelAnimationFrame(animId);animId=null;} }

function setupSliders(){
  const sa=document.getElementById('a-slider'), sb=document.getElementById('b-slider');
  sa.addEventListener('input',()=>{stopAnim();setAB(parseFloat(sa.value),b);});
  sb.addEventListener('input',()=>{stopAnim();setAB(a,parseFloat(sb.value));});
}

function setupButtons(){
  document.getElementById('set0').addEventListener('click',()=>{stopAnim();setAB(PRESETS[0].a,PRESETS[0].b);});
  document.getElementById('set1').addEventListener('click',()=>{stopAnim();setAB(PRESETS[1].a,PRESETS[1].b);});
  document.getElementById('anim-btn').addEventListener('click',()=>{
    stopAnim();
    const r0=Math.min(3.2,Math.max(0.6,Math.hypot(a,b))), a0=Math.atan2(b,a), duration=5000;
    let startTime=null;
    function animate(ts){
      if(!startTime) startTime=ts;
      const progress=Math.min((ts-startTime)/duration,1);
      const th=a0+TAU*progress;
      setAB(r0*Math.cos(th),r0*Math.sin(th));
      if(progress<1) animId=requestAnimationFrame(animate); else animId=null;
    }
    animId=requestAnimationFrame(animate);
  });
}

function setupDrag(){
  const svg=document.getElementById('plane');
  const wrap=document.getElementById('wrap-a');
  let dragging=false;
  function toMath(clientX,clientY){
    const rect=svg.getBoundingClientRect();
    const sx=(clientX-rect.left)/rect.width*WA, sy=(clientY-rect.top)/rect.height*HA;
    return {x:(sx-axO)/SC, y:(ayO-sy)/SC};
  }
  function startDrag(clientX,clientY){
    const m=toMath(clientX,clientY);
    if(Math.abs(m.x)>3.6||Math.abs(m.y)>3.6) return;
    stopAnim(); dragging=true; setAB(m.x,m.y);
  }
  function moveDrag(clientX,clientY){ if(dragging){const m=toMath(clientX,clientY);setAB(m.x,m.y);} }
  function endDrag(){ dragging=false; }

  wrap.addEventListener('mousedown',e=>{e.preventDefault();startDrag(e.clientX,e.clientY);});
  window.addEventListener('mousemove',e=>{if(dragging){e.preventDefault();moveDrag(e.clientX,e.clientY);}});
  window.addEventListener('mouseup',endDrag);

  wrap.addEventListener('touchstart',e=>{const t=e.touches[0];startDrag(t.clientX,t.clientY);},{passive:true});
  wrap.addEventListener('touchmove',e=>{if(dragging){e.preventDefault();const t=e.touches[0];moveDrag(t.clientX,t.clientY);}},{passive:false});
  wrap.addEventListener('touchend',endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
