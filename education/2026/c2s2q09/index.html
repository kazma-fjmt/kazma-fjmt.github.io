<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>円と直線の共有点をもつ条件</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.35rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step {
    padding: .75rem .25rem; border-bottom: 1px dashed #eee;
    transition: background .2s ease; animation: fadeIn .3s ease;
  }
  .step:last-child { border-bottom: none; }
  .step.current {
    background: #f0f5ff; border-radius: 8px; padding: .75rem;
    margin: .25rem -.5rem; border-bottom: none;
  }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.1rem; }
  .step.current .formula-line .katex { font-size: 1.25rem; }

  .controls-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; margin: 1rem 0 0;
  }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .note {
    background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px;
    padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem;
  }
  .live-calc {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto;
  }
  .live-calc .katex { font-size: 1.2rem; }

  .slider-row {
    display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem;
  }
  .slider-row label { font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-width: 0; height: 36px; }
  .slider-row .val { font-weight: 600; min-width: 4.5rem; text-align: center; font-size: 1.05rem; }

  .status-badge {
    display: inline-block; padding: .35rem .8rem; border-radius: 8px;
    font-weight: 700; font-size: 1rem; margin: .25rem .25rem;
  }
  .status-badge.intersect { background: #d4edda; color: #155724; }
  .status-badge.tangent { background: #fff3cd; color: #856404; }
  .status-badge.none { background: #f8d7da; color: #721c24; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .drag-hint {
    text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0;
  }
</style>
</head>
<body>
<main>
  <h1>円と直線の共有点をもつ条件</h1>
  <p class="subtitle">円と直線の方程式を連立し、判別式を使って共有点の個数を判定する方法を学びましょう。</p>

  <h2>考え方</h2>
  <p>円 <span id="lbl-circle"></span> と直線 <span id="lbl-line"></span> の共有点は、連立方程式の実数解に対応します。</p>
  <p>直線を円に代入して得られる2次方程式の判別式 <span id="lbl-D"></span> により：</p>
  <div class="formula-box" id="formula-cases"></div>

  <h2>例題の解法ウォークスルー</h2>
  <p>円 <span id="ex-circle"></span> と直線 <span id="ex-line"></span> が共有点をもつような <span id="ex-k-label"></span> の範囲を求めよ。</p>
  <div class="walkthrough" id="wt-ex"></div>
  <div class="controls-row">
    <button class="btn" id="we-prev" disabled>← 前へ</button>
    <span class="step-counter" id="we-counter"></span>
    <button class="btn primary" id="we-next">次へ →</button>
  </div>

  <h2>動かして確かめよう</h2>
  <p>スライダーで <span id="slider-k-label"></span> の値を変えて、直線と円の位置関係を確認しましょう。</p>

  <div class="slider-row">
    <label><span id="lbl-k"></span> =</label>
    <input type="range" id="slider-k" min="-4" max="4" step="0.1" value="1">
    <span class="val" id="slider-k-val">1.0</span>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="live-calc" id="live-calc"></div>

  <div class="note">
    <strong>まとめ：</strong>共有点をもつ条件は <span id="summary-cond"></span>
  </div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}
if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{if(window.katex)init();else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}});

let kVal = 1.0;

function init(){
  tex('x^2+y^2=r^2', document.getElementById('lbl-circle'));
  tex('y=mx+k', document.getElementById('lbl-line'));
  tex('D', document.getElementById('lbl-D'));

  document.getElementById('formula-cases').innerHTML =
    T('D > 0') + ' : 2点で交わる<br>' +
    T('D = 0') + ' : 接する（1点）<br>' +
    T('D < 0') + ' : 共有点なし';

  tex('x^2+y^2=1', document.getElementById('ex-circle'));
  tex('y=2x+k', document.getElementById('ex-line'));
  tex('k', document.getElementById('ex-k-label'));
  tex('k', document.getElementById('slider-k-label'));
  document.getElementById('lbl-k').innerHTML = T('k');
  tex('-\\sqrt{5} \\le k \\le \\sqrt{5}', document.getElementById('summary-cond'));

  initExample();
  drawGraph();

  const slider = document.getElementById('slider-k');
  slider.addEventListener('input', ()=>{
    kVal = parseFloat(slider.value);
    document.getElementById('slider-k-val').textContent = kVal.toFixed(1);
    drawGraph();
  });
}

function initExample(){
  const steps = [
    { label: 'Step 1: 直線を円に代入', formula: 'x^2 + (2x+k)^2 = 1' },
    { label: 'Step 2: 展開して整理', formula: 'x^2 + 4x^2 + 4kx + k^2 = 1' },
    { label: 'Step 3: 2次方程式にまとめる', formula: '5x^2 + 4kx + (k^2 - 1) = 0' },
    { label: 'Step 4: 判別式 D/4 を計算', formula: '\\frac{D}{4} = (2k)^2 - 5(k^2-1)' },
    { label: 'Step 5: 展開', formula: '\\frac{D}{4} = 4k^2 - 5k^2 + 5 = -k^2 + 5 = 5 - k^2' },
    { label: 'Step 6: 共有点をもつ条件', formula: '\\frac{D}{4} \\ge 0 \\quad\\Leftrightarrow\\quad 5 - k^2 \\ge 0' },
    { label: 'Step 7: k の範囲を求める', formula: 'k^2 \\le 5 \\quad\\Leftrightarrow\\quad -\\sqrt{5} \\le k \\le \\sqrt{5}' },
  ];

  let cur = 0;
  const container = document.getElementById('wt-ex');
  const counter = document.getElementById('we-counter');
  const prevBtn = document.getElementById('we-prev');
  const nextBtn = document.getElementById('we-next');

  function render(){
    let html = '';
    for(let i=0;i<=cur;i++){
      html += `<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML = html;
    counter.textContent = `${cur+1} / ${steps.length}`;
    prevBtn.disabled = cur===0;
    nextBtn.disabled = cur===steps.length-1;
  }

  prevBtn.addEventListener('click', ()=>{ if(cur>0){cur--;render();} });
  nextBtn.addEventListener('click', ()=>{ if(cur<steps.length-1){cur++;render();} });
  render();
}

function drawGraph(){
  const svg = document.getElementById('graph');
  const W = 600, H = 500, ox = 300, oy = 250, scale = 120;

  function px(x){ return ox + x*scale; }
  function py(y){ return oy - y*scale; }

  // Discriminant: D/4 = 5 - k^2
  const D4 = 5 - kVal*kVal;
  const sqrtD4 = D4 >= 0 ? Math.sqrt(D4) : 0;

  // Status
  let status, lineColor, statusClass;
  if(Math.abs(D4) < 0.02){ status = '接する（1点）'; lineColor = '#e67e22'; statusClass = 'tangent'; }
  else if(D4 > 0){ status = '2点で交わる'; lineColor = 'var(--c-green)'; statusClass = 'intersect'; }
  else { status = '共有点なし'; lineColor = 'var(--c-red)'; statusClass = 'none'; }

  let html = '';

  // Grid
  for(let i=-2;i<=2;i++) html += `<line x1="${px(i)}" y1="10" x2="${px(i)}" y2="${H-10}" stroke="#eee"/>`;
  for(let j=-2;j<=2;j++) html += `<line x1="10" y1="${py(j)}" x2="${W-10}" y2="${py(j)}" stroke="#eee"/>`;

  // Axes
  html += `<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#999"/></marker></defs>`;
  html += `<line x1="10" y1="${oy}" x2="${W-10}" y2="${oy}" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>`;
  html += `<line x1="${ox}" y1="${H-10}" x2="${ox}" y2="10" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>`;
  html += `<foreignObject x="${W-26}" y="${oy-22}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('x')}</div></foreignObject>`;
  html += `<foreignObject x="${ox+6}" y="${Math.max(8,2)}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('y')}</div></foreignObject>`;
  html += `<text x="${ox+5}" y="${oy+18}" font-size="12" fill="#999">O</text>`;
  for(let i=-2;i<=2;i++){ if(i===0)continue; html += `<text x="${px(i)}" y="${oy+18}" text-anchor="middle" font-size="11" fill="#bbb">${i}</text>`; }
  for(let j=-2;j<=2;j++){ if(j===0)continue; html += `<text x="${ox-10}" y="${py(j)+4}" text-anchor="end" font-size="11" fill="#bbb">${j}</text>`; }

  // Circle x^2+y^2=1
  html += `<circle cx="${px(0)}" cy="${py(0)}" r="${scale}" fill="none" stroke="var(--c-blue)" stroke-width="2.5"/>`;
  html += `<foreignObject x="${px(0.75)}" y="${py(0.85)-14}" width="150" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-blue);font-weight:600">${T('x^2+y^2=1')}</div></foreignObject>`;

  // Line y=2x+k
  const lineY = x => 2*x + kVal;
  const xL = -2.5, xR = 2.5;
  html += `<line x1="${px(xL)}" y1="${py(lineY(xL))}" x2="${px(xR)}" y2="${py(lineY(xR))}" stroke="${lineColor}" stroke-width="2.5"/>`;
  html += `<foreignObject x="${px(xR)-5}" y="${py(lineY(xR))-28}" width="150" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:${lineColor};font-weight:600">${T('y=2x+k')}</div></foreignObject>`;

  // Intersection points if D4 >= 0
  if(D4 >= 0){
    // 5x^2 + 4kx + k^2-1 = 0 => x = (-4k +/- 2*sqrt(D4)) / 10 = (-2k +/- sqrt(D4)) / 5
    const x1 = (-2*kVal + Math.sqrt(D4)) / 5;
    const x2 = (-2*kVal - Math.sqrt(D4)) / 5;
    const y1 = 2*x1 + kVal;
    const y2 = 2*x2 + kVal;

    html += `<circle cx="${px(x1)}" cy="${py(y1)}" r="6" fill="${lineColor}" stroke="#fff" stroke-width="2"/>`;
    if(Math.abs(D4) >= 0.02){
      html += `<circle cx="${px(x2)}" cy="${py(y2)}" r="6" fill="${lineColor}" stroke="#fff" stroke-width="2"/>`;
    }
  }

  // Boundaries: k = +/-sqrt(5)
  const sqrt5 = Math.sqrt(5);
  // Draw tangent ghost lines
  for(const kT of [sqrt5, -sqrt5]){
    const yT = x => 2*x + kT;
    html += `<line x1="${px(xL)}" y1="${py(yT(xL))}" x2="${px(xR)}" y2="${py(yT(xR))}" stroke="#e67e22" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>`;
  }

  svg.innerHTML = html;

  // Live calc
  const fmt = v => Math.abs(v-Math.round(v))<0.05 ? Math.round(v).toString() : v.toFixed(2);
  const statusHTML = `<span class="status-badge ${statusClass}">${status}</span>`;
  document.getElementById('live-calc').innerHTML =
    T(`k = ${fmt(kVal)}`) + '<br>' +
    T(`\\frac{D}{4} = 5 - k^2 = 5 - (${fmt(kVal)})^2 = ${fmt(D4)}`) + '<br>' +
    statusHTML;
}
</script>
</body>
</html>
