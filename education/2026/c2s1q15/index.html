<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>3点の共線条件</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa;
    --fg: #333;
    --muted: #888;
    --accent: #2a6df4;
    --c-red: #d9534f;
    --c-blue: #2a6df4;
    --c-green: #28a745;
    --c-orange: #e67e22;
    --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 {
    font-size: 1.15rem;
    margin: 2.25rem 0 .75rem;
    border-left: 4px solid var(--accent);
    padding-left: .6rem;
  }
  p { margin: .75rem 0; }

  .formula {
    background: #fff;
    border: 1px solid #e3e3e3;
    border-radius: 10px;
    padding: 1rem;
    text-align: center;
    overflow-x: auto;
    margin: 1rem 0;
  }
  .formula .katex { font-size: 1.25rem; }

  .canvas-container {
    background: #fff;
    border: 1px solid #e3e3e3;
    border-radius: 10px;
    padding: .75rem;
    margin: 1rem 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 6px;
  }

  .slider-group {
    background: #fff;
    border: 1px solid #e3e3e3;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin: 1rem 0;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: .75rem;
    margin: .5rem 0;
    flex-wrap: wrap;
  }
  .slider-row label {
    min-width: 4rem;
    font-weight: 600;
    text-align: right;
  }
  .slider-row input[type="range"] {
    flex: 1;
    min-width: 140px;
    height: 36px;
  }
  .slider-row .val {
    min-width: 3rem;
    text-align: center;
    font-weight: 600;
  }

  .eq-display {
    text-align: center;
    margin: 1rem 0;
    padding: .75rem 1rem;
    background: #eef4ff;
    border-radius: 10px;
    overflow-x: auto;
  }
  .eq-display .katex { font-size: 1.2rem; }

  .status-box {
    text-align: center;
    padding: .75rem 1rem;
    border-radius: 10px;
    margin: 1rem 0;
    font-weight: 600;
    font-size: 1rem;
    transition: all 0.3s ease;
  }
  .status-box.on-line {
    background: #e6f9e6;
    border: 2px solid var(--c-green);
    color: var(--c-green);
  }
  .status-box.off-line {
    background: #fff5f5;
    border: 2px solid var(--c-red);
    color: var(--c-red);
  }

  .info-box {
    background: #fff;
    border: 1px solid #e3e3e3;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin: 1rem 0;
    overflow-x: auto;
  }

  .walkthrough {
    background: #fff;
    border: 1px solid #e3e3e3;
    border-radius: 10px;
    padding: .75rem 1.25rem;
    margin: 0 0 .75rem;
    min-height: 9rem;
    overflow-x: auto;
  }
  .step {
    padding: .75rem .25rem;
    border-bottom: 1px dashed #eee;
    opacity: 0;
    animation: fadeIn 0.4s ease forwards;
  }
  .step:last-child { border-bottom: none; }
  .step.current {
    background: #f0f5ff;
    border-radius: 8px;
    padding: .75rem;
    margin: .25rem -.5rem;
    border-bottom: none;
  }
  .step .label {
    color: var(--muted);
    font-size: .8rem;
    margin-bottom: .25rem;
  }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.2rem; }
  .step.current .formula-line .katex { font-size: 1.35rem; }

  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .75rem;
    margin: 1rem 0 0;
  }
  .btn {
    appearance: none;
    border: 1px solid #d4dbeb;
    background: #fff;
    color: var(--accent);
    font-size: 1rem;
    font-weight: 600;
    padding: .85rem 1.2rem;
    border-radius: 10px;
    cursor: pointer;
    min-height: 48px;
    min-width: 110px;
    font-family: inherit;
    user-select: none;
  }
  .btn.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter {
    color: var(--muted);
    font-size: .9rem;
    text-align: center;
    flex: 1;
  }

  .example-box {
    background: #eef4ff;
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin: 1rem 0;
  }
  .example-title {
    font-weight: 600;
    color: var(--accent);
    font-size: .95rem;
    margin-bottom: .5rem;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
</style>
</head>
<body>
<main>
  <h1>3点の共線条件</h1>
  <p class="subtitle">2点を通る直線上に第3の点があるための条件を調べます。</p>

  <h2>問題の考え方</h2>
  <p>2点 A, B を通る直線の方程式を求め、第3の点 C がその直線上にあるとき、C の座標が方程式を満たす条件を使います。</p>

  <h2>例題</h2>
  <div class="example-box">
    <div class="example-title">例題</div>
    <p id="ex-problem"></p>
  </div>

  <h2>直線ABの方程式</h2>
  <div class="formula" id="line-eq"></div>

  <h2>座標平面で確かめよう</h2>
  <p>スライダーで <span id="a-label-inline"></span> の値を変えて、点 C が直線 AB 上に乗るタイミングを探しましょう。</p>

  <div class="slider-group">
    <div class="slider-row">
      <label id="a-label"><span id="lbl-a"></span> =</label>
      <input type="range" id="slider-a" min="-5" max="7" step="0.25" value="-2">
      <span class="val" id="val-a">-2</span>
    </div>
  </div>

  <div class="eq-display" id="c-coords"></div>
  <div class="status-box off-line" id="status-box">直線上にない</div>

  <div class="canvas-container">
    <canvas id="plane" width="700" height="560"></canvas>
  </div>

  <div class="info-box" id="check-box"></div>

  <h2>解法ステップ</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev">← 戻る</button>
    <div class="step-counter">ステップ <span id="step-cur"></span> / <span id="step-tot"></span></div>
    <button class="btn primary" id="next">次へ →</button>
  </div>
</main>

<script>
  function tex(l, el, dm) { katex.render(l, el, { throwOnError: false, displayMode: !!dm }); }
  function T(l) { return katex.renderToString(l, { throwOnError: false }); }

  const C_RED = "#d9534f";
  const C_BLUE = "#2a6df4";
  const C_GREEN = "#28a745";
  const C_ORANGE = "#e67e22";
  const C_PURPLE = "#7b61ff";

  // Fixed points A(-2,6) and B(7,3)
  const A = { x: -2, y: 6 };
  const B = { x: 7, y: 3 };
  // Line AB: slope = (3-6)/(7-(-2)) = -3/9 = -1/3
  // y - 6 = -1/3(x+2)  =>  x + 3y - 16 = 0

  const gXmin = -6, gXmax = 10, gYmin = -2, gYmax = 10;
  const canvas = document.getElementById('plane');
  const ctx2d = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;

  let animPhase = 0;
  let animId;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function toScreen(mx, my) {
    const cw = canvas.getBoundingClientRect().width;
    const ch = canvas.getBoundingClientRect().height;
    return [(mx - gXmin) / (gXmax - gXmin) * cw, (1 - (my - gYmin) / (gYmax - gYmin)) * ch];
  }

  function drawGrid() {
    const cw = canvas.getBoundingClientRect().width;
    const ch = canvas.getBoundingClientRect().height;
    const ctx = ctx2d;

    ctx.strokeStyle = '#eee';
    ctx.lineWidth = 1;
    for (let x = Math.ceil(gXmin); x <= Math.floor(gXmax); x++) {
      const [sx] = toScreen(x, 0);
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, ch); ctx.stroke();
    }
    for (let y = Math.ceil(gYmin); y <= Math.floor(gYmax); y++) {
      const [, sy] = toScreen(0, y);
      ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(cw, sy); ctx.stroke();
    }
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 1.5;
    const [ox, oy] = toScreen(0, 0);
    ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(cw, oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, ch); ctx.stroke();

    ctx.fillStyle = '#999';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (let x = Math.ceil(gXmin); x <= Math.floor(gXmax); x++) {
      if (x === 0) continue;
      const [sx] = toScreen(x, 0);
      ctx.fillText(x, sx, oy + 4);
    }
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let y = Math.ceil(gYmin); y <= Math.floor(gYmax); y++) {
      if (y === 0) continue;
      const [, sy] = toScreen(0, y);
      ctx.fillText(y, ox - 6, sy);
    }
    ctx.fillText('O', ox - 6, oy + 12);
  }

  function draw() {
    const cw = canvas.getBoundingClientRect().width;
    const ch = canvas.getBoundingClientRect().height;
    const ctx = ctx2d;
    ctx.clearRect(0, 0, cw, ch);
    drawGrid();

    const a = parseFloat(document.getElementById('slider-a').value);
    const C = { x: a, y: a + 4 };
    const onLine = Math.abs(a - 1) < 0.01;

    // Draw line AB: y = -1/3 x + 16/3
    const m = -1 / 3;
    const b = 16 / 3;
    const yAtXmin = m * gXmin + b;
    const yAtXmax = m * gXmax + b;
    const [lx1, ly1] = toScreen(gXmin, yAtXmin);
    const [lx2, ly2] = toScreen(gXmax, yAtXmax);

    ctx.strokeStyle = C_BLUE;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(lx1, ly1);
    ctx.lineTo(lx2, ly2);
    ctx.stroke();

    // Line label
    ctx.fillStyle = C_BLUE;
    ctx.font = 'italic 13px sans-serif';
    ctx.textAlign = 'left';
    const [llx, lly] = toScreen(gXmax - 1, m * (gXmax - 1) + b);
    ctx.fillText('x + 3y − 16 = 0', llx - 100, lly - 14);
    ctx.font = '13px sans-serif';

    // Path of C: y = x + 4 (shown as dashed)
    const pathY1 = gXmin + 4;
    const pathY2 = gXmax + 4;
    const [px1, py1] = toScreen(gXmin, pathY1);
    const [px2, py2] = toScreen(gXmax, pathY2);
    ctx.strokeStyle = C_PURPLE + '40';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(px1, py1);
    ctx.lineTo(px2, py2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Path label
    ctx.fillStyle = C_PURPLE + '80';
    ctx.textAlign = 'left';
    const [plx, ply] = toScreen(4, 8);
    ctx.font = 'italic 11px sans-serif';
    ctx.fillText('y = x + 4', plx + 6, ply - 6);
    const eqW = ctx.measureText('y = x + 4').width;
    ctx.font = '11px sans-serif';
    ctx.fillText(' (Cの軌跡)', plx + 6 + eqW, ply - 6);

    // Point A
    const [asx, asy] = toScreen(A.x, A.y);
    ctx.beginPath(); ctx.arc(asx, asy, 8, 0, Math.PI * 2);
    ctx.fillStyle = C_RED; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = C_RED; ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('A(-2, 6)', asx - 2, asy - 14);

    // Point B
    const [bsx, bsy] = toScreen(B.x, B.y);
    ctx.beginPath(); ctx.arc(bsx, bsy, 8, 0, Math.PI * 2);
    ctx.fillStyle = C_GREEN; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = C_GREEN; ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('B(7, 3)', bsx, bsy - 14);

    // Point C with animation
    const [csx, csy] = toScreen(C.x, C.y);
    const radius = onLine ? 10 + 3 * Math.sin(animPhase * 3) : 8;
    ctx.beginPath(); ctx.arc(csx, csy, radius, 0, Math.PI * 2);
    ctx.fillStyle = onLine ? C_ORANGE : C_PURPLE;
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

    // Glow when on line
    if (onLine) {
      const glow = 0.2 + 0.15 * Math.sin(animPhase * 3);
      ctx.beginPath(); ctx.arc(csx, csy, 20, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(230, 126, 34, ${glow})`;
      ctx.fill();
    }

    const fmt = (v) => { const r = Math.round(v * 100) / 100; return Number.isInteger(r) ? r.toString() : r.toFixed(2).replace(/0+$/, ''); };
    ctx.fillStyle = onLine ? C_ORANGE : C_PURPLE;
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`C(${fmt(a)}, ${fmt(a + 4)})`, csx, csy + 22);

    animPhase += 0.03;
    animId = requestAnimationFrame(draw);
  }

  function updateDisplay() {
    const a = parseFloat(document.getElementById('slider-a').value);
    const fmt = (v) => { const r = Math.round(v * 100) / 100; return Number.isInteger(r) ? r.toString() : r.toFixed(2).replace(/0+$/, ''); };

    document.getElementById('val-a').textContent = fmt(a);

    const coordsEl = document.getElementById('c-coords');
    coordsEl.innerHTML = T(`\\mathrm{C}(${fmt(a)},\\; ${fmt(a + 4)})`);

    // Check: x + 3y - 16 = a + 3(a+4) - 16 = 4a + 12 - 16 = 4a - 4
    const residual = 4 * a - 4;
    const onLine = Math.abs(residual) < 0.05;

    const statusEl = document.getElementById('status-box');
    if (onLine) {
      statusEl.className = 'status-box on-line';
      statusEl.innerHTML = '直線AB上にある！ (' + T('a = 1') + ')';
    } else {
      statusEl.className = 'status-box off-line';
      statusEl.textContent = '直線AB上にない';
    }

    const checkEl = document.getElementById('check-box');
    checkEl.innerHTML =
      '<div style="margin-bottom:.5rem;">代入チェック：' +
      T(`${fmt(a)} + 3 \\times ${fmt(a + 4)} - 16 = ${fmt(residual)}`) + '</div>' +
      (onLine
        ? '<div style="color:' + C_GREEN + '; font-weight:600;">' + T('= 0') + '  方程式を満たします</div>'
        : '<div style="color:' + C_RED + ';">' + T(`= ${fmt(residual)} \\neq 0`) + '  方程式を満たしません</div>');
  }

  /* --- Walkthrough --- */
  const steps = [
    {
      title: "2点を確認する",
      tex: `\\mathrm{A}(-2,\\, 6),\\quad \\mathrm{B}(7,\\, 3)`
    },
    {
      title: "直線ABの傾きを求める",
      tex: `m = \\frac{3 - 6}{7 - (-2)} = \\frac{-3}{9} = -\\frac{1}{3}`
    },
    {
      title: "直線ABの方程式をつくる",
      tex: `y - 6 = -\\frac{1}{3}(x - (-2)) = -\\frac{1}{3}(x + 2)`
    },
    {
      title: "整理する（一般形）",
      tex: `3(y - 6) = -(x + 2) \\;\\Longrightarrow\\; \\textcolor{${C_BLUE}}{x + 3y - 16 = 0}`
    },
    {
      title: "C(a, a+4)を直線の方程式に代入する",
      tex: `a + 3(a + 4) - 16 = 0`
    },
    {
      title: "展開して整理する",
      tex: `a + 3a + 12 - 16 = 0 \\;\\Longrightarrow\\; 4a - 4 = 0`
    },
    {
      title: "答え",
      tex: `\\textcolor{${C_ORANGE}}{a = 1} \\quad \\text{のとき}\\; \\mathrm{C}(1,\\, 5) \\;\\text{は直線AB上にある}`
    }
  ];

  let curStep = 0;

  function renderWalkthrough() {
    const root = document.getElementById('walkthrough');
    let html = '';
    for (let i = 0; i <= curStep; i++) {
      const s = steps[i];
      const isCurrent = i === curStep;
      html += `<div class="step ${isCurrent ? 'current' : ''}" style="animation-delay:${isCurrent ? '0.05s' : '0s'}">
        <div class="label">${s.title}</div>
        <div class="formula-line">${T(s.tex)}</div>
      </div>`;
    }
    root.innerHTML = html;
    document.getElementById('step-cur').textContent = curStep + 1;
    document.getElementById('step-tot').textContent = steps.length;
    document.getElementById('prev').disabled = curStep === 0;
    document.getElementById('next').disabled = curStep === steps.length - 1;
  }

  function init() {
    document.getElementById('ex-problem').innerHTML =
      '2点 ' + T('\\mathrm{A}(-2,\\, 6),\\; \\mathrm{B}(7,\\, 3)') + ' を通る直線の方程式を求めよ。また、点 ' +
      T('\\mathrm{C}(a,\\, a+4)') + ' がこの直線上にあるとき、' + T('a') + ' の値を求めよ。';

    tex('x + 3y - 16 = 0', document.getElementById('line-eq'), true);

    document.getElementById('a-label-inline').innerHTML = T('a');
    document.getElementById('lbl-a').innerHTML = T('a');

    const slider = document.getElementById('slider-a');
    slider.addEventListener('input', () => {
      updateDisplay();
    });

    document.getElementById('prev').addEventListener('click', () => {
      if (curStep > 0) { curStep--; renderWalkthrough(); }
    });
    document.getElementById('next').addEventListener('click', () => {
      if (curStep < steps.length - 1) { curStep++; renderWalkthrough(); }
    });

    resizeCanvas();
    updateDisplay();
    renderWalkthrough();
    draw();
  }

  window.addEventListener('resize', () => {
    resizeCanvas();
  });

  if (window.katex) init();
  else window.addEventListener("DOMContentLoaded", () => {
    if (window.katex) init();
    else {
      const w = setInterval(() => {
        if (window.katex) { clearInterval(w); init(); }
      }, 30);
    }
  });
</script>
</body>
</html>
