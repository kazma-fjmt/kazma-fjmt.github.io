<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>余弦の加法定理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.1rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.small { min-width: 0; padding: .7rem 1rem; font-size: .95rem; }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.05rem; }

  .slider-row {
    display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem;
  }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.05rem; font-weight: 700; color: var(--accent); min-width: 4rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; margin: .5rem 0; }
  .preset-row { display: flex; justify-content: center; gap: .5rem; flex-wrap: wrap; margin: .75rem 0; }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; justify-content: center; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .9rem; }
  .legend span.key { display: inline-block; width: .8rem; height: .8rem; border-radius: 50%; margin-right: .35rem; vertical-align: -1px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>余弦の加法定理</h1>
  <p class="subtitle">単位円上の2点の距離から加法定理を導き、<span id="s-goal"></span> の値を求めましょう。</p>

  <h2>4つの加法定理</h2>
  <div class="formula-box" id="f-all"></div>
  <p>このうち余弦の2式が、これから使う道具です。まずはなぜ成り立つのかを単位円の上で確かめましょう。</p>

  <h2>単位円で証明を追う</h2>
  <p>角 <span id="s-a"></span> の動径と単位円の交点を <span id="s-A"></span>、角 <span id="s-b"></span> の動径との交点を <span id="s-B"></span> とします。スライダーで2つの角を変え、<span id="s-rotbtn"></span> のボタンをタップして三角形をまるごと回してみましょう。</p>

  <div class="slider-row">
    <label><span id="lbl-a"></span> =</label>
    <input type="range" id="a-slider" min="0" max="180" step="1" value="100">
    <span class="slider-val" id="a-value">100°</span>
  </div>
  <div class="slider-row">
    <label><span id="lbl-b"></span> =</label>
    <input type="range" id="b-slider" min="-90" max="150" step="1" value="30">
    <span class="slider-val" id="b-value">30°</span>
  </div>

  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">回転</button>
    <button class="btn" id="reset-btn">もどす</button>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="legend" id="legend"></div>
  <div class="live-calc" id="live-calc"></div>
  <div class="note" id="note1"></div>

  <h2>差の角の余弦を読む</h2>
  <p>下のボタンをタップすると、角の組がそのまま図に入ります。<span id="s-diff"></span> が 15 の倍数のときは、正確な値も表示されます。</p>
  <div class="preset-row">
    <button class="btn small" id="p1">45° と 30°</button>
    <button class="btn small" id="p2">45° と −30°</button>
    <button class="btn small" id="p3">120° と 45°</button>
  </div>
  <div class="formula-box" id="exact-box"></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=600,cx=300,cy=300,R=205,D2R=Math.PI/180;
let alphaDeg=100, betaDeg=30, rotT=0, animId=null;

function f4(v){let s=v.toFixed(4);if(s==='-0.0000')s='0.0000';return s;}
function degTex(d){return (Math.round(d))+'^\\circ';}
function clampX(x,w){return Math.max(2,Math.min(x,W-w-2));}
function clampY(y,h){return Math.max(2,Math.min(y,H-h-2));}
function fo(x,y,w,h,inner,style){
  return `<foreignObject x="${clampX(x,w)}" y="${clampY(y,h)}" width="${w}" height="${h}"><div xmlns="http://www.w3.org/1999/xhtml" style="${style}">${inner}</div></foreignObject>`;
}
function halo(x,y,txt,col){
  return `<text x="${Math.max(12,Math.min(x,W-12))}" y="${Math.max(18,Math.min(y,H-6))}" text-anchor="middle" font-size="17" font-weight="700" fill="${col}" stroke="#fff" stroke-width="3.5" paint-order="stroke">${txt}</text>`;
}
function arcPath(r,a0,a1){
  const large=Math.abs(a1-a0)>180?1:0, sweep=a1>a0?0:1;
  return `M ${cx+r*Math.cos(a0*D2R)} ${cy-r*Math.sin(a0*D2R)} A ${r} ${r} 0 ${large} ${sweep} ${cx+r*Math.cos(a1*D2R)} ${cy-r*Math.sin(a1*D2R)}`;
}
function ptAt(deg,r){return {x:cx+r*Math.cos(deg*D2R), y:cy-r*Math.sin(deg*D2R)};}

const EXACT={0:'1',15:'\\dfrac{\\sqrt{6}+\\sqrt{2}}{4}',30:'\\dfrac{\\sqrt{3}}{2}',45:'\\dfrac{\\sqrt{2}}{2}',60:'\\dfrac{1}{2}',
  75:'\\dfrac{\\sqrt{6}-\\sqrt{2}}{4}',90:'0',105:'-\\dfrac{\\sqrt{6}-\\sqrt{2}}{4}',120:'-\\dfrac{1}{2}',
  135:'-\\dfrac{\\sqrt{2}}{2}',150:'-\\dfrac{\\sqrt{3}}{2}',165:'-\\dfrac{\\sqrt{6}+\\sqrt{2}}{4}',180:'-1'};
function exactCos(deg){
  let t=((Math.round(deg)%360)+360)%360;
  if(t>180) t=360-t;
  return EXACT[t]||null;
}

function init(){
  document.getElementById('s-goal').innerHTML=T('\\cos 75^\\circ')+'、'+T('\\cos 15^\\circ');
  document.getElementById('s-a').innerHTML=T('\\alpha');
  document.getElementById('s-b').innerHTML=T('\\beta');
  document.getElementById('s-A').innerHTML=T('\\mathrm{A}');
  document.getElementById('s-B').innerHTML=T('\\mathrm{B}');
  document.getElementById('s-diff').innerHTML=T('\\alpha-\\beta');
  document.getElementById('s-rotbtn').innerHTML='「&minus;'+T('\\beta')+' だけ回転」';
  document.getElementById('lbl-a').innerHTML=T('\\alpha');
  document.getElementById('lbl-b').innerHTML=T('\\beta');
  document.getElementById('anim-btn').innerHTML='&minus;'+T('\\beta')+' だけ回転';

  tex('\\begin{aligned}\\sin(\\alpha+\\beta)&=\\sin\\alpha\\cos\\beta+\\cos\\alpha\\sin\\beta\\\\ \\sin(\\alpha-\\beta)&=\\sin\\alpha\\cos\\beta-\\cos\\alpha\\sin\\beta\\\\ \\cos(\\alpha+\\beta)&=\\cos\\alpha\\cos\\beta-\\sin\\alpha\\sin\\beta\\\\ \\cos(\\alpha-\\beta)&=\\cos\\alpha\\cos\\beta+\\sin\\alpha\\sin\\beta\\end{aligned}',
    document.getElementById('f-all'), true);

  document.getElementById('legend').innerHTML=
    `<div><span class="key" style="background:var(--c-blue)"></span>${T('\\mathrm{A}(\\cos\\alpha,\\ \\sin\\alpha)')}</div>`+
    `<div><span class="key" style="background:var(--c-green)"></span>${T('\\mathrm{B}(\\cos\\beta,\\ \\sin\\beta)')}</div>`+
    `<div><span class="key" style="background:var(--c-red)"></span>${T('\\mathrm{C}(\\cos(\\alpha-\\beta),\\ \\sin(\\alpha-\\beta))')}</div>`+
    `<div><span class="key" style="background:var(--c-red)"></span>${T('\\mathrm{E}(1,\\ 0)')}</div>`;

  document.getElementById('note1').innerHTML=
    '回転しても2点の間の距離は変わりません。'+T('\\mathrm{AB}=\\mathrm{CE}')+' の両辺を2乗して整理すると '+
    T('\\cos(\\alpha-\\beta)=\\cos\\alpha\\cos\\beta+\\sin\\alpha\\sin\\beta')+' が出ます。ここで '+T('\\beta')+
    ' を '+T('-\\beta')+' に置き換えれば、和の公式 '+T('\\cos(\\alpha+\\beta)=\\cos\\alpha\\cos\\beta-\\sin\\alpha\\sin\\beta')+' になります。';

  setupSliders();
  setupAnim();
  setupPresets();
  initWalkthrough();
  draw();
}

function draw(){
  let s='';
  s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#e0e0e0" stroke-width="2"/>`;
  s+=`<line x1="${cx-R-45}" y1="${cy}" x2="${cx+R+72}" y2="${cy}" stroke="#ccc" stroke-width="1.5"/>`;
  s+=`<line x1="${cx}" y1="${cy-R-72}" x2="${cx}" y2="${cy+R+45}" stroke="#ccc" stroke-width="1.5"/>`;
  s+=fo(cx+R+52,cy+18,24,24,T('x'),'font-size:14px;color:#999');
  s+=fo(cx+28,cy-R-78,24,24,T('y'),'font-size:14px;color:#999');
  s+=`<text x="${cx-14}" y="${cy+20}" font-size="15" fill="#999" font-weight="600">O</text>`;

  const gamma=alphaDeg-betaDeg;
  const A=ptAt(alphaDeg,R), B=ptAt(betaDeg,R), C=ptAt(gamma,R), E=ptAt(0,R);

  /* angle arcs */
  s+=`<path d="${arcPath(84,0,alphaDeg)}" fill="none" stroke="var(--c-blue)" stroke-width="2.5" opacity="0.8"/>`;
  if(Math.abs(betaDeg)>0.5) s+=`<path d="${arcPath(56,0,betaDeg)}" fill="none" stroke="var(--c-green)" stroke-width="2.5" opacity="0.8"/>`;
  const lb=ptAt(betaDeg/2,inRange(betaDeg)?36:76);
  let laR=106;
  if(Math.abs(betaDeg)>0.5){
    for(let k=0;k<14;k++){
      const p=ptAt(alphaDeg/2,laR);
      if(Math.hypot(p.x-lb.x,p.y-lb.y)>=40) break;
      laR+=8;
    }
  }
  const la=ptAt(alphaDeg/2,Math.min(laR,R-14));
  s+=fo(la.x-17,la.y-13,34,26,T('\\alpha'),'font-size:15px;color:var(--c-blue);font-weight:700;text-align:center;background:rgba(255,255,255,.85);border-radius:5px');
  if(Math.abs(betaDeg)>0.5) s+=fo(lb.x-17,lb.y-13,34,26,T('\\beta'),'font-size:15px;color:var(--c-green);font-weight:700;text-align:center;background:rgba(255,255,255,.85);border-radius:5px');

  /* radii */
  s+=`<line x1="${cx}" y1="${cy}" x2="${A.x}" y2="${A.y}" stroke="var(--c-blue)" stroke-width="2.5"/>`;
  s+=`<line x1="${cx}" y1="${cy}" x2="${B.x}" y2="${B.y}" stroke="var(--c-green)" stroke-width="2.5"/>`;
  s+=`<line x1="${cx}" y1="${cy}" x2="${C.x}" y2="${C.y}" stroke="var(--c-red)" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.7"/>`;
  s+=`<line x1="${cx}" y1="${cy}" x2="${E.x}" y2="${E.y}" stroke="var(--c-red)" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.7"/>`;

  /* chords */
  s+=`<line x1="${C.x}" y1="${C.y}" x2="${E.x}" y2="${E.y}" stroke="var(--c-red)" stroke-width="3" stroke-dasharray="9 5"/>`;
  s+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="var(--c-purple)" stroke-width="3.5"/>`;

  /* rotating ghost chord */
  if(rotT>0.001){
    const gA=ptAt(alphaDeg-betaDeg*rotT,R), gB=ptAt(betaDeg-betaDeg*rotT,R);
    s+=`<line x1="${gA.x}" y1="${gA.y}" x2="${gB.x}" y2="${gB.y}" stroke="var(--c-orange)" stroke-width="4" opacity="0.85"/>`;
    s+=`<line x1="${cx}" y1="${cy}" x2="${gA.x}" y2="${gA.y}" stroke="var(--c-orange)" stroke-width="2" opacity="0.6"/>`;
    s+=`<line x1="${cx}" y1="${cy}" x2="${gB.x}" y2="${gB.y}" stroke="var(--c-orange)" stroke-width="2" opacity="0.6"/>`;
    s+=`<circle cx="${gA.x}" cy="${gA.y}" r="8" fill="var(--c-orange)" stroke="#fff" stroke-width="2"/>`;
    s+=`<circle cx="${gB.x}" cy="${gB.y}" r="8" fill="var(--c-orange)" stroke="#fff" stroke-width="2"/>`;
  }

  /* points */
  s+=`<circle cx="${C.x}" cy="${C.y}" r="7" fill="var(--c-red)" stroke="#fff" stroke-width="2.5"/>`;
  s+=`<circle cx="${E.x}" cy="${E.y}" r="7" fill="var(--c-red)" stroke="#fff" stroke-width="2.5"/>`;
  s+=`<circle cx="${A.x}" cy="${A.y}" r="8" fill="var(--c-blue)" stroke="#fff" stroke-width="2.5"/>`;
  s+=`<circle cx="${B.x}" cy="${B.y}" r="8" fill="var(--c-green)" stroke="#fff" stroke-width="2.5"/>`;
  if(rotT>0.999){
    s+=`<circle cx="${C.x}" cy="${C.y}" r="12" fill="none" stroke="var(--c-orange)" stroke-width="3"><animate attributeName="r" values="12;18;12" dur="1.2s" repeatCount="indefinite"/></circle>`;
  }

  /* point labels: start just outside the circle, then push apart.
     The two axis names are fixed obstacles so no point label lands on them. */
  const items=[{n:'A',a:alphaDeg,c:'var(--c-blue)'},{n:'B',a:betaDeg,c:'var(--c-green)'},
               {n:'C',a:gamma,c:'var(--c-red)'},{n:'E',a:0,c:'var(--c-red)'}];
  const fixed=[{x:cx+R+64,y:cy+30},{x:cx+40,y:cy-R-66}];
  const L=items.map((it,k)=>{
    const p=ptAt(it.a,R+26);
    return {n:it.n,c:it.c,x:p.x+0.8*Math.cos(k*2.1),y:p.y+0.8*Math.sin(k*2.1)};
  });
  for(let pass=0;pass<40;pass++){
    let moved=false;
    for(let i=0;i<L.length;i++){
      for(const f of fixed){
        let dx=L[i].x-f.x, dy=L[i].y-f.y, d=Math.hypot(dx,dy);
        if(d<34){ if(d<0.01){dx=0;dy=1;d=1;} const k=(34-d)/d; L[i].x+=dx*k; L[i].y+=dy*k; moved=true; }
      }
      for(let j=i+1;j<L.length;j++){
        let dx=L[j].x-L[i].x, dy=L[j].y-L[i].y, d=Math.hypot(dx,dy);
        if(d<30){ if(d<0.01){dx=0.3;dy=1;d=1.04;} const k=(30-d)/(2*d);
          L[i].x-=dx*k; L[i].y-=dy*k; L[j].x+=dx*k; L[j].y+=dy*k; moved=true; }
      }
    }
    if(!moved) break;
  }
  for(const q of L) s+=halo(q.x,q.y+6,q.n,q.c);

  document.getElementById('graph').innerHTML=s;
  updateReadouts();
}
function inRange(b){return Math.abs(b)>=25;}

function updateReadouts(){
  const a=alphaDeg*D2R, b=betaDeg*D2R, g=alphaDeg-betaDeg;
  const dot=Math.cos(a)*Math.cos(b)+Math.sin(a)*Math.sin(b);
  const ab2=2-2*dot, ce2=2-2*Math.cos(g*D2R);
  document.getElementById('live-calc').innerHTML=
    T(`\\mathrm{AB}^2=2-2(\\cos\\alpha\\cos\\beta+\\sin\\alpha\\sin\\beta)=${f4(ab2)}`)+'<br>'+
    T(`\\mathrm{CE}^2=2-2\\cos(\\alpha-\\beta)=${f4(ce2)}`)+'<br>'+
    '<span style="color:var(--c-orange);font-weight:600">2つの値はいつでも一致します</span>';

  const ex=exactCos(g);
  const isInt=Math.abs(g-Math.round(g))<1e-9;
  const gTex = g<0 ? `(${degTex(g)})` : degTex(g);
  let line=`\\cos(\\alpha-\\beta)=\\cos ${gTex}`;
  if(ex && isInt) line+=`=${ex}`;
  line+=`=${f4(Math.cos(g*D2R))}`;
  const bTex = betaDeg<0 ? `(${degTex(betaDeg)})` : degTex(betaDeg);
  document.getElementById('exact-box').innerHTML=
    T(`\\alpha-\\beta=${degTex(alphaDeg)}-${bTex}=${degTex(g)}`)+'<br>'+T(line)+
    '<div style="font-size:.85rem;color:#888;margin-top:.5rem">'+
    T('\\alpha')+' と '+T('\\beta')+' の組が違っても、差が同じなら値も同じになります。</div>';
}

function setupSliders(){
  const sa=document.getElementById('a-slider'), sb=document.getElementById('b-slider');
  sa.addEventListener('input',()=>{alphaDeg=parseFloat(sa.value);document.getElementById('a-value').textContent=alphaDeg+'°';draw();});
  sb.addEventListener('input',()=>{betaDeg=parseFloat(sb.value);document.getElementById('b-value').textContent=betaDeg+'°';draw();});
}

function setPair(a,b){
  alphaDeg=a; betaDeg=b;
  const sa=document.getElementById('a-slider'), sb=document.getElementById('b-slider');
  sa.value=a; sb.value=b;
  document.getElementById('a-value').textContent=a+'°';
  document.getElementById('b-value').textContent=b+'°';
  draw();
}
function setupPresets(){
  document.getElementById('p1').addEventListener('click',()=>setPair(45,30));
  document.getElementById('p2').addEventListener('click',()=>setPair(45,-30));
  document.getElementById('p3').addEventListener('click',()=>setPair(120,45));
}

function setupAnim(){
  document.getElementById('anim-btn').addEventListener('click',()=>{
    if(animId){cancelAnimationFrame(animId);animId=null;}
    let st=null; const dur=1800;
    function stepFn(ts){
      if(!st) st=ts;
      const p=Math.min((ts-st)/dur,1);
      rotT = p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
      draw();
      if(p<1){ animId=requestAnimationFrame(stepFn); }
      else { animId=null; rotT=1; draw(); }
    }
    animId=requestAnimationFrame(stepFn);
  });
  document.getElementById('reset-btn').addEventListener('click',()=>{
    if(animId){cancelAnimationFrame(animId);animId=null;}
    rotT=0; draw();
  });
}

function initWalkthrough(){
  const steps=[
    {label:'Step 1: 75° を既に値の分かる角の和にする',
     formula:'75^\\circ=45^\\circ+30^\\circ'},
    {label:'Step 2: 余弦の加法定理（和）を用意する',
     formula:'\\cos(\\alpha+\\beta)=\\cos\\alpha\\cos\\beta-\\sin\\alpha\\sin\\beta'},
    {label:'Step 3: α に 45°、β に 30° を代入する',
     formula:'\\cos 75^\\circ=\\cos 45^\\circ\\cos 30^\\circ-\\sin 45^\\circ\\sin 30^\\circ'},
    {label:'Step 4: それぞれの値を入れる',
     formula:'=\\dfrac{\\sqrt{2}}{2}\\cdot\\dfrac{\\sqrt{3}}{2}-\\dfrac{\\sqrt{2}}{2}\\cdot\\dfrac{1}{2}'},
    {label:'Step 5: 通分して整理する',
     formula:'=\\dfrac{\\sqrt{6}}{4}-\\dfrac{\\sqrt{2}}{4}=\\dfrac{\\sqrt{6}-\\sqrt{2}}{4}'},
    {label:'Step 6: 15° は同じ2角の差で表せる',
     formula:'15^\\circ=45^\\circ-30^\\circ'},
    {label:'Step 7: 余弦の加法定理（差）を使う',
     formula:'\\cos 15^\\circ=\\cos 45^\\circ\\cos 30^\\circ+\\sin 45^\\circ\\sin 30^\\circ=\\dfrac{\\sqrt{2}}{2}\\cdot\\dfrac{\\sqrt{3}}{2}+\\dfrac{\\sqrt{2}}{2}\\cdot\\dfrac{1}{2}'},
    {label:'Step 8: 答え（符号だけが入れ替わる）',
     formula:'\\cos 75^\\circ=\\dfrac{\\sqrt{6}-\\sqrt{2}}{4},\\qquad \\cos 15^\\circ=\\dfrac{\\sqrt{6}+\\sqrt{2}}{4}'},
  ];
  let cur=0;
  const container=document.getElementById('walkthrough');
  const counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev');
  const nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=cur;i++){
      html+=`<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${cur+1} / ${steps.length}`;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{if(cur>0){cur--;render();}});
  nextBtn.addEventListener('click',()=>{if(cur<steps.length-1){cur++;render();}});
  render();
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
