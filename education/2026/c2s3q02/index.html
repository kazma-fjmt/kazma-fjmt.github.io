<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>アポロニウスの円</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step {
    padding: .75rem .25rem; border-bottom: 1px dashed #eee;
    animation: fadeIn .3s ease;
  }
  .step:last-child { border-bottom: none; }
  .step.current {
    background: #f0f5ff; border-radius: 8px; padding: .75rem;
    margin: .25rem -.5rem; border-bottom: none;
  }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; margin: 1rem 0 0;
  }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .note {
    background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px;
    padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem;
  }
  .live-calc {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto;
  }
  .live-calc .katex { font-size: 1.1rem; }

  .drag-hint {
    text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>アポロニウスの円</h1>
  <p class="subtitle">2定点からの距離の比が一定である点の軌跡を求めましょう。</p>

  <h2>問題</h2>
  <p>2点 <span id="f-A"></span> と <span id="f-B"></span> に対して、<span id="f-ratio"></span> を満たす点 P の軌跡を求めよ。</p>

  <h2>解法</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <div class="formula-box" id="result-box"></div>

  <h2>アポロニウスの円とは</h2>
  <div class="note" id="note-apollonius"></div>

  <h2>距離の比を確かめよう</h2>
  <p>点 P が円周上をアニメーションで移動します。AP:BP の比が常に 3:1 であることを確認しましょう。</p>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="live-calc" id="live-calc"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=600,ox=300,oy=300,scale=30;
const GRID_MIN=-9,GRID_MAX=9;

function px(x){return ox+x*scale;}
function py(y){return oy-y*scale;}

let animAngle = 0;
let animFrame = null;

function init(){
  document.getElementById('f-A').innerHTML = T('\\mathrm{A}(-6,\\,0)');
  document.getElementById('f-B').innerHTML = T('\\mathrm{B}(2,\\,0)');
  document.getElementById('f-ratio').innerHTML = T('\\mathrm{AP}:\\mathrm{BP} = 3:1');

  tex('(x-3)^2 + y^2 = 9 \\quad\\text{（中心}(3,0)\\text{、半径}3\\text{）}', document.getElementById('result-box'), true);

  document.getElementById('note-apollonius').innerHTML =
    '2定点 A, B からの距離の比 ' + T('\\mathrm{AP}:\\mathrm{BP} = m:n') + ' が一定（' + T('m \\neq n') + '）である点の軌跡は<strong>円</strong>になります。これを<strong>アポロニウスの円</strong>といいます。<br><br>' +
    'この円の直径の両端は、線分 AB を ' + T('m:n') + ' に<strong>内分する点</strong>と<strong>外分する点</strong>です。<br><br>' +
    '特別な場合として ' + T('m = n') + ' のとき、軌跡は線分 AB の<strong>垂直二等分線</strong>になります。';

  initWalkthrough();
  drawGraph();
  animate();
}

function initWalkthrough(){
  const steps = [
    { label: 'Step 1: 条件の設定', formula: '\\mathrm{P}(x,y)\\text{ とおく。}\\mathrm{AP}:\\mathrm{BP} = 3:1\\;\\Rightarrow\\;\\mathrm{AP} = 3\\,\\mathrm{BP}' },
    { label: 'Step 2: 両辺を2乗', formula: '\\mathrm{AP}^2 = 9\\,\\mathrm{BP}^2' },
    { label: 'Step 3: 距離の2乗を代入', formula: '(x+6)^2 + y^2 = 9\\{(x-2)^2 + y^2\\}' },
    { label: 'Step 4: 左辺を展開', formula: 'x^2 + 12x + 36 + y^2 = 9x^2 - 36x + 36 + 9y^2' },
    { label: 'Step 5: 整理', formula: '8x^2 + 8y^2 - 48x = 0 \\;\\Longrightarrow\\; x^2 + y^2 - 6x = 0' },
    { label: 'Step 6: 平方完成', formula: '(x-3)^2 + y^2 = 9' },
    { label: 'Step 7: 結論', formula: '\\text{軌跡は中心}(3,\\,0)\\text{、半径}3\\text{の円（アポロニウスの円）}' },
  ];

  let cur = 0;
  const container = document.getElementById('walkthrough');
  const counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');

  function render(){
    let html = '';
    for(let i=0;i<=cur;i++){
      html += `<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML = html;
    counter.textContent = `${cur+1} / ${steps.length}`;
    prevBtn.disabled = cur===0;
    nextBtn.disabled = cur===steps.length-1;
  }

  prevBtn.addEventListener('click', ()=>{ if(cur>0){cur--;render();} });
  nextBtn.addEventListener('click', ()=>{ if(cur<steps.length-1){cur++;render();} });
  render();
}

function drawGraph(){
  const svg = document.getElementById('graph');
  let s = '';

  /* Grid */
  for(let i=GRID_MIN;i<=GRID_MAX;i++){
    const xi=px(i), yi=py(i);
    s+=`<line x1="${xi}" y1="${py(GRID_MAX)}" x2="${xi}" y2="${py(GRID_MIN)}" stroke="${i===0?'#999':'#eee'}" stroke-width="${i===0?1.5:1}"/>`;
    s+=`<line x1="${px(GRID_MIN)}" y1="${yi}" x2="${px(GRID_MAX)}" y2="${yi}" stroke="${i===0?'#999':'#eee'}" stroke-width="${i===0?1.5:1}"/>`;
  }

  /* Axis labels */
  s+=`<foreignObject x="${Math.min(px(GRID_MAX)+2,W-26)}" y="${oy-20}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('x')}</div></foreignObject>`;
  s+=`<foreignObject x="${ox+6}" y="${Math.max(py(GRID_MAX)-18,2)}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('y')}</div></foreignObject>`;
  s+=`<text x="${ox+5}" y="${oy+18}" font-size="12" fill="#999">O</text>`;

  for(let i=GRID_MIN;i<=GRID_MAX;i++){
    if(i===0) continue;
    s+=`<text x="${px(i)}" y="${oy+18}" text-anchor="middle" font-size="11" fill="#aaa">${i}</text>`;
    s+=`<text x="${ox-10}" y="${py(i)+4}" text-anchor="end" font-size="11" fill="#aaa">${i}</text>`;
  }

  /* Apollonius circle: center (3,0), radius 3 */
  const ccx=3, ccy=0, cr=3;
  const circumference = 2 * Math.PI * cr * scale;
  s+=`<circle cx="${px(ccx)}" cy="${py(ccy)}" r="${cr*scale}" fill="rgba(40,167,69,0.08)" stroke="var(--c-green)" stroke-width="2.5" stroke-dasharray="${circumference}" stroke-dashoffset="0"/>`;

  /* Points A and B */
  const Ax=-6,Ay=0, Bx=2,By=0;
  s+=`<circle cx="${px(Ax)}" cy="${py(Ay)}" r="8" fill="var(--c-red)" stroke="#fff" stroke-width="2"/>`;
  s+=`<text x="${px(Ax)-12}" y="${py(Ay)-14}" font-size="14" font-weight="700" fill="var(--c-red)">A(-6, 0)</text>`;
  s+=`<circle cx="${px(Bx)}" cy="${py(By)}" r="8" fill="var(--c-blue)" stroke="#fff" stroke-width="2"/>`;
  s+=`<text x="${px(Bx)+12}" y="${py(By)-10}" font-size="14" font-weight="700" fill="var(--c-blue)">B(2, 0)</text>`;

  /* Center mark */
  s+=`<circle cx="${px(ccx)}" cy="${py(ccy)}" r="4" fill="var(--c-green)" stroke="#fff" stroke-width="1.5"/>`;
  s+=`<text x="${px(ccx)+8}" y="${py(ccy)-10}" font-size="12" fill="var(--c-green)" font-weight="600">(3, 0)</text>`;

  /* Internal / external division points */
  /* Internal division 3:1 of AB: ( (3*2 + 1*(-6)) / 4, 0 ) = (0, 0) */
  /* External division 3:1 of AB: ( (3*2 - 1*(-6)) / 2, 0 ) = (6, 0) */
  s+=`<circle cx="${px(0)}" cy="${py(0)}" r="5" fill="var(--c-orange)" stroke="#fff" stroke-width="1.5"/>`;
  s+=`<text x="${px(0)-5}" y="${py(0)+25}" font-size="11" fill="var(--c-orange)" font-weight="600">内分点</text>`;
  s+=`<circle cx="${px(6)}" cy="${py(0)}" r="5" fill="var(--c-orange)" stroke="#fff" stroke-width="1.5"/>`;
  s+=`<text x="${px(6)-5}" y="${py(0)+25}" font-size="11" fill="var(--c-orange)" font-weight="600">外分点</text>`;

  /* Animated point P on the circle */
  const Ppx = ccx + cr * Math.cos(animAngle);
  const Ppy = ccy + cr * Math.sin(animAngle);
  const apDist = Math.sqrt((Ppx-Ax)**2 + (Ppy-Ay)**2);
  const bpDist = Math.sqrt((Ppx-Bx)**2 + (Ppy-By)**2);

  /* Distance lines */
  s+=`<line x1="${px(Ax)}" y1="${py(Ay)}" x2="${px(Ppx)}" y2="${py(Ppy)}" stroke="var(--c-red)" stroke-width="2" stroke-dasharray="6 3" opacity="0.7"/>`;
  s+=`<line x1="${px(Bx)}" y1="${py(By)}" x2="${px(Ppx)}" y2="${py(Ppy)}" stroke="var(--c-blue)" stroke-width="2" stroke-dasharray="6 3" opacity="0.7"/>`;

  /* Point P */
  s+=`<circle cx="${px(Ppx)}" cy="${py(Ppy)}" r="9" fill="var(--c-purple)" stroke="#fff" stroke-width="2.5"/>`;
  s+=`<text x="${px(Ppx)+14}" y="${py(Ppy)-10}" font-size="13" font-weight="700" fill="var(--c-purple)">P</text>`;

  svg.innerHTML = s;

  /* Live calc */
  const ratio = bpDist > 0.001 ? apDist / bpDist : 0;
  const lcEl = document.getElementById('live-calc');
  lcEl.innerHTML =
    T(`\\mathrm{P}(${Ppx.toFixed(2)},\\;${Ppy.toFixed(2)})`) + '<br>' +
    T(`\\mathrm{AP} = ${apDist.toFixed(3)},\\quad \\mathrm{BP} = ${bpDist.toFixed(3)}`) + '<br>' +
    T(`\\mathrm{AP} : \\mathrm{BP} = ${apDist.toFixed(3)} : ${bpDist.toFixed(3)} \\approx ${ratio.toFixed(3)} : 1`);
}

function animate(){
  animAngle += 0.008;
  if(animAngle > 2*Math.PI) animAngle -= 2*Math.PI;
  drawGraph();
  animFrame = requestAnimationFrame(animate);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
</body>
</html>
