<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>半角の公式と符号の決定</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.05rem; }
  .live-calc .row { margin: .35rem 0; }

  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row {
    display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem;
  }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.05rem; font-weight: 700; color: var(--accent); min-width: 4.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .75rem; flex-wrap: wrap; margin: .5rem 0; }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; justify-content: center; margin: .5rem 0 0; font-size: .88rem; }
  .legend span.key { display: inline-flex; align-items: center; gap: .35rem; }
  .legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>半角の公式と符号の決定</h1>
  <p class="subtitle">単位円で角ともとの角の半分の位置を見比べながら、半角の公式の符号を決めましょう。</p>

  <h2>半角の公式</h2>
  <p>2倍角の公式 <span id="f-dbl"></span> において <span id="f-sub"></span> と置き換えると、次の 2 式が得られます。</p>
  <div class="formula-box" id="f-half"></div>
  <p>この公式が与えるのは <strong>2 乗の値</strong>だけです。平方根をとるときの符号は、<span id="f-halfang"></span> がどの象限にあるかで決めます。</p>

  <h2>解法ウォークスルー</h2>
  <p>次の問を順に解きます。<span id="f-problem"></span></p>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <p>スライダーを動かすか、円の上をドラッグすると <span id="f-alpha1"></span> が変わります。半分の角 <span id="f-alpha2"></span> がどこまで動くかに注目しましょう。</p>

  <div class="slider-row">
    <label><span id="lbl-a"></span> =</label>
    <input type="range" id="a-slider" min="0.02" max="6.26" step="0.01" value="3.98">
    <span class="slider-val" id="a-value">3.98</span>
  </div>

  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">アニメーション</button>
    <button class="btn" id="set-btn">問の値にする</button>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <p class="drag-hint">円の内側をドラッグしても角を動かせます</p>
  <div class="legend" id="legend"></div>

  <div class="live-calc" id="live-calc"></div>

  <h2>符号を間違えないために</h2>
  <div class="note" id="note-box"></div>
  <div class="formula-box" id="answer-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=600,ox=300,oy=250,R=165;
const TAU=Math.PI*2;
const A0=Math.PI+Math.acos(2/3);       /* problem value: cosine of alpha = -2/3 on pi < alpha < 3pi/2 */
const BAR_X0=95,BAR_X1=565,BAR_A=470,BAR_B=535;

let alpha=3.98;
let animId=null;

function cx(x){return ox+x*R;}
function cy(y){return oy-y*R;}
function bx(t){return BAR_X0+(t/TAU)*(BAR_X1-BAR_X0);}

function fmt(v,d){
  let s=v.toFixed(d);
  if(/^-0(\.0+)?$/.test(s)) s=s.slice(1);
  return s;
}
function quadName(a){
  const t=((a%TAU)+TAU)%TAU;
  const eps=1e-3;
  if(Math.abs(t)<eps||Math.abs(t-TAU)<eps||Math.abs(t-Math.PI)<eps) return '\\text{軸上}';
  if(Math.abs(t-Math.PI/2)<eps||Math.abs(t-3*Math.PI/2)<eps) return '\\text{軸上}';
  if(t<Math.PI/2) return '\\text{第1象限}';
  if(t<Math.PI) return '\\text{第2象限}';
  if(t<3*Math.PI/2) return '\\text{第3象限}';
  return '\\text{第4象限}';
}

function init(){
  document.getElementById('f-dbl').innerHTML=T('\\cos 2\\theta = 1-2\\sin^2\\theta = 2\\cos^2\\theta - 1');
  document.getElementById('f-sub').innerHTML=T('\\theta = \\dfrac{\\alpha}{2}');
  document.getElementById('f-halfang').innerHTML=T('\\dfrac{\\alpha}{2}');
  document.getElementById('f-alpha1').innerHTML=T('\\alpha');
  document.getElementById('f-alpha2').innerHTML=T('\\dfrac{\\alpha}{2}');
  document.getElementById('lbl-a').innerHTML=T('\\alpha');

  tex('\\sin^2\\dfrac{\\alpha}{2}=\\dfrac{1-\\cos\\alpha}{2},\\qquad \\cos^2\\dfrac{\\alpha}{2}=\\dfrac{1+\\cos\\alpha}{2}',document.getElementById('f-half'),true);
  document.getElementById('f-problem').innerHTML=T('\\pi<\\alpha<\\dfrac{3}{2}\\pi,\\;\\cos\\alpha=-\\dfrac{2}{3}\\;\\text{のとき}\\;\\cos\\dfrac{\\alpha}{2}\\;\\text{を求める}');

  document.getElementById('legend').innerHTML=
    '<span class="key"><i style="background:var(--c-red)"></i>'+T('\\mathrm{P}')+'：角 '+T('\\alpha')+' の動径の先</span>'+
    '<span class="key"><i style="background:var(--c-purple)"></i>'+T('\\mathrm{Q}')+'：角 '+T('\\dfrac{\\alpha}{2}')+' の動径の先</span>'+
    '<span class="key"><i style="background:#f6d5d4"></i>'+T('\\pi<\\alpha<\\dfrac{3}{2}\\pi')+'</span>'+
    '<span class="key"><i style="background:#ded8ff"></i>'+T('\\dfrac{\\pi}{2}<\\dfrac{\\alpha}{2}<\\dfrac{3}{4}\\pi')+'</span>'+
    '<span class="key"><i style="background:var(--c-green)"></i><i style="background:var(--c-purple)"></i>横の太線：'+T('\\cos\\dfrac{\\alpha}{2}')+'（右向きの緑は正、左向きの紫は負）</span>';

  const noteEl=document.getElementById('note-box');
  noteEl.innerHTML='<strong>範囲は必ず 2 で割る。</strong>'+
    T('\\pi<\\alpha<\\dfrac{3}{2}\\pi')+' の各辺を 2 で割ると '+T('\\dfrac{\\pi}{2}<\\dfrac{\\alpha}{2}<\\dfrac{3}{4}\\pi')+
    ' となり、'+T('\\dfrac{\\alpha}{2}')+' は第2象限の角です。第2象限では余弦が負なので、平方根には '+T('-')+' を付けます。'+
    T('\\alpha')+' が第3象限だからといって '+T('\\dfrac{\\alpha}{2}')+' も第3象限だと考えてはいけません。';

  tex('\\cos\\dfrac{\\alpha}{2}=-\\dfrac{1}{\\sqrt{6}}=-\\dfrac{\\sqrt{6}}{6}',document.getElementById('answer-box'),true);

  initWalkthrough();
  setupSlider();
  setupAnimation();
  setupDrag();
  draw();
}

function initWalkthrough(){
  const steps=[
    {label:'Step 1: 条件を確認する',
     formula:'\\pi<\\alpha<\\dfrac{3}{2}\\pi,\\qquad \\cos\\alpha=-\\dfrac{2}{3}'},
    {label:'Step 2: 余弦の半角の公式を書く',
     formula:'\\cos^2\\dfrac{\\alpha}{2}=\\dfrac{1+\\cos\\alpha}{2}'},
    {label:'Step 3: 値を代入する',
     formula:'\\cos^2\\dfrac{\\alpha}{2}=\\dfrac{1}{2}\\left\\{1+\\left(-\\dfrac{2}{3}\\right)\\right\\}=\\dfrac{1}{2}\\cdot\\dfrac{1}{3}=\\dfrac{1}{6}'},
    {label:'Step 4: 半分の角の範囲を出す',
     formula:'\\pi<\\alpha<\\dfrac{3}{2}\\pi \\;\\Longrightarrow\\; \\dfrac{\\pi}{2}<\\dfrac{\\alpha}{2}<\\dfrac{3}{4}\\pi'},
    {label:'Step 5: 象限から符号を決める',
     formula:'\\dfrac{\\alpha}{2}\\;\\text{は第2象限の角だから}\\;\\cos\\dfrac{\\alpha}{2}<0'},
    {label:'Step 6: 負の平方根をとる',
     formula:'\\cos\\dfrac{\\alpha}{2}=-\\sqrt{\\dfrac{1}{6}}=-\\dfrac{1}{\\sqrt{6}}'},
    {label:'Step 7: 分母を有理化する',
     formula:'-\\dfrac{1}{\\sqrt{6}}=-\\dfrac{1\\cdot\\sqrt{6}}{\\sqrt{6}\\cdot\\sqrt{6}}=-\\dfrac{\\sqrt{6}}{6}'},
    {label:'Step 8: 答え',
     formula:'\\cos\\dfrac{\\alpha}{2}=-\\dfrac{\\sqrt{6}}{6}\\;\\;(\\approx -0.408)'},
  ];
  let cur=0;
  const container=document.getElementById('walkthrough');
  const counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev');
  const nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=cur;i++){
      html+=`<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${cur+1} / ${steps.length}`;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{if(cur>0){cur--;render();}});
  nextBtn.addEventListener('click',()=>{if(cur<steps.length-1){cur++;render();}});
  render();
}

function sector(a0,a1,rad,fill){
  const x0=cx(rad*Math.cos(a0)),y0=cy(rad*Math.sin(a0));
  const x1=cx(rad*Math.cos(a1)),y1=cy(rad*Math.sin(a1));
  const large=(a1-a0)>Math.PI?1:0;
  return `<path d="M ${ox} ${oy} L ${x0} ${y0} A ${rad*R} ${rad*R} 0 ${large} 0 ${x1} ${y1} Z" fill="${fill}" stroke="none"/>`;
}
function arcPath(a0,a1,rad,color,wd,dash){
  const x0=cx(rad*Math.cos(a0)),y0=cy(rad*Math.sin(a0));
  const x1=cx(rad*Math.cos(a1)),y1=cy(rad*Math.sin(a1));
  const large=Math.abs(a1-a0)>Math.PI?1:0;
  return `<path d="M ${x0} ${y0} A ${rad*R} ${rad*R} 0 ${large} 0 ${x1} ${y1}" fill="none" stroke="${color}" stroke-width="${wd}"${dash?` stroke-dasharray="${dash}"`:''}/>`;
}

function draw(){
  const svg=document.getElementById('graph');
  const half=alpha/2;
  const cA=Math.cos(alpha),sA=Math.sin(alpha);
  const cH=Math.cos(half),sH=Math.sin(half);
  let s='';

  s+=sector(Math.PI,3*Math.PI/2,1,'#f6d5d4');
  s+=sector(Math.PI/2,3*Math.PI/4,1,'#ded8ff');

  s+=`<line x1="${cx(-1.28)}" y1="${oy}" x2="${cx(1.40)}" y2="${oy}" stroke="#bbb" stroke-width="1.5"/>`;
  s+=`<line x1="${ox}" y1="${cy(-1.14)}" x2="${ox}" y2="${cy(1.28)}" stroke="#bbb" stroke-width="1.5"/>`;
  s+=`<circle cx="${ox}" cy="${oy}" r="${R}" fill="none" stroke="#ccc" stroke-width="2"/>`;

  s+=`<text x="${cx(1)}" y="${oy+20}" text-anchor="middle" font-size="12" fill="#aaa">1</text>`;
  s+=`<text x="${cx(-1)}" y="${oy+20}" text-anchor="middle" font-size="12" fill="#aaa">-1</text>`;
  s+=`<text x="${ox-12}" y="${cy(1)+4}" text-anchor="end" font-size="12" fill="#aaa">1</text>`;
  s+=`<text x="${ox-12}" y="${cy(-1)+4}" text-anchor="end" font-size="12" fill="#aaa">-1</text>`;
  s+=`<foreignObject x="${cx(1.44)}" y="${oy-14}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('x')}</div></foreignObject>`;
  s+=`<foreignObject x="${ox+8}" y="${cy(1.30)-8}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('y')}</div></foreignObject>`;

  s+=arcPath(0,alpha,0.30,'var(--c-red)',2.5);
  s+=arcPath(0,half,0.52,'var(--c-purple)',2.5,'6 4');

  const segCol=cH<0?'var(--c-purple)':'var(--c-green)';
  s+=`<line x1="${ox}" y1="${oy}" x2="${cx(cH)}" y2="${oy}" stroke="${segCol}" stroke-width="6" opacity="0.55" stroke-linecap="round"/>`;
  s+=`<line x1="${cx(cH)}" y1="${oy}" x2="${cx(cH)}" y2="${cy(sH)}" stroke="var(--c-purple)" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.8"/>`;

  s+=`<line x1="${ox}" y1="${oy}" x2="${cx(cA)}" y2="${cy(sA)}" stroke="var(--c-red)" stroke-width="2.5"/>`;
  s+=`<line x1="${ox}" y1="${oy}" x2="${cx(cH)}" y2="${cy(sH)}" stroke="var(--c-purple)" stroke-width="2.5"/>`;

  s+=`<circle cx="${cx(cA)}" cy="${cy(sA)}" r="8" fill="var(--c-red)" stroke="#fff" stroke-width="2.5"/>`;
  s+=`<circle cx="${cx(cH)}" cy="${cy(sH)}" r="8" fill="var(--c-purple)" stroke="#fff" stroke-width="2.5">`;
  s+=`<animate attributeName="r" values="8;11;8" dur="1.8s" repeatCount="indefinite"/></circle>`;
  s+=`<circle cx="${ox}" cy="${oy}" r="4" fill="#666"/>`;

  const lp=(v,d)=>({x:cx(v.x*d),y:cy(v.y*d)});
  /* push Q's label outward when the two radii are nearly on top of each other */
  const qd=(1.14*R*half<24)?1.36:1.14;
  const pl=lp({x:cA,y:sA},1.14), ql=lp({x:cH,y:sH},qd);
  s+=`<text x="${pl.x}" y="${pl.y+5}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--c-red)" stroke="#fff" stroke-width="4" paint-order="stroke">P</text>`;
  s+=`<text x="${ql.x}" y="${ql.y+5}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--c-purple)" stroke="#fff" stroke-width="4" paint-order="stroke">Q</text>`;
  s+=`<text x="${ox-16}" y="${oy+20}" text-anchor="middle" font-size="14" font-weight="700" fill="#666">O</text>`;

  const barTitle=(y,label,color)=>`<foreignObject x="6" y="${y-15}" width="86" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:${color};font-weight:600;text-align:right">${label}</div></foreignObject>`;
  const ticks=[[0,'0'],[Math.PI/2,'\\dfrac{\\pi}{2}'],[Math.PI,'\\pi'],[3*Math.PI/2,'\\dfrac{3}{2}\\pi'],[TAU,'2\\pi']];

  s+=`<rect x="${bx(Math.PI)}" y="${BAR_A-9}" width="${bx(3*Math.PI/2)-bx(Math.PI)}" height="18" fill="#f6d5d4"/>`;
  s+=`<line x1="${BAR_X0}" y1="${BAR_A}" x2="${BAR_X1}" y2="${BAR_A}" stroke="#bbb" stroke-width="2"/>`;
  s+=barTitle(BAR_A,T('\\alpha'),'var(--c-red)');
  s+=`<rect x="${bx(Math.PI/2)}" y="${BAR_B-9}" width="${bx(3*Math.PI/4)-bx(Math.PI/2)}" height="18" fill="#ded8ff"/>`;
  s+=`<line x1="${BAR_X0}" y1="${BAR_B}" x2="${BAR_X1}" y2="${BAR_B}" stroke="#bbb" stroke-width="2"/>`;
  s+=barTitle(BAR_B,T('\\dfrac{\\alpha}{2}'),'var(--c-purple)');

  for(const [t,lab] of ticks){
    s+=`<line x1="${bx(t)}" y1="${BAR_A-9}" x2="${bx(t)}" y2="${BAR_A+9}" stroke="#bbb" stroke-width="1.5"/>`;
    s+=`<line x1="${bx(t)}" y1="${BAR_B-9}" x2="${bx(t)}" y2="${BAR_B+9}" stroke="#bbb" stroke-width="1.5"/>`;
    s+=`<foreignObject x="${bx(t)-24}" y="${BAR_B+12}" width="48" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#aaa;text-align:center">${T(lab)}</div></foreignObject>`;
  }
  s+=`<polygon points="${bx(alpha)},${BAR_A-11} ${bx(alpha)-7},${BAR_A-24} ${bx(alpha)+7},${BAR_A-24}" fill="var(--c-red)"/>`;
  s+=`<polygon points="${bx(half)},${BAR_B-11} ${bx(half)-7},${BAR_B-24} ${bx(half)+7},${BAR_B-24}" fill="var(--c-purple)"/>`;
  s+=`<line x1="${bx(alpha)}" y1="${BAR_A+10}" x2="${bx(half)}" y2="${BAR_B-26}" stroke="#c9c2f0" stroke-width="1.5" stroke-dasharray="4 4"/>`;

  svg.innerHTML=s;
  updateLive();
}

function updateLive(){
  const half=alpha/2;
  const cA=Math.cos(alpha),cH=Math.cos(half);
  const sq=(1+cA)/2;
  const inRange=(alpha>Math.PI&&alpha<3*Math.PI/2);
  const signTxt=cH<-1e-6?'\\cos\\dfrac{\\alpha}{2}<0':(cH>1e-6?'\\cos\\dfrac{\\alpha}{2}>0':'\\cos\\dfrac{\\alpha}{2}=0');
  const rootTxt=cH<-1e-6?'-\\sqrt{'+fmt(sq,3)+'}':'\\sqrt{'+fmt(sq,3)+'}';
  const el=document.getElementById('live-calc');
  el.innerHTML=
    `<div class="row">${T('\\alpha='+fmt(alpha,3)+'\\;('+fmt(alpha*180/Math.PI,1)+'^\\circ)\\quad '+quadName(alpha))}</div>`+
    `<div class="row">${T('\\dfrac{\\alpha}{2}='+fmt(half,3)+'\\;('+fmt(half*180/Math.PI,1)+'^\\circ)\\quad '+quadName(half))}</div>`+
    `<div class="row">${T('\\cos\\alpha='+fmt(cA,3)+'\\;\\Longrightarrow\\;\\cos^2\\dfrac{\\alpha}{2}=\\dfrac{1+\\cos\\alpha}{2}='+fmt(sq,3))}</div>`+
    `<div class="row">${T(signTxt+'\\;\\Longrightarrow\\;\\cos\\dfrac{\\alpha}{2}='+rootTxt+'='+fmt(cH,3))}</div>`+
    (inRange
      ? `<div class="row" style="color:var(--c-purple);font-weight:600">${T('\\pi<\\alpha<\\dfrac{3}{2}\\pi')} の範囲の中です</div>`
      : `<div class="row" style="color:#999">${T('\\pi<\\alpha<\\dfrac{3}{2}\\pi')} の範囲の外です</div>`)+
    (Math.abs(cA+2/3)<0.004&&inRange
      ? `<div class="row" style="color:var(--c-red);font-weight:600">${T('\\cos\\alpha=-\\dfrac{2}{3}')} のとき ${T('\\cos\\dfrac{\\alpha}{2}=-\\dfrac{\\sqrt{6}}{6}\\approx-0.408')}</div>`
      : '');
}

function setAlpha(a){
  alpha=Math.min(6.26,Math.max(0.02,a));
  const slider=document.getElementById('a-slider');
  slider.value=alpha;
  document.getElementById('a-value').textContent=fmt(alpha,2);
  draw();
}

function setupSlider(){
  const slider=document.getElementById('a-slider');
  slider.addEventListener('input',()=>{
    if(animId){cancelAnimationFrame(animId);animId=null;}
    setAlpha(parseFloat(slider.value));
  });
  document.getElementById('a-value').textContent=fmt(alpha,2);
}

function setupAnimation(){
  document.getElementById('anim-btn').addEventListener('click',()=>{
    if(animId){cancelAnimationFrame(animId);animId=null;}
    const startA=Math.PI+0.02,endA=3*Math.PI/2-0.02,duration=3200;
    let startTime=null;
    function animate(ts){
      if(!startTime) startTime=ts;
      const progress=Math.min((ts-startTime)/duration,1);
      const eased=progress<0.5?2*progress*progress:1-Math.pow(-2*progress+2,2)/2;
      setAlpha(startA+(endA-startA)*eased);
      if(progress<1) animId=requestAnimationFrame(animate); else animId=null;
    }
    animId=requestAnimationFrame(animate);
  });
  document.getElementById('set-btn').addEventListener('click',()=>{
    if(animId){cancelAnimationFrame(animId);animId=null;}
    setAlpha(A0);
  });
}

function setupDrag(){
  const svg=document.getElementById('graph');
  const wrap=document.getElementById('svg-wrap');
  let dragging=false;
  function toSvg(clientX,clientY){
    const rect=svg.getBoundingClientRect();
    return {x:(clientX-rect.left)/rect.width*W,y:(clientY-rect.top)/rect.height*H};
  }
  function apply(clientX,clientY){
    const p=toSvg(clientX,clientY);
    const dx=p.x-ox,dy=oy-p.y;
    let a=Math.atan2(dy,dx);
    if(a<0) a+=TAU;
    setAlpha(a);
  }
  function startDrag(clientX,clientY){
    const p=toSvg(clientX,clientY);
    const dx=p.x-ox,dy=oy-p.y;
    if(Math.sqrt(dx*dx+dy*dy)>1.7*R||p.y>430) return;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    dragging=true;
    apply(clientX,clientY);
  }
  function moveDrag(clientX,clientY){ if(dragging) apply(clientX,clientY); }
  function endDrag(){ dragging=false; }

  wrap.addEventListener('mousedown',e=>{e.preventDefault();startDrag(e.clientX,e.clientY);});
  window.addEventListener('mousemove',e=>{if(dragging){e.preventDefault();moveDrag(e.clientX,e.clientY);}});
  window.addEventListener('mouseup',endDrag);

  wrap.addEventListener('touchstart',e=>{const t=e.touches[0];startDrag(t.clientX,t.clientY);},{passive:true});
  wrap.addEventListener('touchmove',e=>{if(dragging){e.preventDefault();const t=e.touches[0];moveDrag(t.clientX,t.clientY);}},{passive:false});
  wrap.addEventListener('touchend',endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
