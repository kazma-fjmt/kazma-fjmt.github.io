<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>2つの円の共有点</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-a: #d9534f; --c-b: #2a6df4; --c-chord: #e67e22; --c-pt: #27ae60;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .live-calc {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; overflow-x: auto;
  }
  .live-calc .katex { font-size: 1.1rem; }

  .note {
    background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px;
    padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem;
  }

  .slider-row {
    display: flex; align-items: center; gap: .75rem;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: .75rem 0;
  }
  .slider-row label { font-weight: 600; min-width: 4.5rem; font-size: .9rem; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .val { min-width: 2.5rem; text-align: right; font-weight: 600; color: var(--accent); font-size: .9rem; }

  .legend {
    display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; margin: .5rem 0; font-size: .85rem;
  }
  .legend-item { display: flex; align-items: center; gap: .35rem; }
  .legend-swatch { width: 16px; height: 4px; border-radius: 2px; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step {
    padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease;
  }
  .step:last-child { border-bottom: none; }
  .step.current {
    background: #f0f5ff; border-radius: 8px; padding: .75rem;
    margin: .25rem -.5rem; border-bottom: none;
  }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.2rem; }
  .step.current .formula-line .katex { font-size: 1.3rem; }

  .controls-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; margin: 1rem 0 0;
  }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>2つの円の共有点</h1>
  <p class="subtitle">2つの円の交点を連立方程式で求める方法と、共通弦の考え方を学びましょう。</p>

  <h2>解法のポイント</h2>
  <p>2つの円の方程式を連立するとき、<strong>一方から他方を引く</strong>と1次式（直線の方程式）が得られます。この直線は2つの円の<strong>共通弦</strong>（交点を通る直線）を表します。</p>
  <div class="formula-box" id="formula-method"></div>
  <div class="note" id="note-method"></div>

  <h2>座標平面で確かめよう</h2>
  <p>円C₂の中心をスライダーで動かして、交点と共通弦の変化を観察しましょう。</p>

  <div class="svg-container" id="svg-wrap">
    <svg id="plane" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:var(--c-a)"></div>C₁</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--c-b)"></div>C₂</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--c-chord)"></div>共通弦</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--c-pt);height:8px;width:8px;border-radius:50%"></div>交点</div>
  </div>

  <div class="slider-row">
    <label style="color:var(--c-b)">C₂の中心x</label>
    <input type="range" id="slider-cx" min="1" max="8" step="0.5" value="6">
    <span class="val" id="val-cx">6</span>
  </div>
  <div class="slider-row">
    <label style="color:var(--c-b)">C₂の中心y</label>
    <input type="range" id="slider-cy" min="-5" max="5" step="0.5" value="-3">
    <span class="val" id="val-cy">-3</span>
  </div>
  <div class="slider-row">
    <label style="color:var(--c-b)">C₂の半径</label>
    <input type="range" id="slider-r2" min="1" max="7" step="0.5" value="5">
    <span class="val" id="val-r2">5</span>
  </div>

  <div class="live-calc" id="live-calc"></div>

  <h2>例題の解法</h2>
  <p><span id="f-c1-eq"></span> と <span id="f-c2-eq"></span> の交点を求めます。</p>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev">&larr; 戻る</button>
    <div class="step-counter">ステップ <span id="step-cur"></span> / <span id="step-tot"></span></div>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>
</main>

<script>
  function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
  function T(l){return katex.renderToString(l,{throwOnError:false});}

  /* State: C1: x²+y²=10 (center 0,0, r=√10), C2 adjustable */
  const c1x = 0, c1y = 0, r1 = Math.sqrt(10);
  let c2x = 6, c2y = -3, r2 = 5;
  const GRID_MIN = -7, GRID_MAX = 9;
  const SVG_SIZE = 600, PAD = 40;
  const usable = SVG_SIZE - 2 * PAD;

  function toSX(v){ return PAD + (v - GRID_MIN) / (GRID_MAX - GRID_MIN) * usable; }
  function toSY(v){ return PAD + (GRID_MAX - v) / (GRID_MAX - GRID_MIN) * usable; }

  /* Compute intersections of two circles */
  function circleIntersections(ax, ay, ar, bx, by, br) {
    const dx = bx - ax, dy = by - ay;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d > ar + br + 0.01 || d < Math.abs(ar - br) - 0.01 || d < 0.001) return [];
    const a = (ar*ar - br*br + d*d) / (2*d);
    const h2 = ar*ar - a*a;
    if (h2 < -0.01) return [];
    const h = Math.sqrt(Math.max(0, h2));
    const px = ax + a * dx / d, py = ay + a * dy / d;
    if (h < 0.01) return [{ x: px, y: py }];
    return [
      { x: px + h * dy / d, y: py - h * dx / d },
      { x: px - h * dy / d, y: py + h * dx / d }
    ];
  }

  /* Common chord line: subtract C2 from C1
     C1: x²+y²-10=0, C2: x²+y²-2*c2x*x-2*c2y*y+(c2x²+c2y²-r2²)=0
     Subtract: 2*c2x*x + 2*c2y*y - (c2x²+c2y²-r2²) - 10 = 0
     => 2*c2x*x + 2*c2y*y = c2x²+c2y²-r2²+10
  */
  function getChordLine() {
    const A = 2 * c2x;
    const B = 2 * c2y;
    const C = c2x*c2x + c2y*c2y - r2*r2 + 10;
    return { A, B, C }; // Ax + By = C
  }

  let animT = 0;
  let animFrame = null;

  function drawSVG() {
    const svg = document.getElementById('plane');
    let s = '';

    /* Grid */
    for (let i = GRID_MIN; i <= GRID_MAX; i++) {
      const x = toSX(i), y = toSY(i);
      s += `<line x1="${x}" y1="${PAD}" x2="${x}" y2="${SVG_SIZE-PAD}" stroke="${i===0?'#999':'#e8e8e8'}" stroke-width="${i===0?1.5:1}"/>`;
      s += `<line x1="${PAD}" y1="${y}" x2="${SVG_SIZE-PAD}" y2="${y}" stroke="${i===0?'#999':'#e8e8e8'}" stroke-width="${i===0?1.5:1}"/>`;
    }
    s += `<foreignObject x="${Math.min(SVG_SIZE-PAD+2,SVG_SIZE-26)}" y="${toSY(0)-14}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999;text-align:center">${T('x')}</div></foreignObject>`;
    s += `<foreignObject x="${toSX(0)-12}" y="${Math.max(PAD-28,2)}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999;text-align:center">${T('y')}</div></foreignObject>`;
    for (let i = GRID_MIN; i <= GRID_MAX; i++) {
      if (i === 0) continue;
      s += `<text x="${toSX(i)}" y="${toSY(0)+18}" text-anchor="middle" font-size="11" fill="#aaa">${i}</text>`;
      s += `<text x="${toSX(0)-10}" y="${toSY(i)+4}" text-anchor="end" font-size="11" fill="#aaa">${i}</text>`;
    }
    s += `<text x="${toSX(0)-10}" y="${toSY(0)+18}" text-anchor="end" font-size="11" fill="#aaa">O</text>`;

    /* Common chord line */
    const chord = getChordLine();
    const pts = circleIntersections(c1x, c1y, r1, c2x, c2y, r2);
    if (pts.length > 0 && (Math.abs(chord.A) > 0.01 || Math.abs(chord.B) > 0.01)) {
      let lx1, ly1, lx2, ly2;
      if (Math.abs(chord.B) > Math.abs(chord.A)) {
        lx1 = GRID_MIN; ly1 = (chord.C - chord.A * lx1) / chord.B;
        lx2 = GRID_MAX; ly2 = (chord.C - chord.A * lx2) / chord.B;
      } else {
        ly1 = GRID_MIN; lx1 = (chord.C - chord.B * ly1) / chord.A;
        ly2 = GRID_MAX; lx2 = (chord.C - chord.B * ly2) / chord.A;
      }
      s += `<line x1="${toSX(lx1)}" y1="${toSY(ly1)}" x2="${toSX(lx2)}" y2="${toSY(ly2)}" stroke="var(--c-chord)" stroke-width="2.5" stroke-dasharray="8 4" stroke-opacity="0.7"/>`;
      // Label
      const midLx = (toSX(lx1) + toSX(lx2)) / 2;
      const midLy = (toSY(ly1) + toSY(ly2)) / 2;
      s += `<text x="${midLx + 15}" y="${midLy - 10}" font-size="12" font-weight="600" fill="var(--c-chord)">共通弦</text>`;
    }

    /* Circle 1 */
    const sr1 = r1 / (GRID_MAX - GRID_MIN) * usable;
    s += `<circle cx="${toSX(c1x)}" cy="${toSY(c1y)}" r="${sr1}" fill="rgba(217,83,79,0.07)" stroke="var(--c-a)" stroke-width="2.5"/>`;
    s += `<circle cx="${toSX(c1x)}" cy="${toSY(c1y)}" r="5" fill="var(--c-a)" stroke="#fff" stroke-width="2"/>`;
    s += `<text x="${toSX(c1x)+12}" y="${toSY(c1y)-10}" font-size="12" font-weight="600" fill="var(--c-a)">C₁</text>`;

    /* Circle 2 */
    const sr2 = r2 / (GRID_MAX - GRID_MIN) * usable;
    s += `<circle cx="${toSX(c2x)}" cy="${toSY(c2y)}" r="${sr2}" fill="rgba(42,109,244,0.07)" stroke="var(--c-b)" stroke-width="2.5"/>`;
    s += `<circle cx="${toSX(c2x)}" cy="${toSY(c2y)}" r="5" fill="var(--c-b)" stroke="#fff" stroke-width="2"/>`;
    s += `<text x="${toSX(c2x)+12}" y="${toSY(c2y)-10}" font-size="12" font-weight="600" fill="var(--c-b)">C₂(${c2x},${c2y})</text>`;

    /* Intersection points */
    pts.forEach((p, i) => {
      const pulseR = 6 + 2.5 * Math.sin(animT * 3 + i * Math.PI);
      s += `<circle cx="${toSX(p.x)}" cy="${toSY(p.y)}" r="${pulseR}" fill="var(--c-pt)" stroke="#fff" stroke-width="2"/>`;
      const rx = Math.round(p.x * 10) / 10, ry = Math.round(p.y * 10) / 10;
      s += `<text x="${toSX(p.x)+12}" y="${toSY(p.y)-12}" font-size="12" font-weight="600" fill="var(--c-pt)">(${rx}, ${ry})</text>`;
    });

    svg.innerHTML = s;
    updateCalc(pts, chord);
  }

  function updateCalc(pts, chord) {
    const el = document.getElementById('live-calc');
    let html = '';

    // Show chord line equation
    if (Math.abs(chord.A) > 0.01 || Math.abs(chord.B) > 0.01) {
      const a = Math.round(chord.A * 10) / 10;
      const b = Math.round(chord.B * 10) / 10;
      const c = Math.round(chord.C * 10) / 10;
      html += `<div style="margin-bottom:.4rem"><span style="color:var(--c-chord);font-weight:600">共通弦：</span>${T(`${a}x ${b >= 0 ? '+' : '-'} ${Math.abs(b)}y = ${c}`)}</div>`;
    }

    if (pts.length === 0) {
      html += `<div style="color:var(--muted)">交点なし</div>`;
    } else {
      pts.forEach((p, i) => {
        const rx = Math.round(p.x * 100) / 100, ry = Math.round(p.y * 100) / 100;
        html += `<div><span style="color:var(--c-pt);font-weight:600">交点${i+1}：</span>${T(`(${rx},\\; ${ry})`)}</div>`;
      });
    }
    el.innerHTML = html;
  }

  function animate() {
    animT += 0.02;
    drawSVG();
    animFrame = requestAnimationFrame(animate);
  }

  /* Walkthrough */
  const steps = [
    { title: "2つの円の方程式", tex: "C_1: x^2+y^2=10 \\quad \\cdots (1) \\\\[4pt] C_2: x^2+y^2-12x+6y+20=0 \\quad \\cdots (2)" },
    { title: "C₂を整理", tex: "C_2: (x-6)^2+(y+3)^2 = 25 \\quad \\text{中心}(6,-3),\\; \\text{半径 }5" },
    { title: "(1)-(2)で引く", tex: "(1)-(2): \\quad 12x - 6y - 30 = 0" },
    { title: "共通弦の方程式", tex: "2x - y - 5 = 0 \\quad \\Rightarrow \\quad y = 2x - 5 \\quad \\cdots (3)" },
    { title: "(3)を(1)に代入", tex: "x^2 + (2x-5)^2 = 10 \\\\[4pt] x^2 + 4x^2 - 20x + 25 = 10" },
    { title: "整理", tex: "5x^2 - 20x + 15 = 0 \\\\[4pt] x^2 - 4x + 3 = 0" },
    { title: "因数分解", tex: "(x-1)(x-3) = 0 \\quad \\Rightarrow \\quad x = 1,\\; 3" },
    { title: "交点の座標", tex: "x=1: y=2(1)-5=-3 \\quad \\Rightarrow \\quad (1,\\,-3) \\\\[4pt] x=3: y=2(3)-5=1 \\quad \\Rightarrow \\quad (3,\\,1)" },
    { title: "答え", tex: "\\boxed{\\text{交点 } (1,\\,-3) \\text{ と } (3,\\,1)}" }
  ];
  let curStep = 0;

  function renderWalk() {
    const root = document.getElementById('walkthrough');
    let html = '';
    for (let i = 0; i <= curStep; i++) {
      const st = steps[i];
      const cls = i === curStep ? 'current' : '';
      html += `<div class="step ${cls}"><div class="label">${st.title}</div><div class="formula-line">${T(st.tex)}</div></div>`;
    }
    root.innerHTML = html;
    document.getElementById('step-cur').textContent = curStep + 1;
    document.getElementById('step-tot').textContent = steps.length;
    document.getElementById('prev').disabled = curStep === 0;
    document.getElementById('next').disabled = curStep === steps.length - 1;
  }

  function init() {
    tex("C_1 - C_2 \\;\\Rightarrow\\; \\text{1次式（共通弦の直線）}", document.getElementById('formula-method'), true);
    document.getElementById('note-method').innerHTML =
      "2つの円の方程式を辺々引くと、" + T("x^2, y^2") + " の項が消えて1次式になります。これが2つの交点を通る直線（共通弦）の方程式です。この直線をどちらかの円の方程式に代入すると交点が求まります。";
    document.getElementById('f-c1-eq').innerHTML = T("C_1: x^2+y^2=10");
    document.getElementById('f-c2-eq').innerHTML = T("C_2: x^2+y^2-12x+6y+20=0");

    const sCx = document.getElementById('slider-cx');
    const sCy = document.getElementById('slider-cy');
    const sR2 = document.getElementById('slider-r2');
    sCx.addEventListener('input', () => { c2x = parseFloat(sCx.value); document.getElementById('val-cx').textContent = c2x; });
    sCy.addEventListener('input', () => { c2y = parseFloat(sCy.value); document.getElementById('val-cy').textContent = c2y; });
    sR2.addEventListener('input', () => { r2 = parseFloat(sR2.value); document.getElementById('val-r2').textContent = r2; });

    drawSVG();
    animate();

    document.getElementById('prev').addEventListener('click', () => { if (curStep > 0) { curStep--; renderWalk(); } });
    document.getElementById('next').addEventListener('click', () => { if (curStep < steps.length - 1) { curStep++; renderWalk(); } });
    renderWalk();
  }

  if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{if(window.katex)init();else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}});
</script>
</body>
</html>
