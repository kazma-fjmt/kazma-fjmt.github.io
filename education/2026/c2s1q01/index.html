<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>数直線上の2点間の距離</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa;
    --fg: #333;
    --muted: #888;
    --accent: #2a6df4;
    --c-a: #d9534f;
    --c-b: #2a6df4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 {
    font-size: 1.15rem; margin: 2.25rem 0 .75rem;
    border-left: 4px solid var(--accent); padding-left: .6rem;
  }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.3rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none;
    position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step {
    padding: .75rem .25rem; border-bottom: 1px dashed #eee;
    transition: background .2s ease;
  }
  .step:last-child { border-bottom: none; }
  .step.current {
    background: #f0f5ff; border-radius: 8px; padding: .75rem;
    margin: .25rem -.5rem; border-bottom: none;
  }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.2rem; }
  .step.current .formula-line .katex { font-size: 1.35rem; }

  .controls-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; margin: 1rem 0 0;
  }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter {
    color: var(--muted); font-size: .9rem; text-align: center; flex: 1;
  }

  .note {
    background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px;
    padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem;
  }

  .live-calc {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; text-align: center;
    overflow-x: auto;
  }
  .live-calc .katex { font-size: 1.25rem; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .step { animation: fadeIn .3s ease; }
  @keyframes pulse { 0%,100% { r: 8; } 50% { r: 11; } }
</style>
</head>
<body>
<main>
  <h1>数直線上の2点間の距離</h1>
  <p class="subtitle">数直線上の2点間の距離の公式を視覚的に理解しましょう。</p>

  <h2>公式</h2>
  <p>数直線上の2点 A(<span id="f-a-label"></span>)、B(<span id="f-b-label"></span>) 間の距離は：</p>
  <div class="formula-box" id="formula-main"></div>

  <h2>数直線で確かめよう</h2>
  <p>点 A と点 B をドラッグして動かしてみましょう。</p>

  <div class="svg-container" id="svg-wrap">
    <svg id="numberline" viewBox="0 0 700 160" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="live-calc" id="live-calc"></div>

  <h2>例題 1</h2>
  <p>A(3)、B(&minus;1) のとき、2点間の距離 AB を求める。</p>

  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev">&larr; 戻る</button>
    <div class="step-counter">ステップ <span id="step-cur"></span> / <span id="step-tot"></span></div>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <div class="note" id="note-abs"></div>
</main>

<script>
  function tex(latex, el, dm) { katex.render(latex, el, { throwOnError: false, displayMode: !!dm }); }
  function T(l) { return katex.renderToString(l, { throwOnError: false }); }

  /* --- number line state --- */
  let ptA = 3, ptB = -1;
  const NL_MIN = -6, NL_MAX = 6;
  const PAD_L = 50, PAD_R = 50, Y_LINE = 80;
  const SVG_W = 700;
  const usable = SVG_W - PAD_L - PAD_R;

  function valToX(v) { return PAD_L + (v - NL_MIN) / (NL_MAX - NL_MIN) * usable; }
  function xToVal(x) {
    let v = NL_MIN + (x - PAD_L) / usable * (NL_MAX - NL_MIN);
    return Math.round(v);
  }

  function drawSVG() {
    const svg = document.getElementById('numberline');
    let s = '';
    /* axis line */
    s += `<line x1="${PAD_L}" y1="${Y_LINE}" x2="${SVG_W-PAD_R}" y2="${Y_LINE}" stroke="#bbb" stroke-width="2"/>`;
    /* arrow heads */
    s += `<polygon points="${PAD_L-8},${Y_LINE} ${PAD_L+2},${Y_LINE-5} ${PAD_L+2},${Y_LINE+5}" fill="#bbb"/>`;
    s += `<polygon points="${SVG_W-PAD_R+8},${Y_LINE} ${SVG_W-PAD_R-2},${Y_LINE-5} ${SVG_W-PAD_R-2},${Y_LINE+5}" fill="#bbb"/>`;
    /* ticks */
    for (let i = NL_MIN; i <= NL_MAX; i++) {
      const x = valToX(i);
      s += `<line x1="${x}" y1="${Y_LINE-6}" x2="${x}" y2="${Y_LINE+6}" stroke="#bbb" stroke-width="1.5"/>`;
      s += `<text x="${x}" y="${Y_LINE+24}" text-anchor="middle" font-size="13" fill="#666">${i}</text>`;
    }
    /* distance arc */
    const xA = valToX(ptA), xB = valToX(ptB);
    const left = Math.min(xA, xB), right = Math.max(xA, xB);
    const dist = Math.abs(ptB - ptA);
    if (dist > 0) {
      const mid = (left + right) / 2;
      const arcH = 20 + dist * 2.5;
      s += `<path d="M ${left} ${Y_LINE - 10} Q ${mid} ${Y_LINE - arcH} ${right} ${Y_LINE - 10}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 3"/>`;
      s += `<text x="${mid}" y="${Y_LINE - arcH + 6}" text-anchor="middle" font-size="14" font-weight="600" fill="var(--accent)">AB = ${dist}</text>`;
    }
    /* distance bracket on line */
    if (dist > 0) {
      s += `<line x1="${left}" y1="${Y_LINE+34}" x2="${right}" y2="${Y_LINE+34}" stroke="var(--accent)" stroke-width="2.5" opacity=".4"/>`;
      s += `<line x1="${left}" y1="${Y_LINE+28}" x2="${left}" y2="${Y_LINE+40}" stroke="var(--accent)" stroke-width="2" opacity=".4"/>`;
      s += `<line x1="${right}" y1="${Y_LINE+28}" x2="${right}" y2="${Y_LINE+40}" stroke="var(--accent)" stroke-width="2" opacity=".4"/>`;
    }
    /* point A */
    s += `<circle cx="${xA}" cy="${Y_LINE}" r="8" fill="var(--c-a)" stroke="#fff" stroke-width="2" class="draggable" data-pt="A" style="cursor:grab"/>`;
    s += `<text x="${xA}" y="${Y_LINE-16}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--c-a)">A(${ptA})</text>`;
    /* point B */
    s += `<circle cx="${xB}" cy="${Y_LINE}" r="8" fill="var(--c-b)" stroke="#fff" stroke-width="2" class="draggable" data-pt="B" style="cursor:grab"/>`;
    s += `<text x="${xB}" y="${Y_LINE-16}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--c-b)">B(${ptB})</text>`;
    svg.innerHTML = s;
    updateCalc();
  }

  function updateCalc() {
    const el = document.getElementById('live-calc');
    const dist = Math.abs(ptB - ptA);
    const bma = ptB - ptA;
    const signStr = bma >= 0 ? String(bma) : `(${bma})`;
    el.innerHTML = T(`\\mathrm{AB} = |b - a| = |${signStr}| = ${dist}`);
  }

  /* drag handling */
  let dragging = null;
  function ptrDown(e) {
    const tgt = e.target;
    if (tgt.classList && tgt.classList.contains('draggable')) {
      dragging = tgt.dataset.pt;
      e.preventDefault();
    }
  }
  function ptrMove(e) {
    if (!dragging) return;
    e.preventDefault();
    const svg = document.getElementById('numberline');
    const rect = svg.getBoundingClientRect();
    const scaleX = 700 / rect.width;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const svgX = (clientX - rect.left) * scaleX;
    let v = xToVal(svgX);
    v = Math.max(NL_MIN, Math.min(NL_MAX, v));
    if (dragging === 'A') ptA = v;
    else ptB = v;
    drawSVG();
  }
  function ptrUp() { dragging = null; }

  /* walkthrough for example 1 */
  const steps = [
    { title: "問題", tex: "\\mathrm{A}(3),\\; \\mathrm{B}(-1) \\text{ のとき AB を求める}" },
    { title: "公式を適用", tex: "\\mathrm{AB} = |b - a| = |(-1) - 3|" },
    { title: "計算", tex: "= |-4|" },
    { title: "絶対値を求める", tex: "= 4" },
    { title: "答え", tex: "\\therefore\\; \\mathrm{AB} = 4" }
  ];
  let curStep = 0;

  function renderWalk() {
    const root = document.getElementById('walkthrough');
    let html = '';
    for (let i = 0; i <= curStep; i++) {
      const s = steps[i];
      const cls = i === curStep ? 'current' : '';
      html += `<div class="step ${cls}">
        <div class="label">${s.title}</div>
        <div class="formula-line">${T(s.tex)}</div>
      </div>`;
    }
    root.innerHTML = html;
    document.getElementById('step-cur').textContent = curStep + 1;
    document.getElementById('step-tot').textContent = steps.length;
    document.getElementById('prev').disabled = curStep === 0;
    document.getElementById('next').disabled = curStep === steps.length - 1;
  }

  function init() {
    /* formula */
    tex("\\mathrm{AB} = |b - a|", document.getElementById('formula-main'), true);
    document.getElementById('f-a-label').innerHTML = T("a");
    document.getElementById('f-b-label').innerHTML = T("b");

    /* note */
    document.getElementById('note-abs').innerHTML =
      "絶対値 " + T("|x|") + " は数直線上での原点からの距離を表します。" +
      T("|b - a|") + " は A と B の間の距離（常に 0 以上）です。";

    /* SVG */
    drawSVG();

    /* drag events */
    const wrap = document.getElementById('svg-wrap');
    wrap.addEventListener('mousedown', ptrDown);
    wrap.addEventListener('mousemove', ptrMove);
    wrap.addEventListener('mouseup', ptrUp);
    wrap.addEventListener('mouseleave', ptrUp);
    wrap.addEventListener('touchstart', ptrDown, { passive: false });
    wrap.addEventListener('touchmove', ptrMove, { passive: false });
    wrap.addEventListener('touchend', ptrUp);

    /* walkthrough */
    document.getElementById('prev').addEventListener('click', () => {
      if (curStep > 0) { curStep--; renderWalk(); }
    });
    document.getElementById('next').addEventListener('click', () => {
      if (curStep < steps.length - 1) { curStep++; renderWalk(); }
    });
    renderWalk();
  }

  if (window.katex) init();
  else window.addEventListener("DOMContentLoaded", () => {
    if (window.katex) init();
    else { const w = setInterval(() => { if (window.katex) { clearInterval(w); init(); } }, 30); }
  });
</script>
</body>
</html>
