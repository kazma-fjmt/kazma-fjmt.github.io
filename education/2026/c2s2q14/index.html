<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>2つの円の位置関係</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-a: #d9534f; --c-b: #2a6df4; --c-circle: #5cb85c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.15rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .live-calc {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; overflow-x: auto;
  }
  .live-calc .katex { font-size: 1.1rem; }

  .note {
    background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px;
    padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem;
  }

  .slider-row {
    display: flex; align-items: center; gap: .75rem;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: .75rem 0;
  }
  .slider-row label { font-weight: 600; min-width: 2.5rem; font-size: .9rem; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .val { min-width: 2.5rem; text-align: right; font-weight: 600; color: var(--accent); }

  .case-badge {
    display: inline-block; padding: .35rem .85rem; border-radius: 20px;
    font-weight: 700; font-size: 1rem; margin: .5rem 0;
    animation: fadeIn .3s ease;
  }

  .cases-table {
    width: 100%; border-collapse: collapse; margin: .75rem 0;
    font-size: .9rem;
  }
  .cases-table th, .cases-table td {
    border: 1px solid #e3e3e3; padding: .5rem .75rem; text-align: center;
  }
  .cases-table th { background: #f0f5ff; font-weight: 600; }
  .cases-table tr.active { background: #fffbe6; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step {
    padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease;
  }
  .step:last-child { border-bottom: none; }
  .step.current {
    background: #f0f5ff; border-radius: 8px; padding: .75rem;
    margin: .25rem -.5rem; border-bottom: none;
  }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.2rem; }
  .step.current .formula-line .katex { font-size: 1.35rem; }

  .controls-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; margin: 1rem 0 0;
  }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>2つの円の位置関係</h1>
  <p class="subtitle">中心間の距離と半径の関係から、2つの円の位置関係を判定する方法を学びましょう。</p>

  <h2>5つの位置関係</h2>
  <p>2つの円の半径を <span id="f-rR"></span>（<span id="f-rgeR"></span>）、中心間の距離を <span id="f-d"></span> とするとき、次の5通りの位置関係があります。</p>

  <table class="cases-table" id="cases-table">
    <thead><tr><th>条件</th><th>位置関係</th><th>共有点</th></tr></thead>
    <tbody>
      <tr data-case="1"><td id="tc1c"></td><td>離れている</td><td>0個</td></tr>
      <tr data-case="2"><td id="tc2c"></td><td>外接する</td><td>1個</td></tr>
      <tr data-case="3"><td id="tc3c"></td><td>2点で交わる</td><td>2個</td></tr>
      <tr data-case="4"><td id="tc4c"></td><td>内接する</td><td>1個</td></tr>
      <tr data-case="5"><td id="tc5c"></td><td>一方が内部にある</td><td>0個</td></tr>
    </tbody>
  </table>

  <h2>座標平面で確かめよう</h2>
  <p>2つの円の中心をドラッグして動かし、スライダーで半径を変えてみましょう。位置関係が自動で判定されます。</p>

  <div class="svg-container" id="svg-wrap">
    <svg id="plane" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="slider-row">
    <label style="color:var(--c-a)"><span id="lbl-r1"></span></label>
    <input type="range" id="slider-r1" min="0.5" max="6" step="0.5" value="3">
    <span class="val" id="val-r1">3</span>
  </div>
  <div class="slider-row">
    <label style="color:var(--c-b)"><span id="lbl-r2"></span></label>
    <input type="range" id="slider-r2" min="0.5" max="6" step="0.5" value="2">
    <span class="val" id="val-r2">2</span>
  </div>

  <div class="live-calc" id="live-calc"></div>

  <h2>例題6の解法</h2>
  <p>円 <span id="f-ex-c1"></span>（中心O、半径<span id="f-ex-r1"></span>）に<strong>内接</strong>する、中心が <span id="f-ex-center2"></span> の円の方程式を求めます。</p>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev">&larr; 戻る</button>
    <div class="step-counter">ステップ <span id="step-cur"></span> / <span id="step-tot"></span></div>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>
</main>

<script>
  function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
  function T(l){return katex.renderToString(l,{throwOnError:false});}

  /* State */
  let c1x = -1, c1y = 0, r1 = 3;
  let c2x = 4, c2y = 0, r2 = 2;
  const GRID_MIN = -8, GRID_MAX = 8;
  const SVG_SIZE = 600, PAD = 40;
  const usable = SVG_SIZE - 2 * PAD;

  function toSX(v){ return PAD + (v - GRID_MIN) / (GRID_MAX - GRID_MIN) * usable; }
  function toSY(v){ return PAD + (GRID_MAX - v) / (GRID_MAX - GRID_MIN) * usable; }
  function toMX(sx){ return (sx - PAD) / usable * (GRID_MAX - GRID_MIN) + GRID_MIN; }
  function toMY(sy){ return GRID_MAX - (sy - PAD) / usable * (GRID_MAX - GRID_MIN); }

  function getCase(d, rBig, rSmall) {
    const eps = 0.01;
    if (d > rBig + rSmall + eps) return 1;
    if (Math.abs(d - (rBig + rSmall)) < eps) return 2;
    if (d > rBig - rSmall + eps && d < rBig + rSmall - eps) return 3;
    if (Math.abs(d - (rBig - rSmall)) < eps) return 4;
    if (d < rBig - rSmall - eps) return 5;
    // Edge cases near boundaries
    if (d >= rBig + rSmall - eps) return 2;
    if (d <= rBig - rSmall + eps) return 4;
    return 3;
  }

  const caseNames = {
    1: '離れている',
    2: '外接する',
    3: '2点で交わる',
    4: '内接する',
    5: '一方が内部にある'
  };
  const caseColors = {
    1: '#e74c3c', 2: '#e67e22', 3: '#27ae60', 4: '#2980b9', 5: '#8e44ad'
  };

  let animT = 0;
  let animFrame = null;

  function drawSVG() {
    const svg = document.getElementById('plane');
    let s = '';

    /* Grid */
    for (let i = GRID_MIN; i <= GRID_MAX; i++) {
      const x = toSX(i), y = toSY(i);
      s += `<line x1="${x}" y1="${PAD}" x2="${x}" y2="${SVG_SIZE-PAD}" stroke="${i===0?'#999':'#e8e8e8'}" stroke-width="${i===0?1.5:1}"/>`;
      s += `<line x1="${PAD}" y1="${y}" x2="${SVG_SIZE-PAD}" y2="${y}" stroke="${i===0?'#999':'#e8e8e8'}" stroke-width="${i===0?1.5:1}"/>`;
    }
    s += `<foreignObject x="${SVG_SIZE-PAD}" y="${toSY(0)-9}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999;text-align:center">${T('x')}</div></foreignObject>`;
    s += `<foreignObject x="${toSX(0)-12}" y="${Math.max(PAD-30,2)}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999;text-align:center">${T('y')}</div></foreignObject>`;
    for (let i = GRID_MIN; i <= GRID_MAX; i++) {
      if (i === 0) continue;
      s += `<text x="${toSX(i)}" y="${toSY(0)+18}" text-anchor="middle" font-size="11" fill="#aaa">${i}</text>`;
      s += `<text x="${toSX(0)-10}" y="${toSY(i)+4}" text-anchor="end" font-size="11" fill="#aaa">${i}</text>`;
    }
    s += `<text x="${toSX(0)-10}" y="${toSY(0)+18}" text-anchor="end" font-size="11" fill="#aaa">O</text>`;

    /* Distance line between centers */
    const sc1x = toSX(c1x), sc1y = toSY(c1y);
    const sc2x = toSX(c2x), sc2y = toSY(c2y);
    s += `<line x1="${sc1x}" y1="${sc1y}" x2="${sc2x}" y2="${sc2y}" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 3"/>`;

    /* d label */
    const midx = (sc1x + sc2x) / 2, midy = (sc1y + sc2y) / 2;
    const d = Math.sqrt((c1x-c2x)**2 + (c1y-c2y)**2);
    s += `<foreignObject x="${midx-75}" y="${midy-24}" width="150" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#666;font-weight:600;text-align:center">${T('d = '+Math.round(d*100)/100)}</div></foreignObject>`;

    /* Circle 1 */
    const sr1 = r1 / (GRID_MAX - GRID_MIN) * usable;
    s += `<circle cx="${sc1x}" cy="${sc1y}" r="${sr1}" fill="rgba(217,83,79,0.08)" stroke="var(--c-a)" stroke-width="2.5"/>`;
    s += `<circle cx="${sc1x}" cy="${sc1y}" r="7" fill="var(--c-a)" stroke="#fff" stroke-width="2" style="cursor:grab"/>`;
    s += `<text x="${sc1x+12}" y="${sc1y-14}" font-size="12" font-weight="600" fill="var(--c-a)">C₁(${c1x},${c1y})</text>`;

    /* Circle 2 */
    const sr2 = r2 / (GRID_MAX - GRID_MIN) * usable;
    s += `<circle cx="${sc2x}" cy="${sc2y}" r="${sr2}" fill="rgba(42,109,244,0.08)" stroke="var(--c-b)" stroke-width="2.5"/>`;
    s += `<circle cx="${sc2x}" cy="${sc2y}" r="7" fill="var(--c-b)" stroke="#fff" stroke-width="2" style="cursor:grab"/>`;
    s += `<text x="${sc2x+12}" y="${sc2y-14}" font-size="12" font-weight="600" fill="var(--c-b)">C₂(${c2x},${c2y})</text>`;

    /* Compute and show intersection points for cases 2,3,4 */
    const rBig = Math.max(r1, r2), rSmall = Math.min(r1, r2);
    const cs = getCase(d, rBig, rSmall);

    if (cs >= 2 && cs <= 4 && d > 0.01) {
      // Intersection points
      const a = (r1*r1 - r2*r2 + d*d) / (2*d);
      const h2 = r1*r1 - a*a;
      if (h2 >= -0.01) {
        const h = Math.sqrt(Math.max(0, h2));
        const dx = (c2x - c1x) / d, dy = (c2y - c1y) / d;
        const px = c1x + a * dx, py = c1y + a * dy;
        if (h > 0.01) {
          const ix1 = px + h * dy, iy1 = py - h * dx;
          const ix2 = px - h * dy, iy2 = py + h * dx;
          const pulseR = 5 + 2 * Math.sin(animT * 3);
          s += `<circle cx="${toSX(ix1)}" cy="${toSY(iy1)}" r="${pulseR}" fill="#27ae60" stroke="#fff" stroke-width="2"/>`;
          s += `<circle cx="${toSX(ix2)}" cy="${toSY(iy2)}" r="${pulseR}" fill="#27ae60" stroke="#fff" stroke-width="2"/>`;
        } else {
          const pulseR = 6 + 3 * Math.sin(animT * 3);
          s += `<circle cx="${toSX(px)}" cy="${toSY(py)}" r="${pulseR}" fill="#e67e22" stroke="#fff" stroke-width="2"/>`;
        }
      }
    }

    svg.innerHTML = s;
    updateCalc(d, cs);
    highlightCase(cs);
  }

  function updateCalc(d, cs) {
    const el = document.getElementById('live-calc');
    const rBig = Math.max(r1, r2), rSmall = Math.min(r1, r2);
    const color = caseColors[cs];
    el.innerHTML =
      `<div style="margin-bottom:.5rem">${T(`d = \\sqrt{(${c2x}-(${c1x}))^2+(${c2y}-(${c1y}))^2} = ${Math.round(d*100)/100}`)}</div>` +
      `<div style="margin-bottom:.5rem">${T(`r + r' = ${r1} + ${r2} = ${r1+r2}, \\quad r - r' = ${rBig} - ${rSmall} = ${rBig-rSmall}`)}</div>` +
      `<div><span class="case-badge" style="background:${color}22;color:${color};border:2px solid ${color}">${caseNames[cs]}</span></div>`;
  }

  function highlightCase(cs) {
    const rows = document.querySelectorAll('.cases-table tbody tr');
    rows.forEach(row => {
      const c = parseInt(row.getAttribute('data-case'));
      row.className = c === cs ? 'active' : '';
    });
  }

  function animate() {
    animT += 0.02;
    drawSVG();
    animFrame = requestAnimationFrame(animate);
  }

  /* Drag */
  let dragTarget = null;
  function ptrDown(e) {
    const svg = document.getElementById('plane');
    const rect = svg.getBoundingClientRect();
    const scale = SVG_SIZE / rect.width;
    const cx = (e.touches ? e.touches[0].clientX : e.clientX);
    const cy = (e.touches ? e.touches[0].clientY : e.clientY);
    const sx = (cx - rect.left) * scale, sy = (cy - rect.top) * scale;
    const d1 = Math.sqrt((sx-toSX(c1x))**2 + (sy-toSY(c1y))**2);
    const d2 = Math.sqrt((sx-toSX(c2x))**2 + (sy-toSY(c2y))**2);
    if (d1 < 30 && d1 <= d2) { dragTarget = 1; e.preventDefault(); }
    else if (d2 < 30) { dragTarget = 2; e.preventDefault(); }
  }
  function ptrMove(e) {
    if (!dragTarget) return;
    e.preventDefault();
    const svg = document.getElementById('plane');
    const rect = svg.getBoundingClientRect();
    const scale = SVG_SIZE / rect.width;
    const cx = (e.touches ? e.touches[0].clientX : e.clientX);
    const cy = (e.touches ? e.touches[0].clientY : e.clientY);
    const sx = (cx - rect.left) * scale, sy = (cy - rect.top) * scale;
    const mx = Math.round(toMX(sx)), my = Math.round(toMY(sy));
    const clampX = Math.max(GRID_MIN+1, Math.min(GRID_MAX-1, mx));
    const clampY = Math.max(GRID_MIN+1, Math.min(GRID_MAX-1, my));
    if (dragTarget === 1) { c1x = clampX; c1y = clampY; }
    else { c2x = clampX; c2y = clampY; }
  }
  function ptrUp() { dragTarget = null; }

  /* Walkthrough */
  const steps = [
    { title: "問題の設定", tex: "\\text{円 } x^2+y^2=45 \\text{ の中心 O}(0,0)\\text{、半径 } r=3\\sqrt{5}" },
    { title: "もう一つの円の中心", tex: "\\text{中心 } (2,4) \\text{ の円を考える}" },
    { title: "中心間の距離", tex: "d = \\sqrt{2^2 + 4^2} = \\sqrt{4+16} = \\sqrt{20} = 2\\sqrt{5}" },
    { title: "内接の条件", tex: "\\text{内接するとき：} d = r - r'" },
    { title: "半径を求める", tex: "r' = r - d = 3\\sqrt{5} - 2\\sqrt{5} = \\sqrt{5}" },
    { title: "円の方程式", tex: "\\boxed{(x-2)^2 + (y-4)^2 = 5}" }
  ];
  let curStep = 0;

  function renderWalk() {
    const root = document.getElementById('walkthrough');
    let html = '';
    for (let i = 0; i <= curStep; i++) {
      const st = steps[i];
      const cls = i === curStep ? 'current' : '';
      html += `<div class="step ${cls}"><div class="label">${st.title}</div><div class="formula-line">${T(st.tex)}</div></div>`;
    }
    root.innerHTML = html;
    document.getElementById('step-cur').textContent = curStep + 1;
    document.getElementById('step-tot').textContent = steps.length;
    document.getElementById('prev').disabled = curStep === 0;
    document.getElementById('next').disabled = curStep === steps.length - 1;
  }

  function init() {
    document.getElementById('f-rR').innerHTML = T("r,\\, r'");
    document.getElementById('f-rgeR').innerHTML = T("r \\geq r'");
    document.getElementById('f-d').innerHTML = T("d");
    document.getElementById('tc1c').innerHTML = T("d > r + r'");
    document.getElementById('tc2c').innerHTML = T("d = r + r'");
    document.getElementById('tc3c').innerHTML = T("r - r' < d < r + r'");
    document.getElementById('tc4c').innerHTML = T("d = r - r'");
    document.getElementById('tc5c').innerHTML = T("d < r - r'");
    document.getElementById('f-ex-c1').innerHTML = T("x^2+y^2=45");
    document.getElementById('f-ex-r1').innerHTML = T("3\\sqrt{5}");
    document.getElementById('f-ex-center2').innerHTML = T("(2, 4)");

    document.getElementById('lbl-r1').innerHTML = T("r");
    document.getElementById('lbl-r2').innerHTML = T("r'");

    const s1 = document.getElementById('slider-r1');
    const s2 = document.getElementById('slider-r2');
    s1.addEventListener('input', () => { r1 = parseFloat(s1.value); document.getElementById('val-r1').textContent = r1; });
    s2.addEventListener('input', () => { r2 = parseFloat(s2.value); document.getElementById('val-r2').textContent = r2; });

    drawSVG();
    animate();

    const wrap = document.getElementById('svg-wrap');
    wrap.addEventListener('mousedown', ptrDown);
    wrap.addEventListener('mousemove', ptrMove);
    wrap.addEventListener('mouseup', ptrUp);
    wrap.addEventListener('mouseleave', ptrUp);
    wrap.addEventListener('touchstart', ptrDown, { passive: false });
    wrap.addEventListener('touchmove', ptrMove, { passive: false });
    wrap.addEventListener('touchend', ptrUp);

    document.getElementById('prev').addEventListener('click', () => { if (curStep > 0) { curStep--; renderWalk(); } });
    document.getElementById('next').addEventListener('click', () => { if (curStep < steps.length - 1) { curStep++; renderWalk(); } });
    renderWalk();
  }

  if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{if(window.katex)init();else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}});
</script>
</body>
</html>
