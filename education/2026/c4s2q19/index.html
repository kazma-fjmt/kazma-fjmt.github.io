<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>対数関数の最大・最小</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0; }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; margin: .75rem 0; overflow: hidden; touch-action: none; position: relative; }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto; }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step .eqno { margin-left: .7em; color: var(--muted); font-size: .95rem; white-space: nowrap; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn { appearance: none; border: 1px solid #d4dbeb; background: #fff; color: var(--accent); font-size: 1rem; font-weight: 600; padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer; min-height: 48px; min-width: 110px; font-family: inherit; user-select: none; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row { display: flex; align-items: center; gap: 1rem; margin: .75rem 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }
  .anim-btn-row { display: flex; justify-content: center; gap: .75rem; margin: .5rem 0; }

  .compare-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; overflow: hidden; margin: .75rem 0; font-size: .95rem; }
  .compare-table th, .compare-table td { border: 1px solid #ececec; padding: .55rem .5rem; text-align: center; }
  .compare-table th { background: #f4f7ff; font-weight: 600; }
  .compare-table td.hit { background: #eaf7ee; font-weight: 700; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>対数関数の最大・最小</h1>
  <p class="subtitle">対数のかたまりを 1 文字に置きかえて、2 次関数の最大・最小に持ちこみましょう。</p>

  <h2>考える関数</h2>
  <div class="formula-box" id="prob-box"></div>
  <div class="note" id="note-1"></div>

  <h2>置きかえを目で見る</h2>
  <p class="drag-hint">下の数直線をドラッグするか、スライダーを動かしましょう。</p>
  <div class="slider-row">
    <label><span id="lbl-x"></span> =</label>
    <input type="range" id="x-slider" min="1" max="8" step="0.01" value="3">
    <span class="slider-val" id="x-value">3.00</span>
  </div>
  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">アニメーション</button>
    <button class="btn" id="trace-btn">軌跡を消す</button>
  </div>
  <div class="svg-container" id="wrap">
    <svg id="graph" viewBox="0 0 600 540" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="live-calc" id="live"></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>端と頂点をくらべる</h2>
  <p>2 次関数の最大・最小は、変域の両端と頂点だけを調べれば決まります。</p>
  <table class="compare-table">
    <thead><tr><th id="th-t"></th><th id="th-x"></th><th id="th-y"></th><th>位置</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="formula-box" id="answer-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600, H=540;
const TL=70, TR=560, T0=-0.4, T1=3.6;      /* t axis (shared by both panels) */
const PT=20, PB=380, Y0=-5, Y1=1.5;        /* parabola panel */
const LINE_T=432, LINE_X=492;              /* double number line */
function tX(t){ return TL + (t-T0)/(T1-T0)*(TR-TL); }
function yY(v){ return PB - (v-Y0)/(Y1-Y0)*(PB-PT); }
function fy(t){ return t*t - 2*t - 3; }

let xVal = 3, animId = null, showTrace = true;

function draw(){
  const t = Math.log2(xVal), y = fy(t);
  let s = '';

  /* domain band 0 <= t <= 3 */
  s+=`<rect x="${tX(0)}" y="${PT}" width="${tX(3)-tX(0)}" height="${PB-PT}" fill="rgba(42,109,244,0.07)"/>`;
  for(let i=0;i<=3;i++){ const xi=tX(i); s+=`<line x1="${xi}" y1="${PT}" x2="${xi}" y2="${LINE_X}" stroke="#e9e9e9" stroke-width="1"/>`; }
  for(let v=-5;v<=1;v++){ const yi=yY(v); s+=`<line x1="${tX(T0)}" y1="${yi}" x2="${tX(T1)}" y2="${yi}" stroke="#eee" stroke-width="1"/>`; }
  s+=`<line x1="${tX(T0)}" y1="${yY(0)}" x2="${tX(T1)}" y2="${yY(0)}" stroke="#999" stroke-width="1.5"/>`;
  s+=`<line x1="${tX(0)}" y1="${PT}" x2="${tX(0)}" y2="${PB}" stroke="#999" stroke-width="1.5"/>`;
  let axisLabels = '';
  for(let v=-5;v<=1;v++){ if(v===0) continue; axisLabels+=`<text x="${tX(0)-8}" y="${yY(v)+4}" text-anchor="end" font-size="11" fill="#aaa" stroke="#fff" stroke-width="3" paint-order="stroke">${v}</text>`; }
  s+=`<foreignObject x="${tX(0)+7}" y="${PT-2}" width="26" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('y')}</div></foreignObject>`;

  /* parabola: dashed outside the domain, solid inside */
  let dOut='', dIn='', pOut=false, pIn=false;
  for(let i=0;i<=600;i++){
    const tt = T0 + (T1-T0)*i/600, vv = fy(tt);
    if(vv<Y0 || vv>Y1){ pOut=false; pIn=false; continue; }
    const X=tX(tt).toFixed(1), Y=yY(vv).toFixed(1);
    if(tt>=0 && tt<=3){ dIn += (pIn?'L':'M')+` ${X} ${Y}`; pIn=true; pOut=false; }
    else { dOut += (pOut?'L':'M')+` ${X} ${Y}`; pOut=true; pIn=false; }
  }
  s+=`<path d="${dOut}" fill="none" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="6 5"/>`;
  s+=`<path d="${dIn}" fill="none" stroke="var(--c-purple)" stroke-width="3"/>`;

  /* trace of visited points */
  if(showTrace){
    const lo = Math.min(0, t), hi = Math.max(0, t);
    let dt='', p=false;
    for(let i=0;i<=200;i++){
      const tt = lo + (hi-lo)*i/200, vv = fy(tt);
      if(vv<Y0 || vv>Y1){ p=false; continue; }
      dt += (p?'L':'M')+` ${tX(tt).toFixed(1)} ${yY(vv).toFixed(1)}`; p=true;
    }
    s+=`<path d="${dt}" fill="none" stroke="var(--c-orange)" stroke-width="6" opacity="0.25" stroke-linecap="round"/>`;
  }

  /* extrema markers */
  const marks = [{t:3, c:'var(--c-green)', lab:'最大'}, {t:1, c:'var(--c-red)', lab:'最小'}];
  let markLabels = '';
  for(const m of marks){
    const my = fy(m.t);
    s+=`<circle cx="${tX(m.t)}" cy="${yY(my)}" r="7" fill="${m.c}" stroke="#fff" stroke-width="2.5"/>`;
    s+=`<circle cx="${tX(m.t)}" cy="${yY(my)}" r="7" fill="none" stroke="${m.c}" stroke-width="2.5"><animate attributeName="r" values="7;14;7" dur="1.6s" repeatCount="indefinite"/></circle>`;
    markLabels+=`<text x="${tX(m.t)+(m.t===3?-6:12)}" y="${yY(my)+(m.t===3?-16:26)}" text-anchor="${m.t===3?'end':'start'}" font-size="13" font-weight="700" fill="${m.c}" stroke="#fff" stroke-width="3.5" paint-order="stroke">${m.lab} ${my}</text>`;
  }

  /* vertex axis */
  s+=`<line x1="${tX(1)}" y1="${yY(Y0)}" x2="${tX(1)}" y2="${yY(Y1)}" stroke="var(--c-red)" stroke-width="1" stroke-dasharray="4 5" opacity="0.6"/>`;

  /* moving point and guides */
  const clampedY = Math.max(Y0+0.05, Math.min(Y1-0.05, y));
  s+=`<line x1="${tX(t)}" y1="${yY(clampedY)}" x2="${tX(t)}" y2="${LINE_X}" stroke="var(--c-orange)" stroke-width="2" stroke-dasharray="6 4"/>`;
  s+=`<line x1="${tX(0)}" y1="${yY(clampedY)}" x2="${tX(t)}" y2="${yY(clampedY)}" stroke="var(--c-orange)" stroke-width="2" stroke-dasharray="6 4"/>`;
  s+=`<circle cx="${tX(t)}" cy="${yY(clampedY)}" r="9" fill="var(--c-orange)" stroke="#fff" stroke-width="3"/>`;
  s+=`<text x="8" y="${yY(clampedY)+4}" font-size="13" font-weight="700" fill="var(--c-orange)" stroke="#fff" stroke-width="3.5" paint-order="stroke">y = ${y.toFixed(2)}</text>`;

  /* double number line */
  let lineLabels = '';
  s+=`<line x1="${tX(T0)}" y1="${LINE_T}" x2="${tX(T1)}" y2="${LINE_T}" stroke="#999" stroke-width="2"/>`;
  s+=`<line x1="${tX(T0)}" y1="${LINE_X}" x2="${tX(T1)}" y2="${LINE_X}" stroke="#999" stroke-width="2"/>`;
  s+=`<rect x="${tX(0)}" y="${LINE_T-5}" width="${tX(3)-tX(0)}" height="10" fill="var(--c-blue)" opacity="0.25"/>`;
  s+=`<rect x="${tX(0)}" y="${LINE_X-5}" width="${tX(3)-tX(0)}" height="10" fill="var(--c-blue)" opacity="0.25"/>`;
  for(let i=0;i<=3;i++){
    const xi=tX(i);
    s+=`<line x1="${xi}" y1="${LINE_T-8}" x2="${xi}" y2="${LINE_T+8}" stroke="#666" stroke-width="2"/>`;
    s+=`<line x1="${xi}" y1="${LINE_X-8}" x2="${xi}" y2="${LINE_X+8}" stroke="#666" stroke-width="2"/>`;
    s+=`<line x1="${xi}" y1="${LINE_T+8}" x2="${xi}" y2="${LINE_X-8}" stroke="var(--c-blue)" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.75"/>`;
    lineLabels+=`<text x="${xi}" y="${LINE_T-13}" text-anchor="middle" font-size="12" fill="#666" font-weight="600" stroke="#fff" stroke-width="3.5" paint-order="stroke">${i}</text>`;
    lineLabels+=`<text x="${xi}" y="${LINE_X+24}" text-anchor="middle" font-size="12" fill="#666" font-weight="600" stroke="#fff" stroke-width="3.5" paint-order="stroke">${Math.pow(2,i)}</text>`;
  }
  for(const xm of [3,5,6,7]){
    const xi=tX(Math.log2(xm));
    s+=`<line x1="${xi}" y1="${LINE_X-5}" x2="${xi}" y2="${LINE_X+5}" stroke="#bbb" stroke-width="1.5"/>`;
    lineLabels+=`<text x="${xi}" y="${LINE_X+24}" text-anchor="middle" font-size="11" fill="#bbb" stroke="#fff" stroke-width="3" paint-order="stroke">${xm}</text>`;
  }
  s+=`<foreignObject x="6" y="${LINE_T-14}" width="60" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px;color:#666;font-weight:700">${T('t')}</div></foreignObject>`;
  s+=`<foreignObject x="6" y="${LINE_X-14}" width="60" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px;color:#666;font-weight:700">${T('x')}</div></foreignObject>`;
  s+=`<circle cx="${tX(t)}" cy="${LINE_T}" r="8" fill="var(--c-orange)" stroke="#fff" stroke-width="2.5"/>`;
  s+=`<circle cx="${tX(t)}" cy="${LINE_X}" r="12" fill="var(--c-orange)" stroke="#fff" stroke-width="3"/>`;
  s+=`<circle cx="${tX(t)}" cy="${LINE_X}" r="4" fill="#fff"/>`;

  /* every label last, with a halo, so no guide line is drawn across it */
  s += axisLabels + markLabels + lineLabels;
  document.getElementById('graph').innerHTML = s;

  document.getElementById('live').innerHTML =
    T('x = '+xVal.toFixed(2)) + '&emsp;' +
    T('t = \\log_2 x = '+t.toFixed(3)) + '&emsp;' +
    T('y = t^2-2t-3 = '+y.toFixed(3)) +
    (Math.abs(xVal-8)<0.02 ? '<br><span style="color:var(--c-green);font-weight:700">最大値 0</span>'
     : Math.abs(xVal-2)<0.02 ? '<br><span style="color:var(--c-red);font-weight:700">最小値 -4</span>' : '');
}

function setX(v){
  xVal = Math.min(8, Math.max(1, v));
  document.getElementById('x-slider').value = xVal;
  document.getElementById('x-value').textContent = xVal.toFixed(2);
  draw();
}

function setupInput(){
  const sl = document.getElementById('x-slider');
  sl.addEventListener('input', ()=>{ setX(parseFloat(sl.value)); });

  const wrap = document.getElementById('wrap'), svg = document.getElementById('graph');
  let dragging = false;
  function toX(cx){
    const rect = svg.getBoundingClientRect();
    const sx = (cx-rect.left)/rect.width*W;
    const tt = T0 + (sx-TL)/(TR-TL)*(T1-T0);
    return Math.pow(2, tt);
  }
  wrap.addEventListener('mousedown', e=>{ e.preventDefault(); dragging=true; setX(toX(e.clientX)); });
  window.addEventListener('mousemove', e=>{ if(dragging){ e.preventDefault(); setX(toX(e.clientX)); } });
  window.addEventListener('mouseup', ()=>{ dragging=false; });
  wrap.addEventListener('touchstart', e=>{ dragging=true; setX(toX(e.touches[0].clientX)); }, {passive:true});
  wrap.addEventListener('touchmove', e=>{ if(dragging){ e.preventDefault(); setX(toX(e.touches[0].clientX)); } }, {passive:false});
  wrap.addEventListener('touchend', ()=>{ dragging=false; });

  document.getElementById('anim-btn').addEventListener('click', ()=>{
    if(animId){ cancelAnimationFrame(animId); animId = null; }
    const dur = 4500; let t0 = null;
    function step(ts){
      if(!t0) t0 = ts;
      const p = Math.min((ts-t0)/dur, 1);
      const e = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
      setX(Math.pow(2, 3*e));
      animId = p < 1 ? requestAnimationFrame(step) : null;
    }
    animId = requestAnimationFrame(step);
  });
  const tb = document.getElementById('trace-btn');
  tb.addEventListener('click', ()=>{ showTrace = !showTrace; tb.textContent = showTrace ? '軌跡を消す' : '軌跡を出す'; draw(); });
}

const STEPS = [
  {label:'Step 1: 対数のかたまりを 1 文字におく', formula:'\\log_2 x = t \\;\\text{とおく}'},
  {label:'Step 2: t の変域を求める', formula:'1 \\leq x \\leq 8 \\;\\Longrightarrow\\; \\log_2 1 \\leq \\log_2 x \\leq \\log_2 8'},
  {label:'Step 3: 底 2 は 1 より大きいので不等号の向きはそのまま', formula:'0 \\leq t \\leq 3', tag:'……①'},
  {label:'Step 4: 与えられた関数を t で表す', formula:'y = (\\log_2 x)^2 - 2\\log_2 x - 3 = t^2 - 2t - 3'},
  {label:'Step 5: 平方完成する', formula:'y = (t-1)^2 - 4 \\;\\text{（軸 }t=1\\text{、頂点 }(1,-4)\\text{）}'},
  {label:'Step 6: ① の範囲で最大・最小を読む', formula:'t=3\\;\\text{のとき最大値}\\;0,\\quad t=1\\;\\text{のとき最小値}\\;-4'},
  {label:'Step 7: t を x に戻す', formula:'\\log_2 x = 3 \\Leftrightarrow x = 8,\\quad \\log_2 x = 1 \\Leftrightarrow x = 2'},
  {label:'Step 8: 答え', formula:'x=8\\;\\text{のとき最大値}\\;0,\\quad x=2\\;\\text{のとき最小値}\\;-4'}
];
let curStep = 0;
function renderSteps(){
  let html = '';
  for(let i=0;i<=curStep;i++){
    html += `<div class="step ${i===curStep?'current':''}"><div class="label">${STEPS[i].label}</div><div class="formula-line">${T(STEPS[i].formula)}${STEPS[i].tag?`<span class="eqno">${STEPS[i].tag}</span>`:''}</div></div>`;
  }
  document.getElementById('walkthrough').innerHTML = html;
  document.getElementById('counter').textContent = `${curStep+1} / ${STEPS.length}`;
  document.getElementById('prev').disabled = curStep===0;
  document.getElementById('next').disabled = curStep===STEPS.length-1;
}

function buildTable(){
  const rows = [
    {t:0, x:1, note:'左端'},
    {t:1, x:2, note:'頂点', kind:'min'},
    {t:2, x:4, note:'通過点'},
    {t:3, x:8, note:'右端', kind:'max'}
  ];
  let html = '';
  for(const r of rows){
    const v = fy(r.t);
    const cls = r.kind ? ' class="hit"' : '';
    const tag = r.kind==='max' ? '右端（最大）' : r.kind==='min' ? '頂点（最小）' : r.note;
    html += `<tr><td>${T(String(r.t))}</td><td>${T(String(r.x))}</td><td${cls}>${T(String(v))}</td><td${cls}>${tag}</td></tr>`;
  }
  document.getElementById('tbody').innerHTML = html;
}

function init(){
  tex('y = (\\log_2 x)^2 - 2\\log_2 x - 3 \\qquad (1 \\leq x \\leq 8)', document.getElementById('prob-box'), true);
  document.getElementById('note-1').innerHTML =
    T('x') + ' のままでは値の変化を追いにくいので、' + T('\\log_2 x = t') +
    ' とおいて ' + T('t') + ' の 2 次関数として見ます。' + T('x') + ' が 1 から 8 まで動くと ' + T('t') + ' は 0 から 3 まで動きます。';
  document.getElementById('lbl-x').innerHTML = T('x');
  document.getElementById('th-t').innerHTML = T('t');
  document.getElementById('th-x').innerHTML = T('x');
  document.getElementById('th-y').innerHTML = T('y');
  tex('x=8\\;\\text{のとき最大値}\\;0,\\qquad x=2\\;\\text{のとき最小値}\\;-4', document.getElementById('answer-box'), true);
  document.getElementById('prev').addEventListener('click', ()=>{ if(curStep>0){ curStep--; renderSteps(); } });
  document.getElementById('next').addEventListener('click', ()=>{ if(curStep<STEPS.length-1){ curStep++; renderSteps(); } });
  setupInput(); buildTable(); renderSteps(); setX(3);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
