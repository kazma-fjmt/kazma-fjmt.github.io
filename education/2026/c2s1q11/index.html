<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>三角形の重心</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa;
    --fg: #333;
    --muted: #888;
    --accent: #2a6df4;
    --c-red: #d9534f;
    --c-blue: #2a6df4;
    --c-green: #28a745;
    --c-orange: #e67e22;
    --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 {
    font-size: 1.15rem;
    margin: 2.25rem 0 .75rem;
    border-left: 4px solid var(--accent);
    padding-left: .6rem;
  }
  p { margin: .75rem 0; }

  .formula {
    background: #fff;
    border: 1px solid #e3e3e3;
    border-radius: 10px;
    padding: 1rem;
    text-align: center;
    overflow-x: auto;
    margin: 1rem 0;
  }
  .formula .katex { font-size: 1.35rem; }

  .canvas-container {
    background: #fff;
    border: 1px solid #e3e3e3;
    border-radius: 10px;
    padding: .75rem;
    margin: 1rem 0;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 6px;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }

  .info-box {
    background: #fff;
    border: 1px solid #e3e3e3;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin: 1rem 0;
    overflow-x: auto;
  }
  .info-row {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem 1.5rem;
    margin: .5rem 0;
    align-items: center;
  }
  .info-row .label {
    color: var(--muted);
    font-size: .85rem;
    min-width: 3rem;
  }

  .hint {
    text-align: center;
    color: var(--muted);
    font-size: .85rem;
    margin: .5rem 0 0;
  }

  .walkthrough {
    background: #fff;
    border: 1px solid #e3e3e3;
    border-radius: 10px;
    padding: .75rem 1.25rem;
    margin: 0 0 .75rem;
    min-height: 9rem;
    overflow-x: auto;
  }
  .step {
    padding: .75rem .25rem;
    border-bottom: 1px dashed #eee;
    opacity: 0;
    animation: fadeIn 0.4s ease forwards;
  }
  .step:last-child { border-bottom: none; }
  .step.current {
    background: #f0f5ff;
    border-radius: 8px;
    padding: .75rem;
    margin: .25rem -.5rem;
    border-bottom: none;
  }
  .step .label {
    color: var(--muted);
    font-size: .8rem;
    margin-bottom: .25rem;
  }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.2rem; }
  .step.current .formula-line .katex { font-size: 1.35rem; }

  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .75rem;
    margin: 1rem 0 0;
  }
  .btn {
    appearance: none;
    border: 1px solid #d4dbeb;
    background: #fff;
    color: var(--accent);
    font-size: 1rem;
    font-weight: 600;
    padding: .85rem 1.2rem;
    border-radius: 10px;
    cursor: pointer;
    min-height: 48px;
    min-width: 110px;
    font-family: inherit;
    user-select: none;
  }
  .btn.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter {
    color: var(--muted);
    font-size: .9rem;
    text-align: center;
    flex: 1;
  }

  .example-box {
    background: #eef4ff;
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin: 1rem 0;
  }
  .example-title {
    font-weight: 600;
    color: var(--accent);
    font-size: .95rem;
    margin-bottom: .5rem;
  }

  .btn-reset {
    appearance: none;
    border: 1px solid #d4dbeb;
    background: #fff;
    color: var(--accent);
    font-size: .85rem;
    font-weight: 600;
    padding: .5rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    min-height: 40px;
    font-family: inherit;
    user-select: none;
    margin: .5rem auto;
    display: block;
  }
  .btn-reset:active { transform: scale(.97); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<main>
  <h1>三角形の重心</h1>
  <p class="subtitle">中線が1点で交わる点 — 重心の座標公式を学びます。</p>

  <h2>重心とは</h2>
  <p>三角形の各頂点と対辺の中点を結ぶ線分を<strong>中線</strong>（ちゅうせん）といいます。3本の中線は必ず1点で交わり、この交点を<strong>重心</strong> G といいます。</p>
  <p>重心 G は各中線を頂点側から <strong>2 : 1</strong> に内分します。</p>

  <h2>重心の公式</h2>
  <div class="formula" id="formula-main"></div>

  <h2>座標平面で確かめよう</h2>
  <p>頂点 A, B, C をタップ＆ドラッグして動かしてみましょう。中線と重心が自動で更新されます。</p>
  <div class="canvas-container">
    <canvas id="plane" width="700" height="560"></canvas>
  </div>
  <p class="hint">頂点をドラッグして三角形を変形できます</p>
  <button class="btn-reset" id="btn-reset">初期位置にリセット</button>

  <div class="info-box" id="coords-display"></div>

  <h2>例題 8</h2>
  <div class="example-box">
    <div class="example-title">例題</div>
    <p id="ex-problem"></p>
  </div>

  <h2>公式の導出</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev">← 戻る</button>
    <div class="step-counter">ステップ <span id="step-cur"></span> / <span id="step-tot"></span></div>
    <button class="btn primary" id="next">次へ →</button>
  </div>
</main>

<script>
  function tex(l, el, dm) { katex.render(l, el, { throwOnError: false, displayMode: !!dm }); }
  function T(l) { return katex.renderToString(l, { throwOnError: false }); }

  const C_RED = "#d9534f";
  const C_BLUE = "#2a6df4";
  const C_GREEN = "#28a745";
  const C_ORANGE = "#e67e22";
  const C_PURPLE = "#7b61ff";

  /* --- Canvas state --- */
  const canvas = document.getElementById('plane');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  let W, H;

  // Graph bounds
  const gXmin = -5, gXmax = 9, gYmin = -7, gYmax = 6;

  // Triangle vertices (math coords)
  let pts = {
    A: { x: 2, y: 3 },
    B: { x: 5, y: -4 },
    C: { x: -1, y: 1 }
  };

  let dragging = null;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    W = rect.width * dpr;
    H = rect.height * dpr;
    canvas.width = W;
    canvas.height = H;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function toScreen(mx, my) {
    const cw = canvas.getBoundingClientRect().width;
    const ch = canvas.getBoundingClientRect().height;
    const sx = (mx - gXmin) / (gXmax - gXmin) * cw;
    const sy = (1 - (my - gYmin) / (gYmax - gYmin)) * ch;
    return [sx, sy];
  }
  function toMath(sx, sy) {
    const cw = canvas.getBoundingClientRect().width;
    const ch = canvas.getBoundingClientRect().height;
    const mx = sx / cw * (gXmax - gXmin) + gXmin;
    const my = (1 - sy / ch) * (gYmax - gYmin) + gYmin;
    return [mx, my];
  }

  function midpoint(p1, p2) {
    return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
  }

  function centroid(A, B, C) {
    return { x: (A.x + B.x + C.x) / 3, y: (A.y + B.y + C.y) / 3 };
  }

  function drawGrid() {
    const cw = canvas.getBoundingClientRect().width;
    const ch = canvas.getBoundingClientRect().height;

    // Grid
    ctx.strokeStyle = '#eee';
    ctx.lineWidth = 1;
    for (let x = Math.ceil(gXmin); x <= Math.floor(gXmax); x++) {
      const [sx] = toScreen(x, 0);
      ctx.beginPath();
      ctx.moveTo(sx, 0);
      ctx.lineTo(sx, ch);
      ctx.stroke();
    }
    for (let y = Math.ceil(gYmin); y <= Math.floor(gYmax); y++) {
      const [, sy] = toScreen(0, y);
      ctx.beginPath();
      ctx.moveTo(0, sy);
      ctx.lineTo(cw, sy);
      ctx.stroke();
    }

    // Axes
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 1.5;
    const [ox, oy] = toScreen(0, 0);
    ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(cw, oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, ch); ctx.stroke();

    // Tick labels
    ctx.fillStyle = '#999';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (let x = Math.ceil(gXmin); x <= Math.floor(gXmax); x++) {
      if (x === 0) continue;
      const [sx] = toScreen(x, 0);
      ctx.fillText(x, sx, oy + 4);
    }
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let y = Math.ceil(gYmin); y <= Math.floor(gYmax); y++) {
      if (y === 0) continue;
      const [, sy] = toScreen(0, y);
      ctx.fillText(y, ox - 6, sy);
    }
    ctx.fillText('O', ox - 6, oy + 12);
  }

  function drawLine(p1, p2, color, width) {
    const [x1, y1] = toScreen(p1.x, p1.y);
    const [x2, y2] = toScreen(p2.x, p2.y);
    ctx.strokeStyle = color;
    ctx.lineWidth = width || 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function drawDashedLine(p1, p2, color) {
    const [x1, y1] = toScreen(p1.x, p1.y);
    const [x2, y2] = toScreen(p2.x, p2.y);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawPoint(p, color, radius) {
    const [sx, sy] = toScreen(p.x, p.y);
    ctx.beginPath();
    ctx.arc(sx, sy, radius || 7, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawLabel(p, text, color, offsetX, offsetY) {
    const [sx, sy] = toScreen(p.x, p.y);
    ctx.fillStyle = color;
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, sx + (offsetX || 0), sy + (offsetY || -16));
  }

  function drawSmallPoint(p, color) {
    const [sx, sy] = toScreen(p.x, p.y);
    ctx.beginPath();
    ctx.arc(sx, sy, 4, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  // Ratio label on median
  function drawRatioLabel(from, to, label, color) {
    const mx = (from.x * 0.55 + to.x * 0.45);
    const my = (from.y * 0.55 + to.y * 0.45);
    const [sx, sy] = toScreen(mx, my);
    ctx.fillStyle = color;
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // Background
    const w = ctx.measureText(label).width + 6;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(sx - w / 2, sy - 8, w, 16);
    ctx.fillStyle = color;
    ctx.fillText(label, sx, sy);
  }

  let animPhase = 0;
  let animId;

  function draw() {
    const cw = canvas.getBoundingClientRect().width;
    const ch = canvas.getBoundingClientRect().height;
    ctx.clearRect(0, 0, cw, ch);

    drawGrid();

    const A = pts.A, B = pts.B, C = pts.C;
    const Ma = midpoint(B, C);
    const Mb = midpoint(A, C);
    const Mc = midpoint(A, B);
    const G = centroid(A, B, C);

    // Triangle fill
    const [ax, ay] = toScreen(A.x, A.y);
    const [bx, by] = toScreen(B.x, B.y);
    const [cx, cy] = toScreen(C.x, C.y);
    ctx.fillStyle = 'rgba(42,109,244,0.06)';
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.lineTo(cx, cy);
    ctx.closePath();
    ctx.fill();

    // Triangle sides
    drawLine(A, B, '#999', 1.5);
    drawLine(B, C, '#999', 1.5);
    drawLine(A, C, '#999', 1.5);

    // Medians with animation
    const pulse = 0.6 + 0.4 * Math.sin(animPhase);
    ctx.globalAlpha = pulse;
    drawDashedLine(A, Ma, C_RED);
    drawDashedLine(B, Mb, C_BLUE);
    drawDashedLine(C, Mc, C_GREEN);
    ctx.globalAlpha = 1;

    // Midpoint labels
    drawSmallPoint(Ma, C_RED);
    drawLabel(Ma, 'M_A', C_RED, 14, 14);
    drawSmallPoint(Mb, C_BLUE);
    drawLabel(Mb, 'M_B', C_BLUE, -16, 10);
    drawSmallPoint(Mc, C_GREEN);
    drawLabel(Mc, 'M_C', C_GREEN, 14, -10);

    // 2:1 ratio markers
    drawRatioLabel(A, Ma, '2:1', C_RED);
    drawRatioLabel(B, Mb, '2:1', C_BLUE);
    drawRatioLabel(C, Mc, '2:1', C_GREEN);

    // Centroid G
    drawPoint(G, C_ORANGE, 9);
    drawLabel(G, 'G', C_ORANGE, 16, -4);

    // Vertices
    drawPoint(A, C_RED, 8);
    drawLabel(A, 'A', C_RED, -14, -10);
    drawPoint(B, C_BLUE, 8);
    drawLabel(B, 'B', C_BLUE, 14, 10);
    drawPoint(C, C_GREEN, 8);
    drawLabel(C, 'C', C_GREEN, -14, 10);

    animPhase += 0.03;
    animId = requestAnimationFrame(draw);
  }

  function updateDisplay() {
    const A = pts.A, B = pts.B, C = pts.C;
    const G = centroid(A, B, C);
    const Ma = midpoint(B, C);

    const fmt = (v) => {
      const r = Math.round(v * 10) / 10;
      return Number.isInteger(r) ? r.toString() : r.toFixed(1);
    };

    const box = document.getElementById('coords-display');
    box.innerHTML =
      `<div class="info-row"><span class="label" style="color:${C_RED}">A</span>${T(`(${fmt(A.x)},\\, ${fmt(A.y)})`)}</div>` +
      `<div class="info-row"><span class="label" style="color:${C_BLUE}">B</span>${T(`(${fmt(B.x)},\\, ${fmt(B.y)})`)}</div>` +
      `<div class="info-row"><span class="label" style="color:${C_GREEN}">C</span>${T(`(${fmt(C.x)},\\, ${fmt(C.y)})`)}</div>` +
      `<div style="border-top:1px solid #eee; margin:.5rem 0;"></div>` +
      `<div class="info-row"><span class="label" style="color:${C_ORANGE}; font-weight:600;">G</span>` +
      T(`\\left(\\dfrac{${fmt(A.x)}+${fmt(B.x)}+${fmt(C.x)}}{3},\\; \\dfrac{${fmt(A.y)}+${fmt(B.y)}+${fmt(C.y)}}{3}\\right) = \\left(${fmt(G.x)},\\; ${fmt(G.y)}\\right)`) +
      `</div>`;
  }

  /* --- Drag handling --- */
  function getPointerMath(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return toMath(cx, cy);
  }

  function findNearest(mx, my) {
    let best = null, bestDist = Infinity;
    for (const key of ['A', 'B', 'C']) {
      const p = pts[key];
      const d = Math.hypot(p.x - mx, p.y - my);
      if (d < bestDist) { bestDist = d; best = key; }
    }
    // threshold in math coords
    const cw = canvas.getBoundingClientRect().width;
    const threshold = (gXmax - gXmin) / cw * 30;
    return bestDist < threshold ? best : null;
  }

  function onDown(e) {
    e.preventDefault();
    const [mx, my] = getPointerMath(e);
    dragging = findNearest(mx, my);
  }
  function onMove(e) {
    if (!dragging) return;
    e.preventDefault();
    const [mx, my] = getPointerMath(e);
    const snap = (v) => Math.round(v * 2) / 2;
    pts[dragging].x = Math.max(gXmin + 0.5, Math.min(gXmax - 0.5, snap(mx)));
    pts[dragging].y = Math.max(gYmin + 0.5, Math.min(gYmax - 0.5, snap(my)));
    updateDisplay();
  }
  function onUp() { dragging = null; }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  document.getElementById('btn-reset').addEventListener('click', () => {
    pts.A = { x: 2, y: 3 };
    pts.B = { x: 5, y: -4 };
    pts.C = { x: -1, y: 1 };
    updateDisplay();
  });

  /* --- Walkthrough --- */
  const steps = [
    {
      title: "中線の中点を求める",
      tex: `\\text{BCの中点}\\; \\mathrm{M} = \\left(\\frac{x_2+x_3}{2},\\; \\frac{y_2+y_3}{2}\\right)`
    },
    {
      title: "頂点Aから中点Mへの中線を考える",
      tex: `\\mathrm{A}(x_1, y_1) \\;\\text{と}\\; \\mathrm{M}\\left(\\frac{x_2+x_3}{2},\\; \\frac{y_2+y_3}{2}\\right) \\;\\text{を結ぶ}`
    },
    {
      title: "重心GはAMを2:1に内分する",
      tex: `\\mathrm{G} \\;\\text{はAMを}\\; \\textcolor{${C_ORANGE}}{2:1} \\;\\text{に内分}`
    },
    {
      title: "内分点の公式を適用する",
      tex: `\\mathrm{G} = \\left(\\frac{1 \\cdot x_1 + 2 \\cdot \\frac{x_2+x_3}{2}}{2+1},\\; \\frac{1 \\cdot y_1 + 2 \\cdot \\frac{y_2+y_3}{2}}{2+1}\\right)`
    },
    {
      title: "分子を整理する",
      tex: `= \\left(\\frac{x_1 + x_2 + x_3}{3},\\; \\frac{y_1 + y_2 + y_3}{3}\\right)`
    },
    {
      title: "重心の公式（結論）",
      tex: `\\textcolor{${C_ORANGE}}{\\mathrm{G} = \\left(\\frac{x_1+x_2+x_3}{3},\\; \\frac{y_1+y_2+y_3}{3}\\right)}`
    },
    {
      title: "例題 8 の値を代入する",
      tex: `\\mathrm{A}(2,3),\\; \\mathrm{B}(5,-4),\\; \\mathrm{C}(-1,1)`
    },
    {
      title: "計算する",
      tex: `\\mathrm{G} = \\left(\\frac{2+5+(-1)}{3},\\; \\frac{3+(-4)+1}{3}\\right) = \\left(\\frac{6}{3},\\; \\frac{0}{3}\\right)`
    },
    {
      title: "答え",
      tex: `\\textcolor{${C_ORANGE}}{\\mathrm{G} = (2,\\; 0)}`
    }
  ];

  let curStep = 0;

  function renderWalkthrough() {
    const root = document.getElementById('walkthrough');
    let html = '';
    for (let i = 0; i <= curStep; i++) {
      const s = steps[i];
      const isCurrent = i === curStep;
      html += `<div class="step ${isCurrent ? 'current' : ''}" style="animation-delay:${isCurrent ? '0.05s' : '0s'}">
        <div class="label">${s.title}</div>
        <div class="formula-line">${T(s.tex)}</div>
      </div>`;
    }
    root.innerHTML = html;
    document.getElementById('step-cur').textContent = curStep + 1;
    document.getElementById('step-tot').textContent = steps.length;
    document.getElementById('prev').disabled = curStep === 0;
    document.getElementById('next').disabled = curStep === steps.length - 1;
  }

  function init() {
    tex('\\mathrm{G} = \\left(\\dfrac{x_1+x_2+x_3}{3},\\; \\dfrac{y_1+y_2+y_3}{3}\\right)', document.getElementById('formula-main'), true);

    document.getElementById('ex-problem').innerHTML =
      T('\\mathrm{A}(2,\\,3),\\; \\mathrm{B}(5,\\,-4),\\; \\mathrm{C}(-1,\\,1)') + ' のとき、三角形ABCの重心Gの座標を求めよ。<br>→ ' + T('\\mathrm{G} = (2,\\, 0)');

    resizeCanvas();
    updateDisplay();
    renderWalkthrough();
    draw();

    document.getElementById('prev').addEventListener('click', () => {
      if (curStep > 0) { curStep--; renderWalkthrough(); }
    });
    document.getElementById('next').addEventListener('click', () => {
      if (curStep < steps.length - 1) { curStep++; renderWalkthrough(); }
    });
  }

  window.addEventListener('resize', () => {
    resizeCanvas();
  });

  if (window.katex) init();
  else window.addEventListener("DOMContentLoaded", () => {
    if (window.katex) init();
    else {
      const w = setInterval(() => {
        if (window.katex) { clearInterval(w); init(); }
      }, 30);
    }
  });
</script>
</body>
</html>
