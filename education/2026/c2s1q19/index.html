<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>垂直条件の利用</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.3rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .slider-group {
    display: flex; flex-wrap: wrap; gap: 1rem; margin: 1rem 0; align-items: center;
  }
  .slider-item {
    flex: 1; min-width: 200px;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1rem;
  }
  .slider-item label { font-weight: 600; font-size: .95rem; }
  .slider-item input[type="range"] { width: 100%; margin: .25rem 0; }
  .slider-val { font-size: 1rem; font-weight: 600; text-align: center; }

  .product-meter {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; text-align: center;
  }
  .meter-bar-bg {
    width: 100%; height: 30px; background: #f0f0f0; border-radius: 15px;
    position: relative; overflow: hidden; margin: .5rem 0;
  }
  .meter-bar-fill {
    height: 100%; border-radius: 15px;
    transition: width .2s ease, background .2s ease;
    position: absolute; left: 50%;
  }
  .meter-target {
    position: absolute; left: 50%; top: 0; bottom: 0;
    width: 3px; background: var(--c-green); transform: translateX(-50%);
    z-index: 2;
  }
  .meter-target-label {
    position: absolute; top: -20px; left: 50%;
    transform: translateX(-50%); font-size: 11px; font-weight: 600;
    color: var(--c-green); white-space: nowrap;
    z-index: 3;
  }
  .meter-label { font-size: .9rem; color: var(--muted); }

  .status-box {
    text-align: center; padding: .75rem; border-radius: 10px; margin: .75rem 0;
    font-size: 1.1rem; font-weight: 600; transition: all .3s ease;
  }
  .status-perp { background: #e8f5e9; border: 2px solid var(--c-green); color: var(--c-green); }
  .status-near { background: #fff8e1; border: 2px solid var(--c-orange); color: var(--c-orange); }
  .status-far { background: #f5f5f5; border: 2px solid #ccc; color: var(--muted); }

  .quiz-section {
    background: #fff; border: 2px solid var(--accent); border-radius: 12px;
    padding: 1.25rem; margin: 1rem 0;
  }
  .quiz-section h3 { margin: 0 0 .75rem; color: var(--accent); }

  .quiz-option {
    display: block; width: 100%; text-align: left;
    background: #f8f8f8; border: 2px solid #e3e3e3; border-radius: 8px;
    padding: .6rem 1rem; margin: .4rem 0; font-size: .95rem;
    cursor: pointer; transition: all .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .quiz-option:active { transform: scale(.98); }
  .quiz-option.correct { background: #e8f5e9; border-color: var(--c-green); color: var(--c-green); }
  .quiz-option.wrong { background: #ffeaea; border-color: var(--c-red); color: var(--c-red); }
  .quiz-option:disabled { opacity: .7; cursor: default; }

  .quiz-feedback {
    margin: .75rem 0 0; padding: .75rem; border-radius: 8px; display: none;
  }
  .quiz-feedback.show { display: block; }
  .quiz-feedback.ok { background: #e8f5e9; border: 1px solid var(--c-green); }
  .quiz-feedback.ng { background: #ffeaea; border: 1px solid var(--c-red); }

  .right-angle { fill: none; stroke: var(--c-green); stroke-width: 2; }

  .anim-pulse {
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100%{ opacity:1; }
    50%{ opacity:.4; }
  }
</style>
</head>
<body>
<main>
  <h1>垂直条件の利用</h1>
  <p class="subtitle">傾きの積 <span id="sub-mm"></span> を体感する</p>

  <h2>垂直条件のおさらい</h2>
  <p id="desc1"></p>
  <div class="formula-box" id="formula-perp"></div>

  <h2>直線を回転して垂直を見つけよう</h2>
  <p>直線 <span style="color:var(--c-red);font-weight:600;">l</span> は固定されています。スライダーで直線 <span style="color:var(--c-blue);font-weight:600;">l'</span> の傾きを変えて、垂直になる位置を探しましょう。</p>

  <div class="slider-group">
    <div class="slider-item">
      <label style="color:var(--c-red);">l の傾き <span id="lbl-m"></span>（固定）</label>
      <input type="range" id="slider-m" min="-4" max="4" step="0.5" value="2">
      <div class="slider-val" id="val-m" style="color:var(--c-red);"></div>
    </div>
    <div class="slider-item">
      <label style="color:var(--c-blue);">l' の傾き <span id="lbl-m2"></span>（調整可）</label>
      <input type="range" id="slider-m2" min="-4" max="4" step="0.05" value="0">
      <div class="slider-val" id="val-m2" style="color:var(--c-blue);"></div>
    </div>
  </div>

  <div class="product-meter" id="product-meter">
    <div id="product-val" style="font-size:1.15rem;font-weight:600;"></div>
    <div class="meter-bar-bg">
      <div class="meter-bar-fill" id="meter-fill"></div>
      <div class="meter-target" id="meter-target"><span class="meter-target-label" id="meter-target-label"></span></div>
    </div>
    <div class="meter-label" id="meter-hint"></div>
  </div>

  <div class="status-box status-far" id="status-box">調整中…</div>

  <div class="svg-container">
    <svg id="graph" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <h2>確認クイズ</h2>

  <div class="quiz-section" id="quiz1">
    <h3>問題 1</h3>
    <p id="q1-text"></p>
    <div id="q1-options"></div>
    <div class="quiz-feedback" id="q1-fb"></div>
  </div>

  <div class="quiz-section" id="quiz2">
    <h3>問題 2</h3>
    <p id="q2-text"></p>
    <div id="q2-options"></div>
    <div class="quiz-feedback" id="q2-fb"></div>
  </div>

  <div class="quiz-section" id="quiz3">
    <h3>問題 3</h3>
    <p id="q3-text"></p>
    <div id="q3-options"></div>
    <div class="quiz-feedback" id="q3-fb"></div>
  </div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}
if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{if(window.katex)init();else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}});

function init(){
  document.getElementById('sub-mm').innerHTML = T("mm' = -1");
  document.getElementById('desc1').innerHTML =
    '2直線 '+T('l: y=mx+n')+' と '+T("l': y=m'x+n'")+' が垂直であるための条件は：';
  tex("mm' = -1", document.getElementById('formula-perp'), true);

  document.getElementById('lbl-m').innerHTML = T('m');
  document.getElementById('lbl-m2').innerHTML = T("m'");
  document.getElementById('meter-target-label').innerHTML = T("mm'=-1");

  const slM = document.getElementById('slider-m');
  const slM2 = document.getElementById('slider-m2');

  function update(){
    const m = parseFloat(slM.value);
    const m2 = parseFloat(slM2.value);
    document.getElementById('val-m').innerHTML = T('m') + ' = ' + m.toFixed(1);
    document.getElementById('val-m2').innerHTML = T("m'") + ' = ' + m2.toFixed(2);

    const prod = m*m2;
    const prodEl = document.getElementById('product-val');
    prodEl.innerHTML = T("mm' = "+m.toFixed(1)+" \\times "+(m2<0?"("+m2.toFixed(2)+")":m2.toFixed(2))+" = "+prod.toFixed(2));

    // meter
    const fill = document.getElementById('meter-fill');
    // map prod from -8 to 8 → 0 to 100%
    const pct = ((prod+8)/16)*100;
    const targetPct = ((-1+8)/16)*100; // where -1 maps to
    const w = Math.abs(pct-50);
    if(prod<0){
      fill.style.width = Math.abs(50-pct)+'%';
      fill.style.left = pct+'%';
    } else {
      fill.style.width = Math.abs(pct-50)+'%';
      fill.style.left = '50%';
    }
    document.getElementById('meter-target').style.left = targetPct+'%';

    const dist = Math.abs(prod+1);
    const isPerp = dist<0.06;
    const isNear = dist<0.3;

    if(isPerp){
      fill.style.background = 'var(--c-green)';
      document.getElementById('meter-hint').textContent = '';
    } else if(prod>-1){
      fill.style.background = 'var(--c-orange)';
      document.getElementById('meter-hint').innerHTML = T("m'") + ' をもう少し'+(m>0?'マイナス':'プラス')+'方向へ';
    } else {
      fill.style.background = 'var(--c-orange)';
      document.getElementById('meter-hint').innerHTML = T("m'") + ' をもう少し'+(m>0?'プラス':'マイナス')+'方向へ';
    }

    const statusEl = document.getElementById('status-box');
    if(isPerp){
      statusEl.className = 'status-box status-perp';
      statusEl.innerHTML = '🎯 垂直！ ' + T("mm' = -1");
    } else if(isNear){
      statusEl.className = 'status-box status-near';
      statusEl.innerHTML = 'もう少し！ ' + T("mm' = "+prod.toFixed(2));
    } else {
      statusEl.className = 'status-box status-far';
      statusEl.innerHTML = '垂直ではない（' + T("mm' = "+prod.toFixed(2)) + '）';
    }

    drawGraph(m, m2, isPerp);
  }

  function drawGraph(m, m2, isPerp){
    const W=500,H=500,cx=W/2,cy=H/2,sc=40;
    function tx(x){return cx+x*sc;}
    function ty(y){return cy-y*sc;}
    let html='';
    for(let i=-6;i<=6;i++){
      html+='<line x1="'+tx(i)+'" y1="0" x2="'+tx(i)+'" y2="'+H+'" stroke="#eee" stroke-width="1"/>';
      html+='<line x1="0" y1="'+ty(i)+'" x2="'+W+'" y2="'+ty(i)+'" stroke="#eee" stroke-width="1"/>';
    }
    html+='<line x1="0" y1="'+cy+'" x2="'+W+'" y2="'+cy+'" stroke="#999" stroke-width="1.5"/>';
    html+='<line x1="'+cx+'" y1="0" x2="'+cx+'" y2="'+H+'" stroke="#999" stroke-width="1.5"/>';
    html+='<foreignObject x="'+(Math.min(W-8,W-26))+'" y="'+(cy-22)+'" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#999">'+T('x')+'</div></foreignObject>';
    html+='<foreignObject x="'+(cx+6)+'" y="'+Math.max(2,2)+'" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#999">'+T('y')+'</div></foreignObject>';
    html+='<text x="'+(cx-12)+'" y="'+(cy+16)+'" font-size="11" fill="#999">O</text>';

    function drawLine(slope, yint, color, lbl){
      const pts=[];
      for(let sx=-7;sx<=7;sx+=0.1){
        const sy=slope*sx+yint;
        if(sy>=-7&&sy<=7) pts.push([tx(sx),ty(sy)]);
      }
      if(pts.length>1){
        let d='M'+pts[0][0]+','+pts[0][1];
        for(let i=1;i<pts.length;i++) d+=' L'+pts[i][0]+','+pts[i][1];
        html+='<path d="'+d+'" stroke="'+color+'" stroke-width="2.5" fill="none"/>';
      }
      const lx=2.5,ly=slope*lx+yint;
      if(ly>=-6&&ly<=6){
        html+='<text x="'+(tx(lx)+10)+'" y="'+(ty(ly)-10)+'" font-size="14" font-weight="700" fill="'+color+'">'+lbl+'</text>';
      }
    }

    drawLine(m, 0, 'var(--c-red)', 'l');
    drawLine(m2, 0, 'var(--c-blue)', "l'");

    // right angle at origin
    if(isPerp){
      const op=Math.sqrt(1+m*m), oq=Math.sqrt(1+m2*m2);
      const sz=0.4;
      const dx1=1/op,dy1=m/op, dx2=1/oq,dy2=m2/oq;
      html+='<path d="M'+tx(dx1*sz)+','+ty(dy1*sz)+' L'+tx((dx1+dx2)*sz)+','+ty((dy1+dy2)*sz)+' L'+tx(dx2*sz)+','+ty(dy2*sz)+'" class="right-angle" stroke-width="2.5"/>';
      // pulse effect on right angle
      html+='<circle cx="'+cx+'" cy="'+cy+'" r="20" fill="none" stroke="var(--c-green)" stroke-width="2" class="anim-pulse"/>';
    }

    document.getElementById('graph').innerHTML = html;
  }

  slM.addEventListener('input', update);
  slM2.addEventListener('input', update);

  // Change fixed slope on slider-m change
  slM.addEventListener('input', ()=>{
    // reset m2 to 0 when m changes
    // slM2.value = 0;
    update();
  });

  update();

  // Quizzes
  buildQuiz('q1', '直線 '+T('y=3x+1')+' に垂直な直線の傾きは？',
    [{text:T('3'), correct:false},
     {text:T('-3'), correct:false},
     {text:T('-\\dfrac{1}{3}'), correct:true},
     {text:T('\\dfrac{1}{3}'), correct:false}],
    T("mm'=-1")+' より '+T("3 \\cdot m' = -1")+' なので '+T("m' = -\\dfrac{1}{3}")
  );

  buildQuiz('q2', '直線 '+T('y=-\\dfrac{2}{5}x+4')+' に垂直な直線の傾きは？',
    [{text:T('-\\dfrac{2}{5}'), correct:false},
     {text:T('\\dfrac{5}{2}'), correct:true},
     {text:T('-\\dfrac{5}{2}'), correct:false},
     {text:T('\\dfrac{2}{5}'), correct:false}],
    T("mm'=-1")+' より '+T("-\\dfrac{2}{5} \\cdot m' = -1")+' なので '+T("m' = \\dfrac{5}{2}")
  );

  buildQuiz('q3', '直線 '+T('3x+2y-9=0')+' に垂直で、点 '+T('(-1,\\,2)')+' を通る直線は？',
    [{text:T('3x+2y-1=0'), correct:false},
     {text:T('2x+3y-4=0'), correct:false},
     {text:T('2x-3y+8=0'), correct:true},
     {text:T('-2x+3y-8=0'), correct:false}],
    '傾き '+T('m=-\\dfrac{3}{2}')+' に垂直 → '+T("m'=\\dfrac{2}{3}")+
    '<br>点 '+T('(-1,2)')+' を通る：'+T('y-2=\\dfrac{2}{3}(x+1)')+' → '+T('2x-3y+8=0')
  );

  function buildQuiz(id, question, options, explanation){
    document.getElementById(id+'-text').innerHTML = question;
    const cont = document.getElementById(id+'-options');
    const fb = document.getElementById(id+'-fb');
    let answered = false;
    options.forEach(opt=>{
      const btn = document.createElement('button');
      btn.className = 'quiz-option';
      btn.innerHTML = opt.text;
      btn.addEventListener('click', ()=>{
        if(answered) return;
        answered = true;
        cont.querySelectorAll('.quiz-option').forEach(b=>{
          b.disabled = true;
          if(b===btn){
            b.classList.add(opt.correct?'correct':'wrong');
          }
          // show correct one
          if(options[Array.from(cont.children).indexOf(b)].correct){
            b.classList.add('correct');
          }
        });
        fb.innerHTML = opt.correct ?
          '<strong>正解！</strong><br>'+explanation :
          '<strong>不正解</strong><br>'+explanation;
        fb.className = 'quiz-feedback show '+(opt.correct?'ok':'ng');
      });
      cont.appendChild(btn);
    });
  }
}
</script>
</body>
</html>
