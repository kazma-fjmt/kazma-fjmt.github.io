<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>三角関数の周期性</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.05rem; }
  .live-calc .row { margin: .3rem 0; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem 1.25rem; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .6rem 1rem; margin: .5rem 0 .75rem; font-size: .9rem; }
  .legend .item { display: flex; align-items: center; gap: .4rem; }
  .legend .sw { width: 26px; height: 5px; border-radius: 3px; flex: none; }
  .legend .sw.dash { height: 0; border-radius: 0; border-top: 4px dashed currentColor; }
  .legend .sw.dot { width: 12px; height: 12px; border-radius: 50%; }

  .slider-row {
    display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem;
  }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.05rem; font-weight: 700; color: var(--accent); min-width: 4.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .75rem; flex-wrap: wrap; margin: .5rem 0; }
  .turn-badge { display: inline-block; background: #f0f5ff; border: 1px solid #d4dbeb; border-radius: 999px; padding: .1rem .7rem; font-weight: 700; color: var(--accent); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>三角関数の周期性</h1>
  <p class="subtitle">動径を何周させても三角関数の値は変わりません。大きな角の値を求めましょう。</p>

  <h2>基本の考え方</h2>
  <p><span id="f-n"></span> を整数とするとき、角 <span id="f-t2n"></span> の動径は角 <span id="f-t"></span> の動径とまったく同じ位置にあります。動径の位置が同じなら、単位円との交点の座標も同じです。</p>
  <div class="formula-box" id="f-rules"></div>

  <h2>求めたい値</h2>
  <div class="formula-box" id="f-goal"></div>

  <h2>動かして確かめよう</h2>
  <p>スライダーで角 <span id="f-t2"></span> を大きくすると、動径がぐるぐる回ります。何周しても点 <span id="f-p"></span> の位置は円周上の同じところに戻ってきます。</p>

  <div class="slider-row">
    <label><span id="lbl-th"></span> =</label>
    <input type="range" id="th-slider" min="0" max="25.13" step="0.01" value="21.21">
    <span class="slider-val" id="th-value">21.21</span>
  </div>

  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">アニメーション</button>
    <button class="btn" id="set-btn">求める角にする</button>
  </div>

  <div class="svg-container" id="circle-wrap">
    <svg id="circle" viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend" id="legend-c"></div>

  <div class="svg-container" id="wave-wrap">
    <svg id="wave" viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend" id="legend-w"></div>

  <div class="live-calc" id="live-calc"></div>

  <div class="note" id="note-graph"></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <div class="formula-box" id="f-answer"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const TAU = 2*Math.PI;
const TARGET = 27/4*Math.PI;
const CW=600, CH=420, cox=300, coy=210, R=140;
const WW=600, WH=280, wx0=44, wx1=580, wAxis=140, wAmp=88, TMAX=8*Math.PI;

let theta = TARGET;
let animId = null;
let cur = 0;

const STEPS = [
  { label: 'Step 1: 角の大きさをつかむ', formula: '\\dfrac{27}{4}\\pi = 6.75\\pi \\quad \\text{なので、半回転 } \\pi \\text{ を 6.75 個分}' },
  { label: 'Step 2: 1 周ぶんの角と比べる', formula: '2\\pi = \\dfrac{8}{4}\\pi \\quad \\Longrightarrow \\quad \\dfrac{27}{4}\\pi \\div 2\\pi = \\dfrac{27}{8} = 3.375' },
  { label: 'Step 3: 何周ぶん引けるか決める', formula: 'n = 3 \\quad \\text{（3 周ぶん、つまり } 2 \\cdot 3 \\cdot \\pi = 6\\pi \\text{ を引く）}' },
  { label: 'Step 4: 引き算する', formula: '\\dfrac{27}{4}\\pi - 6\\pi = \\dfrac{27}{4}\\pi - \\dfrac{24}{4}\\pi = \\dfrac{3}{4}\\pi' },
  { label: 'Step 5: 分解した形に書き直す', formula: '\\dfrac{27}{4}\\pi = \\dfrac{3}{4}\\pi + 2 \\cdot 3 \\cdot \\pi' },
  { label: 'Step 6: 周期の公式を使う', formula: '\\sin\\left(\\theta + 2n\\pi\\right) = \\sin\\theta, \\quad \\cos\\left(\\theta + 2n\\pi\\right) = \\cos\\theta, \\quad \\tan\\left(\\theta + 2n\\pi\\right) = \\tan\\theta' },
  { label: 'Step 7: 基本の角の値に直す', formula: '\\sin\\dfrac{27}{4}\\pi = \\sin\\dfrac{3}{4}\\pi, \\quad \\cos\\dfrac{27}{4}\\pi = \\cos\\dfrac{3}{4}\\pi, \\quad \\tan\\dfrac{27}{4}\\pi = \\tan\\dfrac{3}{4}\\pi' },
  { label: 'Step 8: 単位円から値を読む', formula: '\\dfrac{3}{4}\\pi \\text{ の動径と単位円の交点は } \\left(-\\dfrac{\\sqrt{2}}{2},\\ \\dfrac{\\sqrt{2}}{2}\\right)' },
  { label: 'Step 9: 結論', formula: '\\sin\\dfrac{27}{4}\\pi = \\dfrac{\\sqrt{2}}{2}, \\quad \\cos\\dfrac{27}{4}\\pi = -\\dfrac{\\sqrt{2}}{2}, \\quad \\tan\\dfrac{27}{4}\\pi = -1' }
];

function init(){
  document.getElementById('f-n').innerHTML = T('n');
  document.getElementById('f-t').innerHTML = T('\\theta');
  document.getElementById('f-t2').innerHTML = T('\\theta');
  document.getElementById('f-t2n').innerHTML = T('\\theta + 2n\\pi');
  document.getElementById('f-p').innerHTML = T('\\mathrm{P}');
  document.getElementById('lbl-th').innerHTML = T('\\theta');

  document.getElementById('legend-c').innerHTML =
    '<span class="item"><span class="sw" style="background:var(--c-orange)"></span>' + T('\\text{動径（長さ }1\\text{）}') + '</span>' +
    '<span class="item"><span class="sw dash" style="color:var(--c-red)"></span>' + T('\\sin\\theta') + '</span>' +
    '<span class="item"><span class="sw dash" style="color:var(--c-blue)"></span>' + T('\\cos\\theta') + '</span>';
  document.getElementById('legend-w').innerHTML =
    '<span class="item"><span class="sw" style="background:var(--c-red)"></span>' + T('y = \\sin\\theta') + '</span>' +
    '<span class="item"><span class="sw" style="background:var(--c-blue)"></span>' + T('y = \\cos\\theta') + '</span>' +
    '<span class="item"><span class="sw dot" style="background:var(--c-orange)"></span>' + T('\\theta - 2n\\pi') + ' の点</span>';

  tex('\\sin\\left(\\theta + 2n\\pi\\right) = \\sin\\theta, \\qquad \\cos\\left(\\theta + 2n\\pi\\right) = \\cos\\theta, \\qquad \\tan\\left(\\theta + 2n\\pi\\right) = \\tan\\theta', document.getElementById('f-rules'), true);
  tex('\\sin\\dfrac{27}{4}\\pi, \\qquad \\cos\\dfrac{27}{4}\\pi, \\qquad \\tan\\dfrac{27}{4}\\pi', document.getElementById('f-goal'), true);
  tex('\\sin\\dfrac{27}{4}\\pi = \\dfrac{\\sqrt{2}}{2}, \\qquad \\cos\\dfrac{27}{4}\\pi = -\\dfrac{\\sqrt{2}}{2}, \\qquad \\tan\\dfrac{27}{4}\\pi = -1', document.getElementById('f-answer'), true);

  document.getElementById('note-graph').innerHTML =
    '<strong>グラフで見ると：</strong>' + T('y = \\sin\\theta') + ' と ' + T('y = \\cos\\theta') +
    ' は、横に ' + T('2\\pi') + ' ずらすとぴったり重なります。だから ' + T('2\\pi') +
    ' の整数倍だけ離れた角では、同じ高さの値になります。';

  setupSlider();
  setupButtons();
  renderSteps();
  draw();
}

function setupButtons(){
  document.getElementById('prev').addEventListener('click', function(){ if(cur > 0){ cur--; renderSteps(); } });
  document.getElementById('next').addEventListener('click', function(){ if(cur < STEPS.length-1){ cur++; renderSteps(); } });
  document.getElementById('set-btn').addEventListener('click', function(){
    if(animId){ cancelAnimationFrame(animId); animId = null; }
    setTheta(TARGET);
  });
  document.getElementById('anim-btn').addEventListener('click', function(){
    if(animId){ cancelAnimationFrame(animId); animId = null; }
    const dur = 8000;
    let t0 = null;
    function frame(ts){
      if(!t0) t0 = ts;
      const p = Math.min((ts - t0)/dur, 1);
      setTheta(TARGET * p);
      if(p < 1) animId = requestAnimationFrame(frame); else animId = null;
    }
    animId = requestAnimationFrame(frame);
  });
}

function renderSteps(){
  let html = '';
  for(let i = 0; i <= cur; i++){
    html += '<div class="step ' + (i === cur ? 'current' : '') + '"><div class="label">' + STEPS[i].label + '</div><div class="formula-line">' + T(STEPS[i].formula) + '</div></div>';
  }
  document.getElementById('walkthrough').innerHTML = html;
  document.getElementById('counter').textContent = (cur+1) + ' / ' + STEPS.length;
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === STEPS.length-1;
}

function fo(x, y, w, h, size, color, html, weight){
  return '<foreignObject x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:' + size + 'px;color:' + color + ';font-weight:' + (weight || 600) + ';white-space:nowrap">' + html + '</div></foreignObject>';
}

function drawCircle(){
  const base = theta % TAU;
  const turns = Math.floor(theta / TAU);
  const c = Math.cos(theta), s = Math.sin(theta);
  let g = '';

  g += '<line x1="' + (cox-R-50) + '" y1="' + coy + '" x2="' + (cox+R+60) + '" y2="' + coy + '" stroke="#bbb" stroke-width="1.5"/>';
  g += '<line x1="' + cox + '" y1="' + (coy-R-45) + '" x2="' + cox + '" y2="' + (coy+R+45) + '" stroke="#bbb" stroke-width="1.5"/>';
  g += '<circle cx="' + cox + '" cy="' + coy + '" r="' + R + '" fill="none" stroke="#dcdcdc" stroke-width="2"/>';

  /* Spiral trail: shows how many turns the radius has made */
  if(theta > 0.01){
    const N = 260;
    let d = '';
    for(let i = 0; i <= N; i++){
      const a = theta * i / N;
      const rr = R*0.30 + (R*0.66) * (a / Math.max(TMAX, theta));
      const X = cox + rr*Math.cos(a), Y = coy - rr*Math.sin(a);
      d += (i === 0 ? 'M ' : ' L ') + X.toFixed(2) + ' ' + Y.toFixed(2);
    }
    g += '<path d="' + d + '" fill="none" stroke="var(--c-orange)" stroke-width="2" opacity="0.5"/>';
  }

  /* Arc of the reduced angle */
  const ar = 52, large = base > Math.PI ? 1 : 0;
  g += '<path d="M ' + (cox+ar) + ' ' + coy + ' A ' + ar + ' ' + ar + ' 0 ' + large + ' 0 ' + (cox+ar*Math.cos(base)) + ' ' + (coy-ar*Math.sin(base)) + '" fill="none" stroke="var(--c-purple)" stroke-width="3"/>';
  g += fo(cox + 74*Math.cos(base/2) - 40, coy - 74*Math.sin(base/2) - 15, 86, 30, 13, 'var(--c-purple)', T('\\theta - 2n\\pi'), 700);

  /* Radius and point */
  g += '<line x1="' + cox + '" y1="' + coy + '" x2="' + (cox+R*c) + '" y2="' + (coy-R*s) + '" stroke="var(--c-orange)" stroke-width="3"/>';
  g += '<line x1="' + (cox+R*c) + '" y1="' + coy + '" x2="' + (cox+R*c) + '" y2="' + (coy-R*s) + '" stroke="var(--c-red)" stroke-width="3" stroke-dasharray="5 4"/>';
  g += '<line x1="' + cox + '" y1="' + (coy-R*s) + '" x2="' + (cox+R*c) + '" y2="' + (coy-R*s) + '" stroke="var(--c-blue)" stroke-width="3" stroke-dasharray="5 4"/>';
  g += '<circle cx="' + (cox+R*c) + '" cy="' + (coy-R*s) + '" r="8" fill="var(--c-orange)" stroke="#fff" stroke-width="2.5"/>';
  g += '<circle cx="' + (cox+R*c) + '" cy="' + (coy-R*s) + '" r="8" fill="none" stroke="var(--c-orange)" stroke-width="2.5"><animate attributeName="r" values="8;17;8" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0;0.9" dur="1.6s" repeatCount="indefinite"/></circle>';
  g += fo(Math.max(2, Math.min(cox + R*c + 34*c - 9, CW-30)), Math.max(2, coy - R*s - 34*s - 11), 30, 26, 14, 'var(--c-orange)', T('\\mathrm{P}'), 700);

  g += '<circle cx="' + cox + '" cy="' + coy + '" r="4" fill="#666"/>';
  g += '<text x="' + (cox-17) + '" y="' + (coy+19) + '" font-size="13" fill="#666" font-weight="700">O</text>';
  g += fo(cox+R+64, coy-13, 24, 26, 14, '#999', T('x'));
  g += fo(cox+10, 0, 24, 26, 14, '#999', T('y'));

  /* Turn counter */
  g += fo(14, 12, 250, 30, 15, 'var(--c-orange)', '回った回数 ' + T('n = ' + turns), 700);
  for(let i = 0; i < Math.min(turns, 8); i++){
    g += '<circle cx="' + (24 + i*22) + '" cy="' + 56 + '" r="8" fill="var(--c-orange)" opacity="0.75"/>';
  }
  g += fo(14, CH-40, 300, 30, 14, 'var(--c-purple)', T('\\theta = ' + (theta/Math.PI).toFixed(3) + '\\pi'), 700);

  document.getElementById('circle').innerHTML = g;
}

function sx(t){ return wx0 + (t / TMAX) * (wx1 - wx0); }
function sy(v){ return wAxis - v * wAmp; }

function curvePath(fn){
  let d = '';
  const N = 320;
  for(let i = 0; i <= N; i++){
    const t = TMAX * i / N;
    d += (i === 0 ? 'M ' : ' L ') + sx(t).toFixed(2) + ' ' + sy(fn(t)).toFixed(2);
  }
  return d;
}

function drawWave(){
  const base = theta % TAU;
  const turns = Math.floor(theta / TAU);
  let g = '';

  g += '<line x1="' + wx0 + '" y1="' + wAxis + '" x2="' + (wx1+10) + '" y2="' + wAxis + '" stroke="#bbb" stroke-width="1.5"/>';
  g += '<line x1="' + wx0 + '" y1="' + (wAxis-wAmp-24) + '" x2="' + wx0 + '" y2="' + (wAxis+wAmp+24) + '" stroke="#bbb" stroke-width="1.5"/>';
  g += '<line x1="' + wx0 + '" y1="' + sy(1) + '" x2="' + wx1 + '" y2="' + sy(1) + '" stroke="#f0f0f0" stroke-width="1"/>';
  g += '<line x1="' + wx0 + '" y1="' + sy(-1) + '" x2="' + wx1 + '" y2="' + sy(-1) + '" stroke="#f0f0f0" stroke-width="1"/>';

  for(let k = 1; k <= 4; k++){
    const t = k*TAU;
    g += '<line x1="' + sx(t) + '" y1="' + (wAxis-wAmp-14) + '" x2="' + sx(t) + '" y2="' + (wAxis+wAmp+14) + '" stroke="#e6e0f7" stroke-width="1.5" stroke-dasharray="4 4"/>';
    g += fo(sx(t)-16, wAxis+wAmp+18, 44, 26, 12, '#aaa', T(String(2*k) + '\\pi'));
  }

  g += '<path d="' + curvePath(Math.cos) + '" fill="none" stroke="var(--c-blue)" stroke-width="2" opacity="0.35"/>';
  g += '<path d="' + curvePath(Math.sin) + '" fill="none" stroke="var(--c-red)" stroke-width="2" opacity="0.35"/>';

  /* Traced part up to the current angle */
  let dSin = '', dCos = '';
  const N = 260;
  for(let i = 0; i <= N; i++){
    const t = theta * i / N;
    dSin += (i === 0 ? 'M ' : ' L ') + sx(t).toFixed(2) + ' ' + sy(Math.sin(t)).toFixed(2);
    dCos += (i === 0 ? 'M ' : ' L ') + sx(t).toFixed(2) + ' ' + sy(Math.cos(t)).toFixed(2);
  }
  g += '<path d="' + dCos + '" fill="none" stroke="var(--c-blue)" stroke-width="3"/>';
  g += '<path d="' + dSin + '" fill="none" stroke="var(--c-red)" stroke-width="3"/>';

  /* Markers at the current angle and at the reduced angle */
  g += '<line x1="' + sx(base) + '" y1="' + sy(Math.sin(base)) + '" x2="' + sx(theta) + '" y2="' + sy(Math.sin(theta)) + '" stroke="var(--c-orange)" stroke-width="2" stroke-dasharray="6 4"/>';
  g += '<circle cx="' + sx(base) + '" cy="' + sy(Math.sin(base)) + '" r="6" fill="var(--c-orange)" stroke="#fff" stroke-width="2"/>';
  g += '<circle cx="' + sx(theta) + '" cy="' + sy(Math.sin(theta)) + '" r="7" fill="var(--c-red)" stroke="#fff" stroke-width="2"/>';
  g += '<circle cx="' + sx(theta) + '" cy="' + sy(Math.cos(theta)) + '" r="7" fill="var(--c-blue)" stroke="#fff" stroke-width="2"/>';
  g += '<line x1="' + sx(theta) + '" y1="' + (wAxis-wAmp-14) + '" x2="' + sx(theta) + '" y2="' + (wAxis+wAmp+14) + '" stroke="var(--c-orange)" stroke-width="2"/>';

  if(turns >= 1){
    g += fo(wx0+6, 8, 240, 28, 13, 'var(--c-orange)', '破線の両端は同じ高さ（' + T('2 \\cdot ' + turns + '\\pi') + ' ずれ）', 700);
  }
  g += fo(wx1-24, wAxis-30, 30, 26, 14, '#999', T('\\theta'));

  document.getElementById('wave').innerHTML = g;
}

function fmt(v){ return (Math.abs(v) < 5e-4 ? 0 : v).toFixed(3); }

function updateLive(){
  const base = theta % TAU;
  const turns = Math.floor(theta / TAU);
  const c = Math.cos(theta), s = Math.sin(theta);
  let html = '';
  html += '<div class="row">' + T('\\theta = ' + theta.toFixed(2) + ' = ' + (theta/Math.PI).toFixed(3) + '\\pi \\quad (' + (theta*180/Math.PI).toFixed(1) + '^\\circ)') + '</div>';
  html += '<div class="row">分解：' + T('\\theta = ' + (base/Math.PI).toFixed(3) + '\\pi + 2 \\cdot ' + turns + ' \\cdot \\pi') + '</div>';
  html += '<div class="row">基本の角 <span class="turn-badge">' + T('\\theta - 2n\\pi = ' + (base/Math.PI).toFixed(3) + '\\pi') + '</span></div>';
  html += '<div class="row">' + T('\\sin\\theta = ' + fmt(s) + ', \\quad \\cos\\theta = ' + fmt(c)) + '</div>';
  if(Math.abs(c) < 0.02){
    html += '<div class="row">' + T('\\tan\\theta') + ' はこの角では定義できません</div>';
  } else {
    html += '<div class="row">' + T('\\tan\\theta = ' + fmt(Math.tan(theta))) + '</div>';
  }
  document.getElementById('live-calc').innerHTML = html;
}

function draw(){ drawCircle(); drawWave(); updateLive(); }

function setTheta(v){
  theta = Math.max(0, Math.min(TMAX, v));
  document.getElementById('th-slider').value = theta;
  document.getElementById('th-value').textContent = theta.toFixed(2);
  draw();
}

function setupSlider(){
  const sl = document.getElementById('th-slider');
  sl.addEventListener('input', function(){
    if(animId){ cancelAnimationFrame(animId); animId = null; }
    theta = parseFloat(sl.value);
    document.getElementById('th-value').textContent = theta.toFixed(2);
    draw();
  });
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
