<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>3つ以上の連立不等式の表す領域</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa;
    --fg: #333;
    --muted: #888;
    --accent: #2a6df4;
    --c-a: #d9534f;
    --c-b: #2a6df4;
    --c-c: #5cb85c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 {
    font-size: 1.15rem; margin: 2.25rem 0 .75rem;
    border-left: 4px solid var(--accent); padding-left: .6rem;
  }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.3rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none;
    position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step {
    padding: .75rem .25rem; border-bottom: 1px dashed #eee;
    transition: background .2s ease;
  }
  .step:last-child { border-bottom: none; }
  .step.current {
    background: #f0f5ff; border-radius: 8px; padding: .75rem;
    margin: .25rem -.5rem; border-bottom: none;
  }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.2rem; }
  .step.current .formula-line .katex { font-size: 1.35rem; }

  .controls-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; margin: 1rem 0 0;
  }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter {
    color: var(--muted); font-size: .9rem; text-align: center; flex: 1;
  }

  .note {
    background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px;
    padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem;
  }

  .legend {
    display: flex; gap: 1rem; flex-wrap: wrap; margin: .5rem 0;
    font-size: .9rem; align-items: center;
  }
  .legend-item { display: flex; align-items: center; gap: .35rem; }
  .legend-swatch {
    display: inline-block; width: 18px; height: 18px; border-radius: 4px;
  }

  .test-result {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: .75rem 0; overflow-x: auto;
  }
  .test-result .check { color: #5cb85c; font-weight: 700; }
  .test-result .cross { color: #d9534f; font-weight: 700; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .step { animation: fadeIn .3s ease; }

  @keyframes drawLine {
    from { stroke-dashoffset: 1000; }
    to { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
<main>
  <h1>3つ以上の連立不等式の表す領域</h1>
  <p class="subtitle">不等式が3つ以上でも考え方は同じ。すべての領域の共通部分を求めます。</p>

  <h2>問10</h2>
  <div class="formula-box" id="formula-system"></div>

  <h2>ステップ解説</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev">&larr; 戻る</button>
    <div class="step-counter">ステップ <span id="step-cur"></span> / <span id="step-tot"></span></div>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>グラフ</h2>
  <p>各直線が順にアニメーション表示され、最終的に三角形の領域が現れます。テストポイントをドラッグして確認しましょう。</p>
  <div class="legend">
    <div class="legend-item"><span class="legend-swatch" style="background:rgba(42,109,244,0.3);"></span>① の境界線</div>
    <div class="legend-item"><span class="legend-swatch" style="background:rgba(217,83,79,0.3);"></span>② の境界線</div>
    <div class="legend-item"><span class="legend-swatch" style="background:rgba(92,184,92,0.3);"></span>③ の境界線</div>
    <div class="legend-item"><span class="legend-swatch" style="background:rgba(120,70,180,0.3);"></span>共通領域</div>
  </div>
  <div class="svg-container" id="svg-wrap">
    <svg id="coordplane" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="test-result" id="test-result"></div>

  <div class="note">
    <strong>ポイント：</strong>3つ以上の不等式の場合も、すべての領域の共通部分を求めます。境界線の交点が頂点になることが多いので、連立方程式を解いて頂点を求めましょう。
  </div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const SVG_NS="http://www.w3.org/2000/svg";
const W=600,H=600,OX=300,OY=300,SCALE=80;

function toSVG(x,y){return[OX+x*SCALE,OY-y*SCALE];}
function fromSVG(px,py){return[(px-OX)/SCALE,(OY-py)/SCALE];}

// System:
// ① x+2y-2≤0 → y ≤ -x/2+1
// ② x-y+1≥0 → y ≤ x+1
// ③ y ≥ 0
// Vertices: ①∩② → (0,1), ①∩③ → (2,0), ②∩③ → (-1,0)

const steps=[
  {label:"ステップ 1", html:()=>`① ${T("x+2y \\leq 2")} を変形すると ${T("y \\leq -\\dfrac{1}{2}x + 1")}<br>→ 直線 ${T("y=-\\dfrac{1}{2}x+1")} の下側（境界を含む）`},
  {label:"ステップ 2", html:()=>`② ${T("x-y \\geq -1")} を変形すると ${T("y \\leq x+1")}<br>→ 直線 ${T("y=x+1")} の下側（境界を含む）`},
  {label:"ステップ 3", html:()=>`③ ${T("y \\geq 0")}<br>→ ${T("x")} 軸の上側（境界を含む）`},
  {label:"ステップ 4", html:()=>`境界線の交点（頂点）を求める：<br>①∩②：${T("-\\tfrac{1}{2}x+1=x+1 \\Rightarrow x=0,\\;y=1")} → ${T("(0,1)")}<br>①∩③：${T("-\\tfrac{1}{2}x+1=0 \\Rightarrow x=2,\\;y=0")} → ${T("(2,0)")}<br>②∩③：${T("x+1=0 \\Rightarrow x=-1,\\;y=0")} → ${T("(-1,0)")}`},
  {label:"ステップ 5", html:()=>`求める領域は3頂点 ${T("(0,1)")}, ${T("(2,0)")}, ${T("(-1,0)")} を結ぶ<strong>三角形の内部と境界</strong><br>（すべて ≤ または ≥ なので境界を含む → 実線で表す）`}
];

let curStep=0;
let testPt={x:0.3,y:0.3};
let dragging=false;

function renderSteps(){
  const wt=document.getElementById("walkthrough");
  let h="";
  steps.forEach((s,i)=>{
    const cls=i===curStep?"step current":"step";
    const vis=i<=curStep?"":'style="display:none"';
    h+=`<div class="${cls}" ${vis}><div class="label">${s.label}</div><div class="formula-line">${s.html()}</div></div>`;
  });
  wt.innerHTML=h;
  document.getElementById("step-cur").textContent=curStep+1;
  document.getElementById("step-tot").textContent=steps.length;
  document.getElementById("prev").disabled=curStep===0;
  document.getElementById("next").disabled=curStep===steps.length-1;
  drawSVG();
}

document.getElementById("prev").addEventListener("click",()=>{if(curStep>0){curStep--;renderSteps();}});
document.getElementById("next").addEventListener("click",()=>{if(curStep<steps.length-1){curStep++;renderSteps();}});

function buildGrid(svg){
  for(let x=-3;x<=3;x++){
    const[sx]=toSVG(x,0);
    const l=document.createElementNS(SVG_NS,"line");
    l.setAttribute("x1",sx);l.setAttribute("y1",0);l.setAttribute("x2",sx);l.setAttribute("y2",H);
    l.setAttribute("stroke",x===0?"#555":"#e0e0e0");l.setAttribute("stroke-width",x===0?1.5:0.8);
    svg.appendChild(l);
  }
  for(let y=-3;y<=3;y++){
    const[,sy]=toSVG(0,y);
    const l=document.createElementNS(SVG_NS,"line");
    l.setAttribute("x1",0);l.setAttribute("y1",sy);l.setAttribute("x2",W);l.setAttribute("y2",sy);
    l.setAttribute("stroke",y===0?"#555":"#e0e0e0");l.setAttribute("stroke-width",y===0?1.5:0.8);
    svg.appendChild(l);
  }
  for(let v=-3;v<=3;v++){
    if(v===0)continue;
    const[sx,sy]=toSVG(v,0);
    const tx=document.createElementNS(SVG_NS,"text");
    tx.setAttribute("x",sx);tx.setAttribute("y",sy+18);
    tx.setAttribute("text-anchor","middle");tx.setAttribute("font-size","12");tx.setAttribute("fill","#888");
    tx.textContent=v;svg.appendChild(tx);
    const[sx2,sy2]=toSVG(0,v);
    const ty=document.createElementNS(SVG_NS,"text");
    ty.setAttribute("x",sx2-14);ty.setAttribute("y",sy2+4);
    ty.setAttribute("text-anchor","middle");ty.setAttribute("font-size","12");ty.setAttribute("fill","#888");
    ty.textContent=v;svg.appendChild(ty);
  }
  const[ox,oy]=toSVG(0,0);
  const oL=document.createElementNS(SVG_NS,"text");
  oL.setAttribute("x",ox-14);oL.setAttribute("y",oy+16);
  oL.setAttribute("font-size","13");oL.setAttribute("fill","#888");
  oL.textContent="O";svg.appendChild(oL);
}

function drawLineOnSVG(svg,yFn,color,dashed,label,labelFrac){
  const pts=[];
  for(let x=-4;x<=4;x+=0.05){
    const y=yFn(x);
    if(y<-4||y>4)continue;
    pts.push(toSVG(x,y));
  }
  if(pts.length<2)return;
  const pl=document.createElementNS(SVG_NS,"polyline");
  pl.setAttribute("points",pts.map(p=>p[0]+","+p[1]).join(" "));
  pl.setAttribute("fill","none");pl.setAttribute("stroke",color);
  pl.setAttribute("stroke-width","2.5");
  if(dashed)pl.setAttribute("stroke-dasharray","8,5");
  svg.appendChild(pl);
  if(label){
    const idx=Math.floor(pts.length*(labelFrac||0.15));
    const mid=pts[Math.min(idx,pts.length-1)];
    if(mid){
      const lbl=document.createElementNS(SVG_NS,"text");
      lbl.setAttribute("x",mid[0]+8);lbl.setAttribute("y",mid[1]-10);
      lbl.setAttribute("font-size","14");lbl.setAttribute("font-weight","600");
      lbl.setAttribute("fill",color);lbl.textContent=label;
      svg.appendChild(lbl);
    }
  }
}

function drawSVG(){
  const svg=document.getElementById("coordplane");
  svg.innerHTML="";
  buildGrid(svg);

  const showL1=curStep>=0, showL2=curStep>=1, showL3=curStep>=2;
  const showVertices=curStep>=3, showTriangle=curStep>=4;

  // Triangle fill (feasible region)
  if(showTriangle){
    const v=[[0,1],[2,0],[-1,0]];
    const poly=document.createElementNS(SVG_NS,"polygon");
    poly.setAttribute("points",v.map(p=>toSVG(p[0],p[1]).join(",")).join(" "));
    poly.setAttribute("fill","rgba(120,70,180,0.2)");
    poly.setAttribute("stroke","rgba(120,70,180,0.5)");
    poly.setAttribute("stroke-width","2");
    poly.style.animation="fadeIn 0.6s ease";
    svg.appendChild(poly);
  }

  // Draw lines
  if(showL1) drawLineOnSVG(svg,x=>-0.5*x+1,"var(--c-b)",false,"①",0.8);
  if(showL2) drawLineOnSVG(svg,x=>x+1,"var(--c-a)",false,"②",0.85);
  if(showL3){
    // y=0 is x-axis, draw a thicker colored overlay
    const pts=[toSVG(-3.5,0),toSVG(3.5,0)];
    const pl=document.createElementNS(SVG_NS,"line");
    pl.setAttribute("x1",pts[0][0]);pl.setAttribute("y1",pts[0][1]);
    pl.setAttribute("x2",pts[1][0]);pl.setAttribute("y2",pts[1][1]);
    pl.setAttribute("stroke","var(--c-c)");pl.setAttribute("stroke-width","2.5");
    svg.appendChild(pl);
    const lbl=document.createElementNS(SVG_NS,"text");
    lbl.setAttribute("x",pts[1][0]-20);lbl.setAttribute("y",pts[1][1]+20);
    lbl.setAttribute("font-size","14");lbl.setAttribute("font-weight","600");
    lbl.setAttribute("fill","var(--c-c)");lbl.textContent="③";
    svg.appendChild(lbl);
  }

  // Vertices
  if(showVertices){
    const verts=[{p:[0,1],l:"(0, 1)",dx:-40,dy:-12},{p:[2,0],l:"(2, 0)",dx:8,dy:20},{p:[-1,0],l:"(−1, 0)",dx:-55,dy:20}];
    verts.forEach(v=>{
      const[cx,cy]=toSVG(v.p[0],v.p[1]);
      const d=document.createElementNS(SVG_NS,"circle");
      d.setAttribute("cx",cx);d.setAttribute("cy",cy);d.setAttribute("r",5);
      d.setAttribute("fill","#555");d.setAttribute("stroke","#fff");d.setAttribute("stroke-width","2");
      svg.appendChild(d);
      const lbl=document.createElementNS(SVG_NS,"text");
      lbl.setAttribute("x",cx+v.dx);lbl.setAttribute("y",cy+v.dy);
      lbl.setAttribute("font-size","13");lbl.setAttribute("font-weight","600");lbl.setAttribute("fill","#333");
      lbl.textContent=v.l;svg.appendChild(lbl);
    });
  }

  // Test point
  const[px,py]=toSVG(testPt.x,testPt.y);
  const c=document.createElementNS(SVG_NS,"circle");
  c.setAttribute("cx",px);c.setAttribute("cy",py);c.setAttribute("r",10);
  c.setAttribute("fill","rgba(217,83,79,0.8)");
  c.setAttribute("stroke","#fff");c.setAttribute("stroke-width","2");
  c.setAttribute("style","cursor:grab;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.2))");
  svg.appendChild(c);
  const tl=document.createElementNS(SVG_NS,"text");
  tl.setAttribute("x",px+14);tl.setAttribute("y",py-10);
  tl.setAttribute("font-size","12");tl.setAttribute("font-weight","600");tl.setAttribute("fill","#d9534f");
  tl.textContent=`(${testPt.x.toFixed(1)}, ${testPt.y.toFixed(1)})`;svg.appendChild(tl);

  updateTestResult();
}

function updateTestResult(){
  const el=document.getElementById("test-result");
  const x=testPt.x,y=testPt.y;
  const v1=x+2*y-2, v2=x-y+1, v3=y;
  const c1=v1<=0.001, c2=v2>=-0.001, c3=v3>=-0.001;
  el.innerHTML=`<strong>テストポイント</strong> ${T(`(${x.toFixed(1)},\\;${y.toFixed(1)})`)}<br>`
    +`① ${T(`x+2y-2=${v1.toFixed(2)}`)} ${c1?`${T("\\leq 0")} <span class="check">✓</span>`:`${T("> 0")} <span class="cross">✗</span>`}<br>`
    +`② ${T(`x-y+1=${v2.toFixed(2)}`)} ${c2?`${T("\\geq 0")} <span class="check">✓</span>`:`${T("< 0")} <span class="cross">✗</span>`}<br>`
    +`③ ${T(`y=${v3.toFixed(2)}`)} ${c3?`${T("\\geq 0")} <span class="check">✓</span>`:`${T("< 0")} <span class="cross">✗</span>`}<br>`
    +(c1&&c2&&c3?`→ 領域に<strong>含まれる</strong> <span class="check">✓</span>`:`→ 領域に<strong>含まれない</strong> <span class="cross">✗</span>`);
}

// Drag
const svgWrap=document.getElementById("svg-wrap");
const svgEl=document.getElementById("coordplane");
function getPos(e){
  const rect=svgEl.getBoundingClientRect();
  const sx=W/rect.width,sy=H/rect.height;
  const t=e.touches?e.touches[0]:e;
  return[(t.clientX-rect.left)*sx,(t.clientY-rect.top)*sy];
}
function onStart(e){
  const[px,py]=getPos(e);
  const[tx,ty]=toSVG(testPt.x,testPt.y);
  if(Math.hypot(px-tx,py-ty)<25){dragging=true;e.preventDefault();}
}
function onMove(e){
  if(!dragging)return;e.preventDefault();
  const[px,py]=getPos(e);
  const[mx,my]=fromSVG(px,py);
  testPt.x=Math.round(mx*10)/10;testPt.y=Math.round(my*10)/10;
  testPt.x=Math.max(-3,Math.min(3,testPt.x));
  testPt.y=Math.max(-2.5,Math.min(3,testPt.y));
  drawSVG();
}
function onEnd(){dragging=false;}
svgWrap.addEventListener("mousedown",onStart);
svgWrap.addEventListener("mousemove",onMove);
svgWrap.addEventListener("mouseup",onEnd);
svgWrap.addEventListener("touchstart",onStart,{passive:false});
svgWrap.addEventListener("touchmove",onMove,{passive:false});
svgWrap.addEventListener("touchend",onEnd);

function init(){
  tex("\\begin{cases} x + 2y - 2 \\leq 0 & \\cdots \\text{①} \\\\ x - y + 1 \\geq 0 & \\cdots \\text{②} \\\\ y \\geq 0 & \\cdots \\text{③} \\end{cases}", document.getElementById("formula-system"), true);
  renderSteps();
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
</body>
</html>
