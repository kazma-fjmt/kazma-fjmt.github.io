<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>2点を通る直線の方程式</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa;
    --fg: #333;
    --muted: #888;
    --accent: #2a6df4;
    --c-red: #d9534f;
    --c-blue: #2a6df4;
    --c-green: #28a745;
    --c-orange: #e67e22;
    --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 {
    font-size: 1.15rem;
    margin: 2.25rem 0 .75rem;
    border-left: 4px solid var(--accent);
    padding-left: .6rem;
  }
  p { margin: .75rem 0; }

  .formula {
    background: #fff;
    border: 1px solid #e3e3e3;
    border-radius: 10px;
    padding: 1rem;
    text-align: center;
    overflow-x: auto;
    margin: 1rem 0;
  }
  .formula .katex { font-size: 1.25rem; }

  .canvas-container {
    background: #fff;
    border: 1px solid #e3e3e3;
    border-radius: 10px;
    padding: .75rem;
    margin: 1rem 0;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 6px;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }

  .eq-display {
    text-align: center;
    margin: 1rem 0;
    padding: .75rem 1rem;
    background: #eef4ff;
    border-radius: 10px;
    overflow-x: auto;
  }
  .eq-display .katex { font-size: 1.2rem; }

  .info-box {
    background: #fff;
    border: 1px solid #e3e3e3;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin: 1rem 0;
    overflow-x: auto;
  }

  .hint {
    text-align: center;
    color: var(--muted);
    font-size: .85rem;
    margin: .5rem 0 0;
  }

  .walkthrough {
    background: #fff;
    border: 1px solid #e3e3e3;
    border-radius: 10px;
    padding: .75rem 1.25rem;
    margin: 0 0 .75rem;
    min-height: 9rem;
    overflow-x: auto;
  }
  .step {
    padding: .75rem .25rem;
    border-bottom: 1px dashed #eee;
    opacity: 0;
    animation: fadeIn 0.4s ease forwards;
  }
  .step:last-child { border-bottom: none; }
  .step.current {
    background: #f0f5ff;
    border-radius: 8px;
    padding: .75rem;
    margin: .25rem -.5rem;
    border-bottom: none;
  }
  .step .label {
    color: var(--muted);
    font-size: .8rem;
    margin-bottom: .25rem;
  }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.2rem; }
  .step.current .formula-line .katex { font-size: 1.35rem; }

  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .75rem;
    margin: 1rem 0 0;
  }
  .btn {
    appearance: none;
    border: 1px solid #d4dbeb;
    background: #fff;
    color: var(--accent);
    font-size: 1rem;
    font-weight: 600;
    padding: .85rem 1.2rem;
    border-radius: 10px;
    cursor: pointer;
    min-height: 48px;
    min-width: 110px;
    font-family: inherit;
    user-select: none;
  }
  .btn.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter {
    color: var(--muted);
    font-size: .9rem;
    text-align: center;
    flex: 1;
  }

  .example-box {
    background: #eef4ff;
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin: 1rem 0;
  }
  .example-title {
    font-weight: 600;
    color: var(--accent);
    font-size: .95rem;
    margin-bottom: .5rem;
  }

  .note-box {
    background: #fffbe6;
    border: 1px solid #f0d060;
    border-radius: 10px;
    padding: .75rem 1rem;
    margin: 1rem 0;
    font-size: .9rem;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<main>
  <h1>2点を通る直線の方程式</h1>
  <p class="subtitle">2点の座標から直線の方程式を導きます。</p>

  <h2>公式</h2>
  <div class="formula" id="formula1"></div>
  <div class="note-box" id="note-vertical"></div>

  <h2>座標平面で確かめよう</h2>
  <p>点 A, B をドラッグして動かしてみましょう。直線と方程式が自動で更新されます。</p>

  <div class="canvas-container">
    <canvas id="plane" width="700" height="560"></canvas>
  </div>
  <p class="hint">2点をドラッグして直線を変形できます</p>

  <div class="eq-display" id="live-eq"></div>
  <div class="info-box" id="info-box"></div>

  <h2>例題</h2>
  <div class="example-box">
    <div class="example-title">例題</div>
    <p id="ex-problem"></p>
  </div>

  <h2>解法ステップ</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev">← 戻る</button>
    <div class="step-counter">ステップ <span id="step-cur"></span> / <span id="step-tot"></span></div>
    <button class="btn primary" id="next">次へ →</button>
  </div>
</main>

<script>
  function tex(l, el, dm) { katex.render(l, el, { throwOnError: false, displayMode: !!dm }); }
  function T(l) { return katex.renderToString(l, { throwOnError: false }); }

  const C_RED = "#d9534f";
  const C_BLUE = "#2a6df4";
  const C_GREEN = "#28a745";
  const C_ORANGE = "#e67e22";

  const gXmin = -8, gXmax = 10, gYmin = -6, gYmax = 10;
  const canvas = document.getElementById('plane');
  const ctx2d = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;

  let ptA = { x: -3, y: 2 };
  let ptB = { x: 6, y: 8 };
  let dragging = null;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function toScreen(mx, my) {
    const cw = canvas.getBoundingClientRect().width;
    const ch = canvas.getBoundingClientRect().height;
    return [(mx - gXmin) / (gXmax - gXmin) * cw, (1 - (my - gYmin) / (gYmax - gYmin)) * ch];
  }
  function toMath(sx, sy) {
    const cw = canvas.getBoundingClientRect().width;
    const ch = canvas.getBoundingClientRect().height;
    return [sx / cw * (gXmax - gXmin) + gXmin, (1 - sy / ch) * (gYmax - gYmin) + gYmin];
  }

  function drawGrid() {
    const cw = canvas.getBoundingClientRect().width;
    const ch = canvas.getBoundingClientRect().height;
    const ctx = ctx2d;

    ctx.strokeStyle = '#eee';
    ctx.lineWidth = 1;
    for (let x = Math.ceil(gXmin); x <= Math.floor(gXmax); x++) {
      const [sx] = toScreen(x, 0);
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, ch); ctx.stroke();
    }
    for (let y = Math.ceil(gYmin); y <= Math.floor(gYmax); y++) {
      const [, sy] = toScreen(0, y);
      ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(cw, sy); ctx.stroke();
    }
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 1.5;
    const [ox, oy] = toScreen(0, 0);
    ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(cw, oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, ch); ctx.stroke();

    ctx.fillStyle = '#999';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (let x = Math.ceil(gXmin); x <= Math.floor(gXmax); x++) {
      if (x === 0) continue;
      const [sx] = toScreen(x, 0);
      ctx.fillText(x, sx, oy + 4);
    }
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let y = Math.ceil(gYmin); y <= Math.floor(gYmax); y++) {
      if (y === 0) continue;
      const [, sy] = toScreen(0, y);
      ctx.fillText(y, ox - 6, sy);
    }
    ctx.fillText('O', ox - 6, oy + 12);
  }

  function draw() {
    resizeCanvas();
    const cw = canvas.getBoundingClientRect().width;
    const ch = canvas.getBoundingClientRect().height;
    const ctx = ctx2d;
    ctx.clearRect(0, 0, cw, ch);
    drawGrid();

    const dx = ptB.x - ptA.x;
    const dy = ptB.y - ptA.y;
    const isVertical = Math.abs(dx) < 0.01;

    // Draw line through A and B extended
    ctx.strokeStyle = C_BLUE;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    if (isVertical) {
      const [sx1, sy1] = toScreen(ptA.x, gYmin);
      const [sx2, sy2] = toScreen(ptA.x, gYmax);
      ctx.moveTo(sx1, sy1);
      ctx.lineTo(sx2, sy2);
    } else {
      const m = dy / dx;
      const b = ptA.y - m * ptA.x;
      const yAtXmin = m * gXmin + b;
      const yAtXmax = m * gXmax + b;
      const [sx1, sy1] = toScreen(gXmin, yAtXmin);
      const [sx2, sy2] = toScreen(gXmax, yAtXmax);
      ctx.moveTo(sx1, sy1);
      ctx.lineTo(sx2, sy2);
    }
    ctx.stroke();

    // Slope triangle (when not vertical)
    if (!isVertical) {
      const m = dy / dx;
      const [asx, asy] = toScreen(ptA.x, ptA.y);
      const [bsx, bsy] = toScreen(ptB.x, ptA.y);
      const [csx, csy] = toScreen(ptB.x, ptB.y);

      ctx.strokeStyle = C_ORANGE + '70';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 3]);
      ctx.beginPath();
      ctx.moveTo(asx, asy);
      ctx.lineTo(bsx, bsy);
      ctx.lineTo(csx, csy);
      ctx.stroke();
      ctx.setLineDash([]);

      // Delta labels
      ctx.fillStyle = C_ORANGE;
      ctx.font = 'italic 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const fmtN = (v) => { const r = Math.round(v * 2) / 2; return Number.isInteger(r) ? r.toString() : r.toFixed(1); };
      ctx.fillText(`x₂−x₁ = ${fmtN(dx)}`, (asx + bsx) / 2, Math.max(asy, bsy) + 4);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(`y₂−y₁ = ${fmtN(dy)}`, bsx + 6, (bsy + csy) / 2);
      ctx.font = '12px sans-serif';
    }

    // Points
    function drawPt(p, label, color, ox, oy) {
      const [sx, sy] = toScreen(p.x, p.y);
      ctx.beginPath();
      ctx.arc(sx, sy, 8, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, sx + (ox || 0), sy + (oy || -16));
    }
    drawPt(ptA, 'A', C_RED, -14, -10);
    drawPt(ptB, 'B', C_GREEN, 14, -10);

    requestAnimationFrame(draw);
  }

  // GCD for fraction display
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
  function toFrac(num, den) {
    if (den === 0) return '\\text{undefined}';
    if (num === 0) return '0';
    const sign = (num < 0) !== (den < 0) ? '-' : '';
    const an = Math.abs(Math.round(num * 2) / 2);
    const ad = Math.abs(Math.round(den * 2) / 2);
    // Multiply to clear halves
    let n = Math.round(an * 2), d = Math.round(ad * 2);
    const g = gcd(n, d);
    n /= g; d /= g;
    if (d === 1) return sign + n;
    return sign + `\\frac{${n}}{${d}}`;
  }

  function fmtVal(v) {
    const r = Math.round(v * 2) / 2;
    return Number.isInteger(r) ? r.toString() : r.toFixed(1);
  }

  function updateEquation() {
    const dx = ptB.x - ptA.x;
    const dy = ptB.y - ptA.y;
    const isVertical = Math.abs(dx) < 0.01;

    const eqEl = document.getElementById('live-eq');
    const infoEl = document.getElementById('info-box');

    if (isVertical) {
      eqEl.innerHTML = T(`\\textcolor{${C_BLUE}}{x = ${fmtVal(ptA.x)}}`);
      infoEl.innerHTML =
        T(`\\mathrm{A}(${fmtVal(ptA.x)},\\, ${fmtVal(ptA.y)}),\\quad \\mathrm{B}(${fmtVal(ptB.x)},\\, ${fmtVal(ptB.y)})`) +
        '<br><span style="color:' + C_ORANGE + '; font-weight:600;">垂直な直線</span>（' +
        T(`x_1 = x_2`) + ' のため）';
    } else {
      const m = dy / dx;
      const b = ptA.y - m * ptA.x;
      const mFrac = toFrac(dy, dx);
      const bFrac = toFrac(b * 1, 1);

      // Point-slope form
      const y1s = fmtVal(ptA.y);
      const x1s = fmtVal(ptA.x);
      const y1part = ptA.y < 0 ? `+${fmtVal(-ptA.y)}` : ptA.y > 0 ? `-${y1s}` : '';
      const x1part = ptA.x > 0 ? `-${x1s}` : ptA.x < 0 ? `+${fmtVal(-ptA.x)}` : '';
      const pointSlope = `y ${y1part} = ${mFrac}(x ${x1part})`;

      // Simplified: compute b as fraction properly
      // b = y1 - m*x1, where m = dy/dx
      // b = (y1*dx - dy*x1) / dx
      const bNum = ptA.y * dx - dy * ptA.x;
      const bDen = dx;
      const bFracStr = toFrac(bNum, bDen);

      let simplified;
      if (Math.abs(b) < 0.01) {
        simplified = `y = ${mFrac}x`;
      } else if (b > 0) {
        simplified = `y = ${mFrac}x + ${bFracStr}`;
      } else {
        // Make positive version of b fraction
        const bPosFrac = toFrac(-bNum, bDen);
        simplified = `y = ${mFrac}x - ${bPosFrac}`;
      }

      eqEl.innerHTML = T(pointSlope) + '<br>' + T(`\\Longrightarrow \\quad \\textcolor{${C_BLUE}}{${simplified}}`);
      infoEl.innerHTML =
        T(`\\mathrm{A}(${fmtVal(ptA.x)},\\, ${fmtVal(ptA.y)}),\\quad \\mathrm{B}(${fmtVal(ptB.x)},\\, ${fmtVal(ptB.y)})`) + '<br>' +
        '傾き: ' + T(`m = \\dfrac{${fmtVal(dy)}}{${fmtVal(dx)}} = ${mFrac}`);
    }
  }

  // Pointer events
  function getPointerMath(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return toMath(cx, cy);
  }

  function findNearest(mx, my) {
    const dA = Math.hypot(ptA.x - mx, ptA.y - my);
    const dB = Math.hypot(ptB.x - mx, ptB.y - my);
    const cw = canvas.getBoundingClientRect().width;
    const threshold = (gXmax - gXmin) / cw * 30;
    if (dA < dB && dA < threshold) return 'A';
    if (dB < threshold) return 'B';
    return null;
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const [mx, my] = getPointerMath(e);
    dragging = findNearest(mx, my);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    e.preventDefault();
    const [mx, my] = getPointerMath(e);
    const snap = (v) => Math.round(v * 2) / 2;
    const target = dragging === 'A' ? ptA : ptB;
    target.x = Math.max(gXmin + 0.5, Math.min(gXmax - 0.5, snap(mx)));
    target.y = Math.max(gYmin + 0.5, Math.min(gYmax - 0.5, snap(my)));
    updateEquation();
    draw();
  });
  canvas.addEventListener('pointerup', () => { dragging = null; });
  canvas.addEventListener('pointercancel', () => { dragging = null; });

  /* --- Walkthrough --- */
  const steps = [
    {
      title: "2点を確認する",
      tex: `\\mathrm{A}(-3,\\, 2),\\quad \\mathrm{B}(6,\\, 8)`
    },
    {
      title: "傾きを求める",
      tex: `m = \\frac{y_2 - y_1}{x_2 - x_1} = \\frac{8 - 2}{6 - (-3)} = \\frac{6}{9} = \\frac{2}{3}`
    },
    {
      title: "点 A を通る直線の式をつくる",
      tex: `y - 2 = \\frac{2}{3}\\bigl(x - (-3)\\bigr)`
    },
    {
      title: "整理する",
      tex: `y - 2 = \\frac{2}{3}(x + 3)`
    },
    {
      title: "右辺を展開する",
      tex: `y - 2 = \\frac{2}{3}x + 2`
    },
    {
      title: "答え",
      tex: `\\textcolor{${C_BLUE}}{y = \\frac{2}{3}x + 4}`
    }
  ];

  let curStep = 0;

  function renderWalkthrough() {
    const root = document.getElementById('walkthrough');
    let html = '';
    for (let i = 0; i <= curStep; i++) {
      const s = steps[i];
      const isCurrent = i === curStep;
      html += `<div class="step ${isCurrent ? 'current' : ''}" style="animation-delay:${isCurrent ? '0.05s' : '0s'}">
        <div class="label">${s.title}</div>
        <div class="formula-line">${T(s.tex)}</div>
      </div>`;
    }
    root.innerHTML = html;
    document.getElementById('step-cur').textContent = curStep + 1;
    document.getElementById('step-tot').textContent = steps.length;
    document.getElementById('prev').disabled = curStep === 0;
    document.getElementById('next').disabled = curStep === steps.length - 1;
  }

  function init() {
    document.getElementById('formula1').innerHTML =
      T(`x_1 \\neq x_2 \\;\\text{のとき：}\\quad y - y_1 = \\dfrac{y_2 - y_1}{x_2 - x_1}(x - x_1)`);
    document.getElementById('note-vertical').innerHTML =
      T(`x_1 = x_2`) + ' のとき（垂直な直線）：' + T(`x = x_1`);

    document.getElementById('ex-problem').innerHTML =
      '2点 ' + T('\\mathrm{A}(-3,\\, 2),\\; \\mathrm{B}(6,\\, 8)') + ' を通る直線の方程式を求めよ。';

    document.getElementById('prev').addEventListener('click', () => {
      if (curStep > 0) { curStep--; renderWalkthrough(); }
    });
    document.getElementById('next').addEventListener('click', () => {
      if (curStep < steps.length - 1) { curStep++; renderWalkthrough(); }
    });

    resizeCanvas();
    updateEquation();
    draw();
    renderWalkthrough();
  }

  window.addEventListener('resize', () => {
    resizeCanvas();
    draw();
  });

  if (window.katex) init();
  else window.addEventListener("DOMContentLoaded", () => {
    if (window.katex) init();
    else {
      const w = setInterval(() => {
        if (window.katex) { clearInterval(w); init(); }
      }, 30);
    }
  });
</script>
</body>
</html>
