<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>中心と直線の距離による判定</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.35rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step {
    padding: .75rem .25rem; border-bottom: 1px dashed #eee;
    transition: background .2s ease; animation: fadeIn .3s ease;
  }
  .step:last-child { border-bottom: none; }
  .step.current {
    background: #f0f5ff; border-radius: 8px; padding: .75rem;
    margin: .25rem -.5rem; border-bottom: none;
  }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.1rem; }
  .step.current .formula-line .katex { font-size: 1.25rem; }

  .controls-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; margin: 1rem 0 0;
  }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .note {
    background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px;
    padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem;
  }
  .live-calc {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto;
  }
  .live-calc .katex { font-size: 1.2rem; }

  .slider-row {
    display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem;
  }
  .slider-row label { font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-width: 0; height: 36px; }
  .slider-row .val { font-weight: 600; min-width: 4.5rem; text-align: center; font-size: 1.05rem; }

  .status-badge {
    display: inline-block; padding: .35rem .8rem; border-radius: 8px;
    font-weight: 700; font-size: 1rem; margin: .25rem .25rem;
  }
  .status-badge.intersect { background: #d4edda; color: #155724; }
  .status-badge.tangent { background: #fff3cd; color: #856404; }
  .status-badge.none { background: #f8d7da; color: #721c24; }

  .compare-table {
    width: 100%; border-collapse: collapse; margin: .75rem 0;
    background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #e3e3e3;
  }
  .compare-table th, .compare-table td {
    padding: .6rem .8rem; text-align: center; border: 1px solid #eee;
  }
  .compare-table th { background: #f0f5ff; font-weight: 600; font-size: .9rem; }
  .compare-table td { font-size: .95rem; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .drag-hint {
    text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0;
  }
</style>
</head>
<body>
<main>
  <h1>中心と直線の距離による判定</h1>
  <p class="subtitle">円の中心から直線までの距離 <span id="sub-d"></span> と半径 <span id="sub-r"></span> を比較して、円と直線の位置関係を判定します。</p>

  <h2>判定法</h2>
  <p>円の中心 C から直線 <span id="lbl-l"></span> への距離 <span id="lbl-d"></span> と半径 <span id="lbl-r"></span> を比較します。</p>
  <table class="compare-table">
    <tr><th>条件</th><th>共有点</th><th>位置関係</th></tr>
    <tr><td id="cond1"></td><td>2個</td><td>2点で交わる</td></tr>
    <tr><td id="cond2"></td><td>1個</td><td>接する</td></tr>
    <tr><td id="cond3"></td><td>0個</td><td>共有点なし</td></tr>
  </table>

  <h2>例題の解法ウォークスルー</h2>
  <p>円 <span id="ex-circle"></span> と直線 <span id="ex-line"></span> が共有点をもつ条件を、中心と直線の距離を用いて求めよ。</p>
  <div class="walkthrough" id="wt-ex"></div>
  <div class="controls-row">
    <button class="btn" id="we-prev" disabled>← 前へ</button>
    <span class="step-counter" id="we-counter"></span>
    <button class="btn primary" id="we-next">次へ →</button>
  </div>

  <h2>動かして確かめよう</h2>
  <p>スライダーで <span id="slider-k-label"></span> を変えて、中心から直線までの距離 <span id="p-d"></span> と半径 <span id="p-r"></span> の関係を確認しましょう。</p>

  <div class="slider-row">
    <label><span id="lbl-k"></span> =</label>
    <input type="range" id="slider-k" min="-4" max="4" step="0.1" value="1">
    <span class="val" id="slider-k-val">1.0</span>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="live-calc" id="live-calc"></div>

  <div class="note">
    <strong>メリット：</strong>判別式を使う方法と比べて、中心と直線の距離を使う方法は、連立方程式を解く必要がなく、より直接的に位置関係を判定できます。
  </div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}
if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{if(window.katex)init();else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}});

let kVal = 1.0;

function init(){
  tex('l', document.getElementById('lbl-l'));
  tex('d', document.getElementById('lbl-d'));
  tex('r', document.getElementById('lbl-r'));
  document.getElementById('sub-d').innerHTML = T('d');
  document.getElementById('sub-r').innerHTML = T('r');
  document.getElementById('p-d').innerHTML = T('d');
  document.getElementById('p-r').innerHTML = T('r');
  tex('d < r', document.getElementById('cond1'));
  tex('d = r', document.getElementById('cond2'));
  tex('d > r', document.getElementById('cond3'));

  tex('x^2+y^2=1', document.getElementById('ex-circle'));
  tex('2x-y+k=0', document.getElementById('ex-line'));
  tex('k', document.getElementById('slider-k-label'));
  document.getElementById('lbl-k').innerHTML = T('k');

  initExample();
  drawGraph();

  const slider = document.getElementById('slider-k');
  slider.addEventListener('input', ()=>{
    kVal = parseFloat(slider.value);
    document.getElementById('slider-k-val').textContent = kVal.toFixed(1);
    drawGraph();
  });
}

function initExample(){
  const steps = [
    { label: 'Step 1: 円の情報を確認', formula: '\\text{中心}\\;C(0,\\,0),\\quad \\text{半径}\\;r = 1' },
    { label: 'Step 2: 直線を標準形に整理', formula: 'l:\\;2x - y + k = 0 \\quad (a=2,\\;b=-1,\\;c=k)' },
    { label: 'Step 3: 中心 C から直線 l への距離', formula: 'd = \\frac{|2 \\cdot 0 + (-1) \\cdot 0 + k|}{\\sqrt{2^2 + (-1)^2}} = \\frac{|k|}{\\sqrt{5}}' },
    { label: 'Step 4: 共有点をもつ条件', formula: 'd \\le r \\quad\\Leftrightarrow\\quad \\frac{|k|}{\\sqrt{5}} \\le 1' },
    { label: 'Step 5: k の範囲を求める', formula: '|k| \\le \\sqrt{5} \\quad\\Leftrightarrow\\quad -\\sqrt{5} \\le k \\le \\sqrt{5}' },
  ];

  let cur = 0;
  const container = document.getElementById('wt-ex');
  const counter = document.getElementById('we-counter');
  const prevBtn = document.getElementById('we-prev');
  const nextBtn = document.getElementById('we-next');

  function render(){
    let html = '';
    for(let i=0;i<=cur;i++){
      html += `<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML = html;
    counter.textContent = `${cur+1} / ${steps.length}`;
    prevBtn.disabled = cur===0;
    nextBtn.disabled = cur===steps.length-1;
  }

  prevBtn.addEventListener('click', ()=>{ if(cur>0){cur--;render();} });
  nextBtn.addEventListener('click', ()=>{ if(cur<steps.length-1){cur++;render();} });
  render();
}

function drawGraph(){
  const svg = document.getElementById('graph');
  const W = 600, H = 500, ox = 300, oy = 250, scale = 120;

  function px(x){ return ox + x*scale; }
  function py(y){ return oy - y*scale; }

  // Line: 2x - y + k = 0 => y = 2x + k
  const a=2, b=-1, c=kVal;
  const lineY = x => 2*x + kVal;

  // Distance from center (0,0) to line
  const d = Math.abs(c) / Math.sqrt(a*a + b*b); // |k|/sqrt(5)
  const r = 1;

  // Foot of perpendicular from (0,0) to line
  const denom = a*a + b*b; // 5
  const kk = -(a*0 + b*0 + c)/denom; // -k/5
  const hx = a*kk; // -2k/5 ... wait: 2*(-k/5) = -2k/5
  const hy = b*kk; // (-1)*(-k/5) = k/5

  // Status
  let status, lineColor, statusClass;
  const diff = d - r;
  if(Math.abs(diff) < 0.02){ status = '接する（d = r）'; lineColor = '#e67e22'; statusClass = 'tangent'; }
  else if(diff < 0){ status = '2点で交わる（d < r）'; lineColor = 'var(--c-green)'; statusClass = 'intersect'; }
  else { status = '共有点なし（d > r）'; lineColor = 'var(--c-red)'; statusClass = 'none'; }

  let html = '';

  // Grid
  for(let i=-2;i<=2;i++) html += `<line x1="${px(i)}" y1="10" x2="${px(i)}" y2="${H-10}" stroke="#eee"/>`;
  for(let j=-2;j<=2;j++) html += `<line x1="10" y1="${py(j)}" x2="${W-10}" y2="${py(j)}" stroke="#eee"/>`;

  // Axes
  html += `<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#999"/></marker></defs>`;
  html += `<line x1="10" y1="${oy}" x2="${W-10}" y2="${oy}" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>`;
  html += `<line x1="${ox}" y1="${H-10}" x2="${ox}" y2="10" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>`;
  html += `<foreignObject x="${W-26}" y="${oy-22}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('x')}</div></foreignObject>`;
  html += `<foreignObject x="${ox+6}" y="${Math.max(8,2)}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('y')}</div></foreignObject>`;
  html += `<text x="${ox+5}" y="${oy+18}" font-size="12" fill="#999">O</text>`;
  for(let i=-2;i<=2;i++){ if(i===0)continue; html += `<text x="${px(i)}" y="${oy+18}" text-anchor="middle" font-size="11" fill="#bbb">${i}</text>`; }
  for(let j=-2;j<=2;j++){ if(j===0)continue; html += `<text x="${ox-10}" y="${py(j)+4}" text-anchor="end" font-size="11" fill="#bbb">${j}</text>`; }

  // Circle x^2+y^2=1
  html += `<circle cx="${px(0)}" cy="${py(0)}" r="${scale}" fill="rgba(42,109,244,0.05)" stroke="var(--c-blue)" stroke-width="2.5"/>`;

  // Radius line (from center to circle edge, towards line foot direction)
  if(d > 0.01){
    const rx = hx/d * r;
    const ry = hy/d * r;
    html += `<line x1="${px(0)}" y1="${py(0)}" x2="${px(rx)}" y2="${py(ry)}" stroke="var(--c-blue)" stroke-width="2" stroke-dasharray="6,3"/>`;
    // r label
    const rmx = rx/2, rmy = ry/2;
    html += `<foreignObject x="${px(rmx)-20}" y="${py(rmy)-9}" width="60" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:var(--c-blue);font-weight:700">${T('r=1')}</div></foreignObject>`;
  } else {
    html += `<line x1="${px(0)}" y1="${py(0)}" x2="${px(1)}" y2="${py(0)}" stroke="var(--c-blue)" stroke-width="2" stroke-dasharray="6,3"/>`;
    html += `<foreignObject x="${px(0.5)}" y="${py(0)-22}" width="60" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:var(--c-blue);font-weight:700">${T('r=1')}</div></foreignObject>`;
  }

  // Line
  const xL = -2.5, xR = 2.5;
  html += `<line x1="${px(xL)}" y1="${py(lineY(xL))}" x2="${px(xR)}" y2="${py(lineY(xR))}" stroke="${lineColor}" stroke-width="2.5"/>`;
  html += `<foreignObject x="${px(xR)-5}" y="${py(lineY(xR))-28}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:${lineColor};font-weight:600">${T('\\ell')}</div></foreignObject>`;

  // Perpendicular from C to line
  html += `<line x1="${px(0)}" y1="${py(0)}" x2="${px(hx)}" y2="${py(hy)}" stroke="var(--c-orange)" stroke-width="2.5"/>`;

  // Right angle marker at H
  if(d > 0.05){
    const len = 0.12;
    const dx2 = -hx/d, dy2 = -hy/d;
    // along the line direction: perpendicular to (a,b) is (b,-a)/||(b,-a)|| = (-1,-2)/sqrt(5)
    const vx = -b/Math.sqrt(denom), vy = a/Math.sqrt(denom);
    const rax = hx + dx2*len, ray = hy + dy2*len;
    const rbx = hx + vx*len, rby = hy + vy*len;
    const rcx = rax + vx*len, rcy = ray + vy*len;
    html += `<polyline points="${px(rax)},${py(ray)} ${px(rcx)},${py(rcy)} ${px(rbx)},${py(rby)}" fill="none" stroke="var(--c-orange)" stroke-width="1.5"/>`;
  }

  // d label
  if(d > 0.05){
    const dmx = hx/2, dmy = hy/2;
    html += `<foreignObject x="${px(dmx)+12}" y="${py(dmy)-19}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:var(--c-orange);font-weight:700">${T('d')}</div></foreignObject>`;
  }

  // Foot H
  html += `<circle cx="${px(hx)}" cy="${py(hy)}" r="5" fill="var(--c-orange)" stroke="#fff" stroke-width="2"/>`;
  html += `<text x="${px(hx)+10}" y="${py(hy)+18}" font-size="12" font-weight="600" fill="var(--c-orange)">H</text>`;

  // Center C
  html += `<circle cx="${px(0)}" cy="${py(0)}" r="6" fill="var(--c-purple)" stroke="#fff" stroke-width="2"/>`;
  html += `<text x="${px(0)+10}" y="${py(0)-10}" font-size="14" font-weight="700" fill="var(--c-purple)">C</text>`;

  // Intersection points
  if(d <= r + 0.02){
    // Solve: circle x^2+y^2=1, line y=2x+k => 5x^2+4kx+k^2-1=0
    const disc = 4*kVal*kVal - 5*(kVal*kVal-1);
    if(disc >= 0){
      const sq = Math.sqrt(disc);
      const x1 = (-4*kVal/(2*5)) + sq/(2*5);
      const x2 = (-4*kVal/(2*5)) - sq/(2*5);
      // Actually: x = (-4k +/- 2*sqrt(disc))/(2*5) ... let me redo.
      // 5x^2+4kx+(k^2-1)=0 => x = (-4k +/- sqrt(16k^2-20(k^2-1))) / 10
      // D = 16k^2-20k^2+20 = -4k^2+20 = 4(5-k^2)
      const D2 = 4*(5-kVal*kVal);
      if(D2 >= 0){
        const sqD = Math.sqrt(D2);
        const ix1 = (-4*kVal + sqD) / 10;
        const ix2 = (-4*kVal - sqD) / 10;
        const iy1 = 2*ix1 + kVal;
        const iy2 = 2*ix2 + kVal;
        html += `<circle cx="${px(ix1)}" cy="${py(iy1)}" r="6" fill="${lineColor}" stroke="#fff" stroke-width="2"/>`;
        if(D2 > 0.1){
          html += `<circle cx="${px(ix2)}" cy="${py(iy2)}" r="6" fill="${lineColor}" stroke="#fff" stroke-width="2"/>`;
        }
      }
    }
  }

  svg.innerHTML = html;

  // Live calc
  const fmt = v => Math.abs(v-Math.round(v))<0.05 ? Math.round(v).toString() : v.toFixed(2);
  const statusHTML = `<span class="status-badge ${statusClass}">${status}</span>`;
  document.getElementById('live-calc').innerHTML =
    T(`k = ${fmt(kVal)}`) + '<br>' +
    T(`d = \\frac{|k|}{\\sqrt{5}} = \\frac{${fmt(Math.abs(kVal))}}{\\sqrt{5}} \\approx ${fmt(d)}`) + '<br>' +
    T(`r = 1`) + '<br>' +
    statusHTML;
}
</script>
</body>
</html>
