<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>曲線の外の点から引く接線</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0; }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; margin: .75rem 0; overflow: hidden; touch-action: none; position: relative; }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* draw() replaces the SVG contents, which would orphan a touch sequence that
     started on a child; keep hit-testing on the wrapper so the drag survives */
  .svg-container > svg { pointer-events: none; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto; }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; gap: .5rem; margin: .75rem 0; }
  .tab { appearance: none; flex: 1; border: 1px solid #d4dbeb; background: #fff; color: var(--accent); font-size: .95rem; font-weight: 600; padding: .7rem .5rem; border-radius: 10px; min-height: 48px; cursor: pointer; font-family: inherit; user-select: none; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }
  .live-calc > div { margin: .25rem 0; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row { display: flex; align-items: center; gap: 1rem; margin: .75rem 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; margin: .5rem 0; }

  .table-wrap { overflow-x: auto; margin: .75rem 0; }
  .compare-table { border-collapse: collapse; background: #fff; margin: 0 auto; font-size: .9rem; }
  .compare-table th, .compare-table td { border: 1px solid #e3e3e3; padding: .5rem .8rem; text-align: center; white-space: nowrap; }
  .compare-table .rowhead { background: #f4f7ff; font-weight: 600; }
  .compare-table .mark { background: #fff4e6; color: var(--c-orange); font-weight: 700; }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; justify-content: center; margin: .5rem 0 0; font-size: .88rem; }
  .legend > span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend > span > i { display: inline-block; width: 22px; height: 4px; border-radius: 2px; font-style: normal; }
  .legend > span > b { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>曲線の外の点から引く接線</h1>
  <p class="subtitle">接点を文字でおいて、接線が与えられた点を通る条件から接点を決める手順を確かめましょう。</p>

  <h2>基本の考え方</h2>
  <p>点 <span id="f-A"></span> が曲線の上に無いときは、<span id="f-A2"></span> は接点ではありません。そこで接点を <span id="f-P"></span> とおき、接線の式を <span id="f-a"></span> で表します。</p>
  <div class="formula-box" id="f-key"></div>
  <p>この直線が <span id="f-A3"></span> を通る、という条件を式にすると <span id="f-a2"></span> の方程式になります。それを解けば接点が決まります。解が 2 つ出ることもあり、そのときは接線も 2 本です。</p>

  <h2>解く問題</h2>
  <div class="formula-box" id="f-problem"></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <div class="tabs">
    <button class="tab active" id="tab1">例の曲線</button>
    <button class="tab" id="tab2">問題の曲線</button>
  </div>
  <p id="mode-desc"></p>

  <div class="slider-row">
    <label><span id="lbl-a"></span> =</label>
    <input type="range" id="a-slider" min="0" max="6" step="0.1" value="1">
    <span class="slider-val" id="a-value">1</span>
  </div>

  <div class="anim-btn-row">
    <button class="btn" id="btn-r1"></button>
    <button class="btn" id="btn-r2"></button>
    <button class="btn primary" id="anim-sweep">接点を動かす</button>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 560" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend" id="legend"></div>
  <p class="drag-hint">図を横にドラッグしても接点が動きます。</p>

  <div class="live-calc" id="live-calc"></div>
  <div class="note" id="note-box"></div>

  <h2>接点の候補をくらべる</h2>
  <div class="table-wrap"><table class="compare-table" id="val-table"></table></div>

  <h2>答え</h2>
  <div class="formula-box" id="result-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=560,mL=64,mR=28;
const PW=W-mL-mR;
const TT=20, TH=322;          /* top panel: the curve, the point A and the moving tangent */
const BT=392, BH=136;         /* bottom panel: the gap as a function of a */

const MODES={
  1:{ f:x=>x*x-3*x, fp:x=>2*x-3, ftex:'y=x^2-3x', fptex:"y'=2x-3",
      Ax:3, Ay:-4, Atex:'\\mathrm{A}(3,\\ -4)',
      XMIN:-1.5, XMAX:6.3, YMIN:-10, YMAX:18, yt:[-10,-5,0,5,10,15],
      aMin:0, aMax:6, roots:[1,5], YB0:-6, YB1:5, bt:[-4,0,4],
      tbl:[0,1,3,5] },
  2:{ f:x=>x*x+1, fp:x=>2*x, ftex:'y=x^2+1', fptex:"y'=2x",
      Ax:-1, Ay:-7, Atex:'\\mathrm{A}(-1,\\ -7)',
      XMIN:-4.6, XMAX:3.2, YMIN:-12, YMAX:21, yt:[-10,-5,0,5,10,15,20],
      aMin:-4.4, aMax:2.6, roots:[-4,2], YB0:-5, YB1:10, bt:[-4,0,4,8],
      tbl:[-4,-2,0,2] }
};
let mode=1, aVal=1, animId=null;
let XMIN=-1.5, XMAX=6.3, YMIN=-10, YMAX=18, YB0=-6, YB1=5;
function M(){ return MODES[mode]; }
function px(x){ return mL+(x-XMIN)/(XMAX-XMIN)*PW; }
function pyT(y){ return TT+TH-(y-YMIN)/(YMAX-YMIN)*TH; }
function pyB(y){ return BT+BH-(y-YB0)/(YB1-YB0)*BH; }
/* the tangent at (a, f(a)), read at x */
function tanAt(a,x){ const c=M(); return c.f(a)+c.fp(a)*(x-a); }
/* how far the tangent misses the point A: zero exactly when it passes through A */
function gap(a){ const c=M(); return tanAt(a,c.Ax)-c.Ay; }

function fmt(v){
  if(Math.abs(v)<5e-13) v=0;
  let s=v.toFixed(6);
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  if(s==='-0') s='0';
  return s;
}
function rel(v){ return Math.abs(parseFloat(v.toFixed(6))-v)<1e-11 ? '=' : '\\fallingdotseq'; }
function par(v){ return v<0 ? '('+fmt(v)+')' : fmt(v); }
function lineTex(m,c){
  const mt = Math.abs(m)<5e-13 ? '' : (Math.abs(m-1)<5e-13 ? 'x' : (Math.abs(m+1)<5e-13 ? '-x' : fmt(m)+'x'));
  const ct = Math.abs(c)<5e-13 ? '' : (c>0 ? '+'+fmt(c) : '-'+fmt(-c));
  return mt==='' ? fmt(c) : mt+ct;
}
function clipLine(m,x0,y0){
  const pts=[], yAt=x=>y0+m*(x-x0);
  [XMIN,XMAX].forEach(x=>{ const y=yAt(x); if(y>=YMIN-1e-9 && y<=YMAX+1e-9) pts.push({x:x,y:y}); });
  if(Math.abs(m)>1e-9){
    [YMIN,YMAX].forEach(y=>{ const x=x0+(y-y0)/m; if(x>=XMIN-1e-9 && x<=XMAX+1e-9) pts.push({x:x,y:y}); });
  }
  const u=[];
  for(const p of pts){ if(!u.some(q=>Math.abs(q.x-p.x)<1e-7 && Math.abs(q.y-p.y)<1e-7)) u.push(p); }
  return u.length>=2 ? [u[0],u[1]] : null;
}
function pathOf(g,py,lo,hi,x0,x1){
  let d='', pen=false;
  for(let i=0;i<=320;i++){
    const x=x0+(x1-x0)*i/320, y=g(x);
    if(y<lo||y>hi){ pen=false; continue; }
    d+=(pen?'L':'M')+` ${px(x).toFixed(2)} ${py(y).toFixed(2)}`;
    pen=true;
  }
  return d;
}

function init(){
  const spans={'f-A':'\\mathrm{A}','f-A2':'\\mathrm{A}','f-A3':'\\mathrm{A}',
               'f-P':'\\mathrm{P}(a,\\ f(a))','f-a':'a','f-a2':'a','lbl-a':'a'};
  for(const id in spans) document.getElementById(id).innerHTML=T(spans[id]);
  tex("y-f(a)=f'(a)(x-a)", document.getElementById('f-key'), true);
  tex('\\mathrm{A}(-1,\\ -7) \\text{ から } y=x^2+1 \\text{ に引いた接線}', document.getElementById('f-problem'), true);
  tex('y=-8x-15, \\qquad y=4x-3', document.getElementById('result-box'), true);

  initWalkthrough();
  setupTabs();
  setupSlider();
  setupAnim();
  setupDrag();
  applyMode();
}

function initWalkthrough(){
  const steps=[
    { label:'Step 1: 接点を文字でおく', formula:'\\mathrm{P}(a,\\ a^2+1)' },
    { label:'Step 2: 接線の傾きを a で表す', formula:"y'=2x \\quad \\text{より傾きは } 2a" },
    { label:'Step 3: 接線の方程式を a で表す（式 ①）', formula:'y-(a^2+1)=2a(x-a) \\quad \\text{すなわち} \\quad y=2ax-a^2+1' },
    { label:'Step 4: 式 ① が A を通る条件を書く', formula:'-7=2a\\cdot(-1)-a^2+1' },
    { label:'Step 5: a の方程式に整理する', formula:'a^2+2a-8=0' },
    { label:'Step 6: 因数分解して解く', formula:'(a+4)(a-2)=0 \\quad \\text{より} \\quad a=-4,\\ 2' },
    { label:'Step 7: a = -4 を式 ① に代入する', formula:'y=2\\cdot(-4)x-(-4)^2+1=-8x-15' },
    { label:'Step 8: a = 2 を式 ① に代入する', formula:'y=2\\cdot 2x-2^2+1=4x-3' },
    { label:'Step 9: 答え', formula:'y=-8x-15, \\qquad y=4x-3' }
  ];
  let cur=0;
  const container=document.getElementById('walkthrough'), counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=cur;i++){
      html+=`<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${cur+1} / ${steps.length}`;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{ if(cur>0){cur--;render();} });
  nextBtn.addEventListener('click',()=>{ if(cur<steps.length-1){cur++;render();} });
  render();
}

function draw(){
  const c=M(), a=aVal, fa=c.f(a), m=c.fp(a), tv=tanAt(a,c.Ax), g=gap(a);
  const hit=Math.abs(g)<1e-9;
  const HALO=' stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round"';
  const HALO2=' stroke="#fff" stroke-width="2.5" paint-order="stroke" stroke-linejoin="round"';
  const AXL='font-size:14px;color:#999;display:inline-block;background:#fff';
  let s='', ticks='';
  const alW=84, alX=Math.max(0, Math.min(W-alW, px(a)-alW/2));
  /* boxes the tick numbers must keep clear: the value of a, and the marks P and A */
  const leftEdge = px(a)-26<mL;
  /* near the top of the panel the usual slot for P would leave the viewBox, so park it below */
  const topEdge = pyT(fa)-30<TT;
  const pLab = topEdge ? {x:px(a)-14, y:pyT(fa)+24, anchor:'end', bx:px(a)-29, by:pyT(fa)+9}
             : leftEdge ? {x:px(a), y:pyT(fa)-18, anchor:'middle', bx:px(a)-10, by:pyT(fa)-33}
                        : {x:px(a)-14, y:pyT(fa)-12, anchor:'end', bx:px(a)-29, by:pyT(fa)-27};
  const boxes=[{x:alX, y:BT+BH+2, w:alW, h:24},
               {x:pLab.bx, y:pLab.by, w:23, h:17},
               {x:px(c.Ax)+6, y:pyT(c.Ay)-8, w:20, h:18},
               {x:mL+PW-26, y:pyT(0)+2, w:28, h:24},
               {x:mL+PW-26, y:pyB(0)+2, w:28, h:24},
               /* the moving marks: a tick number half-hidden under one is worse than none */
               {x:px(a)-11, y:pyT(fa)-11, w:22, h:22},
               {x:px(c.Ax)-11, y:pyT(tv)-11, w:22, h:22},
               {x:px(c.Ax)-9, y:pyT(c.Ay)-9, w:18, h:18},
               {x:px(a)-10, y:pyB(g)-10, w:20, h:20}];
  const clear=r=>!boxes.some(b=>r.x<b.x+b.w && b.x<r.x+r.w && r.y<b.y+b.h && b.y<r.y+r.h);

  /* ---- panel backgrounds and grids ---- */
  s+=`<rect x="${mL}" y="${TT}" width="${PW}" height="${TH}" fill="#fff" stroke="#e3e3e3"/>`;
  for(let k=Math.ceil(XMIN);k<=Math.floor(XMAX);k++)
    s+=`<line x1="${px(k)}" y1="${TT}" x2="${px(k)}" y2="${TT+TH}" stroke="${k===0?'#999':'#eee'}" stroke-width="${k===0?1.5:1}"/>`;
  c.yt.forEach(k=>{ s+=`<line x1="${mL}" y1="${pyT(k)}" x2="${mL+PW}" y2="${pyT(k)}" stroke="${k===0?'#999':'#eee'}" stroke-width="${k===0?1.5:1}"/>`; });
  s+=`<rect x="${mL}" y="${BT}" width="${PW}" height="${BH}" fill="#fff" stroke="#e3e3e3"/>`;
  for(let k=Math.ceil(XMIN);k<=Math.floor(XMAX);k++)
    s+=`<line x1="${px(k)}" y1="${BT}" x2="${px(k)}" y2="${BT+BH}" stroke="${k===0?'#999':'#eee'}" stroke-width="${k===0?1.5:1}"/>`;
  c.bt.forEach(k=>{ s+=`<line x1="${mL}" y1="${pyB(k)}" x2="${mL+PW}" y2="${pyB(k)}" stroke="${k===0?'#999':'#eee'}" stroke-width="${k===0?1.8:1}"/>`; });

  /* the connector ties the point of tangency to the gap it produces */
  s+=`<line x1="${px(a)}" y1="${pyT(fa)}" x2="${px(a)}" y2="${BT+BH}" stroke="#c9d3e8" stroke-width="1.5" stroke-dasharray="5 5"/>`;
  /* the column through A: the tangent is read here */
  s+=`<line x1="${px(c.Ax)}" y1="${TT}" x2="${px(c.Ax)}" y2="${TT+TH}" stroke="#bcd0f5" stroke-width="1.5" stroke-dasharray="4 4"/>`;

  /* ---- top panel ---- */
  s+=`<path d="${pathOf(c.f,pyT,YMIN,YMAX,XMIN,XMAX)}" fill="none" stroke="var(--c-purple)" stroke-width="2.5"/>`;
  const seg=clipLine(m,a,fa);
  if(seg) s+=`<line x1="${px(seg[0].x)}" y1="${pyT(seg[0].y)}" x2="${px(seg[1].x)}" y2="${pyT(seg[1].y)}" stroke="var(--c-orange)" stroke-width="3"/>`;
  /* the gap drawn as a bar on the column through A */
  if(!hit) s+=`<line x1="${px(c.Ax)}" y1="${pyT(c.Ay)}" x2="${px(c.Ax)}" y2="${pyT(tv)}" stroke="var(--c-red)" stroke-width="6" stroke-linecap="round" opacity="0.75"/>`;

  /* ---- bottom panel: the gap as a function of a ---- */
  s+=`<path d="${pathOf(gap,pyB,YB0,YB1,c.aMin,c.aMax)}" fill="none" stroke="var(--c-green)" stroke-width="3"/>`;

  /* tick numbers come after the curves so they are never buried */
  for(let k=Math.ceil(XMIN);k<=Math.floor(XMAX);k++){
    if(k===0) continue;
    if(clear({x:px(k)-6,y:pyT(0)+6,w:12,h:14}))
      ticks+=`<text x="${px(k)}" y="${pyT(0)+16}" text-anchor="middle" font-size="11" fill="#aaa"${HALO2}>${k}</text>`;
    if(clear({x:px(k)-6,y:pyB(0)+6,w:12,h:14}))
      ticks+=`<text x="${px(k)}" y="${pyB(0)+16}" text-anchor="middle" font-size="11" fill="#aaa"${HALO2}>${k}</text>`;
  }
  c.yt.forEach(k=>{ if(k!==0) ticks+=`<text x="${mL-8}" y="${pyT(k)+4}" text-anchor="end" font-size="11" fill="#aaa"${HALO2}>${k}</text>`; });
  c.bt.forEach(k=>{ if(k!==0) ticks+=`<text x="${mL-8}" y="${pyB(k)+4}" text-anchor="end" font-size="11" fill="#aaa"${HALO2}>${k}</text>`; });
  s+=ticks;

  /* ---- moving points ---- */
  /* the ring is drawn first so that, when it lands on A, the blue point stays visible inside it */
  s+=`<circle cx="${px(c.Ax)}" cy="${pyT(tv)}" r="9" fill="#fff" stroke="var(--c-orange)" stroke-width="3"/>`;
  s+=`<circle cx="${px(c.Ax)}" cy="${pyT(c.Ay)}" r="6.5" fill="var(--c-blue)" stroke="#fff" stroke-width="2"/>`;
  s+=`<text x="${px(c.Ax)+13}" y="${pyT(c.Ay)+6}" font-size="15" font-weight="700" fill="var(--c-blue)"${HALO}>A</text>`;
  s+=`<circle cx="${px(a)}" cy="${pyT(fa)}" r="9" fill="var(--c-red)" stroke="#fff" stroke-width="2.5"/>`;
  s+=`<text x="${pLab.x}" y="${pLab.y}" text-anchor="${pLab.anchor}" font-size="15" font-weight="700" fill="var(--c-red)"${HALO}>P</text>`;
  s+=`<circle cx="${px(a)}" cy="${pyB(g)}" r="8" fill="${hit?'var(--c-green)':'var(--c-orange)'}" stroke="#fff" stroke-width="2.5"/>`;
  if(hit) s+=`<circle cx="${px(a)}" cy="${pyB(g)}" r="8" fill="none" stroke="var(--c-green)" stroke-width="2" opacity="0.6"><animate attributeName="r" values="8;16;8" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="1.5s" repeatCount="indefinite"/></circle>`;

  /* ---- fixed labels ---- */
  s+=`<foreignObject x="${alX}" y="${BT+BH+2}" width="${alW}" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#e67e22;font-weight:700;text-align:center;white-space:nowrap"><span style="background:#fff;border-radius:4px;padding:0 2px">${T('a'+rel(a)+fmt(a))}</span></div></foreignObject>`;
  s+=`<foreignObject x="${mL+PW-24}" y="${pyT(0)+2}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${AXL}">${T('x')}</div></foreignObject>`;
  s+=`<foreignObject x="${px(0)+6}" y="${TT+2}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${AXL}">${T('y')}</div></foreignObject>`;
  s+=`<foreignObject x="${mL+PW-24}" y="${pyB(0)+2}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${AXL}">${T('a')}</div></foreignObject>`;
  s+=`<foreignObject x="${mL+6}" y="${BT+3}" width="76" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-green);font-weight:700;display:inline-block;background:#fff">${T('\\text{ずれ}')}</div></foreignObject>`;

  document.getElementById('graph').innerHTML=s;
  updateLive(a,fa,m,tv,g);
}

function updateLive(a,fa,m,tv,g){
  const c=M(), k=fa-m*a, hit=Math.abs(g)<1e-9;
  document.getElementById('live-calc').innerHTML=
    `<div style="color:var(--c-red)">${T('\\text{接点 }\\mathrm{P}('+fmt(a)+',\\ '+fmt(fa)+')')}</div>`+
    `<div style="color:var(--c-orange)">${T('y'+rel(k)+lineTex(m,k))}　接点 P での接線</div>`+
    `<div>${T('x='+fmt(c.Ax)+'\\ \\text{ での接線の高さ}'+rel(tv)+fmt(tv))}</div>`+
    `<div style="color:var(--c-green)">${T('\\text{ずれ}='+fmt(tv)+'-'+par(c.Ay)+rel(g)+fmt(g))}</div>`;

  const note=document.getElementById('note-box');
  if(hit){
    note.innerHTML='ずれが 0 になりました。この接線は点 A を通ります。'+
      (mode===2 ? '求める 2 本のうちの 1 本です。' : '例の答えの 1 本です。');
  } else if(g>0){
    note.innerHTML='接線は点 A より上を通っています。ずれが正なので、下の図の点はまだ横軸の上にあります。';
  } else {
    note.innerHTML='接線は点 A より下を通っています。ずれが負なので、下の図の点はまだ横軸の下にあります。';
  }
}

function buildTable(){
  const c=M();
  let r1='<tr><th class="rowhead">'+T('a')+'</th>';
  let r2='<tr><th class="rowhead">接線</th>';
  let r3='<tr><th class="rowhead">ずれ</th>';
  c.tbl.forEach(a=>{
    const m=c.fp(a), fa=c.f(a), k=fa-m*a, g=gap(a);
    const mk=(Math.abs(g)<1e-9)?' class="mark"':'';
    r1+='<td'+mk+'>'+T(fmt(a))+'</td>';
    r2+='<td'+mk+'>'+T('y='+lineTex(m,k))+'</td>';
    r3+='<td'+mk+'>'+T(fmt(g))+'</td>';
  });
  document.getElementById('val-table').innerHTML=r1+'</tr>'+r2+'</tr>'+r3+'</tr>';
}

function setA(v){
  const c=M();
  aVal=Math.round(Math.max(c.aMin,Math.min(c.aMax,v))*10)/10;
  document.getElementById('a-slider').value=aVal;
  document.getElementById('a-value').textContent=fmt(aVal);
}

function applyMode(){
  const c=M();
  XMIN=c.XMIN; XMAX=c.XMAX; YMIN=c.YMIN; YMAX=c.YMAX; YB0=c.YB0; YB1=c.YB1;
  document.getElementById('tab1').classList.toggle('active',mode===1);
  document.getElementById('tab2').classList.toggle('active',mode===2);
  const sl=document.getElementById('a-slider');
  sl.min=c.aMin; sl.max=c.aMax; sl.step='0.1';
  document.getElementById('mode-desc').innerHTML=
    (mode===1
      ? '曲線 '+T('y=x^2-3x')+' と点 '+T('\\mathrm{A}(3,\\ -4)')+' です。接点を動かして、接線が A を通る位置を探しましょう。'
      : '曲線 '+T('y=x^2+1')+' と点 '+T('\\mathrm{A}(-1,\\ -7)')+' です。ずれが 0 になる '+T('a')+' が 2 つ見つかります。');
  document.getElementById('legend').innerHTML=
    '<span><i style="background:var(--c-purple)"></i>'+T(c.ftex)+'</span>'+
    '<span><b style="background:var(--c-red)"></b>'+T('\\text{接点 }\\mathrm{P}(a,\\ f(a))')+'</span>'+
    '<span><b style="background:var(--c-blue)"></b>'+T(c.Atex)+'</span>'+
    '<span><i style="background:var(--c-orange)"></i>点 P での接線</span>'+
    '<span><i style="background:var(--c-red)"></i>A とのずれ</span>'+
    '<span><i style="background:var(--c-green)"></i>ずれのグラフ（下の図）</span>';
  document.getElementById('btn-r1').innerHTML=T('a='+fmt(c.roots[0]));
  document.getElementById('btn-r2').innerHTML=T('a='+fmt(c.roots[1]));
  buildTable();
  setA(c.roots[0]);
  draw();
}

function setupTabs(){
  document.getElementById('tab1').addEventListener('click',()=>{ stopAnim(); mode=1; applyMode(); });
  document.getElementById('tab2').addEventListener('click',()=>{ stopAnim(); mode=2; applyMode(); });
}
function setupSlider(){
  const sl=document.getElementById('a-slider');
  sl.addEventListener('input',()=>{ stopAnim(); setA(parseFloat(sl.value)); draw(); });
}
function stopAnim(){ if(animId){ cancelAnimationFrame(animId); animId=null; } }

function setupAnim(){
  document.getElementById('btn-r1').addEventListener('click',()=>{ stopAnim(); setA(M().roots[0]); draw(); });
  document.getElementById('btn-r2').addEventListener('click',()=>{ stopAnim(); setA(M().roots[1]); draw(); });
  document.getElementById('anim-sweep').addEventListener('click',()=>{
    stopAnim();
    const c=M();
    let t0=null; const duration=4600, from=c.aMin, to=c.aMax;
    setA(from); draw();
    function frame(ts){
      if(!t0) t0=ts;
      const pr=Math.min((ts-t0)/duration,1);
      const eased = pr<0.5 ? 2*pr*pr : 1-Math.pow(-2*pr+2,2)/2;
      setA(from+(to-from)*eased);
      draw();
      animId = pr<1 ? requestAnimationFrame(frame) : null;
    }
    animId=requestAnimationFrame(frame);
  });
}

function setupDrag(){
  const svg=document.getElementById('graph');
  const wrap=document.getElementById('svg-wrap');
  let dragging=false;

  function toSvg(cx,cy){
    const rect=svg.getBoundingClientRect();
    return { x:(cx-rect.left)/rect.width*W, y:(cy-rect.top)/rect.height*H };
  }
  function valueAt(pt){ return XMIN+(pt.x-mL)/PW*(XMAX-XMIN); }
  function inArea(pt){ return pt.x>mL-24 && pt.x<mL+PW+24 && pt.y>TT-12 && pt.y<BT+BH+12; }
  function startDrag(cx,cy){
    const pt=toSvg(cx,cy);
    if(!inArea(pt)) return;
    stopAnim(); dragging=true;
    setA(valueAt(pt)); draw();
  }
  function moveDrag(cx,cy){ if(dragging){ setA(valueAt(toSvg(cx,cy))); draw(); } }
  function endDrag(){ dragging=false; }

  wrap.addEventListener('mousedown', e => { e.preventDefault(); startDrag(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { if(dragging){ e.preventDefault(); moveDrag(e.clientX, e.clientY); } });
  window.addEventListener('mouseup', endDrag);

  wrap.addEventListener('touchstart', e => { const t=e.touches[0]; startDrag(t.clientX, t.clientY); }, {passive:true});
  wrap.addEventListener('touchmove', e => { if(dragging){ e.preventDefault(); const t=e.touches[0]; moveDrag(t.clientX, t.clientY); } }, {passive:false});
  wrap.addEventListener('touchend', endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
