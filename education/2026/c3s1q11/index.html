<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>正接から求める三角関数の値</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; gap: .5rem; margin: .75rem 0 .5rem; }
  .tab {
    flex: 1; appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: .95rem; font-weight: 600; padding: .7rem .5rem;
    border-radius: 10px; cursor: pointer; min-height: 48px; font-family: inherit;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row {
    display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem;
  }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 4rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .75rem; flex-wrap: wrap; margin: .5rem 0; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>正接から求める三角関数の値</h1>
  <p class="subtitle">正接の値と象限から、正弦と余弦の値を求めましょう。</p>

  <h2>基本の考え方</h2>
  <p>単位円と直線 <span id="f-lx"></span> を考えると、原点を通る直線が <span id="f-lx2"></span> と交わる点の高さがちょうど <span id="f-tan"></span> です。</p>
  <div class="formula-box" id="f-rel"></div>
  <p>直角をはさむ2辺が <span id="f-leg"></span> の直角三角形の斜辺は <span id="f-hyp"></span> になります。これが <span id="f-inv"></span> の正体です。</p>

  <h2>動かして確かめよう</h2>
  <p class="drag-hint">スライダーを動かすか、円の上を直接タップ・ドラッグできます</p>

  <div class="slider-row">
    <label><span id="lbl-t"></span> =</label>
    <input type="range" id="t-slider" min="-2.6" max="2.6" step="0.05" value="1.2">
    <span class="slider-val" id="t-value">1.20</span>
  </div>

  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">アニメーション</button>
    <button class="btn" id="flip-btn">もう一方の解</button>
    <button class="btn" id="goal-btn">問の値に合わせる</button>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 560" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="live-calc" id="live-calc"></div>
  <div class="note" id="note-quad"></div>

  <h2>解法ウォークスルー</h2>
  <div class="tabs">
    <button class="tab active" id="tab-q">問の解法</button>
    <button class="tab" id="tab-d">公式の導き方</button>
  </div>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <div class="formula-box" id="result-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=560,cx=210,cy=270,R=100,TMAX=2.6;
const TAU=Math.PI*2;

let tv=1.2;
let branch=1;
let animId=null;

function sx(x){return cx+x*R;}
function sy(y){return cy-y*R;}
function angleOf(){
  let a=branch>0?Math.atan2(tv,1):Math.atan2(-tv,-1);
  if(a<0)a+=TAU;
  return a;
}
function quadrant(t){
  if(Math.abs(Math.sin(t))<1e-3||Math.abs(Math.cos(t))<1e-3) return 0;
  const q=Math.floor(t/(Math.PI/2))+1;return Math.min(4,Math.max(1,q));
}
function qText(q){return q>0?'\\text{第 '+q+' 象限}':'\\text{座標軸上}';}
function arcPath(r,a0,a1){
  const x0=(cx+r*Math.cos(a0)).toFixed(2), y0=(cy-r*Math.sin(a0)).toFixed(2);
  const x1=(cx+r*Math.cos(a1)).toFixed(2), y1=(cy-r*Math.sin(a1)).toFixed(2);
  const large=(a1-a0)>Math.PI?1:0;
  return `M ${x0} ${y0} A ${r} ${r} 0 ${large} 0 ${x1} ${y1}`;
}

function init(){
  document.getElementById('f-lx').innerHTML=T('x=1');
  document.getElementById('f-lx2').innerHTML=T('x=1');
  document.getElementById('f-tan').innerHTML=T('\\tan\\theta');
  document.getElementById('f-leg').innerHTML=T('1\\;\\text{と}\\;|\\tan\\theta|');
  document.getElementById('f-hyp').innerHTML=T('\\sqrt{1+\\tan^2\\theta}');
  document.getElementById('f-inv').innerHTML=T('\\dfrac{1}{|\\cos\\theta|}');
  document.getElementById('lbl-t').innerHTML=T('\\tan\\theta');

  tex('1+\\tan^2\\theta=\\dfrac{1}{\\cos^2\\theta},\\qquad \\sin\\theta=\\tan\\theta\\cdot\\cos\\theta',document.getElementById('f-rel'),true);
  tex('\\sin\\theta=\\dfrac{2\\sqrt{5}}{5},\\qquad \\cos\\theta=-\\dfrac{\\sqrt{5}}{5}',document.getElementById('result-box'),true);

  initWalkthrough();
  setupSlider();
  setupButtons();
  setupDrag();
  draw();
}

const stepsQ=[
  {label:'Step 1: 条件を確認する',formula:'\\theta\\;\\text{は第 2 象限の角},\\qquad \\tan\\theta=-2'},
  {label:'Step 2: 使う関係',formula:'1+\\tan^2\\theta=\\dfrac{1}{\\cos^2\\theta}'},
  {label:'Step 3: 値を代入する',formula:'1+(-2)^2=\\dfrac{1}{\\cos^2\\theta}\\quad\\Longrightarrow\\quad \\dfrac{1}{\\cos^2\\theta}=5'},
  {label:'Step 4: cos の2乗を求める',formula:'\\cos^2\\theta=\\dfrac{1}{5}'},
  {label:'Step 5: 象限から符号を決める',formula:'\\text{第 2 象限では }x<0\\;\\text{だから}\\;\\cos\\theta<0'},
  {label:'Step 6: cos の値',formula:'\\cos\\theta=-\\sqrt{\\dfrac{1}{5}}=-\\dfrac{1}{\\sqrt{5}}=-\\dfrac{\\sqrt{5}}{5}'},
  {label:'Step 7: sin を求める',formula:'\\tan\\theta=\\dfrac{\\sin\\theta}{\\cos\\theta}\\;\\Longrightarrow\\;\\sin\\theta=\\tan\\theta\\cdot\\cos\\theta'},
  {label:'Step 8: sin の値',formula:'\\sin\\theta=(-2)\\times\\left(-\\dfrac{\\sqrt{5}}{5}\\right)=\\dfrac{2\\sqrt{5}}{5}'},
  {label:'Step 9: 検算する',formula:'\\sin^2\\theta+\\cos^2\\theta=\\dfrac{4}{5}+\\dfrac{1}{5}=1\\;\\checkmark'},
  {label:'Step 10: 答え',formula:'\\sin\\theta=\\dfrac{2\\sqrt{5}}{5},\\qquad \\cos\\theta=-\\dfrac{\\sqrt{5}}{5}'}
];
const stepsD=[
  {label:'Step 1: 出発点',formula:'\\sin^2\\theta+\\cos^2\\theta=1'},
  {label:'Step 2: 両辺を割る',formula:'\\text{両辺を}\\;\\cos^2\\theta\\;\\text{で割る}\\quad(\\cos\\theta\\neq 0)'},
  {label:'Step 3: 割った形',formula:'\\dfrac{\\sin^2\\theta}{\\cos^2\\theta}+\\dfrac{\\cos^2\\theta}{\\cos^2\\theta}=\\dfrac{1}{\\cos^2\\theta}'},
  {label:'Step 4: tan の定義でまとめる',formula:'\\tan^2\\theta+1=\\dfrac{1}{\\cos^2\\theta}'},
  {label:'Step 5: 図で見ると',formula:'\\text{斜辺}\\;\\sqrt{1+\\tan^2\\theta}=\\dfrac{1}{|\\cos\\theta|}\\;\\text{と同じこと}'}
];

function initWalkthrough(){
  let steps=stepsQ, cur=0;
  const container=document.getElementById('walkthrough');
  const counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev');
  const nextBtn=document.getElementById('next');
  const tabQ=document.getElementById('tab-q');
  const tabD=document.getElementById('tab-d');

  function render(){
    let html='';
    for(let i=0;i<=cur;i++){
      html+=`<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${cur+1} / ${steps.length}`;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{if(cur>0){cur--;render();}});
  nextBtn.addEventListener('click',()=>{if(cur<steps.length-1){cur++;render();}});
  tabQ.addEventListener('click',()=>{steps=stepsQ;cur=0;tabQ.classList.add('active');tabD.classList.remove('active');render();});
  tabD.addEventListener('click',()=>{steps=stepsD;cur=0;tabD.classList.add('active');tabQ.classList.remove('active');render();});
  render();
}

function draw(){
  const svg=document.getElementById('graph');
  const th=angleOf(), c=Math.cos(th), s=Math.sin(th), q=quadrant(th);
  let g='';

  if(q>0) g+=`<path d="${arcPath(R,(q-1)*Math.PI/2,q*Math.PI/2)} L ${cx} ${cy} Z" fill="rgba(230,126,34,0.10)" stroke="none"/>`;
  g+=`<line x1="${cx-R-50}" y1="${cy}" x2="${W-10}" y2="${cy}" stroke="#999" stroke-width="1.5"/>`;
  g+=`<line x1="${cx}" y1="10" x2="${cx}" y2="${H-10}" stroke="#999" stroke-width="1.5"/>`;
  g+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#c8d4ee" stroke-width="2"/>`;
  g+=`<text x="${cx-10}" y="${cy+18}" font-size="13" fill="#999">O</text>`;
  g+=`<text x="${sx(-1)}" y="${cy+18}" text-anchor="middle" font-size="11" fill="#aaa">-1</text>`;
  g+=`<text x="${cx-10}" y="${sy(1)+4}" text-anchor="end" font-size="11" fill="#aaa">1</text>`;
  g+=`<text x="${cx-10}" y="${sy(-1)+4}" text-anchor="end" font-size="11" fill="#aaa">-1</text>`;
  g+=`<foreignObject x="${W-30}" y="${cy-24}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999;display:inline-block">${T('x')}</div></foreignObject>`;
  g+=`<foreignObject x="${cx+8}" y="6" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999;display:inline-block">${T('y')}</div></foreignObject>`;

  g+=`<line x1="${sx(1)}" y1="12" x2="${sx(1)}" y2="${H-12}" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 5"/>`;
  g+=`<foreignObject x="${sx(1)-52}" y="16" width="60" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#999;white-space:nowrap;display:inline-block">${T('x=1')}</div></foreignObject>`;

  const ty=sy(tv);
  g+=`<path d="M ${cx} ${cy} L ${sx(1)} ${cy} L ${sx(1)} ${ty} Z" fill="rgba(42,109,244,0.10)" stroke="none"/>`;
  const rm=11, my=cy-(tv>=0?rm:-rm);
  g+=`<path d="M ${sx(1)} ${my} L ${sx(1)-rm} ${my} L ${sx(1)-rm} ${cy}" fill="none" stroke="#bbb" stroke-width="1.2"/>`;

  g+=`<line x1="${cx}" y1="${cy}" x2="${sx(1)}" y2="${cy}" stroke="var(--c-green)" stroke-width="5" stroke-linecap="round"/>`;
  g+=`<text x="${(cx+sx(1))/2}" y="${cy+(tv>=0?22:-12)}" text-anchor="middle" font-size="13" fill="var(--c-green)" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">1</text>`;
  g+=`<line x1="${sx(1)}" y1="${cy}" x2="${sx(1)}" y2="${ty}" stroke="var(--c-red)" stroke-width="6" stroke-linecap="round"/>`;
  if(Math.abs(tv)*R>44){
    g+=`<foreignObject x="${sx(1)+10}" y="${((cy+ty)/2-16).toFixed(1)}" width="86" height="32"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:var(--c-red);font-weight:700;white-space:nowrap;display:inline-block;background:rgba(255,255,255,0.88);border-radius:5px;padding:0 3px">${T('\\tan\\theta')}</div></foreignObject>`;
  }

  const far=1.8;
  g+=`<line x1="${sx(-far*c)}" y1="${sy(-far*s)}" x2="${sx(far*c)}" y2="${sy(far*s)}" stroke="#d8dff0" stroke-width="1.5"/>`;
  g+=`<line x1="${cx}" y1="${cy}" x2="${sx(1)}" y2="${ty}" stroke="var(--c-blue)" stroke-width="2.5"/>`;

  g+=`<circle cx="${sx(1)}" cy="${ty}" r="7" fill="var(--c-red)" stroke="#fff" stroke-width="2.5"/>`;
  g+=`<foreignObject x="${sx(1)+10}" y="${Math.max(4,Math.min(ty+(tv>=0?-32:6),H-34)).toFixed(1)}" width="34" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px;color:var(--c-red);font-weight:700;white-space:nowrap;display:inline-block">${T('\\mathrm{T}')}</div></foreignObject>`;

  const ox2=sx(-c), oy2=sy(-s);
  g+=`<circle cx="${ox2}" cy="${oy2}" r="6" fill="#bbb" stroke="#fff" stroke-width="2"/>`;

  g+=`<line x1="${sx(c)}" y1="${sy(s)}" x2="${sx(c)}" y2="${cy}" stroke="var(--c-purple)" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  g+=`<line x1="${sx(c)}" y1="${sy(s)}" x2="${cx}" y2="${sy(s)}" stroke="var(--c-purple)" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  g+=`<circle cx="${sx(c)}" cy="${sy(s)}" r="8" fill="var(--c-purple)" stroke="#fff" stroke-width="2.5"/>`;
  g+=`<circle cx="${sx(c)}" cy="${sy(s)}" r="8" fill="none" stroke="var(--c-purple)" stroke-width="2.5" opacity="0.6"><animate attributeName="r" values="8;16;8" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="1.6s" repeatCount="indefinite"/></circle>`;
  const plx=Math.max(2,Math.min(cx+(R+28)*c-8, sx(1)-22)), ply=cy-(R+28)*s-14;
  g+=`<foreignObject x="${plx.toFixed(1)}" y="${ply.toFixed(1)}" width="34" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px;color:var(--c-purple);font-weight:700;display:inline-block;background:rgba(255,255,255,0.88);border-radius:5px;padding:0 3px">${T('\\mathrm{P}')}</div></foreignObject>`;
  const LGX=W-236;
  g+=`<foreignObject x="${LGX}" y="8" width="228" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-red);font-weight:600;white-space:nowrap;display:inline-block">${T('\\mathrm{T}(1,\\;\\tan\\theta)')}</div></foreignObject>`;
  g+=`<foreignObject x="${LGX}" y="38" width="228" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-purple);font-weight:600;white-space:nowrap;display:inline-block">${T('\\mathrm{P}(\\cos\\theta,\\;\\sin\\theta)')}</div></foreignObject>`;
  g+=`<foreignObject x="${LGX}" y="68" width="228" height="32"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-blue);font-weight:600;white-space:nowrap;display:inline-block">${T('\\mathrm{OT}=\\sqrt{1+\\tan^2\\theta}')}</div></foreignObject>`;
  g+=`<circle cx="${LGX+7}" cy="${118}" r="6" fill="#bbb" stroke="#fff" stroke-width="2"/>`;
  g+=`<foreignObject x="${LGX+18}" y="104" width="210" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#999;white-space:nowrap;display:inline-block">${T('\\text{もう一方の解}')}</div></foreignObject>`;

  g+=`<path d="${arcPath(34,0,th)}" fill="none" stroke="var(--c-orange)" stroke-width="2.5"/>`;
  const la=th/2;
  g+=`<foreignObject x="${cx+50*Math.cos(la)-13}" y="${cy-50*Math.sin(la)-14}" width="30" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px;color:var(--c-orange);font-weight:600;display:inline-block">${T('\\theta')}</div></foreignObject>`;
  g+=`<foreignObject x="12" y="12" width="150" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px;color:var(--c-orange);font-weight:700;white-space:nowrap;display:inline-block">${T(qText(q))}</div></foreignObject>`;

  svg.innerHTML=g;
  updateInfo(th,c,s,q);
}

function updateInfo(th,c,s,q){
  const f=v=>(v>=0?'\\;\\;':'')+v.toFixed(3);
  document.getElementById('live-calc').innerHTML=
    T('\\theta='+(th*180/Math.PI).toFixed(1)+'^\\circ')+' &nbsp; '+
    `<span style="color:var(--c-red)">${T('\\tan\\theta='+f(tv))}</span> &nbsp; `+
    `<span style="color:var(--c-purple)">${T('\\sin\\theta='+f(s))}</span> &nbsp; `+
    `<span style="color:var(--c-purple)">${T('\\cos\\theta='+f(c))}</span><br>`+
    T('1+\\tan^2\\theta='+(1+tv*tv).toFixed(3))+' &nbsp;=&nbsp; '+T('\\dfrac{1}{\\cos^2\\theta}='+(1/(c*c)).toFixed(3));

  const hit=Math.abs(tv+2)<0.03&&q===2;
  document.getElementById('note-quad').innerHTML=hit
    ? '<strong style="color:var(--c-purple)">問の状態です。</strong>'+T('\\tan\\theta=-2')+' で第 2 象限なので '+T('\\cos\\theta=-\\dfrac{\\sqrt{5}}{5}')+'、'+T('\\sin\\theta=\\dfrac{2\\sqrt{5}}{5}')+' と決まります。'
    : '<strong>正接の値が同じ角は2つあります。</strong>'+(q>0?'いま選んでいるのは第 '+q+' 象限の解です。':'いまは座標軸上の角です。')+'「もう一方の解」で切り替えると、正弦と余弦の符号だけが入れかわることを確かめられます。';
}

function setSlider(){
  document.getElementById('t-slider').value=tv;
  document.getElementById('t-value').textContent=tv.toFixed(2);
}

function setupSlider(){
  const sl=document.getElementById('t-slider');
  sl.addEventListener('input',()=>{
    stopAnim();
    tv=parseFloat(sl.value);
    document.getElementById('t-value').textContent=tv.toFixed(2);
    draw();
  });
  setSlider();
}

function stopAnim(){ if(animId){cancelAnimationFrame(animId);animId=null;} }

function runTo(from,to,dur){
  stopAnim();
  let st=null;
  function step(ts){
    if(!st)st=ts;
    const p=Math.min((ts-st)/dur,1);
    const e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    tv=from+(to-from)*e;
    setSlider(); draw();
    if(p<1) animId=requestAnimationFrame(step); else animId=null;
  }
  animId=requestAnimationFrame(step);
}

function setupButtons(){
  document.getElementById('anim-btn').addEventListener('click',()=>{ runTo(-TMAX,TMAX,5000); });
  document.getElementById('flip-btn').addEventListener('click',()=>{ stopAnim(); branch=-branch; draw(); });
  document.getElementById('goal-btn').addEventListener('click',()=>{ branch=-1; runTo(tv,-2,1400); });
}

function setupDrag(){
  const svg=document.getElementById('graph');
  const wrap=document.getElementById('svg-wrap');
  let dragging=false;
  function apply(clx,cly){
    const rect=svg.getBoundingClientRect();
    const X=(clx-rect.left)/rect.width*W, Y=(cly-rect.top)/rect.height*H;
    if(Math.hypot(X-cx,cy-Y)<18) return;
    const a=Math.atan2(cy-Y,X-cx);
    const ca=Math.cos(a);
    if(Math.abs(ca)<1e-6) return;
    branch=ca>=0?1:-1;
    tv=Math.max(-TMAX,Math.min(TMAX,Math.sin(a)/ca));
    setSlider(); draw();
  }
  function startDrag(x,y){ stopAnim(); dragging=true; apply(x,y); }
  function moveDrag(x,y){ if(dragging) apply(x,y); }
  function endDrag(){ dragging=false; }

  wrap.addEventListener('mousedown',e=>{e.preventDefault();startDrag(e.clientX,e.clientY);});
  window.addEventListener('mousemove',e=>{if(dragging){e.preventDefault();moveDrag(e.clientX,e.clientY);}});
  window.addEventListener('mouseup',endDrag);
  wrap.addEventListener('touchstart',e=>{const t=e.touches[0];startDrag(t.clientX,t.clientY);},{passive:true});
  wrap.addEventListener('touchmove',e=>{if(dragging){e.preventDefault();const t=e.touches[0];moveDrag(t.clientX,t.clientY);}},{passive:false});
  wrap.addEventListener('touchend',endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
