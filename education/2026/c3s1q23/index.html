<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>単位円と三角方程式</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }
  .formula-box { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0; }
  .formula-box .katex { font-size: 1.2rem; }
  .svg-container { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; margin: .75rem 0; overflow: hidden; touch-action: none; position: relative; }
  .svg-container svg { display: block; width: 100%; height: auto; }
  .walkthrough { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto; }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }
  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff; color: var(--accent);
    font-size: 1rem; font-weight: 600; padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }
  .tabs { display: flex; gap: .5rem; margin: .75rem 0; flex-wrap: wrap; }
  .tab {
    appearance: none; border: 1px solid #d4dbeb; background: #fff; color: var(--accent);
    font-size: .95rem; font-weight: 600; padding: .6rem 1rem; border-radius: 999px; cursor: pointer;
    min-height: 44px; min-width: 84px; font-family: inherit; user-select: none;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }
  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .note.hit { background: #eaf7ee; border-color: #b7e2c4; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.05rem; }
  .answer-box { background: #fff; border: 2px solid var(--accent); border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .answer-box .katex { font-size: 1.1rem; }
  .slider-row { display: flex; align-items: center; gap: 1rem; margin: .75rem 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.05rem; font-weight: 700; color: var(--accent); min-width: 5rem; text-align: center; }
  .anim-btn-row { display: flex; justify-content: center; margin: .5rem 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; font-size: .85rem; margin: .5rem 0 0; color: var(--muted); }
  .legend .sw { display: inline-block; width: 24px; border-top: 3px solid; vertical-align: middle; margin-right: .35rem; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>単位円と三角方程式</h1>
  <p class="subtitle">単位円の上で解を読み取り、一般角の形にまとめる手順を身につけましょう。</p>

  <h2>基本の考え方</h2>
  <p>単位円周上で、始線から測った角が <span id="f-th"></span> の位置にある点を <span id="f-p"></span> とすると、その座標は次のようになります。</p>
  <div class="formula-box" id="f-key"></div>
  <div class="note" id="f-note"></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <p>方程式をタップして選び、スライダーをドラッグして動径を回しましょう。図の青い点 <span id="f-q"></span> は直接ドラッグしても動かせます。</p>
  <div class="tabs" id="preset-tabs">
    <button class="tab active" id="pre0"></button>
    <button class="tab" id="pre1">(1)</button>
    <button class="tab" id="pre2">(2)</button>
  </div>
  <div class="tabs" id="type-tabs">
    <button class="tab active" id="ty-sin"></button>
    <button class="tab" id="ty-cos"></button>
  </div>
  <div class="slider-row">
    <label><span id="lbl-k"></span> =</label>
    <input type="range" id="k-slider" min="-4" max="4" step="1" value="3">
    <span class="slider-val" id="k-value"></span>
  </div>
  <div class="slider-row">
    <label><span id="lbl-t"></span> =</label>
    <input type="range" id="t-slider" min="-24" max="48" step="1" value="0">
    <span class="slider-val" id="t-value"></span>
  </div>
  <div class="anim-btn-row"><button class="btn primary" id="anim-btn">動径を回す</button></div>
  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 620" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend">
    <span><span class="sw" style="border-color:var(--c-green)"></span><span id="lg0"></span></span>
    <span><span class="sw" style="border-color:var(--c-orange)"></span><span id="lg1"></span></span>
    <span><span class="sw" style="border-color:var(--c-blue)"></span><span id="lg2"></span></span>
  </div>
  <div class="live-calc" id="live-calc"></div>
  <div class="note" id="hit-note"></div>

  <h2>一般角での答え</h2>
  <div class="answer-box" id="answer"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}
const _tc=new Map();
function TC(l){if(_tc.has(l))return _tc.get(l);const s=T(l);_tc.set(l,s);return s;}

const PI=Math.PI, TAU=2*PI;
const W=600,H=620;
const CX=300,CY=175,R=125;
const TMIN=-TAU,TMAX=2*TAU;
const GX0=55,GX1=575,GXS=(GX1-GX0)/(TMAX-TMIN),GOX=GX0-TMIN*GXS,GOY=470,GYS=70;
function gx(t){return GOX+t*GXS;}
function gy(v){return GOY-v*GYS;}
function ux(x){return CX+x*R;}
function uy(y){return CY-y*R;}

/* k はスナップ表の添字 -4..4 で持ち、theta は tn*pi/12 で持つ */
const KTBL=[
  {v:-1,tex:'-1'},{v:-Math.sqrt(3)/2,tex:'-\\dfrac{\\sqrt{3}}{2}'},
  {v:-Math.SQRT1_2,tex:'-\\dfrac{\\sqrt{2}}{2}'},{v:-0.5,tex:'-\\dfrac{1}{2}'},
  {v:0,tex:'0'},{v:0.5,tex:'\\dfrac{1}{2}'},
  {v:Math.SQRT1_2,tex:'\\dfrac{\\sqrt{2}}{2}'},{v:Math.sqrt(3)/2,tex:'\\dfrac{\\sqrt{3}}{2}'},
  {v:1,tex:'1'}
];
let TYPE='sin', ki=-1, tn=0, animId=null, STATIC='', GLABELS='';

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}
function fracPi(n,d){
  if(n===0)return '0';
  const g=gcd(n,d),p=Math.abs(n)/g,q=d/g,sg=n<0?'-':'';
  const num=(p===1?'\\pi':p+'\\pi');
  return sg+(q===1?num:'\\dfrac{'+num+'}{'+q+'}');
}
function K(){return KTBL[ki+4].v;}
function KX(){return KTBL[ki+4].tex;}
function TH(){return tn*PI/12;}
function fn(){return TYPE==='sin'?'\\sin':'\\cos';}
function fv(t){return TYPE==='sin'?Math.sin(t):Math.cos(t);}

/* 0 <= theta < 2pi の基本解を「pi の 12 分割」の整数で返す */
function baseSols(){
  const k=K();let a,b;
  if(TYPE==='sin'){a=Math.asin(k);b=PI-a;}else{a=Math.acos(k);b=-a;}
  const norm=x=>{const n=Math.round(x/PI*12)%24;return n<0?n+24:n;};
  const s=[norm(a),norm(b)];
  return s[0]===s[1]?[s[0]]:s.sort((p,q)=>p-q);
}

function init(){
  document.getElementById('f-th').innerHTML=T('\\theta');
  document.getElementById('f-p').innerHTML=T('\\mathrm{P}');
  document.getElementById('f-q').innerHTML=T('\\mathrm{P}');
  tex('\\mathrm{P}(\\cos\\theta,\\ \\sin\\theta)',document.getElementById('f-key'),true);
  document.getElementById('f-note').innerHTML=
    T('\\sin\\theta=k')+' は「'+T('y')+' 座標が '+T('k')+' になる点」、'+
    T('\\cos\\theta=k')+' は「'+T('x')+' 座標が '+T('k')+' になる点」を単位円の上で探すことです。'+
    'ふつう交点は 2 つあり、'+T('\\sin\\theta')+' と '+T('\\cos\\theta')+' の周期は '+T('2\\pi')+
    ' なので、その角に '+T('2n\\pi')+' を足したものが解のすべてになります。';
  document.getElementById('lbl-k').innerHTML=T('k');
  document.getElementById('lbl-t').innerHTML=T('\\theta');
  document.getElementById('ty-sin').innerHTML=T('\\sin\\theta=k');
  document.getElementById('ty-cos').innerHTML=T('\\cos\\theta=k');
  document.getElementById('pre0').innerHTML=T('\\sin\\theta=-\\dfrac{1}{2}');
  buildStatic();
  initWalkthrough();
  setupControls();
  setupDrag();
  refresh();
}

function initWalkthrough(){
  const SP='\\;';
  const steps=[
    {label:'Step 1: 目標',
     formula:'\\sin\\theta=\\dfrac{\\sqrt{3}}{2}'+SP+'\\text{を満たす}'+SP+'\\theta'+SP+'\\text{を一般角で求める}'},
    {label:'Step 2: 単位円で言いかえる',
     formula:'\\mathrm{P}(\\cos\\theta,\\ \\sin\\theta)'+SP+'\\text{だから}'+SP+'\\sin\\theta'+SP+'\\text{は}'+SP+'\\mathrm{P}'+SP+'\\text{の}'+SP+'y'+SP+'\\text{座標}'},
    {label:'Step 3: 交点は 2 つ',
     formula:'\\text{直線}'+SP+'y=\\dfrac{\\sqrt{3}}{2}'+SP+'\\text{と単位円の交点を}'+SP+'\\mathrm{P},\\ \\mathrm{P}^{\\prime}'+SP+'\\text{とする}'},
    {label:'Step 4: 0 以上 2π 未満の範囲で読み取る',
     formula:'\\theta=\\dfrac{\\pi}{3},\\ \\dfrac{2\\pi}{3}'},
    {label:'Step 5: 周期 2π を足して一般角に',
     formula:'\\theta=\\dfrac{\\pi}{3}+2n\\pi,\\ \\dfrac{2\\pi}{3}+2n\\pi\\quad(n'+SP+'\\text{は整数})'},
    {label:'Step 6: (2) はまず θ の式にそろえる',
     formula:'\\sqrt{2}\\cos\\theta=1'+SP+'\\Longrightarrow'+SP+'\\cos\\theta=\\dfrac{1}{\\sqrt{2}}=\\dfrac{\\sqrt{2}}{2}'},
    {label:'Step 7: 今度は x 座標を見る',
     formula:'\\text{直線}'+SP+'x=\\dfrac{\\sqrt{2}}{2}'+SP+'\\text{との交点から}'+SP+'\\theta=\\dfrac{\\pi}{4},\\ \\dfrac{7\\pi}{4}'},
    {label:'Step 8: (2) の答え',
     formula:'\\theta=\\dfrac{\\pi}{4}+2n\\pi,\\ \\dfrac{7\\pi}{4}+2n\\pi\\quad(n'+SP+'\\text{は整数})'}
  ];
  let cur=0;
  const container=document.getElementById('walkthrough');
  const counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev');
  const nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=cur;i++){
      html+=`<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${cur+1} / ${steps.length}`;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{if(cur>0){cur--;render();}});
  nextBtn.addEventListener('click',()=>{if(cur<steps.length-1){cur++;render();}});
  render();
}

function fo(x,y,w,h,size,color,body,extra){
  const cx=Math.max(2,Math.min(x,W-w-2));
  return `<foreignObject x="${cx.toFixed(1)}" y="${y.toFixed(1)}" width="${w}" height="${h}"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:${size}px;color:${color};white-space:nowrap;${extra||''}">${body}</div></foreignObject>`;
}

function buildStatic(){
  let s='';
  s+=`<line x1="${CX-165}" y1="${CY}" x2="${CX+165}" y2="${CY}" stroke="#ccc" stroke-width="1.5"/>`;
  s+=`<line x1="${CX}" y1="${CY-158}" x2="${CX}" y2="${CY+158}" stroke="#ccc" stroke-width="1.5"/>`;
  s+=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#bbb" stroke-width="1.8"/>`;
  s+=`<text x="${CX-9}" y="${CY+17}" font-size="12" fill="#aaa" text-anchor="end">O</text>`;
  s+=`<text x="${ux(1)}" y="${CY+18}" font-size="11" fill="#aaa" text-anchor="middle">1</text>`;
  s+=`<text x="${ux(-1)}" y="${CY+18}" font-size="11" fill="#aaa" text-anchor="middle">-1</text>`;
  s+=`<text x="${CX-8}" y="${uy(1)+4}" font-size="11" fill="#aaa" text-anchor="end">1</text>`;
  s+=`<text x="${CX-8}" y="${uy(-1)+4}" font-size="11" fill="#aaa" text-anchor="end">-1</text>`;
  s+=fo(CX+150,CY+6,26,24,14,'#999',TC('x'));
  s+=fo(CX+7,4,24,24,14,'#999',TC('y'));
  s+=`<line x1="20" y1="352" x2="580" y2="352" stroke="#eee" stroke-width="1"/>`;
  for(let m=-4;m<=8;m++){
    const x=gx(m*PI/2);
    s+=`<line x1="${x.toFixed(1)}" y1="${gy(1.45)}" x2="${x.toFixed(1)}" y2="${gy(-1.45)}" stroke="${m===0?'#999':'#eee'}" stroke-width="${m===0?1.5:1}"/>`;
  }
  for(let m=-1;m<=1;m++){
    s+=`<line x1="${GX0}" y1="${gy(m)}" x2="${GX1}" y2="${gy(m)}" stroke="${m===0?'#999':'#eee'}" stroke-width="${m===0?1.5:1}"/>`;
  }
  s+=`<text x="${(GOX-8).toFixed(1)}" y="${gy(1)+4}" font-size="11" fill="#aaa" text-anchor="end">1</text>`;
  s+=`<text x="${(GOX-8).toFixed(1)}" y="${gy(-1)+4}" font-size="11" fill="#aaa" text-anchor="end">-1</text>`;
  s+=`<text x="${(GOX-8).toFixed(1)}" y="${GOY+18}" font-size="11" fill="#aaa" text-anchor="end">O</text>`;
  s+=fo(GX1-16,GOY-28,26,24,14,'#999',TC('\\theta'));
  STATIC=s;
  /* 目盛りラベルは曲線を描いたあとで重ねる（曲線に隠れないように） */
  let g='';
  for(let m=-2;m<=4;m++){
    if(m===0)continue;
    g+=fo(gx(m*PI)-26,GOY+6,52,28,11,'#aaa','<span style="display:inline-block;background:rgba(255,255,255,.85);border-radius:3px;padding:0 2px">'+TC(fracPi(m,1))+'</span>','text-align:center');
  }
  GLABELS=g;
}

function curvePath(){
  let d='';const N=560;
  for(let i=0;i<=N;i++){
    const t=TMIN+(TMAX-TMIN)*i/N;
    d+=(i===0?'M':'L')+gx(t).toFixed(1)+' '+gy(fv(t)).toFixed(1)+' ';
  }
  return d;
}

/* 0 から theta までの回転を、巻き数に応じて半径を広げた渦で描く */
function spiral(th){
  if(Math.abs(th)<1e-9)return '';
  let d='';const N=Math.max(8,Math.round(Math.abs(th)/PI*36));
  for(let i=0;i<=N;i++){
    const a=th*i/N, r=34+9*Math.abs(a)/TAU;
    d+=(i===0?'M':'L')+(CX+r*Math.cos(a)).toFixed(1)+' '+(CY-r*Math.sin(a)).toFixed(1)+' ';
  }
  return `<path d="${d}" fill="none" stroke="var(--c-blue)" stroke-width="2" opacity="0.7"/>`;
}

function drawFig(){
  const k=K(),th=TH(),sols=baseSols();
  const hit=Math.abs(fv(th)-k)<1e-9;
  const col=hit?'var(--c-green)':'var(--c-blue)';
  let s=STATIC;
  if(TYPE==='sin'){
    s+=`<line x1="${CX-165}" y1="${uy(k).toFixed(1)}" x2="${CX+165}" y2="${uy(k).toFixed(1)}" stroke="var(--c-green)" stroke-width="2" stroke-dasharray="6 4"/>`;
    /* 解のラベルは k>0 なら線の上、k<0 なら線の下に来るので、反対側へ置く */
    s+=fo(CX-172,k>=0?uy(k)+4:uy(k)-27,92,26,12,'var(--c-green)',TC('y=k'),'font-weight:600');
  }else{
    s+=`<line x1="${ux(k).toFixed(1)}" y1="${CY-158}" x2="${ux(k).toFixed(1)}" y2="${CY+158}" stroke="var(--c-green)" stroke-width="2" stroke-dasharray="6 4"/>`;
    /* 上端・下端は解のラベルと重なるので、x 軸の少し上に置く */
    s+=fo(ux(k)+6,CY-30,92,26,12,'var(--c-green)',TC('x=k'),'font-weight:600');
  }
  sols.forEach(n=>{
    const a=n*PI/12,X=ux(Math.cos(a)),Y=uy(Math.sin(a));
    s+=`<line x1="${CX}" y1="${CY}" x2="${X.toFixed(1)}" y2="${Y.toFixed(1)}" stroke="var(--c-orange)" stroke-width="2.5"/>`;
    s+=`<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="6" fill="var(--c-orange)" stroke="#fff" stroke-width="2"><animate attributeName="r" values="6;11;6" dur="1.6s" repeatCount="indefinite"/></circle>`;
    /* 動径が縦・横に近いときは、軸のラベルや図の外へ出ないように寄せる */
    let lx=CX+1.32*R*Math.cos(a)-52, ly=CY-1.32*R*Math.sin(a)-14;
    if(Math.abs(Math.cos(a))<0.25){ lx-=62; ly=Math.min(Math.max(ly,2),320); }
    else if(Math.abs(Math.sin(a))<0.25){ ly-=34; }
    s+=fo(lx,ly,104,28,12,'var(--c-orange)',TC('\\theta='+fracPi(n,12)),'font-weight:600;text-align:center');
  });
  const PX=ux(Math.cos(th)),PY=uy(Math.sin(th));
  s+=spiral(th);
  s+=`<line x1="${CX}" y1="${CY}" x2="${PX.toFixed(1)}" y2="${PY.toFixed(1)}" stroke="${col}" stroke-width="2.5"/>`;
  if(TYPE==='sin'){
    s+=`<line x1="${PX.toFixed(1)}" y1="${PY.toFixed(1)}" x2="${CX}" y2="${PY.toFixed(1)}" stroke="${col}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  }else{
    s+=`<line x1="${PX.toFixed(1)}" y1="${PY.toFixed(1)}" x2="${PX.toFixed(1)}" y2="${CY}" stroke="${col}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  }
  s+=`<circle cx="${PX.toFixed(1)}" cy="${PY.toFixed(1)}" r="8" fill="${col}" stroke="#fff" stroke-width="2"/>`;
  /* 点 P の名前は凡例に出しているので、図の上には印だけを残す（ラベルの重なり防止） */
  s+=`<path d="${curvePath()}" fill="none" stroke="var(--c-orange)" stroke-width="2.5"/>`;
  s+=GLABELS;
  s+=`<line x1="${GX0}" y1="${gy(k).toFixed(1)}" x2="${GX1}" y2="${gy(k).toFixed(1)}" stroke="var(--c-green)" stroke-width="2" stroke-dasharray="6 4"/>`;
  sols.forEach(n=>{
    for(let m=-1;m<=2;m++){
      const t=n*PI/12+m*TAU;
      if(t<TMIN-1e-9||t>TMAX+1e-9)continue;
      s+=`<circle cx="${gx(t).toFixed(1)}" cy="${gy(k).toFixed(1)}" r="5" fill="var(--c-orange)" stroke="#fff" stroke-width="1.5"><animate attributeName="r" values="5;9;5" dur="1.6s" repeatCount="indefinite"/></circle>`;
    }
  });
  s+=`<line x1="${gx(th).toFixed(1)}" y1="${GOY}" x2="${gx(th).toFixed(1)}" y2="${gy(fv(th)).toFixed(1)}" stroke="${col}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  s+=`<circle cx="${gx(th).toFixed(1)}" cy="${gy(fv(th)).toFixed(1)}" r="7" fill="${col}" stroke="#fff" stroke-width="2"/>`;
  document.getElementById('graph').innerHTML=s;
}

function refresh(){
  const k=K(),th=TH(),sols=baseSols();
  const hit=Math.abs(fv(th)-k)<1e-9;
  document.getElementById('k-value').innerHTML=TC(KX());
  document.getElementById('t-value').innerHTML=TC(fracPi(tn,12));
  document.getElementById('lg0').innerHTML=TC(TYPE==='sin'?'y=k':'x=k');
  document.getElementById('lg1').innerHTML=TC('\\text{解の動径}');
  document.getElementById('lg2').innerHTML=TC('\\text{動かせる点}\\ \\mathrm{P}');
  document.getElementById('live-calc').innerHTML=
    TC('\\theta='+fracPi(tn,12))+'<br>'+
    /* 丸め誤差で「-0.0000」と出ないようにごく小さい値は 0 とみなす */
    TC(fn()+'\\theta='+(Math.abs(fv(th))<5e-5?0:fv(th)).toFixed(4)+'\\qquad k='+KX()+'='+k.toFixed(4));
  const hn=document.getElementById('hit-note');
  hn.className=hit?'note hit':'note';
  hn.innerHTML=hit
    ? '一致しました。'+TC('\\theta='+fracPi(tn,12))+' は '+TC(fn()+'\\theta='+KX())+' の解の 1 つです。'
    : '動径をさらに回して、'+TC(fn()+'\\theta')+' が '+TC('k='+KX())+' に一致する位置を探しましょう。';
  document.getElementById('answer').innerHTML=
    TC(fn()+'\\theta='+KX())+'<br>'+
    TC('\\theta='+sols.map(n=>n===0?'2n\\pi':fracPi(n,12)+'+2n\\pi').join(',\\ ')+'\\quad(n\\;\\text{は整数})');
  drawFig();
}

function syncTabs(){
  document.getElementById('ty-sin').classList.toggle('active',TYPE==='sin');
  document.getElementById('ty-cos').classList.toggle('active',TYPE==='cos');
}
function setPre(id){['pre0','pre1','pre2'].forEach(k=>document.getElementById(k).classList.toggle('active',k===id));}
function setCase(type,idx,id){
  stopAnim();TYPE=type;ki=idx;tn=0;
  document.getElementById('k-slider').value=idx;
  document.getElementById('t-slider').value=0;
  setPre(id);syncTabs();refresh();
}

function setupControls(){
  const ks=document.getElementById('k-slider'),ts=document.getElementById('t-slider');
  ks.addEventListener('input',()=>{stopAnim();ki=parseInt(ks.value,10);setPre('');refresh();});
  ts.addEventListener('input',()=>{stopAnim();tn=parseInt(ts.value,10);refresh();});
  document.getElementById('pre0').addEventListener('click',()=>setCase('sin',-1,'pre0'));
  document.getElementById('pre1').addEventListener('click',()=>setCase('sin',3,'pre1'));
  document.getElementById('pre2').addEventListener('click',()=>setCase('cos',2,'pre2'));
  document.getElementById('ty-sin').addEventListener('click',()=>{stopAnim();TYPE='sin';setPre('');syncTabs();refresh();});
  document.getElementById('ty-cos').addEventListener('click',()=>{stopAnim();TYPE='cos';setPre('');syncTabs();refresh();});
  document.getElementById('anim-btn').addEventListener('click',runAnim);
}

function stopAnim(){ if(animId){cancelAnimationFrame(animId);animId=null;} }

/* 動径を -2pi から 4pi まで一定の速さで回し、解を通過する様子を見せる */
function runAnim(){
  stopAnim();
  const ts=document.getElementById('t-slider'),dur=7000;
  let st=null;
  tn=-24;ts.value=-24;refresh();
  function frame(now){
    if(st===null)st=now;
    const pr=Math.min((now-st)/dur,1);
    tn=Math.round(-24+72*pr);
    ts.value=tn;refresh();
    if(pr<1)animId=requestAnimationFrame(frame);else animId=null;
  }
  animId=requestAnimationFrame(frame);
}

function setupDrag(){
  const svg=document.getElementById('graph'),wrap=document.getElementById('svg-wrap');
  let dragging=false;
  function toUnit(cx,cy){
    const rect=svg.getBoundingClientRect();
    const sx=(cx-rect.left)/rect.width*W, sy=(cy-rect.top)/rect.height*H;
    return {x:(sx-CX)/R, y:(CY-sy)/R};
  }
  function startDrag(cx,cy){
    const m=toUnit(cx,cy),d=Math.hypot(m.x,m.y);
    dragging=(d>0.3&&d<1.8);
    if(dragging)moveDrag(cx,cy);
  }
  function moveDrag(cx,cy){
    if(!dragging)return;
    const m=toUnit(cx,cy);
    const n=Math.round(Math.atan2(m.y,m.x)/PI*12);
    const turns=Math.round((tn-n)/24);
    tn=Math.max(-24,Math.min(48,n+24*turns));
    document.getElementById('t-slider').value=tn;
    refresh();
  }
  function endDrag(){dragging=false;}
  wrap.addEventListener('mousedown',e=>{e.preventDefault();stopAnim();startDrag(e.clientX,e.clientY);});
  window.addEventListener('mousemove',e=>{if(dragging){e.preventDefault();moveDrag(e.clientX,e.clientY);}});
  window.addEventListener('mouseup',endDrag);
  wrap.addEventListener('touchstart',e=>{stopAnim();const t=e.touches[0];startDrag(t.clientX,t.clientY);},{passive:true});
  wrap.addEventListener('touchmove',e=>{if(dragging){e.preventDefault();const t=e.touches[0];moveDrag(t.clientX,t.clientY);}},{passive:false});
  wrap.addEventListener('touchend',endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
