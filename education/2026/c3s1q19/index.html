<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>三角関数のグラフの振幅</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; gap: .5rem; margin: .75rem 0; }
  .tab {
    flex: 1; appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600; padding: .7rem .5rem;
    border-radius: 10px; cursor: pointer; min-height: 48px; font-family: inherit; user-select: none;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row {
    display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem;
  }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .5rem; flex-wrap: wrap; margin: .5rem 0; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>三角関数のグラフの振幅</h1>
  <p class="subtitle">もとのグラフを縦に何倍かしたグラフの形と周期を確かめましょう。</p>

  <h2>基本の考え方</h2>
  <p><span id="f-i1"></span> のグラフは、<span id="f-i2"></span> のグラフを <span id="f-i3"></span> 軸を基準にして、<span id="f-i4"></span> 軸方向に <span id="f-i5"></span> 倍に拡大・縮小したものです。</p>
  <div class="formula-box" id="f-main"></div>
  <div class="note" id="note1"></div>

  <h2>動かして確かめよう</h2>
  <div class="tabs">
    <button class="tab active" id="tab-sin"></button>
    <button class="tab" id="tab-cos"></button>
  </div>
  <div class="slider-row">
    <label><span id="lbl-a"></span> =</label>
    <input type="range" id="a-slider" min="-2" max="3" step="0.1" value="2">
    <span class="slider-val" id="a-value">2.0</span>
  </div>
  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">アニメーション</button>
    <button class="btn" id="preset1"></button>
    <button class="btn" id="preset2"></button>
  </div>
  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <p class="drag-hint">グラフを左右にドラッグすると点が動きます</p>
  <div class="live-calc" id="live-calc"></div>

  <h2>解法ウォークスルー</h2>
  <p>次の関数のグラフをかき、その周期を求めます。</p>
  <div class="formula-box" id="f-problem"></div>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=380,ox=60,oy=180,sy=46;
const TMIN=-0.55, TMAX=2*Math.PI+0.55;
const sx=(W-ox-28)/(TMAX-TMIN);
const TWOPI=2*Math.PI;

function PX(t){return ox+(t-TMIN)*sx;}
function PY(y){return oy-y*sy;}
function clampY(y){return Math.max(-3.25,Math.min(3.25,y));}

let aVal=2, mode='sin', thetaP=Math.PI/2, traceEnd=TMAX, animId=null;

function fbase(t){return mode==='sin'?Math.sin(t):Math.cos(t);}
function fname(){return mode==='sin'?'\\sin':'\\cos';}
function fmtA(){return aVal.toFixed(1);}

function init(){
  document.getElementById('f-i1').innerHTML=T('y=a\\sin\\theta');
  document.getElementById('f-i2').innerHTML=T('y=\\sin\\theta');
  document.getElementById('f-i3').innerHTML=T('\\theta');
  document.getElementById('f-i4').innerHTML=T('y');
  document.getElementById('f-i5').innerHTML=T('a');
  document.getElementById('lbl-a').innerHTML=T('a');
  document.getElementById('tab-sin').innerHTML=T('y=a\\sin\\theta');
  document.getElementById('tab-cos').innerHTML=T('y=a\\cos\\theta');
  document.getElementById('preset1').innerHTML=T('a=2');
  document.getElementById('preset2').innerHTML=T('a=\\dfrac{1}{2}');
  tex('y=a\\sin\\theta,\\quad y=a\\cos\\theta \\qquad (a \\neq 0)',document.getElementById('f-main'),true);
  document.getElementById('note1').innerHTML=
    '縦に伸び縮みさせても、山と谷が現れる間隔は変わりません。周期は '+T('2\\pi')+' のままです。';
  tex('(1)\\;\\; y=2\\cos\\theta \\qquad (2)\\;\\; y=\\dfrac{1}{2}\\sin\\theta',document.getElementById('f-problem'),true);
  initWalkthrough();
  setupTabs();
  setupSlider();
  setupPresets();
  setupAnimation();
  setupDrag();
  draw();
}

function initWalkthrough(){
  const steps=[
    {label:'Step 1: もとのグラフを思い出す',
     formula:'y=\\cos\\theta\\;\\text{の最大値は }1,\\;\\text{最小値は }-1,\\;\\text{周期は }2\\pi'},
    {label:'Step 2: (1) は y 座標を 2 倍にする',
     formula:'y=2\\cos\\theta:\\;\\text{各点の }y\\text{ 座標を }2\\text{ 倍にする}'},
    {label:'Step 3: 代表的な値で確かめる',
     formula:'\\cos 0=1\\;\\Rightarrow\\;2\\cos 0=2,\\qquad \\cos\\pi=-1\\;\\Rightarrow\\;2\\cos\\pi=-2'},
    {label:'Step 4: (1) の答え',
     formula:'\\text{最大値 }2,\\;\\text{最小値 }-2,\\;\\text{周期 }2\\pi'},
    {label:'Step 5: (2) は y 座標を 1/2 倍にする',
     formula:'y=\\dfrac{1}{2}\\sin\\theta:\\;\\text{各点の }y\\text{ 座標を }\\dfrac{1}{2}\\text{ 倍にする}'},
    {label:'Step 6: 代表的な値で確かめる',
     formula:'\\sin\\dfrac{\\pi}{2}=1\\;\\Rightarrow\\;\\dfrac{1}{2}\\sin\\dfrac{\\pi}{2}=\\dfrac{1}{2}'},
    {label:'Step 7: (2) の答え',
     formula:'\\text{最大値 }\\dfrac{1}{2},\\;\\text{最小値 }-\\dfrac{1}{2},\\;\\text{周期 }2\\pi'},
    {label:'Step 8: まとめ',
     formula:'y=a\\sin\\theta,\\;y=a\\cos\\theta\\;\\text{の周期はどちらも }2\\pi'}
  ];
  let cur=0;
  const container=document.getElementById('walkthrough');
  const counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev');
  const nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=cur;i++){
      html+=`<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${cur+1} / ${steps.length}`;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{if(cur>0){cur--;render();}});
  nextBtn.addEventListener('click',()=>{if(cur<steps.length-1){cur++;render();}});
  render();
}

function draw(){
  const svg=document.getElementById('graph');
  let s='';
  for(let k=-3;k<=3;k++){
    if(k===0) continue;
    s+=`<line x1="${PX(TMIN)}" y1="${PY(k)}" x2="${PX(TMAX)}" y2="${PY(k)}" stroke="${Math.abs(k)===1?'#e8e8e8':'#f2f2f2'}" stroke-width="1"/>`;
  }
  for(let k=0;k<=4;k++){
    const t=k*Math.PI/2;
    s+=`<line x1="${PX(t)}" y1="${PY(3.15)}" x2="${PX(t)}" y2="${PY(-3.15)}" stroke="${k===0?'#999':'#eee'}" stroke-width="${k===0?1.5:1}"/>`;
  }
  s+=`<line x1="${PX(TMIN)}" y1="${oy}" x2="${PX(TMAX)}" y2="${oy}" stroke="#999" stroke-width="1.5"/>`;
  s+=`<foreignObject x="${PX(TMAX)-6}" y="${oy-26}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('\\theta')}</div></foreignObject>`;
  s+=`<foreignObject x="${PX(0)+7}" y="12" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('y')}</div></foreignObject>`;
  /* 目盛りラベルは曲線を描いたあとで重ねる（曲線に隠れないように） */
  const tickTex=['\\dfrac{\\pi}{2}','\\pi','\\dfrac{3}{2}\\pi','2\\pi'];
  let lab='';
  for(let k=1;k<=4;k++){
    const t=k*Math.PI/2;
    lab+=`<foreignObject x="${PX(t)-25}" y="${oy+4}" width="50" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#aaa;text-align:center"><span style="display:inline-block;background:rgba(255,255,255,.82);border-radius:3px;padding:0 2px">${T(tickTex[k-1])}</span></div></foreignObject>`;
  }
  for(let k=-3;k<=3;k++){
    if(k===0) continue;
    lab+=`<text x="${PX(0)-8}" y="${PY(k)+4}" text-anchor="end" font-size="11" fill="#aaa">${k}</text>`;
  }

  const N=360;
  let d1='';
  for(let i=0;i<=N;i++){
    const t=TMIN+(TMAX-TMIN)*i/N;
    d1+=(i===0?'M ':'L ')+PX(t).toFixed(1)+' '+PY(fbase(t)).toFixed(1)+' ';
  }
  s+=`<path d="${d1}" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="6 5"/>`;

  for(let k=0;k<=16;k++){
    const t=k*Math.PI/8;
    if(t>TMAX) break;
    const b=fbase(t);
    if(Math.abs(b)<0.06) continue;
    s+=`<line x1="${PX(t)}" y1="${PY(b)}" x2="${PX(t)}" y2="${PY(clampY(aVal*b))}" stroke="var(--c-orange)" stroke-width="1.5" opacity="0.35"/>`;
  }

  let d2='',started=false;
  for(let i=0;i<=N;i++){
    const t=TMIN+(TMAX-TMIN)*i/N;
    if(t>traceEnd) break;
    d2+=(started?'L ':'M ')+PX(t).toFixed(1)+' '+PY(clampY(aVal*fbase(t))).toFixed(1)+' ';
    started=true;
  }
  if(started) s+=`<path d="${d2}" fill="none" stroke="var(--c-blue)" stroke-width="3"/>`;
  s+=lab;

  const bp=fbase(thetaP), sp=clampY(aVal*bp);
  s+=`<line x1="${PX(thetaP)}" y1="${PY(bp)}" x2="${PX(thetaP)}" y2="${PY(sp)}" stroke="var(--c-orange)" stroke-width="2.5"/>`;
  s+=`<circle cx="${PX(thetaP)}" cy="${PY(bp)}" r="5" fill="#bbb" stroke="#fff" stroke-width="2"/>`;
  s+=`<circle cx="${PX(thetaP)}" cy="${PY(sp)}" r="7" fill="var(--c-orange)" stroke="#fff" stroke-width="2.5"/>`;
  s+=`<circle cx="${PX(thetaP)}" cy="${PY(sp)}" r="7" fill="none" stroke="var(--c-orange)" stroke-width="2"><animate attributeName="r" values="7;13;7" dur="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0;0.9" dur="1.3s" repeatCount="indefinite"/></circle>`;
  const lx=Math.max(2,Math.min(PX(thetaP)+10,W-96));
  s+=`<foreignObject x="${lx}" y="${(PY(bp)+PY(sp))/2-14}" width="94" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-orange);font-weight:700;white-space:nowrap">${T('\\times '+fmtA())}</div></foreignObject>`;

  const by=oy+152;
  s+=`<path d="M ${PX(0)} ${by-7} L ${PX(0)} ${by} L ${PX(TWOPI)} ${by} L ${PX(TWOPI)} ${by-7}" fill="none" stroke="var(--c-purple)" stroke-width="2"/>`;
  s+=`<foreignObject x="${(PX(0)+PX(TWOPI))/2-70}" y="${by+2}" width="140" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-purple);font-weight:600;text-align:center;white-space:nowrap">周期 ${T('2\\pi')}</div></foreignObject>`;

  svg.innerHTML=s;
  updateLive();
}

function updateLive(){
  const b=fbase(thetaP), v=aVal*b;
  const F=fname();
  const A=Math.abs(aVal).toFixed(1);
  /* a=0 は定数関数 y=0 になり、振幅も周期も考えられない退化した場合 */
  const summary = Math.abs(aVal)<0.05
    ? T(`\\text{つねに }y=0\\;\\text{となり、波が消えます}`)
    : T(`\\text{最大値 }${A},\\;\\text{最小値 }{-${A}},\\;\\text{周期 }2\\pi`);
  document.getElementById('live-calc').innerHTML=
    T(`\\theta = ${thetaP.toFixed(2)}`)+'<br>'+
    T(`${F}\\theta = ${b.toFixed(3)}`)+'<br>'+
    T(`${fmtA()}${F}\\theta = ${v.toFixed(3)}`)+'<br>'+
    '<span style="color:var(--c-purple);font-weight:600">'+summary+'</span>';
}

function setupTabs(){
  const ts=document.getElementById('tab-sin'), tc=document.getElementById('tab-cos');
  ts.addEventListener('click',()=>{mode='sin';ts.className='tab active';tc.className='tab';draw();});
  tc.addEventListener('click',()=>{mode='cos';tc.className='tab active';ts.className='tab';draw();});
}

function setValueA(v){
  aVal=v;
  document.getElementById('a-slider').value=v;
  document.getElementById('a-value').textContent=v.toFixed(1);
  traceEnd=TMAX;
  draw();
}

function setupSlider(){
  const sl=document.getElementById('a-slider');
  sl.addEventListener('input',()=>{
    if(animId){cancelAnimationFrame(animId);animId=null;}
    setValueA(parseFloat(sl.value));
  });
}

function setupPresets(){
  document.getElementById('preset1').addEventListener('click',()=>setValueA(2));
  document.getElementById('preset2').addEventListener('click',()=>setValueA(0.5));
}

function setupAnimation(){
  document.getElementById('anim-btn').addEventListener('click',()=>{
    if(animId){cancelAnimationFrame(animId);animId=null;}
    const dur=4200; let st=null;
    traceEnd=TMIN;
    function step(ts){
      if(!st) st=ts;
      const p=Math.min((ts-st)/dur,1);
      thetaP=TMIN+(TMAX-TMIN)*p;
      traceEnd=thetaP;
      draw();
      if(p<1){ animId=requestAnimationFrame(step); }
      else { animId=null; traceEnd=TMAX; draw(); }
    }
    animId=requestAnimationFrame(step);
  });
}

function setupDrag(){
  const svg=document.getElementById('graph');
  const wrap=document.getElementById('svg-wrap');
  let dragging=false;
  function toTheta(cx){
    const rect=svg.getBoundingClientRect();
    const svgX=(cx-rect.left)/rect.width*W;
    return Math.max(TMIN,Math.min(TMAX,(svgX-ox)/sx+TMIN));
  }
  function startDrag(cx){
    if(animId){cancelAnimationFrame(animId);animId=null;traceEnd=TMAX;}
    dragging=true; thetaP=toTheta(cx); draw();
  }
  function moveDrag(cx){ if(!dragging) return; thetaP=toTheta(cx); draw(); }
  function endDrag(){ dragging=false; }
  wrap.addEventListener('mousedown',e=>{e.preventDefault();startDrag(e.clientX);});
  window.addEventListener('mousemove',e=>{if(dragging){e.preventDefault();moveDrag(e.clientX);}});
  window.addEventListener('mouseup',endDrag);
  wrap.addEventListener('touchstart',e=>{const t=e.touches[0];startDrag(t.clientX);},{passive:true});
  wrap.addEventListener('touchmove',e=>{if(dragging){e.preventDefault();const t=e.touches[0];moveDrag(t.clientX);}},{passive:false});
  wrap.addEventListener('touchend',endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
</body>
</html>
