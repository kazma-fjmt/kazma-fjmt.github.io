<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>多項式の微分</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .rule-row {
    display: flex; align-items: center; gap: .75rem;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .7rem 1rem; margin: .5rem 0; overflow-x: auto;
  }
  .rule-row > .rule-no { flex: 0 0 auto; font-size: 1.1rem; font-weight: 700; color: var(--accent); }
  .rule-row > .rule-body { flex: 1 1 auto; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* draw() replaces the SVG contents, which would orphan a touch sequence that
     started on a child; keep hit-testing on the wrapper so the drag survives */
  .svg-container > svg { pointer-events: none; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0; }
  .tab {
    appearance: none; border: 1px solid #d4dbeb; background: #fff; color: var(--accent);
    font-size: 1rem; font-weight: 600; padding: .6rem .9rem; border-radius: 10px;
    min-height: 48px; min-width: 64px; cursor: pointer; font-family: inherit; flex: 1 1 auto;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.05rem; }
  .live-calc .row { margin: .3rem 0; }

  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row {
    display: flex; align-items: center; gap: 1rem; margin: .5rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .6rem 1.25rem;
  }
  .slider-row > label { font-size: .95rem; font-weight: 600; white-space: nowrap; min-width: 2.5rem; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row > .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .75rem; margin: .5rem 0; flex-wrap: wrap; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>多項式の微分</h1>
  <p class="subtitle">項ごとに分けて公式を当てはめる手順を、1 項ずつ動かしながら身につけましょう。</p>

  <h2>使う道具</h2>
  <div class="rule-row"><span class="rule-no">A</span><span class="rule-body" id="ruleA"></span></div>
  <div class="rule-row"><span class="rule-no">B</span><span class="rule-body" id="ruleB"></span></div>
  <div class="rule-row"><span class="rule-no">C</span><span class="rule-body" id="ruleC"></span></div>

  <h2>例題の解法ウォークスルー</h2>
  <p>4 つの項をもつ式を、順に分解していきます。</p>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>項ごとに微分しよう</h2>
  <p>問題をタップして選び、<strong>1 項ずつ微分</strong> で分解の様子を見ましょう。</p>
  <div class="tabs" id="tabs"></div>
  <div class="formula-box" id="target-box"></div>
  <div class="anim-btn-row"><button class="btn primary" id="ledger-btn">1 項ずつ微分</button></div>
  <div class="svg-container" id="ledger-wrap">
    <svg id="ledger" viewBox="0 0 600 374" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <h2>接線の傾きで確かめよう</h2>
  <p>求めた <span id="lbl-yp"></span> に値を代入した数が、そのままグラフの接線の傾きになります。</p>
  <div class="slider-row">
    <label><span id="lbl-a"></span> =</label>
    <input type="range" id="a-slider" min="-3" max="3" step="0.1" value="1">
    <span class="slider-val" id="a-value">1</span>
  </div>
  <div class="anim-btn-row"><button class="btn primary" id="anim-btn">接線を動かす</button></div>
  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <p class="drag-hint">図を横にドラッグしても接点が動きます</p>
  <div class="live-calc" id="live-calc"></div>

  <h2>答え</h2>
  <div class="formula-box" id="answer-box"></div>
  <div class="note">項が 1 つ消えるのは定数項だけです。定数関数のグラフは横ばいの直線なので、傾きはどこでも 0 になります。</div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const PROBLEMS=[
  {tag:'(1)', terms:[{p:-2,q:1,n:1},{p:3,q:1,n:0}],                              xmin:-3,  xmax:3, ymax:10, ystep:5},
  {tag:'(2)', terms:[{p:-3,q:1,n:2},{p:1,q:1,n:1},{p:4,q:1,n:0}],                xmin:-2,  xmax:2, ymax:12, ystep:4},
  {tag:'(3)', terms:[{p:5,q:1,n:3},{p:-8,q:1,n:1},{p:1,q:1,n:0}],                xmin:-1.5,xmax:1.5,ymax:8,  ystep:4},
  {tag:'(4)', terms:[{p:1,q:3,n:3},{p:-1,q:2,n:2},{p:-3,q:1,n:1},{p:1,q:1,n:0}], xmin:-3,  xmax:3, ymax:6,  ystep:3},
  {tag:'(5)', terms:[{p:-4,q:1,n:3},{p:6,q:1,n:2},{p:7,q:1,n:1},{p:-9,q:1,n:0}], xmin:-1,  xmax:2, ymax:12, ystep:4}
];

let cur=0, aVal=1, revealed=99, animId=null, ledgerId=null;

/* ---------- rational / latex helpers ---------- */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
function absCoef(p,q){const a=Math.abs(p);return q===1?String(a):'\\dfrac{'+a+'}{'+q+'}';}
function signedCoef(p,q){return (p<0?'-':'')+absCoef(p,q);}
function mono(p,q,n,first,sym){
  const one=(Math.abs(p)===1&&q===1&&n>=1);
  const body=(n===0)?absCoef(p,q):(one?'':absCoef(p,q))+(n===1?sym:sym+'^{'+n+'}');
  return (first?(p<0?'-':''):(p<0?' - ':' + '))+body;
}
function polyTex(terms,lhs,sym){
  if(terms.length===0) return lhs+' = 0';
  let s=lhs+' = ';
  terms.forEach((t,i)=>{s+=mono(t.p,t.q,t.n,i===0,sym);});
  return s;
}
function dterm(t){
  if(t.n===0) return null;
  let p=t.p*t.n, q=t.q, g=gcd(p,q);
  return {p:p/g, q:q/g, n:t.n-1};
}
function dterms(P){return P.terms.map(dterm).filter(t=>t!==null);}
function evalP(terms,x){let s=0;for(const t of terms) s+=t.p/t.q*Math.pow(x,t.n);return s;}

function fmtv(v){
  if(Math.abs(v)<5e-7) v=0;
  let s=v.toFixed(4);
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  if(s==='-0') s='0';
  return {s:s, exact:Math.abs(parseFloat(s)-v)<1e-12};
}
function rel(ex){return ex?'=':'\\fallingdotseq';}

/* ---------- init ---------- */
function init(){
  document.getElementById('ruleA').innerHTML = T("(x^n)' = nx^{n-1}\\quad(n\\;\\text{は正の整数})");
  document.getElementById('ruleB').innerHTML = T("(c)' = 0\\quad(c\\;\\text{は定数})");
  document.getElementById('ruleC').innerHTML = T("\\{kf(x)+lg(x)\\}' = kf'(x)+lg'(x)");
  document.getElementById('lbl-yp').innerHTML = T("y'");
  document.getElementById('lbl-a').innerHTML = T('a');
  initWalkthrough();
  buildTabs();
  document.getElementById('ledger-btn').addEventListener('click',runLedger);
  setupSlider();
  setupAnimation();
  setupDrag();
  selectProblem(0);
}

function initWalkthrough(){
  const steps=[
    {label:'Step 1: 微分する式を書く', formula:"y = 2x^3+3x^2-5x+2"},
    {label:'Step 2: 全体に微分の記号をつける', formula:"y' = (2x^3+3x^2-5x+2)'"},
    {label:'Step 3: 道具 C で項ごとに分ける', formula:"y' = (2x^3)'+(3x^2)'-(5x)'+(2)'"},
    {label:'Step 4: 係数を前に出す', formula:"y' = 2(x^3)'+3(x^2)'-5(x)'+(2)'"},
    {label:'Step 5: 道具 A と B を当てる', formula:"y' = 2\\cdot 3x^2+3\\cdot 2x-5\\cdot 1+0"},
    {label:'Step 6: 整理する', formula:"y' = 6x^2+6x-5"},
    {label:'Step 7: 同じ手順をもう 1 問', formula:"y = 3x^2-1 \\;\\Longrightarrow\\; y' = 3\\cdot 2x-0 = 6x"},
    {label:'Step 8: 手順のまとめ', formula:"\\text{項に分ける}\\;\\to\\;\\text{係数を前へ}\\;\\to\\;(x^n)'=nx^{n-1},\\;(c)'=0\\;\\to\\;\\text{整理}"}
  ];
  let c=0;
  const container=document.getElementById('walkthrough');
  const counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev');
  const nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=c;i++){
      html+=`<div class="step ${i===c?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${c+1} / ${steps.length}`;
    prevBtn.disabled=c===0;
    nextBtn.disabled=c===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{if(c>0){c--;render();}});
  nextBtn.addEventListener('click',()=>{if(c<steps.length-1){c++;render();}});
  render();
}

function buildTabs(){
  const box=document.getElementById('tabs');
  box.innerHTML='';
  PROBLEMS.forEach((P,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===cur?' active':'');
    b.id='tab'+i;
    b.textContent=P.tag;
    b.addEventListener('click',()=>selectProblem(i));
    box.appendChild(b);
  });
}

function selectProblem(i){
  if(animId){cancelAnimationFrame(animId);animId=null;}
  if(ledgerId){cancelAnimationFrame(ledgerId);ledgerId=null;}
  cur=i;
  const P=PROBLEMS[i];
  PROBLEMS.forEach((_,j)=>{
    const b=document.getElementById('tab'+j);
    if(b) b.className='tab'+(j===i?' active':'');
  });
  tex(P.tag+'\\;\\;'+polyTex(P.terms,'y','x'), document.getElementById('target-box'), true);
  tex(polyTex(dterms(P),"y'",'x'), document.getElementById('answer-box'), true);
  const sl=document.getElementById('a-slider');
  sl.min=P.xmin; sl.max=P.xmax;
  aVal=Math.round((P.xmin+P.xmax)/2*10)/10 || 0;
  if(aVal<=P.xmin) aVal=Math.round((P.xmin+0.6)*10)/10;
  sl.value=aVal;
  document.getElementById('a-value').textContent=fmtv(aVal).s;
  revealed=P.terms.length;
  drawLedger(); drawGraph();
}

/* ---------- ledger ---------- */
function card(x,y,w,h,latex,color,active){
  let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#fff" stroke="${color}" stroke-width="${active?3:1.6}"/>`;
  if(active) s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="none" stroke="${color}" stroke-width="3" opacity="0.5"><animate attributeName="stroke-width" values="3;7;3" dur="1.1s" repeatCount="indefinite"/></rect>`;
  s+=`<foreignObject x="${x+5}" y="${y+4}" width="${w-10}" height="${h-8}"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:15px;color:${color}">${T(latex)}</div></foreignObject>`;
  return s;
}
function arrowDown(cx,y1,y2,color,shown){
  if(!shown) return '';
  return `<line x1="${cx}" y1="${y1}" x2="${cx}" y2="${y2-8}" stroke="${color}" stroke-width="2"/>`
       + `<polygon points="${cx-5},${y2-9} ${cx+5},${y2-9} ${cx},${y2}" fill="${color}"/>`;
}
function drawLedger(){
  const P=PROBLEMS[cur];
  const n=P.terms.length;
  const CW=Math.min(138,(576-(n-1)*8)/n), GAP=8;
  const total=n*CW+(n-1)*GAP, x0=(600-total)/2;
  let s='';
  s+=`<foreignObject x="12" y="2" width="576" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#777">もとの式の各項</div></foreignObject>`;
  s+=`<foreignObject x="12" y="88" width="576" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#777;white-space:nowrap">公式を当てる：${T("(x^n)'=nx^{n-1},\\;(c)'=0")}</div></foreignObject>`;
  s+=`<foreignObject x="12" y="206" width="576" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#777">整理する</div></foreignObject>`;
  for(let i=0;i<n;i++){
    const t=P.terms[i], x=x0+i*(CW+GAP), cx=x+CW/2;
    s+=card(x,28,CW,56,mono(t.p,t.q,t.n,true,'x'),'#555',false);
    const on=i<revealed, act=(i===revealed-1&&ledgerId!==null);
    s+=arrowDown(cx,118,146,'var(--c-blue)',on);
    if(on){
      const pw=(t.n-1===0)?'':(t.n-1===1?'x':'x^{'+(t.n-1)+'}');
      const mid=(t.n===0)?"(c)'=0":signedCoef(t.p,t.q)+'\\cdot '+t.n+pw;
      s+=card(x,146,CW,56,mid,'var(--c-blue)',act);
    }
    s+=arrowDown(cx,234,262,'var(--c-green)',on);
    if(on){
      const d=dterm(t);
      s+=card(x,262,CW,56,d?mono(d.p,d.q,d.n,true,'x'):'0','var(--c-green)',act);
    }
  }
  const done=revealed>=n;
  s+=`<foreignObject x="12" y="328" width="576" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:17px;color:${done?'var(--c-green)':'#bbb'};font-weight:600">${done?T(polyTex(dterms(P),"y'",'x')):'&#8942;'}</div></foreignObject>`;
  document.getElementById('ledger').innerHTML=s;
}
function runLedger(){
  if(ledgerId){cancelAnimationFrame(ledgerId);ledgerId=null;}
  const n=PROBLEMS[cur].terms.length;
  revealed=0; drawLedger();
  let start=null;
  function tick(ts){
    if(!start) start=ts;
    const want=Math.min(n,Math.floor((ts-start)/750)+1);
    if(want!==revealed){revealed=want;drawLedger();}
    if(revealed<n){ledgerId=requestAnimationFrame(tick);}
    else{ledgerId=null;drawLedger();}
  }
  ledgerId=requestAnimationFrame(tick);
}

/* ---------- graph ---------- */
/* sub-interval of [t1,t2] on which the tangent stays inside |y| <= ymax */
function clipLine(a,fa,m,t1,t2,ymax){
  if(Math.abs(m)<1e-12) return Math.abs(fa)<=ymax?[t1,t2]:null;
  const ta=a+(ymax-fa)/m, tb=a+(-ymax-fa)/m;
  const s1=Math.max(t1,Math.min(ta,tb)), s2=Math.min(t2,Math.max(ta,tb));
  return s2>s1?[s1,s2]:null;
}
const GW=600,GH=400,GL=62,GR=540,GT=62,GB=348;
function gx(x){const P=PROBLEMS[cur];return GL+(x-P.xmin)/(P.xmax-P.xmin)*(GR-GL);}
function gy(y){const P=PROBLEMS[cur];return (GT+GB)/2 - y/P.ymax*((GB-GT)/2);}
function drawGraph(){
  const P=PROBLEMS[cur], a=aVal;
  const ds=dterms(P);
  let s='';
  s+=`<rect x="${GL}" y="${GT}" width="${GR-GL}" height="${GB-GT}" fill="#fff" stroke="#e3e3e3"/>`;
  for(let v=Math.ceil(P.xmin);v<=Math.floor(P.xmax);v++){
    const xi=gx(v);
    s+=`<line x1="${xi}" y1="${GT}" x2="${xi}" y2="${GB}" stroke="${v===0?'#bbb':'#f2f2f2'}" stroke-width="${v===0?1.5:1}"/>`;
    s+=`<text x="${xi}" y="${GB+16}" text-anchor="middle" font-size="11" fill="#aaa">${v}</text>`;
  }
  for(let v=-P.ymax;v<=P.ymax;v+=P.ystep){
    const yi=gy(v);
    s+=`<line x1="${GL}" y1="${yi}" x2="${GR}" y2="${yi}" stroke="${v===0?'#bbb':'#f2f2f2'}" stroke-width="${v===0?1.5:1}"/>`;
    if(v!==0) s+=`<text x="${GL-6}" y="${yi+4}" text-anchor="end" font-size="11" fill="#aaa">${v}</text>`;
  }
  /* curve */
  let segs=[],pts=[];
  for(let i=0;i<=360;i++){
    const x=P.xmin+(P.xmax-P.xmin)*i/360, y=evalP(P.terms,x);
    if(Math.abs(y)<=P.ymax) pts.push(`${gx(x).toFixed(1)},${gy(y).toFixed(1)}`);
    else {if(pts.length>1) segs.push(pts); pts=[];}
  }
  if(pts.length>1) segs.push(pts);
  segs.forEach(p=>{s+=`<polyline points="${p.join(' ')}" fill="none" stroke="var(--c-purple)" stroke-width="3" stroke-linejoin="round"/>`;});
  /* tangent */
  const fa=evalP(P.terms,a), m=evalP(ds,a);
  const span=(P.xmax-P.xmin)*0.28;
  const seg=clipLine(a,fa,m,Math.max(P.xmin,a-span),Math.min(P.xmax,a+span),P.ymax);
  const t1=seg?seg[0]:a, t2=seg?seg[1]:a;
  if(seg) s+=`<line x1="${gx(t1)}" y1="${gy(fa+m*(t1-a))}" x2="${gx(t2)}" y2="${gy(fa+m*(t2-a))}" stroke="var(--c-orange)" stroke-width="2.5"/>`;
  /* slope triangle */
  const run=Math.min(span*0.6,(P.xmax-a));
  if(run>0.05 && Math.abs(fa)<=P.ymax && Math.abs(fa+m*run)<=P.ymax){
    s+=`<line x1="${gx(a)}" y1="${gy(fa)}" x2="${gx(a+run)}" y2="${gy(fa)}" stroke="var(--c-orange)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    s+=`<line x1="${gx(a+run)}" y1="${gy(fa)}" x2="${gx(a+run)}" y2="${gy(fa+m*run)}" stroke="var(--c-orange)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  }
  s+=`<line x1="${gx(a)}" y1="${GT}" x2="${gx(a)}" y2="${GB}" stroke="var(--c-orange)" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>`;
  if(Math.abs(fa)<=P.ymax){
    s+=`<circle cx="${gx(a)}" cy="${gy(fa)}" r="6.5" fill="var(--c-purple)" stroke="#fff" stroke-width="2"><animate attributeName="r" values="6.5;10;6.5" dur="1.6s" repeatCount="indefinite"/></circle>`;
  }
  /* fixed label slots */
  s+=`<foreignObject x="12" y="4" width="380" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;height:100%;font-size:14px;color:var(--c-purple);white-space:nowrap">${T(polyTex(P.terms,'y','x'))}</div></foreignObject>`;
  s+=`<foreignObject x="400" y="4" width="188" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:flex-end;height:100%;font-size:14px;color:var(--c-orange);white-space:nowrap">傾き ${fmtv(m).s}</div></foreignObject>`;
  s+=`<foreignObject x="${GR-22}" y="${gy(0)-26}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('x')}</div></foreignObject>`;
  const alx=Math.max(0,Math.min(GW-84,gx(a)-42));
  s+=`<foreignObject x="${alx}" y="${GB+22}" width="84" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:13px;font-weight:700;color:var(--c-orange)">${T('a = '+fmtv(a).s)}</div></foreignObject>`;
  document.getElementById('graph').innerHTML=s;
  updateCalc();
}

function updateCalc(){
  const P=PROBLEMS[cur], a=aVal, ds=dterms(P);
  const fa=fmtv(evalP(P.terms,a)), m=fmtv(evalP(ds,a)), as=fmtv(a).s;
  let at=(ds.length===0)?'0':ds.map((t,i)=>mono(t.p,t.q,t.n,i===0,'('+as+')')).join('');
  const sub=(at===m.s)?'':at+' '+rel(m.exact)+' ';
  document.getElementById('live-calc').innerHTML =
    `<div class="row">${T(polyTex(dterms(P),"y'",'x'))}</div>` +
    `<div class="row" style="color:var(--c-orange);font-weight:600">${T('a = '+as+"\\;\\text{のとき}\\;y'(a) = "+sub+m.s)}</div>` +
    `<div class="row" style="color:var(--c-purple)">${T('\\text{接点の }y\\text{ 座標}\\; '+rel(fa.exact)+'\\; '+fa.s)}</div>` +
    `<div class="row" style="color:var(--c-orange)">${T("\\text{この点での接線の傾き} "+rel(m.exact)+" "+m.s)}</div>`;
}

function setupSlider(){
  const sl=document.getElementById('a-slider'), va=document.getElementById('a-value');
  sl.addEventListener('input',()=>{aVal=parseFloat(sl.value);va.textContent=fmtv(aVal).s;drawGraph();});
}
function setupAnimation(){
  document.getElementById('anim-btn').addEventListener('click',()=>{
    if(animId){cancelAnimationFrame(animId);animId=null;}
    const P=PROBLEMS[cur], s0=P.xmin, s1=P.xmax, dur=3400;
    const sl=document.getElementById('a-slider'), va=document.getElementById('a-value');
    let start=null;
    function step(ts){
      if(!start) start=ts;
      const pr=Math.min((ts-start)/dur,1);
      const e=pr<0.5?2*pr*pr:1-Math.pow(-2*pr+2,2)/2;
      aVal=Math.round((s0+(s1-s0)*e)*10)/10;
      sl.value=aVal; va.textContent=fmtv(aVal).s;
      drawGraph();
      if(pr<1) animId=requestAnimationFrame(step); else animId=null;
    }
    animId=requestAnimationFrame(step);
  });
}
function setupDrag(){
  const svg=document.getElementById('graph'), wrap=document.getElementById('svg-wrap');
  let dragging=false;
  function toX(cx){
    const P=PROBLEMS[cur], rect=svg.getBoundingClientRect();
    const sx=(cx-rect.left)/rect.width*GW;
    return P.xmin+(sx-GL)/(GR-GL)*(P.xmax-P.xmin);
  }
  function setA(cx){
    const P=PROBLEMS[cur];
    let x=Math.round(toX(cx)*10)/10;
    aVal=Math.max(P.xmin,Math.min(P.xmax,x));
    document.getElementById('a-slider').value=aVal;
    document.getElementById('a-value').textContent=fmtv(aVal).s;
    drawGraph();
  }
  function startDrag(cx){ if(animId){cancelAnimationFrame(animId);animId=null;} dragging=true; setA(cx); }
  wrap.addEventListener('mousedown',e=>{e.preventDefault();startDrag(e.clientX);});
  window.addEventListener('mousemove',e=>{if(dragging){e.preventDefault();setA(e.clientX);}});
  window.addEventListener('mouseup',()=>{dragging=false;});
  wrap.addEventListener('touchstart',e=>{const t=e.touches[0];startDrag(t.clientX);},{passive:true});
  wrap.addEventListener('touchmove',e=>{if(dragging){e.preventDefault();const t=e.touches[0];setA(t.clientX);}},{passive:false});
  wrap.addEventListener('touchend',()=>{dragging=false;});
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
