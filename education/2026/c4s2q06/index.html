<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>逆数と累乗根の対数</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .tabs { display: flex; gap: .6rem; margin: .75rem 0; }
  .tab {
    flex: 1; text-align: center; padding: .8rem .4rem; border: 1px solid #d4dbeb;
    border-radius: 10px; background: #fff; color: var(--accent); font-weight: 600;
    cursor: pointer; min-height: 48px; font-family: inherit; font-size: 1rem; user-select: none;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.05rem; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row {
    display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem;
  }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.8rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; margin: .5rem 0; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>逆数と累乗根の対数</h1>
  <p class="subtitle">対数の性質を使って、逆数と累乗根の 2 つの等式を証明しましょう。</p>

  <h2>示したい 2 つの等式</h2>
  <div class="formula-box" id="f-goal"></div>
  <p>証明に使う道具はこの 2 つだけです。新しい規則は使いません。</p>
  <div class="formula-box" id="f-tools"></div>
  <div class="note" id="f-note"></div>

  <h2>証明ウォークスルー</h2>
  <div class="tabs">
    <button class="tab active" id="tab0">逆数の対数</button>
    <button class="tab" id="tab1">累乗根の対数</button>
  </div>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>ものさしで見よう</h2>
  <p id="fig-desc"></p>

  <div class="slider-row" id="row-n">
    <label><span id="lbl-N"></span> =</label>
    <input type="range" id="n-slider" min="-4" max="4" step="0.05" value="1.6">
    <span class="slider-val" id="n-value">3.0314</span>
  </div>
  <div class="slider-row" id="row-m">
    <label><span id="lbl-M"></span> =</label>
    <input type="range" id="m-slider" min="1" max="16" step="0.1" value="8">
    <span class="slider-val" id="m-value">8.0</span>
  </div>
  <div class="slider-row" id="row-k">
    <label><span id="lbl-k"></span> =</label>
    <input type="range" id="k-slider" min="2" max="5" step="1" value="3">
    <span class="slider-val" id="k-value">3</span>
  </div>

  <div class="anim-btn-row"><button class="btn primary" id="anim-btn">アニメーション</button></div>

  <div class="svg-container" id="svg-wrap">
    <svg id="fig" viewBox="0 0 600 290" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <p class="drag-hint" id="hint"></p>

  <div class="live-calc" id="live-calc"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=290,RY=200,BX0=45,BX1=555;
let U0=-4.3,U1=4.3;
function X(u){return BX0+(u-U0)/(U1-U0)*(BX1-BX0);}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function L2(v){return Math.log(v)/Math.log(2);}
function n3(v){return String(parseFloat(v.toPrecision(5)));}
function f3(v){return (Math.abs(v)<0.0005?0:v).toFixed(3);}
function f1(v){return (Math.abs(v)<0.05?0:v).toFixed(1);}
function rootTex(n,inner){return (n===2)?('\\sqrt{'+inner+'}'):('\\sqrt['+n+']{'+inner+'}');}
function tickTex(u){
  if(u===0) return '1';
  if(u>0) return String(Math.pow(2,u));
  return '\\frac{1}{'+Math.pow(2,-u)+'}';
}

let mode=0, uN=1.6, mVal=8, kVal=3, foldT=1, animId=null, cur=0;

const PROOFS=[
  [
    {label:'Step 1: 商の対数の性質を用意する',
     formula:'\\log_a \\dfrac{M}{N} = \\log_a M - \\log_a N \\qquad \\text{（商の対数）}'},
    {label:'Step 2: 分子を 1 にする',
     formula:'M = 1 \\;\\text{とおくと}\\quad \\log_a \\dfrac{1}{N} = \\log_a 1 - \\log_a N'},
    {label:'Step 3: 1 の対数は 0',
     formula:'\\log_a 1 = 0 \\;\\text{より}\\quad \\log_a \\dfrac{1}{N} = 0 - \\log_a N'},
    {label:'Step 4: 結論',
     formula:'\\log_a \\dfrac{1}{N} = -\\log_a N'},
    {label:'Step 5: 別の導き方（累乗の対数から）',
     formula:'\\log_a \\dfrac{1}{N} = \\log_a N^{-1} = (-1)\\log_a N = -\\log_a N'}
  ],
  [
    {label:'Step 1: 累乗根を指数で書き直す',
     formula:'\\sqrt[n]{M} = M^{\\frac{1}{n}}'},
    {label:'Step 2: 累乗の対数の性質を用意する',
     formula:'\\log_a M^{r} = r\\log_a M \\qquad \\text{（}r\\text{ は実数）}'},
    {label:'Step 3: 指数を r とみる',
     formula:'r = \\dfrac{1}{n} \\;\\text{とおく}'},
    {label:'Step 4: 代入する',
     formula:'\\log_a \\sqrt[n]{M} = \\log_a M^{\\frac{1}{n}} = \\dfrac{1}{n}\\log_a M'},
    {label:'Step 5: 数で確かめる',
     formula:'\\log_2 \\sqrt[3]{8} = \\dfrac{1}{3}\\log_2 8 = \\dfrac{1}{3}\\times 3 = 1'}
  ]
];

function init(){
  document.getElementById('f-goal').innerHTML=
    T('\\log_a \\dfrac{1}{N} = -\\log_a N')+'<br>'+T('\\log_a \\sqrt[n]{M} = \\dfrac{1}{n}\\log_a M');
  document.getElementById('f-tools').innerHTML=
    '<b>②</b>　'+T('\\log_a \\dfrac{M}{N} = \\log_a M - \\log_a N')+'<br>'+
    '<b>③</b>　'+T('\\log_a M^{r} = r\\log_a M');
  document.getElementById('f-note').innerHTML=
    '前提は '+T('a>0,\\; a \\ne 1,\\; M>0,\\; N>0')+' で、'+T('n')+' は 2 以上の整数です。'+
    T('\\log_a 1 = 0')+' も使います。';
  document.getElementById('lbl-N').innerHTML=T('N');
  document.getElementById('lbl-M').innerHTML=T('M');
  document.getElementById('lbl-k').innerHTML=T('n');
  setupTabs();
  setupSteps();
  setupSliders();
  setupAnimation();
  setupDrag();
  applyMode();
}

function applyMode(){
  document.getElementById('tab0').classList.toggle('active',mode===0);
  document.getElementById('tab1').classList.toggle('active',mode===1);
  document.getElementById('row-n').style.display=(mode===0)?'flex':'none';
  document.getElementById('row-m').style.display=(mode===1)?'flex':'none';
  document.getElementById('row-k').style.display=(mode===1)?'flex':'none';
  document.getElementById('fig-desc').innerHTML=(mode===0)
    ? '目盛りの位置が対数の値になるものさしです。'+T('N')+' と '+T('\\frac{1}{N}')+' は、位置 '+T('1')+' を折り目にしてつねに左右対称になります。'
    : 'バー全体の長さが '+T('\\log_2 M')+' です。これを '+T('n')+' 等分した 1 つ分が '+T('\\log_2 \\sqrt[n]{M}')+' になります。'+'どの底でも同じことが成り立ちますが、ここでは底を 2 にしています。';
  document.getElementById('hint').innerHTML=(mode===0)
    ? '緑のバーをドラッグすると '+T('N')+' が変わります。'
    : '青いバーをドラッグすると '+T('M')+' が変わります。';
  cur=0;
  renderSteps();
  draw();
}

function setupTabs(){
  document.getElementById('tab0').addEventListener('click',()=>{if(mode!==0){stopAnim();mode=0;applyMode();}});
  document.getElementById('tab1').addEventListener('click',()=>{if(mode!==1){stopAnim();mode=1;applyMode();}});
}

function renderSteps(){
  const steps=PROOFS[mode];
  let html='';
  for(let i=0;i<=cur;i++){
    html+=`<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
  }
  document.getElementById('walkthrough').innerHTML=html;
  document.getElementById('counter').textContent=`${cur+1} / ${steps.length}`;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===steps.length-1;
}

function setupSteps(){
  document.getElementById('prev').addEventListener('click',()=>{if(cur>0){cur--;renderSteps();}});
  document.getElementById('next').addEventListener('click',()=>{if(cur<PROOFS[mode].length-1){cur++;renderSteps();}});
}

function ruler(){
  let s='';
  s+=`<line x1="${X(U0)+6}" y1="${RY}" x2="${X(U1)-2}" y2="${RY}" stroke="#555" stroke-width="2"/>`;
  s+=`<polygon points="${X(U1)-2},${RY} ${X(U1)-12},${RY-5} ${X(U1)-12},${RY+5}" fill="#555"/>`;
  const lo=Math.ceil(U0), hi=Math.floor(U1);
  for(let u=lo;u<=hi;u++){
    s+=`<line x1="${X(u)}" y1="${RY-8}" x2="${X(u)}" y2="${RY+8}" stroke="${u===0?'#555':'#999'}" stroke-width="${u===0?2.5:1.5}"/>`;
    s+=`<rect x="${X(u)-21}" y="${RY+12}" width="42" height="40" fill="#fff" rx="4"/>`;
    s+=`<foreignObject x="${X(u)-25}" y="${RY+12}" width="50" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#777;text-align:center;padding-top:5px">${T(tickTex(u))}</div></foreignObject>`;
  }
  return s;
}
function tri(x,col){return `<polygon points="${x},${RY-9} ${x-6},${RY-19} ${x+6},${RY-19}" fill="${col}"/>`;}
function chip(x,y,latex,col,bg){
  return `<rect x="${x}" y="${y}" width="150" height="34" rx="9" fill="${bg}" stroke="${col}" stroke-width="1.5"/>`+
    `<foreignObject x="${x+4}" y="${y+2}" width="142" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:${col};font-weight:700;text-align:center;white-space:nowrap">${T(latex)}</div></foreignObject>`;
}
function bar(xa,xb,y,col){
  const a=Math.min(xa,xb), w=Math.max(Math.abs(xb-xa),1);
  return `<rect x="${a}" y="${y}" width="${w}" height="15" rx="4" fill="${col}" opacity="0.85"/>`;
}

function draw(){
  const svg=document.getElementById('fig');
  let s='';
  if(mode===0){
    U0=-4.3;U1=4.3;
    const x0=X(0), xN=X(uN), xR=X(-uN*foldT), xRend=X(-uN);
    const Nv=Math.pow(2,uN);
    s+=chip(14,8,'N = '+n3(Nv),'var(--c-green)','#f1faf3');
    s+=chip(436,8,'\\frac{1}{N} = '+n3(1/Nv),'var(--c-purple)','#f8f6ff');
    s+=`<text x="${W/2}" y="30" text-anchor="middle" font-size="12" fill="#999">1 が折り目</text>`;
    const ax=xN, bx=xRend;
    s+=`<path d="M ${ax} 104 Q ${(ax+bx)/2} 44 ${bx} 104" fill="none" stroke="var(--c-orange)" stroke-width="2" stroke-dasharray="6 5" opacity="0.75"/>`;
    const t=foldT;
    const cxq=(1-t)*(1-t)*ax+2*(1-t)*t*((ax+bx)/2)+t*t*bx;
    const cyq=(1-t)*(1-t)*104+2*(1-t)*t*44+t*t*104;
    s+=`<circle cx="${cxq}" cy="${cyq}" r="7" fill="var(--c-orange)"/>`;
    s+=`<line x1="${x0}" y1="40" x2="${x0}" y2="${RY+10}" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    s+=bar(x0,xN,112,'var(--c-green)');
    s+=bar(x0,xR,142,'var(--c-purple)');
    s+=`<foreignObject x="${clamp((x0+xN)/2-60,4,W-124)}" y="84" width="120" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-green);font-weight:600;text-align:center">${T('\\log_2 N')}</div></foreignObject>`;
    s+=`<foreignObject x="${clamp((x0+xRend)/2-60,4,W-124)}" y="162" width="120" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-purple);font-weight:600;text-align:center">${T('-\\log_2 N')}</div></foreignObject>`;
    s+=ruler();
    s+=tri(xN,'var(--c-green)');
    s+=tri(xRend,'var(--c-purple)');
    s+=`<circle cx="${xN}" cy="119" r="9" fill="var(--c-green)" stroke="#fff" stroke-width="2.5"/>`;
    s+=`<circle cx="${xRend}" cy="149" r="8" fill="var(--c-purple)" stroke="#fff" stroke-width="2.5"/>`;
    s+=`<circle cx="${xRend}" cy="149" r="8" fill="none" stroke="var(--c-purple)" stroke-width="3"><animate attributeName="r" values="8;15;8" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0;0.8" dur="1.6s" repeatCount="indefinite"/></circle>`;
    s+=`<text x="${W/2}" y="278" text-anchor="middle" font-size="12" fill="#999">長さは同じで向きが反対。だから対数は符号だけが変わります</text>`;
    svg.innerHTML=s;
    document.getElementById('live-calc').innerHTML=
      T('\\log_2 '+n3(Nv)+' = '+f3(uN))+'<br>'+
      T('\\log_2 \\dfrac{1}{'+n3(Nv)+'} = '+f3(-uN))+'<br>'+
      '<span style="color:var(--c-purple);font-weight:600;">2 つの和はつねに 0 です</span>';
  }else{
    U0=-0.35;U1=4.35;
    const x0=X(0), uM=L2(mVal), xM=X(uM), n=kVal;
    const uRoot=uM/n, xRoot=X(uRoot), root=Math.pow(mVal,1/n);
    s+=chip(14,8,'M = '+f1(mVal),'var(--c-blue)','#eef4ff');
    s+=chip(436,8,rootTex(n,'M')+' = '+n3(root),'var(--c-purple)','#f8f6ff');
    s+=`<text x="${W/2}" y="30" text-anchor="middle" font-size="12" fill="#999">バーを ${n} 等分</text>`;
    s+=`<line x1="${x0}" y1="60" x2="${x0}" y2="${RY+10}" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    s+=`<rect x="${x0}" y="112" width="${Math.max(xM-x0,1)}" height="22" rx="5" fill="var(--c-blue)" opacity="0.18" stroke="var(--c-blue)" stroke-width="1.5"/>`;
    s+=`<rect x="${x0}" y="112" width="${Math.max(xRoot-x0,1)}" height="22" rx="5" fill="var(--c-purple)" opacity="0.8"/>`;
    for(let i=1;i<n;i++){
      const xi=x0+(xM-x0)*i/n;
      s+=`<line x1="${xi}" y1="110" x2="${xi}" y2="136" stroke="#fff" stroke-width="2.5"/>`;
      s+=`<line x1="${xi}" y1="110" x2="${xi}" y2="136" stroke="var(--c-blue)" stroke-width="1.2" stroke-dasharray="3 3"/>`;
    }
    s+=`<line x1="${x0}" y1="150" x2="${xRoot}" y2="150" stroke="var(--c-purple)" stroke-width="2"/>`;
    s+=`<line x1="${x0}" y1="146" x2="${x0}" y2="154" stroke="var(--c-purple)" stroke-width="2"/>`;
    s+=`<line x1="${xRoot}" y1="146" x2="${xRoot}" y2="154" stroke="var(--c-purple)" stroke-width="2"/>`;
    s+=`<foreignObject x="${clamp((x0+xM)/2-70,4,W-144)}" y="80" width="140" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-blue);font-weight:600;text-align:center">${T('\\log_2 M')}</div></foreignObject>`;
    s+=`<foreignObject x="${clamp((x0+xRoot)/2-75,4,W-154)}" y="158" width="150" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-purple);font-weight:600;text-align:center">${T('\\frac{1}{'+n+'}\\log_2 M')}</div></foreignObject>`;
    s+=ruler();
    s+=tri(xM,'var(--c-blue)');
    s+=tri(xRoot,'var(--c-purple)');
    s+=`<circle cx="${xM}" cy="123" r="9" fill="var(--c-blue)" stroke="#fff" stroke-width="2.5"/>`;
    s+=`<circle cx="${xRoot}" cy="123" r="8" fill="var(--c-purple)" stroke="#fff" stroke-width="2.5"/>`;
    s+=`<circle cx="${xRoot}" cy="123" r="8" fill="none" stroke="var(--c-purple)" stroke-width="3"><animate attributeName="r" values="8;15;8" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0;0.8" dur="1.6s" repeatCount="indefinite"/></circle>`;
    s+=`<text x="${W/2}" y="278" text-anchor="middle" font-size="12" fill="#999">長さが ${n} 分の 1 になるので、対数も ${n} 分の 1 になります</text>`;
    svg.innerHTML=s;
    document.getElementById('live-calc').innerHTML=
      T('\\log_2 '+f1(mVal)+' = '+f3(uM))+'<br>'+
      T('\\dfrac{1}{'+n+'}\\log_2 '+f1(mVal)+' = '+f3(uRoot))+'<br>'+
      T('\\log_2 '+rootTex(n,f1(mVal))+' = \\log_2 '+n3(root)+' = '+f3(uRoot))+'<br>'+
      '<span style="color:var(--c-purple);font-weight:600;">下 2 つの値は一致します</span>';
  }
}

function setupSliders(){
  const ns=document.getElementById('n-slider'), nv=document.getElementById('n-value');
  ns.addEventListener('input',()=>{stopAnim();uN=parseFloat(ns.value);foldT=1;nv.textContent=n3(Math.pow(2,uN));draw();});
  const ms=document.getElementById('m-slider'), mv=document.getElementById('m-value');
  ms.addEventListener('input',()=>{stopAnim();mVal=parseFloat(ms.value);mv.textContent=f1(mVal);draw();});
  const ks=document.getElementById('k-slider'), kv=document.getElementById('k-value');
  ks.addEventListener('input',()=>{stopAnim();kVal=parseInt(ks.value,10);kv.textContent=kVal;draw();});
}
function sync(){
  document.getElementById('n-slider').value=uN;
  document.getElementById('n-value').textContent=n3(Math.pow(2,uN));
  document.getElementById('m-slider').value=mVal;
  document.getElementById('m-value').textContent=f1(mVal);
  document.getElementById('k-slider').value=kVal;
  document.getElementById('k-value').textContent=kVal;
}
function stopAnim(){if(animId){cancelAnimationFrame(animId);animId=null;}}

function setupAnimation(){
  document.getElementById('anim-btn').addEventListener('click',()=>{
    stopAnim();
    const dur=(mode===0)?1800:3200;
    const m0=mode;
    let t0=null;
    if(mode===0) foldT=0;
    function step(ts){
      if(!t0) t0=ts;
      const pr=Math.min((ts-t0)/dur,1);
      const e=pr<0.5?2*pr*pr:1-Math.pow(-2*pr+2,2)/2;
      if(m0===0){ foldT=e; }
      else{ mVal=1+15*e; sync(); }
      draw();
      if(pr<1) animId=requestAnimationFrame(step);
      else{ animId=null; if(m0===0){foldT=1;}else{mVal=16;sync();} draw(); }
    }
    animId=requestAnimationFrame(step);
  });
}

function setupDrag(){
  const svg=document.getElementById('fig');
  const wrap=document.getElementById('svg-wrap');
  let dragging=false;
  function toSvg(cx,cy){
    const rect=svg.getBoundingClientRect();
    return {x:(cx-rect.left)/rect.width*W, y:(cy-rect.top)/rect.height*H};
  }
  function startDrag(cx,cy){
    stopAnim();
    const p=toSvg(cx,cy);
    dragging=(p.y>=100&&p.y<=140);
    if(dragging) moveDrag(cx,cy);
  }
  function moveDrag(cx,cy){
    if(!dragging) return;
    const p=toSvg(cx,cy);
    const u=clamp((p.x-BX0)/(BX1-BX0)*(U1-U0)+U0,U0,U1);
    if(mode===0){ uN=clamp(Math.round(u*20)/20,-4,4); foldT=1; }
    else{ mVal=clamp(Math.round(Math.pow(2,u)*10)/10,1,16); }
    sync();draw();
  }
  function endDrag(){dragging=false;}
  wrap.addEventListener('mousedown',e=>{e.preventDefault();startDrag(e.clientX,e.clientY);});
  window.addEventListener('mousemove',e=>{if(dragging){e.preventDefault();moveDrag(e.clientX,e.clientY);}});
  window.addEventListener('mouseup',endDrag);
  wrap.addEventListener('touchstart',e=>{const t=e.touches[0];startDrag(t.clientX,t.clientY);},{passive:true});
  wrap.addEventListener('touchmove',e=>{if(dragging){e.preventDefault();const t=e.touches[0];moveDrag(t.clientX,t.clientY);}},{passive:false});
  wrap.addEventListener('touchend',endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
