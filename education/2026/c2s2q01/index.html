<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>円の方程式</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa;
    --fg: #333;
    --muted: #888;
    --accent: #2a6df4;
    --c-a: #d9534f;
    --c-b: #2a6df4;
    --c-circle: #5cb85c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 {
    font-size: 1.15rem; margin: 2.25rem 0 .75rem;
    border-left: 4px solid var(--accent); padding-left: .6rem;
  }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.3rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none;
    position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .live-calc {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; text-align: center;
    overflow-x: auto;
  }
  .live-calc .katex { font-size: 1.25rem; }

  .note {
    background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px;
    padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem;
  }

  .slider-row {
    display: flex; align-items: center; gap: .75rem;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: .75rem 0;
  }
  .slider-row label { font-weight: 600; min-width: 2.5rem; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .val { min-width: 2.5rem; text-align: right; font-weight: 600; color: var(--accent); }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step {
    padding: .75rem .25rem; border-bottom: 1px dashed #eee;
    animation: fadeIn .3s ease;
  }
  .step:last-child { border-bottom: none; }
  .step.current {
    background: #f0f5ff; border-radius: 8px; padding: .75rem;
    margin: .25rem -.5rem; border-bottom: none;
  }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.2rem; }
  .step.current .formula-line .katex { font-size: 1.35rem; }

  .controls-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; margin: 1rem 0 0;
  }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter {
    color: var(--muted); font-size: .9rem; text-align: center; flex: 1;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { r: 8; } 50% { r: 11; } }
  @keyframes drawCircle { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<main>
  <h1>円の方程式</h1>
  <p class="subtitle">円の方程式の定義と導き方を視覚的に理解しましょう。</p>

  <h2>円の定義</h2>
  <p>平面上の定点 C から一定の距離 <span id="f-r-label"></span> にある点 P の軌跡を<strong>円</strong>といいます。定点 C を<strong>中心</strong>、距離 <span id="f-r-label2"></span> を<strong>半径</strong>といいます。</p>

  <h2>公式の導出</h2>
  <p>中心 C(<span id="f-ab-label"></span>) 、半径 <span id="f-r-label3"></span> の円上の任意の点を P(<span id="f-xy-label"></span>) とすると、</p>
  <div class="formula-box" id="formula-cp"></div>
  <p>両辺を2乗すると、円の方程式が得られます。</p>
  <div class="formula-box" id="formula-main"></div>

  <div class="note" id="note-origin"></div>

  <h2>座標平面で確かめよう</h2>
  <p>中心をドラッグで移動し、スライダーで半径を変えてみましょう。</p>

  <div class="svg-container" id="svg-wrap">
    <svg id="plane" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="slider-row">
    <label>半径 <span id="lbl-r"></span></label>
    <input type="range" id="slider-r" min="0.5" max="6" step="0.5" value="3">
    <span class="val" id="val-r">3</span>
  </div>

  <div class="live-calc" id="live-calc"></div>

  <h2>導出の手順</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev">&larr; 戻る</button>
    <div class="step-counter">ステップ <span id="step-cur"></span> / <span id="step-tot"></span></div>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>
</main>

<script>
  function tex(latex, el, dm) { katex.render(latex, el, { throwOnError: false, displayMode: !!dm }); }
  function T(l) { return katex.renderToString(l, { throwOnError: false }); }

  /* state */
  let cx = 2, cy = 1, cr = 3;
  const GRID_MIN = -7, GRID_MAX = 7;
  const SVG_SIZE = 600;
  const PAD = 40;
  const usable = SVG_SIZE - 2 * PAD;

  function toSvgX(v) { return PAD + (v - GRID_MIN) / (GRID_MAX - GRID_MIN) * usable; }
  function toSvgY(v) { return PAD + (GRID_MAX - v) / (GRID_MAX - GRID_MIN) * usable; }
  function toMathX(sx) { return Math.round((sx - PAD) / usable * (GRID_MAX - GRID_MIN) + GRID_MIN); }
  function toMathY(sy) { return Math.round(GRID_MAX - (sy - PAD) / usable * (GRID_MAX - GRID_MIN)); }

  /* animation state */
  let animAngle = 0;
  let animFrame = null;

  function drawSVG() {
    const svg = document.getElementById('plane');
    let s = '';

    /* grid lines */
    for (let i = GRID_MIN; i <= GRID_MAX; i++) {
      const x = toSvgX(i), y = toSvgY(i);
      s += `<line x1="${x}" y1="${PAD}" x2="${x}" y2="${SVG_SIZE-PAD}" stroke="${i===0?'#999':'#e8e8e8'}" stroke-width="${i===0?1.5:1}"/>`;
      s += `<line x1="${PAD}" y1="${y}" x2="${SVG_SIZE-PAD}" y2="${y}" stroke="${i===0?'#999':'#e8e8e8'}" stroke-width="${i===0?1.5:1}"/>`;
    }

    /* axis labels */
    s += `<foreignObject x="${SVG_SIZE-PAD-2}" y="${toSvgY(0)-10}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999;text-align:center">${T('x')}</div></foreignObject>`;
    s += `<foreignObject x="${toSvgX(0)-12}" y="${PAD-28}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999;text-align:center">${T('y')}</div></foreignObject>`;
    /* tick labels */
    for (let i = GRID_MIN; i <= GRID_MAX; i++) {
      if (i === 0) continue;
      s += `<text x="${toSvgX(i)}" y="${toSvgY(0)+18}" text-anchor="middle" font-size="11" fill="#aaa">${i}</text>`;
      s += `<text x="${toSvgX(0)-10}" y="${toSvgY(i)+4}" text-anchor="end" font-size="11" fill="#aaa">${i}</text>`;
    }
    s += `<text x="${toSvgX(0)-10}" y="${toSvgY(0)+18}" text-anchor="end" font-size="11" fill="#aaa">O</text>`;

    /* circle */
    const scx = toSvgX(cx), scy = toSvgY(cy);
    const sr = cr / (GRID_MAX - GRID_MIN) * usable;
    const circumference = 2 * Math.PI * sr;
    s += `<circle cx="${scx}" cy="${scy}" r="${sr}" fill="rgba(42,109,244,0.07)" stroke="var(--c-circle)" stroke-width="2.5" style="stroke-dasharray:${circumference};stroke-dashoffset:0;animation:none;"/>`;

    /* radius line */
    const px = cx + cr * Math.cos(animAngle);
    const py = cy + cr * Math.sin(animAngle);
    const spx = toSvgX(px), spy = toSvgY(py);
    s += `<line x1="${scx}" y1="${scy}" x2="${spx}" y2="${spy}" stroke="var(--c-a)" stroke-width="2" stroke-dasharray="6 3"/>`;

    /* radius label */
    const midRx = (scx + spx) / 2, midRy = (scy + spy) / 2;
    s += `<foreignObject x="${midRx+8}" y="${midRy-24}" width="120" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;font-weight:700;color:var(--c-a)">${T('r = '+cr)}</div></foreignObject>`;

    /* point P on circle */
    s += `<circle cx="${spx}" cy="${spy}" r="6" fill="var(--accent)" stroke="#fff" stroke-width="2"/>`;
    s += `<text x="${spx+12}" y="${spy-8}" font-size="13" font-weight="600" fill="var(--accent)">P</text>`;

    /* center C */
    s += `<circle cx="${scx}" cy="${scy}" r="8" fill="var(--c-a)" stroke="#fff" stroke-width="2" style="cursor:grab"/>`;
    s += `<text x="${scx+12}" y="${scy-12}" font-size="14" font-weight="700" fill="var(--c-a)">C(${cx}, ${cy})</text>`;

    svg.innerHTML = s;
    updateCalc();
  }

  function updateCalc() {
    const el = document.getElementById('live-calc');
    const aSign = cx >= 0 ? `- ${cx}` : `+ ${Math.abs(cx)}`;
    const bSign = cy >= 0 ? `- ${cy}` : `+ ${Math.abs(cy)}`;
    const r2 = cr * cr;
    /* display a clean fraction if possible */
    const r2str = Number.isInteger(r2) ? String(r2) : String(r2);
    el.innerHTML = T(`(x ${aSign})^2 + (y ${bSign})^2 = ${r2str}`);
  }

  /* animate point P */
  function animate() {
    animAngle += 0.012;
    if (animAngle > 2 * Math.PI) animAngle -= 2 * Math.PI;
    drawSVG();
    animFrame = requestAnimationFrame(animate);
  }

  /* drag handling */
  let dragging = false;
  function ptrDown(e) {
    const svg = document.getElementById('plane');
    const rect = svg.getBoundingClientRect();
    const scale = SVG_SIZE / rect.width;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const sx = (clientX - rect.left) * scale;
    const sy = (clientY - rect.top) * scale;
    const scx = toSvgX(cx), scy = toSvgY(cy);
    const dist = Math.sqrt((sx - scx) ** 2 + (sy - scy) ** 2);
    if (dist < 30) {
      dragging = true;
      e.preventDefault();
    }
  }
  function ptrMove(e) {
    if (!dragging) return;
    e.preventDefault();
    const svg = document.getElementById('plane');
    const rect = svg.getBoundingClientRect();
    const scale = SVG_SIZE / rect.width;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const sx = (clientX - rect.left) * scale;
    const sy = (clientY - rect.top) * scale;
    cx = Math.max(GRID_MIN + 1, Math.min(GRID_MAX - 1, toMathX(sx)));
    cy = Math.max(GRID_MIN + 1, Math.min(GRID_MAX - 1, toMathY(sy)));
  }
  function ptrUp() { dragging = false; }

  /* walkthrough steps */
  const steps = [
    { title: "円の定義", tex: "\\text{中心 }\\mathrm{C}(a, b) \\text{ から距離 } r \\text{ にある点 }\\mathrm{P}(x, y) \\text{ の軌跡}" },
    { title: "CP の距離", tex: "\\mathrm{CP} = \\sqrt{(x-a)^2 + (y-b)^2} = r" },
    { title: "両辺を2乗", tex: "(x-a)^2 + (y-b)^2 = r^2" },
    { title: "標準形の円の方程式", tex: "\\boxed{(x-a)^2 + (y-b)^2 = r^2}" },
    { title: "特に原点中心のとき", tex: "a = 0,\\; b = 0 \\;\\Rightarrow\\; x^2 + y^2 = r^2" }
  ];
  let curStep = 0;

  function renderWalk() {
    const root = document.getElementById('walkthrough');
    let html = '';
    for (let i = 0; i <= curStep; i++) {
      const st = steps[i];
      const cls = i === curStep ? 'current' : '';
      html += `<div class="step ${cls}">
        <div class="label">${st.title}</div>
        <div class="formula-line">${T(st.tex)}</div>
      </div>`;
    }
    root.innerHTML = html;
    document.getElementById('step-cur').textContent = curStep + 1;
    document.getElementById('step-tot').textContent = steps.length;
    document.getElementById('prev').disabled = curStep === 0;
    document.getElementById('next').disabled = curStep === steps.length - 1;
  }

  function init() {
    /* formula labels */
    document.getElementById('f-r-label').innerHTML = T("r");
    document.getElementById('f-r-label2').innerHTML = T("r");
    document.getElementById('f-r-label3').innerHTML = T("r");
    document.getElementById('f-ab-label').innerHTML = T("a,\\,b");
    document.getElementById('f-xy-label').innerHTML = T("x,\\,y");
    tex("\\mathrm{CP} = \\sqrt{(x-a)^2+(y-b)^2} = r", document.getElementById('formula-cp'), true);
    tex("(x-a)^2 + (y-b)^2 = r^2", document.getElementById('formula-main'), true);

    /* note */
    document.getElementById('note-origin').innerHTML =
      "特に、中心が原点 O のときは " + T("a=0,\\;b=0") + " なので、方程式は " + T("x^2+y^2=r^2") + " となります。";

    /* slider label */
    document.getElementById('lbl-r').innerHTML = T('r');

    /* slider */
    const slider = document.getElementById('slider-r');
    slider.addEventListener('input', () => {
      cr = parseFloat(slider.value);
      document.getElementById('val-r').textContent = cr;
    });

    /* SVG & animation */
    drawSVG();
    animate();

    /* drag events */
    const wrap = document.getElementById('svg-wrap');
    wrap.addEventListener('mousedown', ptrDown);
    wrap.addEventListener('mousemove', ptrMove);
    wrap.addEventListener('mouseup', ptrUp);
    wrap.addEventListener('mouseleave', ptrUp);
    wrap.addEventListener('touchstart', ptrDown, { passive: false });
    wrap.addEventListener('touchmove', ptrMove, { passive: false });
    wrap.addEventListener('touchend', ptrUp);

    /* walkthrough buttons */
    document.getElementById('prev').addEventListener('click', () => {
      if (curStep > 0) { curStep--; renderWalk(); }
    });
    document.getElementById('next').addEventListener('click', () => {
      if (curStep < steps.length - 1) { curStep++; renderWalk(); }
    });
    renderWalk();
  }

  if (window.katex) init();
  else window.addEventListener("DOMContentLoaded", () => {
    if (window.katex) init();
    else { const w = setInterval(() => { if (window.katex) { clearInterval(w); init(); } }, 30); }
  });
</script>
</body>
</html>
