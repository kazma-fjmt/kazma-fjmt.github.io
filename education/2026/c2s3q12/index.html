<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>積の形で表される不等式の表す領域</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step {
    padding: .75rem .25rem; border-bottom: 1px dashed #eee;
    animation: fadeIn .3s ease;
  }
  .step:last-child { border-bottom: none; }
  .step.current {
    background: #f0f5ff; border-radius: 8px; padding: .75rem;
    margin: .25rem -.5rem; border-bottom: none;
  }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; margin: 1rem 0 0;
  }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .note {
    background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px;
    padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem;
  }
  .live-calc {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto;
  }
  .live-calc .katex { font-size: 1.1rem; }

  .drag-hint {
    text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0;
  }

  .legend {
    display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center;
    margin: .5rem 0;
  }
  .legend-item {
    display: flex; align-items: center; gap: .35rem; font-size: .85rem;
  }
  .legend-swatch {
    width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>積の形で表される不等式の表す領域</h1>
  <p class="subtitle">積 (A)(B) &gt; 0 が成り立つ領域を視覚的に理解しましょう。</p>

  <h2>考え方</h2>
  <div class="note" id="note-key"></div>

  <h2>例題6</h2>
  <p>不等式 <span id="f-problem"></span> の表す領域を図示せよ。</p>

  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>領域を確かめよう</h2>
  <p>テスト点をドラッグして、各因数の符号と積の正負を確認しましょう。</p>
  <p class="drag-hint">テスト点をタップ＆ドラッグで移動できます</p>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:rgba(42,109,244,0.25);border:1px solid var(--c-blue);"></div>領域A（両方正）</div>
    <div class="legend-item"><div class="legend-swatch" style="background:rgba(217,83,79,0.25);border:1px solid var(--c-red);"></div>領域B（両方負）</div>
  </div>

  <div class="live-calc" id="live-calc"></div>

  <div class="formula-box" id="result-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=600,ox=300,oy=300,scale=60;
const GRID_MIN=-4,GRID_MAX=5;

function px(x){return ox+x*scale;}
function py(y){return oy-y*scale;}

/* Draggable test point */
let testX = 2, testY = -0.5;

function init(){
  /* Key insight */
  document.getElementById('note-key').innerHTML =
    '<strong>ポイント：</strong>' + T('(A)(B) > 0') + ' が成り立つのは次の2つの場合：<br>' +
    '<strong>場合(1)：</strong>' + T('A > 0') + ' かつ ' + T('B > 0') + '（両方正）<br>' +
    '<strong>場合(2)：</strong>' + T('A < 0') + ' かつ ' + T('B < 0') + '（両方負）<br>' +
    '結果は2つの場合の<strong>和集合</strong>（' + T('\\mathrm{A} \\cup \\mathrm{B}') + '）になります。';

  document.getElementById('f-problem').innerHTML = T('(x - y)(x + y - 1) > 0');

  tex('\\text{領域は2つの楔形の和集合（境界を含まない）}', document.getElementById('result-box'), true);

  initWalkthrough();
  drawGraph();
  setupDrag();
}

/* Walkthrough */
function initWalkthrough(){
  const steps = [
    { label: 'Step 1: 積が正になる条件',
      formula: '(x-y)(x+y-1) > 0 \\;\\Leftrightarrow\\; \\text{両因数が同符号}' },
    { label: 'Step 2: 場合(1) — 両方正',
      formula: '\\begin{cases} x - y > 0 \\\\ x + y - 1 > 0 \\end{cases} \\;\\Rightarrow\\; \\begin{cases} y < x \\\\ y > -x + 1 \\end{cases}' },
    { label: 'Step 3: 場合(2) — 両方負',
      formula: '\\begin{cases} x - y < 0 \\\\ x + y - 1 < 0 \\end{cases} \\;\\Rightarrow\\; \\begin{cases} y > x \\\\ y < -x + 1 \\end{cases}' },
    { label: 'Step 4: 2直線の交点',
      formula: 'y = x \\text{ と } y = -x+1 \\text{ の交点：} x = \\tfrac{1}{2},\\; y = \\tfrac{1}{2}' },
    { label: 'Step 5: 領域A（場合(1)）',
      formula: '\\text{直線 } y=x \\text{ の下側 かつ 直線 } y=-x+1 \\text{ の上側}' },
    { label: 'Step 6: 領域B（場合(2)）',
      formula: '\\text{直線 } y=x \\text{ の上側 かつ 直線 } y=-x+1 \\text{ の下側}' },
    { label: 'Step 7: 結論',
      formula: '\\text{求める領域は } \\mathrm{A} \\cup \\mathrm{B}\\text{（2つの楔形、境界を含まない）}' },
  ];

  let cur = 0;
  const container = document.getElementById('walkthrough');
  const counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');

  function render(){
    let html = '';
    for(let i=0;i<=cur;i++){
      html += `<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML = html;
    counter.textContent = `${cur+1} / ${steps.length}`;
    prevBtn.disabled = cur===0;
    nextBtn.disabled = cur===steps.length-1;
  }

  prevBtn.addEventListener('click', ()=>{ if(cur>0){cur--;render();} });
  nextBtn.addEventListener('click', ()=>{ if(cur<steps.length-1){cur++;render();} });
  render();
}

/* SVG Graph */
function drawGraph(){
  const svg = document.getElementById('graph');
  let s = '';

  /* Grid */
  for(let i=GRID_MIN;i<=GRID_MAX;i++){
    const xi=px(i), yi=py(i);
    s+=`<line x1="${xi}" y1="${py(GRID_MAX)}" x2="${xi}" y2="${py(GRID_MIN)}" stroke="${i===0?'#999':'#eee'}" stroke-width="${i===0?1.5:1}"/>`;
    s+=`<line x1="${px(GRID_MIN)}" y1="${yi}" x2="${px(GRID_MAX)}" y2="${yi}" stroke="${i===0?'#999':'#eee'}" stroke-width="${i===0?1.5:1}"/>`;
  }

  /* Axis labels */
  s+=`<foreignObject x="${Math.min(px(GRID_MAX)+2,W-26)}" y="${oy-20}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('x')}</div></foreignObject>`;
  s+=`<foreignObject x="${ox+6}" y="${Math.max(py(GRID_MAX)-18,2)}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('y')}</div></foreignObject>`;
  s+=`<text x="${ox+5}" y="${oy+18}" font-size="12" fill="#999">O</text>`;

  /* Tick labels */
  for(let i=GRID_MIN;i<=GRID_MAX;i++){
    if(i===0) continue;
    s+=`<text x="${px(i)}" y="${oy+18}" text-anchor="middle" font-size="11" fill="#aaa">${i}</text>`;
    s+=`<text x="${ox-10}" y="${py(i)+4}" text-anchor="end" font-size="11" fill="#aaa">${i}</text>`;
  }

  /* Shade regions using clip paths */
  /* Region A: y < x AND y > -x+1 (below y=x, above y=-x+1) */
  /* Region B: y > x AND y < -x+1 (above y=x, below y=-x+1) */
  /* We'll draw as polygons clipped to the viewport */

  const xMin = GRID_MIN, xMax = GRID_MAX, yMin = GRID_MIN, yMax = GRID_MAX;

  /* Region A: the wedge to the right of intersection (1/2, 1/2)
     Bounded by y=x (below) and y=-x+1 (above), extending to the right */
  /* Intersection: (0.5, 0.5) */
  /* At right edge (xMax): y=x gives yMax_line=xMax, y=-x+1 gives yMin_line=-xMax+1 */
  /* At bottom (yMin): x=yMin on y=x, and x=-yMin+1 on y=-x+1 */

  /* Region A polygon: start at intersection, go along y=-x+1 upward-right, then along bottom-right, then along y=x back */
  const ix = 0.5, iy = 0.5;

  /* Region A: below y=x, above y=-x+1 */
  /* Build polygon for Region A within viewport */
  let polyA = [];
  polyA.push([ix, iy]);
  /* Along y=-x+1 going right (this is the upper boundary of region A) */
  polyA.push([xMax, -xMax + 1]);
  /* Down right edge */
  polyA.push([xMax, yMin]);
  /* Along bottom edge to where y=x meets bottom */
  /* y=x at y=yMin means x=yMin */
  polyA.push([yMin, yMin]);
  /* Along y=x going back to intersection */
  /* We need to close: from (yMin, yMin) back along y=x to intersection */

  let pathA = `M ${px(polyA[0][0])} ${py(polyA[0][1])}`;
  for(let i=1;i<polyA.length;i++) pathA += ` L ${px(polyA[i][0])} ${py(polyA[i][1])}`;
  pathA += ' Z';
  s += `<path d="${pathA}" fill="rgba(42,109,244,0.2)" stroke="none"/>`;

  /* Region B: above y=x, below y=-x+1 */
  let polyB = [];
  polyB.push([ix, iy]);
  /* Along y=x going left-down (this is the lower boundary of region B) */
  /* At left edge: y=x at x=xMin gives y=xMin */
  polyB.push([xMin, xMin]);
  /* Up along left edge */
  polyB.push([xMin, yMax]);
  /* Along top edge to where y=-x+1 meets top */
  /* y=-x+1 at y=yMax means x=1-yMax */
  polyB.push([1-yMax, yMax]);
  /* Along y=-x+1 going back to intersection */

  let pathB = `M ${px(polyB[0][0])} ${py(polyB[0][1])}`;
  for(let i=1;i<polyB.length;i++) pathB += ` L ${px(polyB[i][0])} ${py(polyB[i][1])}`;
  pathB += ' Z';
  s += `<path d="${pathB}" fill="rgba(217,83,79,0.2)" stroke="none"/>`;

  /* Lines y=x and y=-x+1 */
  s+=`<line x1="${px(xMin)}" y1="${py(xMin)}" x2="${px(xMax)}" y2="${py(xMax)}" stroke="var(--c-blue)" stroke-width="2.5" stroke-dasharray="8 4"/>`;
  s+=`<foreignObject x="${px(3.5)+5}" y="${py(3.5)-28}" width="80" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-blue);font-weight:600;white-space:nowrap">${T('y = x')}</div></foreignObject>`;

  s+=`<line x1="${px(xMin)}" y1="${py(-xMin+1)}" x2="${px(xMax)}" y2="${py(-xMax+1)}" stroke="var(--c-red)" stroke-width="2.5" stroke-dasharray="8 4"/>`;
  s+=`<foreignObject x="${px(-2.5)+5}" y="${py(3.5)-28}" width="150" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-red);font-weight:600;white-space:nowrap">${T('y = -x + 1')}</div></foreignObject>`;

  /* Intersection point */
  s+=`<circle cx="${px(0.5)}" cy="${py(0.5)}" r="5" fill="var(--c-orange)" stroke="#fff" stroke-width="2"/>`;
  s+=`<text x="${px(0.5)+10}" y="${py(0.5)-8}" font-size="12" fill="var(--c-orange)" font-weight="600">(1/2, 1/2)</text>`;

  /* Region labels */
  s+=`<text x="${px(3)}" y="${py(-1)}" font-size="15" fill="var(--c-blue)" font-weight="700" text-anchor="middle" opacity="0.7">A</text>`;
  s+=`<text x="${px(-1.5)}" y="${py(2.5)}" font-size="15" fill="var(--c-red)" font-weight="700" text-anchor="middle" opacity="0.7">B</text>`;

  /* Test point */
  const fA = testX - testY;
  const fB = testX + testY - 1;
  const product = fA * fB;
  const inRegion = product > 0;

  const ptColor = inRegion ? 'var(--c-green)' : '#999';
  s+=`<circle cx="${px(testX)}" cy="${py(testY)}" r="12" fill="${ptColor}" stroke="#fff" stroke-width="3" style="cursor:grab">`;
  s+=`<animate attributeName="r" values="12;15;12" dur="2s" repeatCount="indefinite"/></circle>`;
  s+=`<text x="${px(testX)+16}" y="${py(testY)-12}" font-size="13" font-weight="700" fill="${ptColor}">P(${testX.toFixed(1)}, ${testY.toFixed(1)})</text>`;

  svg.innerHTML = s;

  /* Live calc */
  const lcEl = document.getElementById('live-calc');
  const signA = fA > 0 ? '+' : (fA < 0 ? '-' : '0');
  const signB = fB > 0 ? '+' : (fB < 0 ? '-' : '0');
  const resultSign = product > 0 ? '> 0 \\;\\checkmark' : (product < 0 ? '< 0 \\;\\times' : '= 0');

  lcEl.innerHTML =
    T(`x - y = ${fA.toFixed(2)} \\;(${signA})`) + '<br>' +
    T(`x + y - 1 = ${fB.toFixed(2)} \\;(${signB})`) + '<br>' +
    T(`(x-y)(x+y-1) = ${product.toFixed(2)} \\;${resultSign}`) + '<br>' +
    (inRegion
      ? '<span style="color:var(--c-green);font-weight:600;">領域内にあります</span>'
      : '<span style="color:#999;">領域外です</span>');
}

/* Drag */
function setupDrag(){
  const svg = document.getElementById('graph');
  const wrap = document.getElementById('svg-wrap');
  let dragging = false;

  function toMath(cx, cy){
    const rect = svg.getBoundingClientRect();
    const svgX = (cx - rect.left) / rect.width * W;
    const svgY = (cy - rect.top) / rect.height * H;
    return { x: (svgX - ox)/scale, y: (oy - svgY)/scale };
  }

  function startDrag(cx, cy){
    const m = toMath(cx, cy);
    const d = Math.sqrt((m.x - testX)**2 + (m.y - testY)**2);
    if(d < 0.8) dragging = true;
  }

  function moveDrag(cx, cy){
    if(!dragging) return;
    const m = toMath(cx, cy);
    testX = Math.max(GRID_MIN + 0.3, Math.min(GRID_MAX - 0.3, m.x));
    testY = Math.max(GRID_MIN + 0.3, Math.min(GRID_MAX - 0.3, m.y));
    testX = Math.round(testX * 10) / 10;
    testY = Math.round(testY * 10) / 10;
    drawGraph();
  }

  function endDrag(){ dragging = false; }

  wrap.addEventListener('mousedown', e=>{ e.preventDefault(); startDrag(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e=>{ if(dragging){ e.preventDefault(); moveDrag(e.clientX, e.clientY); } });
  window.addEventListener('mouseup', endDrag);

  wrap.addEventListener('touchstart', e=>{ const t=e.touches[0]; startDrag(t.clientX, t.clientY); }, {passive:true});
  wrap.addEventListener('touchmove', e=>{ if(dragging){ e.preventDefault(); const t=e.touches[0]; moveDrag(t.clientX, t.clientY); } }, {passive:false});
  wrap.addEventListener('touchend', endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
</body>
</html>
