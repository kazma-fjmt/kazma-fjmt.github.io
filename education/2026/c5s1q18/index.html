<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>変数が異なる関数の微分</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0; }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; margin: .75rem 0; overflow: hidden; touch-action: none; position: relative; }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* draw() replaces the SVG contents, which would orphan a touch sequence that
     started on a child; keep hit-testing on the wrapper so the drag survives */
  .svg-container > svg { pointer-events: none; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto; }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; gap: .5rem; margin: .75rem 0; }
  .tab { appearance: none; flex: 1; border: 1px solid #d4dbeb; background: #fff; color: var(--accent); font-size: .95rem; font-weight: 600; padding: .7rem .5rem; border-radius: 10px; min-height: 48px; cursor: pointer; font-family: inherit; user-select: none; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row { display: flex; align-items: center; gap: 1rem; margin: .75rem 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; margin: .5rem 0; }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; justify-content: center; margin: .5rem 0 0; font-size: .88rem; }
  .legend > span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend > span > i { display: inline-block; width: 22px; height: 4px; border-radius: 2px; font-style: normal; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>変数が異なる関数の微分</h1>
  <p class="subtitle">変数の文字が変わっても微分の手順は同じであることを、動く図で確かめましょう。</p>

  <h2>基本の考え方</h2>
  <p>変数が <span id="f-x"></span> でなくても、微分の公式はそのまま使えます。変数が <span id="f-t"></span> なら導関数は <span id="f-dhdt"></span>、変数が <span id="f-r"></span> なら <span id="f-dsdr"></span> と書きます。<span id="f-pi"></span> のような文字も定数なので、そのまま前に出せます。</p>
  <div class="formula-box" id="f-key"></div>

  <h2>解く問題</h2>
  <div class="formula-box" id="f-problem"></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <div class="tabs">
    <button class="tab active" id="tab1">(1) 投げ上げの高さ</button>
    <button class="tab" id="tab2">(2) 円の面積</button>
  </div>
  <p id="mode-desc"></p>

  <div class="slider-row">
    <label><span id="lbl-var"></span> =</label>
    <input type="range" id="p-slider" min="0" max="2" step="0.1" value="0.4">
    <span class="slider-val" id="p-value">0.4</span>
  </div>

  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">アニメーション</button>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 430" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend" id="legend"></div>
  <p class="drag-hint" id="drag-hint"></p>

  <div class="live-calc" id="live-calc"></div>
  <div class="note" id="note-box"></div>

  <h2>答え</h2>
  <div class="formula-box" id="result-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=430;
/* Mode 1: launch column and the h-t graph share one height scale */
const BX=95, HY0=405, HSC=50.7, TX0=210, TSC=160.9;
function hy(h){return HY0-(h+1)*HSC;} function pT(t){return TX0+(t+0.1)*TSC;}
/* Mode 2: circle on the left, the S-r graph on the right */
const CX=155, CY=195, RSC=44, DR=0.25, STRIP_Y=352, STRIP_SC=16;
const RX0=330, RSC2=86.2, SY0=390, SSC=12.2;
function pR(r){return RX0+(r+0.1)*RSC2;} function sy(S){return SY0-(S+1)*SSC;}

function hf(t){return 10*t-5*t*t;}   function dhf(t){return 10-10*t;}
function Sf(r){return Math.PI*r*r;}  function dSf(r){return 2*Math.PI*r;}

function num(v,d){
  let s=v.toFixed(d);
  if(parseFloat(s)===0) s=(0).toFixed(d);
  s=s.replace(/\.?0+$/,'');
  return (s===''||s==='-') ? '0' : s;
}
function rel(v,d){ return Math.abs(parseFloat(v.toFixed(d))-v)<1e-9 ? '=' : '\\approx'; }
/* shorten the slope triangle so it never leaves the drawing area */
function clampRun(base, x, val, slope, lo, hi, xmax){
  let run = Math.min(base, xmax-x);
  if(Math.abs(slope)>1e-9) run = Math.min(run, Math.abs((slope>0 ? hi-val : val-lo)/slope));
  return run;
}

let mode = 1;
let pVal = 0.4;
let animId = null;

function init(){
  const spans = {'f-x':'x','f-t':'t','f-r':'r','f-dhdt':'\\dfrac{dh}{dt}','f-dsdr':'\\dfrac{dS}{dr}','f-pi':'\\pi'};
  for(const id in spans) document.getElementById(id).innerHTML = T(spans[id]);
  tex('(t^n)\'=nt^{n-1},\\qquad \\{k\\,g(r)\\}\'=k\\,g\'(r)', document.getElementById('f-key'), true);
  tex('(1)\\;\\; h=10t-5t^2\\;\\;[\\,t\\,] \\qquad (2)\\;\\; S=\\pi r^2\\;\\;[\\,r\\,]', document.getElementById('f-problem'), true);
  tex('(1)\\;\\dfrac{dh}{dt}=10-10t \\qquad (2)\\;\\dfrac{dS}{dr}=2\\pi r', document.getElementById('result-box'), true);

  initWalkthrough();
  setupTabs();
  setupSlider();
  setupAnim();
  setupDrag();
  applyMode();
}

function initWalkthrough(){
  const steps = [
    { label: 'Step 1: 変数の文字を確かめる', formula: "\\text{(1) は }t\\text{ の関数、(2) は }r\\text{ の関数}" },
    { label: 'Step 2: (1) を項ごとに微分する', formula: "(10t)'=10,\\qquad (5t^2)'=5\\cdot 2t=10t" },
    { label: 'Step 3: (1) の導関数', formula: "\\dfrac{dh}{dt}=10-10t" },
    { label: 'Step 4: (2) の定数を前に出す', formula: "\\dfrac{dS}{dr}=(\\pi r^2)'=\\pi\\,(r^2)'" },
    { label: 'Step 5: (2) を微分する', formula: "\\pi\\,(r^2)'=\\pi\\cdot 2r=2\\pi r" },
    { label: 'Step 6: 答え', formula: "\\dfrac{dh}{dt}=10-10t,\\qquad \\dfrac{dS}{dr}=2\\pi r" },
    { label: 'Step 7: 意味を読む', formula: "\\text{(1) は速さ、(2) は半径 }r\\text{ の円の周の長さ}" }
  ];
  let cur = 0;
  const container = document.getElementById('walkthrough'), counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=cur;i++){
      html += `<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML = html;
    counter.textContent = `${cur+1} / ${steps.length}`;
    prevBtn.disabled = cur===0;
    nextBtn.disabled = cur===steps.length-1;
  }
  prevBtn.addEventListener('click', ()=>{ if(cur>0){cur--;render();} });
  nextBtn.addEventListener('click', ()=>{ if(cur<steps.length-1){cur++;render();} });
  render();
}

function drawMode1(){
  const t = pVal, h = hf(t), v = dhf(t);
  let s = '';
  /* Tick numbers are collected here and drawn after the curve and the tangent */
  let ticks = '';
  /* The orange marker under the axis reserves this box */
  const mark = {x:pT(t)-14, y:hy(0)+2, w:28, h:22};
  const clear = r => !(r.x < mark.x+mark.w && mark.x < r.x+r.w && r.y < mark.y+mark.h && mark.y < r.y+r.h);
  s += `<rect x="30" y="30" width="${TX0-45}" height="390" fill="#fbfcff"/>`;
  s += `<rect x="${TX0-8}" y="30" width="${580-TX0+14}" height="390" fill="#fcfcff"/>`;

  /* Left: launch column */
  s += `<line x1="40" y1="${hy(0)}" x2="150" y2="${hy(0)}" stroke="#8a8a8a" stroke-width="3"/>`;
  s += `<line x1="${BX}" y1="${hy(5.8)}" x2="${BX}" y2="${hy(0)}" stroke="#e6e6e6" stroke-width="1.5" stroke-dasharray="4 5"/>`;
  for(let k=1;k<=5;k++){
    s += `<line x1="${BX-7}" y1="${hy(k)}" x2="${BX+7}" y2="${hy(k)}" stroke="#ddd" stroke-width="1.5"/>`;
    ticks += `<text x="${BX-12}" y="${hy(k)+4}" text-anchor="end" font-size="11" fill="#aaa" paint-order="stroke" stroke="#fff" stroke-width="3">${k}</text>`;
  }
  /* velocity arrow */
  const L = Math.abs(v)*3.2;
  if(L > 3){
    const dir = v>0 ? -1 : 1;
    const y0 = hy(h) + dir*13, y1 = hy(h) + dir*(13+L);
    s += `<line x1="${BX+26}" y1="${y0}" x2="${BX+26}" y2="${y1}" stroke="var(--c-red)" stroke-width="3.5"/>`;
    s += `<path d="M ${BX+26} ${y1+dir*8} L ${BX+20} ${y1} L ${BX+32} ${y1} Z" fill="var(--c-red)"/>`;
  } else {
    s += `<circle cx="${BX+26}" cy="${hy(h)}" r="5" fill="none" stroke="var(--c-red)" stroke-width="2.5"/>`;
  }
  s += `<circle cx="${BX}" cy="${hy(h)}" r="12" fill="var(--c-green)" stroke="#fff" stroke-width="2.5"/>`;
  /* link the ball to the graph */
  s += `<line x1="${BX+14}" y1="${hy(h)}" x2="${pT(t)}" y2="${hy(h)}" stroke="#cfe0c9" stroke-width="1.5" stroke-dasharray="4 5"/>`;

  /* Right: h-t graph axes */
  s += `<line x1="${pT(-0.1)}" y1="${hy(0)}" x2="${pT(2.2)}" y2="${hy(0)}" stroke="#999" stroke-width="1.5"/>`;
  s += `<line x1="${pT(0)}" y1="${hy(5.8)}" x2="${pT(0)}" y2="${hy(-1)}" stroke="#999" stroke-width="1.5"/>`;
  for(let k=1;k<=2;k++){
    s += `<line x1="${pT(k)}" y1="${hy(5.8)}" x2="${pT(k)}" y2="${hy(-1)}" stroke="#eee" stroke-width="1"/>`;
    if(clear({x:pT(k)-4, y:hy(0)+6, w:8, h:13}))
      ticks += `<text x="${pT(k)}" y="${hy(0)+16}" text-anchor="middle" font-size="11" fill="#aaa" paint-order="stroke" stroke="#fff" stroke-width="3">${k}</text>`;
  }
  for(let k=1;k<=5;k++){
    s += `<line x1="${pT(-0.1)}" y1="${hy(k)}" x2="${pT(2.2)}" y2="${hy(k)}" stroke="#eee" stroke-width="1"/>`;
    ticks += `<text x="${pT(0)-7}" y="${hy(k)+4}" text-anchor="end" font-size="11" fill="#aaa" paint-order="stroke" stroke="#fff" stroke-width="3">${k}</text>`;
  }
  /* trajectory */
  let d='';
  for(let k=0;k<=60;k++){
    const u=k/30, y=hf(u);
    d += (k===0?'M':'L') + ` ${pT(u).toFixed(1)} ${hy(y).toFixed(1)}`;
  }
  s += `<path d="${d}" fill="none" stroke="var(--c-blue)" stroke-width="2.5"/>`;
  /* tangent */
  let lo=-0.1, hi=2.2;
  if(Math.abs(v)>1e-9){
    const p=t+(-1-h)/v, q=t+(5.8-h)/v;
    lo=Math.max(lo,Math.min(p,q)); hi=Math.min(hi,Math.max(p,q));
  }
  if(hi>lo) s += `<line x1="${pT(lo)}" y1="${hy(h+v*(lo-t))}" x2="${pT(hi)}" y2="${hy(h+v*(hi-t))}" stroke="var(--c-orange)" stroke-width="3"/>`;
  /* slope triangle */
  const run=clampRun(0.3, t, h, v, -1, 5.8, 2.2), gx0=pT(t), gy0=hy(h);
  if(run>0.03){
    const gx1=pT(t+run), gy1=hy(h+v*run);
    s += `<path d="M ${gx0} ${gy0} L ${gx1} ${gy0} L ${gx1} ${gy1} Z" fill="rgba(230,126,34,0.16)" stroke="var(--c-orange)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  }
  s += ticks;
  s += `<circle cx="${pT(t)}" cy="${hy(h)}" r="8" fill="var(--c-orange)" stroke="#fff" stroke-width="2.5"><animate attributeName="r" values="8;11;8" dur="1.6s" repeatCount="indefinite"/></circle>`;

  /* labels */
  s += `<foreignObject x="40" y="40" width="120" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#28a745;font-weight:600;white-space:nowrap">${T('h\\;\\text{(m)}')}</div></foreignObject>`;
  s += `<foreignObject x="${TX0+4}" y="40" width="170" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#2a6df4;font-weight:600;white-space:nowrap">${T('h=10t-5t^2')}</div></foreignObject>`;
  s += `<foreignObject x="558" y="${hy(0)-26}" width="30" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#999">${T('t')}</div></foreignObject>`;
  s += `<foreignObject x="${pT(t)-14}" y="${hy(0)+2}" width="28" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#e67e22;font-weight:700;text-align:center;background:#fff;border-radius:4px">${T('t')}</div></foreignObject>`;
  return s;
}

function drawMode2(){
  const r = pVal, S = Sf(r), dS = dSf(r);
  let s = '';
  /* Tick numbers are collected here and drawn after the curve and the tangent */
  let ticks = '';
  s += `<rect x="20" y="30" width="${RX0-38}" height="390" fill="#fbfcff"/>`;
  s += `<rect x="${RX0-10}" y="30" width="${580-RX0+16}" height="390" fill="#fcfcff"/>`;

  /* Left: disc with a thin ring of width Δr */
  s += `<circle cx="${CX}" cy="${CY}" r="${(r+DR)*RSC}" fill="rgba(230,126,34,0.30)" stroke="none"/>`;
  s += `<circle cx="${CX}" cy="${CY}" r="${r*RSC}" fill="rgba(42,109,244,0.14)" stroke="var(--c-purple)" stroke-width="3"/>`;
  s += `<line x1="${CX}" y1="${CY}" x2="${CX+r*RSC}" y2="${CY}" stroke="var(--c-red)" stroke-width="2.5"/>`;
  s += `<circle cx="${CX}" cy="${CY}" r="4" fill="#666"/>`;
  s += `<circle cx="${CX+r*RSC}" cy="${CY}" r="8" fill="var(--c-red)" stroke="#fff" stroke-width="2.5"><animate attributeName="r" values="8;11;8" dur="1.6s" repeatCount="indefinite"/></circle>`;
  /* the ring unrolled into a strip: length 2πr, width Δr */
  const sw = dS*STRIP_SC, sh = DR*RSC;
  s += `<rect x="40" y="${STRIP_Y}" width="${sw}" height="${sh}" fill="rgba(230,126,34,0.30)" stroke="var(--c-orange)" stroke-width="1.5"/>`;
  s += `<foreignObject x="40" y="${STRIP_Y+sh+3}" width="230" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#e67e22;font-weight:600;white-space:nowrap">${T('2\\pi r \\times \\Delta r')}</div></foreignObject>`;
  s += `<foreignObject x="40" y="${STRIP_Y-26}" width="250" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#e67e22;font-weight:600;white-space:nowrap">${T('\\text{細い輪をのばした帯}')}</div></foreignObject>`;

  /* Right: S-r graph */
  s += `<line x1="${pR(-0.1)}" y1="${sy(0)}" x2="${pR(2.8)}" y2="${sy(0)}" stroke="#999" stroke-width="1.5"/>`;
  s += `<line x1="${pR(0)}" y1="${sy(26)}" x2="${pR(0)}" y2="${sy(-1)}" stroke="#999" stroke-width="1.5"/>`;
  for(let k=1;k<=2;k++){
    s += `<line x1="${pR(k)}" y1="${sy(26)}" x2="${pR(k)}" y2="${sy(-1)}" stroke="#eee" stroke-width="1"/>`;
    ticks += `<text x="${pR(k)}" y="${sy(0)+16}" text-anchor="middle" font-size="11" fill="#aaa" paint-order="stroke" stroke="#fff" stroke-width="3">${k}</text>`;
  }
  for(let v=5;v<=25;v+=5){
    s += `<line x1="${pR(-0.1)}" y1="${sy(v)}" x2="${pR(2.8)}" y2="${sy(v)}" stroke="#eee" stroke-width="1"/>`;
    ticks += `<text x="${pR(0)-7}" y="${sy(v)+4}" text-anchor="end" font-size="11" fill="#aaa" paint-order="stroke" stroke="#fff" stroke-width="3">${v}</text>`;
  }
  let d='';
  for(let k=0;k<=56;k++){
    const u=k/20, y=Sf(u);
    if(y>26) break;
    d += (k===0?'M':'L') + ` ${pR(u).toFixed(1)} ${sy(y).toFixed(1)}`;
  }
  s += `<path d="${d}" fill="none" stroke="var(--c-blue)" stroke-width="2.5"/>`;
  let lo=-0.1, hi=2.8;
  if(dS>1e-9){
    const p=r+(-1-S)/dS, q=r+(26-S)/dS;
    lo=Math.max(lo,Math.min(p,q)); hi=Math.min(hi,Math.max(p,q));
  }
  if(hi>lo) s += `<line x1="${pR(lo)}" y1="${sy(S+dS*(lo-r))}" x2="${pR(hi)}" y2="${sy(S+dS*(hi-r))}" stroke="var(--c-orange)" stroke-width="3"/>`;
  const run=clampRun(0.3, r, S, dS, -1, 26, 2.8), gx0=pR(r), gy0=sy(S);
  if(run>0.03){
    const gx1=pR(r+run), gy1=sy(S+dS*run);
    s += `<path d="M ${gx0} ${gy0} L ${gx1} ${gy0} L ${gx1} ${gy1} Z" fill="rgba(230,126,34,0.16)" stroke="var(--c-orange)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  }
  s += ticks;
  s += `<circle cx="${gx0}" cy="${gy0}" r="8" fill="var(--c-orange)" stroke="#fff" stroke-width="2.5"/>`;

  s += `<foreignObject x="${RX0+4}" y="40" width="150" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#2a6df4;font-weight:600;white-space:nowrap">${T('S=\\pi r^2')}</div></foreignObject>`;
  s += `<foreignObject x="558" y="${sy(0)-26}" width="30" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#999">${T('r')}</div></foreignObject>`;
  s += `<foreignObject x="30" y="40" width="200" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#7b61ff;font-weight:600;white-space:nowrap">${T('\\text{周の長さ }2\\pi r')}</div></foreignObject>`;
  return s;
}

function draw(){
  document.getElementById('graph').innerHTML = (mode===1) ? drawMode1() : drawMode2();
  updateLive();
}

function updateLive(){
  const lc = document.getElementById('live-calc');
  const note = document.getElementById('note-box');
  if(mode===1){
    const t=pVal, h=hf(t), v=dhf(t);
    lc.innerHTML =
      T(`t = ${num(t,1)}`) + '<br>' +
      T(`h = 10\\cdot ${num(t,1)}-5\\cdot ${num(t,1)}^2 = ${num(h,2)}`) + '<br>' +
      T(`\\dfrac{dh}{dt} = 10-10\\cdot ${num(t,1)} = ${num(v,1)}`);
    if(Math.abs(v)<1e-9){
      note.innerHTML = '導関数の値が 0 になりました。ここが最高点で、接線は ' + T('t') + ' 軸に平行です。上下の向きが切り替わる瞬間です。';
    } else if(v>0){
      note.innerHTML = '導関数の値が正なので上向きに進んでいます。接線は右上がりで、その傾きがそのまま速さです。';
    } else {
      note.innerHTML = '導関数の値が負なので下向きに進んでいます。接線は右下がりで、傾きの符号が向きを表します。';
    }
  } else {
    const r=pVal, S=Sf(r), dS=dSf(r);
    const ring = Math.PI*((r+DR)*(r+DR)-r*r);
    const strip = dS*DR;
    lc.innerHTML =
      T(`r = ${num(r,1)}`) + '<br>' +
      T(`S = \\pi\\cdot ${num(r,1)}^2 ${rel(S,3)} ${num(S,3)}`) + '<br>' +
      T(`\\dfrac{dS}{dr} = 2\\pi\\cdot ${num(r,1)} ${rel(dS,3)} ${num(dS,3)}`) + '<br>' +
      T(`\\Delta S=\\pi(r+\\Delta r)^2-\\pi r^2 ${rel(ring,3)} ${num(ring,3)}`) + '<br>' +
      T(`2\\pi r\\,\\Delta r ${rel(strip,3)} ${num(strip,3)}`);
    note.innerHTML = '半径を ' + T('\\Delta r = 0.25') + ' だけ増やすと、増える面積は細い輪の分です。輪をのばすと長さ ' + T('2\\pi r') + '、幅 ' + T('\\Delta r') + ' の帯になります。だから面積の変化率は円周 ' + T('2\\pi r') + ' に等しくなります。輪を細くするほど、2 つの値は近づきます。';
  }
}

function setP(v){
  const sl = document.getElementById('p-slider');
  const lo = parseFloat(sl.min), hiV = parseFloat(sl.max);
  pVal = Math.max(lo, Math.min(hiV, Math.round(v*10)/10));
  sl.value = pVal;
  document.getElementById('p-value').textContent = pVal.toFixed(1);
  draw();
}

function stopAnim(){ if(animId){ cancelAnimationFrame(animId); animId=null; } }

function applyMode(){
  const sl = document.getElementById('p-slider');
  document.getElementById('tab1').classList.toggle('active', mode===1);
  document.getElementById('tab2').classList.toggle('active', mode===2);
  if(mode===1){
    sl.min='0'; sl.max='2'; sl.step='0.1';
    document.getElementById('lbl-var').innerHTML = T('t');
    document.getElementById('mode-desc').innerHTML =
      '真上に投げ上げた物体の、' + T('t') + ' 秒後の高さが ' + T('h=10t-5t^2') + ' です。スライダーで時刻を変えると、右のグラフの接線の傾きが物体の速さになります。';
    document.getElementById('legend').innerHTML =
      '<span><i style="background:#28a745"></i>物体</span><span><i style="background:#d9534f"></i>速さの向き</span><span><i style="background:#2a6df4"></i>高さのグラフ</span><span><i style="background:#e67e22"></i>接線と傾きの三角形</span>';
    document.getElementById('drag-hint').textContent = '右のグラフを左右にドラッグしても時刻を変えられます。';
    setP(0.4);
  } else {
    sl.min='0.2'; sl.max='2.6'; sl.step='0.1';
    document.getElementById('lbl-var').innerHTML = T('r');
    document.getElementById('mode-desc').innerHTML =
      '半径 ' + T('r') + ' の円の面積は ' + T('S=\\pi r^2') + ' です。半径を少し増やしたときに増える面積が、円周の長さ ' + T('2\\pi r') + ' で決まることを確かめましょう。';
    document.getElementById('legend').innerHTML =
      '<span><i style="background:#d9534f"></i>半径</span><span><i style="background:#7b61ff"></i>円周</span><span><i style="background:#e67e22"></i>増える面積と接線</span><span><i style="background:#2a6df4"></i>面積のグラフ</span>';
    document.getElementById('drag-hint').textContent = '左の円の内側をドラッグしても半径を変えられます。';
    setP(1.2);
  }
}

function setupTabs(){
  document.getElementById('tab1').addEventListener('click', ()=>{ stopAnim(); mode=1; applyMode(); });
  document.getElementById('tab2').addEventListener('click', ()=>{ stopAnim(); mode=2; applyMode(); });
}

function setupSlider(){
  const sl = document.getElementById('p-slider');
  sl.addEventListener('input', ()=>{ stopAnim(); setP(parseFloat(sl.value)); });
}

function setupAnim(){
  document.getElementById('anim-btn').addEventListener('click', ()=>{
    stopAnim();
    const sl = document.getElementById('p-slider');
    const a0 = parseFloat(sl.min), a1 = parseFloat(sl.max), duration = 3800;
    let startTime = null;
    function animate(ts){
      if(!startTime) startTime = ts;
      const progress = Math.min((ts-startTime)/duration, 1);
      const eased = progress<0.5 ? 2*progress*progress : 1-Math.pow(-2*progress+2,2)/2;
      setP(a0 + (a1-a0)*eased);
      animId = progress<1 ? requestAnimationFrame(animate) : null;
    }
    animId = requestAnimationFrame(animate);
  });
}

function setupDrag(){
  const svg = document.getElementById('graph');
  const wrap = document.getElementById('svg-wrap');
  let dragging = false;

  function toSvg(cx, cy){
    const rect = svg.getBoundingClientRect();
    return { x:(cx-rect.left)/rect.width*W, y:(cy-rect.top)/rect.height*H };
  }
  function valueAt(pt){
    if(mode===1) return (pt.x-TX0)/TSC - 0.1;
    return Math.sqrt((pt.x-CX)*(pt.x-CX)+(pt.y-CY)*(pt.y-CY))/RSC;
  }
  function inArea(pt){
    if(mode===1) return pt.x > TX0-20 && pt.y > 30 && pt.y < 420;
    return pt.x < RX0-20 && pt.y > 30 && pt.y < 340;
  }
  function startDrag(cx, cy){
    const pt = toSvg(cx, cy);
    if(!inArea(pt)) return;
    stopAnim();
    dragging = true;
    setP(valueAt(pt));
  }
  function moveDrag(cx, cy){ if(dragging) setP(valueAt(toSvg(cx, cy))); }
  function endDrag(){ dragging = false; }

  wrap.addEventListener('mousedown', e => { e.preventDefault(); startDrag(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { if(dragging){ e.preventDefault(); moveDrag(e.clientX, e.clientY); } });
  window.addEventListener('mouseup', endDrag);

  wrap.addEventListener('touchstart', e => { const t=e.touches[0]; startDrag(t.clientX, t.clientY); }, {passive:true});
  wrap.addEventListener('touchmove', e => { if(dragging){ e.preventDefault(); const t=e.touches[0]; moveDrag(t.clientX, t.clientY); } }, {passive:false});
  wrap.addEventListener('touchend', endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
