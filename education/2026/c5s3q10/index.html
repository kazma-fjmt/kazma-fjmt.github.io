<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>定積分を含む関数</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0; }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; margin: .75rem 0; overflow: hidden; touch-action: none; position: relative; }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* draw() replaces the SVG contents, which would orphan a touch sequence that
     started on a child; keep hit-testing on the wrapper so the drag survives */
  .svg-container > svg { pointer-events: none; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto; }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; gap: .5rem; margin: .75rem 0; }
  .tab { appearance: none; flex: 1; border: 1px solid #d4dbeb; background: #fff; color: var(--accent); font-size: .95rem; font-weight: 600; padding: .7rem .5rem; border-radius: 10px; min-height: 48px; cursor: pointer; font-family: inherit; user-select: none; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }
  .live-calc > div { margin: .25rem 0; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row { display: flex; align-items: center; gap: 1rem; margin: .75rem 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; }
  .slider-row > label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row > input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row > .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; margin: .5rem 0; }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; justify-content: center; margin: .5rem 0 0; font-size: .88rem; }
  .legend > span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend > span > i { display: inline-block; width: 22px; height: 4px; border-radius: 2px; font-style: normal; }
  .legend > span > b { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
  .legend > span > u { display: inline-block; width: 18px; height: 13px; border-radius: 3px; text-decoration: none; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>定積分を含む関数</h1>
  <p class="subtitle">上端と下端が定数の定積分がただの数であることを、動く図で確かめましょう。</p>

  <h2>基本の考え方</h2>
  <p>定積分 <span id="f-int"></span> は上端も下端も定数なので、<span id="f-x2"></span> をどう変えても値は変わりません。つまりただの数です。そこでこの数を <span id="f-k"></span> とおくと、右辺から積分記号が消えて、ふつうの 1 次式になります。</p>
  <div class="formula-box" id="f-key"></div>

  <h2>解く問題</h2>
  <div class="formula-box" id="f-problem"></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <div class="tabs">
    <button class="tab active" id="tab1">もとの式</button>
    <button class="tab" id="tab2">別の式</button>
  </div>
  <p id="mode-desc"></p>

  <div class="slider-row">
    <label><span id="lbl-k"></span> =</label>
    <input type="range" id="k-slider" min="-4.5" max="0.5" step="0.1" value="0.5">
    <span class="slider-val" id="k-value">0.5</span>
  </div>

  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">ずれが 0 になるまで動かす</button>
    <button class="btn" id="reset-btn">はじめに戻す</button>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend" id="legend"></div>
  <p class="drag-hint" id="drag-hint"></p>

  <div class="live-calc" id="live-calc"></div>
  <div class="note" id="note-box"></div>

  <h2>答え</h2>
  <div class="formula-box" id="result-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=480,mL=58,mR=26,PW=W-mL-mR;
const TT=30,TH=252;                 /* upper panel: the line and the signed area */
const BT=336,BH=124,NL=400;         /* lower panel: one number line for both values */
const XMIN=-0.7,XMAX=2.7,YT0=-10,YT1=8;

/* p, q, b: f(x) = p x + q * (integral of f from 0 to b). c = p b^2 / 2, qb = q b */
const MODES={
  1:{p:3,q:2,b:2,c:6,qb:4,ks:-2,k0:0.5,lo:-4.5,hi:0.5,v0:-13,v1:9,vs:2,ans:'3x-4'},
  2:{p:4,q:3,b:1,c:2,qb:3,ks:-1,k0:0.5,lo:-3,hi:0.5,v0:-8,v1:4,vs:1,ans:'4x-3'}
};
let mode=1,kVal=0.5,animId=null;

function pxT(x){ return mL+(x-XMIN)/(XMAX-XMIN)*PW; }
function pyT(y){ return TT+TH-(y-YT0)/(YT1-YT0)*TH; }
function pxV(v){ const M=MODES[mode]; return mL+(v-M.v0)/(M.v1-M.v0)*PW; }

function fmt(v){
  if(Math.abs(v)<5e-13) v=0;
  let s=v.toFixed(6);
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  if(s==='-0') s='0';
  return s;
}
function par(v){ return v<0 ? '('+fmt(v)+')' : fmt(v); }
function rel(v){ return Math.abs(parseFloat(v.toFixed(6))-v)<1e-11 ? '=' : '\\fallingdotseq'; }
function lin(p,c){
  let s = p===1 ? 'x' : (p===-1 ? '-x' : fmt(p)+'x');
  if(Math.abs(c)>=5e-13) s += (c>0 ? '+'+fmt(c) : '-'+fmt(-c));
  return s;
}
function clipLine(m,x0,y0,ymin,ymax){
  const pts=[], yAt=x=>y0+m*(x-x0);
  [XMIN,XMAX].forEach(x=>{ const y=yAt(x); if(y>=ymin-1e-9 && y<=ymax+1e-9) pts.push({x:x,y:y}); });
  if(Math.abs(m)>1e-9){
    [ymin,ymax].forEach(y=>{ const x=x0+(y-y0)/m; if(x>=XMIN-1e-9 && x<=XMAX+1e-9) pts.push({x:x,y:y}); });
  }
  const u=[];
  for(const p of pts){ if(!u.some(q=>Math.abs(q.x-p.x)<1e-7 && Math.abs(q.y-p.y)<1e-7)) u.push(p); }
  return u.length>=2 ? [u[0],u[1]] : null;
}

function init(){
  const spans={'f-int':'\\int_0^2 f(t)dt','f-x2':'x','f-k':'k','lbl-k':'k'};
  for(const id in spans) document.getElementById(id).innerHTML=T(spans[id]);
  tex('\\int_0^2 f(t)dt = k \\quad \\Longrightarrow \\quad f(x)=3x+2k', document.getElementById('f-key'), true);
  tex('f(x) = 3x + 2\\int_0^2 f(t)dt \\ \\text{ を満たす } f(x)', document.getElementById('f-problem'), true);
  tex('f(x) = 3x - 4', document.getElementById('result-box'), true);
  initWalkthrough();
  setupTabs();
  setupSlider();
  setupAnim();
  setupDrag();
  applyMode();
}

function initWalkthrough(){
  const steps=[
    { label:'Step 1: 積分の部分を 1 つの文字におく', formula:'\\int_0^2 f(t)dt = k' },
    { label:'Step 2: 右辺から積分記号が消える',      formula:'f(x) = 3x + 2k' },
    { label:'Step 3: その式をもう一度積分に入れる',  formula:'k = \\int_0^2 (3t+2k)\\,dt' },
    { label:'Step 4: 原始関数を作って代入する',      formula:'k = \\left[\\dfrac{3}{2}t^2+2kt\\right]_0^2 = 6+4k' },
    { label:'Step 5: k についての方程式を解く',      formula:'k = 6+4k, \\qquad -3k = 6, \\qquad k = -2' },
    { label:'Step 6: k をもとの式にもどす',          formula:'f(x) = 3x + 2\\cdot(-2) = 3x-4' },
    { label:'Step 7: 確かめる',                      formula:'\\int_0^2 (3t-4)\\,dt = \\left[\\dfrac{3}{2}t^2-4t\\right]_0^2 = 6-8 = -2' },
    { label:'Step 8: 答え',                          formula:'f(x) = 3x-4' }
  ];
  let cur=0;
  const container=document.getElementById('walkthrough'), counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=cur;i++){
      html+=`<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${cur+1} / ${steps.length}`;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{ if(cur>0){cur--;render();} });
  nextBtn.addEventListener('click',()=>{ if(cur<steps.length-1){cur++;render();} });
  render();
}

function draw(){
  const M=MODES[mode], k=kVal, A=M.c+M.qb*k, gap=A-k, hit=Math.abs(gap)<0.05;
  const line=x=>M.p*x+M.q*k;
  const HALO2=' stroke="#fff" stroke-width="2.5" paint-order="stroke" stroke-linejoin="round"';
  const FO='font-size:13px;font-weight:600;white-space:nowrap;display:inline-block;background:#fff';
  let s='', ticks='';

  /* ---- upper panel: y = p x + q k and the signed area over [0, b] ---- */
  s+=`<rect x="${mL}" y="${TT}" width="${PW}" height="${TH}" fill="#fff" stroke="#e3e3e3"/>`;
  for(let i=0;i<=2;i++) s+=`<line x1="${pxT(i)}" y1="${TT}" x2="${pxT(i)}" y2="${TT+TH}" stroke="${i===0?'#999':'#eee'}" stroke-width="${i===0?1.5:1}"/>`;
  for(let v=-8;v<=8;v+=4) s+=`<line x1="${mL}" y1="${pyT(v)}" x2="${mL+PW}" y2="${pyT(v)}" stroke="${v===0?'#999':'#eee'}" stroke-width="${v===0?1.5:1}"/>`;

  const zero = Math.abs(M.p)>1e-9 ? -M.q*k/M.p : NaN;
  const cuts = (zero>1e-9 && zero<M.b-1e-9) ? [0,zero,M.b] : [0,M.b];
  for(let i=0;i<cuts.length-1;i++){
    const a=cuts[i], b=cuts[i+1], mid=(a+b)/2, up=line(mid)>=0;
    const col = up ? 'rgba(42,109,244,0.20)' : 'rgba(217,83,79,0.20)';
    s+=`<polygon points="${pxT(a)},${pyT(0)} ${pxT(a)},${pyT(line(a))} ${pxT(b)},${pyT(line(b))} ${pxT(b)},${pyT(0)}" fill="${col}"/>`;
    if(b-a>0.28){
      const cy=(pyT(0)+pyT(line(mid)))/2;
      s+=`<foreignObject x="${pxT(mid)-11}" y="${cy-12}" width="22" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px;font-weight:700;text-align:center;color:${up?'#2a6df4':'#d9534f'}">${up?'＋':'−'}</div></foreignObject>`;
    }
  }
  const seg=clipLine(M.p,0,M.q*k,YT0,YT1);
  if(seg) s+=`<line x1="${pxT(seg[0].x)}" y1="${pyT(seg[0].y)}" x2="${pxT(seg[1].x)}" y2="${pyT(seg[1].y)}" stroke="var(--c-purple)" stroke-width="3"/>`;
  [0,M.b].forEach(x=>{
    s+=`<line x1="${pxT(x)}" y1="${pyT(0)}" x2="${pxT(x)}" y2="${pyT(line(x))}" stroke="var(--c-purple)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    s+=`<circle cx="${pxT(x)}" cy="${pyT(line(x))}" r="5" fill="var(--c-purple)" stroke="#fff" stroke-width="2"/>`;
  });
  for(let i=1;i<=2;i++) ticks+=`<text x="${pxT(i)}" y="${pyT(0)+16}" text-anchor="middle" font-size="11" fill="#aaa"${HALO2}>${i}</text>`;
  for(let v=-8;v<=8;v+=4){ if(v===0) continue; ticks+=`<text x="${mL-8}" y="${pyT(v)+4}" text-anchor="end" font-size="11" fill="#aaa"${HALO2}>${v}</text>`; }
  s+=ticks;
  s+=`<foreignObject x="${mL+8}" y="${TT+4}" width="160" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="${FO};color:#7b61ff">${T('y='+M.p+'x+'+M.q+'k')}</div></foreignObject>`;
  s+=`<foreignObject x="${mL+PW-32}" y="${pyT(0)+2}" width="30" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="${FO};color:#999">${T('x')}</div></foreignObject>`;

  /* ---- connector from the shaded area down to the value it produces ---- */
  s+=`<line x1="${pxT(M.b/2)}" y1="${TT+TH}" x2="${pxV(A)}" y2="${NL-34}" stroke="#c9d3e8" stroke-width="1.5" stroke-dasharray="5 5"/>`;

  /* ---- lower panel: both numbers live on one number line ---- */
  s+=`<rect x="${mL}" y="${BT}" width="${PW}" height="${BH}" fill="#fff" stroke="#e3e3e3"/>`;
  s+=`<line x1="${mL+6}" y1="${NL}" x2="${mL+PW-6}" y2="${NL}" stroke="#999" stroke-width="1.5"/>`;
  s+=`<line x1="${pxV(M.ks)}" y1="${BT+6}" x2="${pxV(M.ks)}" y2="${BT+BH-6}" stroke="var(--c-green)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>`;
  let nt='';
  for(let v=Math.ceil(M.v0/M.vs)*M.vs; v<=M.v1; v+=M.vs){
    s+=`<line x1="${pxV(v)}" y1="${NL-5}" x2="${pxV(v)}" y2="${NL+5}" stroke="#bbb" stroke-width="1"/>`;
    /* the k marker sits just under the axis; drop the tick label it would cover */
    if(v%(M.vs*2)===0 && Math.abs(pxV(v)-pxV(k))>14) nt+=`<text x="${pxV(v)}" y="${NL+18}" text-anchor="middle" font-size="11" fill="#aaa"${HALO2}>${v}</text>`;
  }
  s+=nt;
  const cA = hit ? 'var(--c-green)' : 'var(--c-blue)';
  const cK = hit ? 'var(--c-green)' : 'var(--c-purple)';
  if(!hit) s+=`<line x1="${pxV(k)}" y1="${NL}" x2="${pxV(A)}" y2="${NL}" stroke="var(--c-orange)" stroke-width="4"/>`;
  s+=`<path d="M ${pxV(A)} ${NL-4} L ${pxV(A)-9} ${NL-19} L ${pxV(A)+9} ${NL-19} Z" fill="${cA}"/>`;
  s+=`<path d="M ${pxV(k)} ${NL+4} L ${pxV(k)-9} ${NL+19} L ${pxV(k)+9} ${NL+19} Z" fill="${cK}"/>`;
  const boxX=(cx,w)=>Math.max(2,Math.min(W-w-2,cx-w/2));
  s+=`<foreignObject x="${boxX(pxV(A),150)}" y="${NL-48}" width="150" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="${FO};text-align:center;color:${hit?'#28a745':'#2a6df4'}">${T('\\int_0^'+M.b+' f(t)dt='+fmt(A))}</div></foreignObject>`;
  s+=`<foreignObject x="${boxX(pxV(k),92)}" y="${NL+20}" width="92" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="${FO};text-align:center;color:${hit?'#28a745':'#7b61ff'}">${T('k='+fmt(k))}</div></foreignObject>`;
  if(hit) s+=`<foreignObject x="${mL+8}" y="${BT+4}" width="150" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="${FO};color:#28a745">2 つの値が一致</div></foreignObject>`;

  document.getElementById('graph').innerHTML=s;

  document.getElementById('live-calc').innerHTML=
    `<div style="color:var(--fg)">${T("k "+rel(k)+" "+fmt(k))}</div>`+
    `<div style="color:var(--c-purple)">${T('f(x) = '+lin(M.p,M.q*k))}</div>`+
    `<div style="color:var(--c-blue)">${T('\\int_0^'+M.b+' f(t)dt = '+fmt(M.c)+'+'+fmt(M.qb)+'\\cdot '+par(k)+' '+rel(A)+' '+fmt(A))}</div>`+
    (hit ? `<div style="color:var(--c-green);font-weight:700">おいた値と出てきた値が一致しました</div>`
         : `<div style="color:var(--c-orange)">ずれ ${T(fmt(A)+'-'+par(k)+' '+rel(gap)+' '+fmt(gap))}</div>`);
}

function setK(v){
  const M=MODES[mode];
  kVal=Math.round(Math.max(M.lo,Math.min(M.hi,v))*10)/10;
  document.getElementById('k-slider').value=kVal;
  document.getElementById('k-value').textContent=fmt(kVal);
  draw();
}

function applyMode(){
  const M=MODES[mode];
  document.getElementById('tab1').classList.toggle('active',mode===1);
  document.getElementById('tab2').classList.toggle('active',mode===2);
  const sl=document.getElementById('k-slider');
  sl.min=M.lo; sl.max=M.hi; sl.step=0.1;
  document.getElementById('mode-desc').innerHTML=
    T('f(x)='+M.p+'x+'+M.q+'\\int_0^'+M.b+' f(t)dt')+' を考えます。'+T('k')+
    ' をいろいろ変えて、向きつき面積が '+T('k')+' そのものになる値をさがしましょう。';
  document.getElementById('legend').innerHTML=
    '<span><i style="background:var(--c-purple)"></i>'+T('y='+M.p+'x+'+M.q+'k')+'</span>'+
    '<span><u style="background:rgba(42,109,244,0.35)"></u>正の面積</span>'+
    '<span><u style="background:rgba(217,83,79,0.35)"></u>負の面積</span>'+
    '<span><b style="background:var(--c-blue)"></b>'+T('\\int_0^'+M.b+' f(t)dt')+'（出てきた値）</span>'+
    '<span><b style="background:var(--c-purple)"></b>'+T('k')+'（おいた値）</span>'+
    '<span><i style="background:var(--c-orange)"></i>2 つの値のずれ</span>';
  document.getElementById('drag-hint').innerHTML=
    '上の図の直線を上下にドラッグするか、下の数直線の紫の印を横にドラッグしましょう。';
  document.getElementById('note-box').innerHTML=
    '上の図の向きつき面積が、下の数直線の青い印です。'+T('k')+
    ' を動かすと青い印は '+M.qb+' 倍の速さで動くので、紫の印に追いつく場所はちょうど 1 か所しかありません。'+
    'そこが方程式 '+T('k='+M.c+'+'+M.qb+'k')+' の解です。';
  setK(M.k0);
}

function setupTabs(){
  document.getElementById('tab1').addEventListener('click',()=>{ stopAnim(); mode=1; applyMode(); });
  document.getElementById('tab2').addEventListener('click',()=>{ stopAnim(); mode=2; applyMode(); });
}
function setupSlider(){
  const sl=document.getElementById('k-slider');
  sl.addEventListener('input',()=>{ stopAnim(); setK(parseFloat(sl.value)); });
}
function stopAnim(){ if(animId){ cancelAnimationFrame(animId); animId=null; } }
function setupAnim(){
  document.getElementById('anim-btn').addEventListener('click',()=>{
    const M=MODES[mode];
    sweep(M.hi,M.ks,3000);
  });
  document.getElementById('reset-btn').addEventListener('click',()=>{ stopAnim(); setK(MODES[mode].k0); });
}
function sweep(from,to,duration){
  stopAnim();
  setK(from);
  let t0=null;
  function frame(ts){
    if(!t0) t0=ts;
    const pr=Math.min((ts-t0)/duration,1);
    const eased=pr<0.5 ? 2*pr*pr : 1-Math.pow(-2*pr+2,2)/2;
    setK(from+(to-from)*eased);
    animId = pr<1 ? requestAnimationFrame(frame) : null;
  }
  animId=requestAnimationFrame(frame);
}

function setupDrag(){
  const svg=document.getElementById('graph');
  const wrap=document.getElementById('svg-wrap');
  let dragging=0;

  function toSvg(cx,cy){
    const rect=svg.getBoundingClientRect();
    return { x:(cx-rect.left)/rect.width*W, y:(cy-rect.top)/rect.height*H };
  }
  /* upper panel: the line follows the finger, so k comes from the height there */
  function kFromTop(pt){
    const M=MODES[mode];
    const x=XMIN+(pt.x-mL)/PW*(XMAX-XMIN);
    const y=YT0+(TT+TH-pt.y)/TH*(YT1-YT0);
    return (y-M.p*x)/M.q;
  }
  function kFromLine(pt){
    const M=MODES[mode];
    return M.v0+(pt.x-mL)/PW*(M.v1-M.v0);
  }
  function startDrag(cx,cy){
    const pt=toSvg(cx,cy);
    if(pt.y>=TT-16 && pt.y<=TT+TH+16) dragging=1;
    else if(pt.y>=BT-6 && pt.y<=BT+BH+6) dragging=2;
    else { dragging=0; return; }
    stopAnim();
    setK(dragging===1 ? kFromTop(pt) : kFromLine(pt));
  }
  function moveDrag(cx,cy){
    if(!dragging) return;
    const pt=toSvg(cx,cy);
    setK(dragging===1 ? kFromTop(pt) : kFromLine(pt));
  }
  function endDrag(){ dragging=0; }

  wrap.addEventListener('mousedown', e => { e.preventDefault(); startDrag(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { if(dragging){ e.preventDefault(); moveDrag(e.clientX, e.clientY); } });
  window.addEventListener('mouseup', endDrag);

  wrap.addEventListener('touchstart', e => { const t=e.touches[0]; startDrag(t.clientX, t.clientY); }, {passive:true});
  wrap.addEventListener('touchmove', e => { if(dragging){ e.preventDefault(); const t=e.touches[0]; moveDrag(t.clientX, t.clientY); } }, {passive:false});
  wrap.addEventListener('touchend', endDrag);
  wrap.addEventListener('touchcancel', endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
