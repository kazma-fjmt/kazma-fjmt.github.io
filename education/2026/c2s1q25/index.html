<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>中線定理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.3rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step {
    padding: .75rem .25rem; border-bottom: 1px dashed #eee;
    transition: background .2s ease; animation: fadeIn .3s ease;
  }
  .step:last-child { border-bottom: none; }
  .step.current {
    background: #f0f5ff; border-radius: 8px; padding: .75rem;
    margin: .25rem -.5rem; border-bottom: none;
  }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.1rem; }
  .step.current .formula-line .katex { font-size: 1.2rem; }

  .controls-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; margin: 1rem 0 0;
  }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .note {
    background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px;
    padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem;
  }
  .live-calc {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto;
  }
  .live-calc .katex { font-size: 1.15rem; }

  .verify-box {
    background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; text-align: center;
  }
  .verify-box .katex { font-size: 1.15rem; }

  .drag-hint {
    text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>中線定理</h1>
  <p class="subtitle">三角形の中線と辺の長さの関係を座標を使って証明しましょう。</p>

  <h2>中線定理</h2>
  <p>三角形 ABC において、辺 BC の中点を M とすると：</p>
  <div class="formula-box" id="formula-main"></div>

  <h2>座標による証明</h2>
  <div class="walkthrough" id="wt-proof"></div>
  <div class="controls-row">
    <button class="btn" id="wp-prev" disabled>← 前へ</button>
    <span class="step-counter" id="wp-counter"></span>
    <button class="btn primary" id="wp-next">次へ →</button>
  </div>

  <h2>定理を確かめよう</h2>
  <p>三角形の頂点 A, B, C をドラッグして、中線定理が常に成り立つことを確認しましょう。</p>
  <p class="drag-hint">頂点をタップ＆ドラッグで移動できます</p>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="verify-box" id="verify"></div>
  <div class="live-calc" id="live-calc"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}
if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{if(window.katex)init();else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}});

// Draggable triangle vertices
let verts = { A: {x:1, y:4}, B: {x:-3, y:-1}, C: {x:4, y:-1} };

function init(){
  tex('\\mathrm{AB}^2 + \\mathrm{AC}^2 = 2(\\mathrm{AM}^2 + \\mathrm{BM}^2)', document.getElementById('formula-main'), true);
  initProof();
  drawGraph();
  setupDrag();
}

function initProof(){
  const steps = [
    { label: 'Step 1: 座標の設定', formula: '\\text{M を原点、BC を x 軸上に置く}' },
    { label: 'Step 2: 各点の座標', formula: '\\mathrm{A}(a,\\,b),\\;\\mathrm{B}(-c,\\,0),\\;\\mathrm{C}(c,\\,0),\\;\\mathrm{M}(0,\\,0)' },
    { label: 'Step 3: AB² を計算', formula: '\\mathrm{AB}^2 = (a-(-c))^2 + (b-0)^2 = (a+c)^2 + b^2' },
    { label: 'Step 4: AC² を計算', formula: '\\mathrm{AC}^2 = (a-c)^2 + (b-0)^2 = (a-c)^2 + b^2' },
    { label: 'Step 5: 左辺 = AB² + AC²', formula: '\\mathrm{AB}^2 + \\mathrm{AC}^2 = (a+c)^2 + b^2 + (a-c)^2 + b^2' },
    { label: 'Step 6: 展開', formula: '= a^2+2ac+c^2+b^2+a^2-2ac+c^2+b^2 = 2a^2+2b^2+2c^2' },
    { label: 'Step 7: AM² と BM² を計算', formula: '\\mathrm{AM}^2 = a^2+b^2,\\quad \\mathrm{BM}^2 = c^2' },
    { label: 'Step 8: 右辺 = 2(AM² + BM²)', formula: '2(\\mathrm{AM}^2+\\mathrm{BM}^2) = 2(a^2+b^2+c^2) = 2a^2+2b^2+2c^2' },
    { label: 'Step 9: 結論', formula: '\\mathrm{AB}^2+\\mathrm{AC}^2 = 2a^2+2b^2+2c^2 = 2(\\mathrm{AM}^2+\\mathrm{BM}^2) \\quad \\checkmark' },
  ];

  let cur = 0;
  const container = document.getElementById('wt-proof');
  const counter = document.getElementById('wp-counter');
  const prevBtn = document.getElementById('wp-prev');
  const nextBtn = document.getElementById('wp-next');

  function render(){
    let html = '';
    for(let i=0;i<=cur;i++){
      html += `<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML = html;
    counter.textContent = `${cur+1} / ${steps.length}`;
    prevBtn.disabled = cur===0;
    nextBtn.disabled = cur===steps.length-1;
  }

  prevBtn.addEventListener('click', ()=>{ if(cur>0){cur--;render();} });
  nextBtn.addEventListener('click', ()=>{ if(cur<steps.length-1){cur++;render();} });
  render();
}

function dist2(p,q){ return (p.x-q.x)**2 + (p.y-q.y)**2; }

function drawGraph(){
  const svg = document.getElementById('graph');
  const W = 600, H = 500, ox = 300, oy = 280, scale = 45;

  function px(x){ return ox + x*scale; }
  function py(y){ return oy - y*scale; }

  const A = verts.A, B = verts.B, C = verts.C;
  const M = { x: (B.x+C.x)/2, y: (B.y+C.y)/2 };

  let html = '';

  // Grid
  for(let i=-6;i<=6;i++) html += `<line x1="${px(i)}" y1="10" x2="${px(i)}" y2="${H-10}" stroke="#eee"/>`;
  for(let j=-4;j<=5;j++) html += `<line x1="10" y1="${py(j)}" x2="${W-10}" y2="${py(j)}" stroke="#eee"/>`;

  html += `<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#999"/></marker></defs>`;
  html += `<line x1="10" y1="${oy}" x2="${W-10}" y2="${oy}" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>`;
  html += `<line x1="${ox}" y1="${H-10}" x2="${ox}" y2="10" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>`;
  html += `<foreignObject x="${Math.min(W-15-12,W-26)}" y="${oy-22}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('x')}</div></foreignObject>`;
  html += `<foreignObject x="${ox+6}" y="${Math.max(py(5)-2,2)}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('y')}</div></foreignObject>`;
  html += `<text x="${ox+5}" y="${oy+18}" font-size="12" fill="#999">O</text>`;

  // Triangle
  html += `<polygon points="${px(A.x)},${py(A.y)} ${px(B.x)},${py(B.y)} ${px(C.x)},${py(C.y)}" fill="rgba(42,109,244,0.08)" stroke="var(--c-blue)" stroke-width="2"/>`;

  // Median AM
  html += `<line x1="${px(A.x)}" y1="${py(A.y)}" x2="${px(M.x)}" y2="${py(M.y)}" stroke="var(--c-orange)" stroke-width="2.5" stroke-dasharray="8,4"/>`;

  // AB colored
  html += `<line x1="${px(A.x)}" y1="${py(A.y)}" x2="${px(B.x)}" y2="${py(B.y)}" stroke="var(--c-red)" stroke-width="2.5"/>`;
  // AC colored
  html += `<line x1="${px(A.x)}" y1="${py(A.y)}" x2="${px(C.x)}" y2="${py(C.y)}" stroke="var(--c-purple)" stroke-width="2.5"/>`;

  // Labels & dots
  const pts = [
    { p: A, label: 'A', color: 'var(--c-red)', offX: 0, offY: -15 },
    { p: B, label: 'B', color: 'var(--c-blue)', offX: -20, offY: 15 },
    { p: C, label: 'C', color: 'var(--c-blue)', offX: 10, offY: 15 },
    { p: M, label: 'M', color: 'var(--c-orange)', offX: 5, offY: 18 },
  ];

  pts.forEach(({p, label, color, offX, offY}) => {
    const isM = label === 'M';
    const r = isM ? 5 : 10;
    html += `<circle cx="${px(p.x)}" cy="${py(p.y)}" r="${r}" fill="${color}" stroke="#fff" stroke-width="2" ${isM?'':'style="cursor:grab"'}/>`;
    html += `<text x="${px(p.x)+offX}" y="${py(p.y)+offY}" font-size="14" font-weight="700" fill="${color}">${label}</text>`;
  });

  // Animate draggable points
  ['A','B','C'].forEach(name => {
    const p = verts[name];
    html += `<circle cx="${px(p.x)}" cy="${py(p.y)}" r="10" fill="transparent" stroke="none" style="cursor:grab" data-vert="${name}"/>`;
  });

  svg.innerHTML = html;

  // Compute and display values
  const AB2 = dist2(A, B), AC2 = dist2(A, C);
  const AM2 = dist2(A, M), BM2 = dist2(B, M);
  const lhs = AB2 + AC2;
  const rhs = 2 * (AM2 + BM2);
  const fmt = v => v.toFixed(2);

  document.getElementById('verify').innerHTML =
    '<strong style="color:var(--c-green)">検証結果</strong><br>' +
    T(`\\mathrm{AB}^2 + \\mathrm{AC}^2 = ${fmt(AB2)} + ${fmt(AC2)} = ${fmt(lhs)}`) + '<br>' +
    T(`2(\\mathrm{AM}^2 + \\mathrm{BM}^2) = 2(${fmt(AM2)} + ${fmt(BM2)}) = ${fmt(rhs)}`) + '<br>' +
    (Math.abs(lhs - rhs) < 0.01 ? '<span style="color:var(--c-green);font-weight:700">両辺が一致！中線定理が成立しています。</span>' : '');

  document.getElementById('live-calc').innerHTML =
    T(`\\mathrm{A}(${fmt(A.x)},\\,${fmt(A.y)}),\\;\\mathrm{B}(${fmt(B.x)},\\,${fmt(B.y)}),\\;\\mathrm{C}(${fmt(C.x)},\\,${fmt(C.y)})`) + '<br>' +
    T(`\\mathrm{M} = \\left(\\frac{${fmt(B.x)}+${fmt(C.x)}}{2},\\;\\frac{${fmt(B.y)}+${fmt(C.y)}}{2}\\right) = (${fmt(M.x)},\\,${fmt(M.y)})`);
}

function setupDrag(){
  const svg = document.getElementById('graph');
  const wrap = document.getElementById('svg-wrap');
  const W = 600, H = 500, ox = 300, oy = 280, scale = 45;

  function toMath(cx, cy){
    const rect = svg.getBoundingClientRect();
    const svgX = (cx - rect.left) / rect.width * W;
    const svgY = (cy - rect.top) / rect.height * H;
    return { x: (svgX - ox)/scale, y: (oy - svgY)/scale };
  }

  let dragging = null;

  function startDrag(cx, cy){
    const m = toMath(cx, cy);
    let best = null, bestD = 1.5;
    ['A','B','C'].forEach(name => {
      const d = Math.sqrt((m.x-verts[name].x)**2 + (m.y-verts[name].y)**2);
      if(d < bestD){ bestD = d; best = name; }
    });
    dragging = best;
  }

  function moveDrag(cx, cy){
    if(!dragging) return;
    const m = toMath(cx, cy);
    const snap = v => Math.round(v*2)/2;
    verts[dragging] = { x: Math.max(-5.5,Math.min(5.5, snap(m.x))), y: Math.max(-3.5,Math.min(4.5, snap(m.y))) };
    drawGraph();
  }

  function endDrag(){ dragging = null; }

  wrap.addEventListener('mousedown', e => { e.preventDefault(); startDrag(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { if(dragging){ e.preventDefault(); moveDrag(e.clientX, e.clientY); } });
  window.addEventListener('mouseup', endDrag);

  wrap.addEventListener('touchstart', e => { const t=e.touches[0]; startDrag(t.clientX, t.clientY); }, {passive:true});
  wrap.addEventListener('touchmove', e => { if(dragging){ e.preventDefault(); const t=e.touches[0]; moveDrag(t.clientX, t.clientY); } }, {passive:false});
  wrap.addEventListener('touchend', endDrag);
}
</script>
</body>
</html>
