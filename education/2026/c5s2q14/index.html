<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>不等式の証明</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0; }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; margin: .75rem 0; overflow: hidden; touch-action: none; position: relative; }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* draw() replaces the SVG contents, which would orphan a touch sequence that
     started on a child; keep hit-testing on the wrapper so the drag survives */
  .svg-container > svg { pointer-events: none; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto; }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; gap: .5rem; margin: .75rem 0; }
  .tab { appearance: none; flex: 1; border: 1px solid #d4dbeb; background: #fff; color: var(--accent); font-size: .95rem; font-weight: 600; padding: .7rem .5rem; border-radius: 10px; min-height: 48px; cursor: pointer; font-family: inherit; user-select: none; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }
  .live-calc > div { margin: .25rem 0; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row { display: flex; align-items: center; gap: 1rem; margin: .75rem 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; }
  .slider-row > label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row > input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row > .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; margin: .5rem 0; }

  .table-wrap { overflow-x: auto; margin: .75rem 0; }
  .compare-table { border-collapse: collapse; background: #fff; margin: 0 auto; font-size: .9rem; }
  .compare-table th, .compare-table td { border: 1px solid #e3e3e3; padding: .5rem .8rem; text-align: center; white-space: nowrap; }
  .compare-table .rowhead { background: #f4f7ff; font-weight: 600; }
  .compare-table .mark { background: #fff4e6; color: var(--c-orange); font-weight: 700; }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; justify-content: center; margin: .5rem 0 0; font-size: .88rem; }
  .legend > span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend > span > i { display: inline-block; width: 20px; height: 0; border-top-width: 3px; border-top-style: solid; }
  .legend > span > b { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>不等式の証明</h1>
  <p class="subtitle">左辺と右辺の差を関数におき、その最小値を調べて不等式を証明しましょう。</p>

  <h2>基本の考え方</h2>
  <p>不等式 <span id="f-ineq"></span> を示すには、差 <span id="f-diff"></span> を関数 <span id="f-fx"></span> とおきます。決められた範囲で <span id="f-fmin"></span> がいえれば、そのまま元の不等式が成り立ちます。</p>
  <div class="formula-box" id="f-key"></div>
  <p>グラフでいえば、<span id="f-curve"></span> がその範囲で <span id="f-axis"></span> より下に出ない、ということです。だから調べるのは差の関数の<strong>最小値</strong>だけで足ります。</p>

  <h2>解く問題</h2>
  <div class="formula-box" id="f-problem"></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <div class="tabs">
    <button class="tab active" id="tab1">この不等式</button>
    <button class="tab" id="tab2">別の不等式</button>
  </div>
  <p id="mode-desc"></p>

  <div class="slider-row">
    <label><span id="lbl-x"></span> =</label>
    <input type="range" id="x-slider" min="0" max="2.2" step="0.1" value="0.4">
    <span class="slider-val" id="x-value">0.4</span>
  </div>
  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">差の動きを見る</button>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 560" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend" id="legend"></div>
  <p class="drag-hint">図を横にドラッグしても <span id="f-x2"></span> が動きます。</p>

  <div class="live-calc" id="live-calc"></div>

  <h2>増減表で最小値を押さえる</h2>
  <p id="table-desc"></p>
  <div class="table-wrap"><table class="compare-table" id="inc-table"></table></div>
  <div class="note" id="note-box"></div>

  <h2>答え</h2>
  <div class="formula-box" id="result-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=560,mL=58,PW=430,GX=494;
const TT=30,TH=270,BT=352,BH=178;

const MODES={
  1:{ L:x=>x*x*x+2, R:x=>3*x, f:x=>x*x*x-3*x+2,
      Ltex:'y=x^3+2', Rtex:'y=3x', ineq:'x^3+2 \\geqq 3x',
      fdef:'f(x)=(x^3+2)-3x=x^3-3x+2', ftex:'y=x^3-3x+2',
      fptex:"f'(x)=3x^2-3=3(x+1)(x-1)",
      crit:1, critCalc:'f(1)=1-3+2=0', f0:2,
      X1:2.2, Y0t:-1.0, Y1t:13.5, ytt:[4,8,12], xt:[1,2], x0:0.4 },
  2:{ L:x=>x*x*x+4, R:x=>3*x*x, f:x=>x*x*x-3*x*x+4,
      Ltex:'y=x^3+4', Rtex:'y=3x^2', ineq:'x^3+4 \\geqq 3x^2',
      fdef:'f(x)=(x^3+4)-3x^2=x^3-3x^2+4', ftex:'y=x^3-3x^2+4',
      fptex:"f'(x)=3x^2-6x=3x(x-2)",
      crit:2, critCalc:'f(2)=8-12+4=0', f0:4,
      X1:3.1, Y0t:-2.5, Y1t:35, ytt:[10,20,30], xt:[1,2,3], x0:0.6 }
};
const Y0b=-2.2, Y1b=6.8, ytb=[2,4,6];
let mode=1, xVal=0.4, animId=null;
function M(){ return MODES[mode]; }
function px(x){ return mL+x/M().X1*PW; }
function pyT(y){ const m=M(); return TT+TH-(y-m.Y0t)/(m.Y1t-m.Y0t)*TH; }
function pyB(y){ return BT+BH-(y-Y0b)/(Y1b-Y0b)*BH; }

function fmt(v){
  if(Math.abs(v)<5e-13) v=0;
  let s=v.toFixed(6);
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  if(s==='-0') s='0';
  return s;
}
function rel(v){ return Math.abs(parseFloat(v.toFixed(6))-v)<1e-11 ? '=' : '\\fallingdotseq'; }

function init(){
  const spans={'f-ineq':'A \\geqq B','f-diff':'A-B','f-fx':'f(x)','f-fmin':'f(x) \\geqq 0',
               'f-curve':'y=f(x)','f-axis':'x \\text{ 軸}','f-x2':'x','lbl-x':'x'};
  for(const id in spans) document.getElementById(id).innerHTML=T(spans[id]);
  tex('f(x)=A-B \\ \\text{とおき、その範囲で}\\ f(x)\\ \\text{の最小値}\\geqq 0\\ \\text{を示す}',
      document.getElementById('f-key'), true);
  tex('x \\geqq 0 \\ \\text{のとき}\\quad x^3+2 \\geqq 3x \\ \\text{を証明する}',
      document.getElementById('f-problem'), true);
  tex('\\begin{aligned}'
    + '&x \\geqq 0 \\ \\text{における}\\ f(x)=x^3-3x+2\\ \\text{の最小値は}\\ f(1)=0\\\\'
    + '&\\text{よって}\\ f(x) \\geqq 0,\\ \\text{すなわち}\\ x^3+2 \\geqq 3x \\quad (\\text{等号は}\\ x=1)'
    + '\\end{aligned}', document.getElementById('result-box'), true);
  document.getElementById('tab1').innerHTML=T('x^3+2 \\geqq 3x');
  document.getElementById('tab2').innerHTML=T('x^3+4 \\geqq 3x^2');
  document.getElementById('note-box').innerHTML=
    '差がいちばん小さくなる場所さえ 0 以上なら、ほかの場所は自動的に 0 以上です。'
    +'だから増減表で最小値を 1 つ押さえるだけで証明が終わります。';

  initWalkthrough();
  setupTabs();
  setupSlider();
  setupAnim();
  setupDrag();
  applyMode();
}

function initWalkthrough(){
  const steps=[
    { label:'Step 1: 左辺と右辺の差を関数におく',
      formula:'f(x)=(x^3+2)-3x=x^3-3x+2' },
    { label:'Step 2: 導関数を求める',
      formula:"f'(x)=3x^2-3=3(x+1)(x-1)" },
    { label:'Step 3: 導関数が 0 になる x を出す',
      formula:"f'(x)=0 \\ \\Longrightarrow \\ x=-1,\\ 1 \\quad (x \\geqq 0\\ \\text{では}\\ x=1)" },
    { label:'Step 4: 決められた範囲で増減表をつくる',
      formula:"\\begin{array}{c|cccc} x & 0 & \\cdots & 1 & \\cdots \\\\ \\hline"
             +" f'(x) & & - & 0 & + \\\\ \\hline"
             +" f(x) & 2 & \\searrow & \\text{極小}\\ 0 & \\nearrow \\end{array}" },
    { label:'Step 5: 最小値を読み取る',
      formula:'x \\geqq 0 \\ \\text{における最小値}\\ f(1)=1-3+2=0' },
    { label:'Step 6: 最小値が 0 以上であることを使う',
      formula:'f(x) \\geqq 0 \\ \\text{すなわち}\\ (x^3+2)-3x \\geqq 0' },
    { label:'Step 7: 答え',
      formula:'x \\geqq 0 \\ \\text{のとき}\\ x^3+2 \\geqq 3x \\quad (\\text{等号は}\\ x=1)' }
  ];
  let cur=0;
  const container=document.getElementById('walkthrough'), counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=cur;i++){
      html+=`<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${cur+1} / ${steps.length}`;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{ if(cur>0){cur--;render();} });
  nextBtn.addEventListener('click',()=>{ if(cur<steps.length-1){cur++;render();} });
  render();
}

function pathOf(g,py){
  const m=M();
  let d='';
  for(let i=0;i<=240;i++){
    const x=m.X1*i/240;
    d+=(i===0?'M':'L')+` ${px(x).toFixed(2)} ${py(g(x)).toFixed(2)}`;
  }
  return d;
}
function bandOf(){
  const m=M();
  let d='';
  for(let i=0;i<=240;i++){ const x=m.X1*i/240; d+=(i===0?'M':'L')+` ${px(x).toFixed(2)} ${pyT(m.L(x)).toFixed(2)}`; }
  for(let i=240;i>=0;i--){ const x=m.X1*i/240; d+=`L ${px(x).toFixed(2)} ${pyT(m.R(x)).toFixed(2)}`; }
  return d+'Z';
}
function areaOf(){
  const m=M();
  let d=`M ${px(0)} ${pyB(0)}`;
  for(let i=0;i<=240;i++){ const x=m.X1*i/240; d+=`L ${px(x).toFixed(2)} ${pyB(m.f(x)).toFixed(2)}`; }
  return d+`L ${px(m.X1)} ${pyB(0)}Z`;
}

function draw(){
  const m=M(), x=xVal, Lv=m.L(x), Rv=m.R(x), fv=m.f(x);
  const HALO2=' stroke="#fff" stroke-width="2.5" paint-order="stroke" stroke-linejoin="round"';
  const LBL='font-size:13px;display:inline-block;background:#fff;white-space:nowrap';
  let s='', ticks='';

  /* ---- top panel: the two sides of the inequality ---- */
  s+=`<rect x="${mL}" y="${TT}" width="${PW}" height="${TH}" fill="#fff" stroke="#e3e3e3"/>`;
  m.xt.forEach(k=>{ s+=`<line x1="${px(k)}" y1="${TT}" x2="${px(k)}" y2="${TT+TH}" stroke="#eee" stroke-width="1"/>`; });
  m.ytt.forEach(k=>{ s+=`<line x1="${mL}" y1="${pyT(k)}" x2="${mL+PW}" y2="${pyT(k)}" stroke="#eee" stroke-width="1"/>`; });
  s+=`<line x1="${mL}" y1="${pyT(0)}" x2="${mL+PW}" y2="${pyT(0)}" stroke="#999" stroke-width="1.5"/>`;
  s+=`<line x1="${mL}" y1="${TT}" x2="${mL}" y2="${TT+TH}" stroke="#999" stroke-width="1.5"/>`;
  s+=`<path d="${bandOf()}" fill="var(--c-green)" opacity="0.13"/>`;
  s+=`<path d="${pathOf(m.R,pyT)}" fill="none" stroke="var(--c-red)" stroke-width="2.5"/>`;
  s+=`<path d="${pathOf(m.L,pyT)}" fill="none" stroke="var(--c-blue)" stroke-width="2.5"/>`;
  s+=`<line x1="${px(x)}" y1="${TT}" x2="${px(x)}" y2="${BT}" stroke="#c9d3e8" stroke-width="1.5" stroke-dasharray="5 5"/>`;
  m.xt.forEach(k=>{ ticks+=`<text x="${px(k)}" y="${pyT(0)+17}" text-anchor="middle" font-size="11" fill="#aaa"${HALO2}>${k}</text>`; });
  m.ytt.forEach(k=>{ ticks+=`<text x="${mL-8}" y="${pyT(k)+4}" text-anchor="end" font-size="11" fill="#aaa"${HALO2}>${k}</text>`; });
  s+=ticks;
  /* the gap between the two curves at the current x */
  s+=`<line x1="${px(x)}" y1="${pyT(Rv)}" x2="${px(x)}" y2="${pyT(Lv)}" stroke="var(--c-orange)" stroke-width="5" stroke-linecap="round"/>`;
  s+=`<circle cx="${px(x)}" cy="${pyT(Rv)}" r="6" fill="var(--c-red)" stroke="#fff" stroke-width="2"/>`;
  s+=`<circle cx="${px(x)}" cy="${pyT(Lv)}" r="6" fill="var(--c-blue)" stroke="#fff" stroke-width="2"/>`;
  s+=`<foreignObject x="${mL+8}" y="${TT+4}" width="120" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="${LBL};color:#666;font-weight:600">${T('x \\geqq 0')}</div></foreignObject>`;
  s+=`<foreignObject x="${GX}" y="${pyT(m.L(m.X1))-14}" width="100" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="${LBL};color:var(--c-blue);font-weight:600">${T(m.Ltex)}</div></foreignObject>`;
  s+=`<foreignObject x="${GX}" y="${pyT(m.R(m.X1))-14}" width="100" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="${LBL};color:var(--c-red);font-weight:600">${T(m.Rtex)}</div></foreignObject>`;
  s+=`<foreignObject x="${mL+PW+4}" y="${pyT(0)+2}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${LBL};color:#999">${T('x')}</div></foreignObject>`;

  /* ---- bottom panel: the difference function ---- */
  let tickB='';
  s+=`<rect x="${mL}" y="${BT}" width="${PW}" height="${BH}" fill="#fff" stroke="#e3e3e3"/>`;
  m.xt.forEach(k=>{ s+=`<line x1="${px(k)}" y1="${BT}" x2="${px(k)}" y2="${BT+BH}" stroke="#eee" stroke-width="1"/>`; });
  ytb.forEach(k=>{ s+=`<line x1="${mL}" y1="${pyB(k)}" x2="${mL+PW}" y2="${pyB(k)}" stroke="#eee" stroke-width="1"/>`; });
  s+=`<path d="${areaOf()}" fill="var(--c-green)" opacity="0.13"/>`;
  s+=`<line x1="${mL}" y1="${pyB(0)}" x2="${mL+PW}" y2="${pyB(0)}" stroke="#999" stroke-width="1.5"/>`;
  s+=`<line x1="${mL}" y1="${BT}" x2="${mL}" y2="${BT+BH}" stroke="#999" stroke-width="1.5"/>`;
  s+=`<path d="${pathOf(m.f,pyB)}" fill="none" stroke="var(--c-purple)" stroke-width="2.5"/>`;
  /* the panel background hides the connector drawn above, so repeat it here */
  s+=`<line x1="${px(x)}" y1="${BT}" x2="${px(x)}" y2="${BT+BH}" stroke="#c9d3e8" stroke-width="1.5" stroke-dasharray="5 5"/>`;
  m.xt.forEach(k=>{
    if(k===m.crit) return;   /* the minimum label owns this slot */
    tickB+=`<text x="${px(k)}" y="${pyB(0)+17}" text-anchor="middle" font-size="11" fill="#aaa"${HALO2}>${k}</text>`;
  });
  ytb.forEach(k=>{ tickB+=`<text x="${mL-8}" y="${pyB(k)+4}" text-anchor="end" font-size="11" fill="#aaa"${HALO2}>${k}</text>`; });
  s+=tickB;
  s+=`<line x1="${px(x)}" y1="${pyB(0)}" x2="${px(x)}" y2="${pyB(fv)}" stroke="var(--c-orange)" stroke-width="5" stroke-linecap="round"/>`;
  s+=`<circle cx="${px(m.crit)}" cy="${pyB(0)}" r="7" fill="var(--c-green)" stroke="#fff" stroke-width="2.5"/>`;
  s+=`<circle cx="${px(x)}" cy="${pyB(fv)}" r="7.5" fill="var(--c-orange)" stroke="#fff" stroke-width="2.5"><animate attributeName="r" values="7.5;10.5;7.5" dur="1.7s" repeatCount="indefinite"/></circle>`;
  s+=`<foreignObject x="${mL+8}" y="${BT+4}" width="160" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="${LBL};color:var(--c-purple);font-weight:600">${T(m.ftex)}</div></foreignObject>`;
  /* the label is wider than a shrink-wrapped inline-block would get inside a 104px box,
     so give the box room and centre an inner span that carries the white background */
  s+=`<foreignObject x="${px(m.crit)-64}" y="${pyB(0)+12}" width="128" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;text-align:center"><span style="display:inline-block;background:#fff;white-space:nowrap;color:var(--c-green);font-weight:600">${T('\\text{最小値}\\ f('+m.crit+')=0')}</span></div></foreignObject>`;
  s+=`<foreignObject x="${mL+PW+4}" y="${pyB(0)+2}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${LBL};color:#999">${T('x')}</div></foreignObject>`;

  document.getElementById('graph').innerHTML=s;
  updateLive();
}

function updateLive(){
  const m=M(), x=xVal, Lv=m.L(x), Rv=m.R(x), fv=m.f(x);
  const eq=Math.abs(fv)<1e-12;
  const lhs=m.Ltex.slice(2), rhs=m.Rtex.slice(2);
  document.getElementById('live-calc').innerHTML=
    `<div>${T('x '+rel(x)+' '+fmt(x))}</div>`+
    `<div style="color:var(--c-blue)">${T(lhs+' '+rel(Lv)+' '+fmt(Lv))}　（左辺）</div>`+
    `<div style="color:var(--c-red)">${T(rhs+' '+rel(Rv)+' '+fmt(Rv))}　（右辺）</div>`+
    `<div style="color:var(--c-orange)">${T('f(x)='+fmt(Lv)+'-'+fmt(Rv)+' '+rel(fv)+' '+fmt(fv))}　（差）</div>`+
    `<div>${eq ? '差がちょうど 0 になる 1 点です。ここで等号が成り立ちます。'
               : '差は 0 より大きいので、この '+T('x')+' では不等式が成り立っています。'}</div>`;

  const ci = (x===0) ? 0 : (Math.abs(x-m.crit)<1e-9 ? 2 : (x<m.crit ? 1 : 3));
  document.querySelectorAll('#inc-table td').forEach((td,i)=>td.classList.toggle('mark', i%4===ci));
}

function buildTable(){
  const m=M();
  const head=[T('0'), T('\\cdots'), T(String(m.crit)), T('\\cdots')];
  const dif=['', T('-'), T('0'), T('+')];
  const val=[T(fmt(m.f0)), T('\\searrow'), T('\\text{極小}\\ 0'), T('\\nearrow')];
  let r1='<tr><th class="rowhead">'+T('x')+'</th>', r2='<tr><th class="rowhead">'+T("f'(x)")+'</th>', r3='<tr><th class="rowhead">'+T('f(x)')+'</th>';
  head.forEach(c=>r1+='<td>'+c+'</td>');
  dif.forEach(c=>r2+='<td>'+c+'</td>');
  val.forEach(c=>r3+='<td>'+c+'</td>');
  document.getElementById('inc-table').innerHTML=r1+'</tr>'+r2+'</tr>'+r3+'</tr>';
}

function setX(v){
  const m=M();
  xVal=Math.max(0, Math.min(m.X1, Math.round(v*10)/10));
  document.getElementById('x-slider').value=xVal;
  document.getElementById('x-value').textContent=fmt(xVal);
  draw();
}

function applyMode(){
  const m=M(), sl=document.getElementById('x-slider');
  document.getElementById('tab1').classList.toggle('active', mode===1);
  document.getElementById('tab2').classList.toggle('active', mode===2);
  sl.min='0'; sl.max=m.X1; sl.step='0.1';
  document.getElementById('mode-desc').innerHTML=
    '示したいのは '+T('x \\geqq 0')+' のとき '+T(m.ineq)+' です。'
    +'上の図は '+T(m.Ltex)+' と '+T(m.Rtex)+' を重ねたもので、'+T('x')+' を動かすと 2 つのグラフの縦の差がオレンジの棒になります。'
    +'下の図はその差だけを取り出した '+T(m.ftex)+' で、棒の長さがそのまま高さになります。';
  document.getElementById('table-desc').innerHTML=
    '差の関数は '+T(m.fdef)+'、'+T(m.fptex)+' です。'
    +T('x \\geqq 0')+' では '+T('x='+m.crit)+' で極小になり、'+T(m.critCalc)+' が最小値です。'
    +'増減表の色がついた列が、いま図で見ている位置です。';
  document.getElementById('legend').innerHTML=
    '<span><i style="border-top-color:var(--c-blue)"></i>'+T(m.Ltex)+'（左辺）</span>'+
    '<span><i style="border-top-color:var(--c-red)"></i>'+T(m.Rtex)+'（右辺）</span>'+
    '<span><b style="background:var(--c-orange);border-radius:3px"></b>いまの差</span>'+
    '<span><i style="border-top-color:var(--c-purple)"></i>'+T(m.ftex)+'（差の関数）</span>'+
    '<span><b style="background:var(--c-green)"></b>最小値をとる点</span>';
  buildTable();
  setX(m.x0);
}

function setupTabs(){
  document.getElementById('tab1').addEventListener('click',()=>{ stopAnim(); mode=1; applyMode(); });
  document.getElementById('tab2').addEventListener('click',()=>{ stopAnim(); mode=2; applyMode(); });
}
function setupSlider(){
  const sl=document.getElementById('x-slider');
  sl.addEventListener('input',()=>{ stopAnim(); setX(parseFloat(sl.value)); });
}
function stopAnim(){ if(animId){ cancelAnimationFrame(animId); animId=null; } }

function setupAnim(){
  document.getElementById('anim-btn').addEventListener('click',()=>{
    stopAnim();
    const m=M(), duration=3800;
    let t0=null;
    function frame(ts){
      if(!t0) t0=ts;
      const pr=Math.min((ts-t0)/duration,1);
      const eased=pr<0.5 ? 2*pr*pr : 1-Math.pow(-2*pr+2,2)/2;
      setX(m.X1*eased);
      animId = pr<1 ? requestAnimationFrame(frame) : null;
    }
    animId=requestAnimationFrame(frame);
  });
}

function setupDrag(){
  const svg=document.getElementById('graph');
  const wrap=document.getElementById('svg-wrap');
  let dragging=false;

  function toSvg(cx,cy){
    const rect=svg.getBoundingClientRect();
    return { x:(cx-rect.left)/rect.width*W, y:(cy-rect.top)/rect.height*H };
  }
  function valueAt(pt){ return (pt.x-mL)/PW*M().X1; }
  function inArea(pt){ return pt.x>mL-24 && pt.x<mL+PW+24 && pt.y>TT-12 && pt.y<BT+BH+16; }
  function startDrag(cx,cy){
    const pt=toSvg(cx,cy);
    if(!inArea(pt)) return;
    stopAnim();
    dragging=true;
    setX(valueAt(pt));
  }
  function moveDrag(cx,cy){ if(dragging) setX(valueAt(toSvg(cx,cy))); }
  function endDrag(){ dragging=false; }

  wrap.addEventListener('mousedown', e => { e.preventDefault(); startDrag(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { if(dragging){ e.preventDefault(); moveDrag(e.clientX, e.clientY); } });
  window.addEventListener('mouseup', endDrag);

  wrap.addEventListener('touchstart', e => { const t=e.touches[0]; startDrag(t.clientX, t.clientY); }, {passive:true});
  wrap.addEventListener('touchmove', e => { if(dragging){ e.preventDefault(); const t=e.touches[0]; moveDrag(t.clientX, t.clientY); } }, {passive:false});
  wrap.addEventListener('touchend', endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
