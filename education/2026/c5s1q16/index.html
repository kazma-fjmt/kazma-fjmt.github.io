<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>微分係数の計算</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* draw() replaces the SVG contents, which would orphan a touch sequence that
     started on a child; keep hit-testing on the wrapper so the drag survives */
  .svg-container > svg { pointer-events: none; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row {
    display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem;
  }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; margin: .5rem 0; }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; justify-content: center; margin: .5rem 0 0; font-size: .88rem; }
  .legend > span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend > span > i { display: inline-block; width: 22px; height: 4px; border-radius: 2px; font-style: normal; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>微分係数の計算</h1>
  <p class="subtitle">導関数を先に求めてから値を代入し、その数が接線の傾きになることを確かめましょう。</p>

  <h2>基本の考え方</h2>
  <p>関数 <span id="f-fx"></span> の導関数 <span id="f-dfx"></span> が分かっていれば、微分係数 <span id="f-fa"></span> は極限の定義に戻らなくても求められます。導関数に <span id="f-xa"></span> を代入するだけです。</p>
  <div class="formula-box" id="f-key"></div>

  <h2>解法ウォークスルー</h2>
  <p>関数 <span id="f-target"></span> について、<span id="f-ask"></span> を求めます。</p>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <p>スライダーを動かすか、上のグラフを直接ドラッグして接点を移動しましょう。上段の接線の傾きが、下段の <span id="f-dcurve"></span> の高さと同じ値になります。</p>

  <div class="slider-row">
    <label><span id="lbl-a"></span> =</label>
    <input type="range" id="a-slider" min="-1.4" max="2.4" step="0.1" value="2">
    <span class="slider-val" id="a-value">2.0</span>
  </div>

  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">アニメーション</button>
    <button class="btn" id="jump-2"></button>
    <button class="btn" id="jump-m1"></button>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 690" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend">
    <span><i style="background:#2a6df4"></i>上段の曲線</span>
    <span><i style="background:#e67e22"></i>接線と傾きの三角形</span>
    <span><i style="background:#7b61ff"></i>下段の導関数の曲線</span>
  </div>
  <p class="drag-hint">上段の曲線をドラッグすると接点が動きます。</p>

  <div class="live-calc" id="live-calc"></div>

  <div class="note" id="note-box"></div>

  <h2>答え</h2>
  <div class="formula-box" id="result-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=690;
const XMIN=-1.4,XMAX=2.4,PL=48,PR=586;
const sx=(PR-PL)/(XMAX-XMIN);
const T_TOP=34,T_BOT=396,Y1MIN=-13,Y1MAX=38;
const sy1=(T_BOT-T_TOP)/(Y1MAX-Y1MIN);
const B_TOP=452,B_BOT=664,Y2MIN=-7,Y2MAX=50;
const sy2=(B_BOT-B_TOP)/(Y2MAX-Y2MIN);

function px(x){return PL+(x-XMIN)*sx;}
function py1(y){return T_BOT-(y-Y1MIN)*sy1;}
function py2(y){return B_BOT-(y-Y2MIN)*sy2;}

function f(x){return 3*x*x*x - x*x;}
function df(x){return 9*x*x - 2*x;}

/* Values here are exact at 3 decimals because a is a multiple of 0.1 */
function fmt(v){
  let s = v.toFixed(3);
  if(parseFloat(s)===0) s='0.000';
  s = s.replace(/\.?0+$/,'');
  if(s===''||s==='-') s='0';
  return s;
}

let aVal = 2;
let animId = null;

function init(){
  document.getElementById('f-fx').innerHTML = T('y=f(x)');
  document.getElementById('f-dfx').innerHTML = T("f'(x)");
  document.getElementById('f-fa').innerHTML = T("f'(a)");
  document.getElementById('f-xa').innerHTML = T('x=a');
  document.getElementById('f-target').innerHTML = T('f(x)=3x^3-x^2');
  document.getElementById('f-ask').innerHTML = T("f'(2)\\;\\text{と}\\;f'(-1)");
  document.getElementById('f-dcurve').innerHTML = T("y=f'(x)");
  document.getElementById('lbl-a').innerHTML = T('a');
  document.getElementById('jump-2').innerHTML = T('a=2');
  document.getElementById('jump-m1').innerHTML = T('a=-1');

  tex("f'(a)=\\Big[\\,f'(x)\\,\\Big]_{x=a}", document.getElementById('f-key'), true);
  tex("f'(2)=32,\\qquad f'(-1)=11", document.getElementById('result-box'), true);

  initWalkthrough();
  setupSlider();
  setupButtons();
  setupDrag();
  draw();
}

function initWalkthrough(){
  const steps = [
    { label: 'Step 1: 与えられた関数を確かめる', formula: "f(x)=3x^3-x^2" },
    { label: 'Step 2: 使う公式', formula: "(x^n)'=nx^{n-1},\\quad \\{k\\,g(x)\\}'=k\\,g'(x),\\quad \\{g(x)-h(x)\\}'=g'(x)-h'(x)" },
    { label: 'Step 3: 項ごとに微分する', formula: "(3x^3)'=3\\cdot 3x^2=9x^2,\\qquad (x^2)'=2x" },
    { label: 'Step 4: 導関数がそろう', formula: "f'(x)=9x^2-2x" },
    { label: 'Step 5: 2 を代入する', formula: "f'(2)=9\\cdot 2^2-2\\cdot 2=36-4=32" },
    { label: 'Step 6: −1 を代入する（符号に注意）', formula: "f'(-1)=9\\cdot(-1)^2-2\\cdot(-1)=9+2=11" },
    { label: 'Step 7: 答えの図形的な意味', formula: "\\text{点 }(2,\\,20)\\text{ の接線の傾きが }32,\\;\\text{点 }(-1,\\,-4)\\text{ の接線の傾きが }11" }
  ];
  let cur = 0;
  const container = document.getElementById('walkthrough');
  const counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  function render(){
    let html = '';
    for(let i=0;i<=cur;i++){
      html += `<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML = html;
    counter.textContent = `${cur+1} / ${steps.length}`;
    prevBtn.disabled = cur===0;
    nextBtn.disabled = cur===steps.length-1;
  }
  prevBtn.addEventListener('click', ()=>{ if(cur>0){cur--;render();} });
  nextBtn.addEventListener('click', ()=>{ if(cur<steps.length-1){cur++;render();} });
  render();
}

function curvePath(fn, pyFn, ymin, ymax){
  let d='', pen=false;
  for(let X=PL; X<=PR; X+=2){
    const x = XMIN + (X-PL)/sx;
    const y = fn(x);
    if(y<ymin || y>ymax){ pen=false; continue; }
    d += (pen?'L':'M') + ` ${X.toFixed(1)} ${pyFn(y).toFixed(1)}`;
    pen = true;
  }
  return d;
}

function tangentSeg(a, m, fa){
  let lo=XMIN, hi=XMAX;
  if(Math.abs(m)>1e-9){
    const p=a+(Y1MIN-fa)/m, q=a+(Y1MAX-fa)/m;
    lo=Math.max(lo, Math.min(p,q));
    hi=Math.min(hi, Math.max(p,q));
  } else if(fa<Y1MIN || fa>Y1MAX){ return null; }
  if(hi-lo < 1e-6) return null;
  return [lo, fa+m*(lo-a), hi, fa+m*(hi-a)];
}

function draw(){
  const a = aVal, fa = f(a), m = df(a);
  let s = '';

  /* Boxes reserved by moving labels, so fixed tick numbers can step aside */
  const busy = [];
  function hits(r){ return busy.some(b => r.x < b.x+b.w && b.x < r.x+r.w && r.y < b.y+b.h && b.y < r.y+r.h); }

  /* Slope triangle geometry: run chosen so the rise stays inside the panel */
  let run = 0.32;
  if(Math.abs(m)>1e-9){
    const room = m>0 ? (Y1MAX-1.5-fa) : (fa-(Y1MIN+1.5));
    run = Math.min(run, Math.abs(room/m));
  }
  let tri = null;
  if(run>0.06 && a+run<=XMAX){
    const x0=px(a), y0=py1(fa), x1=px(a+run), y1=py1(fa+m*run);
    const runTxt = run.toFixed(2), riseTxt = (m*run).toFixed(2);
    const runW = runTxt.length*6.4, riseW = riseTxt.length*6.4;
    const riseRight = x1+5+riseW <= PR+8;
    tri = {x0,y0,x1,y1,runTxt,riseTxt,riseW,riseRight};
    busy.push({x:(x0+x1)/2-runW/2, y:y0+6, w:runW, h:13});
    busy.push({x: riseRight ? x1+5 : x1-5-riseW, y:(y0+y1)/2-5, w:riseW, h:13});
  }
  /* The "a" marker sits just below the upper x axis */
  busy.push({x:px(a)-13, y:py1(0)+2, w:26, h:22});

  /* Tick numbers are collected here and drawn after the curves, so they stay readable */
  let ticks = '';

  /* Panel backgrounds */
  s += `<rect x="${PL-2}" y="${T_TOP}" width="${PR-PL+4}" height="${T_BOT-T_TOP}" fill="#fcfcff"/>`;
  s += `<rect x="${PL-2}" y="${B_TOP}" width="${PR-PL+4}" height="${B_BOT-B_TOP}" fill="#fdfcff"/>`;

  /* Grid: vertical */
  for(let i=-1;i<=2;i++){
    const X=px(i);
    s += `<line x1="${X}" y1="${T_TOP}" x2="${X}" y2="${T_BOT}" stroke="${i===0?'#999':'#eee'}" stroke-width="${i===0?1.5:1}"/>`;
    s += `<line x1="${X}" y1="${B_TOP}" x2="${X}" y2="${B_BOT}" stroke="${i===0?'#999':'#eee'}" stroke-width="${i===0?1.5:1}"/>`;
  }
  /* Grid: horizontal */
  for(let v=-10;v<=30;v+=10){
    const Y=py1(v);
    s += `<line x1="${PL-2}" y1="${Y}" x2="${PR+2}" y2="${Y}" stroke="${v===0?'#999':'#eee'}" stroke-width="${v===0?1.5:1}"/>`;
    const tw = String(v).length*6.4;
    if(!hits({x:px(0)-7-tw, y:Y-6, w:tw, h:13}))
      ticks += `<text x="${px(0)-7}" y="${Y+4}" text-anchor="end" font-size="11" fill="#aaa" paint-order="stroke" stroke="#fff" stroke-width="3">${v}</text>`;
  }
  for(let v=0;v<=40;v+=10){
    const Y=py2(v);
    s += `<line x1="${PL-2}" y1="${Y}" x2="${PR+2}" y2="${Y}" stroke="${v===0?'#999':'#eee'}" stroke-width="${v===0?1.5:1}"/>`;
    ticks += `<text x="${px(0)-7}" y="${Y+4}" text-anchor="end" font-size="11" fill="#aaa" paint-order="stroke" stroke="#fff" stroke-width="3">${v}</text>`;
  }
  /* x tick numbers */
  for(let i=-1;i<=2;i++){
    if(i===0) continue;
    const tw = String(i).length*6.4;
    if(!hits({x:px(i)-tw/2, y:py1(0)+6, w:tw, h:13}))
      ticks += `<text x="${px(i)}" y="${py1(0)+16}" text-anchor="middle" font-size="11" fill="#aaa" paint-order="stroke" stroke="#fff" stroke-width="3">${i}</text>`;
    ticks += `<text x="${px(i)}" y="${py2(0)+16}" text-anchor="middle" font-size="11" fill="#aaa" paint-order="stroke" stroke="#fff" stroke-width="3">${i}</text>`;
  }

  /* Curves */
  s += `<path d="${curvePath(f, py1, Y1MIN, Y1MAX)}" fill="none" stroke="var(--c-blue)" stroke-width="2.5"/>`;
  s += `<path d="${curvePath(df, py2, Y2MIN, Y2MAX)}" fill="none" stroke="var(--c-purple)" stroke-width="2.5"/>`;

  /* Link line between panels at x = a */
  s += `<line x1="${px(a)}" y1="${py1(fa)}" x2="${px(a)}" y2="${py2(df(a))}" stroke="#c9c2ee" stroke-width="1.5" stroke-dasharray="4 5"/>`;

  /* Tangent line */
  const seg = tangentSeg(a, m, fa);
  if(seg){
    s += `<line x1="${px(seg[0])}" y1="${py1(seg[1])}" x2="${px(seg[2])}" y2="${py1(seg[3])}" stroke="var(--c-orange)" stroke-width="3"/>`;
  }

  /* Slope triangle */
  if(tri){
    const {x0,y0,x1,y1,runTxt,riseTxt,riseRight} = tri;
    s += `<path d="M ${x0} ${y0} L ${x1} ${y0} L ${x1} ${y1} Z" fill="rgba(230,126,34,0.16)" stroke="var(--c-orange)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    s += `<text x="${(x0+x1)/2}" y="${y0+15}" text-anchor="middle" font-size="11" fill="var(--c-orange)" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3">${runTxt}</text>`;
    s += `<text x="${riseRight?x1+5:x1-5}" y="${(y0+y1)/2+4}" text-anchor="${riseRight?'start':'end'}" font-size="11" fill="var(--c-orange)" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3">${riseTxt}</text>`;
  }

  s += ticks;

  /* Bar showing f'(a) as a height in the lower panel */
  s += `<line x1="${px(a)}" y1="${py2(0)}" x2="${px(a)}" y2="${py2(m)}" stroke="var(--c-orange)" stroke-width="5" opacity="0.55"/>`;

  /* Moving points */
  s += `<circle cx="${px(a)}" cy="${py1(fa)}" r="8" fill="var(--c-blue)" stroke="#fff" stroke-width="2.5"/>`;
  s += `<circle cx="${px(a)}" cy="${py2(m)}" r="8" fill="var(--c-purple)" stroke="#fff" stroke-width="2.5"><animate attributeName="r" values="8;12;8" dur="1.6s" repeatCount="indefinite"/></circle>`;

  /* Marks for the two asked values */
  [2,-1].forEach(t=>{
    s += `<circle cx="${px(t)}" cy="${py2(df(t))}" r="5" fill="none" stroke="var(--c-red)" stroke-width="2"/>`;
  });

  /* Fixed labels */
  s += `<foreignObject x="${PL+6}" y="${T_TOP+6}" width="150" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#2a6df4;font-weight:600;white-space:nowrap">${T('y=3x^3-x^2')}</div></foreignObject>`;
  s += `<foreignObject x="${PL+6}" y="${B_TOP+6}" width="150" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#7b61ff;font-weight:600;white-space:nowrap">${T("y=f'(x)=9x^2-2x")}</div></foreignObject>`;
  s += `<foreignObject x="${PR-22}" y="${py1(0)-24}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('x')}</div></foreignObject>`;
  s += `<foreignObject x="${PR-22}" y="${py2(0)-24}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('x')}</div></foreignObject>`;
  s += `<foreignObject x="${px(a)-13}" y="${py1(0)+2}" width="26" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#e67e22;font-weight:700;text-align:center;background:#fff;border-radius:4px">${T('a')}</div></foreignObject>`;

  document.getElementById('graph').innerHTML = s;
  updateLive(a, fa, m);
}

function updateLive(a, fa, m){
  const c = fa - m*a;
  const cs = c>=0 ? '+ '+fmt(c) : '- '+fmt(-c);
  document.getElementById('live-calc').innerHTML =
    T(`a = ${fmt(a)}`) + '<br>' +
    T(`f(${fmt(a)}) = ${fmt(fa)}`) + '<br>' +
    T(`f'(${fmt(a)}) = 9\\cdot(${fmt(a)})^2-2\\cdot(${fmt(a)}) = ${fmt(m)}`) + '<br>' +
    T(`\\text{接線}:\\; y = ${fmt(m)}x ${cs}`);

  const note = document.getElementById('note-box');
  if(Math.abs(a-2)<1e-9){
    note.innerHTML = '求めたい値の一つ目です。' + T("f'(2)=32") + ' で、点 ' + T('(2,\\,20)') + ' における接線の傾きが 32 です。';
  } else if(Math.abs(a+1)<1e-9){
    note.innerHTML = '求めたい値の二つ目です。' + T("f'(-1)=11") + ' で、点 ' + T('(-1,\\,-4)') + ' における接線の傾きが 11 です。負の数を代入するときは ' + T('(-1)^2=1') + ' と ' + T('-2\\cdot(-1)=+2') + ' の符号に注意しましょう。';
  } else if(Math.abs(m)<1e-9){
    note.innerHTML = T("f'(a)=0") + ' なので、接線は ' + T('x') + ' 軸に平行です。下段の曲線もちょうど ' + T('x') + ' 軸と交わっています。';
  } else if(m<0){
    note.innerHTML = T("f'(a)<0") + ' なので接線は右下がりです。下段の曲線は ' + T('x') + ' 軸より下にあります。';
  } else {
    note.innerHTML = T("f'(a)>0") + ' なので接線は右上がりです。下段の曲線の高さが、そのまま傾きの値です。';
  }
}

function setA(v){
  aVal = Math.max(XMIN, Math.min(XMAX, Math.round(v*10)/10));
  const sl = document.getElementById('a-slider');
  sl.value = aVal;
  document.getElementById('a-value').textContent = aVal.toFixed(1);
  draw();
}

function setupSlider(){
  const sl = document.getElementById('a-slider');
  sl.addEventListener('input', ()=>{
    if(animId){ cancelAnimationFrame(animId); animId=null; }
    setA(parseFloat(sl.value));
  });
}

function setupButtons(){
  document.getElementById('jump-2').addEventListener('click', ()=>{
    if(animId){ cancelAnimationFrame(animId); animId=null; }
    setA(2);
  });
  document.getElementById('jump-m1').addEventListener('click', ()=>{
    if(animId){ cancelAnimationFrame(animId); animId=null; }
    setA(-1);
  });
  document.getElementById('anim-btn').addEventListener('click', ()=>{
    if(animId){ cancelAnimationFrame(animId); animId=null; }
    const startA=-1.4, endA=2.4, duration=4200;
    let startTime=null;
    function animate(ts){
      if(!startTime) startTime=ts;
      const progress = Math.min((ts-startTime)/duration, 1);
      const eased = progress<0.5 ? 2*progress*progress : 1-Math.pow(-2*progress+2,2)/2;
      setA(startA + (endA-startA)*eased);
      animId = progress<1 ? requestAnimationFrame(animate) : null;
    }
    animId = requestAnimationFrame(animate);
  });
}

function setupDrag(){
  const svg = document.getElementById('graph');
  const wrap = document.getElementById('svg-wrap');
  let dragging = false;

  function toX(cx){
    const rect = svg.getBoundingClientRect();
    const svgX = (cx-rect.left)/rect.width*W;
    return XMIN + (svgX-PL)/sx;
  }
  function startDrag(cx, cy){
    const rect = svg.getBoundingClientRect();
    const svgY = (cy-rect.top)/rect.height*H;
    if(svgY < T_TOP-10 || svgY > T_BOT+10) return;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
    dragging = true;
    setA(toX(cx));
  }
  function moveDrag(cx){ if(dragging) setA(toX(cx)); }
  function endDrag(){ dragging = false; }

  wrap.addEventListener('mousedown', e => { e.preventDefault(); startDrag(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { if(dragging){ e.preventDefault(); moveDrag(e.clientX); } });
  window.addEventListener('mouseup', endDrag);

  wrap.addEventListener('touchstart', e => { const t=e.touches[0]; startDrag(t.clientX, t.clientY); }, {passive:true});
  wrap.addEventListener('touchmove', e => { if(dragging){ e.preventDefault(); const t=e.touches[0]; moveDrag(t.clientX); } }, {passive:false});
  wrap.addEventListener('touchend', endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
