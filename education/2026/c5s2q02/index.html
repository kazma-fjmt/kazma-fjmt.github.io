<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>傾きから求める接線</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0; }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; margin: .75rem 0; overflow: hidden; touch-action: none; position: relative; }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* draw() replaces the SVG contents, which would orphan a touch sequence that
     started on a child; keep hit-testing on the wrapper so the drag survives */
  .svg-container > svg { pointer-events: none; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto; }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; gap: .5rem; margin: .75rem 0; }
  .tab { appearance: none; flex: 1; border: 1px solid #d4dbeb; background: #fff; color: var(--accent); font-size: .95rem; font-weight: 600; padding: .7rem .5rem; border-radius: 10px; min-height: 48px; cursor: pointer; font-family: inherit; user-select: none; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }
  .live-calc > div { margin: .25rem 0; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row { display: flex; align-items: center; gap: 1rem; margin: .75rem 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; margin: .5rem 0; }

  .table-wrap { overflow-x: auto; margin: .75rem 0; }
  .compare-table { border-collapse: collapse; background: #fff; margin: 0 auto; font-size: .9rem; }
  .compare-table th, .compare-table td { border: 1px solid #e3e3e3; padding: .5rem .8rem; text-align: center; white-space: nowrap; }
  .compare-table .rowhead { background: #f4f7ff; font-weight: 600; }
  .compare-table .mark { background: #fff4e6; color: var(--c-orange); font-weight: 700; }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; justify-content: center; margin: .5rem 0 0; font-size: .88rem; }
  .legend > span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend > span > i { display: inline-block; width: 22px; height: 4px; border-radius: 2px; font-style: normal; }
  .legend > span > b { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>傾きから求める接線</h1>
  <p class="subtitle">傾きだけが分かっているとき、接点を逆算して接線を決める手順を確かめましょう。</p>

  <h2>基本の考え方</h2>
  <p>接点がどこか分からないときは、接点の <span id="f-x"></span> 座標を <span id="f-a"></span> とおきます。<span id="f-a2"></span> における接線の傾きは <span id="f-fpa"></span> なので、これが指定された傾きに等しい、という方程式ができます。</p>
  <div class="formula-box" id="f-key"></div>
  <p>この方程式を解くと <span id="f-a3"></span> が決まり、接点の座標 <span id="f-pt"></span> も分かります。あとは通る点と傾きから直線を書くだけです。</p>

  <h2>解く問題</h2>
  <div class="formula-box" id="f-problem"></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <div class="tabs">
    <button class="tab active" id="tab1">例の曲線</button>
    <button class="tab" id="tab2">問題の曲線</button>
  </div>
  <p id="mode-desc"></p>

  <div class="slider-row">
    <label>傾き =</label>
    <input type="range" id="m-slider" min="-7" max="7" step="0.5" value="4">
    <span class="slider-val" id="m-value">4</span>
  </div>

  <div class="anim-btn-row">
    <button class="btn" id="btn-star"></button>
    <button class="btn primary" id="anim-sweep">傾きを動かす</button>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 560" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend" id="legend"></div>
  <p class="drag-hint">下の図を縦にドラッグしても傾きが変わります。</p>

  <div class="live-calc" id="live-calc"></div>
  <div class="note" id="note-box"></div>

  <h2>傾きと接点の対応</h2>
  <div class="table-wrap"><table class="compare-table" id="val-table"></table></div>

  <h2>答え</h2>
  <div class="formula-box" id="result-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=560,mL=62,mR=28;
const PW=W-mL-mR;
const TT=22, TH=298;          /* top panel: the curve and its tangent */
const BT=372, BH=152;         /* bottom panel: the derivative and the chosen height */
const YB0=-8, YB1=8;
const MMIN=-7, MMAX=7;

const MODES={
  1:{ f:x=>-x*x+2*x, fp:x=>-2*x+2, aOf:m=>(2-m)/2,
      ftex:'y=-x^2+2x', fptex:"y'=-2x+2", eqtex:"-2a+2",
      XMIN:-2.5, XMAX:4.5, YMIN:-12, YMAX:4, yt:[-12,-10,-8,-6,-4,-2,0,2,4],
      mStar:4, tbl:[6,4,2,0,-2] },
  2:{ f:x=>x*x+x-1, fp:x=>2*x+1, aOf:m=>(m-1)/2,
      ftex:'y=x^2+x-1', fptex:"y'=2x+1", eqtex:"2a+1",
      XMIN:-4, XMAX:3, YMIN:-8, YMAX:12, yt:[-8,-6,-4,-2,0,2,4,6,8,10,12],
      mStar:-3, tbl:[-5,-3,-1,1,3] }
};
let mode=1, mVal=4, animId=null;
let XMIN=-2.5, XMAX=4.5, YMIN=-12, YMAX=4;
function M(){ return MODES[mode]; }
function px(x){ return mL+(x-XMIN)/(XMAX-XMIN)*PW; }
function pyT(y){ return TT+TH-(y-YMIN)/(YMAX-YMIN)*TH; }
function pyB(y){ return BT+BH-(y-YB0)/(YB1-YB0)*BH; }

function fmt(v){
  if(Math.abs(v)<5e-13) v=0;
  let s=v.toFixed(6);
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  if(s==='-0') s='0';
  return s;
}
function rel(v){ return Math.abs(parseFloat(v.toFixed(6))-v)<1e-11 ? '=' : '\\fallingdotseq'; }
function par(v){ return v<0 ? '('+fmt(v)+')' : fmt(v); }
function lineTex(m,c){
  const mt = Math.abs(m)<5e-13 ? '' : (Math.abs(m-1)<5e-13 ? 'x' : (Math.abs(m+1)<5e-13 ? '-x' : fmt(m)+'x'));
  const ct = Math.abs(c)<5e-13 ? '' : (c>0 ? '+'+fmt(c) : '-'+fmt(-c));
  return mt==='' ? fmt(c) : mt+ct;
}
function clipLine(m,x0,y0){
  const pts=[], yAt=x=>y0+m*(x-x0);
  [XMIN,XMAX].forEach(x=>{ const y=yAt(x); if(y>=YMIN-1e-9 && y<=YMAX+1e-9) pts.push({x:x,y:y}); });
  if(Math.abs(m)>1e-9){
    [YMIN,YMAX].forEach(y=>{ const x=x0+(y-y0)/m; if(x>=XMIN-1e-9 && x<=XMAX+1e-9) pts.push({x:x,y:y}); });
  }
  const u=[];
  for(const p of pts){ if(!u.some(q=>Math.abs(q.x-p.x)<1e-7 && Math.abs(q.y-p.y)<1e-7)) u.push(p); }
  return u.length>=2 ? [u[0],u[1]] : null;
}
function curvePath(f){
  let d='', pen=false;
  for(let i=0;i<=320;i++){
    const x=XMIN+(XMAX-XMIN)*i/320, y=f(x);
    if(y<YMIN||y>YMAX){ pen=false; continue; }
    d+=(pen?'L':'M')+` ${px(x).toFixed(2)} ${pyT(y).toFixed(2)}`;
    pen=true;
  }
  return d;
}

function init(){
  const spans={'f-x':'x','f-a':'a','f-a2':'x=a','f-a3':'a','f-fpa':"f'(a)",'f-pt':'(a,\\ f(a))'};
  for(const id in spans) document.getElementById(id).innerHTML=T(spans[id]);
  tex("f'(a)=\\text{（指定された傾き）}", document.getElementById('f-key'), true);
  tex('y=x^2+x-1 \\quad \\text{について、傾きが } -3 \\text{ の接線}', document.getElementById('f-problem'), true);
  tex('y=-3x-5', document.getElementById('result-box'), true);

  initWalkthrough();
  setupTabs();
  setupSlider();
  setupAnim();
  setupDrag();
  applyMode();
}

function initWalkthrough(){
  const steps=[
    { label:'Step 1: 関数をおく', formula:'f(x)=x^2+x-1' },
    { label:'Step 2: 導関数を求める', formula:"f'(x)=2x+1" },
    { label:'Step 3: 接点の x 座標を a とおく', formula:"\\text{接線の傾きは } f'(a)=2a+1" },
    { label:'Step 4: 傾きが −3 という条件を式にする', formula:'2a+1=-3' },
    { label:'Step 5: 接点の x 座標を求める', formula:'2a=-4 \\quad \\text{より} \\quad a=-2' },
    { label:'Step 6: 接点の y 座標を求める', formula:'f(-2)=(-2)^2+(-2)-1=1' },
    { label:'Step 7: 通る点と傾きから直線を書く', formula:'y-1=-3\\{x-(-2)\\}' },
    { label:'Step 8: 答え', formula:'y=-3x-5' }
  ];
  let cur=0;
  const container=document.getElementById('walkthrough'), counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=cur;i++){
      html+=`<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${cur+1} / ${steps.length}`;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{ if(cur>0){cur--;render();} });
  nextBtn.addEventListener('click',()=>{ if(cur<steps.length-1){cur++;render();} });
  render();
}

function draw(){
  const c=M(), m=mVal, a=c.aOf(m), fa=c.f(a);
  const HALO=' stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round"';
  const HALO2=' stroke="#fff" stroke-width="2.5" paint-order="stroke" stroke-linejoin="round"';
  const AXL='font-size:14px;color:#999;display:inline-block;background:#fff';
  let s='', ticks='';
  const alW=84, alX=Math.max(0, Math.min(W-alW, px(a)-alW/2));
  /* boxes the tick numbers must keep clear: the value of a, and the mark P */
  const leftEdge = px(a)-26<mL;
  const boxes=[{x:alX, y:BT+BH+2, w:alW, h:24},
               leftEdge ? {x:px(a)-10, y:pyT(fa)-33, w:20, h:17}
                        : {x:px(a)-29, y:pyT(fa)-27, w:23, h:17},
               /* the two moving points: a tick number half-hidden under one is worse than none */
               {x:px(a)-11, y:pyT(fa)-11, w:22, h:22},
               {x:px(a)-10, y:pyB(m)-10, w:20, h:20}];
  const clear=r=>!boxes.some(b=>r.x<b.x+b.w && b.x<r.x+r.w && r.y<b.y+b.h && b.y<r.y+r.h);

  /* ---- panel backgrounds and grids ---- */
  s+=`<rect x="${mL}" y="${TT}" width="${PW}" height="${TH}" fill="#fff" stroke="#e3e3e3"/>`;
  for(let k=Math.ceil(XMIN);k<=Math.floor(XMAX);k++)
    s+=`<line x1="${px(k)}" y1="${TT}" x2="${px(k)}" y2="${TT+TH}" stroke="${k===0?'#999':'#eee'}" stroke-width="${k===0?1.5:1}"/>`;
  c.yt.forEach(k=>{
    s+=`<line x1="${mL}" y1="${pyT(k)}" x2="${mL+PW}" y2="${pyT(k)}" stroke="${k===0?'#999':'#eee'}" stroke-width="${k===0?1.5:1}"/>`;
  });
  s+=`<rect x="${mL}" y="${BT}" width="${PW}" height="${BH}" fill="#fff" stroke="#e3e3e3"/>`;
  for(let k=Math.ceil(XMIN);k<=Math.floor(XMAX);k++)
    s+=`<line x1="${px(k)}" y1="${BT}" x2="${px(k)}" y2="${BT+BH}" stroke="${k===0?'#999':'#eee'}" stroke-width="${k===0?1.5:1}"/>`;
  [-6,-4,-2,0,2,4,6].forEach(k=>{
    s+=`<line x1="${mL}" y1="${pyB(k)}" x2="${mL+PW}" y2="${pyB(k)}" stroke="${k===0?'#999':'#eee'}" stroke-width="${k===0?1.5:1}"/>`;
  });

  /* the connector ties the point of tangency to the height that produced it */
  s+=`<line x1="${px(a)}" y1="${pyT(fa)}" x2="${px(a)}" y2="${BT+BH}" stroke="#c9d3e8" stroke-width="1.5" stroke-dasharray="5 5"/>`;

  /* ---- top panel: curve and tangent ---- */
  s+=`<path d="${curvePath(c.f)}" fill="none" stroke="var(--c-purple)" stroke-width="2.5"/>`;
  const seg=clipLine(m,a,fa);
  if(seg) s+=`<line x1="${px(seg[0].x)}" y1="${pyT(seg[0].y)}" x2="${px(seg[1].x)}" y2="${pyT(seg[1].y)}" stroke="var(--c-orange)" stroke-width="3"/>`;

  /* ---- bottom panel: the derivative line meets the chosen height ---- */
  s+=`<line x1="${px(XMIN)}" y1="${pyB(c.fp(XMIN))}" x2="${px(XMAX)}" y2="${pyB(c.fp(XMAX))}" stroke="var(--c-green)" stroke-width="3"/>`;
  s+=`<line x1="${mL}" y1="${pyB(m)}" x2="${mL+PW}" y2="${pyB(m)}" stroke="var(--c-orange)" stroke-width="2.5" stroke-dasharray="7 5"/>`;

  /* tick numbers come after the curves so they are never buried */
  for(let k=Math.ceil(XMIN);k<=Math.floor(XMAX);k++){
    if(k===0) continue;
    if(clear({x:px(k)-5,y:pyT(0)+6,w:10,h:14}))
      ticks+=`<text x="${px(k)}" y="${pyT(0)+16}" text-anchor="middle" font-size="11" fill="#aaa"${HALO2}>${k}</text>`;
    if(clear({x:px(k)-5,y:pyB(0)+6,w:10,h:14}))
      ticks+=`<text x="${px(k)}" y="${pyB(0)+16}" text-anchor="middle" font-size="11" fill="#aaa"${HALO2}>${k}</text>`;
  }
  c.yt.forEach(k=>{ if(k!==0) ticks+=`<text x="${mL-8}" y="${pyT(k)+4}" text-anchor="end" font-size="11" fill="#aaa"${HALO2}>${k}</text>`; });
  [-6,-4,-2,2,4,6].forEach(k=>{ ticks+=`<text x="${mL-8}" y="${pyB(k)+4}" text-anchor="end" font-size="11" fill="#aaa"${HALO2}>${k}</text>`; });
  s+=ticks;

  /* ---- the two moving points ---- */
  s+=`<circle cx="${px(a)}" cy="${pyB(m)}" r="8" fill="var(--c-orange)" stroke="#fff" stroke-width="2.5"/>`;
  s+=`<circle cx="${px(a)}" cy="${pyB(m)}" r="8" fill="none" stroke="var(--c-orange)" stroke-width="2" opacity="0.5"><animate attributeName="r" values="8;15;8" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="1.8s" repeatCount="indefinite"/></circle>`;
  s+=`<circle cx="${px(a)}" cy="${pyT(fa)}" r="9" fill="var(--c-red)" stroke="#fff" stroke-width="2.5"/>`;
  s+=`<text x="${leftEdge?px(a):px(a)-14}" y="${leftEdge?pyT(fa)-18:pyT(fa)-12}" text-anchor="${leftEdge?'middle':'end'}" font-size="15" font-weight="700" fill="var(--c-red)"${HALO}>P</text>`;

  /* ---- fixed labels ---- */
  s+=`<foreignObject x="${alX}" y="${BT+BH+2}" width="${alW}" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#e67e22;font-weight:700;text-align:center;white-space:nowrap"><span style="background:#fff;border-radius:4px;padding:0 2px">${T('a'+rel(a)+fmt(a))}</span></div></foreignObject>`;
  s+=`<foreignObject x="${mL+PW-24}" y="${pyT(0)+2}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${AXL}">${T('x')}</div></foreignObject>`;
  s+=`<foreignObject x="${px(0)+6}" y="${TT+2}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${AXL}">${T('y')}</div></foreignObject>`;
  s+=`<foreignObject x="${mL+PW-24}" y="${pyB(0)+2}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${AXL}">${T('x')}</div></foreignObject>`;
  s+=`<foreignObject x="${mL+6}" y="${BT+3}" width="70" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:var(--c-green);font-weight:700;display:inline-block;background:#fff">${T("y'")}</div></foreignObject>`;

  document.getElementById('graph').innerHTML=s;
  updateLive(m,a,fa);
}

function updateLive(m,a,fa){
  const c=M(), k=fa-m*a;
  document.getElementById('live-calc').innerHTML=
    `<div style="color:var(--c-orange)">${T('\\text{指定された傾き}='+fmt(m))}</div>`+
    `<div style="color:var(--c-green)">${T(c.eqtex+'='+fmt(m)+' \\quad \\text{より} \\quad a'+rel(a)+fmt(a))}</div>`+
    `<div style="color:var(--c-red)">${T('\\text{接点 }\\mathrm{P}('+fmt(a)+',\\ '+fmt(fa)+')')}</div>`+
    `<div style="color:var(--c-orange)">${T('y-'+par(fa)+'='+par(m)+'(x-'+par(a)+')')}</div>`+
    `<div style="color:var(--c-orange)">${T('y'+rel(k)+lineTex(m,k))}　接線の方程式</div>`;

  const note=document.getElementById('note-box');
  if(Math.abs(m-c.mStar)<1e-9){
    note.innerHTML = (mode===2)
      ? '指定された傾きに合いました。下の図でオレンジの水平線と緑の直線が交わる位置が、そのまま接点の '+T('x')+' 座標です。'
      : '例で指定された傾きに合いました。同じ読み方で問題の曲線も解けます。';
  } else if(Math.abs(m)<1e-9){
    note.innerHTML='傾きが 0 のときの接点は放物線の頂点です。接線は '+T('x')+' 軸に平行になります。';
  } else {
    note.innerHTML='オレンジの水平線の高さが、指定された傾きです。緑の直線 '+T(c.fptex)+' と交わる点の '+T('x')+' 座標が接点の位置になります。';
  }
}

function buildTable(){
  const c=M();
  let r1='<tr><th class="rowhead">傾き</th>';
  let r2='<tr><th class="rowhead">'+T('a')+'</th>';
  let r3='<tr><th class="rowhead">'+T('f(a)')+'</th>';
  let r4='<tr><th class="rowhead">接線</th>';
  c.tbl.forEach(m=>{
    const a=c.aOf(m), fa=c.f(a), k=fa-m*a;
    const mk=(Math.abs(m-c.mStar)<1e-9)?' class="mark"':'';
    r1+='<td'+mk+'>'+T(fmt(m))+'</td>';
    r2+='<td'+mk+'>'+T(fmt(a))+'</td>';
    r3+='<td'+mk+'>'+T(fmt(fa))+'</td>';
    r4+='<td'+mk+'>'+T('y='+lineTex(m,k))+'</td>';
  });
  document.getElementById('val-table').innerHTML=r1+'</tr>'+r2+'</tr>'+r3+'</tr>'+r4+'</tr>';
}

function setM(v){
  mVal=Math.round(Math.max(MMIN,Math.min(MMAX,v))*2)/2;
  document.getElementById('m-slider').value=mVal;
  document.getElementById('m-value').textContent=fmt(mVal);
}

function applyMode(){
  const c=M();
  XMIN=c.XMIN; XMAX=c.XMAX; YMIN=c.YMIN; YMAX=c.YMAX;
  document.getElementById('tab1').classList.toggle('active',mode===1);
  document.getElementById('tab2').classList.toggle('active',mode===2);
  document.getElementById('mode-desc').innerHTML=
    (mode===1
      ? '曲線 '+T('y=-x^2+2x')+' で傾きが '+T('4')+' の接線を探します。傾きを 4 にすると接点が '+T('(-1,\\ -3)')+' に止まります。'
      : '曲線 '+T('y=x^2+x-1')+' で傾きが '+T('-3')+' の接線を探します。傾きを '+T('-3')+' にすると求める接線になります。');
  document.getElementById('legend').innerHTML=
    '<span><i style="background:var(--c-purple)"></i>'+T(c.ftex)+'</span>'+
    '<span><b style="background:var(--c-red)"></b>'+T('\\text{接点 }\\mathrm{P}(a,\\ f(a))')+'</span>'+
    '<span><i style="background:var(--c-orange)"></i>接線と指定された傾きの高さ</span>'+
    '<span><i style="background:var(--c-green)"></i>'+T(c.fptex)+'（下の図）</span>';
  document.getElementById('btn-star').innerHTML='傾き '+T(fmt(c.mStar))+' にする';
  buildTable();
  setM(c.mStar);
  draw();
}

function setupTabs(){
  document.getElementById('tab1').addEventListener('click',()=>{ stopAnim(); mode=1; applyMode(); });
  document.getElementById('tab2').addEventListener('click',()=>{ stopAnim(); mode=2; applyMode(); });
}
function setupSlider(){
  const sl=document.getElementById('m-slider');
  sl.addEventListener('input',()=>{ stopAnim(); setM(parseFloat(sl.value)); draw(); });
}
function stopAnim(){ if(animId){ cancelAnimationFrame(animId); animId=null; } }

function setupAnim(){
  document.getElementById('btn-star').addEventListener('click',()=>{ stopAnim(); setM(M().mStar); draw(); });
  document.getElementById('anim-sweep').addEventListener('click',()=>{
    stopAnim();
    let t0=null; const duration=4200, from=MMAX, to=MMIN;
    setM(from); draw();
    function frame(ts){
      if(!t0) t0=ts;
      const pr=Math.min((ts-t0)/duration,1);
      const eased = pr<0.5 ? 2*pr*pr : 1-Math.pow(-2*pr+2,2)/2;
      setM(from+(to-from)*eased);
      draw();
      animId = pr<1 ? requestAnimationFrame(frame) : null;
    }
    animId=requestAnimationFrame(frame);
  });
}

function setupDrag(){
  const svg=document.getElementById('graph');
  const wrap=document.getElementById('svg-wrap');
  let dragging=false;

  function toSvg(cx,cy){
    const rect=svg.getBoundingClientRect();
    return { x:(cx-rect.left)/rect.width*W, y:(cy-rect.top)/rect.height*H };
  }
  function valueAt(pt){ return YB1-(pt.y-BT)/BH*(YB1-YB0); }
  function inArea(pt){ return pt.x>mL-24 && pt.x<mL+PW+24 && pt.y>BT-16 && pt.y<BT+BH+16; }
  function startDrag(cx,cy){
    const pt=toSvg(cx,cy);
    if(!inArea(pt)) return;
    stopAnim(); dragging=true;
    setM(valueAt(pt)); draw();
  }
  function moveDrag(cx,cy){ if(dragging){ setM(valueAt(toSvg(cx,cy))); draw(); } }
  function endDrag(){ dragging=false; }

  wrap.addEventListener('mousedown', e => { e.preventDefault(); startDrag(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { if(dragging){ e.preventDefault(); moveDrag(e.clientX, e.clientY); } });
  window.addEventListener('mouseup', endDrag);

  wrap.addEventListener('touchstart', e => { const t=e.touches[0]; startDrag(t.clientX, t.clientY); }, {passive:true});
  wrap.addEventListener('touchmove', e => { if(dragging){ e.preventDefault(); const t=e.touches[0]; moveDrag(t.clientX, t.clientY); } }, {passive:false});
  wrap.addEventListener('touchend', endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
