<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>指数関数のグラフの作図</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0; }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative; }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto; }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn { appearance: none; border: 1px solid #d4dbeb; background: #fff; color: var(--accent);
    font-size: 1rem; font-weight: 600; padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  /* keep each inline formula on one line; KaTeX otherwise breaks mid-relation */
  .note .katex, .status .katex, p .katex { white-space: nowrap; }
  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px;
    padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }

  .slider-row { display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .75rem; flex-wrap: wrap; margin: .5rem 0; }

  .table-wrap { overflow-x: auto; margin: .75rem 0; }
  .compare-table { border-collapse: collapse; background: #fff; margin: 0 auto; min-width: 100%; }
  .compare-table th, .compare-table td { border: 1px solid #e3e3e3; padding: .5rem .6rem; text-align: center; white-space: nowrap; font-size: .9rem; }
  .compare-table th { background: #f4f7ff; }
  .compare-table td.hit { background: #fff2e0; }

  .legend { display: flex; justify-content: center; gap: 1.25rem; flex-wrap: wrap; font-size: .9rem; margin: .5rem 0 0; }
  .legend span.chip { display: inline-block; width: 26px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: .4rem; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>指数関数のグラフの作図</h1>
  <p class="subtitle">値の表から点をとり、なめらかな曲線で結んでグラフをかきましょう。</p>

  <h2>この問題</h2>
  <div class="formula-box" id="f-problem"></div>
  <p>やることは 3 つです。値の表をつくる。表の組を座標平面上の点としてとる。その点をなめらかな曲線で結ぶ。</p>

  <h2>値の表をつくる</h2>
  <p>負の指数は逆数、分数の指数は累乗根に直して値を求めます。</p>
  <div class="table-wrap"><table class="compare-table" id="val-table"></table></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>点を打って結ぼう</h2>
  <p>「点を打って結ぶ」をタップすると、表の 9 個の点が左から順にとられ、最後になめらかな曲線で結ばれます。</p>
  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">点を打って結ぶ</button>
    <button class="btn" id="toggle-btn"></button>
  </div>
  <div class="legend" id="legend"></div>
  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="slider-row">
    <label><span id="lbl-x"></span> =</label>
    <input type="range" id="x-slider" min="-2.2" max="2.05" step="0.05" value="1">
    <span class="slider-val" id="x-value">1.00</span>
  </div>
  <div class="live-calc" id="live-calc"></div>

  <h2>グラフからわかること</h2>
  <div class="note" id="note1"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=520,ox=300,oy=470,sx=100,sy=45;
const XMIN=-2.4,XMAX=2.05,YMAX=9.7;
function px(x){return ox+x*sx;}
function py(y){return oy-y*sy;}

const XS=[-2,-1.5,-1,-0.5,0,0.5,1,1.5,2];
const XTEX=['-2','-\\dfrac{3}{2}','-1','-\\dfrac{1}{2}','0','\\dfrac{1}{2}','1','\\dfrac{3}{2}','2'];
const YTEX=['\\dfrac{1}{9}','\\dfrac{1}{3\\sqrt{3}}','\\dfrac{1}{3}','\\dfrac{1}{\\sqrt{3}}','1','\\sqrt{3}','3','3\\sqrt{3}','9'];
const YNUM=['0.11','0.19','0.33','0.58','1','1.73','3','5.20','9'];

let xVal=1, showTwo=false, revealN=XS.length, curveP=1, showP=true, animId=null;

function init(){
  tex('y=3^{x}\\;\\text{のグラフをかけ。}',document.getElementById('f-problem'),true);
  document.getElementById('lbl-x').innerHTML=T('x');
  buildTable();
  buildLegend();
  initWalkthrough();
  setupSlider();
  setupButtons();
  document.getElementById('note1').innerHTML='定義域は実数全体、値域は '+T('y>0')+'。点 '+T('(0,\\,1)')+' と '+T('(1,\\,3)')+' を通り、'+T('x')+' 軸が漸近線。'+T('x')+' が 1 増えるごとに '+T('y')+' は 3 倍になる増加関数。';
  draw();
}

function buildTable(){
  let h='<tr><th>'+T('x')+'</th>';
  for(let i=0;i<XS.length;i++) h+='<th id="tx'+i+'">'+T(XTEX[i])+'</th>';
  h+='</tr><tr><th>'+T('y=3^{x}')+'</th>';
  for(let i=0;i<XS.length;i++) h+='<td id="ty'+i+'">'+T(YTEX[i])+'</td>';
  h+='</tr><tr><th>およその値</th>';
  for(let i=0;i<XS.length;i++) h+='<td id="tn'+i+'">'+YNUM[i]+'</td>';
  h+='</tr>';
  document.getElementById('val-table').innerHTML=h;
}

function buildLegend(){
  document.getElementById('legend').innerHTML=
    '<span><span class="chip" style="background:var(--c-blue)"></span>'+T('y=3^{x}')+'</span>'+
    '<span><span class="chip" style="background:var(--c-green)"></span>'+T('y=2^{x}')+'</span>'+
    '<span><span class="chip" style="background:var(--c-orange)"></span>'+T('\\mathrm{P}(x,\\,3^{x})')+'</span>';
}

function initWalkthrough(){
  const steps=[
    {label:'Step 1: 何をするか',formula:'y=3^{x}\\;\\text{に }x\\text{ の値を代入して }y\\text{ を求める}'},
    {label:'Step 2: 整数の '+T('x')+' での値',formula:'3^{-2}=\\dfrac{1}{9},\\quad 3^{-1}=\\dfrac{1}{3},\\quad 3^{0}=1,\\quad 3^{1}=3,\\quad 3^{2}=9'},
    {label:'Step 3: 負の指数は逆数',formula:'3^{-n}=\\dfrac{1}{3^{n}}\\quad\\text{（}n\\text{ は正の整数）}'},
    {label:'Step 4: 分数の指数は累乗根',formula:'3^{\\frac{1}{2}}=\\sqrt{3}=1.73\\cdots,\\quad 3^{\\frac{3}{2}}=3\\sqrt{3}=5.19\\cdots'},
    {label:'Step 5: 点をとる',formula:'\\left(-2,\\dfrac{1}{9}\\right),\\;\\left(-1,\\dfrac{1}{3}\\right),\\;(0,1),\\;(1,3),\\;(2,9)'},
    {label:'Step 6: なめらかな曲線で結ぶ',formula:'\\text{とぎれのない 1 本の曲線になる（定義域は実数全体）}'},
    {label:'Step 7: 通る点と漸近線',formula:'(0,1)\\text{ と }(1,3)\\text{ を通り、}x\\text{ 軸が漸近線}'},
    {label:'Step 8: 増え方',formula:'3^{x+1}=3\\cdot 3^{x}\\quad\\text{（}x\\text{ が }1\\text{ 増えると }y\\text{ は }3\\text{ 倍）}'}
  ];
  let cur=0;
  const container=document.getElementById('walkthrough');
  const counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev');
  const nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=cur;i++){
      html+='<div class="step '+(i===cur?'current':'')+'"><div class="label">'+steps[i].label+'</div><div class="formula-line">'+T(steps[i].formula)+'</div></div>';
    }
    container.innerHTML=html;
    counter.textContent=(cur+1)+' / '+steps.length;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{if(cur>0){cur--;render();}});
  nextBtn.addEventListener('click',()=>{if(cur<steps.length-1){cur++;render();}});
  render();
}

function curvePath(base,xEnd){
  let d='';
  const n=90;
  for(let i=0;i<=n;i++){
    const x=XMIN+(xEnd-XMIN)*i/n;
    const y=Math.pow(base,x);
    if(y>YMAX) break;
    d+=(d===''?'M':'L')+' '+px(x).toFixed(1)+' '+py(y).toFixed(1)+' ';
  }
  return d;
}

function draw(){
  const svg=document.getElementById('graph');
  let s='';
  for(let i=-2;i<=2;i++){
    s+='<line x1="'+px(i)+'" y1="'+py(YMAX)+'" x2="'+px(i)+'" y2="'+py(-0.4)+'" stroke="'+(i===0?'#999':'#eee')+'" stroke-width="'+(i===0?1.5:1)+'"/>';
  }
  for(let j=0;j<=9;j++){
    s+='<line x1="'+px(XMIN)+'" y1="'+py(j)+'" x2="'+px(XMAX)+'" y2="'+py(j)+'" stroke="'+(j===0?'#999':'#eee')+'" stroke-width="'+(j===0?1.5:1)+'"/>';
  }
  s+='<line x1="'+px(XMIN)+'" y1="'+py(0)+'" x2="'+px(XMAX)+'" y2="'+py(0)+'" stroke="#bbb" stroke-width="2" stroke-dasharray="8 6"/>';
  s+='<foreignObject x="'+(px(XMAX)-24)+'" y="'+(oy+4)+'" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">'+T('x')+'</div></foreignObject>';
  s+='<foreignObject x="'+(ox+8)+'" y="8" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">'+T('y')+'</div></foreignObject>';
  // tick labels are drawn last, with a white halo, so the curve and the moving point never hide them
  let tk='';
  for(let i=-2;i<=2;i++){
    if(i===0) continue;
    tk+='<text x="'+px(i)+'" y="'+(oy+18)+'" text-anchor="middle" font-size="12" fill="#aaa" stroke="#fff" stroke-width="3" paint-order="stroke">'+i+'</text>';
  }
  [1,3,9].forEach(v=>{ tk+='<text x="'+(ox-8)+'" y="'+(py(v)+4)+'" text-anchor="end" font-size="12" fill="#aaa" stroke="#fff" stroke-width="3" paint-order="stroke">'+v+'</text>'; });
  tk+='<text x="'+(ox-8)+'" y="'+(oy+18)+'" text-anchor="end" font-size="12" fill="#aaa" stroke="#fff" stroke-width="3" paint-order="stroke">O</text>';

  if(showTwo){
    s+='<path d="'+curvePath(2,XMAX)+'" fill="none" stroke="var(--c-green)" stroke-width="2.5" opacity="0.75" stroke-dasharray="7 5"/>';
  }
  if(curveP>0){
    const xEnd=XMIN+(XMAX-XMIN)*curveP;
    s+='<path d="'+curvePath(3,xEnd)+'" fill="none" stroke="var(--c-blue)" stroke-width="3"/>';
  }
  for(let i=0;i<revealN;i++){
    const x=XS[i],y=Math.pow(3,x);
    s+='<circle cx="'+px(x)+'" cy="'+py(y)+'" r="6" fill="var(--c-blue)" stroke="#fff" stroke-width="2"/>';
  }
  if(revealN>0 && revealN<=XS.length && animId!==null){
    const x=XS[revealN-1],y=Math.pow(3,x);
    s+='<circle cx="'+px(x)+'" cy="'+py(y)+'" r="6" fill="none" stroke="var(--c-orange)" stroke-width="3"><animate attributeName="r" values="6;14;6" dur="0.7s" repeatCount="indefinite"/></circle>';
  }
  if(curveP>=1){
    s+='<circle cx="'+px(0)+'" cy="'+py(1)+'" r="7" fill="var(--c-purple)" stroke="#fff" stroke-width="2"/>';
    s+='<text x="'+(px(0)+14)+'" y="'+(py(1)+22)+'" font-size="13" fill="var(--c-purple)" font-weight="700" stroke="#fff" stroke-width="3" paint-order="stroke">(0, 1)</text>';
    s+='<circle cx="'+px(1)+'" cy="'+py(3)+'" r="7" fill="var(--c-purple)" stroke="#fff" stroke-width="2"/>';
    s+='<text x="'+(px(1)+16)+'" y="'+(py(3)+7)+'" font-size="13" fill="var(--c-purple)" font-weight="700" stroke="#fff" stroke-width="3" paint-order="stroke">(1, 3)</text>';
  }
  if(showP && curveP>=1){
    const y=Math.pow(3,xVal);
    s+='<line x1="'+px(xVal)+'" y1="'+py(y)+'" x2="'+px(xVal)+'" y2="'+py(0)+'" stroke="var(--c-orange)" stroke-width="1.5" stroke-dasharray="5 4"/>';
    s+='<line x1="'+px(xVal)+'" y1="'+py(y)+'" x2="'+px(0)+'" y2="'+py(y)+'" stroke="var(--c-orange)" stroke-width="1.5" stroke-dasharray="5 4"/>';
    s+='<circle cx="'+px(xVal)+'" cy="'+py(y)+'" r="8" fill="var(--c-orange)" stroke="#fff" stroke-width="2.5"/>';
    s+='<text x="'+(px(xVal)-22)+'" y="'+(py(y)-16)+'" font-size="14" fill="var(--c-orange)" font-weight="700" stroke="#fff" stroke-width="3" paint-order="stroke">P</text>';
  }
  svg.innerHTML=s+tk;
  updateLive();
}

function fmtX(v){ return (Math.abs(v)<0.005?0:v).toFixed(2); }

function updateLive(){
  const lc=document.getElementById('live-calc');
  if(!showP||curveP<1){
    for(let i=0;i<XS.length;i++){ const c=document.getElementById('tn'+i); if(c) c.className=''; }
    lc.innerHTML='<span style="color:var(--muted)">点を打っています…</span>'; return;
  }
  const y=Math.pow(3,xVal);
  let html=T('x = '+fmtX(xVal))+'<br>'+T('y = 3^{'+fmtX(xVal)+'} = '+y.toFixed(3));
  const x2=xVal+1;
  if(x2<=XMAX+0.001){
    html+='<br><span style="color:var(--c-green);font-weight:600">'+T('3^{'+fmtX(x2)+'} = '+Math.pow(3,x2).toFixed(3)+' = 3\\times '+y.toFixed(3))+'</span>';
  }
  for(let i=0;i<XS.length;i++){
    document.getElementById('tn'+i).className=(Math.abs(XS[i]-xVal)<0.03)?'hit':'';
  }
  lc.innerHTML=html;
}

function setupSlider(){
  const sl=document.getElementById('x-slider');
  const vd=document.getElementById('x-value');
  sl.addEventListener('input',()=>{
    if(animId){cancelAnimationFrame(animId);animId=null;revealN=XS.length;curveP=1;showP=true;
      document.getElementById('anim-btn').disabled=false;}
    xVal=parseFloat(sl.value);
    vd.textContent=fmtX(xVal);
    draw();
  });
  vd.textContent=fmtX(xVal);
}

function setupButtons(){
  const tb=document.getElementById('toggle-btn');
  function label(){ tb.innerHTML=T('y=2^{x}')+(showTwo?' を消す':' を重ねる'); }
  label();
  tb.addEventListener('click',()=>{ showTwo=!showTwo; label(); draw(); });

  const ab=document.getElementById('anim-btn');
  ab.addEventListener('click',()=>{
    if(animId){cancelAnimationFrame(animId);animId=null;}
    ab.disabled=true;
    revealN=0; curveP=0; showP=false;
    const perPoint=230, curveDur=1100, total=XS.length*perPoint+curveDur;
    let t0=null;
    function step(ts){
      if(!t0) t0=ts;
      const e=ts-t0;
      if(e<XS.length*perPoint){
        revealN=Math.min(XS.length,Math.floor(e/perPoint)+1);
        curveP=0;
      }else{
        revealN=XS.length;
        const p=Math.min((e-XS.length*perPoint)/curveDur,1);
        curveP=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      }
      draw();
      if(e<total){ animId=requestAnimationFrame(step); }
      else { animId=null; curveP=1; showP=true; ab.disabled=false; draw(); }
    }
    animId=requestAnimationFrame(step);
  });
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
</body>
</html>
