<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>定数の分離と実数解の個数</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0; }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; margin: .75rem 0; overflow: hidden; touch-action: none; position: relative; }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* draw() replaces the SVG contents, which would orphan a touch sequence that
     started on a child; keep hit-testing on the wrapper so the drag survives */
  .svg-container > svg { pointer-events: none; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto; }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; gap: .5rem; margin: .75rem 0; }
  .tab { appearance: none; flex: 1; border: 1px solid #d4dbeb; background: #fff; color: var(--accent); font-size: .95rem; font-weight: 600; padding: .7rem .5rem; border-radius: 10px; min-height: 48px; cursor: pointer; font-family: inherit; user-select: none; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }
  .live-calc > div { margin: .25rem 0; }
  .live-calc > div > .count { font-size: 1.5rem; font-weight: 700; color: var(--c-orange); padding: 0 .2rem; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row { display: flex; align-items: center; gap: 1rem; margin: .75rem 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; }
  .slider-row > label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row > input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row > .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; margin: .5rem 0; }

  .table-wrap { overflow-x: auto; margin: .75rem 0; }
  .compare-table { border-collapse: collapse; background: #fff; margin: 0 auto; font-size: .9rem; }
  .compare-table th, .compare-table td { border: 1px solid #e3e3e3; padding: .5rem .8rem; text-align: center; white-space: nowrap; }
  .compare-table .rowhead { background: #f4f7ff; font-weight: 600; }
  .compare-table .mark { background: #fff4e6; color: var(--c-orange); font-weight: 700; }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; justify-content: center; margin: .5rem 0 0; font-size: .88rem; }
  .legend > span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend > span > i { display: inline-block; width: 20px; height: 0; border-top-width: 3px; border-top-style: solid; }
  .legend > span > b { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>定数の分離と実数解の個数</h1>
  <p class="subtitle">定数を右辺に分けて、上下に動く水平線との共有点として実数解の個数を数えましょう。</p>

  <h2>基本の考え方</h2>
  <p>定数 <span id="f-a"></span> を含む項を右辺に移すと、方程式は <span id="f-shape"></span> の形になります。左辺を <span id="f-fx"></span> とおくと、この方程式の実数解の個数は、曲線 <span id="f-curve"></span> と直線 <span id="f-line"></span> の共有点の個数に一致します。</p>
  <div class="formula-box" id="f-key"></div>
  <p>直線 <span id="f-line2"></span> は高さ <span id="f-a2"></span> の水平線なので、<span id="f-a3"></span> を変えると上下に平行移動するだけです。共有点の個数が切り替わるのは、この直線がちょうど極大値・極小値の高さを通る瞬間です。</p>

  <h2>解く問題</h2>
  <div class="formula-box" id="f-problem"></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <div class="tabs">
    <button class="tab active" id="tab1">この方程式</button>
    <button class="tab" id="tab2">別の方程式</button>
  </div>
  <p id="mode-desc"></p>

  <div class="slider-row">
    <label><span id="lbl-a"></span> =</label>
    <input type="range" id="a-slider" min="-3" max="3" step="0.1" value="-0.4">
    <span class="slider-val" id="a-value">-0.4</span>
  </div>
  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">直線を上から下へ動かす</button>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 430" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend" id="legend"></div>
  <p class="drag-hint" id="drag-hint"></p>

  <div class="live-calc" id="live-calc"></div>
  <div class="table-wrap"><table class="compare-table" id="case-table"></table></div>
  <div class="note" id="note-box"></div>

  <h2>答え</h2>
  <div class="formula-box" id="result-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=430,mL=56,PW=430,TT=26,PH=372,GX=520;

const MODES={
  1:{ f:x=>2*x*x*x-3*x*x, ytex:'y=2x^3-3x^2', eq:'2x^3-3x^2-a=0', sep:'2x^3-3x^2=a',
      X0:-1.05, X1:2.05, Y0:-3.6, Y1:3.6, xt:[-1,1,2], yt:[-3,-2,-1,1,2,3],
      xM:0, fmax:0, xm:1, fmin:-1, amin:-3, amax:3, a0:-0.4 },
  2:{ f:x=>x*x*x-3*x, ytex:'y=x^3-3x', eq:'x^3-3x-a=0', sep:'x^3-3x=a',
      X0:-2.35, X1:2.35, Y0:-4.6, Y1:4.6, xt:[-2,-1,1,2], yt:[-4,-2,2,4],
      xM:-1, fmax:2, xm:1, fmin:-2, amin:-4, amax:4, a0:1 }
};
let mode=1, aVal=-0.4, animId=null;
function M(){ return MODES[mode]; }
function px(x){ const m=M(); return mL+(x-m.X0)/(m.X1-m.X0)*PW; }
function py(y){ const m=M(); return TT+PH-(y-m.Y0)/(m.Y1-m.Y0)*PH; }

function fmt(v){
  if(Math.abs(v)<5e-13) v=0;
  let s=v.toFixed(6);
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  if(s==='-0') s='0';
  return s;
}
function rel(v){ return Math.abs(parseFloat(v.toFixed(6))-v)<1e-11 ? '=' : '\\fallingdotseq'; }

/* the three monotone branches of a cubic give at most one root each */
function roots(a){
  const m=M(), f=m.f;
  const br=[[m.xM-6,m.xM],[m.xM,m.xm],[m.xm,m.xm+6]], out=[];
  for(const b of br){
    let lo=b[0], hi=b[1];
    const glo=f(lo)-a, ghi=f(hi)-a;
    if(Math.abs(glo)<1e-12){ out.push(lo); continue; }
    if(Math.abs(ghi)<1e-12){ out.push(hi); continue; }
    if(glo*ghi>0) continue;
    for(let i=0;i<70;i++){ const mid=(lo+hi)/2; if((f(lo)-a)*(f(mid)-a)<=0) hi=mid; else lo=mid; }
    out.push((lo+hi)/2);
  }
  const u=[];
  for(const r of out) if(!u.some(q=>Math.abs(q-r)<1e-5)) u.push(r);
  return u.sort((p,q)=>p-q);
}
function nSol(a){
  const m=M();
  if(Math.abs(a-m.fmax)<1e-9 || Math.abs(a-m.fmin)<1e-9) return 2;
  return (a>m.fmax || a<m.fmin) ? 1 : 3;
}
function caseIndex(a){
  const m=M();
  if(Math.abs(a-m.fmin)<1e-9) return 1;
  if(Math.abs(a-m.fmax)<1e-9) return 3;
  if(a<m.fmin) return 0;
  if(a>m.fmax) return 4;
  return 2;
}

function init(){
  const spans={'f-a':'a','f-a2':'a','f-a3':'a','f-shape':'f(x)=a','f-fx':'f(x)',
               'f-curve':'y=f(x)','f-line':'y=a','f-line2':'y=a'};
  for(const id in spans) document.getElementById(id).innerHTML=T(spans[id]);
  tex('2x^3-3x^2-a=0 \\iff 2x^3-3x^2=a', document.getElementById('f-key'), true);
  tex('2x^3-3x^2-a=0 \\ \\text{の異なる実数解の個数は、}a\\ \\text{でどう変わるか}',
      document.getElementById('f-problem'), true);
  tex('\\begin{aligned}'
    + '&a<-1,\\ \\ 0<a \\quad \\text{のとき}\\ \\ 1\\ \\text{個}\\\\'
    + '&a=-1,\\ \\ a=0 \\quad \\text{のとき}\\ \\ 2\\ \\text{個}\\\\'
    + '&-1<a<0 \\quad \\text{のとき}\\ \\ 3\\ \\text{個}'
    + '\\end{aligned}', document.getElementById('result-box'), true);
  document.getElementById('tab1').innerHTML=T('2x^3-3x^2-a=0');
  document.getElementById('tab2').innerHTML=T('x^3-3x-a=0');
  document.getElementById('lbl-a').innerHTML=T('a');
  document.getElementById('note-box').innerHTML=
    '個数が切り替わるのは、直線 '+T('y=a')+' が極大値・極小値とちょうど同じ高さになった瞬間だけです。'
    +'そのときは接するように重なるので、共有点は 3 個ではなく 2 個になります。';

  initWalkthrough();
  setupTabs();
  setupSlider();
  setupAnim();
  setupDrag();
  applyMode();
}

function initWalkthrough(){
  const steps=[
    { label:'Step 1: 定数を右辺に分ける',
      formula:'2x^3-3x^2-a=0 \\ \\Longrightarrow \\ 2x^3-3x^2=a' },
    { label:'Step 2: 左辺を関数とおく',
      formula:'f(x)=2x^3-3x^2 \\ \\text{とおくと、実数解の個数}=y=f(x)\\ \\text{と}\\ y=a\\ \\text{の共有点の個数}' },
    { label:'Step 3: 導関数を求める',
      formula:"f'(x)=6x^2-6x=6x(x-1)" },
    { label:'Step 4: 導関数が 0 になる x を出す',
      formula:"f'(x)=0 \\ \\Longrightarrow \\ x=0,\\ 1" },
    { label:'Step 5: 増減表をつくる',
      formula:"\\begin{array}{c|ccccc} x & \\cdots & 0 & \\cdots & 1 & \\cdots \\\\ \\hline"
             +" f'(x) & + & 0 & - & 0 & + \\\\ \\hline"
             +" f(x) & \\nearrow & \\text{極大}\\ 0 & \\searrow & \\text{極小}\\ {-1} & \\nearrow \\end{array}" },
    { label:'Step 6: グラフと水平線の共有点を数える',
      formula:'\\text{極小値}\\ -1 \\ \\text{と極大値}\\ 0\\ \\text{の高さで個数が切り替わる}' },
    { label:'Step 7: 答え',
      formula:'a<-1,\\ 0<a\\ \\text{のとき}\\ 1\\ \\text{個};\\quad a=-1,\\ 0\\ \\text{のとき}\\ 2\\ \\text{個};\\quad -1<a<0\\ \\text{のとき}\\ 3\\ \\text{個}' }
  ];
  let cur=0;
  const container=document.getElementById('walkthrough'), counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=cur;i++){
      html+=`<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${cur+1} / ${steps.length}`;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{ if(cur>0){cur--;render();} });
  nextBtn.addEventListener('click',()=>{ if(cur<steps.length-1){cur++;render();} });
  render();
}

function curvePath(){
  const m=M();
  let d='', pen=false;
  for(let i=0;i<=400;i++){
    const x=m.X0+(m.X1-m.X0)*i/400, y=m.f(x);
    if(y<m.Y0||y>m.Y1){ pen=false; continue; }
    d+=(pen?'L':'M')+` ${px(x).toFixed(2)} ${py(y).toFixed(2)}`;
    pen=true;
  }
  return d;
}

function draw(){
  const m=M(), a=aVal, rs=roots(a);
  const HALO2=' stroke="#fff" stroke-width="2.5" paint-order="stroke" stroke-linejoin="round"';
  const LBL='font-size:13px;display:inline-block;background:#fff;white-space:nowrap';
  let s='', ticks='';

  s+=`<rect x="${mL}" y="${TT}" width="${PW}" height="${PH}" fill="#fff" stroke="#e3e3e3"/>`;
  m.xt.concat([0]).forEach(k=>{
    s+=`<line x1="${px(k)}" y1="${TT}" x2="${px(k)}" y2="${TT+PH}" stroke="${k===0?'#999':'#eee'}" stroke-width="${k===0?1.5:1}"/>`;
  });
  m.yt.concat([0]).forEach(k=>{
    s+=`<line x1="${mL}" y1="${py(k)}" x2="${mL+PW}" y2="${py(k)}" stroke="${k===0?'#999':'#eee'}" stroke-width="${k===0?1.5:1}"/>`;
  });

  /* the two heights where the count changes */
  [m.fmax,m.fmin].forEach(v=>{
    s+=`<line x1="${mL}" y1="${py(v)}" x2="${mL+PW}" y2="${py(v)}" stroke="var(--c-green)" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.7"/>`;
  });
  s+=`<path d="${curvePath()}" fill="none" stroke="var(--c-purple)" stroke-width="2.5"/>`;
  s+=`<line x1="${mL}" y1="${py(a)}" x2="${mL+PW}" y2="${py(a)}" stroke="var(--c-red)" stroke-width="3"/>`;

  /* tick numbers come after the curve, and are dropped where a dot would cover them */
  const marks=rs.filter(r=>r>=m.X0&&r<=m.X1).map(r=>({x:px(r)-12,y:py(a)-12,w:24,h:24}));
  const clear=r=>!marks.some(k=>r.x<k.x+k.w && k.x<r.x+r.w && r.y<k.y+k.h && k.y<r.y+r.h);
  m.xt.forEach(k=>{
    const box={x:px(k)-7,y:py(0)+4,w:14,h:16};
    if(clear(box)) ticks+=`<text x="${px(k)}" y="${py(0)+17}" text-anchor="middle" font-size="11" fill="#aaa"${HALO2}>${k}</text>`;
  });
  m.yt.forEach(k=>{
    ticks+=`<text x="${mL-8}" y="${py(k)+4}" text-anchor="end" font-size="11" fill="#aaa"${HALO2}>${k}</text>`;
  });
  s+=ticks;

  rs.forEach(r=>{
    if(r<m.X0||r>m.X1) return;
    s+=`<circle cx="${px(r)}" cy="${py(a)}" r="7.5" fill="var(--c-orange)" stroke="#fff" stroke-width="2.5"/>`;
    s+=`<circle cx="${px(r)}" cy="${py(a)}" r="7.5" fill="none" stroke="var(--c-orange)" stroke-width="2" opacity="0.55"><animate attributeName="r" values="7.5;14;7.5" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.55;0;0.55" dur="1.8s" repeatCount="indefinite"/></circle>`;
  });

  /* fixed labels last; a fixed one is hidden when the moving line is next to it */
  s+=`<foreignObject x="${mL+6}" y="${TT+4}" width="132" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="${LBL};color:var(--c-purple);font-weight:600">${T(m.ytex)}</div></foreignObject>`;
  s+=`<foreignObject x="${mL+PW+4}" y="${py(0)+2}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${LBL};color:#999">${T('x')}</div></foreignObject>`;
  s+=`<foreignObject x="${px(0)+6}" y="${TT+2}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${LBL};color:#999">${T('y')}</div></foreignObject>`;
  [[m.fmax,'\\text{極大値}\\ '+fmt(m.fmax)],[m.fmin,'\\text{極小値}\\ '+fmt(m.fmin)]].forEach(p=>{
    if(Math.abs(py(p[0])-py(a))<30) return;
    s+=`<foreignObject x="${GX}" y="${py(p[0])-14}" width="76" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="${LBL};font-size:12px;color:var(--c-green)">${T(p[1])}</div></foreignObject>`;
  });
  s+=`<foreignObject x="${GX}" y="${py(a)-15}" width="76" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="${LBL};color:var(--c-red);font-weight:700">${T('y='+fmt(a))}</div></foreignObject>`;

  document.getElementById('graph').innerHTML=s;
  updateLive();
}

function updateLive(){
  const m=M(), a=aVal, n=nSol(a), ci=caseIndex(a);
  let pos;
  if(ci===0) pos='a<'+fmt(m.fmin);
  else if(ci===1) pos='a='+fmt(m.fmin);
  else if(ci===2) pos=fmt(m.fmin)+'<a<'+fmt(m.fmax);
  else if(ci===3) pos='a='+fmt(m.fmax);
  else pos=fmt(m.fmax)+'<a';
  document.getElementById('live-calc').innerHTML=
    `<div>${T('a '+rel(a)+' '+fmt(a))}　${T(pos)}</div>`+
    `<div>直線 ${T('y='+fmt(a))} と曲線の共有点は <span class="count">${n}</span> 個</div>`+
    `<div style="color:var(--c-orange)">${T(m.eq+' \\ \\text{の異なる実数解は}\\ '+n+'\\ \\text{個}')}</div>`;

  const cells=document.querySelectorAll('#case-table td');
  cells.forEach((td,i)=>td.classList.toggle('mark', i%5===ci));
}

function buildTable(){
  const m=M(), lo=fmt(m.fmin), hi=fmt(m.fmax);
  const ranges=['a<'+lo, 'a='+lo, lo+'<a<'+hi, 'a='+hi, hi+'<a'];
  const counts=[1,2,3,2,1];
  let r1='<tr><th class="rowhead">'+T('a')+' の範囲</th>', r2='<tr><th class="rowhead">実数解の個数</th>';
  ranges.forEach((r,i)=>{ r1+='<td>'+T(r)+'</td>'; r2+='<td>'+counts[i]+' 個</td>'; });
  document.getElementById('case-table').innerHTML=r1+'</tr>'+r2+'</tr>';
}

function setA(v){
  const m=M();
  aVal=Math.max(m.amin, Math.min(m.amax, Math.round(v*10)/10));
  document.getElementById('a-slider').value=aVal;
  document.getElementById('a-value').textContent=fmt(aVal);
  draw();
}

function applyMode(){
  const m=M(), sl=document.getElementById('a-slider');
  document.getElementById('tab1').classList.toggle('active', mode===1);
  document.getElementById('tab2').classList.toggle('active', mode===2);
  sl.min=m.amin; sl.max=m.amax; sl.step='0.1';
  document.getElementById('mode-desc').innerHTML=
    '方程式 '+T(m.eq)+' を '+T(m.sep)+' と分けて、曲線 '+T(m.ytex)+' と直線 '+T('y=a')
    +' の共有点を数えます。極大値は '+T(fmt(m.fmax))+'、極小値は '+T(fmt(m.fmin))+' です。';
  document.getElementById('legend').innerHTML=
    '<span><i style="border-top-color:var(--c-purple)"></i>'+T(m.ytex)+'</span>'+
    '<span><i style="border-top-color:var(--c-red)"></i>'+T('y=a')+'</span>'+
    '<span><b style="background:var(--c-orange)"></b>共有点</span>'+
    '<span><i style="border-top-color:var(--c-green);border-top-style:dashed"></i>極大値・極小値の高さ</span>';
  document.getElementById('drag-hint').textContent='図の上を縦にドラッグしても直線が動きます。';
  buildTable();
  setA(m.a0);
}

function setupTabs(){
  document.getElementById('tab1').addEventListener('click',()=>{ stopAnim(); mode=1; applyMode(); });
  document.getElementById('tab2').addEventListener('click',()=>{ stopAnim(); mode=2; applyMode(); });
}
function setupSlider(){
  const sl=document.getElementById('a-slider');
  sl.addEventListener('input',()=>{ stopAnim(); setA(parseFloat(sl.value)); });
}
function stopAnim(){ if(animId){ cancelAnimationFrame(animId); animId=null; } }

function setupAnim(){
  document.getElementById('anim-btn').addEventListener('click',()=>{
    stopAnim();
    const m=M(), from=m.amax, to=m.amin, duration=4200;
    let t0=null;
    function frame(ts){
      if(!t0) t0=ts;
      const pr=Math.min((ts-t0)/duration,1);
      const eased=pr<0.5 ? 2*pr*pr : 1-Math.pow(-2*pr+2,2)/2;
      setA(from+(to-from)*eased);
      animId = pr<1 ? requestAnimationFrame(frame) : null;
    }
    animId=requestAnimationFrame(frame);
  });
}

function setupDrag(){
  const svg=document.getElementById('graph');
  const wrap=document.getElementById('svg-wrap');
  let dragging=false;

  function toSvg(cx,cy){
    const rect=svg.getBoundingClientRect();
    return { x:(cx-rect.left)/rect.width*W, y:(cy-rect.top)/rect.height*H };
  }
  function valueAt(pt){
    const m=M();
    return m.Y0+(TT+PH-pt.y)/PH*(m.Y1-m.Y0);
  }
  function inArea(pt){ return pt.x>mL-24 && pt.x<mL+PW+24 && pt.y>TT-12 && pt.y<TT+PH+12; }
  function startDrag(cx,cy){
    const pt=toSvg(cx,cy);
    if(!inArea(pt)) return;
    stopAnim();
    dragging=true;
    setA(valueAt(pt));
  }
  function moveDrag(cx,cy){ if(dragging) setA(valueAt(toSvg(cx,cy))); }
  function endDrag(){ dragging=false; }

  wrap.addEventListener('mousedown', e => { e.preventDefault(); startDrag(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { if(dragging){ e.preventDefault(); moveDrag(e.clientX, e.clientY); } });
  window.addEventListener('mouseup', endDrag);

  wrap.addEventListener('touchstart', e => { const t=e.touches[0]; startDrag(t.clientX, t.clientY); }, {passive:true});
  wrap.addEventListener('touchmove', e => { if(dragging){ e.preventDefault(); const t=e.touches[0]; moveDrag(t.clientX, t.clientY); } }, {passive:false});
  wrap.addEventListener('touchend', endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
