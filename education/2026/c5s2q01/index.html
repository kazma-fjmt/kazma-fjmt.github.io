<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>接線の方程式</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0; }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; margin: .75rem 0; overflow: hidden; touch-action: none; position: relative; }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* draw() replaces the SVG contents, which would orphan a touch sequence that
     started on a child; keep hit-testing on the wrapper so the drag survives */
  .svg-container > svg { pointer-events: none; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto; }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; gap: .5rem; margin: .75rem 0; }
  .tab { appearance: none; flex: 1; border: 1px solid #d4dbeb; background: #fff; color: var(--accent); font-size: .95rem; font-weight: 600; padding: .7rem .5rem; border-radius: 10px; min-height: 48px; cursor: pointer; font-family: inherit; user-select: none; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }
  .live-calc > div { margin: .25rem 0; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row { display: flex; align-items: center; gap: 1rem; margin: .75rem 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; margin: .5rem 0; }

  .table-wrap { overflow-x: auto; margin: .75rem 0; }
  .compare-table { border-collapse: collapse; background: #fff; margin: 0 auto; font-size: .9rem; }
  .compare-table th, .compare-table td { border: 1px solid #e3e3e3; padding: .5rem .8rem; text-align: center; white-space: nowrap; }
  .compare-table .rowhead { background: #f4f7ff; font-weight: 600; }
  .compare-table .mark { background: #fff4e6; color: var(--c-orange); font-weight: 700; }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; justify-content: center; margin: .5rem 0 0; font-size: .88rem; }
  .legend > span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend > span > i { display: inline-block; width: 22px; height: 4px; border-radius: 2px; font-style: normal; }
  .legend > span > b { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>接線の方程式</h1>
  <p class="subtitle">曲線上の点における接線を、通る点と傾きから組み立てる手順を確かめましょう。</p>

  <h2>基本の考え方</h2>
  <p>曲線 <span id="f-c"></span> 上の点 <span id="f-pt"></span> における接線の傾きは、微分係数 <span id="f-fpa"></span> です。傾きが分かり、通る点も分かっているので、直線は 1 本に決まります。</p>
  <div class="formula-box" id="f-key"></div>
  <p>使う材料は <span id="f-mat1"></span> と <span id="f-mat2"></span> の 2 つだけです。どちらも <span id="f-a"></span> を決めれば計算できます。</p>

  <h2>解く問題</h2>
  <div class="formula-box" id="f-problem"></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <div class="tabs">
    <button class="tab active" id="tab1">例の曲線</button>
    <button class="tab" id="tab2">問題の曲線</button>
  </div>
  <p id="mode-desc"></p>

  <div class="slider-row">
    <label><span id="lbl-a"></span> =</label>
    <input type="range" id="a-slider" min="-1" max="5" step="0.1" value="3">
    <span class="slider-val" id="a-value">3</span>
  </div>

  <div class="anim-btn-row">
    <button class="btn" id="btn-star"></button>
    <button class="btn primary" id="anim-build">接線を組み立てる</button>
    <button class="btn primary" id="anim-sweep">接点を動かす</button>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 430" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend" id="legend"></div>
  <p class="drag-hint">図を横にドラッグしても接点が動きます。</p>

  <div class="live-calc" id="live-calc"></div>
  <div class="note" id="note-box"></div>

  <h2>接線の一覧</h2>
  <div class="table-wrap"><table class="compare-table" id="val-table"></table></div>

  <h2>答え</h2>
  <div class="formula-box" id="result-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=430,mL=60,mR=30,PT=24,PB=30;
const PW=W-mL-mR, PH=H-PT-PB;

const MODES={
  1:{ f:x=>x*x-4*x+4, fp:x=>2*x-4,
      ftex:'y=x^2-4x+4', fptex:"y'=2x-4",
      XMIN:-1, XMAX:5, YMIN:-6, YMAX:10, yt:[-6,-4,-2,0,2,4,6,8,10],
      aStar:3, tbl:[0,1,2,3,4] },
  2:{ f:x=>2*x*x-5*x, fp:x=>4*x-5,
      ftex:'y=2x^2-5x', fptex:"y'=4x-5",
      XMIN:-1, XMAX:3.5, YMIN:-8, YMAX:8, yt:[-8,-6,-4,-2,0,2,4,6,8],
      aStar:2, tbl:[0,1,2,3] }
};
let mode=1, aVal=3, phase=1, animId=null;
let XMIN=-1, XMAX=5, YMIN=-6, YMAX=10;
function M(){ return MODES[mode]; }
function px(x){ return mL+(x-XMIN)/(XMAX-XMIN)*PW; }
function py(y){ return PT+PH-(y-YMIN)/(YMAX-YMIN)*PH; }

function fmt(v){
  if(Math.abs(v)<5e-13) v=0;
  let s=v.toFixed(6);
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  if(s==='-0') s='0';
  return s;
}
function rel(v){ return Math.abs(parseFloat(v.toFixed(6))-v)<1e-11 ? '=' : '\\fallingdotseq'; }
function par(v){ return v<0 ? '('+fmt(v)+')' : fmt(v); }
function lineTex(m,c){
  const mt = Math.abs(m)<5e-13 ? '' : (Math.abs(m-1)<5e-13 ? 'x' : (Math.abs(m+1)<5e-13 ? '-x' : fmt(m)+'x'));
  const ct = Math.abs(c)<5e-13 ? '' : (c>0 ? '+'+fmt(c) : '-'+fmt(-c));
  if(mt==='') return fmt(c);
  return mt+ct;
}
function clipLine(m,x0,y0){
  const pts=[], yAt=x=>y0+m*(x-x0);
  [XMIN,XMAX].forEach(x=>{ const y=yAt(x); if(y>=YMIN-1e-9 && y<=YMAX+1e-9) pts.push({x:x,y:y}); });
  if(Math.abs(m)>1e-9){
    [YMIN,YMAX].forEach(y=>{ const x=x0+(y-y0)/m; if(x>=XMIN-1e-9 && x<=XMAX+1e-9) pts.push({x:x,y:y}); });
  }
  const u=[];
  for(const p of pts){ if(!u.some(q=>Math.abs(q.x-p.x)<1e-7 && Math.abs(q.y-p.y)<1e-7)) u.push(p); }
  return u.length>=2 ? [u[0],u[1]] : null;
}
function curvePath(f){
  let d='', pen=false;
  for(let i=0;i<=320;i++){
    const x=XMIN+(XMAX-XMIN)*i/320, y=f(x);
    if(y<YMIN||y>YMAX){ pen=false; continue; }
    d+=(pen?'L':'M')+` ${px(x).toFixed(2)} ${py(y).toFixed(2)}`;
    pen=true;
  }
  return d;
}

function init(){
  const spans={'f-c':'y=f(x)','f-pt':'\\mathrm{A}(a,\\ f(a))','f-fpa':"f'(a)",
               'f-mat1':'\\text{通る点 }(a,\\ f(a))','f-mat2':"\\text{傾き }f'(a)",'f-a':'a','lbl-a':'a'};
  for(const id in spans) document.getElementById(id).innerHTML=T(spans[id]);
  tex("y-f(a)=f'(a)(x-a)", document.getElementById('f-key'), true);
  tex('y=2x^2-5x \\quad \\text{上の点 } (2,\\ -2) \\text{ における接線}', document.getElementById('f-problem'), true);
  tex('y=3x-8', document.getElementById('result-box'), true);

  initWalkthrough();
  setupTabs();
  setupSlider();
  setupAnim();
  setupDrag();
  applyMode();
}

function initWalkthrough(){
  const steps=[
    { label:'Step 1: 接点の座標を確かめる', formula:'\\mathrm{A}(2,\\ -2) \\quad \\text{つまり } a=2' },
    { label:'Step 2: 関数をおく', formula:'f(x)=2x^2-5x' },
    { label:'Step 3: 導関数を求める', formula:"f'(x)=4x-5" },
    { label:'Step 4: 接線の傾きを出す', formula:"f'(2)=4\\cdot 2-5=3" },
    { label:'Step 5: 公式に当てはめる', formula:'y-(-2)=3(x-2)' },
    { label:'Step 6: 整理する', formula:'y+2=3x-6' },
    { label:'Step 7: 答え', formula:'y=3x-8' }
  ];
  let cur=0;
  const container=document.getElementById('walkthrough'), counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=cur;i++){
      html+=`<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${cur+1} / ${steps.length}`;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{ if(cur>0){cur--;render();} });
  nextBtn.addEventListener('click',()=>{ if(cur<steps.length-1){cur++;render();} });
  render();
}

function draw(){
  const c=M(), a=aVal, fa=c.f(a), m=c.fp(a);
  const mS=Math.round(m*phase*1000)/1000, cS=fa-mS*a;
  const HALO=' stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round"';
  const HALO2=' stroke="#fff" stroke-width="2.5" paint-order="stroke" stroke-linejoin="round"';
  const AXL='font-size:14px;color:#999;display:inline-block;background:#fff';
  let s='', ticks='';
  /* the orange marker under the axis reserves this box, so nearby ticks stay hidden */
  /* the value of a rides in the empty strip under the panel, clear of every curve and label */
  const alW=80, alX=Math.max(0, Math.min(W-alW, px(a)-alW/2));
  /* boxes that the tick numbers must keep clear: the value of a, the mark A, the slope triangle */
  const leftEdge = px(a)-26<mL;
  const boxes=[{x:alX, y:PT+PH+2, w:alW, h:24},
               leftEdge ? {x:px(a)-10, y:py(fa)-33, w:20, h:17}
                        : {x:px(a)-29, y:py(fa)-27, w:23, h:17},
               /* the moving point itself: a tick number half-hidden under it is worse than none */
               {x:px(a)-11, y:py(fa)-11, w:22, h:22}];
  const tri = (a+1<=XMAX+1e-9 && fa+mS<=YMAX && fa+mS>=YMIN && Math.abs(mS)>0.05)
    ? {x0:px(a), y0:py(fa), x1:px(a+1), y1:py(fa+mS)} : null;
  if(tri){
    tri.right = tri.x1+4+62<=W;
    boxes.push({x:tri.right?tri.x1+4:tri.x1-66, y:(tri.y0+tri.y1)/2-14, w:62, h:30});
    boxes.push({x:(tri.x0+tri.x1)/2-8, y:tri.y0+(mS>0?2:-20), w:16, h:18});
  }
  const clear=r=>!boxes.some(m=>r.x<m.x+m.w && m.x<r.x+r.w && r.y<m.y+m.h && m.y<r.y+r.h);

  s+=`<rect x="${mL}" y="${PT}" width="${PW}" height="${PH}" fill="#fff" stroke="#e3e3e3"/>`;
  for(let k=Math.ceil(XMIN);k<=Math.floor(XMAX);k++){
    s+=`<line x1="${px(k)}" y1="${PT}" x2="${px(k)}" y2="${PT+PH}" stroke="${k===0?'#999':'#eee'}" stroke-width="${k===0?1.5:1}"/>`;
    if(k!==0 && clear({x:px(k)-5,y:py(0)+6,w:10,h:14}))
      ticks+=`<text x="${px(k)}" y="${py(0)+16}" text-anchor="middle" font-size="11" fill="#aaa"${HALO2}>${k}</text>`;
  }
  c.yt.forEach(k=>{
    s+=`<line x1="${mL}" y1="${py(k)}" x2="${mL+PW}" y2="${py(k)}" stroke="${k===0?'#999':'#eee'}" stroke-width="${k===0?1.5:1}"/>`;
    if(k!==0 && clear({x:mL-30,y:py(k)-8,w:24,h:15}))
      ticks+=`<text x="${mL-8}" y="${py(k)+4}" text-anchor="end" font-size="11" fill="#aaa"${HALO2}>${k}</text>`;
  });

  s+=`<path d="${curvePath(c.f)}" fill="none" stroke="var(--c-purple)" stroke-width="2.5"/>`;

  /* guide lines from the point of tangency to the two axes */
  s+=`<line x1="${px(a)}" y1="${py(fa)}" x2="${px(a)}" y2="${PT+PH}" stroke="#c9d3e8" stroke-width="1.5" stroke-dasharray="5 5"/>`;
  s+=`<line x1="${px(a)}" y1="${py(fa)}" x2="${mL}" y2="${py(fa)}" stroke="#c9d3e8" stroke-width="1.5" stroke-dasharray="5 5"/>`;

  const seg=clipLine(mS,a,fa);
  if(seg) s+=`<line x1="${px(seg[0].x)}" y1="${py(seg[0].y)}" x2="${px(seg[1].x)}" y2="${py(seg[1].y)}" stroke="var(--c-orange)" stroke-width="3"/>`;

  /* slope triangle: go 1 to the right, then rise by the slope */
  let triLabel='';
  if(tri){
    s+=`<path d="M ${tri.x0} ${tri.y0} L ${tri.x1} ${tri.y0} L ${tri.x1} ${tri.y1} Z" fill="rgba(230,126,34,0.16)" stroke="var(--c-orange)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    ticks+=`<text x="${(tri.x0+tri.x1)/2}" y="${tri.y0+(mS>0?15:-7)}" text-anchor="middle" font-size="12" fill="var(--c-orange)" font-weight="700"${HALO2}>1</text>`;
    /* park the rise label on whichever side of the vertical leg still fits in the viewBox */
    triLabel=`<foreignObject x="${tri.right?tri.x1+4:tri.x1-66}" y="${(tri.y0+tri.y1)/2-14}" width="62" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#e67e22;font-weight:700;white-space:nowrap;text-align:${tri.right?'left':'right'}"><span style="background:#fff">${T(fmt(mS))}</span></div></foreignObject>`;
  }

  s+=ticks;
  s+=`<circle cx="${px(a)}" cy="${py(fa)}" r="9" fill="var(--c-red)" stroke="#fff" stroke-width="2.5"/>`;
  s+=`<circle cx="${px(a)}" cy="${py(fa)}" r="9" fill="none" stroke="var(--c-red)" stroke-width="2" opacity="0.5"><animate attributeName="r" values="9;17;9" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="1.8s" repeatCount="indefinite"/></circle>`;
  s+=`<text x="${leftEdge?px(a):px(a)-14}" y="${leftEdge?py(fa)-18:py(fa)-12}" text-anchor="${leftEdge?'middle':'end'}" font-size="15" font-weight="700" fill="var(--c-red)"${HALO}>A</text>`;
  s+=triLabel;

  /* the value of a, parked under the x-axis right below the point */
  s+=`<foreignObject x="${alX}" y="${PT+PH+2}" width="${alW}" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#e67e22;font-weight:700;text-align:center;white-space:nowrap"><span style="background:#fff;border-radius:4px;padding:0 2px">${T('a='+fmt(a))}</span></div></foreignObject>`;
  s+=`<foreignObject x="${mL+PW-24}" y="${py(0)+2}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${AXL}">${T('x')}</div></foreignObject>`;
  s+=`<foreignObject x="${px(0)+6}" y="${PT+2}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${AXL}">${T('y')}</div></foreignObject>`;

  document.getElementById('graph').innerHTML=s;
  updateLive(a,fa,m,mS,cS);
}

function updateLive(a,fa,m,mS,cS){
  const c=M();
  const lc=document.getElementById('live-calc');
  const building = phase<0.999;
  lc.innerHTML=
    `<div>${T('a '+rel(a)+' '+fmt(a))}</div>`+
    `<div style="color:var(--c-red)">${T('\\text{通る点 }\\mathrm{A}('+fmt(a)+',\\ '+fmt(fa)+')')}</div>`+
    `<div style="color:var(--c-blue)">${T(c.fptex+' \\quad \\text{より傾きは } '+fmt(m))}</div>`+
    `<div style="color:var(--c-orange)">${T('y-'+par(fa)+' = '+par(mS)+'(x-'+par(a)+')')}</div>`+
    `<div style="color:var(--c-orange)">${T('y '+rel(cS)+' '+lineTex(mS,cS))}　${building?'組み立て中の直線':'接線の方程式'}</div>`;

  const note=document.getElementById('note-box');
  if(building){
    note.innerHTML='点 A を通したまま、直線の傾きを 0 から '+T(fmt(m))+' まで回しています。傾きが '+T("f'(a)")+' に一致した瞬間が接線です。';
  } else if(Math.abs(a-c.aStar)<1e-9){
    note.innerHTML = (mode===2)
      ? '求める接点に合いました。すぐ上の計算が、そのまま答えの作り方です。'
      : '例の接点に合いました。同じ手順で問題の曲線も解けます。';
  } else if(Math.abs(m)<1e-9){
    note.innerHTML='傾きが 0 になりました。ここでは接線が '+T('x')+' 軸に平行で、放物線の頂点です。';
  } else if(m>0){
    note.innerHTML='傾きが正なので接線は右上がりです。'+T('a')+' を大きくすると傾きも大きくなります。';
  } else {
    note.innerHTML='傾きが負なので接線は右下がりです。'+T('a')+' を大きくすると傾きは 0 に近づきます。';
  }
}

function buildTable(){
  const c=M();
  let r1='<tr><th class="rowhead">'+T('a')+'</th>';
  let r2='<tr><th class="rowhead">'+T('f(a)')+'</th>';
  let r3='<tr><th class="rowhead">'+T("f'(a)")+'</th>';
  let r4='<tr><th class="rowhead">接線</th>';
  c.tbl.forEach(a=>{
    const m=c.fp(a), fa=c.f(a), k=fa-m*a;
    const mk=(Math.abs(a-c.aStar)<1e-9)?' class="mark"':'';
    r1+='<td'+mk+'>'+T(fmt(a))+'</td>';
    r2+='<td'+mk+'>'+T(fmt(fa))+'</td>';
    r3+='<td'+mk+'>'+T(fmt(m))+'</td>';
    r4+='<td'+mk+'>'+T('y='+lineTex(m,k))+'</td>';
  });
  document.getElementById('val-table').innerHTML=r1+'</tr>'+r2+'</tr>'+r3+'</tr>'+r4+'</tr>';
}

function setA(v){
  const c=M();
  aVal=Math.round(Math.max(c.XMIN,Math.min(c.XMAX,v))*10)/10;
  document.getElementById('a-slider').value=aVal;
  document.getElementById('a-value').textContent=fmt(aVal);
}

function applyMode(){
  const c=M();
  XMIN=c.XMIN; XMAX=c.XMAX; YMIN=c.YMIN; YMAX=c.YMAX;
  document.getElementById('tab1').classList.toggle('active',mode===1);
  document.getElementById('tab2').classList.toggle('active',mode===2);
  const sl=document.getElementById('a-slider');
  sl.min=c.XMIN; sl.max=c.XMAX; sl.step='0.1';
  document.getElementById('mode-desc').innerHTML=
    (mode===1
      ? '曲線 '+T('y=x^2-4x+4')+' の上を接点が動きます。'+T('a=3')+' に合わせると '+T('y=2x-5')+' が現れます。'
      : '曲線 '+T('y=2x^2-5x')+' の上を接点が動きます。'+T('a=2')+' に合わせると求める接線になります。');
  document.getElementById('legend').innerHTML=
    '<span><i style="background:var(--c-purple)"></i>'+T(c.ftex)+'</span>'+
    '<span><b style="background:var(--c-red)"></b>'+T('\\mathrm{A}(a,\\ f(a))')+'</span>'+
    '<span><i style="background:var(--c-orange)"></i>点 A を通る直線</span>'+
    '<span><i style="background:#e9c39a"></i>傾きの三角形（横に 1）</span>';
  document.getElementById('btn-star').innerHTML=T('a='+fmt(c.aStar));
  phase=1;
  buildTable();
  setA(c.aStar);
  draw();
}

function setupTabs(){
  document.getElementById('tab1').addEventListener('click',()=>{ stopAnim(); mode=1; applyMode(); });
  document.getElementById('tab2').addEventListener('click',()=>{ stopAnim(); mode=2; applyMode(); });
}
function setupSlider(){
  const sl=document.getElementById('a-slider');
  sl.addEventListener('input',()=>{ stopAnim(); phase=1; setA(parseFloat(sl.value)); draw(); });
}
function stopAnim(){ if(animId){ cancelAnimationFrame(animId); animId=null; } }

function setupAnim(){
  document.getElementById('btn-star').addEventListener('click',()=>{ stopAnim(); phase=1; setA(M().aStar); draw(); });
  document.getElementById('anim-build').addEventListener('click',()=>{
    stopAnim();
    let t0=null; const duration=2600;
    phase=0; draw();
    function frame(ts){
      if(!t0) t0=ts;
      const pr=Math.min((ts-t0)/duration,1);
      phase = pr<0.5 ? 2*pr*pr : 1-Math.pow(-2*pr+2,2)/2;
      if(pr>=1) phase=1;
      draw();
      animId = pr<1 ? requestAnimationFrame(frame) : null;
    }
    animId=requestAnimationFrame(frame);
  });
  document.getElementById('anim-sweep').addEventListener('click',()=>{
    stopAnim();
    const c=M(); phase=1;
    let t0=null; const duration=4200, from=c.XMIN, to=c.XMAX;
    setA(from);
    function frame(ts){
      if(!t0) t0=ts;
      const pr=Math.min((ts-t0)/duration,1);
      const eased = pr<0.5 ? 2*pr*pr : 1-Math.pow(-2*pr+2,2)/2;
      setA(from+(to-from)*eased);
      draw();
      animId = pr<1 ? requestAnimationFrame(frame) : null;
    }
    animId=requestAnimationFrame(frame);
  });
}

function setupDrag(){
  const svg=document.getElementById('graph');
  const wrap=document.getElementById('svg-wrap');
  let dragging=false;

  function toSvg(cx,cy){
    const rect=svg.getBoundingClientRect();
    return { x:(cx-rect.left)/rect.width*W, y:(cy-rect.top)/rect.height*H };
  }
  function valueAt(pt){ return XMIN+(pt.x-mL)/PW*(XMAX-XMIN); }
  function inArea(pt){ return pt.x>mL-24 && pt.x<mL+PW+24 && pt.y>PT-14 && pt.y<PT+PH+14; }
  function startDrag(cx,cy){
    const pt=toSvg(cx,cy);
    if(!inArea(pt)) return;
    stopAnim(); phase=1; dragging=true;
    setA(valueAt(pt)); draw();
  }
  function moveDrag(cx,cy){ if(dragging){ setA(valueAt(toSvg(cx,cy))); draw(); } }
  function endDrag(){ dragging=false; }

  wrap.addEventListener('mousedown', e => { e.preventDefault(); startDrag(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { if(dragging){ e.preventDefault(); moveDrag(e.clientX, e.clientY); } });
  window.addEventListener('mouseup', endDrag);

  wrap.addEventListener('touchstart', e => { const t=e.touches[0]; startDrag(t.clientX, t.clientY); }, {passive:true});
  wrap.addEventListener('touchmove', e => { if(dragging){ e.preventDefault(); const t=e.touches[0]; moveDrag(t.clientX, t.clientY); } }, {passive:false});
  wrap.addEventListener('touchend', endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
