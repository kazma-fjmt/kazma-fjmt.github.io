<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>対称式による三角関数の値</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; gap: .5rem; margin: .75rem 0 .5rem; }
  .tab {
    flex: 1; appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: .95rem; font-weight: 600; padding: .7rem .5rem;
    border-radius: 10px; cursor: pointer; min-height: 48px; font-family: inherit;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row {
    display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem;
  }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 4.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .75rem; flex-wrap: wrap; margin: .5rem 0; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>対称式による三角関数の値</h1>
  <p class="subtitle">和や差の値から、積や3乗の値を求めましょう。</p>

  <h2>基本の考え方</h2>
  <p><span id="f-sc"></span> の値がわかっているとき、<strong>両辺を2乗する</strong>と <span id="f-prod"></span> が現れます。</p>
  <div class="formula-box" id="f-rel"></div>
  <p>3乗の差は次の因数分解でつなぎます。かっこの中に <span id="f-one"></span> が隠れているのがポイントです。</p>
  <div class="formula-box" id="f-cube"></div>

  <h2>動かして確かめよう</h2>
  <p class="drag-hint">スライダーを動かすか、円やグラフを直接タップ・ドラッグできます</p>

  <div class="slider-row">
    <label><span id="lbl-th"></span> =</label>
    <input type="range" id="th-slider" min="0" max="360" step="0.5" value="20">
    <span class="slider-val" id="th-value">20.0°</span>
  </div>

  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">アニメーション</button>
    <button class="btn" id="goal-btn">条件を満たす角へ</button>
  </div>

  <div class="svg-container" id="wrap-c">
    <svg id="graph-c" viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="svg-container" id="wrap-g">
    <svg id="graph-g" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="live-calc" id="live-calc"></div>
  <div class="note" id="note-hit"></div>

  <h2>解法ウォークスルー</h2>
  <div class="tabs">
    <button class="tab active" id="tab-q">問: <span id="tab-q-tex"></span></button>
    <button class="tab" id="tab-e">例題: <span id="tab-e-tex"></span></button>
  </div>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <div class="formula-box" id="result-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const TAU=Math.PI*2;
const CW=600,CH=420,cx=205,cy=205,R=125,BX=505,BS=80;
const GW=600,GH=300,GX0=58,GX1=576,GY0=155,GS=78;
const S_TARGET=0.2, P_TARGET=0.48;
const TH1=Math.atan2(0.8,0.6);

let theta=20*Math.PI/180;
let animId=null;
let goalIdx=0;

function sx(x){return cx+x*R;}
function sy(y){return cy-y*R;}
function gx(t){return GX0+(t/TAU)*(GX1-GX0);}
function gy(v){return GY0-v*GS;}
function arcPath(r,a0,a1){
  const x0=(cx+r*Math.cos(a0)).toFixed(2), y0=(cy-r*Math.sin(a0)).toFixed(2);
  const x1=(cx+r*Math.cos(a1)).toFixed(2), y1=(cy-r*Math.sin(a1)).toFixed(2);
  return `M ${x0} ${y0} A ${r} ${r} 0 ${(a1-a0)>Math.PI?1:0} 0 ${x1} ${y1}`;
}
function sol2(){ let a=Math.atan2(-0.6,-0.8); return a<0?a+TAU:a; }

function init(){
  document.getElementById('f-sc').innerHTML=T('\\sin\\theta-\\cos\\theta');
  document.getElementById('f-prod').innerHTML=T('\\sin\\theta\\cos\\theta');
  document.getElementById('f-one').innerHTML=T('\\sin^2\\theta+\\cos^2\\theta=1');
  document.getElementById('lbl-th').innerHTML=T('\\theta');
  document.getElementById('tab-q-tex').innerHTML=T('\\sin\\theta-\\cos\\theta=\\tfrac{1}{5}');
  document.getElementById('tab-e-tex').innerHTML=T('\\sin\\theta+\\cos\\theta=\\tfrac{1}{2}');

  tex('(\\sin\\theta-\\cos\\theta)^2=\\sin^2\\theta-2\\sin\\theta\\cos\\theta+\\cos^2\\theta=1-2\\sin\\theta\\cos\\theta',document.getElementById('f-rel'),true);
  tex('a^3-b^3=(a-b)(a^2+ab+b^2)',document.getElementById('f-cube'),true);
  tex('\\sin\\theta\\cos\\theta=\\dfrac{12}{25},\\qquad \\sin^3\\theta-\\cos^3\\theta=\\dfrac{37}{125}',document.getElementById('result-box'),true);

  initWalkthrough();
  setupSlider();
  setupButtons();
  setupPointers();
  draw();
}

const stepsQ=[
  {label:'Step 1: 条件を確認する',formula:'\\sin\\theta-\\cos\\theta=\\dfrac{1}{5}'},
  {label:'Step 2: 両辺を2乗する',formula:'(\\sin\\theta-\\cos\\theta)^2=\\left(\\dfrac{1}{5}\\right)^2=\\dfrac{1}{25}'},
  {label:'Step 3: 左辺を展開する',formula:'\\sin^2\\theta-2\\sin\\theta\\cos\\theta+\\cos^2\\theta=\\dfrac{1}{25}'},
  {label:'Step 4: 相互関係を使う',formula:'\\sin^2\\theta+\\cos^2\\theta=1\\;\\text{だから}\\;1-2\\sin\\theta\\cos\\theta=\\dfrac{1}{25}'},
  {label:'Step 5: 積の値を求める',formula:'2\\sin\\theta\\cos\\theta=1-\\dfrac{1}{25}=\\dfrac{24}{25}\\;\\Longrightarrow\\;\\sin\\theta\\cos\\theta=\\dfrac{12}{25}'},
  {label:'Step 6: 3乗の差の公式',formula:'a^3-b^3=(a-b)(a^2+ab+b^2)'},
  {label:'Step 7: あてはめる',formula:'\\sin^3\\theta-\\cos^3\\theta=(\\sin\\theta-\\cos\\theta)(\\sin^2\\theta+\\sin\\theta\\cos\\theta+\\cos^2\\theta)'},
  {label:'Step 8: かっこの中をまとめる',formula:'=(\\sin\\theta-\\cos\\theta)(1+\\sin\\theta\\cos\\theta)'},
  {label:'Step 9: 値を代入する',formula:'=\\dfrac{1}{5}\\left(1+\\dfrac{12}{25}\\right)=\\dfrac{1}{5}\\times\\dfrac{37}{25}=\\dfrac{37}{125}'},
  {label:'Step 10: 答え',formula:'\\sin\\theta\\cos\\theta=\\dfrac{12}{25},\\qquad \\sin^3\\theta-\\cos^3\\theta=\\dfrac{37}{125}'}
];
const stepsE=[
  {label:'Step 1: 条件を確認する',formula:'\\sin\\theta+\\cos\\theta=\\dfrac{1}{2}'},
  {label:'Step 2: 両辺を2乗する',formula:'\\sin^2\\theta+2\\sin\\theta\\cos\\theta+\\cos^2\\theta=\\dfrac{1}{4}'},
  {label:'Step 3: 相互関係を使う',formula:'1+2\\sin\\theta\\cos\\theta=\\dfrac{1}{4}'},
  {label:'Step 4: 積の値を求める',formula:'\\sin\\theta\\cos\\theta=\\dfrac{1}{2}\\left(\\dfrac{1}{4}-1\\right)=-\\dfrac{3}{8}'},
  {label:'Step 5: 3乗の和に直す',formula:'\\sin^3\\theta+\\cos^3\\theta=(\\sin\\theta+\\cos\\theta)(1-\\sin\\theta\\cos\\theta)'},
  {label:'Step 6: 値を代入する',formula:'=\\dfrac{1}{2}\\left(1+\\dfrac{3}{8}\\right)=\\dfrac{1}{2}\\times\\dfrac{11}{8}=\\dfrac{11}{16}'}
];

function initWalkthrough(){
  let steps=stepsQ, cur=0;
  const container=document.getElementById('walkthrough');
  const counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev');
  const nextBtn=document.getElementById('next');
  const tabQ=document.getElementById('tab-q');
  const tabE=document.getElementById('tab-e');
  function render(){
    let html='';
    for(let i=0;i<=cur;i++){
      html+=`<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${cur+1} / ${steps.length}`;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{if(cur>0){cur--;render();}});
  nextBtn.addEventListener('click',()=>{if(cur<steps.length-1){cur++;render();}});
  tabQ.addEventListener('click',()=>{steps=stepsQ;cur=0;tabQ.classList.add('active');tabE.classList.remove('active');render();});
  tabE.addEventListener('click',()=>{steps=stepsE;cur=0;tabE.classList.add('active');tabQ.classList.remove('active');render();});
  render();
}

function drawCircle(){
  const t=theta, c=Math.cos(t), s=Math.sin(t), d=s-c;
  let g='';
  g+=`<line x1="${cx-R-45}" y1="${cy}" x2="${cx+R+45}" y2="${cy}" stroke="#999" stroke-width="1.5"/>`;
  g+=`<line x1="${cx}" y1="${cy-R-45}" x2="${cx}" y2="${cy+R+45}" stroke="#999" stroke-width="1.5"/>`;
  g+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#c8d4ee" stroke-width="2"/>`;
  g+=`<text x="${cx-10}" y="${cy+18}" font-size="13" fill="#999">O</text>`;
  g+=`<foreignObject x="${cx+R+48}" y="${cy-24}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('x')}</div></foreignObject>`;
  g+=`<foreignObject x="${cx+8}" y="${cy-R-70}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('y')}</div></foreignObject>`;

  const sols=[TH1,sol2()];
  for(let i=0;i<2;i++){
    const a=sols[i];
    g+=`<circle cx="${sx(Math.cos(a))}" cy="${sy(Math.sin(a))}" r="9" fill="none" stroke="var(--c-orange)" stroke-width="2.5" opacity="0.85"><animate attributeName="r" values="9;15;9" dur="1.8s" repeatCount="indefinite"/></circle>`;
  }
  g+=`<foreignObject x="${sx(0.6)+14}" y="${sy(0.8)-30}" width="150" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:var(--c-orange);font-weight:600;white-space:nowrap">${T('\\left(\\tfrac{3}{5},\\;\\tfrac{4}{5}\\right)')}</div></foreignObject>`;
  g+=`<foreignObject x="${Math.max(2,sx(-0.8)-150)}" y="${sy(-0.6)+6}" width="150" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:var(--c-orange);font-weight:600;white-space:nowrap;text-align:right">${T('\\left(-\\tfrac{4}{5},\\;-\\tfrac{3}{5}\\right)')}</div></foreignObject>`;

  g+=`<line x1="${cx}" y1="${cy}" x2="${sx(c)}" y2="${cy}" stroke="var(--c-green)" stroke-width="5" stroke-linecap="round"/>`;
  g+=`<line x1="${sx(c)}" y1="${cy}" x2="${sx(c)}" y2="${sy(s)}" stroke="var(--c-red)" stroke-width="5" stroke-linecap="round"/>`;
  g+=`<line x1="${cx}" y1="${cy}" x2="${sx(c)}" y2="${sy(s)}" stroke="var(--c-blue)" stroke-width="2.5"/>`;
  g+=`<path d="${arcPath(34,0,t)}" fill="none" stroke="var(--c-orange)" stroke-width="2.5"/>`;
  const la=t/2;
  g+=`<foreignObject x="${cx+50*Math.cos(la)-13}" y="${cy-50*Math.sin(la)-14}" width="30" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px;color:var(--c-orange);font-weight:600">${T('\\theta')}</div></foreignObject>`;
  g+=`<circle cx="${sx(c)}" cy="${sy(s)}" r="8" fill="var(--c-purple)" stroke="#fff" stroke-width="2.5"/>`;
  g+=`<circle cx="${sx(c)}" cy="${sy(s)}" r="8" fill="none" stroke="var(--c-purple)" stroke-width="2.5" opacity="0.6"><animate attributeName="r" values="8;16;8" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="1.6s" repeatCount="indefinite"/></circle>`;

  g+=`<line x1="${BX-52}" y1="${cy}" x2="${BX+52}" y2="${cy}" stroke="#ccc" stroke-width="1.5"/>`;
  g+=`<line x1="${BX-52}" y1="${cy-S_TARGET*BS}" x2="${BX+52}" y2="${cy-S_TARGET*BS}" stroke="var(--c-orange)" stroke-width="1.6" stroke-dasharray="6 4"/>`;
  g+=`<foreignObject x="${BX-86}" y="${cy-S_TARGET*BS-14}" width="40" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:var(--c-orange);font-weight:600;display:inline-block">${T('\\tfrac{1}{5}')}</div></foreignObject>`;
  const bh=Math.abs(d)*BS;
  g+=`<rect x="${BX-16}" y="${d>=0?cy-bh:cy}" width="32" height="${Math.max(bh,1)}" fill="var(--c-blue)" opacity="0.75" rx="3"/>`;
  g+=`<foreignObject x="${BX-72}" y="24" width="150" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-blue);font-weight:700;white-space:nowrap;text-align:center">${T('\\sin\\theta-\\cos\\theta')}</div></foreignObject>`;
  g+=`<text x="${BX}" y="${(d>=0?cy-bh-8:cy+bh+18)}" text-anchor="middle" font-size="13" fill="var(--c-blue)" font-weight="700">${d.toFixed(2)}</text>`;
  document.getElementById('graph-c').innerHTML=g;
}

function drawGraph(){
  let g='';
  g+=`<line x1="${GX0-14}" y1="${GY0}" x2="${GX1+16}" y2="${GY0}" stroke="#999" stroke-width="1.5"/>`;
  g+=`<line x1="${GX0}" y1="18" x2="${GX0}" y2="${GH-24}" stroke="#999" stroke-width="1.5"/>`;
  for(const v of [-1,1]){
    g+=`<line x1="${GX0}" y1="${gy(v)}" x2="${GX1}" y2="${gy(v)}" stroke="#f0f0f0" stroke-width="1"/>`;
    g+=`<text x="${GX0-8}" y="${gy(v)+4}" text-anchor="end" font-size="11" fill="#aaa">${v}</text>`;
  }
  let gTicks='';
  const ticks=[[0,'0',5],[Math.PI/2,'\\dfrac{\\pi}{2}',9],[Math.PI,'\\pi',6],[3*Math.PI/2,'\\dfrac{3\\pi}{2}',13],[TAU,'2\\pi',10]];
  for(const [tt,lb,hw] of ticks){
    g+=`<line x1="${gx(tt)}" y1="${GY0-4}" x2="${gx(tt)}" y2="${GY0+4}" stroke="#999" stroke-width="1.5"/>`;
    gTicks+=`<foreignObject x="${(gx(tt)-hw-4).toFixed(1)}" y="${GY0+8}" width="60" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:#999;display:inline-block;background:rgba(255,255,255,0.92);border-radius:4px;padding:0 3px">${T(lb)}</div></foreignObject>`;
  }
  let d1='',d2='';
  for(let i=0;i<=240;i++){
    const t=i/240*TAU, s=Math.sin(t), c=Math.cos(t);
    d1+=(i?' L':'M')+` ${gx(t).toFixed(1)} ${gy(s-c).toFixed(1)}`;
    d2+=(i?' L':'M')+` ${gx(t).toFixed(1)} ${gy(s*c).toFixed(1)}`;
  }
  g+=`<line x1="${GX0}" y1="${gy(S_TARGET)}" x2="${GX1}" y2="${gy(S_TARGET)}" stroke="var(--c-blue)" stroke-width="1.6" stroke-dasharray="7 5" opacity="0.8"/>`;
  g+=`<line x1="${GX0}" y1="${gy(P_TARGET)}" x2="${GX1}" y2="${gy(P_TARGET)}" stroke="var(--c-green)" stroke-width="1.6" stroke-dasharray="7 5" opacity="0.8"/>`;
  g+=`<path d="${d1}" fill="none" stroke="var(--c-blue)" stroke-width="2.5"/>`;
  g+=`<path d="${d2}" fill="none" stroke="var(--c-green)" stroke-width="2.5"/>`;
  g+=gTicks;

  const sols=[TH1,sol2()];
  for(const a of sols){
    g+=`<line x1="${gx(a)}" y1="${gy(S_TARGET)}" x2="${gx(a)}" y2="${gy(P_TARGET)}" stroke="var(--c-orange)" stroke-width="1.4" stroke-dasharray="4 3"/>`;
    g+=`<circle cx="${gx(a)}" cy="${gy(S_TARGET)}" r="6" fill="var(--c-blue)"><animate attributeName="r" values="6;10;6" dur="1.8s" repeatCount="indefinite"/></circle>`;
    g+=`<circle cx="${gx(a)}" cy="${gy(P_TARGET)}" r="6" fill="var(--c-green)"><animate attributeName="r" values="6;10;6" dur="1.8s" repeatCount="indefinite"/></circle>`;
  }

  const t=theta, s=Math.sin(t), c=Math.cos(t);
  g+=`<line x1="${gx(t)}" y1="20" x2="${gx(t)}" y2="${GH-30}" stroke="var(--c-orange)" stroke-width="2" opacity="0.7"/>`;
  g+=`<circle cx="${gx(t)}" cy="${gy(s-c)}" r="6.5" fill="var(--c-blue)" stroke="#fff" stroke-width="2"/>`;
  g+=`<circle cx="${gx(t)}" cy="${gy(s*c)}" r="6.5" fill="var(--c-green)" stroke="#fff" stroke-width="2"/>`;

  g+=`<foreignObject x="${GX1-146}" y="14" width="150" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-blue);font-weight:700;white-space:nowrap;display:inline-block;background:rgba(255,255,255,0.92);border-radius:5px;padding:0 4px;">${T('y=\\sin\\theta-\\cos\\theta')}</div></foreignObject>`;
  g+=`<foreignObject x="${GX0+8}" y="${GH-42}" width="186" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-green);font-weight:700;white-space:nowrap;display:inline-block;background:rgba(255,255,255,0.92);border-radius:5px;padding:0 4px;">${T('y=\\sin\\theta\\cos\\theta')}</div></foreignObject>`;
  document.getElementById('graph-g').innerHTML=g;
}

function draw(){
  drawCircle(); drawGraph(); updateInfo();
}

function updateInfo(){
  const t=theta, s=Math.sin(t), c=Math.cos(t);
  const d=s-c, p=s*c, cube=s*s*s-c*c*c;
  const f=v=>(v>=0?'\\;\\;':'')+v.toFixed(3);
  document.getElementById('live-calc').innerHTML=
    T('\\theta='+(t*180/Math.PI).toFixed(1)+'^\\circ')+' &nbsp; '+
    `<span style="color:var(--c-blue)">${T('\\sin\\theta-\\cos\\theta='+f(d))}</span> &nbsp; `+
    `<span style="color:var(--c-green)">${T('\\sin\\theta\\cos\\theta='+f(p))}</span><br>`+
    T('1-2\\sin\\theta\\cos\\theta='+(1-2*p).toFixed(3))+' &nbsp;=&nbsp; '+T('(\\sin\\theta-\\cos\\theta)^2='+(d*d).toFixed(3))+'<br>'+
    `<span style="color:var(--c-purple)">${T('\\sin^3\\theta-\\cos^3\\theta='+f(cube))}</span>`;

  const hit=Math.abs(d-S_TARGET)<0.006;
  document.getElementById('note-hit').innerHTML=hit
    ? '<strong style="color:var(--c-purple)">条件を満たす角です。</strong>'+T('\\sin\\theta-\\cos\\theta=\\dfrac{1}{5}')+' となる角は2つありますが、どちらでも '+T('\\sin\\theta\\cos\\theta=\\dfrac{12}{25}')+'、'+T('\\sin^3\\theta-\\cos^3\\theta=\\dfrac{37}{125}')+' と同じ値になります。'
    : '<strong>2乗すると差が積に変わります。</strong>上の2つの式の値がつねに等しいことを、角を動かしながら確かめましょう。オレンジの印が条件 '+T('\\sin\\theta-\\cos\\theta=\\dfrac{1}{5}')+' を満たす角です。';
}

function setSlider(){
  const deg=(theta*180/Math.PI%360+360)%360;
  document.getElementById('th-slider').value=deg;
  document.getElementById('th-value').textContent=deg.toFixed(1)+'°';
}

function setupSlider(){
  const sl=document.getElementById('th-slider');
  sl.addEventListener('input',()=>{
    stopAnim();
    theta=parseFloat(sl.value)*Math.PI/180;
    document.getElementById('th-value').textContent=parseFloat(sl.value).toFixed(1)+'°';
    draw();
  });
  setSlider();
}

function stopAnim(){ if(animId){cancelAnimationFrame(animId);animId=null;} }

function runTo(from,to,dur){
  stopAnim();
  let st=null;
  function step(ts){
    if(!st)st=ts;
    const p=Math.min((ts-st)/dur,1);
    const e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    theta=from+(to-from)*e;
    setSlider(); draw();
    if(p<1) animId=requestAnimationFrame(step); else animId=null;
  }
  animId=requestAnimationFrame(step);
}

function setupButtons(){
  document.getElementById('anim-btn').addEventListener('click',()=>{ runTo(0,TAU-0.001,6000); });
  document.getElementById('goal-btn').addEventListener('click',()=>{
    const sols=[TH1,sol2()];
    let to=sols[goalIdx%2]; goalIdx++;
    let from=theta%TAU; if(from<0)from+=TAU;
    if(to<from) to+=TAU;
    runTo(from,to,1600);
  });
}

function bindPointer(wrapId,svgId,Wv,Hv,handler){
  const wrap=document.getElementById(wrapId), svg=document.getElementById(svgId);
  let dragging=false;
  function apply(clx,cly){
    const rect=svg.getBoundingClientRect();
    handler((clx-rect.left)/rect.width*Wv,(cly-rect.top)/rect.height*Hv);
  }
  function startDrag(x,y){ stopAnim(); dragging=true; apply(x,y); }
  wrap.addEventListener('mousedown',e=>{e.preventDefault();startDrag(e.clientX,e.clientY);});
  window.addEventListener('mousemove',e=>{if(dragging){e.preventDefault();apply(e.clientX,e.clientY);}});
  window.addEventListener('mouseup',()=>{dragging=false;});
  wrap.addEventListener('touchstart',e=>{const t=e.touches[0];startDrag(t.clientX,t.clientY);},{passive:true});
  wrap.addEventListener('touchmove',e=>{if(dragging){e.preventDefault();const t=e.touches[0];apply(t.clientX,t.clientY);}},{passive:false});
  wrap.addEventListener('touchend',()=>{dragging=false;});
}

function setupPointers(){
  bindPointer('wrap-c','graph-c',CW,CH,(X,Y)=>{
    if(Math.hypot(X-cx,cy-Y)<18) return;
    let a=Math.atan2(cy-Y,X-cx); if(a<0)a+=TAU;
    theta=a; setSlider(); draw();
  });
  bindPointer('wrap-g','graph-g',GW,GH,(X,Y)=>{
    let t=(X-GX0)/(GX1-GX0)*TAU;
    theta=Math.max(0,Math.min(TAU-0.001,t)); setSlider(); draw();
  });
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
