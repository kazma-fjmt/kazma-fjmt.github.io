<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>一般形の円の方程式</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa;
    --fg: #333;
    --muted: #888;
    --accent: #2a6df4;
    --c-a: #d9534f;
    --c-b: #2a6df4;
    --c-center: #e67e22;
    --c-circle: #5cb85c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 {
    font-size: 1.15rem; margin: 2.25rem 0 .75rem;
    border-left: 4px solid var(--accent); padding-left: .6rem;
  }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none;
    position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .live-calc {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; text-align: center;
    overflow-x: auto;
  }
  .live-calc .katex { font-size: 1.1rem; }

  .note {
    background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px;
    padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem;
  }

  .slider-row {
    display: flex; align-items: center; gap: .75rem;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: .4rem 0;
  }
  .slider-row label { font-weight: 600; min-width: 2rem; text-align: right; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .val { min-width: 3rem; text-align: right; font-weight: 600; color: var(--accent); }

  .result-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; overflow-x: auto;
  }
  .result-box .katex { font-size: 1.15rem; }
  .result-label { font-weight: 600; font-size: .9rem; color: var(--muted); margin-bottom: .5rem; }
  .result-row { margin: .4rem 0; }

  .status-badge {
    display: inline-block; padding: .25rem .75rem; border-radius: 20px;
    font-weight: 700; font-size: .9rem; margin-top: .5rem;
  }
  .status-circle { background: #d4edda; color: #155724; }
  .status-point { background: #fff3cd; color: #856404; }
  .status-none { background: #f8d7da; color: #721c24; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step {
    padding: .75rem .25rem; border-bottom: 1px dashed #eee;
    animation: fadeIn .3s ease;
  }
  .step:last-child { border-bottom: none; }
  .step.current {
    background: #f0f5ff; border-radius: 8px; padding: .75rem;
    margin: .25rem -.5rem; border-bottom: none;
  }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.15rem; }
  .step.current .formula-line .katex { font-size: 1.25rem; }

  .controls-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; margin: 1rem 0 0;
  }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter {
    color: var(--muted); font-size: .9rem; text-align: center; flex: 1;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>一般形の円の方程式</h1>
  <p class="subtitle">展開された形から平方完成で円の中心と半径を求めます。</p>

  <h2>標準形から一般形へ</h2>
  <p>円の方程式 <span id="f-std"></span> を展開すると：</p>
  <div class="formula-box" id="formula-expand"></div>
  <p>ここで <span id="f-lmn"></span> とおくと、<strong>一般形</strong>が得られます。</p>
  <div class="formula-box" id="formula-general"></div>

  <h2>一般形から標準形へ（平方完成）</h2>
  <p>一般形の <span id="f-lmn2"></span> について平方完成すると：</p>
  <div class="formula-box" id="formula-complete"></div>
  <p>ここで <span id="f-k-def"></span> とすると、</p>
  <div class="note" id="note-cases"></div>

  <h2>例題 2</h2>
  <p>次の方程式はどのような図形を表すか。</p>
  <div class="formula-box" id="formula-ex2"></div>

  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev">&larr; 戻る</button>
    <div class="step-counter">ステップ <span id="step-cur"></span> / <span id="step-tot"></span></div>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>自由に試してみよう</h2>
  <p>スライダーで <span id="f-lmn3"></span> の値を変えて、一般形がどのような図形を表すか確認しましょう。</p>

  <div class="slider-row">
    <label><span id="lbl-l"></span></label>
    <input type="range" id="slider-l" min="-10" max="10" step="1" value="-2">
    <span class="val" id="val-l">-2</span>
  </div>
  <div class="slider-row">
    <label><span id="lbl-m"></span></label>
    <input type="range" id="slider-m" min="-10" max="10" step="1" value="-8">
    <span class="val" id="val-m">-8</span>
  </div>
  <div class="slider-row">
    <label><span id="lbl-n"></span></label>
    <input type="range" id="slider-n" min="-30" max="30" step="1" value="-2">
    <span class="val" id="val-n">-2</span>
  </div>

  <div class="result-box" id="result-box">
    <div class="result-label">一般形</div>
    <div class="result-row" id="res-general"></div>
    <div class="result-label" style="margin-top:.75rem">平方完成</div>
    <div class="result-row" id="res-complete"></div>
    <div class="result-label" style="margin-top:.75rem">結果</div>
    <div class="result-row" id="res-result"></div>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="plane" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</main>

<script>
  function tex(latex, el, dm) { katex.render(latex, el, { throwOnError: false, displayMode: !!dm }); }
  function T(l) { return katex.renderToString(l, { throwOnError: false }); }

  /* state */
  let sl = -2, sm = -8, sn = -2;
  const GRID_MIN = -10, GRID_MAX = 10;
  const SVG_SIZE = 600, PAD = 40;
  const usable = SVG_SIZE - 2 * PAD;

  function toSvgX(v) { return PAD + (v - GRID_MIN) / (GRID_MAX - GRID_MIN) * usable; }
  function toSvgY(v) { return PAD + (GRID_MAX - v) / (GRID_MAX - GRID_MIN) * usable; }

  /* animation */
  let animAngle = 0;
  let animFrame = null;
  function animLoop() {
    animAngle += 0.015;
    if (animAngle > 2 * Math.PI) animAngle -= 2 * Math.PI;
    drawSVG();
    animFrame = requestAnimationFrame(animLoop);
  }

  function drawSVG() {
    const svg = document.getElementById('plane');
    let s = '';
    const cx = -sl / 2, cy = -sm / 2;
    const k = sl * sl / 4 + sm * sm / 4 - sn;

    /* grid */
    for (let i = GRID_MIN; i <= GRID_MAX; i++) {
      const x = toSvgX(i), y = toSvgY(i);
      s += `<line x1="${x}" y1="${PAD}" x2="${x}" y2="${SVG_SIZE-PAD}" stroke="${i===0?'#999':'#e8e8e8'}" stroke-width="${i===0?1.5:1}"/>`;
      s += `<line x1="${PAD}" y1="${y}" x2="${SVG_SIZE-PAD}" y2="${y}" stroke="${i===0?'#999':'#e8e8e8'}" stroke-width="${i===0?1.5:1}"/>`;
    }

    /* axis labels */
    s += `<foreignObject x="${SVG_SIZE-PAD-2}" y="${toSvgY(0)-10}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999;text-align:center">${T('x')}</div></foreignObject>`;
    s += `<foreignObject x="${toSvgX(0)-12}" y="${PAD-28}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999;text-align:center">${T('y')}</div></foreignObject>`;
    for (let i = GRID_MIN; i <= GRID_MAX; i++) {
      if (i === 0 || i % 2 !== 0) continue;
      s += `<text x="${toSvgX(i)}" y="${toSvgY(0)+18}" text-anchor="middle" font-size="10" fill="#aaa">${i}</text>`;
      s += `<text x="${toSvgX(0)-8}" y="${toSvgY(i)+4}" text-anchor="end" font-size="10" fill="#aaa">${i}</text>`;
    }
    s += `<text x="${toSvgX(0)-8}" y="${toSvgY(0)+18}" text-anchor="end" font-size="10" fill="#aaa">O</text>`;

    const scx = toSvgX(cx), scy = toSvgY(cy);

    if (k > 0) {
      /* circle */
      const r = Math.sqrt(k);
      const sr = r / (GRID_MAX - GRID_MIN) * usable;
      s += `<circle cx="${scx}" cy="${scy}" r="${sr}" fill="rgba(92,184,92,0.08)" stroke="var(--c-circle)" stroke-width="2.5"/>`;

      /* animated point on circle */
      const ppx = cx + r * Math.cos(animAngle);
      const ppy = cy + r * Math.sin(animAngle);
      s += `<circle cx="${toSvgX(ppx)}" cy="${toSvgY(ppy)}" r="5" fill="var(--c-circle)" opacity=".7"/>`;

      /* radius line */
      s += `<line x1="${scx}" y1="${scy}" x2="${toSvgX(ppx)}" y2="${toSvgY(ppy)}" stroke="var(--c-a)" stroke-width="1.5" stroke-dasharray="5 3" opacity=".6"/>`;

      /* center */
      s += `<circle cx="${scx}" cy="${scy}" r="6" fill="var(--c-center)" stroke="#fff" stroke-width="2"/>`;
      s += `<text x="${scx+10}" y="${scy-10}" font-size="13" font-weight="700" fill="var(--c-center)">C(${fmtN(cx)}, ${fmtN(cy)})</text>`;
    } else if (k === 0) {
      /* single point */
      s += `<circle cx="${scx}" cy="${scy}" r="8" fill="var(--c-center)" stroke="#fff" stroke-width="2">`;
      s += `<animate attributeName="r" values="6;10;6" dur="1.5s" repeatCount="indefinite"/></circle>`;
      s += `<text x="${scx+12}" y="${scy-12}" font-size="13" font-weight="700" fill="var(--c-center)">(${fmtN(cx)}, ${fmtN(cy)})</text>`;
    } else {
      /* no figure — show cross at where center would be */
      const sz = 8;
      s += `<line x1="${scx-sz}" y1="${scy-sz}" x2="${scx+sz}" y2="${scy+sz}" stroke="var(--c-a)" stroke-width="2.5" opacity=".6"/>`;
      s += `<line x1="${scx+sz}" y1="${scy-sz}" x2="${scx-sz}" y2="${scy+sz}" stroke="var(--c-a)" stroke-width="2.5" opacity=".6"/>`;
      s += `<text x="${scx+14}" y="${scy-10}" font-size="13" font-weight="700" fill="var(--c-a)">図形なし</text>`;
    }

    svg.innerHTML = s;
  }

  function fmtN(n) {
    if (Number.isInteger(n)) return String(n);
    /* show as fraction if half-integer */
    if (n * 2 === Math.round(n * 2)) {
      const num = Math.round(n * 2);
      return `\\frac{${num}}{2}`;
    }
    return n.toFixed(2);
  }
  function fmtPlain(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }

  function signedTerm(coeff, variable) {
    if (coeff === 0) return '';
    const sign = coeff > 0 ? '+' : '-';
    const abs = Math.abs(coeff);
    const c = abs === 1 ? '' : String(abs);
    return `${sign} ${c}${variable}`;
  }

  function updateResults() {
    const cx = -sl / 2, cy = -sm / 2;
    const k = sl * sl / 4 + sm * sm / 4 - sn;

    /* general form */
    let gen = 'x^2 + y^2';
    if (sl !== 0) gen += (sl > 0 ? ' + ' : ' - ') + (Math.abs(sl) === 1 ? '' : Math.abs(sl)) + 'x';
    if (sm !== 0) gen += (sm > 0 ? ' + ' : ' - ') + (Math.abs(sm) === 1 ? '' : Math.abs(sm)) + 'y';
    if (sn !== 0) gen += (sn > 0 ? ' + ' : ' - ') + Math.abs(sn);
    gen += ' = 0';
    document.getElementById('res-general').innerHTML = T(gen);

    /* completed square */
    const cxStr = cx >= 0 ? `- ${fmtPlain(cx)}` : `+ ${fmtPlain(Math.abs(cx))}`;
    const cyStr = cy >= 0 ? `- ${fmtPlain(cy)}` : `+ ${fmtPlain(Math.abs(cy))}`;
    const kFmt = Number.isInteger(k) ? String(k) : k.toFixed(2);
    document.getElementById('res-complete').innerHTML = T(`\\left(x ${cxStr}\\right)^2 + \\left(y ${cyStr}\\right)^2 = ${kFmt}`);

    /* result */
    const resEl = document.getElementById('res-result');
    if (k > 0) {
      const r = Math.sqrt(k);
      const rFmt = Number.isInteger(r) ? String(r) : `\\sqrt{${kFmt}}`;
      resEl.innerHTML =
        `<span class="status-badge status-circle">円</span> ` +
        T(`\\text{中心 }(${fmtPlain(cx)},\\;${fmtPlain(cy)}),\\quad r = ${rFmt}`);
    } else if (k === 0) {
      resEl.innerHTML =
        `<span class="status-badge status-point">1点</span> ` +
        T(`\\text{点 }(${fmtPlain(cx)},\\;${fmtPlain(cy)})`);
    } else {
      resEl.innerHTML = `<span class="status-badge status-none">図形なし</span> ` +
        T(`k = ${kFmt} < 0`);
    }
  }

  /* walkthrough for example 2 */
  const steps = [
    { title: "問題", tex: "x^2 + y^2 - 2x - 8y - 2 = 0" },
    { title: "x について平方完成", tex: "x^2 - 2x = (x-1)^2 - 1" },
    { title: "y について平方完成", tex: "y^2 - 8y = (y-4)^2 - 16" },
    { title: "代入して整理", tex: "(x-1)^2 - 1 + (y-4)^2 - 16 - 2 = 0" },
    { title: "定数をまとめる", tex: "(x-1)^2 + (y-4)^2 = 1 + 16 + 2 = 19" },
    { title: "答え", tex: "\\boxed{\\text{中心 }(1,\\,4),\\quad r = \\sqrt{19} \\text{ の円}}" }
  ];
  let curStep = 0;

  function renderWalk() {
    const root = document.getElementById('walkthrough');
    let html = '';
    for (let i = 0; i <= curStep; i++) {
      const st = steps[i];
      const cls = i === curStep ? 'current' : '';
      html += `<div class="step ${cls}">
        <div class="label">${st.title}</div>
        <div class="formula-line">${T(st.tex)}</div>
      </div>`;
    }
    root.innerHTML = html;
    document.getElementById('step-cur').textContent = curStep + 1;
    document.getElementById('step-tot').textContent = steps.length;
    document.getElementById('prev').disabled = curStep === 0;
    document.getElementById('next').disabled = curStep === steps.length - 1;
  }

  function init() {
    /* formula labels */
    document.getElementById('f-std').innerHTML = T("(x-a)^2+(y-b)^2=r^2");
    tex("x^2+y^2-2ax-2by+a^2+b^2-r^2=0", document.getElementById('formula-expand'), true);
    document.getElementById('f-lmn').innerHTML = T("l=-2a,\\;m=-2b,\\;n=a^2+b^2-r^2");
    tex("x^2+y^2+lx+my+n=0", document.getElementById('formula-general'), true);
    document.getElementById('f-lmn2').innerHTML = T("x,\\,y");
    tex("\\left(x+\\frac{l}{2}\\right)^2+\\left(y+\\frac{m}{2}\\right)^2 = \\frac{l^2}{4}+\\frac{m^2}{4}-n", document.getElementById('formula-complete'), true);
    document.getElementById('f-k-def').innerHTML = T("k = \\dfrac{l^2}{4}+\\dfrac{m^2}{4}-n");
    document.getElementById('f-lmn3').innerHTML = T("l,\\,m,\\,n");

    /* note about cases */
    document.getElementById('note-cases').innerHTML =
      T("k > 0") + "：中心 " + T("\\left(-\\frac{l}{2},\\,-\\frac{m}{2}\\right)") + "、半径 " + T("\\sqrt{k}") + " の<strong>円</strong><br>" +
      T("k = 0") + "：<strong>1点</strong> " + T("\\left(-\\frac{l}{2},\\,-\\frac{m}{2}\\right)") + "<br>" +
      T("k < 0") + "：<strong>図形を表さない</strong>";

    tex("x^2+y^2-2x-8y-2=0", document.getElementById('formula-ex2'), true);

    /* sliders */
    const sliderL = document.getElementById('slider-l');
    const sliderM = document.getElementById('slider-m');
    const sliderN = document.getElementById('slider-n');

    function onSlider() {
      sl = parseInt(sliderL.value);
      sm = parseInt(sliderM.value);
      sn = parseInt(sliderN.value);
      document.getElementById('val-l').textContent = sl;
      document.getElementById('val-m').textContent = sm;
      document.getElementById('val-n').textContent = sn;
      updateResults();
    }

    sliderL.addEventListener('input', onSlider);
    sliderM.addEventListener('input', onSlider);
    sliderN.addEventListener('input', onSlider);

    /* slider labels with KaTeX */
    document.getElementById('lbl-l').innerHTML = T("l");
    document.getElementById('lbl-m').innerHTML = T("m");
    document.getElementById('lbl-n').innerHTML = T("n");

    updateResults();
    drawSVG();
    animLoop();

    /* walkthrough buttons */
    document.getElementById('prev').addEventListener('click', () => {
      if (curStep > 0) { curStep--; renderWalk(); }
    });
    document.getElementById('next').addEventListener('click', () => {
      if (curStep < steps.length - 1) { curStep++; renderWalk(); }
    });
    renderWalk();
  }

  if (window.katex) init();
  else window.addEventListener("DOMContentLoaded", () => {
    if (window.katex) init();
    else { const w = setInterval(() => { if (window.katex) { clearInterval(w); init(); } }, 30); }
  });
</script>
</body>
</html>
