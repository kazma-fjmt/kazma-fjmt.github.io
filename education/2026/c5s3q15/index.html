<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>x 軸の下側にある部分の面積</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0; }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; margin: .75rem 0; overflow: hidden; touch-action: none; position: relative; }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* draw() replaces the SVG contents, which would orphan a touch sequence that
     started on a child; keep hit-testing on the wrapper so the drag survives */
  .svg-container > svg { pointer-events: none; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto; }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step > .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step > .formula-line { text-align: left; overflow-x: auto; }
  .step > .formula-line .katex { font-size: 1.05rem; }
  .step.current > .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; gap: .5rem; margin: .75rem 0; }
  .tab { appearance: none; flex: 1; border: 1px solid #d4dbeb; background: #fff; color: var(--accent); font-size: .95rem; font-weight: 600; padding: .7rem .5rem; border-radius: 10px; min-height: 48px; cursor: pointer; font-family: inherit; user-select: none; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.05rem; }
  .live-calc > div { margin: .35rem 0; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row { display: flex; align-items: center; gap: 1rem; margin: .75rem 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; }
  .slider-row > label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row > input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row > .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; margin: .5rem 0; }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; justify-content: center; margin: .5rem 0 0; font-size: .88rem; }
  .legend > span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend > span > i { display: inline-block; width: 22px; height: 4px; border-radius: 2px; font-style: normal; }
  .legend > span > b { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
  .legend > span > u { display: inline-block; width: 15px; height: 15px; border-radius: 3px; text-decoration: none; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>x 軸の下側にある部分の面積</h1>
  <p class="subtitle">グラフが x 軸より下にあるときの面積を、折り返しの図で確かめましょう。</p>

  <h2>基本の考え方</h2>
  <p>区間 <span id="f-ab"></span> で <span id="f-fneg"></span> のとき、定積分 <span id="f-int"></span> は負の値になります。面積は必ず正なので、そのままでは面積になりません。</p>
  <p><span id="f-y1"></span> のグラフと <span id="f-y2"></span> のグラフは <span id="f-xax"></span> 軸に関して対称です。求める面積は、折り返した <span id="f-y2b"></span> と <span id="f-xax2"></span> 軸で囲まれた図形の面積と等しくなります。折り返した後は <span id="f-npos"></span> なので、これまでの公式がそのまま使えます。</p>
  <div class="formula-box" id="f-key"></div>

  <h2>解く問題</h2>
  <div class="formula-box" id="f-problem"></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <div class="tabs">
    <button class="tab active" id="tab1">(1) x 軸で折り返す</button>
    <button class="tab" id="tab2">(2) 上端を動かす</button>
  </div>
  <p id="mode-desc"></p>

  <div class="slider-row">
    <label><span id="lbl-b"></span> =</label>
    <input type="range" id="b-slider" min="0" max="3" step="0.05" value="3">
    <span class="slider-val" id="b-value">3</span>
  </div>
  <div class="slider-row" id="u-row">
    <label>折り返し</label>
    <input type="range" id="u-slider" min="0" max="1" step="0.05" value="0">
    <span class="slider-val" id="u-value">0</span>
  </div>

  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">x 軸で折り返す</button>
    <button class="btn" id="reset-btn">はじめに戻す</button>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 510" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend" id="legend"></div>
  <p class="drag-hint" id="drag-hint"></p>

  <div class="live-calc" id="live-calc"></div>
  <div class="note" id="note-box"></div>

  <h2>答え</h2>
  <div class="formula-box" id="result-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const W=600,H=510,mL=54,mR=26,PW=W-mL-mR;
const TT=26, TH=280;            /* 上段: y=f(x) と折り返し */
const BT=340, BH=140;           /* 下段: y=F(x) */
const XMIN=-0.5, XMAX=3.5, AA=0, BB=3;
const YT0=-7.2, YT1=7.2;
const YB0=-19, YB1=3.5;

function f(x){ return x*x-3*x-4; }
function F(x){ return x*x*x/3-1.5*x*x-4*x; }

function pxc(x){ return mL+(x-XMIN)/(XMAX-XMIN)*PW; }
function pyT(y){ return TT+TH-(y-YT0)/(YT1-YT0)*TH; }
function pyB(y){ return BT+BH-(y-YB0)/(YB1-YB0)*BH; }

let mode=1, bVal=3, uVal=0, animId=null;

function fmt(v){
  if(Math.abs(v)<5e-13) v=0;
  let s=v.toFixed(6);
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  if(s==='-0') s='0';
  return s;
}
/* 表示は小数第 3 位まで。丸めが入るときは = ではなく ≒ を使う */
function rnd(v){ return Math.round(v*1000)/1000; }
function rel(v){ return Math.abs(rnd(v)-v)<1e-12 ? '=' : '\\fallingdotseq'; }
function sv(v){ return fmt(rnd(v)); }

function niceStep(span){
  const raw=span/5, p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p;
  return (n<1.5?1:n<3?2:n<7?5:10)*p;
}
function ticksOf(lo,hi){
  const st=niceStep(hi-lo), out=[];
  for(let k=Math.ceil(lo/st);k*st<=hi+1e-9;k++){ const v=Math.round(k*st*1e6)/1e6; if(Math.abs(v)>1e-9) out.push(v); }
  return out;
}
/* 枠の外に出る部分は描かない。曲線は範囲外で途切れる */
function curveD(fn,py,lo,hi){
  let d='', pen=false;
  for(let i=0;i<=320;i++){
    const u=XMIN+(XMAX-XMIN)*i/320, y=fn(u);
    if(y>=lo && y<=hi){ d+=(pen?' L':' M')+` ${pxc(u).toFixed(2)} ${py(y).toFixed(2)}`; pen=true; }
    else pen=false;
  }
  return d;
}
function areaPath(fn,x0,x1){
  if(x1-x0<1e-9) return '';
  const N=Math.max(2,Math.round((x1-x0)/(XMAX-XMIN)*300));
  let d=`M ${pxc(x0).toFixed(2)} ${pyT(0).toFixed(2)}`;
  for(let i=0;i<=N;i++){ const u=x0+(x1-x0)*i/N; d+=` L ${pxc(u).toFixed(2)} ${pyT(fn(u)).toFixed(2)}`; }
  d+=` L ${pxc(x1).toFixed(2)} ${pyT(0).toFixed(2)} Z`;
  return d;
}

function init(){
  const spans={'f-ab':'a\\le x\\le b','f-fneg':'f(x)\\le 0','f-int':'\\int_a^b f(x)\\,dx',
    'f-y1':'y=f(x)','f-y2':'y=-f(x)','f-y2b':'y=-f(x)','f-xax':'x','f-xax2':'x',
    'f-npos':'-f(x)\\ge 0','lbl-b':'b'};
  for(const id in spans) document.getElementById(id).innerHTML=T(spans[id]);
  tex('S=\\int_a^b\\{-f(x)\\}\\,dx=-\\int_a^b f(x)\\,dx',document.getElementById('f-key'),true);
  tex('y=x^2-3x-4 \\ \\text{と } x \\text{ 軸、} y \\text{ 軸、直線 } x=3 \\text{ で囲まれた面積 } S',document.getElementById('f-problem'),true);
  tex('S=\\dfrac{33}{2}',document.getElementById('result-box'),true);

  initWalkthrough();
  setupTabs();
  setupSliders();
  setupButtons();
  setupDrag();
  applyMode();
}

function initWalkthrough(){
  const steps=[
    { label:'Step 1: 積分する区間を読み取る', formula:'y \\text{ 軸は } x=0 \\text{ だから、区間は } 0\\le x\\le 3' },
    { label:'Step 2: 区間での符号を調べる', formula:'x^2-3x-4=(x-4)(x+1)' },
    { label:'Step 3: 区間内では負であることを確かめる', formula:'0\\le x\\le 3 \\text{ では } x-4<0,\\ x+1>0 \\ \\Longrightarrow\\ y\\le 0' },
    { label:'Step 4: 面積は定積分の符号を反転する', formula:'S=-\\int_0^3 (x^2-3x-4)\\,dx' },
    { label:'Step 5: 原始関数を 1 つ求める', formula:'F(x)=\\dfrac{1}{3}x^3-\\dfrac{3}{2}x^2-4x' },
    { label:'Step 6: 上端と下端を代入する', formula:'\\left[\\dfrac{1}{3}x^3-\\dfrac{3}{2}x^2-4x\\right]_{0}^{3}=\\left(9-\\dfrac{27}{2}-12\\right)-0=-\\dfrac{33}{2}' },
    { label:'Step 7: 符号を反転して面積にする', formula:'S=-\\left(-\\dfrac{33}{2}\\right)=\\dfrac{33}{2}' },
    { label:'Step 8: 答え', formula:'S=\\dfrac{33}{2}' }
  ];
  let c=0;
  const container=document.getElementById('walkthrough'), counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=c;i++){
      html+=`<div class="step ${i===c?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${c+1} / ${steps.length}`;
    prevBtn.disabled=c===0;
    nextBtn.disabled=c===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{ if(c>0){c--;render();} });
  nextBtn.addEventListener('click',()=>{ if(c<steps.length-1){c++;render();} });
  render();
}

function draw(){
  const b=bVal, u=uVal, k=Math.cos(Math.PI*u);   /* k=1 で元の位置、k=-1 で折り返した位置 */
  const g=x=>k*f(x);
  const sig=F(b)-F(AA), area=-sig;
  let s='', ticks='';
  const HALO2=' stroke="#fff" stroke-width="2.5" paint-order="stroke" stroke-linejoin="round"';
  const LBL='font-size:13px;color:#999;display:inline-block;background:#fff';
  /* 下段の「S」ラベルは矢印の左に固定で置き、そこに重なる目盛りラベルは描かない */
  const ax=mL+PW-52, yA=pyB(0), yB2=pyB(F(b));
  const sBox = Math.abs(sig)>0.05 ? {x:ax-48, y:(yA+yB2)/2-24, w:44, h:48} : null;
  function hidden(x0,y0,w,h){
    return !!sBox && x0<sBox.x+sBox.w+3 && x0+w>sBox.x-3 && y0<sBox.y+sBox.h+3 && y0+h>sBox.y-3;
  }

  /* ===== 上段 ===== */
  s+=`<rect x="${mL}" y="${TT}" width="${PW}" height="${TH}" fill="#fff" stroke="#e3e3e3"/>`;
  const xt=ticksOf(XMIN,XMAX), yt=ticksOf(YT0,YT1);
  xt.forEach(v=>{ s+=`<line x1="${pxc(v)}" y1="${TT}" x2="${pxc(v)}" y2="${TT+TH}" stroke="#eee" stroke-width="1"/>`; });
  yt.forEach(v=>{ s+=`<line x1="${mL}" y1="${pyT(v)}" x2="${mL+PW}" y2="${pyT(v)}" stroke="#eee" stroke-width="1"/>`; });
  s+=`<line x1="${pxc(0)}" y1="${TT}" x2="${pxc(0)}" y2="${TT+TH}" stroke="#999" stroke-width="1.5"/>`;
  s+=`<line x1="${mL}" y1="${pyT(0)}" x2="${mL+PW}" y2="${pyT(0)}" stroke="#999" stroke-width="1.5"/>`;
  s+=`<line x1="${pxc(BB)}" y1="${TT}" x2="${pxc(BB)}" y2="${TT+TH}" stroke="var(--c-purple)" stroke-width="2" stroke-dasharray="7 5"/>`;
  /* 折り返しの途中は赤い点が x 軸上に載るので、点に重なる目盛りラベルは描かない */
  const rp={x:pxc(b), y:pyT(g(b)), r:13};
  function covered(x0,y0,w,h){
    const nx=Math.max(x0,Math.min(rp.x,x0+w)), ny=Math.max(y0,Math.min(rp.y,y0+h));
    return Math.hypot(rp.x-nx,rp.y-ny) < rp.r;
  }
  xt.forEach(v=>{
    const tw=fmt(v).length*6.5;
    if(covered(pxc(v)-tw/2, pyT(0)+7, tw, 12)) return;
    ticks+=`<text x="${pxc(v)}" y="${pyT(0)+16}" text-anchor="middle" font-size="11" fill="#aaa"${HALO2}>${fmt(v)}</text>`;
  });
  yt.forEach(v=>{ ticks+=`<text x="${mL-8}" y="${pyT(v)+4}" text-anchor="end" font-size="11" fill="#aaa"${HALO2}>${fmt(v)}</text>`; });

  /* 折り返しの行き先と元の位置をうすく残す */
  if(u>0.02) s+=`<path d="${curveD(f,pyT,YT0,YT1)}" fill="none" stroke="#d9c9ff" stroke-width="2" stroke-dasharray="6 5"/>`;
  if(u<0.98) s+=`<path d="${curveD(x=>-f(x),pyT,YT0,YT1)}" fill="none" stroke="#bfe6c9" stroke-width="2" stroke-dasharray="6 5"/>`;
  const ap=areaPath(g,AA,b);
  if(ap) s+=`<path d="${ap}" fill="${k>=0?'rgba(217,83,79,0.24)':'rgba(40,167,69,0.24)'}" stroke="none"/>`;
  s+=`<path d="${curveD(g,pyT,YT0,YT1)}" fill="none" stroke="${k>=0?'var(--c-purple)':'var(--c-green)'}" stroke-width="2.5"/>`;
  /* 目盛りラベルは直線の後に描く。この区間では f<=0 で赤い縦線が軸の下へ伸び、
     ラベルの位置を通るため、先に描くと数字が線で切られる */
  s+=`<line x1="${pxc(b)}" y1="${pyT(0)}" x2="${pxc(b)}" y2="${pyT(g(b))}" stroke="var(--c-red)" stroke-width="2.5"/>`;
  s+=ticks;
  s+=`<circle cx="${pxc(b)}" cy="${pyT(g(b))}" r="9" fill="var(--c-red)" stroke="#fff" stroke-width="2.5"/>`;
  s+=`<circle cx="${pxc(b)}" cy="${pyT(g(b))}" r="9" fill="none" stroke="var(--c-red)" stroke-width="2" opacity="0.5"><animate attributeName="r" values="9;17;9" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="1.8s" repeatCount="indefinite"/></circle>`;
  const curLabel = u<0.02 ? T('y=x^2-3x-4') : (u>0.98 ? T('y=-x^2+3x+4') : '折り返しの途中');
  s+=`<foreignObject x="${mL+8}" y="${TT+4}" width="180" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:${k>=0?'#7b61ff':'#28a745'};font-weight:600;display:inline-block;background:#fff;white-space:nowrap">${curLabel}</div></foreignObject>`;
  s+=`<foreignObject x="${pxc(BB)+5}" y="${TT+4}" width="52" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-purple);font-weight:600;display:inline-block;background:#fff;white-space:nowrap">${T('x=3')}</div></foreignObject>`;
  s+=`<foreignObject x="${mL+PW-24}" y="${pyT(0)+2}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${LBL}">${T('x')}</div></foreignObject>`;

  /* ===== 下段: y=F(x) と高さの差 ===== */
  s+=`<rect x="${mL}" y="${BT}" width="${PW}" height="${BH}" fill="#fff" stroke="#e3e3e3"/>`;
  const bt=ticksOf(YB0,YB1);
  xt.forEach(v=>{ s+=`<line x1="${pxc(v)}" y1="${BT}" x2="${pxc(v)}" y2="${BT+BH}" stroke="#eee" stroke-width="1"/>`; });
  bt.forEach(v=>{ s+=`<line x1="${mL}" y1="${pyB(v)}" x2="${mL+PW}" y2="${pyB(v)}" stroke="#eee" stroke-width="1"/>`; });
  s+=`<line x1="${pxc(0)}" y1="${BT}" x2="${pxc(0)}" y2="${BT+BH}" stroke="#999" stroke-width="1.5"/>`;
  s+=`<line x1="${mL}" y1="${pyB(0)}" x2="${mL+PW}" y2="${pyB(0)}" stroke="#999" stroke-width="1.5"/>`;
  let tickB='';
  xt.forEach(v=>{
    const tw=fmt(v).length*6.5;
    if(hidden(pxc(v)-tw/2, pyB(0)+6, tw, 12)) return;
    tickB+=`<text x="${pxc(v)}" y="${pyB(0)+15}" text-anchor="middle" font-size="11" fill="#aaa"${HALO2}>${fmt(v)}</text>`;
  });
  bt.forEach(v=>{ tickB+=`<text x="${mL-8}" y="${pyB(v)+4}" text-anchor="end" font-size="11" fill="#aaa"${HALO2}>${fmt(v)}</text>`; });

  s+=`<line x1="${pxc(b)}" y1="${BT}" x2="${pxc(b)}" y2="${BT+BH}" stroke="#c9d3e8" stroke-width="1.5" stroke-dasharray="5 5"/>`;
  s+=`<line x1="${mL}" y1="${pyB(F(b))}" x2="${mL+PW}" y2="${pyB(F(b))}" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 4"/>`;
  s+=`<path d="${curveD(F,pyB,YB0,YB1)}" fill="none" stroke="var(--c-green)" stroke-width="2.5"/>`;
  if(sBox){
    /* 白い下敷きを 1 本引いて、F のグラフと重なっても矢印が読めるようにする */
    s+=`<line x1="${ax}" y1="${yA}" x2="${ax}" y2="${yB2}" stroke="#fff" stroke-width="8"/>`;
    s+=`<line x1="${ax}" y1="${yA}" x2="${ax}" y2="${yB2}" stroke="var(--c-blue)" stroke-width="3"/>`;
    s+=`<path d="M ${ax} ${yB2} L ${ax-5} ${yB2-9} L ${ax+5} ${yB2-9} Z" fill="var(--c-blue)"/>`;
    s+=`<foreignObject x="${sBox.x}" y="${sBox.y}" width="${sBox.w}" height="${sBox.h}"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-blue);font-weight:700;display:inline-block;background:#fff;padding:2px 3px">${T('S')}</div></foreignObject>`;
  }
  s+=tickB;
  s+=`<circle cx="${pxc(AA)}" cy="${pyB(0)}" r="6" fill="#fff" stroke="var(--c-orange)" stroke-width="3"/>`;
  s+=`<circle cx="${pxc(b)}" cy="${pyB(F(b))}" r="8" fill="var(--c-green)" stroke="#fff" stroke-width="2.5"><animate attributeName="r" values="8;11;8" dur="1.6s" repeatCount="indefinite"/></circle>`;
  s+=`<foreignObject x="${mL+8}" y="${BT+BH-32}" width="130" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:var(--c-green);font-weight:600;display:inline-block;background:#fff;white-space:nowrap">${T('y=F(x)')}</div></foreignObject>`;
  s+=`<foreignObject x="${mL+PW-24}" y="${pyB(0)+2}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${LBL}">${T('x')}</div></foreignObject>`;

  document.getElementById('graph').innerHTML=s;

  const full=Math.abs(b-BB)<1e-9, zero=Math.abs(sig)<1e-12;
  document.getElementById('live-calc').innerHTML=
    `<div>${T('\\text{上端 } b = '+fmt(b))}${mode===1 ? '　折り返し '+fmt(uVal) : ''}</div>`+
    `<div style="color:var(--c-red)">${T('\\int_0^{b}(x^2-3x-4)\\,dx=F(b)-F(0) '+rel(sig)+' '+sv(sig))}${zero?'　（区間の幅が 0）':'　（負の値）'}</div>`+
    `<div style="color:var(--c-green)">${T('S=-\\int_0^{b}(x^2-3x-4)\\,dx '+rel(area)+' '+sv(area))}${zero?'　（面積も 0）':'　（面積は正）'}</div>`+
    `<div style="color:var(--c-blue)">${full ? T('b=3 \\text{ なので } S=\\dfrac{33}{2}') : T('\\text{上端を } 3 \\text{ まで動かしましょう}')}</div>`;
}

function buildLegend(){
  const L=document.getElementById('legend');
  let h='<span><i style="background:var(--c-purple)"></i>'+T('y=x^2-3x-4')+'</span>'+
        '<span><i style="background:var(--c-green)"></i>'+T('y=-x^2+3x+4')+'</span>';
  if(mode===1) h+='<span><u style="background:rgba(217,83,79,0.4)"></u>折り返す前</span>'+
                  '<span><u style="background:rgba(40,167,69,0.4)"></u>折り返した後</span>';
  else h+='<span><u style="background:rgba(217,83,79,0.4)"></u>'+T('x')+' 軸との間の部分</span>';
  h+='<span><i style="background:var(--c-blue)"></i>'+T('|\\,F(b)-F(0)\\,|=S')+'</span>'+
     '<span><b style="background:var(--c-red)"></b>'+T('(b,\\ y)')+'</span>';
  L.innerHTML=h;
}

function applyMode(){
  document.getElementById('tab1').classList.toggle('active',mode===1);
  document.getElementById('tab2').classList.toggle('active',mode===2);
  document.getElementById('u-row').style.display = mode===1 ? '' : 'none';
  document.getElementById('mode-desc').innerHTML = mode===1
    ? '「折り返し」を 0 から 1 まで動かすと、'+T('y=x^2-3x-4')+' が '+T('x')+' 軸で裏返っていき、1 で '+T('y=-x^2+3x+4')+' にぴったり重なります。途中は裏返る様子で、折り返しきった図形は元の図形と '+T('x')+' 軸に関して対称なので、面積は同じです。'
    : '上端 '+T('b')+' を 0 から 3 まで動かします。下段の緑の点は下へ進み、'+T('F(b)-F(0)')+' は負の値になっていきます。その絶対値が面積です。';
  document.getElementById('drag-hint').innerHTML='図を横にドラッグするか、スライダーで上端 '+T('b')+' を変えましょう。';
  document.getElementById('anim-btn').textContent = mode===1 ? 'x 軸で折り返す' : '面積を塗る';
  document.getElementById('note-box').innerHTML = mode===1
    ? T('y=x^2-3x-4')+' と '+T('y=-x^2+3x+4')+' は '+T('x')+' 軸に関して対称なので、囲まれた図形の面積は同じです。折り返した後は '+T('-f(x)\\ge 0')+' なので '+T('S=\\int_0^3\\{-f(x)\\}\\,dx=-\\int_0^3 f(x)\\,dx')+' と書けます。'
    : '定積分 '+T('\\int_0^3 f(x)\\,dx')+' は '+T('-\\dfrac{33}{2}')+' で負の値です。定積分は符号つきの量、面積は必ず正の量、という違いに注意しましょう。面積はその符号を反転した '+T('\\dfrac{33}{2}')+' です。';
  if(mode===1){ setB(3); setU(0); } else { setB(0); setU(0); }
  buildLegend();
  draw();
}

function setB(v){
  bVal=Math.round(Math.max(0,Math.min(3,v))*20)/20;
  document.getElementById('b-slider').value=bVal;
  document.getElementById('b-value').textContent=fmt(bVal);
}
function setU(v){
  uVal=Math.round(Math.max(0,Math.min(1,v))*20)/20;
  document.getElementById('u-slider').value=uVal;
  document.getElementById('u-value').textContent=fmt(uVal);
}

function setupTabs(){
  document.getElementById('tab1').addEventListener('click',()=>{ stopAnim(); mode=1; applyMode(); });
  document.getElementById('tab2').addEventListener('click',()=>{ stopAnim(); mode=2; applyMode(); });
}
function setupSliders(){
  const bs=document.getElementById('b-slider'), us=document.getElementById('u-slider');
  bs.addEventListener('input',()=>{ stopAnim(); setB(parseFloat(bs.value)); draw(); });
  us.addEventListener('input',()=>{ stopAnim(); setU(parseFloat(us.value)); draw(); });
}
function setupButtons(){
  document.getElementById('anim-btn').addEventListener('click',()=>{
    if(mode===1){ setB(3); sweep('u',0,1,2800); }
    else sweep('b',0,3,3200);
  });
  document.getElementById('reset-btn').addEventListener('click',()=>{ stopAnim(); applyMode(); });
}
function stopAnim(){ if(animId){ cancelAnimationFrame(animId); animId=null; } }
function sweep(what,from,to,duration){
  stopAnim();
  let t0=null;
  if(what==='b') setB(from); else setU(from);
  function frame(ts){
    if(!t0) t0=ts;
    const pr=Math.min((ts-t0)/duration,1);
    const eased=pr<0.5 ? 2*pr*pr : 1-Math.pow(-2*pr+2,2)/2;
    const v=from+(to-from)*eased;
    if(what==='b') setB(v); else setU(v);
    draw();
    animId = pr<1 ? requestAnimationFrame(frame) : null;
  }
  animId=requestAnimationFrame(frame);
}

function setupDrag(){
  const svg=document.getElementById('graph');
  const wrap=document.getElementById('svg-wrap');
  let dragging=false;
  function toX(cx){
    const rect=svg.getBoundingClientRect();
    const sx=(cx-rect.left)/rect.width*W;
    return XMIN+(sx-mL)/PW*(XMAX-XMIN);
  }
  function startDrag(cx,cy){
    const rect=svg.getBoundingClientRect();
    const sy=(cy-rect.top)/rect.height*H;
    if(sy>TT-16 && sy<BT+BH+16){ stopAnim(); dragging=true; setB(toX(cx)); draw(); }
  }
  function moveDrag(cx){ if(dragging){ setB(toX(cx)); draw(); } }
  function endDrag(){ dragging=false; }
  wrap.addEventListener('mousedown',e=>{ e.preventDefault(); startDrag(e.clientX,e.clientY); });
  window.addEventListener('mousemove',e=>{ if(dragging){ e.preventDefault(); moveDrag(e.clientX); } });
  window.addEventListener('mouseup',endDrag);
  wrap.addEventListener('touchstart',e=>{ const t=e.touches[0]; startDrag(t.clientX,t.clientY); },{passive:true});
  wrap.addEventListener('touchmove',e=>{ if(dragging){ e.preventDefault(); const t=e.touches[0]; moveDrag(t.clientX); } },{passive:false});
  wrap.addEventListener('touchend',endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
