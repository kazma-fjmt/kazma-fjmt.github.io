<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>円を表す条件</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step {
    padding: .75rem .25rem; border-bottom: 1px dashed #eee;
    transition: background .2s ease; animation: fadeIn .3s ease;
  }
  .step:last-child { border-bottom: none; }
  .step.current {
    background: #f0f5ff; border-radius: 8px; padding: .75rem;
    margin: .25rem -.5rem; border-bottom: none;
  }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; margin: 1rem 0 0;
  }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .note {
    background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px;
    padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem;
  }
  .live-calc {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto;
  }
  .live-calc .katex { font-size: 1.1rem; }

  .slider-group {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; margin: .75rem 0;
  }
  .slider-row {
    display: flex; align-items: center; gap: .75rem; margin: .5rem 0;
  }
  .slider-row label { min-width: 60px; font-weight: 600; font-size: .95rem; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .val { min-width: 40px; text-align: right; font-weight: 600; font-size: .95rem; }

  .classification {
    text-align: center; font-size: 1.15rem; font-weight: 700;
    padding: 1rem; border-radius: 10px; margin: .75rem 0;
    transition: all .3s ease;
  }
  .classification.circle { background: #e8f5e9; border: 2px solid var(--c-green); color: var(--c-green); }
  .classification.point { background: #fff3e0; border: 2px solid var(--c-orange); color: var(--c-orange); }
  .classification.nothing { background: #ffebee; border: 2px solid var(--c-red); color: var(--c-red); }

  .drag-hint {
    text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>円を表す条件</h1>
  <p class="subtitle">円の一般形の方程式が、いつ円を表すかを調べましょう。</p>

  <h2>円の一般形</h2>
  <p>円の方程式は展開すると次の形になります。</p>
  <div class="formula-box" id="formula-general"></div>
  <p>この式が<strong>円</strong>を表すための条件を考えます。</p>

  <h2>平方完成による変形</h2>
  <div class="walkthrough" id="wt-derive"></div>
  <div class="controls-row">
    <button class="btn" id="wd-prev" disabled>&larr; 前へ</button>
    <span class="step-counter" id="wd-counter"></span>
    <button class="btn primary" id="wd-next">次へ &rarr;</button>
  </div>

  <h2>円を表す条件</h2>
  <div class="formula-box" id="formula-condition"></div>
  <p>右辺が正のとき（つまり半径の2乗が正のとき）のみ、この式は円を表します。</p>

  <div class="note" id="note-cases"></div>

  <h2>分類を確認しよう</h2>
  <p>スライダーで係数を変えて、方程式が何を表すか確認しましょう。</p>

  <div class="slider-group" id="sliders">
    <div class="slider-row">
      <label id="lbl-l"></label>
      <input type="range" id="sl-l" min="-10" max="10" step="1" value="6">
      <span class="val" id="val-l"></span>
    </div>
    <div class="slider-row">
      <label id="lbl-m"></label>
      <input type="range" id="sl-m" min="-10" max="10" step="1" value="-4">
      <span class="val" id="val-m"></span>
    </div>
    <div class="slider-row">
      <label id="lbl-n"></label>
      <input type="range" id="sl-n" min="-30" max="30" step="1" value="-12">
      <span class="val" id="val-n"></span>
    </div>
  </div>

  <div class="live-calc" id="live-eq"></div>
  <div class="live-calc" id="live-standard"></div>
  <div id="classification-box" class="classification circle"></div>
  <div class="live-calc" id="live-condition"></div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}
if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{if(window.katex)init();else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}});

function init(){
  tex('x^2 + y^2 + lx + my + n = 0', document.getElementById('formula-general'), true);

  tex('l^2 + m^2 - 4n > 0 \\quad\\text{のとき円を表す}', document.getElementById('formula-condition'), true);

  document.getElementById('note-cases').innerHTML =
    '<strong>3つの場合：</strong><br>' +
    T('l^2+m^2-4n > 0') + ' &rarr; <strong>円</strong>（中心と半径をもつ）<br>' +
    T('l^2+m^2-4n = 0') + ' &rarr; <strong>1点</strong>（半径0の「点円」）<br>' +
    T('l^2+m^2-4n < 0') + ' &rarr; <strong>図形なし</strong>（実数解が存在しない）';

  initDerivation();
  initSliders();
}

function initDerivation(){
  const steps = [
    { label: 'Step 1: 一般形の方程式', formula: 'x^2 + y^2 + lx + my + n = 0' },
    { label: 'Step 2: xについて平方完成', formula: 'x^2 + lx = \\left(x + \\frac{l}{2}\\right)^2 - \\frac{l^2}{4}' },
    { label: 'Step 3: yについて平方完成', formula: 'y^2 + my = \\left(y + \\frac{m}{2}\\right)^2 - \\frac{m^2}{4}' },
    { label: 'Step 4: 代入して整理', formula: '\\left(x + \\frac{l}{2}\\right)^2 + \\left(y + \\frac{m}{2}\\right)^2 = \\frac{l^2}{4} + \\frac{m^2}{4} - n' },
    { label: 'Step 5: 右辺を整理', formula: '\\left(x + \\frac{l}{2}\\right)^2 + \\left(y + \\frac{m}{2}\\right)^2 = \\frac{l^2 + m^2 - 4n}{4}' },
    { label: 'Step 6: 円の標準形との比較', formula: '\\text{中心}\\left(-\\frac{l}{2},\\,-\\frac{m}{2}\\right),\\quad r^2 = \\frac{l^2+m^2-4n}{4}' },
    { label: 'Step 7: 条件', formula: '\\frac{l^2+m^2-4n}{4} > 0 \\;\\Leftrightarrow\\; l^2+m^2-4n > 0 \\;\\text{のとき円}' },
  ];

  let cur = 0;
  const container = document.getElementById('wt-derive');
  const counter = document.getElementById('wd-counter');
  const prevBtn = document.getElementById('wd-prev');
  const nextBtn = document.getElementById('wd-next');

  function render(){
    let html = '';
    for(let i = 0; i <= cur; i++){
      html += `<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML = html;
    counter.textContent = `${cur+1} / ${steps.length}`;
    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === steps.length - 1;
  }

  prevBtn.addEventListener('click', () => { if(cur > 0){ cur--; render(); } });
  nextBtn.addEventListener('click', () => { if(cur < steps.length - 1){ cur++; render(); } });
  render();
}

function initSliders(){
  const slL = document.getElementById('sl-l');
  const slM = document.getElementById('sl-m');
  const slN = document.getElementById('sl-n');

  tex('l =', document.getElementById('lbl-l'));
  tex('m =', document.getElementById('lbl-m'));
  tex('n =', document.getElementById('lbl-n'));

  function update(){
    const l = parseInt(slL.value);
    const m = parseInt(slM.value);
    const n = parseInt(slN.value);

    document.getElementById('val-l').textContent = l;
    document.getElementById('val-m').textContent = m;
    document.getElementById('val-n').textContent = n;

    // Show equation
    const lSign = l >= 0 ? '+' : '-';
    const mSign = m >= 0 ? '+' : '-';
    const nSign = n >= 0 ? '+' : '-';
    const eqStr = `x^2 + y^2 ${l===0?'':'${lSign}'+Math.abs(l)+'x'} ${m===0?'':'${mSign}'+Math.abs(m)+'y'} ${n===0?'':'${nSign}'+Math.abs(n)} = 0`;

    let parts = 'x^2 + y^2';
    if(l !== 0) parts += (l > 0 ? ' + ' : ' - ') + (Math.abs(l)===1?'':Math.abs(l)) + 'x';
    if(m !== 0) parts += (m > 0 ? ' + ' : ' - ') + (Math.abs(m)===1?'':Math.abs(m)) + 'y';
    if(n !== 0) parts += (n > 0 ? ' + ' : ' - ') + Math.abs(n);
    parts += ' = 0';
    tex(parts, document.getElementById('live-eq'), true);

    const cx = -l/2;
    const cy = -m/2;
    const k = l*l/4 + m*m/4 - n; // r^2

    // Standard form
    const cxStr = cx === 0 ? 'x' : (cx > 0 ? `(x-${cx})` : `(x+${-cx})`);
    const cyStr = cy === 0 ? 'y' : (cy > 0 ? `(y-${cy})` : `(y+${-cy})`);

    const fmtFrac = (num, den) => {
      if(num % den === 0) return `${num/den}`;
      return `\\frac{${num}}{${den}}`;
    };

    // Show (x + l/2)^2 + (y + m/2)^2 = k
    const lHalf = l % 2 === 0 ? `${l/2}` : `\\frac{${l}}{2}`;
    const mHalf = m % 2 === 0 ? `${m/2}` : `\\frac{${m}}{2}`;

    let xPart, yPart;
    if(l === 0) xPart = 'x^2';
    else if(l > 0) xPart = `\\left(x+${l%2===0?l/2:('\\frac{'+l+'}{2}')}\\right)^2`;
    else xPart = `\\left(x-${-l%2===0?-l/2:('\\frac{'+(-l)+'}{2}')}\\right)^2`;

    if(m === 0) yPart = 'y^2';
    else if(m > 0) yPart = `\\left(y+${m%2===0?m/2:('\\frac{'+m+'}{2}')}\\right)^2`;
    else yPart = `\\left(y-${-m%2===0?-m/2:('\\frac{'+(-m)+'}{2}')}\\right)^2`;

    // k as fraction
    const kNum = l*l + m*m - 4*n;
    let kStr;
    if(kNum % 4 === 0) kStr = `${kNum/4}`;
    else kStr = `\\frac{${kNum}}{4}`;

    tex(`${xPart} + ${yPart} = ${kStr}`, document.getElementById('live-standard'), true);

    // Condition
    const disc = l*l + m*m - 4*n;
    const classBox = document.getElementById('classification-box');
    const condEl = document.getElementById('live-condition');

    const fourN = 4*n;
    const fourNStr = fourN >= 0 ? `-${fourN}` : `+${-fourN}`;
    const condCalc = `l^2+m^2-4n = ${l*l}+${m*m}${fourNStr}`;

    if(disc > 0){
      classBox.className = 'classification circle';
      classBox.innerHTML = '円';
      const rSq = disc / 4;
      const rStr = Number.isInteger(Math.sqrt(rSq)) ? `${Math.sqrt(rSq)}` : `\\frac{\\sqrt{${disc}}}{2}`;
      tex(`${condCalc} = ${disc} > 0 \\quad\\Rightarrow\\quad \\text{円（半径 } r=${rStr} \\text{）}`, condEl, true);
    } else if(disc === 0){
      classBox.className = 'classification point';
      classBox.innerHTML = '1点のみ（点円）';
      tex(`${condCalc} = 0 \\quad\\Rightarrow\\quad \\text{1点}\\left(${cx},\\,${cy}\\right)`, condEl, true);
    } else {
      classBox.className = 'classification nothing';
      classBox.innerHTML = '図形なし';
      tex(`${condCalc} = ${disc} < 0 \\quad\\Rightarrow\\quad \\text{図形を表さない}`, condEl, true);
    }

    drawGraph(cx, cy, disc > 0 ? Math.sqrt(disc/4) : 0, disc);
  }

  slL.addEventListener('input', update);
  slM.addEventListener('input', update);
  slN.addEventListener('input', update);
  update();
}

function drawGraph(cx, cy, r, disc){
  const svg = document.getElementById('graph');
  const W = 600, H = 600, ox = 300, oy = 300, scale = 35;

  function px(x){ return ox + x * scale; }
  function py(y){ return oy - y * scale; }

  let html = '';

  // Grid
  for(let i = -8; i <= 8; i++){
    html += `<line x1="${px(i)}" y1="10" x2="${px(i)}" y2="${H-10}" stroke="#eee"/>`;
    html += `<line x1="10" y1="${py(i)}" x2="${W-10}" y2="${py(i)}" stroke="#eee"/>`;
  }

  // Axes
  html += `<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#999"/></marker></defs>`;
  html += `<line x1="10" y1="${oy}" x2="${W-10}" y2="${oy}" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>`;
  html += `<line x1="${ox}" y1="${H-10}" x2="${ox}" y2="10" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>`;
  html += `<foreignObject x="${Math.min(W-15-12,W-26)}" y="${oy-22}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('x')}</div></foreignObject>`;
  html += `<foreignObject x="${ox+6}" y="${Math.max(py(7)-2,2)}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#999">${T('y')}</div></foreignObject>`;
  html += `<text x="${ox+5}" y="${oy+18}" font-size="12" fill="#999">O</text>`;

  // Axis labels
  for(let i = -7; i <= 7; i++){
    if(i === 0) continue;
    html += `<text x="${px(i)}" y="${oy+18}" font-size="11" fill="#aaa" text-anchor="middle">${i}</text>`;
    html += `<text x="${ox-14}" y="${py(i)+4}" font-size="11" fill="#aaa" text-anchor="end">${i}</text>`;
  }

  if(disc > 0){
    // Draw circle
    const rPx = r * scale;
    html += `<circle cx="${px(cx)}" cy="${py(cy)}" r="${rPx}" fill="rgba(42,109,244,0.08)" stroke="var(--c-blue)" stroke-width="2.5">`;
    html += `<animate attributeName="stroke-dashoffset" values="${2*Math.PI*rPx};0" dur="1s" fill="freeze"/></circle>`;

    // Center
    html += `<circle cx="${px(cx)}" cy="${py(cy)}" r="5" fill="var(--c-red)" stroke="#fff" stroke-width="2"/>`;
    html += `<text x="${px(cx)+10}" y="${py(cy)-10}" font-size="13" font-weight="700" fill="var(--c-red)">中心</text>`;

    // Radius line
    html += `<line x1="${px(cx)}" y1="${py(cy)}" x2="${px(cx+r)}" y2="${py(cy)}" stroke="var(--c-orange)" stroke-width="2" stroke-dasharray="5,3"/>`;
    html += `<foreignObject x="${px(cx + r/2)-12}" y="${py(cy)-22}" width="24" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;color:var(--c-orange);text-align:center">${T('r')}</div></foreignObject>`;
  } else if(disc === 0){
    // Draw point
    html += `<circle cx="${px(cx)}" cy="${py(cy)}" r="7" fill="var(--c-orange)" stroke="#fff" stroke-width="2">`;
    html += `<animate attributeName="r" values="7;11;7" dur="1.5s" repeatCount="indefinite"/></circle>`;
    html += `<text x="${px(cx)+14}" y="${py(cy)-8}" font-size="13" font-weight="700" fill="var(--c-orange)">1点</text>`;
  } else {
    // Nothing - show a faded dashed circle to indicate "would be here"
    html += `<text x="${W/2}" y="${H/2-10}" font-size="16" fill="var(--c-red)" text-anchor="middle" font-weight="700">図形なし</text>`;
    html += `<text x="${W/2}" y="${H/2+15}" font-size="13" fill="var(--muted)" text-anchor="middle">（実数解が存在しません）</text>`;
  }

  svg.innerHTML = html;
}
</script>
</body>
</html>
