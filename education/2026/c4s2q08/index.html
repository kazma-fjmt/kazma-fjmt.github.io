<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>素因数分解と対数の表示</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0;
  }
  .formula-box .katex { font-size: 1.15rem; }

  .svg-container {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    margin: .75rem 0; overflow: hidden; touch-action: none; position: relative;
  }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough {
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
    padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto;
  }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0; }
  .tab {
    appearance: none; border: 1px solid #d4dbeb; background: #fff; color: var(--accent);
    font-size: 1rem; font-weight: 600; padding: .6rem .9rem; border-radius: 10px;
    cursor: pointer; min-height: 48px; min-width: 92px; font-family: inherit; user-select: none;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.05rem; }

  .slider-row {
    display: flex; align-items: center; gap: 1rem; margin: .75rem 0;
    background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem;
  }
  .slider-row label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; margin: .5rem 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin: .5rem 0; font-size: .9rem; }
  .legend > span { display: inline-flex; align-items: center; gap: .35rem; }
  .swatch { display: inline-block; width: 16px; height: 16px; border-radius: 4px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>素因数分解と対数の表示</h1>
  <p class="subtitle">真数を 2・3・10 の積に分解して、常用対数を2つの文字で表しましょう。</p>

  <h2>基本の考え方</h2>
  <p>真数を <span id="f-fac"></span> の形に分解できれば、積は和・商は差・指数は係数に変わるので、対数は3種類の部品の足し算になります。</p>
  <div class="formula-box" id="f-key"></div>
  <div class="note" id="f-note"></div>

  <h2>解法ウォークスルー</h2>
  <p>表したい式をタップして選び、「次へ」で1行ずつ進めましょう。</p>
  <div class="tabs" id="tabs"></div>
  <div class="formula-box" id="f-expr"></div>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>部品を組み立てよう</h2>
  <p>部品の長さは <span id="f-lenp"></span>、<span id="f-lenq"></span>、<span id="f-len1"></span> です。左から順につないでいくと、右端が対数の値になります。</p>
  <div class="legend">
    <span><i class="swatch" style="background:#2a6df4"></i><span id="lg-p"></span></span>
    <span><i class="swatch" style="background:#28a745"></i><span id="lg-q"></span></span>
    <span><i class="swatch" style="background:#7b61ff"></i><span id="lg-1"></span></span>
    <span><i class="swatch" style="background:#fff;border:2px solid #d9534f"></i>負の部品は左へ伸びます</span>
  </div>
  <div class="anim-btn-row"><button class="btn primary" id="anim-btn">アニメーション</button></div>
  <div class="svg-container">
    <svg id="bar" viewBox="0 0 620 262" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="live-calc" id="live-calc"></div>

  <h2>自由に探索</h2>
  <p>指数を動かして真数を組み立てると、対数がそのまま <span id="f-pq1"></span> の式になることを確かめられます。</p>
  <div class="slider-row">
    <label><span id="lbl-i"></span> =</label>
    <input type="range" id="i-slider" min="-3" max="3" step="1" value="-3">
    <span class="slider-val" id="i-value">-3</span>
  </div>
  <div class="slider-row">
    <label><span id="lbl-j"></span> =</label>
    <input type="range" id="j-slider" min="-3" max="3" step="1" value="-2">
    <span class="slider-val" id="j-value">-2</span>
  </div>
  <div class="slider-row">
    <label><span id="lbl-k"></span> =</label>
    <input type="range" id="k-slider" min="-3" max="3" step="1" value="0">
    <span class="slider-val" id="k-value">0</span>
  </div>
  <div class="svg-container">
    <svg id="bar2" viewBox="0 0 620 262" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="live-calc" id="live2"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

const P=Math.log(2)/Math.log(10), Q=Math.log(3)/Math.log(10);
const SYMV={p:P,q:Q,u:1};
const SYMC={p:'#2a6df4',q:'#28a745',u:'#7b61ff'};

const PROBS=[
 {tag:'例(1)',expr:'\\log_{10} 3\\sqrt{2}',
  blocks:[{c:0.5,s:'p'},{c:1,s:'q'}],
  res:'\\log_{10} 3\\sqrt{2} = \\dfrac{1}{2}p + q',
  steps:[
   {label:'Step 1: 真数を積の形にみる',f:'3\\sqrt{2} = \\sqrt{2}\\times 3'},
   {label:'Step 2: 積を和に分ける',f:'\\log_{10} 3\\sqrt{2} = \\log_{10}\\sqrt{2} + \\log_{10} 3'},
   {label:'Step 3: 根号を指数に直す',f:'\\log_{10}\\sqrt{2} = \\log_{10} 2^{\\frac{1}{2}} = \\dfrac{1}{2}\\log_{10} 2'},
   {label:'Step 4: 文字に置きかえる',f:'= \\dfrac{1}{2}p + q'}
  ]},
 {tag:'例(2)',expr:'\\log_{10} 5',
  blocks:[{c:1,s:'u'},{c:-1,s:'p'}],
  res:'\\log_{10} 5 = 1 - p',
  steps:[
   {label:'Step 1: 5 は 2 と 3 では作れない',f:'5 = \\dfrac{10}{2}\\;\\text{とみる}'},
   {label:'Step 2: 商を差に分ける',f:'\\log_{10} 5 = \\log_{10} 10 - \\log_{10} 2'},
   {label:'Step 3: 底と同じ数の対数は 1',f:'\\log_{10} 10 = 1'},
   {label:'Step 4: 文字に置きかえる',f:'= 1 - p'}
  ]},
 {tag:'問(1)',expr:'\\log_{10} \\dfrac{1}{72}',
  blocks:[{c:-3,s:'p'},{c:-2,s:'q'}],
  res:'\\log_{10} \\dfrac{1}{72} = -3p - 2q',
  steps:[
   {label:'Step 1: 真数を素因数分解する',f:'72 = 8\\times 9 = 2^3\\times 3^2'},
   {label:'Step 2: 逆数は符号が変わる',f:'\\log_{10}\\dfrac{1}{72} = -\\log_{10} 72'},
   {label:'Step 3: 積を和に分ける',f:'\\log_{10} 72 = \\log_{10} 2^3 + \\log_{10} 3^2'},
   {label:'Step 4: 指数を前に出す',f:'= 3\\log_{10} 2 + 2\\log_{10} 3 = 3p + 2q'},
   {label:'Step 5: 答え',f:'\\log_{10}\\dfrac{1}{72} = -(3p + 2q) = -3p - 2q'}
  ]},
 {tag:'問(2)',expr:'\\log_{10} \\sqrt{0.3}',
  blocks:[{c:0.5,s:'q'},{c:-0.5,s:'u'}],
  res:'\\log_{10} \\sqrt{0.3} = \\dfrac{1}{2}q - \\dfrac{1}{2}',
  steps:[
   {label:'Step 1: 小数を分数に直す',f:'0.3 = \\dfrac{3}{10}'},
   {label:'Step 2: 根号を指数に直す',f:'\\log_{10}\\sqrt{0.3} = \\dfrac{1}{2}\\log_{10} 0.3'},
   {label:'Step 3: 商を差に分ける',f:'\\log_{10}\\dfrac{3}{10} = \\log_{10} 3 - \\log_{10} 10 = q - 1'},
   {label:'Step 4: 係数を掛ける',f:'= \\dfrac{1}{2}(q - 1)'},
   {label:'Step 5: 答え',f:'\\log_{10}\\sqrt{0.3} = \\dfrac{1}{2}q - \\dfrac{1}{2}'}
  ]},
 {tag:'問(3)',expr:'\\log_{10} 75',
  blocks:[{c:2,s:'u'},{c:1,s:'q'},{c:-2,s:'p'}],
  res:'\\log_{10} 75 = 2 + q - 2p',
  steps:[
   {label:'Step 1: 5 が出るので 10 と 2 で作る',f:'75 = 3\\times 25 = 3\\times\\dfrac{100}{4}'},
   {label:'Step 2: 積と商を和と差に分ける',f:'\\log_{10} 75 = \\log_{10} 3 + \\log_{10} 100 - \\log_{10} 4'},
   {label:'Step 3: それぞれを求める',f:'\\log_{10} 100 = 2,\\quad \\log_{10} 4 = 2\\log_{10} 2 = 2p'},
   {label:'Step 4: 文字に置きかえる',f:'= q + 2 - 2p'},
   {label:'Step 5: 答え',f:'\\log_{10} 75 = 2 + q - 2p'}
  ]}
];

let curProb=2, curStep=0, animId=null, animProg=99;

function nz(x){return Math.abs(x)<5e-4?0:x;}
function fmt(x){return nz(x).toFixed(4);}

function coefLab(c,s){
  const base = s==='u' ? '' : s;
  let cs;
  const a=Math.abs(c);
  if(Math.abs(a-0.5)<1e-9) cs='\\tfrac{1}{2}';
  else if(Math.abs(a-1)<1e-9) cs = base===''?'1':'';
  else cs=String(a);
  const sign = c<0?'-':'';
  return sign + cs + base;
}

function fo(cx,y,wid,hei,html,color,size){
  const x=Math.max(2,Math.min(cx-wid/2,620-wid-2));
  return `<foreignObject x="${x}" y="${y}" width="${wid}" height="${hei}"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:${size}px;color:${color};font-weight:600;text-align:center;white-space:nowrap;background:#fff;line-height:1.5">${html}</div></foreignObject>`;
}

/* Lays the parts of the expression end to end as blocks above a value axis. */
function drawBar(id,blocks,resLab,prog){
  const W=620,bH=30,LW=110,LH=34;
  const vals=blocks.map(b=>b.c*SYMV[b.s]);
  const cum=[0];
  vals.forEach(v=>cum.push(cum[cum.length-1]+v));
  let pmin=Math.min.apply(null,cum), pmax=Math.max.apply(null,cum);
  pmin=Math.floor((pmin-0.6)*2)/2; pmax=Math.ceil((pmax+0.6)*2)/2;
  if(pmax-pmin<2){pmax=pmin+2;}
  const X=v=>44+(v-pmin)/(pmax-pmin)*(W-88);
  /* Give every label its own row so that neighbouring blocks never write on top of each other. */
  const cxOf=i=>Math.max(2,Math.min((X(cum[i])+X(cum[i]+vals[i]))/2-LW/2,W-LW-2))+LW/2;
  const rowOf=[], taken=[[],[],[],[]];
  for(let i=0;i<blocks.length;i++){
    const cx=cxOf(i);
    const order=(i%2===0)?[0,1,2,3]:[1,0,3,2];
    let r=order[order.length-1];
    for(const o of order){ if(taken[o].every(u=>Math.abs(u-cx)>=LW+6)){r=o;break;} }
    taken[r].push(cx); rowOf.push(r);
  }
  const useA2=rowOf.indexOf(2)>=0, useB2=rowOf.indexOf(3)>=0;
  const bTop=useA2?148:110;
  const RY=[bTop-40,bTop+bH+10,bTop-78,bTop+bH+48];
  const y0=bTop+(useB2?132:94);
  let s='';

  s+=`<line x1="${X(pmin)}" y1="${y0}" x2="${X(pmax)}" y2="${y0}" stroke="#666" stroke-width="2"/>`;
  s+=`<polygon points="${X(pmax)+10},${y0} ${X(pmax)},${y0-5} ${X(pmax)},${y0+5}" fill="#666"/>`;
  for(let k=Math.ceil(pmin);k<=Math.floor(pmax);k++){
    s+=`<line x1="${X(k)}" y1="${y0-7}" x2="${X(k)}" y2="${y0+7}" stroke="#666" stroke-width="1.5"/>`;
    s+=`<text x="${X(k)}" y="${y0+26}" text-anchor="middle" font-size="12" fill="#888">${k}</text>`;
  }
  s+=`<line x1="${X(0)}" y1="${bTop-6}" x2="${X(0)}" y2="${y0-8}" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4"/>`;

  let labs='';
  for(let i=0;i<blocks.length;i++){
    const f=Math.max(0,Math.min(1,prog-i));
    if(f<=0) continue;
    const from=cum[i], to=cum[i]+vals[i]*f;
    const x1=Math.min(X(from),X(to)), x2=Math.max(X(from),X(to));
    const col=SYMC[blocks[i].s];
    const neg=vals[i]<0;
    s+=`<rect x="${x1}" y="${bTop}" width="${Math.max(x2-x1,1)}" height="${bH}" rx="5" fill="${col}" fill-opacity="${neg?0.25:0.75}" stroke="${neg?'var(--c-red)':col}" stroke-width="${neg?2.5:1.5}"/>`;
    if(f>=1){
      s+=`<line x1="${X(to)}" y1="${bTop+bH}" x2="${X(to)}" y2="${y0-8}" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>`;
      const r=rowOf[i], above=(r===0||r===2), ly=RY[r];
      s+=`<line x1="${(x1+x2)/2}" y1="${above?bTop:bTop+bH}" x2="${(x1+x2)/2}" y2="${above?ly+LH:ly}" stroke="${col}" stroke-width="1.5"/>`;
      labs+=fo((x1+x2)/2,ly,LW,LH,T(coefLab(blocks[i].c,blocks[i].s)),col,16);
    }
  }
  s+=labs;

  const done=prog>=blocks.length;
  if(done){
    const tot=cum[cum.length-1];
    s+=fo(X(tot),8,300,40,T(resLab),'var(--c-orange)',15);
    s+=`<line x1="${X(tot)}" y1="48" x2="${X(tot)}" y2="${y0-8}" stroke="var(--c-orange)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    s+=`<circle cx="${X(tot)}" cy="${y0}" r="7" fill="var(--c-orange)" stroke="#fff" stroke-width="2"/>`;
    s+=`<circle cx="${X(tot)}" cy="${y0}" r="7" fill="none" stroke="var(--c-orange)" stroke-width="3"><animate attributeName="r" values="7;15;7" dur="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></circle>`;
  }
  s+=`<circle cx="${X(0)}" cy="${y0}" r="5" fill="#666"/>`;
  const el=document.getElementById(id);
  el.setAttribute('viewBox','0 0 '+W+' '+(y0+46));
  el.innerHTML=s;
}

function renderTabs(){
  const box=document.getElementById('tabs');
  box.innerHTML='';
  PROBS.forEach((p,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===curProb?' active':'');
    b.textContent=p.tag;
    b.addEventListener('click',()=>{curProb=i;curStep=0;renderTabs();renderSteps();startAnim();});
    box.appendChild(b);
  });
  tex(PROBS[curProb].expr,document.getElementById('f-expr'),true);
}

function renderSteps(){
  const steps=PROBS[curProb].steps;
  let html='';
  for(let i=0;i<=curStep;i++){
    html+=`<div class="step ${i===curStep?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].f)}</div></div>`;
  }
  document.getElementById('walkthrough').innerHTML=html;
  document.getElementById('counter').textContent=`${curStep+1} / ${steps.length}`;
  document.getElementById('prev').disabled=curStep===0;
  document.getElementById('next').disabled=curStep===steps.length-1;
}

function drawMain(){
  const p=PROBS[curProb];
  drawBar('bar',p.blocks,p.res,animProg);
  const tot=p.blocks.reduce((a,b)=>a+b.c*SYMV[b.s],0);
  const parts=p.blocks.map(b=>coefLab(b.c,b.s)+' = '+fmt(b.c*SYMV[b.s]));
  document.getElementById('live-calc').innerHTML=
    T('p = \\log_{10} 2 = '+fmt(P)+',\\quad q = \\log_{10} 3 = '+fmt(Q))+'<br>'+
    parts.map(x=>T(x)).join('<br>')+'<br>'+
    T('\\text{合計 } = '+fmt(tot))+'<br>'+
    `<span style="color:var(--c-orange);font-weight:600">${T(p.res)}</span>`;
}

function startAnim(){
  if(animId){cancelAnimationFrame(animId);animId=null;}
  const n=PROBS[curProb].blocks.length;
  const dur=800*n;
  let t0=null;
  function stepFn(ts){
    if(!t0) t0=ts;
    const pr=Math.min((ts-t0)/dur,1);
    const eased=pr<0.5?2*pr*pr:1-Math.pow(-2*pr+2,2)/2;
    animProg=eased*n;
    drawMain();
    if(pr<1) animId=requestAnimationFrame(stepFn);
    else {animId=null;animProg=n;drawMain();}
  }
  animId=requestAnimationFrame(stepFn);
}

function powTex(b,e){
  if(e===0) return '';
  if(e===1) return String(b);
  return b+'^{'+e+'}';
}

function mTex(i,j,k){
  const ps=[powTex(2,i),powTex(3,j),powTex(10,k)].filter(x=>x!=='');
  return ps.length?ps.join('\\cdot '):'1';
}

function valTex(m){
  if(Math.abs(m-Math.round(m))<1e-9) return String(Math.round(m));
  const inv=1/m;
  if(Math.abs(inv-Math.round(inv))<1e-9) return '\\dfrac{1}{'+Math.round(inv)+'}';
  return String(Math.round(m*1e6)/1e6);
}

function drawExplore(){
  const i=parseInt(document.getElementById('i-slider').value,10);
  const j=parseInt(document.getElementById('j-slider').value,10);
  const k=parseInt(document.getElementById('k-slider').value,10);
  document.getElementById('i-value').textContent=i;
  document.getElementById('j-value').textContent=j;
  document.getElementById('k-value').textContent=k;
  const blocks=[];
  if(i!==0) blocks.push({c:i,s:'p'});
  if(j!==0) blocks.push({c:j,s:'q'});
  if(k!==0) blocks.push({c:k,s:'u'});
  const m=Math.pow(2,i)*Math.pow(3,j)*Math.pow(10,k);
  const tot=i*P+j*Q+k;
  const terms=[];
  if(i!==0) terms.push(coefLab(i,'p'));
  if(j!==0) terms.push((j>0&&terms.length?'+':'')+coefLab(j,'q'));
  if(k!==0) terms.push((k>0&&terms.length?'+':'')+coefLab(k,'u'));
  const expr=terms.length?terms.join(''):'0';
  const resLab='\\log_{10} M = '+expr;
  drawBar('bar2',blocks,resLab,blocks.length);
  document.getElementById('live2').innerHTML=
    T('M = '+mTex(i,j,k)+' = '+valTex(m))+'<br>'+
    T('\\log_{10} M = '+expr+' = '+fmt(tot))+'<br>'+
    `<span style="color:var(--c-green);font-weight:600">${T('10^{'+fmt(tot)+'} \\fallingdotseq '+valTex(m)+'\\;\\text{（もとの }M\\text{ に戻ります）}')}</span>`;
}

function init(){
  document.getElementById('f-fac').innerHTML=T('2^i\\cdot 3^j\\cdot 10^k');
  tex('\\log_{10} 2 = p,\\quad \\log_{10} 3 = q,\\quad \\log_{10} 10 = 1',document.getElementById('f-key'),true);
  document.getElementById('f-note').innerHTML=
    '真数に 5 が出てきたら '+T('5 = \\dfrac{10}{2}')+'、25 が出てきたら '+T('25 = \\dfrac{100}{4}')+' と直します。'+
    T('p')+' と '+T('q')+' だけでは 5 を作れないので、'+T('10')+' の対数が 1 であることを使うのが決め手です。';
  document.getElementById('f-lenp').innerHTML=T('p = '+fmt(P));
  document.getElementById('f-lenq').innerHTML=T('q = '+fmt(Q));
  document.getElementById('f-len1').innerHTML=T('1');
  document.getElementById('lg-p').innerHTML=T('p = \\log_{10} 2');
  document.getElementById('lg-q').innerHTML=T('q = \\log_{10} 3');
  document.getElementById('lg-1').innerHTML=T('1 = \\log_{10} 10');
  document.getElementById('f-pq1').innerHTML=T('p,\\;q,\\;1');
  document.getElementById('lbl-i').innerHTML=T('i');
  document.getElementById('lbl-j').innerHTML=T('j');
  document.getElementById('lbl-k').innerHTML=T('k');

  document.getElementById('prev').addEventListener('click',()=>{if(curStep>0){curStep--;renderSteps();}});
  document.getElementById('next').addEventListener('click',()=>{if(curStep<PROBS[curProb].steps.length-1){curStep++;renderSteps();}});
  document.getElementById('anim-btn').addEventListener('click',startAnim);
  ['i-slider','j-slider','k-slider'].forEach(id=>{
    document.getElementById(id).addEventListener('input',drawExplore);
  });

  renderTabs();
  renderSteps();
  drawExplore();
  startAnim();
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
