<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>定積分と微分</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #333; --muted: #888; --accent: #2a6df4;
    --c-red: #d9534f; --c-blue: #2a6df4; --c-green: #28a745; --c-orange: #e67e22; --c-purple: #7b61ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 800px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .75rem; border-left: 4px solid var(--accent); padding-left: .6rem; }
  p { margin: .75rem 0; }

  .formula-box { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; text-align: center; overflow-x: auto; margin: .75rem 0; }
  .formula-box .katex { font-size: 1.2rem; }

  .svg-container { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; margin: .75rem 0; overflow: hidden; touch-action: none; position: relative; }
  .svg-container svg { display: block; width: 100%; height: auto; }
  /* draw() replaces the SVG contents, which would orphan a touch sequence that
     started on a child; keep hit-testing on the wrapper so the drag survives */
  .svg-container > svg { pointer-events: none; }
  /* Chrome sizes KaTeX's radical <svg> to 0 inside <foreignObject>; pin it to its box */
  .svg-container foreignObject .hide-tail > svg { width: 100%; height: 100%; }

  .walkthrough { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; margin: 0 0 .75rem; min-height: 6rem; overflow-x: auto; }
  .step { padding: .75rem .25rem; border-bottom: 1px dashed #eee; animation: fadeIn .3s ease; }
  .step:last-child { border-bottom: none; }
  .step.current { background: #f0f5ff; border-radius: 8px; padding: .75rem; margin: .25rem -.5rem; border-bottom: none; }
  .step .label { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  .step .formula-line { text-align: left; overflow-x: auto; }
  .step .formula-line .katex { font-size: 1.05rem; }
  .step.current .formula-line .katex { font-size: 1.15rem; }

  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1rem 0 0; }
  .btn {
    appearance: none; border: 1px solid #d4dbeb; background: #fff;
    color: var(--accent); font-size: 1rem; font-weight: 600;
    padding: .85rem 1.2rem; border-radius: 10px; cursor: pointer;
    min-height: 48px; min-width: 110px; font-family: inherit; user-select: none;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .step-counter { color: var(--muted); font-size: .9rem; text-align: center; flex: 1; }

  .tabs { display: flex; gap: .5rem; margin: .75rem 0; }
  .tab { appearance: none; flex: 1; border: 1px solid #d4dbeb; background: #fff; color: var(--accent); font-size: .95rem; font-weight: 600; padding: .7rem .5rem; border-radius: 10px; min-height: 48px; cursor: pointer; font-family: inherit; user-select: none; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:active { transform: scale(.97); }

  .note { background: #fffbe6; border: 1px solid #f5e6a3; border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; font-size: .95rem; }
  .live-calc { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 1rem 1.25rem; margin: .75rem 0; text-align: center; overflow-x: auto; }
  .live-calc .katex { font-size: 1.1rem; }
  .live-calc > div { margin: .25rem 0; }
  .drag-hint { text-align: center; color: var(--muted); font-size: .85rem; margin: .25rem 0; }

  .slider-row { display: flex; align-items: center; gap: 1rem; margin: .75rem 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: .75rem 1.25rem; }
  .slider-row > label { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .slider-row > input[type="range"] { flex: 1; min-height: 44px; }
  .slider-row > .slider-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3.5rem; text-align: center; }

  .anim-btn-row { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; margin: .5rem 0; }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; justify-content: center; margin: .5rem 0 0; font-size: .88rem; }
  .legend > span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend > span > i { display: inline-block; width: 22px; height: 4px; border-radius: 2px; font-style: normal; }
  .legend > span > b { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
  .legend > span > u { display: inline-block; width: 18px; height: 13px; border-radius: 3px; text-decoration: none; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<main>
  <h1>定積分と微分</h1>
  <p class="subtitle">上端が動く定積分を微分すると中の関数にもどることを、動く図で確かめましょう。</p>

  <h2>基本の考え方</h2>
  <p>上端が <span id="f-x"></span> の定積分は、<span id="f-x2"></span> の値を決めるたびに 1 つの数が決まるので <span id="f-x3"></span> の関数です。これを <span id="f-x4"></span> で微分すると、中の関数の <span id="f-t"></span> を <span id="f-x5"></span> に置きかえた式にもどります。</p>
  <div class="formula-box" id="f-key"></div>

  <h2>解く問題</h2>
  <div class="formula-box" id="f-problem"></div>

  <h2>解法ウォークスルー</h2>
  <div class="walkthrough" id="walkthrough"></div>
  <div class="controls-row">
    <button class="btn" id="prev" disabled>&larr; 戻る</button>
    <span class="step-counter" id="counter"></span>
    <button class="btn primary" id="next">次へ &rarr;</button>
  </div>

  <h2>動かして確かめよう</h2>
  <div class="tabs">
    <button class="tab active" id="tab1">面積の育ち方</button>
    <button class="tab" id="tab2">幅 h の帯</button>
  </div>
  <p id="mode-desc"></p>

  <div class="slider-row">
    <label><span id="lbl-x"></span> =</label>
    <input type="range" id="x-slider" min="-1.1" max="2.2" step="0.05" value="1.2">
    <span class="slider-val" id="x-value">1.2</span>
  </div>
  <div class="slider-row" id="h-row">
    <label><span id="lbl-h"></span> =</label>
    <input type="range" id="h-slider" min="0.05" max="0.6" step="0.05" value="0.5">
    <span class="slider-val" id="h-value">0.5</span>
  </div>

  <div class="anim-btn-row">
    <button class="btn primary" id="anim-btn">アニメーション</button>
    <button class="btn" id="reset-btn">はじめに戻す</button>
  </div>

  <div class="svg-container" id="svg-wrap">
    <svg id="graph" viewBox="0 0 600 560" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="legend" id="legend"></div>
  <p class="drag-hint" id="drag-hint"></p>

  <div class="live-calc" id="live-calc"></div>
  <div class="note" id="note-box"></div>

  <h2>答え</h2>
  <div class="formula-box" id="result-box"></div>
</main>

<script>
function tex(l,el,dm){katex.render(l,el,{throwOnError:false,displayMode:!!dm});}
function T(l){return katex.renderToString(l,{throwOnError:false});}

function g(x){ return 4*x*x - x + 2; }                        /* the integrand */
function F(x){ return 4/3*x*x*x - 0.5*x*x + 2*x; }            /* its integral from 0 to x */

const W=600,H=560,mL=58,mR=26,PW=W-mL-mR;
const TT=26,TH=248;              /* upper panel: the integrand and the area */
const BT=318,BH=214;             /* lower panel: the area collected as a function */
const XMIN=-1.1,XMAX=2.2;
const YT0=-2.5,YT1=20.5;
const YB0=-5.5,YB1=17;

function pxc(x){ return mL+(x-XMIN)/(XMAX-XMIN)*PW; }
function pyT(y){ return TT+TH-(y-YT0)/(YT1-YT0)*TH; }
function pyB(y){ return BT+BH-(y-YB0)/(YB1-YB0)*BH; }

let mode=1, xVal=1.2, hVal=0.5, animId=null;

function num(v,d){
  if(Math.abs(v)<5e-13) v=0;
  let s=v.toFixed(d);
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  if(s==='-0') s='0';
  return s;
}
function rel(v,d){ return Math.abs(parseFloat(v.toFixed(d))-v)<1e-11 ? '=' : '\\fallingdotseq'; }
function par(v,d){ return v<0 ? '('+num(v,d)+')' : num(v,d); }
function clipLine(m,x0,y0,ymin,ymax){
  const pts=[], yAt=x=>y0+m*(x-x0);
  [XMIN,XMAX].forEach(x=>{ const y=yAt(x); if(y>=ymin-1e-9 && y<=ymax+1e-9) pts.push({x:x,y:y}); });
  if(Math.abs(m)>1e-9){
    [ymin,ymax].forEach(y=>{ const x=x0+(y-y0)/m; if(x>=XMIN-1e-9 && x<=XMAX+1e-9) pts.push({x:x,y:y}); });
  }
  const u=[];
  for(const p of pts){ if(!u.some(q=>Math.abs(q.x-p.x)<1e-7 && Math.abs(q.y-p.y)<1e-7)) u.push(p); }
  return u.length>=2 ? [u[0],u[1]] : null;
}
function clampRun(base,x,val,slope,lo,hi,xmax){
  let run=Math.min(base,xmax-x);
  if(Math.abs(slope)>1e-9) run=Math.min(run,Math.abs((slope>0 ? hi-val : val-lo)/slope));
  return run;
}

function init(){
  const spans={'f-x':'x','f-x2':'x','f-x3':'x','f-x4':'x','f-x5':'x','f-t':'t','lbl-x':'x','lbl-h':'h'};
  for(const id in spans) document.getElementById(id).innerHTML=T(spans[id]);
  tex('\\dfrac{d}{dx}\\int_a^x f(t)dt = f(x)', document.getElementById('f-key'), true);
  tex('f(x)=\\int_0^x (4t^2-t+2)dt \\ \\text{ を微分する}', document.getElementById('f-problem'), true);
  tex("f'(x) = 4x^2-x+2", document.getElementById('result-box'), true);

  initWalkthrough();
  setupTabs();
  setupSliders();
  setupAnim();
  setupDrag();
  applyMode();
}

function initWalkthrough(){
  const steps=[
    { label:'Step 1: 上端が x なので、これは x の関数',      formula:'f(x)=\\int_0^x (4t^2-t+2)dt' },
    { label:'Step 2: 中の関数の原始関数の 1 つを F とおく',  formula:"F'(t)=4t^2-t+2" },
    { label:'Step 3: 定積分を F で書きかえる',               formula:'\\int_0^x (4t^2-t+2)dt = \\Big[F(t)\\Big]_0^x = F(x)-F(0)' },
    { label:'Step 4: F(0) は定数なので微分すると 0',         formula:"f'(x) = \\dfrac{d}{dx}\\{F(x)-F(0)\\} = F'(x)-0" },
    { label:'Step 5: つまり中の関数にもどる',                formula:"f'(x) = 4x^2-x+2" },
    { label:'Step 6: 先に積分してから微分しても同じ',        formula:'\\int_0^x (4t^2-t+2)dt = \\dfrac{4}{3}x^3-\\dfrac{1}{2}x^2+2x' },
    { label:'Step 7: それを微分する',                        formula:"\\left(\\dfrac{4}{3}x^3-\\dfrac{1}{2}x^2+2x\\right)' = 4x^2-x+2" },
    { label:'Step 8: 答え',                                  formula:"f'(x) = 4x^2-x+2" }
  ];
  let cur=0;
  const container=document.getElementById('walkthrough'), counter=document.getElementById('counter');
  const prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
  function render(){
    let html='';
    for(let i=0;i<=cur;i++){
      html+=`<div class="step ${i===cur?'current':''}"><div class="label">${steps[i].label}</div><div class="formula-line">${T(steps[i].formula)}</div></div>`;
    }
    container.innerHTML=html;
    counter.textContent=`${cur+1} / ${steps.length}`;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===steps.length-1;
  }
  prevBtn.addEventListener('click',()=>{ if(cur>0){cur--;render();} });
  nextBtn.addEventListener('click',()=>{ if(cur<steps.length-1){cur++;render();} });
  render();
}

function draw(){
  const x=xVal, h=hVal, gx=g(x), Fx=F(x), Fxh=F(x+h), slope=(Fxh-Fx)/h;
  const HALO2=' stroke="#fff" stroke-width="2.5" paint-order="stroke" stroke-linejoin="round"';
  const FO='font-size:13px;font-weight:600;white-space:nowrap;display:inline-block;background:#fff';
  let s='', ticks='';
  /* the moving marker under the shared axis reserves this box */
  const mark={x:pxc(x)-14,y:pyT(0)+2,w:28,h:22};
  const clear=r=>!(r.x<mark.x+mark.w && mark.x<r.x+r.w && r.y<mark.y+mark.h && mark.y<r.y+r.h);

  /* ---- upper panel ---- */
  s+=`<rect x="${mL}" y="${TT}" width="${PW}" height="${TH}" fill="#fff" stroke="#e3e3e3"/>`;
  for(let i=-1;i<=2;i++) s+=`<line x1="${pxc(i)}" y1="${TT}" x2="${pxc(i)}" y2="${TT+TH}" stroke="${i===0?'#999':'#eee'}" stroke-width="${i===0?1.5:1}"/>`;
  for(let v=0;v<=20;v+=5) s+=`<line x1="${mL}" y1="${pyT(v)}" x2="${mL+PW}" y2="${pyT(v)}" stroke="${v===0?'#999':'#eee'}" stroke-width="${v===0?1.5:1}"/>`;

  /* the signed area from 0 to x: to the left of 0 the direction is reversed, so it counts negative */
  const a=Math.min(0,x), b=Math.max(0,x);
  if(b-a>1e-6){
    let d=`M ${pxc(a)} ${pyT(0)}`;
    for(let i=0;i<=90;i++){ const u=a+(b-a)*i/90; d+=` L ${pxc(u).toFixed(2)} ${pyT(g(u)).toFixed(2)}`; }
    d+=` L ${pxc(b)} ${pyT(0)} Z`;
    s+=`<path d="${d}" fill="${x<0?'rgba(217,83,79,0.20)':'rgba(42,109,244,0.18)'}"/>`;
    if(b-a>0.3) s+=`<foreignObject x="${(pxc(a)+pxc(b))/2-13}" y="${pyT(0)-40}" width="26" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:16px;font-weight:700;text-align:center;color:${x<0?'#d9534f':'#2a6df4'}">${x<0?'−':'＋'}</div></foreignObject>`;
  }
  /* mode 2: the strip of width h and the rectangle of height g(x) that approximates it */
  if(mode===2){
    let d2=`M ${pxc(x)} ${pyT(0)}`;
    for(let i=0;i<=40;i++){ const u=x+h*i/40; d2+=` L ${pxc(u).toFixed(2)} ${pyT(g(u)).toFixed(2)}`; }
    d2+=` L ${pxc(x+h)} ${pyT(0)} Z`;
    s+=`<path d="${d2}" fill="rgba(230,126,34,0.30)"/>`;
    s+=`<rect x="${pxc(x)}" y="${pyT(gx)}" width="${pxc(x+h)-pxc(x)}" height="${pyT(0)-pyT(gx)}" fill="none" stroke="var(--c-orange)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  }
  let dc='';
  for(let i=0;i<=240;i++){ const u=XMIN+(XMAX-XMIN)*i/240; dc+=(i===0?'M':'L')+` ${pxc(u).toFixed(2)} ${pyT(g(u)).toFixed(2)}`; }
  s+=`<path d="${dc}" fill="none" stroke="var(--c-purple)" stroke-width="2.5"/>`;
  /* the height of the curve at x is what the lower panel's slope has to match */
  s+=`<line x1="${pxc(x)}" y1="${pyT(0)}" x2="${pxc(x)}" y2="${pyT(gx)}" stroke="var(--c-orange)" stroke-width="3.5"/>`;
  s+=`<circle cx="${pxc(x)}" cy="${pyT(gx)}" r="7" fill="var(--c-orange)" stroke="#fff" stroke-width="2.5"><animate attributeName="r" values="7;10;7" dur="1.6s" repeatCount="indefinite"/></circle>`;

  for(let i=-1;i<=2;i++){ if(i===0) continue; if(clear({x:pxc(i)-5,y:pyT(0)+6,w:10,h:14})) ticks+=`<text x="${pxc(i)}" y="${pyT(0)+16}" text-anchor="middle" font-size="11" fill="#aaa"${HALO2}>${i}</text>`; }
  for(let v=5;v<=20;v+=5) ticks+=`<text x="${mL-8}" y="${pyT(v)+4}" text-anchor="end" font-size="11" fill="#aaa"${HALO2}>${v}</text>`;
  s+=ticks;
  s+=`<foreignObject x="${mL+8}" y="${TT+4}" width="180" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="${FO};color:#7b61ff">${T('y=4t^2-t+2')}</div></foreignObject>`;
  s+=`<foreignObject x="${mL+PW-30}" y="${pyT(0)-26}" width="30" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${FO};color:#999">${T('t')}</div></foreignObject>`;
  const LW=146, hx=pxc(x)+12, flip=hx+LW>mL+PW;
  s+=`<foreignObject x="${flip?pxc(x)-12-LW:hx}" y="${Math.max(TT+2,pyT(gx)-30)}" width="${LW}" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="${FO};color:#e67e22;text-align:${flip?'right':'left'}">${T('4x^2-x+2='+num(gx,3))}</div></foreignObject>`;
  s+=`<foreignObject x="${mark.x}" y="${mark.y}" width="28" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;color:#e67e22;font-weight:700;text-align:center;background:#fff;border-radius:4px">${T('x')}</div></foreignObject>`;

  /* ---- the two panels share the position of x ---- */
  s+=`<line x1="${pxc(x)}" y1="${TT+TH}" x2="${pxc(x)}" y2="${BT}" stroke="#c9d3e8" stroke-width="1.5" stroke-dasharray="5 5"/>`;

  /* ---- lower panel ---- */
  s+=`<rect x="${mL}" y="${BT}" width="${PW}" height="${BH}" fill="#fff" stroke="#e3e3e3"/>`;
  for(let i=-1;i<=2;i++) s+=`<line x1="${pxc(i)}" y1="${BT}" x2="${pxc(i)}" y2="${BT+BH}" stroke="${i===0?'#999':'#eee'}" stroke-width="${i===0?1.5:1}"/>`;
  for(let v=-5;v<=15;v+=5) s+=`<line x1="${mL}" y1="${pyB(v)}" x2="${mL+PW}" y2="${pyB(v)}" stroke="${v===0?'#999':'#eee'}" stroke-width="${v===0?1.5:1}"/>`;
  let df='';
  for(let i=0;i<=240;i++){ const u=XMIN+(XMAX-XMIN)*i/240; df+=(i===0?'M':'L')+` ${pxc(u).toFixed(2)} ${pyB(F(u)).toFixed(2)}`; }
  s+=`<path d="${df}" fill="none" stroke="#d8e6dc" stroke-width="2.5"/>`;
  let dg='';
  for(let i=0;i<=120;i++){ const u=a+(b-a)*i/120; dg+=(i===0?'M':'L')+` ${pxc(u).toFixed(2)} ${pyB(F(u)).toFixed(2)}`; }
  if(b-a>1e-6) s+=`<path d="${dg}" fill="none" stroke="var(--c-green)" stroke-width="3.5"/>`;

  if(mode===2){
    s+=`<line x1="${pxc(x)}" y1="${pyB(Fx)}" x2="${pxc(x+h)}" y2="${pyB(Fx)}" stroke="var(--c-blue)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    s+=`<line x1="${pxc(x+h)}" y1="${pyB(Fx)}" x2="${pxc(x+h)}" y2="${pyB(Fxh)}" stroke="var(--c-blue)" stroke-width="3.5"/>`;
    const sec=clipLine(slope,x,Fx,YB0,YB1);
    if(sec) s+=`<line x1="${pxc(sec[0].x)}" y1="${pyB(sec[0].y)}" x2="${pxc(sec[1].x)}" y2="${pyB(sec[1].y)}" stroke="var(--c-blue)" stroke-width="2"/>`;
    s+=`<circle cx="${pxc(x+h)}" cy="${pyB(Fxh)}" r="6" fill="var(--c-blue)" stroke="#fff" stroke-width="2"/>`;
  }
  const tan=clipLine(gx,x,Fx,YB0,YB1);
  if(tan) s+=`<line x1="${pxc(tan[0].x)}" y1="${pyB(tan[0].y)}" x2="${pxc(tan[1].x)}" y2="${pyB(tan[1].y)}" stroke="var(--c-orange)" stroke-width="3"/>`;
  const run=clampRun(0.45,x,Fx,gx,YB0,YB1,XMAX);
  if(run>0.04){
    s+=`<path d="M ${pxc(x)} ${pyB(Fx)} L ${pxc(x+run)} ${pyB(Fx)} L ${pxc(x+run)} ${pyB(Fx+gx*run)} Z" fill="rgba(230,126,34,0.16)" stroke="var(--c-orange)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  }
  let tickB='';
  for(let i=-1;i<=2;i++){ if(i===0) continue; tickB+=`<text x="${pxc(i)}" y="${pyB(0)+16}" text-anchor="middle" font-size="11" fill="#aaa"${HALO2}>${i}</text>`; }
  for(let v=-5;v<=15;v+=5){ if(v===0) continue; tickB+=`<text x="${mL-8}" y="${pyB(v)+4}" text-anchor="end" font-size="11" fill="#aaa"${HALO2}>${v}</text>`; }
  s+=tickB;
  s+=`<circle cx="${pxc(x)}" cy="${pyB(Fx)}" r="8" fill="var(--c-green)" stroke="#fff" stroke-width="2.5"/>`;
  s+=`<circle cx="${pxc(x)}" cy="${pyB(Fx)}" r="8" fill="none" stroke="var(--c-green)" stroke-width="2" opacity="0.5"><animate attributeName="r" values="8;15;8" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="1.8s" repeatCount="indefinite"/></circle>`;
  s+=`<foreignObject x="${mL+8}" y="${BT+4}" width="150" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="${FO};color:#28a745">${T('y=f(x)')}</div></foreignObject>`;
  s+=`<foreignObject x="${mL+PW-30}" y="${pyB(0)-26}" width="30" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="${FO};color:#999">${T('x')}</div></foreignObject>`;

  document.getElementById('graph').innerHTML=s;

  let lc=`<div style="color:var(--fg)">${T('x '+rel(x,3)+' '+num(x,3))}</div>`+
    `<div style="color:var(--c-green)">${T('f('+num(x,3)+') = \\int_0^{'+num(x,3)+'} (4t^2-t+2)dt '+rel(Fx,3)+' '+num(Fx,3))}</div>`;
  if(mode===2){
    lc+=`<div style="color:var(--c-blue)">${T('\\dfrac{f(x+h)-f(x)}{h} '+rel(slope,3)+' '+num(slope,3))}</div>`+
        `<div style="color:var(--c-orange)">${T('4x^2-x+2 = 4\\cdot '+par(x,3)+'^2-'+par(x,3)+'+2 '+rel(gx,3)+' '+num(gx,3))}</div>`+
        `<div style="color:var(--muted)">${T('h')} を小さくすると 2 つの値は近づきます（ちがい ${T(rel(slope-gx,3)+' '+num(Math.abs(slope-gx),3))}）</div>`;
  } else {
    lc+=`<div style="color:var(--c-orange)">${T("f'("+num(x,3)+")")} は上の図の高さ ${T('4x^2-x+2 '+rel(gx,3)+' '+num(gx,3))}</div>`+
        `<div style="color:var(--c-orange)">${T("f'("+num(x,3)+")")} は下の図の接線の傾き ${T(rel(gx,3)+' '+num(gx,3))}</div>`+
        `<div style="color:var(--c-green);font-weight:700">2 つは いつでも同じ値です</div>`;
  }
  document.getElementById('live-calc').innerHTML=lc;
}

function setX(v){
  const sl=document.getElementById('x-slider');
  xVal=Math.round(Math.max(parseFloat(sl.min),Math.min(parseFloat(sl.max),v))*20)/20;
  sl.value=xVal;
  document.getElementById('x-value').textContent=num(xVal,2);
  draw();
}
function setH(v){
  hVal=Math.round(Math.max(0.05,Math.min(0.6,v))*20)/20;
  document.getElementById('h-slider').value=hVal;
  document.getElementById('h-value').textContent=num(hVal,2);
  draw();
}

function applyMode(){
  document.getElementById('tab1').classList.toggle('active',mode===1);
  document.getElementById('tab2').classList.toggle('active',mode===2);
  document.getElementById('h-row').style.display = mode===2 ? 'flex' : 'none';
  const sl=document.getElementById('x-slider');
  sl.min = mode===1 ? -1.1 : -1;
  sl.max = mode===1 ? 2.2 : 1.6;
  document.getElementById('anim-btn').textContent = mode===1 ? 'x を動かす' : 'h を 0 に近づける';
  if(mode===1){
    document.getElementById('mode-desc').innerHTML=
      '上の図の色のついた面積が、そのまま下の図の高さ '+T('f(x)')+' になります。'+T('x')+
      ' を動かすと、面積の増え方の速さが下の図の接線の傾きです。';
    document.getElementById('legend').innerHTML=
      '<span><i style="background:var(--c-purple)"></i>'+T('y=4t^2-t+2')+'</span>'+
      '<span><u style="background:rgba(42,109,244,0.35)"></u>'+T('0')+' から '+T('x')+' までの面積</span>'+
      '<span><u style="background:rgba(217,83,79,0.35)"></u>向きが逆なので負</span>'+
      '<span><i style="background:var(--c-green)"></i>'+T('y=f(x)')+'</span>'+
      '<span><i style="background:var(--c-orange)"></i>点 '+T('(x,\\ f(x))')+' の接線</span>';
    document.getElementById('note-box').innerHTML=
      '上の図のオレンジの縦棒の長さと、下の図の接線の傾きは、'+T('x')+
      ' をどこに置いてもぴったり同じ数です。これが '+T("\\frac{d}{dx}\\int_0^x (4t^2-t+2)dt = 4x^2-x+2")+' ということです。';
  } else {
    document.getElementById('mode-desc').innerHTML=
      T('x')+' から '+T('x+h')+' までの細い帯の面積が '+T('f(x+h)-f(x)')+' です。帯は高さ '+
      T('4x^2-x+2')+'、幅 '+T('h')+' の長方形にほぼ等しいので、面積を '+T('h')+
      ' で割るとその高さにもどります。';
    document.getElementById('legend').innerHTML=
      '<span><i style="background:var(--c-purple)"></i>'+T('y=4t^2-t+2')+'</span>'+
      '<span><u style="background:rgba(230,126,34,0.5)"></u>幅 '+T('h')+' の帯</span>'+
      '<span><i style="background:var(--c-blue)"></i>2 点を通る直線（傾き '+T('\\frac{f(x+h)-f(x)}{h}')+'）</span>'+
      '<span><i style="background:var(--c-orange)"></i>点 '+T('(x,\\ f(x))')+' の接線</span>';
    document.getElementById('note-box').innerHTML=
      '帯の面積を '+T('h')+' で割った値は、'+T('h')+
      ' を小さくするほど帯の高さ '+T('4x^2-x+2')+' に近づきます。これが微分すると中の関数にもどる理由です。';
  }
  document.getElementById('drag-hint').innerHTML='図を横にドラッグするか、スライダーで '+T('x')+' を変えましょう。';
  setX(mode===1 ? 1.2 : 0.8);
  setH(0.5);
}

function setupTabs(){
  document.getElementById('tab1').addEventListener('click',()=>{ stopAnim(); mode=1; applyMode(); });
  document.getElementById('tab2').addEventListener('click',()=>{ stopAnim(); mode=2; applyMode(); });
}
function setupSliders(){
  document.getElementById('x-slider').addEventListener('input',e=>{ stopAnim(); setX(parseFloat(e.target.value)); });
  document.getElementById('h-slider').addEventListener('input',e=>{ stopAnim(); setH(parseFloat(e.target.value)); });
}
function stopAnim(){ if(animId){ cancelAnimationFrame(animId); animId=null; } }
function setupAnim(){
  document.getElementById('anim-btn').addEventListener('click',()=>{
    const sl=document.getElementById('x-slider');
    if(mode===1) sweep('x',parseFloat(sl.min),parseFloat(sl.max),3800);
    else sweep('h',0.6,0.05,2800);
  });
  document.getElementById('reset-btn').addEventListener('click',()=>{ stopAnim(); setX(mode===1?1.2:0.8); setH(0.5); });
}
function sweep(what,from,to,duration){
  stopAnim();
  if(what==='x') setX(from); else setH(from);
  let t0=null;
  function frame(ts){
    if(!t0) t0=ts;
    const pr=Math.min((ts-t0)/duration,1);
    const eased=pr<0.5 ? 2*pr*pr : 1-Math.pow(-2*pr+2,2)/2;
    const v=from+(to-from)*eased;
    if(what==='x') setX(v); else setH(v);
    animId = pr<1 ? requestAnimationFrame(frame) : null;
  }
  animId=requestAnimationFrame(frame);
}

function setupDrag(){
  const svg=document.getElementById('graph');
  const wrap=document.getElementById('svg-wrap');
  let dragging=false;

  function toSvg(cx,cy){
    const rect=svg.getBoundingClientRect();
    return { x:(cx-rect.left)/rect.width*W, y:(cy-rect.top)/rect.height*H };
  }
  function xAt(pt){ return XMIN+(pt.x-mL)/PW*(XMAX-XMIN); }
  function startDrag(cx,cy){
    const pt=toSvg(cx,cy);
    if(pt.y<TT-14 || pt.y>BT+BH+14) return;
    stopAnim();
    dragging=true;
    setX(xAt(pt));
  }
  function moveDrag(cx,cy){ if(dragging) setX(xAt(toSvg(cx,cy))); }
  function endDrag(){ dragging=false; }

  wrap.addEventListener('mousedown', e => { e.preventDefault(); startDrag(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { if(dragging){ e.preventDefault(); moveDrag(e.clientX, e.clientY); } });
  window.addEventListener('mouseup', endDrag);

  wrap.addEventListener('touchstart', e => { const t=e.touches[0]; startDrag(t.clientX, t.clientY); }, {passive:true});
  wrap.addEventListener('touchmove', e => { if(dragging){ e.preventDefault(); const t=e.touches[0]; moveDrag(t.clientX, t.clientY); } }, {passive:false});
  wrap.addEventListener('touchend', endDrag);
  wrap.addEventListener('touchcancel', endDrag);
}

if(window.katex)init();else window.addEventListener("DOMContentLoaded",()=>{
  if(window.katex)init();
  else{const w=setInterval(()=>{if(window.katex){clearInterval(w);init();}},30);}
});
</script>
